
<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
body { font-family: Arial; background:#020617; color:white; }
.container { padding:20px; }
.card { background:#1e293b; padding:20px; margin:10px; border-radius:10px; }
button { padding:10px; background:#ef4444; color:white; border:none; cursor:pointer; }
</style>
</head>
<body>

<div class="container">
<h2>Admin Dashboard 🔐</h2>
<button onclick="logout()">Logout</button>

<div class="card">
<h3>Total Channels</h3>
<p>20,000+</p>
</div>

<div class="card">
<h3>User Control</h3>
<p>Manage users, subscriptions, and pay-to-view channels</p>
</div>

<div class="card">
<h3>System Status</h3>
<p>🟢 Online Streaming Active</p>
</div>
</div>

<script>
if(localStorage.getItem("role") !== "admin") {
    window.location.href = "login.html";
}

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH TV Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-container">
<aside class="sidebar">
<h2>BTECH TV</h2>
<ul>
<li class="active">Dashboard</li>
<li>Upload Videos</li>
<li>Channels</li>
<li>Users</li>
<li>Settings</li>
</ul>
</aside>

<main class="dashboard-main">
<header class="dashboard-header">
<h1>Admin Dashboard</h1>
</header>

<section class="admin-panel">
<h2>Upload New Video</h2>

<form id="uploadForm">
<input type="file" id="video" required>
<button type="submit">Upload Video</button>
</form>

<p id="status"></p>
</section>
</main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
