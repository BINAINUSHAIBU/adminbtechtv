<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Login</title>
<style>
body { font-family: Arial; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; }
.login-box { background:#1e293b; padding:30px; border-radius:12px; width:300px; }
input { width:100%; padding:10px; margin:10px 0; border:none; border-radius:6px; }
button { width:100%; padding:10px; background:#22c55e; border:none; color:white; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<div class="login-box">
<h2>Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    // Demo roles
    if(user === "admin" && pass === "admin123") {
        localStorage.setItem("role", "admin");
        window.location.href = "index.html";
    } 
    else if(user === "user" && pass === "user123") {
        localStorage.setItem("role", "user");
        window.location.href = "User_Dashboard.html";
    } 
    else {
        document.getElementById("msg").innerText = "Invalid login!";
    }
}
</script>

</body>
</html>
