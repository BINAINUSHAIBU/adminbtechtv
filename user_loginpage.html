<!DOCTYPE html>
<html>
<head>
  <title>Channel Dashboard</title>
  <style>
    body { font-family: Arial; background:#0b1220; color:white; }
    .topbar { padding:15px; background:#111827; display:flex; justify-content:space-between; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:20px; }

    .card {
      background:#1f2937;
      padding:15px;
      border-radius:10px;
    }

    .free { color:#22c55e; }
    .paid { color:#f59e0b; }
    .locked { color:#ef4444; }

    button {
      padding:8px;
      width:100%;
      border:none;
      margin-top:10px;
      cursor:pointer;
      background:#3b82f6;
      color:white;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div>Welcome, <span id="user"></span></div>
  <button onclick="logout()">Logout</button>
</div>

<h2 style="padding:20px;">📡 All Channels Dashboard</h2>

<div class="grid" id="channels"></div>

<script>
document.getElementById("user").innerText = localStorage.getItem("user");

let channels = [
  {name:"BBC News", type:"Free"},
  {name:"ESPN Sports", type:"Paid"},
  {name:"Netflix Movies", type:"Locked"},
  {name:"Kids TV", type:"Free"},
  {name:"Premium Sports HD", type:"Paid"},
  {name:"Music Live", type:"Locked"}
];

function loadChannels(){
  let box = document.getElementById("channels");
  box.innerHTML = "";

  channels.forEach((c, i) => {
    let statusClass = c.type.toLowerCase();

    let locked = c.type === "Locked" ? true : false;

    box.innerHTML += `
      <div class="card">
        <h3>${c.name}</h3>
        <p class="${statusClass}">${c.type}</p>
        ${locked ? `<button onclick="unlock(${i})">🔓 Pay to Unlock</button>` : `<button onclick="watch(${i})">▶ Watch</button>`}
      </div>
    `;
  });
}

function unlock(i){
  alert("Payment gateway coming soon (Paystack/Flutterwave integration)");
  channels[i].type = "Paid";
  loadChannels();
}

function watch(i){
  alert("Now playing: " + channels[i].name);
}

function logout(){
  localStorage.removeItem("user");
  window.location.href = "index.html";
}

loadChannels();
</script>

</body>
</html>
