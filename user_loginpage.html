<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}
header {
  background: #2a5298;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}
.container {
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  margin: 10px;
  border-radius: 10px;
  display: inline-block;
  width: 200px;
}
button {
  padding: 8px 12px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h2>Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">
  <h3 id="welcome"></h3>

  <div class="card">
    <h4>Total Channels</h4>
    <p>20,000+</p>
  </div>

  <div class="card">
    <h4>Free Channels</h4>
    <p>5,000</p>
  </div>

  <div class="card">
    <h4>Premium Channels</h4>
    <p>15,000</p>
  </div>
</div>

<script>
// Check login
const user = localStorage.getItem("user");
if(!user){
  window.location.href = "index.html";
}
document.getElementById("welcome").innerText = "Welcome, " + user;

function logout(){
  localStorage.removeItem("user");
  window.location.href = "index.html";
}
</script>

</body>
</html>
