<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV LOCKED CHANNELS DASHBOARD</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
--danger:#dc2626;
--success:#00ff99;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:var(--text);
}

.header{
padding:20px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.header h2{
color:var(--accent);
}

.stats{
display:flex;
gap:15px;
}

.stat{
background:var(--card);
padding:10px 15px;
border-radius:10px;
text-align:center;
}

.stat h4{
font-size:12px;
color:var(--muted);
}

.stat p{
font-size:18px;
color:var(--accent);
font-weight:bold;
}

.container{
padding:20px;
}

.search{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:var(--panel);
color:white;
margin-bottom:15px;
outline:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:15px;
}

.card{
background:var(--card);
padding:15px;
border-radius:12px;
border:1px solid #222;
}

.card h3{
margin-bottom:5px;
}

.meta{
font-size:13px;
color:var(--muted);
margin-bottom:10px;
}

.badge{
padding:4px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.locked{
background:#f59e0b;
color:#000;
}

.paid{
background:#dc2626;
}

.free{
background:#16a34a;
}

.btns{
display:flex;
gap:10px;
margin-top:10px;
}

button{
flex:1;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.unlock{
background:var(--success);
color:#000;
}

.delete{
background:var(--danger);
color:#fff;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">
<h2>🔒 Locked Channels Dashboard</h2>

<div class="stats">
<div class="stat">
<h4>Total Locked</h4>
<p id="totalLocked">0</p>
</div>

<div class="stat">
<h4>Paid Locked</h4>
<p id="paidLocked">0</p>
</div>

<div class="stat">
<h4>Free Locked</h4>
<p id="freeLocked">0</p>
</div>
</div>
</div>

<div class="container">

<input
class="search"
placeholder="Search locked channels..."
oninput="render(this.value)"
/>

<div class="grid" id="grid"></div>

</div>

<script>

let channels = [];

/* =========================
LOAD FROM MAIN APP
========================= */
function loadData(){

const saved = localStorage.getItem("channels");

if(saved){
channels = JSON.parse(saved);
} else {
channels = generateDemoLocked();
save();
}

render();
}

/* =========================
DEMO DATA
========================= */
function generateDemoLocked(){

let arr=[];

for(let i=1;i<=50;i++){

arr.push({
id:i,
name:"Locked Channel "+i,
category:i%2===0?"Sports":"Movies",
status:"locked",
type:i%3===0?"paid":"free",
viewers:Math.floor(Math.random()*50000)
});

}

return arr;
}

/* =========================
SAVE
========================= */
function save(){
localStorage.setItem("channels",JSON.stringify(channels));
}

/* =========================
RENDER
========================= */
function render(search=""){

const grid=document.getElementById("grid");

grid.innerHTML="";

let locked = channels.filter(c=>c.status==="locked");

if(search){

locked = locked.filter(c=>
c.name.toLowerCase().includes(search.toLowerCase()) ||
c.category.toLowerCase().includes(search.toLowerCase())
);

}

document.getElementById("totalLocked").innerText =
channels.filter(c=>c.status==="locked").length;

document.getElementById("paidLocked").innerText =
channels.filter(c=>c.status==="locked" && c.type==="paid").length;

document.getElementById("freeLocked").innerText =
channels.filter(c=>c.status==="locked" && c.type==="free").length;

locked.forEach(ch=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>${ch.name}</h3>

<div class="meta">
${ch.category} • 👥 ${ch.viewers}
</div>

<span class="badge locked">LOCKED</span>
<span class="badge ${ch.type}">${ch.type.toUpperCase()}</span>

<div class="btns">

<button class="unlock" onclick="unlockChannel(${ch.id})">
🔓 Unlock
</button>

<button class="delete" onclick="deleteChannel(${ch.id})">
🗑 Delete
</button>

</div>
`;

grid.appendChild(div);

});

}

/* =========================
UNLOCK CHANNEL
========================= */
function unlockChannel(id){

channels = channels.map(c=>{
if(c.id===id){
c.status="unlocked";
}
return c;
});

save();
render();
}

/* =========================
DELETE CHANNEL
========================= */
function deleteChannel(id){

channels = channels.filter(c=>c.id!==id);

save();
render();
}

loadData();

</script>

</body>
</html>
