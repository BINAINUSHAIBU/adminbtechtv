<!-- =========================================
BTECH-TV PRO 100K SUPER ADMIN DASHBOARD
MERGED ULTRA ENGINE + SUPER ADMIN PANEL
FULL MERGED VERSION (CLEAN FORMAT)
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO 100K SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================
ROOT
========================================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
}

/* =========================================
GLOBAL
========================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
cursor:pointer;
border:none;
}

/* =========================================
TOPBAR
========================================= */

.topbar{
height:70px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.06);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

.top-links{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.top-links button{
padding:10px 15px;
border-radius:10px;
background:var(--card);
color:white;
font-weight:bold;
transition:.3s;
}

.top-links button:hover,
.top-links button.active{
background:var(--accent);
color:black;
}

/* =========================================
LAYOUT
========================================= */

.container{
display:flex;
height:calc(100vh - 70px);
}

/* =========================================
SIDEBAR
========================================= */

.sidebar{
width:270px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin-bottom:15px;
color:var(--accent);
}

.cat{
padding:12px;
background:var(--card);
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

.sidebar a{
text-decoration:none;
color:white;
}

/* =========================================
MAIN
========================================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================================
PLAYER
========================================= */

.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

/* =========================================
CHANNELS
========================================= */

.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
border:1px solid var(--accent);
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
}

.free{background:var(--success);}
.paid{background:var(--danger);}
.locked{background:var(--warning);color:black;}
.unlocked{background:#2563eb;}

/* =========================================
ADMIN PANEL
========================================= */

.admin-panel{
width:340px;
background:var(--panel);
padding:15px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,.05);
}

.panel-card{
background:var(--card);
padding:15px;
border-radius:14px;
margin-bottom:15px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#0f1628;
padding:12px;
border-radius:10px;
text-align:center;
}

.stat p{
font-size:20px;
color:var(--accent);
}

/* =========================================
RESPONSIVE
========================================= */

@media(max-width:1100px){
.sidebar,.admin-panel{display:none;}
.channels{grid-template-columns:1fr;}
.player{height:250px;}
.top-links{display:none;}
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH-TV PRO ULTRA MAX</div>

<div class="top-links">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Sports',this)">Sports</button>
<button onclick="filterCat('Movies',this)">Movies</button>
<button onclick="filterCat('News',this)">News</button>
<button onclick="filterLocked(this)">Locked</button>
</div>
</div>

<!-- CONTAINER -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>⚙ MENU</h3>

<div class="cat" onclick="filterCat('All')">📺 All Channels</div>
<div class="cat" onclick="filterCat('Sports')">🏆 Sports</div>
<div class="cat" onclick="filterCat('Movies')">🎬 Movies</div>
<div class="cat" onclick="filterCat('News')">📰 News</div>

<a href="#">🔒 Locked Channels</a>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live-badge">🔴 LIVE</div>
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- ADMIN PANEL -->
<div class="admin-panel">

<div class="panel-card">
<h3>📊 STATS</h3>
<div class="stats-grid">
<div class="stat"><p id="total">0</p></div>
<div class="stat"><p id="locked">0</p></div>
</div>
</div>

<div class="panel-card">
<h3>🔒 LOCKED CONTROL</h3>

<button onclick="filterLocked()" class="action-btn">View Locked</button>
<button onclick="unlockAll()" class="action-btn">Unlock All</button>
<button onclick="deleteLocked()" class="action-btn">Delete Locked</button>

</div>

</div>

</div>

<script>

/* ENGINE */
let channels=[];
let filteredChannels=[];
let currentIndex=0;

/* FILTER LOCKED */
function filterLocked(){
filteredChannels = channels.filter(c=>c.status==="locked");
render();
}

/* UNLOCK ALL */
function unlockAll(){
channels.forEach(c=>c.status="unlocked");
render();
updateStats();
}

/* DELETE LOCKED */
function deleteLocked(){
channels = channels.filter(c=>c.status!=="locked");
filteredChannels=[...channels];
render();
updateStats();
}

/* STATS */
function updateStats(){
document.getElementById("total").innerText=channels.length;
document.getElementById("locked").innerText=channels.filter(c=>c.status==="locked").length;
}

/* RENDER */
function render(){
const box=document.getElementById("channelList");
box.innerHTML="";

filteredChannels.forEach((c,i)=>{
const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>

<div>
<span class="badge ${c.status}">${c.status}</span>
</div>
`;

box.appendChild(div);
});
}

/* INIT SAMPLE DATA */
channels=[
{name:"Sports Live 1",category:"Sports",status:"locked"},
{name:"Movie HD",category:"Movies",status:"unlocked"},
{name:"News 24",category:"News",status:"locked"}
];

filteredChannels=[...channels];
render();
updateStats();

</script>

</body>
</html>
