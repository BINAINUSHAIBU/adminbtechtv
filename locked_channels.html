<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV CHANNEL CONTROL DASHBOARD</title>

<style>
:root{
  --bg:#0b0f1a;
  --panel:#11182a;
  --card:#1b2438;
  --accent:#00bfff;
  --text:#fff;
  --muted:#94a3b8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* TOP BAR */
.topbar{
  height:60px;
  background:var(--panel);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.topbar h2{
  color:var(--accent);
}

/* LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT PANEL */
.sidebar{
  width:280px;
  background:#0f1628;
  padding:15px;
  overflow:auto;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:var(--card);
  color:white;
  cursor:pointer;
}

.btn:hover{
  background:var(--accent);
  color:black;
}

/* MAIN */
.main{
  flex:1;
  padding:15px;
  overflow:auto;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.stat h3{
  color:var(--muted);
  font-size:12px;
}

.stat p{
  font-size:20px;
  margin-top:5px;
  color:var(--accent);
}

/* FORM */
.form{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#0f1628;
  color:white;
}

/* CHANNEL LIST */
.list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:10px;
}

.card{
  background:var(--card);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
}

.card:hover{
  border-color:var(--accent);
}

.card h4{
  margin-bottom:5px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  margin-right:5px;
}

.locked{background:#f59e0b;}
.unlocked{background:#22c55e;}

.actions{
  margin-top:10px;
  display:flex;
  gap:5px;
}

.smallbtn{
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.lockBtn{background:#f59e0b;}
.unlockBtn{background:#22c55e;}
.deleteBtn{background:#ef4444;color:white;}

.filterbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.filterbar button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
  background:var(--card);
  color:white;
  cursor:pointer;
}

.filterbar button.active{
  background:var(--accent);
  color:black;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>📺 BTECH-TV CONTROL PANEL</h2>
  <div>Channel Admin Dashboard</div>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3>⚙ Actions</h3>

    <button class="btn" onclick="generateChannels()">Generate Channels</button>
    <button class="btn" onclick="clearLocked()">Delete Locked</button>
    <button class="btn" onclick="resetAll()">Reset All</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <h3>Total</h3>
        <p id="total">0</p>
      </div>
      <div class="stat">
        <h3>Locked</h3>
        <p id="locked">0</p>
      </div>
      <div class="stat">
        <h3>Unlocked</h3>
        <p id="unlocked">0</p>
      </div>
    </div>

    <!-- ADD CHANNEL -->
    <div class="form">
      <h3>Add Channel</h3>
      <input id="name" placeholder="Channel Name">
      <input id="category" placeholder="Category">
      <button class="btn" onclick="addChannel()">Add Channel</button>
    </div>

    <!-- FILTER -->
    <div class="filterbar">
      <button class="active" onclick="setFilter('all',this)">All</button>
      <button onclick="setFilter('locked',this)">Locked</button>
      <button onclick="setFilter('unlocked',this)">Unlocked</button>
    </div>

    <!-- LIST -->
    <div class="list" id="list"></div>

  </div>

</div>

<script>

let channels = [];
let filter = "all";

function generateChannels(){
  channels = [];

  for(let i=1;i<=50;i++){
    channels.push({
      id:i,
      name:"BTECH Channel "+i,
      category:i%2===0?"Sports":"Movies",
      locked:i%5===0
    });
  }

  render();
}

function addChannel(){
  const name = document.getElementById("name").value;
  const category = document.getElementById("category").value;

  if(!name) return;

  channels.push({
    id:Date.now(),
    name,
    category,
    locked:false
  });

  document.getElementById("name").value="";
  document.getElementById("category").value="";

  render();
}

function toggleLock(id){
  channels = channels.map(c=>{
    if(c.id===id){
      c.locked = !c.locked;
    }
    return c;
  });

  render();
}

function deleteChannel(id){
  channels = channels.filter(c=>c.id!==id);
  render();
}

function clearLocked(){
  channels = channels.filter(c=>!c.locked);
  render();
}

function resetAll(){
  channels = [];
  render();
}

function setFilter(type,btn){
  filter = type;

  document.querySelectorAll(".filterbar button")
  .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  render();
}

function render(){

let list = document.getElementById("list");
list.innerHTML = "";

let data = channels;

if(filter==="locked"){
  data = channels.filter(c=>c.locked);
}
if(filter==="unlocked"){
  data = channels.filter(c=>!c.locked);
}

data.forEach(c=>{

let div = document.createElement("div");
div.className="card";

div.innerHTML=`
  <h4>${c.name}</h4>
  <small>${c.category}</small>
  <div style="margin-top:8px;">
    <span class="badge ${c.locked?'locked':'unlocked'}">
      ${c.locked?'Locked':'Unlocked'}
    </span>
  </div>

  <div class="actions">
    <button class="smallbtn lockBtn" onclick="toggleLock(${c.id})">Lock</button>
    <button class="smallbtn unlockBtn" onclick="toggleLock(${c.id})">Unlock</button>
    <button class="smallbtn deleteBtn" onclick="deleteChannel(${c.id})">Delete</button>
  </div>
`;

list.appendChild(div);

});

updateStats();

}

function updateStats(){
  document.getElementById("total").innerText = channels.length;
  document.getElementById("locked").innerText = channels.filter(c=>c.locked).length;
  document.getElementById("unlocked").innerText = channels.filter(c=>!c.locked).length;
}

generateChannels();

</script>

</body>
</html>
