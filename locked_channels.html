<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO ULTRA LOCKED ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* ================= ROOT ================= */
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
--danger:#dc2626;
--success:#00ff99;
--warning:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* ================= TOPBAR ================= */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #222;
}

.topbar h2{color:var(--accent);}

.top-links{
display:flex;
gap:10px;
}

.top-links button{
padding:10px 14px;
border:none;
border-radius:8px;
background:var(--card);
color:#fff;
cursor:pointer;
}

.top-links button.active,
.top-links button:hover{
background:var(--accent);
color:#000;
}

/* ================= LAYOUT ================= */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* ================= SIDEBAR ================= */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid #222;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* ================= MAIN ================= */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* ================= PLAYER ================= */
.player{
height:320px;
background:#000;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

/* ================= CHANNELS ================= */
.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.channel:hover{
background:var(--hover);
}

.badge{
padding:4px 10px;
border-radius:20px;
font-size:11px;
}

.locked{background:var(--warning);color:#000;}
.unlocked{background:var(--success);color:#000;}
.paid{background:var(--danger);}
.free{background:#16a34a;}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<h2>📺 BTECH PRO ULTRA LOCKED</h2>

<div class="top-links">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Sports',this)">Sports</button>
<button onclick="filterCat('Movies',this)">Movies</button>
<button onclick="filterLocked(this)">Locked</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat" onclick="filterCat('All')">📺 All</div>
<div class="cat" onclick="filterCat('Sports')">🏆 Sports</div>
<div class="cat" onclick="filterCat('Movies')">🎬 Movies</div>
<div class="cat" onclick="filterLocked()">🔒 Locked</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- PLAYER -->
<div class="player">
<div class="overlay" id="overlay">
<h1>🚀</h1>
<p>Loading Engine...</p>
</div>
<video id="videoPlayer" controls></video>
</div>

<!-- CHANNEL LIST -->
<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* ================= ENGINE ================= */
const ENGINE={
maxChannels:5000,
renderLimit:200
};

let channels=[];
let filtered=[];

/* ================= STREAMS ================= */
const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* ================= GENERATE ================= */
function generate(){
const cats=["Sports","Movies","News","VIP"];

for(let i=1;i<=ENGINE.maxChannels;i++){

channels.push({
id:i,
name:"BTECH "+cats[i%cats.length]+" "+i,
category:cats[i%cats.length],
url:streams[i%streams.length],
status:i%10===0?"locked":"unlocked",
type:i%3===0?"paid":"free"
});

}

filtered=[...channels];
render();
document.getElementById("overlay").style.display="none";
}

/* ================= RENDER ================= */
function render(){

const box=document.getElementById("channelList");
box.innerHTML="";

filtered.slice(0,ENGINE.renderLimit).forEach((c,i)=>{

box.innerHTML+=`
<div class="channel" onclick="play(${c.id})">

<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>

<div>
<span class="badge ${c.status}">
${c.status}
</span>
</div>

</div>
`;

});

}

/* ================= PLAY ================= */
let hls;

function play(id){

const ch=channels.find(c=>c.id===id);

const video=document.getElementById("videoPlayer");

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls();
hls.loadSource(ch.url);
hls.attachMedia(video);

}else{
video.src=ch.url;
}

video.play();

}

/* ================= FILTER ================= */
function filterCat(cat,btn){

filtered=cat==="All"
?channels
:channels.filter(c=>c.category.includes(cat));

render();

document.querySelectorAll(".top-links button")
.forEach(b=>b.classList.remove("active"));

if(btn) btn.classList.add("active");
}

function filterLocked(){
filtered=channels.filter(c=>c.status==="locked");
render();
}

/* ================= START ================= */
generate();

</script>

</body>
</html>
