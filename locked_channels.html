<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV LOCKED CHANNELS PRO</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
--danger:#dc2626;
--success:#00ff99;
--warning:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
}

.header{
padding:20px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.header h2{color:var(--accent);}

.stats{
display:flex;
gap:10px;
}

.stat{
background:var(--card);
padding:10px;
border-radius:10px;
text-align:center;
min-width:120px;
}

.stat h4{font-size:12px;color:var(--muted);}
.stat p{color:var(--accent);font-weight:bold;font-size:18px;}

.container{padding:20px;}

.search{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:var(--panel);
color:#fff;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:15px;
}

.card{
background:var(--card);
padding:15px;
border-radius:12px;
border:1px solid #222;
}

.badge{
padding:4px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.locked{background:#f59e0b;color:#000;}
.paid{background:#dc2626;}
.free{background:#16a34a;}

.btns{display:flex;gap:10px;margin-top:10px;}

button{
flex:1;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.unlock{background:var(--success);}
.pay{background:var(--warning);color:#000;}
.delete{background:var(--danger);color:#fff;}

/* LOGIN OVERLAY */
.login{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.login-box{
background:var(--panel);
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
}

.login-box input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:#fff;
}

.login-box button{
margin-top:10px;
width:100%;
background:var(--accent);
}

.small{
font-size:12px;
color:var(--muted);
margin-top:10px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="login" id="loginBox">
<div class="login-box">
<h3>🔐 Admin Login</h3>
<input type="password" id="pass" placeholder="Enter Admin Key">
<button onclick="login()">Login</button>
<p class="small">Default: admin123</p>
</div>
</div>

<!-- ================= HEADER ================= -->
<div class="header">
<h2>🔒 Locked Channels PRO</h2>

<div class="stats">
<div class="stat"><h4>Locked</h4><p id="lockedCount">0</p></div>
<div class="stat"><h4>Revenue</h4><p id="revenue">₦0</p></div>
<div class="stat"><h4>Paid</h4><p id="paidCount">0</p></div>
</div>
</div>

<div class="container">

<input class="search" placeholder="Search locked channels..." oninput="render(this.value)">

<div class="grid" id="grid"></div>

</div>

<script>

/* ================= SECURITY ================= */
let ADMIN = false;
const ADMIN_KEY = "admin123";

/* ================= DATA ================= */
let channels = [];
let revenue = 0;

/* ================= LOGIN ================= */
function login(){
const val = document.getElementById("pass").value;

if(val === ADMIN_KEY){
ADMIN = true;
document.getElementById("loginBox").style.display="none";
load();
}else{
alert("Wrong admin key");
}
}

/* ================= LOAD ================= */
function load(){

const saved = localStorage.getItem("channels");

if(saved){
channels = JSON.parse(saved);
}else{
channels = demo();
save();
}

render();
}

/* ================= DEMO ================= */
function demo(){
let arr=[];

for(let i=1;i<=40;i++){
arr.push({
id:i,
name:"Locked Channel "+i,
category:i%2?"Sports":"Movies",
status:"locked",
type:i%3?"free":"paid",
price: i%3?0:100
});
}

return arr;
}

/* ================= SAVE ================= */
function save(){
localStorage.setItem("channels",JSON.stringify(channels));
}

/* ================= UNLOCK ================= */
function unlock(id){

if(!ADMIN) return alert("Admin only");

channels = channels.map(c=>{
if(c.id===id){
c.status="unlocked";
}
return c;
});

save();
render();
}

/* ================= PAY TO UNLOCK ================= */
function payUnlock(id){

const ch = channels.find(c=>c.id===id);

if(!ch) return;

let cost = ch.price || 100;

let confirmPay = confirm("Pay ₦"+cost+" to unlock "+ch.name+" ?");

if(!confirmPay) return;

revenue += cost;

ch.status = "unlocked";

save();
render();
}

/* ================= DELETE ================= */
function del(id){

if(!ADMIN) return alert("Admin only");

channels = channels.filter(c=>c.id!==id);

save();
render();
}

/* ================= STATS ================= */
function stats(){

document.getElementById("lockedCount").innerText =
channels.filter(c=>c.status==="locked").length;

document.getElementById("paidCount").innerText =
channels.filter(c=>c.type==="paid").length;

document.getElementById("revenue").innerText =
"₦"+revenue.toLocaleString();

}

/* ================= RENDER ================= */
function render(q=""){

const grid = document.getElementById("grid");
grid.innerHTML="";

let data = channels.filter(c=>c.status==="locked");

if(q){
data = data.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase())
);
}

stats();

data.forEach(c=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>${c.name}</h3>
<p>${c.category}</p>

<span class="badge locked">LOCKED</span>
<span class="badge ${c.type}">${c.type}</span>

<div class="btns">

<button class="unlock" onclick="unlock(${c.id})">
🔓 Unlock
</button>

<button class="pay" onclick="payUnlock(${c.id})">
💳 Pay Unlock
</button>

<button class="delete" onclick="del(${c.id})">
🗑 Delete
</button>

</div>
`;

grid.appendChild(div);

});

}

</script>

</body>
</html>
