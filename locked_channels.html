<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV LOCKED CHANNELS DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--warning:#f59e0b;
--danger:#dc2626;
--success:#16a34a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* =========================
TOPBAR
========================= */
.topbar{
height:70px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
font-size:20px;
font-weight:bold;
color:var(--accent);
}

/* =========================
LAYOUT
========================= */
.container{
display:flex;
height:calc(100vh - 70px);
}

/* =========================
SIDEBAR
========================= */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.cat{
padding:12px;
background:var(--card);
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
}

/* =========================
MAIN
========================= */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* =========================
PLAYER
========================= */
.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.lock-badge{
position:absolute;
top:15px;
left:15px;
background:var(--warning);
padding:8px 14px;
border-radius:30px;
font-weight:bold;
font-size:12px;
}

/* =========================
CHANNELS
========================= */
.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
}

.locked{
background:var(--warning);
color:black;
}

/* =========================
OVERLAY
========================= */
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">🔒 BTECH-TV LOCKED DASHBOARD</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="filterLockedOnly()">
🔒 Locked Channels Only
</div>

<div class="cat" onclick="showAll()">
📺 Show All (Admin)
</div>

</div>

<!-- MAIN -->
<div class="main">

<!-- PLAYER -->
<div class="player">

<div class="lock-badge">🔒 LOCKED MODE</div>

<video id="videoPlayer" controls autoplay></video>

<div class="overlay" id="overlay">
<h2>🔒 Locked System</h2>
<p id="loaderText">Loading locked channels...</p>
</div>

</div>

<!-- CHANNEL LIST -->
<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* =========================
ENGINE STATE
========================= */
let channels=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;

/* =========================
STREAMS (fallback)
========================= */
const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =========================
GENERATE LOCKED CHANNELS
========================= */
function generateChannels(){

for(let i=0;i<200;i++){

channels.push({
id:i,
name:"LOCKED CHANNEL "+i,
category:"Premium",
logo:"https://via.placeholder.com/60",
status: i % 2 === 0 ? "locked" : "unlocked",
type:"locked",
url:streams[i % streams.length]
});

}

filteredChannels = channels.filter(c=>c.status==="locked");
render();
hideLoader();

}

/* =========================
RENDER
========================= */
function render(){

const box=document.getElementById("channelList");
box.innerHTML="";

filteredChannels.forEach((c,index)=>{

const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<h4>🔒 ${c.name}</h4>
<small>${c.category}</small>
<div class="badge locked">${c.status}</div>
`;

div.onclick=()=>play(index);
box.appendChild(div);

});

}

/* =========================
PLAY
========================= */
function play(index){

currentIndex=index;

const ch=filteredChannels[index];

document.getElementById("videoPlayer").src=ch.url;

}

/* =========================
FILTERS
========================= */
function filterLockedOnly(){
filteredChannels = channels.filter(c=>c.status==="locked");
render();
}

function showAll(){
filteredChannels = channels;
render();
}

/* =========================
LOADER
========================= */
function hideLoader(){
document.getElementById("overlay").style.display="none";
}

/* =========================
BOOT
========================= */
generateChannels();

</script>

</body>
</html>
