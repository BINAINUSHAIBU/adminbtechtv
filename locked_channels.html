<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked Channels Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

.header{
padding:15px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.header h2{
color:#00bfff;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{background:#00bfff;color:#000;}
.danger{background:#dc2626;color:#fff;}
.warning{background:#f59e0b;color:#000;}
.dark{background:#1b2438;color:#fff;}

.container{
display:flex;
height:calc(100vh - 70px);
}

.sidebar{
width:280px;
background:#11182a;
padding:15px;
overflow:auto;
border-right:1px solid #222;
}

.main{
flex:1;
padding:15px;
overflow:auto;
}

.channel{
background:#1b2438;
padding:12px;
margin-bottom:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid transparent;
}

.channel:hover{
border-color:#00bfff;
}

.badge{
padding:4px 10px;
border-radius:20px;
font-size:12px;
}

.locked{background:#f59e0b;color:black;}
.unlocked{background:#2563eb;color:white;}

.small{
font-size:12px;
color:#94a3b8;
}

input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-bottom:10px;
background:#0f1628;
color:white;
}
</style>
</head>

<body>

<div class="header">

<h2>🔒 Locked Channels Dashboard</h2>

<div class="controls">

<button class="primary" onclick="refresh()">🔄 Refresh</button>

<button class="warning" onclick="unlockAll()">🔓 Unlock All</button>

<button class="danger" onclick="deleteLocked()">🗑 Delete Locked</button>

<button class="dark" onclick="exportLocked()">📤 Export</button>

</div>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<input placeholder="Search locked..." oninput="searchLocked(this.value)">

<h3 style="color:#00bfff;">Stats</h3>

<p>Total Locked: <span id="lockedCount">0</span></p>
<p>Total Channels: <span id="totalCount">0</span></p>

<hr style="border:1px solid #222;">

<h3 style="color:#00bfff;">Quick Actions</h3>

<button class="primary" style="width:100%;margin-bottom:10px;" onclick="selectAll()">
✔ Select All
</button>

<button class="warning" style="width:100%;margin-bottom:10px;" onclick="lockRandom()">
🎲 Lock Random
</button>

</div>

<!-- MAIN -->
<div class="main" id="list"></div>

</div>

<script>

/* =========================
CONNECT TO ENGINE DATA
========================= */

// expects global channels[] from your main app
let data = window.channels || [];

let selected = new Set();

/* =========================
LOAD LOCKED
========================= */
function getLocked(){
return data.filter(c => c.status === "locked");
}

/* =========================
RENDER
========================= */
function render(list = getLocked()){

const box = document.getElementById("list");
box.innerHTML = "";

document.getElementById("lockedCount").innerText = list.length;
document.getElementById("totalCount").innerText = data.length;

list.forEach((c, i) => {

const div = document.createElement("div");
div.className = "channel";

div.innerHTML = `
<div>
<b>${c.name}</b><br>
<span class="small">${c.category}</span>
</div>

<div style="text-align:right;">
<span class="badge locked">${c.status}</span><br><br>

<button onclick="unlock(${c.id})" class="primary">Unlock</button>
<button onclick="remove(${c.id})" class="danger">Delete</button>
</div>
`;

box.appendChild(div);

});

}

/* =========================
ACTIONS
========================= */

function unlock(id){
const ch = data.find(c => c.id === id);
if(ch){
ch.status = "unlocked";
render();
}
}

function remove(id){
data = data.filter(c => c.id !== id);
window.channels = data;
render();
}

function unlockAll(){
data.forEach(c => c.status = "unlocked");
render();
}

function deleteLocked(){
data = data.filter(c => c.status !== "locked");
window.channels = data;
render();
}

function refresh(){
data = window.channels || data;
render();
}

function searchLocked(q){
q = q.toLowerCase();
render(getLocked().filter(c =>
c.name.toLowerCase().includes(q) ||
c.category.toLowerCase().includes(q)
));
}

function selectAll(){
selected = new Set(getLocked().map(c => c.id));
alert("All locked channels selected");
}

function lockRandom(){
data.forEach(c => {
if(Math.random() > 0.7) c.status = "locked";
});
render();
}

function exportLocked(){
const locked = getLocked();
const blob = new Blob([JSON.stringify(locked,null,2)],{type:"application/json"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "locked_channels.json";
a.click();
}

/* INIT */
render();

</script>

</body>
</html>
