<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV LOCKED PRO MAX v2</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
--danger:#dc2626;
--success:#00ff99;
--warning:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:var(--bg);color:var(--text);}

/* LOGIN */
.login{
position:fixed;inset:0;
background:#000c;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:320px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:#fff;
}

button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent);}
.danger{background:var(--danger);color:#fff;}
.success{background:var(--success);}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
padding:15px;
background:var(--panel);
border-bottom:1px solid #222;
}

.stats{
display:flex;gap:10px;
}

.stat{
background:var(--card);
padding:10px;
border-radius:10px;
text-align:center;
min-width:110px;
}

.stat p{color:var(--accent);font-weight:bold;}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 70px);
}

.main{
flex:1;
padding:15px;
overflow:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:12px;
}

.card{
background:var(--card);
padding:12px;
border-radius:10px;
border:1px solid #222;
}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.locked{background:#f59e0b;color:#000;}
.paid{background:#dc2626;}
.free{background:#16a34a;}

.actions{display:flex;gap:8px;margin-top:10px;}

.small-btn{
flex:1;
padding:7px;
font-size:12px;
border-radius:6px;
}

.unlock{background:var(--success);}
.pay{background:var(--warning);}
.del{background:var(--danger);color:#fff;}

.sidebar{
width:280px;
background:var(--panel);
padding:10px;
border-right:1px solid #222;
overflow:auto;
}

.log{
font-size:12px;
color:var(--muted);
margin-top:8px;
border-bottom:1px dashed #333;
padding-bottom:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<h3>🔐 PRO MAX LOGIN</h3>
<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button class="primary" onclick="login()">Login</button>
<p style="color:#888;font-size:12px;margin-top:10px;">
admin / admin123
</p>
</div>
</div>

<!-- HEADER -->
<div class="header">
<h3>🔒 LOCKED PRO MAX v2</h3>

<div class="stats">
<div class="stat"><p id="tLock">0</p><small>Locked</small></div>
<div class="stat"><p id="rev">₦0</p><small>Revenue</small></div>
<div class="stat"><p id="act">0</p><small>Actions</small></div>
</div>
</div>

<div class="container">

<!-- MAIN -->
<div class="main">

<input placeholder="Search locked channels..." oninput="render(this.value)">

<button class="primary" onclick="exportCSV()">⬇ Export CSV</button>

<div class="grid" id="grid"></div>

</div>

<!-- SIDEBAR LOG -->
<div class="sidebar">
<h4>📜 Activity Log</h4>
<div id="log"></div>
</div>

</div>

<script>

/* ================= AUTH ================= */
let USER=null;
let ROLE=null;

/* ================= STATE ================= */
let channels=[];
let revenue=0;
let actions=0;

/* ================= LOGIN ================= */
function login(){
const u=document.getElementById("user").value;
const p=document.getElementById("pass").value;

if(u==="admin" && p==="admin123"){
USER="admin";
ROLE="admin";
document.getElementById("login").style.display="none";
init();
}else{
alert("Invalid login");
}
}

/* ================= INIT ================= */
function init(){
channels=generate();
render();
}

/* ================= DEMO ================= */
function generate(){
let arr=[];
for(let i=1;i<=60;i++){
arr.push({
id:i,
name:"LOCKED "+i,
cat:i%2?"Sports":"Movies",
status:"locked",
type:i%3?"free":"paid",
price:100+i
});
}
return arr;
}

/* ================= LOG ================= */
function log(msg){
actions++;
let div=document.createElement("div");
div.className="log";
div.innerText=new Date().toLocaleTimeString()+" - "+msg;
document.getElementById("log").prepend(div);
}

/* ================= ACTIONS ================= */
function unlock(id){
if(ROLE!=="admin") return;

channels=channels.map(c=>{
if(c.id===id) c.status="unlocked";
return c;
});

log("Unlocked channel "+id);
render();
}

function pay(id){
let c=channels.find(x=>x.id===id);
revenue+=c.price;
c.status="unlocked";
log("Paid unlock ₦"+c.price);
render();
}

function del(id){
if(ROLE!=="admin") return;
channels=channels.filter(c=>c.id!==id);
log("Deleted channel "+id);
render();
}

/* ================= STATS ================= */
function stats(){
document.getElementById("tLock").innerText=
channels.filter(c=>c.status==="locked").length;

document.getElementById("rev").innerText=
"₦"+revenue;

document.getElementById("act").innerText=actions;
}

/* ================= RENDER ================= */
function render(q=""){

let grid=document.getElementById("grid");
grid.innerHTML="";

let data=channels.filter(c=>c.status==="locked");

if(q){
data=data.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
}

stats();

data.forEach(c=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h4>${c.name}</h4>
<small>${c.cat}</small><br>

<span class="badge locked">LOCKED</span>
<span class="badge ${c.type}">${c.type}</span>

<div class="actions">

<button class="small-btn unlock" onclick="unlock(${c.id})">
Unlock
</button>

<button class="small-btn pay" onclick="pay(${c.id})">
Pay
</button>

<button class="small-btn del" onclick="del(${c.id})">
Delete
</button>

</div>
`;

grid.appendChild(div);

});

}

/* ================= EXPORT ================= */
function exportCSV(){
let csv="id,name,category,status,type,price\n";
channels.forEach(c=>{
csv+=`${c.id},${c.name},${c.cat},${c.status},${c.type},${c.price}\n`;
});

let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="locked_channels.csv";
a.click();
}

</script>

</body>
</html>
