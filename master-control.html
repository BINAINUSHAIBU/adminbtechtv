<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTECH-TV WORLD PRO MAX — Master Control</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef6ff}header{padding:24px;background:#0d1b2d;border-bottom:1px solid #1f3a57}h1{margin:0 0 6px}.sub{opacity:.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:20px}.card{background:#0d1b2d;border:1px solid #1f3a57;border-radius:14px;padding:18px}.card h3{margin-top:0}.card a{display:inline-block;margin-top:10px;padding:10px 13px;border-radius:9px;background:#1677ff;color:#fff;text-decoration:none}.status{font-size:12px;opacity:.7;margin-top:8px}.search{padding:20px}.search input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #294968;background:#081524;color:#fff}</style></head>
<body><header><h1>BTECH-TV WORLD PRO MAX</h1><div class="sub">Ultra BTECH-TV World Engine X — Master Control Center</div></header>
<div class="search"><input id="q" placeholder="Search admin modules..."></div><main class="grid" id="grid"></main>
<script>
const modules=[
['Super Admin Dashboard','Main IPTV Ultra Max dashboard','dashboard.html'],['All Users','All user management','../all-users/'],['Premium Users','Premium subscriber management','../premium-users/'],['Blocked Users','Blocked account management','../blocked-users/'],['User Manager','Create, edit, block and manage users','../user_manager/'],['User Manager Settings','Account defaults and manager settings','../user_manager-settings/'],['Pay-To-View / Free Channels','Paid/free channel controls','../pay_to_view/'],['Locked Channels','Locked/unlocked channel controls','../locked_channels/'],['Assignment Channels','Assign channels to users/packages','../assignment_channels/'],['BTECH-TV Sessions','Active session monitoring','../btech-tv_sessions/'],['Analytics','Usage and traffic analytics','../analytics/'],['Performance','System performance controls','../performance/'],['Demo / Test Code','Testing and diagnostic tools','../demo-testcode/'],['Quiz Channels','Quiz channel administration','../quiz-channels/'],['Open BTECH-TV','Launch the main TV application','../index.html']
];
const grid=document.getElementById('grid'),q=document.getElementById('q');
function render(){const term=q.value.toLowerCase();grid.innerHTML=modules.filter(m=>m.join(' ').toLowerCase().includes(term)).map(m=>`<section class="card"><h3>${m[0]}</h3><div>${m[1]}</div><a href="${m[2]}">Open Module</a><div class="status">Local route: ${m[2]}</div></section>`).join('')||'<p>No matching module.</p>'}q.addEventListener('input',render);render();
</script></body></html>
