
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV PRO SETTINGS DASHBOARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
transition:0.3s;
}

/* THEMES */
body.blue{ background:#071a2b; }
body.green{ background:#062b1a; }

/* TOP BAR */
.topbar{
height:60px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar a{
color:white;
margin:0 10px;
text-decoration:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.topbar a:hover{
background:#00bfff;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0f1628;
padding:10px;
overflow-y:auto;
}

.cat{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:300px;
background:black;
}

video{
width:100%;
height:100%;
}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.active{
background:#00bfff33;
}

/* SETTINGS PANEL */
.settings{
display:none;
flex:1;
padding:20px;
background:#11182a;
}

.settings h2{
color:#00bfff;
}

button, select{
padding:10px;
margin-top:10px;
width:100%;
border:none;
border-radius:5px;
cursor:pointer;
}

button{
background:#00bfff;
color:white;
}

button:hover{
background:#0090cc;
}

.toggle{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div><b>📺 IPTV DASHBOARD</b></div>

<div>
<a onclick="showPage('channels')">Channels</a>
<a onclick="showPage('settings')">Settings</a>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📂 Categories</h3>
<div class="cat" onclick="filterCat('All')">All Channels</div>
<div class="cat" onclick="filterCat('Sports')">Sports</div>
<div class="cat" onclick="filterCat('Movies')">Movies</div>
<div class="cat" onclick="filterCat('News')">News</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- CHANNEL PAGE -->
<div id="channelsPage">

<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- SETTINGS PAGE -->
<div class="settings" id="settingsPage">

<h2>⚙️ Settings</h2>

<div class="toggle">
<span>Autoplay</span>
<input type="checkbox" id="autoplay" onchange="saveSettings()">
</div>

<h3>🎨 Theme</h3>
<select id="theme" onchange="changeTheme()">
<option value="dark">Dark</option>
<option value="blue">Blue</option>
<option value="green">Green</option>
</select>

<button onclick="clearChannels()">🗑 Clear All Channels</button>
<button onclick="resetApp()">🔄 Reset App</button>

</div>

</div>
</div>

<script>

let channels = JSON.parse(localStorage.getItem("channels")) || [];

/* DEFAULT */
if(channels.length === 0){
channels = [
{name:"BBC News HD", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", category:"News"},
{name:"ESPN Sports", url:"https://test-streams.mux.dev/test_001/stream.m3u8", category:"Sports"},
{name:"Movie HD", url:"https://test-streams.mux.dev/test_002/stream.m3u8", category:"Movies"}
];
localStorage.setItem("channels", JSON.stringify(channels));
}

let currentCat="All";

/* SETTINGS */
let settings = JSON.parse(localStorage.getItem("settings")) || {
autoplay:true,
theme:"dark"
};

/* APPLY SETTINGS */
document.getElementById("autoplay").checked = settings.autoplay;
document.getElementById("theme").value = settings.theme;
applyTheme();

/* SHOW PAGE */
function showPage(page){

document.getElementById("channelsPage").style.display = page==="channels"?"block":"none";
document.getElementById("settingsPage").style.display = page==="settings"?"block":"none";

}

/* PLAY */
function play(url){
let v=document.getElementById("videoPlayer");
v.src=url;

if(settings.autoplay){
v.play();
}
}

/* FILTER */
function filterCat(cat){
currentCat=cat;
render();
}

/* RENDER */
function render(){

let box=document.getElementById("channelList");
box.innerHTML="";

channels
.filter(c=>currentCat==="All"||c.category===currentCat)
.forEach(c=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<span>${c.name}</span>
<small>${c.category}</small>
`;

div.onclick=()=>play(c.url);

box.appendChild(div);
});

}

/* SETTINGS SAVE */
function saveSettings(){
settings.autoplay=document.getElementById("autoplay").checked;
localStorage.setItem("settings",JSON.stringify(settings));
}

/* THEME */
function changeTheme(){
settings.theme=document.getElementById("theme").value;
localStorage.setItem("settings",JSON.stringify(settings));
applyTheme();
}

function applyTheme(){
document.body.className=settings.theme;
}

/* CLEAR CHANNELS */
function clearChannels(){
if(confirm("Clear all channels?")){
localStorage.removeItem("channels");
location.reload();
}
}

/* RESET */
function resetApp(){
localStorage.clear();
location.reload();
}

render();

</script>
<script>

let channels = JSON.parse(localStorage.getItem("channels")) || [];

/* 🚀 GENERATE 10,000 ACTIVE CHANNELS */
if(channels.length === 0){

for(let i=1;i<=10000;i++){
channels.push({
name:`LIVE Channel ${i}`,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
category: i%4===0?"Sports":i%4===1?"Movies":i%4===2?"News":"Kids",
active: Math.random() > 0.15
});
}

localStorage.setItem("channels", JSON.stringify(channels));
}

let settings = JSON.parse(localStorage.getItem("settings")) || {
autoplay:true,
theme:"dark"
};

let currentCat="All";
let page = 0;
let limit = 100;

/* APPLY SETTINGS */
document.getElementById("autoplay").checked = settings.autoplay;
document.getElementById("theme").value = settings.theme;
applyTheme();

/* SHOW PAGE */
function showPage(p){
document.getElementById("channelsPage").style.display = p==="channels"?"block":"none";
document.getElementById("settingsPage").style.display = p==="settings"?"block":"none";
}

/* PLAY */
function play(url){
let v=document.getElementById("videoPlayer");
v.src=url;
if(settings.autoplay) v.play();
}

/* FILTER */
function filterCat(cat){
currentCat=cat;
page=0;
render();
}

/* LOAD MORE (PAGINATION) */
function loadMore(){
page++;
render(true);
}

/* RENDER 10,000 CHANNELS (FAST + PAGED) */
function render(append=false){

let box=document.getElementById("channelList");

if(!append) box.innerHTML="";

let filtered = channels.filter(c=>{
return currentCat==="All" || c.category===currentCat;
});

let start = page * limit;
let end = start + limit;

let slice = filtered.slice(start, end);

/* COUNT */
document.getElementById("count").innerText =
`LIVE: ${filtered.filter(c=>c.active).length} | TOTAL: ${filtered.length}`;

slice.forEach(c=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<span>${c.name}</span>
<span class="${c.active?'online':'offline'} status">
${c.active?'LIVE':'OFF'}
</span>
`;

div.onclick=()=>play(c.url);

box.appendChild(div);
});

/* AUTO LOAD NEXT PAGE BUTTON */
if(end < filtered.length){
let btn=document.createElement("button");
btn.innerText="⬇ Load More Channels";
btn.onclick=loadMore;
box.appendChild(btn);
}

}

/* SETTINGS */
function saveSettings(){
settings.autoplay=document.getElementById("autoplay").checked;
localStorage.setItem("settings",JSON.stringify(settings));
}

/* THEME */
function changeTheme(){
settings.theme=document.getElementById("theme").value;
localStorage.setItem("settings",JSON.stringify(settings));
applyTheme();
}

function applyTheme(){
document.body.className=settings.theme;
}

/* CLEAR */
function clearChannels(){
if(confirm("Clear all channels?")){
localStorage.removeItem("channels");
location.reload();
}
}

/* RESET */
function resetApp(){
localStorage.clear();
location.reload();
}

/* INIT */
render();

</script>
</body>
</html>
