<script>

let channels = JSON.parse(localStorage.getItem("channels")) || [];

/* AUTO GENERATE ACTIVE CHANNELS */
if(channels.length === 0){
for(let i=1;i<=80;i++){
channels.push({
name:`Live Channel ${i}`,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
category:i%3===0?"Sports":i%3===1?"Movies":"News",
active:Math.random() > 0.25
});
}
localStorage.setItem("channels",JSON.stringify(channels));
}

let settings = JSON.parse(localStorage.getItem("settings")) || {
autoplay:true,
autoNext:true,
theme:"dark"
};

let currentCat="All";
let favorites = JSON.parse(localStorage.getItem("fav")) || [];
let searchText="";
let currentIndex = 0;

/* INIT UI */
document.getElementById("autoplay").checked = settings.autoplay;
document.getElementById("autoNext").checked = settings.autoNext;
document.getElementById("theme").value = settings.theme;

applyTheme();

/* PAGE SWITCH */
function showPage(p){
document.getElementById("channelsPage").style.display = p==="channels"?"block":"none";
document.getElementById("settingsPage").style.display = p==="settings"?"block":"none";
}

/* PLAY CHANNEL */
function play(url, index){

let v = document.getElementById("videoPlayer");
v.src = url;

currentIndex = index;

if(settings.autoplay){
v.play();
}

}

/* AUTO NEXT CHANNEL (ACTIVE FEATURE) */
document.getElementById("videoPlayer").onended = function(){
if(!settings.autoNext) return;

let list = getFilteredChannels();

for(let i=currentIndex+1;i<list.length;i++){
if(list[i].active){
play(list[i].url, i);
return;
}
}
};

/* SEARCH */
function searchChannel(v){
searchText = v.toLowerCase();
render();
}

/* FILTER */
function filterCat(c){
currentCat = c;
render();
}

/* FAVORITES */
function toggleFav(name){
if(favorites.includes(name)){
favorites = favorites.filter(f=>f!==name);
}else{
favorites.push(name);
}
localStorage.setItem("fav",JSON.stringify(favorites));
render();
}

/* FILTER LOGIC */
function getFilteredChannels(){

return channels.filter(c=>{

let catOk =
currentCat==="All" ||
(currentCat==="Favorites" ? favorites.includes(c.name) : c.category===currentCat);

let searchOk = c.name.toLowerCase().includes(searchText);

return catOk && searchOk;
});

}

/* RENDER */
function render(){

let box = document.getElementById("channelList");
box.innerHTML = "";

let list = getFilteredChannels();

/* COUNT */
document.getElementById("count").innerText =
`${list.filter(c=>c.active).length} LIVE / ${list.length} TOTAL`;

list.forEach((c,i)=>{

let div = document.createElement("div");
div.className = "channel";

let fav = favorites.includes(c.name);

div.innerHTML = `
<div>
<b>${c.name}</b><br>
<span class="small">${c.category}</span>
</div>

<div>
<span class="status ${c.active?"online":"offline"}">
${c.active?"LIVE":"OFF"}
</span>
<span class="fav">${fav?"⭐":"☆"}</span>
</div>
`;

/* PLAY */
div.onclick = ()=>play(c.url, i);

/* FAVORITE */
div.querySelector(".fav").onclick = (e)=>{
e.stopPropagation();
toggleFav(c.name);
};

box.appendChild(div);

});

}

/* SETTINGS */
function saveSettings(){
settings.autoplay = document.getElementById("autoplay").checked;
settings.autoNext = document.getElementById("autoNext").checked;
localStorage.setItem("settings", JSON.stringify(settings));
}

/* THEME */
function changeTheme(){
settings.theme = document.getElementById("theme").value;
localStorage.setItem("settings", JSON.stringify(settings));
applyTheme();
}

function applyTheme(){
document.body.className = settings.theme;
}

/* IMPORT M3U */
function importM3U(){

let data = document.getElementById("m3u").value.split("\n");

data.forEach((url,i)=>{
if(url.trim()){
channels.push({
name:"Imported "+(i+1),
url:url.trim(),
category:"Imported",
active:true
});
}
});

localStorage.setItem("channels",JSON.stringify(channels));
render();

}

/* CLEAR */
function clearChannels(){
if(confirm("Clear all channels?")){
localStorage.removeItem("channels");
location.reload();
}
}

/* RESET */
function resetApp(){
localStorage.clear();
location.reload();
}

/* AUTO REFRESH ACTIVE STATUS (REALISTIC LIVE SYSTEM) */
setInterval(()=>{

channels.forEach(c=>{
c.active = Math.random() > 0.3; // simulate live/off
});

localStorage.setItem("channels", JSON.stringify(channels));
render();

}, 15000); // refresh every 15 seconds

render();

</script>
