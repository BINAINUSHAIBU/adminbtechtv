<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTECH-TV Quiz Channels Ultra</title><style>body{margin:0;background:#050816;color:#fff;font-family:Arial}.wrap{padding:24px;max-width:1200px;margin:auto}.card{background:#111827;border-radius:16px;padding:20px;margin-bottom:16px}h1{color:#00d4ff}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,button{padding:11px;border-radius:9px;border:0}button{background:#00d4ff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.q{background:#172033;padding:16px;border-radius:12px}.badge{padding:4px 8px;border-radius:10px;background:#16a34a}.paused{background:#f59e0b;color:#000}</style></head><body><div class="wrap"><h1>🧠 BTECH-TV QUIZ CHANNELS ULTRA</h1><p><a href="../super-admin/dashboard.html" style="color:#00d4ff">← Super Admin</a></p><div class="card"><div class="toolbar"><input id="name" placeholder="Quiz channel name"><select id="category"><option>General Knowledge</option><option>Sports</option><option>Science</option><option>Technology</option><option>Economics</option><option>Entertainment</option></select><input id="questions" type="number" value="20" min="1"><select id="access"><option>Free</option><option>Premium</option><option>Package</option><option>Locked</option></select><button onclick="addQuiz()">Add Quiz Channel</button><button onclick="exportQuiz()">Export JSON</button></div></div><div id="grid" class="grid"></div></div><script>const key='btech_quiz_channels';let qs=JSON.parse(localStorage.getItem(key)||'[]');function addQuiz(){const n=name.value.trim()||'BTECH Quiz '+(qs.length+1);qs.unshift({name:n,category:category.value,questions:Number(questions.value)||20,access:access.value,state:'Published',players:0,leaderboard:true,random:true});save()}function toggle(i){qs[i].state=qs[i].state==='Published'?'Paused':'Published';save()}function del(i){qs.splice(i,1);save()}function save(){localStorage.setItem(key,JSON.stringify(qs));render()}function exportQuiz(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(qs,null,2)],{type:'application/json'}));a.download='btech-quiz-channels.json';a.click()}function render(){grid.innerHTML=qs.map((q,i)=>`<div class="q"><h3>🧠 ${q.name}</h3><p>${q.category} • ${q.questions} questions</p><p>Access: <b>${q.access}</b></p><p>Players: ${q.players.toLocaleString()} • Leaderboard: ${q.leaderboard?'ON':'OFF'}</p><span class="badge ${q.state==='Paused'?'paused':''}">${q.state}</span><div style="margin-top:12px"><button onclick="toggle(${i})">${q.state==='Published'?'Pause':'Publish'}</button> <button onclick="del(${i})">Delete</button></div></div>`).join('')}render()</script></body></html>
