<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 BTECH IPTV SUPER ADMIN PRO MAX v2</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

/* LOGIN */
.login{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.login-box{
background:var(--panel);
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
}

.login-box input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#0f1628;
color:#fff;
}

.login-box button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:8px;
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* TOPBAR */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.topbar h2{color:var(--accent);font-size:18px}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.cat{
padding:10px;
margin:5px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{background:var(--hover)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:10px;
}

.box{
background:var(--card);
padding:10px;
border-radius:8px;
text-align:center;
}

/* GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.card:hover{
background:var(--hover);
transform:scale(1.02);
}

/* BADGES */
.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
}

.free{background:#16a34a}
.paid{background:#dc2626}
.locked{background:#f59e0b;color:#000}

/* PLAYER MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.player-box{
width:80%;
height:70%;
background:black;
border-radius:10px;
overflow:hidden;
position:relative;
}

.player-box video{
width:100%;
height:100%;
}

.close{
position:absolute;
top:10px;
right:10px;
background:red;
border:none;
padding:8px 12px;
color:#fff;
cursor:pointer;
border-radius:6px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="login-box">
<h3>🔐 ADMIN LOGIN</h3>
<input id="pass" type="password" placeholder="Enter password">
<button onclick="login()">Login</button>
<p style="font-size:12px;margin-top:10px;color:#aaa">Default: admin123</p>
</div>
</div>

<!-- MODAL PLAYER -->
<div class="modal" id="modal">
<div class="player-box">
<button class="close" onclick="closePlayer()">X</button>
<video id="video" controls autoplay></video>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h2>📺 IPTV SUPER ADMIN PRO MAX v2</h2>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat" onclick="setView('channels')">📺 Channels</div>
<div class="cat" onclick="setView('users')">👥 Users</div>
<button onclick="loadAPI()" style="width:100%;margin-top:10px">Load IPTV</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="stats">
<div class="box"><b id="t1">0</b><br>Total</div>
<div class="box"><b id="t2">0</b><br>Free</div>
<div class="box"><b id="t3">0</b><br>Paid</div>
<div class="box"><b id="t4">0</b><br>Locked</div>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

/* STATE */
let view="channels";
let users=[],channels=[];
let currentHls=null;

/* LOGIN */
function login(){
let p=document.getElementById("pass").value;
if(p==="admin123"){
localStorage.setItem("auth","1");
document.getElementById("login").style.display="none";
}
}

if(localStorage.getItem("auth")==="1"){
document.getElementById("login").style.display="none";
}

/* SWITCH */
function setView(v){view=v;render();}

/* LOAD API */
async function loadAPI(){

let res=await fetch("https://iptv-org.github.io/api/streams.json");
let data=await res.json();

channels=data.slice(0,200).map((s,i)=>({
id:i,
name:"Channel "+i,
url:s.url,
category:"Live",
type:i%2?"free":"paid",
status:i%10?"unlocked":"locked"
}));

render();
updateStats();
}

/* USERS */
function genUsers(){
users=[];
for(let i=0;i<100;i++){
users.push({id:i,name:"User "+i,status:i%2?"active":"banned"});
}
}

/* RENDER */
function render(){

let g=document.getElementById("grid");
g.innerHTML="";

if(view==="channels"){

channels.forEach((c,i)=>{

let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<h4>${c.name}</h4>
<p>${c.category}</p>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
`;

d.onclick=()=>play(c);

g.appendChild(d);

});

}else{

users.forEach(u=>{

let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<h4>👤 ${u.name}</h4>
<p>${u.status}</p>
`;

g.appendChild(d);

});

}

updateStats();
}

/* PLAY */
function play(c){

let v=document.getElementById("video");

document.getElementById("modal").style.display="flex";

if(currentHls)currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.url);
currentHls.attachMedia(v);
}else{
v.src=c.url;
}

v.play();

}

/* CLOSE */
function closePlayer(){
document.getElementById("modal").style.display="none";
document.getElementById("video").pause();
}

/* STATS */
function updateStats(){
document.getElementById("t1").innerText=channels.length;
document.getElementById("t2").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("t3").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("t4").innerText=channels.filter(c=>c.status==="locked").length;
}

/* INIT */
genUsers();
loadAPI();

</script>

</body>
</html>
