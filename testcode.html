<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📺 LIVE IPTV MONITOR - BTECH SUPER ADMIN PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:20px;
}

.topbar input{
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
width:260px;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(3px);
}

.tab-active{
background:var(--accent);
color:black;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box p{
color:var(--accent);
font-size:20px;
font-weight:bold;
}

/* GRID */
.grid{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
transition:0.3s;
cursor:pointer;
}

.card:hover{
background:var(--hover);
transform:translateY(-3px);
}

/* BADGES */
.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:#16a34a}
.paid{background:#dc2626}
.locked{background:#f59e0b;color:black}

.active{background:#16a34a}
.banned{background:#dc2626}
.premium{background:#f59e0b;color:black}

/* PLAYER */
.player{
height:320px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* BUTTON */
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
font-weight:bold;
margin-top:8px;
}

button:hover{opacity:0.85}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<h2>📺 LIVE IPTV MONITOR - BTECH SUPER ADMIN</h2>
<input placeholder="Search users or channels..." oninput="searchAll(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat tab-active" onclick="switchView('channels',this)">📺 Channels</div>
<div class="cat" onclick="switchView('users',this)">👥 Users</div>

<hr style="opacity:0.2;margin:10px 0">

<button onclick="generateUsers()">Generate Users</button>
<button onclick="generateChannels()">Generate Channels</button>
<button onclick="loadAPI()">🚀 Load IPTV API</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- STATS -->
<div class="stats">
<div class="box"><p id="t1">0</p><small>Total</small></div>
<div class="box"><p id="t2">0</p><small>Free / Active</small></div>
<div class="box"><p id="t3">0</p><small>Paid / Premium</small></div>
<div class="box"><p id="t4">0</p><small>Locked / Banned</small></div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div>

</div>

<script>

/* =====================
STATE
===================== */

let view="channels";

let users=[];
let channels=[];

let filteredUsers=[];
let filteredChannels=[];

/* =====================
SWITCH VIEW
===================== */
function switchView(v,el){

view=v;

document.querySelectorAll(".cat")
.forEach(c=>c.classList.remove("tab-active"));

el.classList.add("tab-active");

render();

}

/* =====================
USERS
===================== */
function generateUsers(){

users=[];

for(let i=1;i<=200;i++){

users.push({
id:i,
name:"User_"+i,
email:"user"+i+"@mail.com",
status:i%10===0?"banned":"active",
premium:i%7===0
});

}

filteredUsers=[...users];
render();
}

/* =====================
CHANNELS + IPTV API
===================== */
async function loadAPI(){

try{

let [chRes,stRes]=await Promise.all([
fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json())
]);

let map={};

for(let c of chRes) map[c.id]=c;

channels=[];

for(let s of stRes){

if(!s.url) continue;

let ch=s.channel?map[s.channel]:null;

channels.push({
id:channels.length+1,
name:ch?.name||"Unknown",
category:ch?.categories?.[0]||"Other",
url:s.url,
type:Math.random()>0.5?"free":"paid",
status:Math.random()>0.9?"locked":"unlocked",
viewers:Math.floor(Math.random()*1000000)
});

}

filteredChannels=[...channels];
render();

}catch(e){
generateChannels();
}

}

/* fallback */
function generateChannels(){

const cats=["Sports","Movies","News","Kids","Music","Africa"];

channels=[];

for(let i=1;i<=200;i++){

channels.push({
id:i,
name:"BTECH Channel "+i,
category:cats[i%cats.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"unlocked",
viewers:Math.floor(Math.random()*100000)
});

}

filteredChannels=[...channels];
render();

}

/* =====================
SEARCH
===================== */
function searchAll(q){

q=q.toLowerCase();

if(view==="users"){

filteredUsers=users.filter(u=>
u.name.toLowerCase().includes(q)||
u.email.toLowerCase().includes(q)
);

}else{

filteredChannels=channels.filter(c=>
c.name.toLowerCase().includes(q)||
c.category.toLowerCase().includes(q)
);

}

render();

}

/* =====================
RENDER
===================== */
function render(){

const grid=document.getElementById("grid");
grid.innerHTML="";

if(view==="users"){

filteredUsers.forEach(u=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>👤 ${u.name}</h3>
<p>${u.email}</p>

<span class="badge ${u.status}">${u.status}</span>
${u.premium?'<span class="badge premium">premium</span>':''}

<br>
<button onclick="toggleUser(${u.id})">Toggle</button>
`;

grid.appendChild(div);

});

}else{

filteredChannels.forEach(c=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>📺 ${c.name}</h3>
<p>${c.category}</p>

<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>

<p>👥 ${c.viewers}</p>
`;

grid.appendChild(div);

});

}

updateStats();

}

/* =====================
STATS
===================== */
function updateStats(){

document.getElementById("t1").innerText=
view==="users" ? users.length : channels.length;

document.getElementById("t2").innerText=
view==="users"
? users.filter(u=>u.status==="active").length
: channels.filter(c=>c.type==="free").length;

document.getElementById("t3").innerText=
view==="users"
? users.filter(u=>u.premium).length
: channels.filter(c=>c.type==="paid").length;

document.getElementById("t4").innerText=
view==="users"
? users.filter(u=>u.status==="banned").length
: channels.filter(c=>c.status==="locked").length;

}

/* =====================
USER ACTION
===================== */
function toggleUser(id){

users=users.map(u=>{
if(u.id===id){
u.status=u.status==="active"?"banned":"active";
}
return u;
});

filteredUsers=[...users];
render();

}

/* INIT */
generateUsers();
generateChannels();

</script>

</body>
</html>
