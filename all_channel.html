<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH TV - 40K CHANNEL ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

/* LAYOUT */
.dashboard{
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#111827;
padding:20px;
}

.sidebar h2{
text-align:center;
color:#00d4ff;
margin-bottom:20px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li a{
display:block;
padding:12px;
margin-bottom:10px;
background:#1e293b;
border-radius:10px;
text-decoration:none;
color:white;
}

/* MAIN */
.main{
flex:1;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}

/* SEARCH */
.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
margin-bottom:15px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
}

.card p{
font-size:24px;
color:#00d4ff;
}

/* GRID */
.channel-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

/* CARD */
.channel-card{
background:#1e293b;
border-radius:12px;
overflow:hidden;
}

.banner{
background:#334155;
height:120px;
display:flex;
align-items:center;
justify-content:center;
color:#00d4ff;
font-size:18px;
font-weight:bold;
}

.info{
padding:15px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin-right:5px;
display:inline-block;
}

.free{background:#16a34a;}
.paid{background:#dc2626;}
.locked{background:#f59e0b;}
.unlocked{background:#2563eb;}

button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
background:#00d4ff;
cursor:pointer;
}

/* PLAYER */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
}

.box{
width:90%;
max-width:900px;
background:#111827;
padding:20px;
border-radius:12px;
}

video{
width:100%;
height:450px;
background:black;
}

</style>

</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>BTECH 40K IPTV</h2>

<ul>
<li><a href="#">Dashboard</a></li>
<li><a href="#">All Channels</a></li>
<li><a href="#">Free</a></li>
<li><a href="#">Premium</a></li>
<li><a href="#">Locked</a></li>
</ul>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
<h1>40,000 Channel IPTV System</h1>
</div>

<div class="search-box">
<input id="search" placeholder="Search 40,000 channels..." oninput="search()">
</div>

<div class="stats">
<div class="card"><h3>Total</h3><p id="total"></p></div>
<div class="card"><h3>Free</h3><p id="free"></p></div>
<div class="card"><h3>Paid</h3><p id="paid"></p></div>
<div class="card"><h3>Locked</h3><p id="locked"></p></div>
</div>

<div class="channel-grid" id="grid"></div>

</div>

</div>

<!-- PLAYER -->
<div class="modal" id="modal">
<div class="box">
<button onclick="closePlayer()">Close</button>
<h3 id="title"></h3>
<video id="video" controls></video>
</div>
</div>

<script>

/* STREAM POOL (REAL WORKING TEST HLS) */
const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8"
];

/* CHANNEL ENGINE */
let channels = [];
const cats = ["Sports","Movies","Kids","News","Music","Drama","Docs"];

/* GENERATE 40,000 CHANNELS */
function generate(){

for(let i=1;i<=40000;i++){

channels.push({
id:i,
name:`BTECH Channel ${i}`,
category:cats[i % cats.length],
type:(i % 3 === 0) ? "Paid" : "Free",
status:(i % 9 === 0) ? "Locked" : "Unlocked",
url:streams[i % streams.length]
});
}

updateStats();
render(channels.slice(0,120));
}

function updateStats(){

document.getElementById("total").innerText = channels.length.toLocaleString();
document.getElementById("free").innerText = channels.filter(c=>c.type==="Free").length.toLocaleString();
document.getElementById("paid").innerText = channels.filter(c=>c.type==="Paid").length.toLocaleString();
document.getElementById("locked").innerText = channels.filter(c=>c.status==="Locked").length.toLocaleString();

}

/* RENDER */
function render(list){

let grid = document.getElementById("grid");
grid.innerHTML="";

list.slice(0,120).forEach(c=>{

grid.innerHTML += `
<div class="channel-card">
<div class="banner">${c.category}</div>
<div class="info">
<h3>${c.name}</h3>

<span class="badge ${c.type==="Free"?"free":"paid"}">${c.type}</span>
<span class="badge ${c.status==="Locked"?"locked":"unlocked"}">${c.status}</span>

<button onclick="play(${c.id})">Watch</button>

</div>
</div>
`;

});

}

/* SEARCH */
function search(){

let v = document.getElementById("search").value.toLowerCase();

let res = channels.filter(c=>c.name.toLowerCase().includes(v));

render(res);

}

/* PLAY */
function play(id){

let c = channels.find(x=>x.id===id);

if(c.status==="Locked"){
alert("Channel Locked - Subscribe");
return;
}

document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=c.name;

let video=document.getElementById("video");

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

}

/* CLOSE */
function closePlayer(){
document.getElementById("modal").style.display="none";
document.getElementById("video").pause();
}

generate();

</script>

</body>
</html>
