<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV PRO 40K SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* TOP BAR */
.topbar{
height:60px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
position:sticky;
top:0;
z-index:10;
}

.topbar a{
color:white;
margin:0 10px;
text-decoration:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.topbar a:hover{
background:#00bfff;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0f1628;
padding:10px;
overflow-y:auto;
}

.cat{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
}

.cat:hover{
background:#2b3a5a;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:300px;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
}

/* CHANNEL LIST */
.channels{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
display:flex;
justify-content:space-between;
font-size:13px;
}

.channel:hover{
background:#2b3a5a;
}

.active{
background:#00bfff55 !important;
}

/* PANEL */
.addpanel{
width:280px;
background:#11182a;
padding:10px;
overflow-y:auto;
}

input, select, button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
background:#00bfff;
color:white;
cursor:pointer;
}

button:hover{
background:#0090cc;
}

/* SETTINGS */
.settings{
margin-top:20px;
background:#1b2438;
padding:10px;
border-radius:5px;
}

</style>
</head>

<body>

<div class="topbar">
<div><b>📺 IPTV PRO 40,000 ENGINE</b></div>
<div>
<a onclick="filterCat('All')">All</a>
<a onclick="filterCat('Sports')">Sports</a>
<a onclick="filterCat('Movies')">Movies</a>
<a onclick="filterCat('News')">News</a>
<a onclick="toggleTheme()">Theme</a>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📂 Categories</h3>

<div class="cat" onclick="filterCat('All')">All Channels (40K)</div>
<div class="cat" onclick="filterCat('Sports')">Sports</div>
<div class="cat" onclick="filterCat('Movies')">Movies</div>
<div class="cat" onclick="filterCat('News')">News</div>
<div class="cat" onclick="filterCat('Kids')">Kids</div>
<div class="cat" onclick="filterCat('Music')">Music</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT PANEL -->
<div class="addpanel">

<h3>⚙ Settings</h3>

<button onclick="generate40k()">Generate 40,000 Channels</button>

<input id="search" placeholder="Search 40K channels..." oninput="search(this.value)">

<div class="settings">
<label>Auto Play</label>
<select onchange="autoPlay=this.value==='true'">
<option value="true">ON</option>
<option value="false">OFF</option>
</select>

<label>Quality</label>
<select>
<option>Auto</option>
<option>1080p</option>
<option>720p</option>
<option>480p</option>
</select>
</div>

</div>

</div>

<script>

let channels = [];
let currentFilter = "All";
let autoPlay = true;
let dark = true;

/* REALISTIC STREAM SOURCE POOL */
const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8",
"https://test-streams.mux.dev/test_003/stream.m3u8"
];

/* GENERATE 40,000 CHANNELS */
function generate40k(){

channels = [];

const cats = ["Sports","Movies","News","Kids","Music"];

for(let i=1;i<=40000;i++){

let cat = cats[i % cats.length];

channels.push({
id:i,
name: cat + " HD CHANNEL " + i,
category:cat,
url: streams[i % streams.length]
});
}

render();
}

/* RENDER */
function render(){

let box = document.getElementById("channelList");
box.innerHTML="";

let list = channels.filter(c =>
currentFilter==="All" || c.category===currentFilter
).slice(0,300); // performance limit

list.forEach(c=>{

let div = document.createElement("div");
div.className="channel";

div.innerHTML = `
<span>${c.name}</span>
<small>LIVE</small>
`;

div.onclick=()=>play(c.url,div);

box.appendChild(div);
});
}

/* PLAY */
function play(url,el){

let video=document.getElementById("videoPlayer");
video.src=url;
video.play();

document.querySelectorAll(".channel").forEach(c=>c.classList.remove("active"));
el.classList.add("active");
}

/* FILTER */
function filterCat(cat){
currentFilter=cat;
render();
}

/* SEARCH */
function search(q){
let box=document.getElementById("channelList");
box.innerHTML="";

channels.filter(c =>
c.name.toLowerCase().includes(q.toLowerCase())
).slice(0,200).forEach(c=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`<span>${c.name}</span><small>${c.category}</small>`;

div.onclick=()=>play(c.url,div);

box.appendChild(div);
});
}

/* THEME */
function toggleTheme(){
dark=!dark;
document.body.style.background = dark ? "#0b0f1a" : "#eaeaea";
document.body.style.color = dark ? "white" : "black";
}

/* AUTO START */
generate40k();

</script>

</body>
</html>
