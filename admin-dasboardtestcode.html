<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV PRO DASHBOARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* TOP NAV (HORIZONTAL) */
.topbar{
height:60px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
position:sticky;
top:0;
z-index:10;
}

.topbar a{
color:white;
margin:0 10px;
text-decoration:none;
padding:8px 12px;
border-radius:5px;
}

.topbar a:hover{
background:#00bfff;
}

/* MAIN LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* LEFT SIDEBAR (VERTICAL) */
.sidebar{
width:220px;
background:#0f1628;
padding:10px;
overflow-y:auto;
}

.sidebar h3{
color:#00bfff;
}

.cat{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
}

.cat:hover{
background:#2b3a5a;
}

/* CENTER CONTENT */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:300px;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
background:black;
}

/* CHANNEL LIST */
.channels{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
padding:10px;
margin:5px 0;
background:#1b2438;
border-radius:5px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:#2b3a5a;
}

.active{
background:#00bfff33 !important;
}

/* ADD PANEL */
.addpanel{
width:300px;
background:#11182a;
padding:10px;
overflow-y:auto;
}

input, select, button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
background:#00bfff;
color:white;
cursor:pointer;
}

button:hover{
background:#0090cc;
}

</style>
</head>

<body>

<!-- TOP BAR (HORIZONTAL MENU) -->
<div class="topbar">
<div><b>📺 IPTV PRO DASHBOARD</b></div>

<div>
<a href="#">Dashboard</a>
<a href="#">Channels</a>
<a href="#">Add Channel</a>
<a href="#">Settings</a>
</div>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

<!-- VERTICAL SIDEBAR -->
<div class="sidebar">
<h3>📂 Categories</h3>

<div class="cat" onclick="filterCat('All')">All Channels</div>
<div class="cat" onclick="filterCat('Sports')">Sports</div>
<div class="cat" onclick="filterCat('Movies')">Movies</div>
<div class="cat" onclick="filterCat('News')">News</div>
<div class="cat" onclick="filterCat('Kids')">Kids</div>
<div class="cat" onclick="filterCat('Music')">Music</div>
</div>

<!-- MAIN AREA -->
<div class="main">

<!-- PLAYER -->
<div class="player">
<video id="videoPlayer" controls autoplay></video>
</div>

<!-- CHANNEL LIST -->
<div class="channels" id="channelList"></div>

</div>

<!-- ADD CHANNEL PANEL -->
<div class="addpanel">

<h3>➕ Add Channel</h3>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Stream URL (M3U8)">
<select id="category">
<option>Sports</option>
<option>Movies</option>
<option>Kids</option>
<option>News</option>
<option>Music</option>
</select>

<button onclick="addChannel()">Add Channel</button>

</div>

</div>

<script>

let channels = JSON.parse(localStorage.getItem("channels")) || [];

/* DEFAULT DATA */
if(channels.length === 0){
channels = [
{name:"BBC News HD", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", category:"News"},
{name:"ESPN Sports", url:"https://test-streams.mux.dev/test_001/stream.m3u8", category:"Sports"},
{name:"Movie HD", url:"https://test-streams.mux.dev/test_002/stream.m3u8", category:"Movies"},
{name:"Cartoon Kids", url:"https://test-streams.mux.dev/test_003/stream.m3u8", category:"Kids"},
{name:"Music Live", url:"https://test-streams.mux.dev/test_004/stream.m3u8", category:"Music"},
];
save();
}

let currentFilter = "All";

/* PLAY CHANNEL */
function play(url, el){
let video = document.getElementById("videoPlayer");
video.src = url;
video.play();

/* active highlight */
document.querySelectorAll(".channel").forEach(c=>c.classList.remove("active"));
el.classList.add("active");
}

/* ADD CHANNEL */
function addChannel(){
let name = document.getElementById("name").value;
let url = document.getElementById("url").value;
let category = document.getElementById("category").value;

if(!name || !url) return alert("Fill all fields");

channels.push({name,url,category});
save();
render();

document.getElementById("name").value="";
document.getElementById("url").value="";
}

/* SAVE */
function save(){
localStorage.setItem("channels", JSON.stringify(channels));
}

/* FILTER */
function filterCat(cat){
currentFilter = cat;
render();
}

/* RENDER */
function render(){

let box = document.getElementById("channelList");
box.innerHTML = "";

let list = channels.filter(c =>
currentFilter === "All" || c.category === currentFilter
);

list.forEach(c => {

let div = document.createElement("div");
div.className = "channel";

div.innerHTML = `
<span>${c.name}</span>
<small>${c.category}</small>
`;

div.onclick = () => play(c.url, div);

box.appendChild(div);
});

}

render();

</script>

</body>
</html>
