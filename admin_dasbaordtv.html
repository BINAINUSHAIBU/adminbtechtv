<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH TV Admin 40K System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:#fff;
}

.dashboard-container{
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#111827;
padding:20px;
overflow-y:auto;
}

.sidebar h2{
color:#00d4ff;
text-align:center;
margin-bottom:20px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar ul li{
padding:12px;
margin:10px 0;
background:#1e293b;
border-radius:8px;
cursor:pointer;
}

.sidebar ul li:hover{
background:#334155;
}

/* MAIN */
.dashboard-main{
flex:1;
padding:20px;
}

/* STATS */
.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:#1e293b;
padding:20px;
border-radius:12px;
}

.stat-card h3{
color:#cbd5e1;
}

.stat-card p{
font-size:26px;
color:#00d4ff;
font-weight:bold;
}

/* TABLE */
.channel-section{
background:#1e293b;
padding:20px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #334155;
text-align:left;
font-size:14px;
}

th{
color:#00d4ff;
}

/* STATUS */
.status{
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.free{background:#16a34a;}
.paid{background:#dc2626;}
.locked{background:#f59e0b;}
.unlocked{background:#2563eb;}

button{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.lock-btn{background:#f59e0b;}
.edit-btn{background:#00d4ff;}

.search-box{
margin-bottom:15px;
width:100%;
padding:10px;
border-radius:6px;
border:none;
}

</style>
</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->
<aside class="sidebar">
<h2>BTECH TV</h2>

<ul>
<li>Dashboard</li>
<li>All Channels (40K)</li>
<li>Free Channels</li>
<li>Pay To View</li>
<li>Locked Channels</li>
<li>Settings</li>
</ul>
</aside>

<!-- MAIN -->
<main class="dashboard-main">

<h1>BTECH TV 40,000 CHANNEL SYSTEM</h1>

<!-- STATS -->
<div class="stats-grid">

<div class="stat-card">
<h3>Total Channels</h3>
<p id="total">0</p>
</div>

<div class="stat-card">
<h3>Free Channels</h3>
<p id="free">0</p>
</div>

<div class="stat-card">
<h3>Pay To View</h3>
<p id="paid">0</p>
</div>

<div class="stat-card">
<h3>Locked</h3>
<p id="locked">0</p>
</div>

</div>

<!-- SEARCH -->
<input class="search-box" placeholder="Search 40,000 channels..." oninput="search(this.value)">

<!-- TABLE -->
<section class="channel-section">

<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</section>

</main>

</div>

<script>

let channels = [];

/* STREAM POOL (REAL WORKING TEST STREAMS) */
const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8"
];

/* GENERATE 40,000 CHANNELS */
function generate(){

const cats = ["Sports","Movies","News","Kids","Music","Drama"];

channels = [];

for(let i=1;i<=40000;i++){

let cat = cats[i % cats.length];

let type = (i % 3 === 0) ? "paid" : "free";
let status = (i % 10 === 0) ? "locked" : "unlocked";

channels.push({
id:i,
name: cat + " HD Channel " + i,
category:cat,
type:type,
status:status,
url:streams[i % streams.length]
});
}

updateStats();
render(channels.slice(0,200));
}

/* STATS */
function updateStats(){
document.getElementById("total").innerText = channels.length;
document.getElementById("free").innerText = channels.filter(c=>c.type==="free").length;
document.getElementById("paid").innerText = channels.filter(c=>c.type==="paid").length;
document.getElementById("locked").innerText = channels.filter(c=>c.status==="locked").length;
}

/* RENDER */
function render(list){

let tbody = document.getElementById("table");
tbody.innerHTML="";

list.forEach(c=>{

let row = document.createElement("tr");

row.innerHTML=`
<td>${c.name}</td>
<td>${c.category}</td>
<td><span class="${c.type==='free'?'free':'paid'} status">${c.type}</span></td>
<td><span class="${c.status==='locked'?'locked':'unlocked'} status">${c.status}</span></td>
<td>
<button class="lock-btn" onclick="toggleLock(${c.id})">Toggle</button>
<button class="edit-btn">Edit</button>
</td>
`;

tbody.appendChild(row);
});
}

/* TOGGLE LOCK */
function toggleLock(id){

channels = channels.map(c=>{
if(c.id===id){
c.status = (c.status==="locked")?"unlocked":"locked";
}
return c;
});

updateStats();
render(channels.slice(0,200));
}

/* SEARCH */
function search(q){

let result = channels.filter(c =>
c.name.toLowerCase().includes(q.toLowerCase())
).slice(0,200);

render(result);
}

/* INIT */
generate();

</script>

</body>
</html>
