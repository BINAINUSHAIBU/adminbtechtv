<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH QUIZ SUPER ADMIN DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer}

/* =========================
TOPBAR
========================= */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar h2{
color:var(--accent);
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */

.sidebar{
width:280px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* QUIZ PLAYER */

.player{
height:320px;
background:#000;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
position:relative;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.overlay h1{
font-size:40px;
}

.quiz-box{
padding:20px;
text-align:center;
}

/* CHANNEL GRID */

.channels{
flex:1;
overflow-y:auto;
padding:12px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:15px;
border-radius:10px;
cursor:pointer;
}

.channel:hover{
background:var(--hover);
}

/* PROFILE */

.profile{
background:var(--card);
padding:15px;
border-radius:10px;
margin:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:10px;
}

.stat{
background:#0f1628;
padding:10px;
border-radius:8px;
text-align:center;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

<h2>🎯 BTECH QUIZ SUPER ADMIN</h2>

<button onclick="nextQuiz()">NEXT QUIZ ▶</button>

</div>

<!-- CONTAINER -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="filterType('multiple')">📝 Multiple Quiz</div>
<div class="cat" onclick="filterType('audio')">🎧 Audio Quiz</div>
<div class="cat" onclick="filterType('picture')">🖼 Picture Quiz</div>
<div class="cat" onclick="filterType('video')">🎥 Video Quiz</div>

<div class="cat" onclick="showProfile()">👤 Profile</div>

</div>

<!-- MAIN -->
<div class="main">

<!-- PLAYER -->
<div class="player" id="quizPlayer">

<div class="overlay" id="overlay">
<h1>🚀 QUIZ ENGINE</h1>
<p>Select a quiz channel</p>
</div>

</div>

<!-- CHANNELS -->
<div class="channels" id="quizList"></div>

</div>

</div>

<script>

/* =========================
QUIZ DATA
========================= */

let quizzes=[
{
id:1,
type:"multiple",
title:"General Knowledge Quiz",
question:"What is capital of Nigeria?",
options:["Lagos","Abuja","Kano","Ibadan"],
answer:"Abuja"
},
{
id:2,
type:"audio",
title:"Music Quiz",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
},
{
id:3,
type:"picture",
title:"Image Quiz",
image:"https://picsum.photos/800/300"
},
{
id:4,
type:"multiple",
title:"Math Quiz",
question:"2 + 2 = ?",
options:["1","2","4","5"],
answer:"4"
}
];

let currentIndex=0;
let filtered=[...quizzes];

/* =========================
RENDER QUIZ LIST
========================= */

function render(){

let box=document.getElementById("quizList");

box.innerHTML="";

filtered.forEach((q,i)=>{

let div=document.createElement("div");

div.className="channel";

div.innerHTML=`
<h3>${q.title}</h3>
<p>${q.type.toUpperCase()} QUIZ</p>
`;

div.onclick=()=>openQuiz(i);

box.appendChild(div);

});

}

/* =========================
OPEN QUIZ
========================= */

function openQuiz(i){

let q=filtered[i];

let box=document.getElementById("quizPlayer");

document.getElementById("overlay").style.display="none";

if(q.type==="multiple"){

box.innerHTML=`
<div class="quiz-box">
<h2>${q.question}</h2>
<br>
${q.options.map(o=>
`<button onclick="check('${o}','${q.answer}')">${o}</button>`
).join("<br><br>")}
</div>
`;

}

else if(q.type==="audio"){

box.innerHTML=`
<h2>${q.title}</h2>
<audio controls autoplay>
<source src="${q.audio}">
</audio>
`;

}

else if(q.type==="picture"){

box.innerHTML=`
<h2>${q.title}</h2>
<img src="${q.image}" style="width:100%;height:100%;object-fit:cover">
`;

}

currentIndex=i;

}

/* =========================
ANSWER CHECK
========================= */

function check(a,b){

alert(a===b ? "✅ Correct!" : "❌ Wrong!");

}

/* =========================
FILTER TYPE
========================= */

function filterType(type){

filtered=quizzes.filter(q=>q.type===type);

render();

}

/* =========================
NEXT QUIZ
========================= */

function nextQuiz(){

currentIndex++;

if(currentIndex>=filtered.length) currentIndex=0;

openQuiz(currentIndex);

}

/* =========================
PROFILE
========================= */

function showProfile(){

let box=document.getElementById("quizPlayer");

box.innerHTML=`
<div class="profile">

<h2>👤 User Profile</h2>

<p>Name: John Doe</p>
<p>Email: john@gmail.com</p>

<div class="stats">

<div class="stat">
<h3>120</h3>
<p>Score</p>
</div>

<div class="stat">
<h3>15</h3>
<p>Wins</p>
</div>

<div class="stat">
<h3>#4</h3>
<p>Rank</p>
</div>

</div>

</div>
`;

}

/* INIT */

render();

</script>

</body>
</html>
