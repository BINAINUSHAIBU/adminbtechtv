<script>

/* ========================================================= */
/* LOCKED CHANNELS */
/* ========================================================= */

function showLockedChannels(){

filteredChannels=
all.filter(c=>c.type==='premium');

renderChannels();

updateStats();

alert('🔒 Locked Premium Channels Loaded');

}

/* ========================================================= */
/* ASSIGNMENT CHANNELS */
/* ========================================================= */

function showAssignmentChannels(){

alert('📚 Assignment Channels Activated');

}

/* ========================================================= */
/* DEMO TEST VERSION */
/* ========================================================= */

function showDemoChannels(){

alert('🧪 Demo Test Version Enabled');

}

/* ========================================================= */
/* SETTINGS PANEL */
/* ========================================================= */

function openSettingsPanel(){

document.getElementById(
'settingsPanel'
).style.display='flex';

}

function closeSettingsPanel(){

document.getElementById(
'settingsPanel'
).style.display='none';

}

/* ========================================================= */
/* SUPER ADMIN */
/* ========================================================= */

function openSuperAdmin(){

document.getElementById(
'adminPanel'
).style.display='flex';

}

function closeSuperAdmin(){

document.getElementById(
'adminPanel'
).style.display='none';

}

/* ========================================================= */
/* CONTROL CENTER */
/* ========================================================= */

function openControlCenter(){

document.getElementById(
'controlPanel'
).style.display='flex';

}

function closeControlCenter(){

document.getElementById(
'controlPanel'
).style.display='none';

}

/* ========================================================= */
/* SUPER ADMIN TOOLS */
/* ========================================================= */

function adminBackup(){

const data={

favorites:favs,
recent:recent,
channels:all

};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{
type:'application/json'
}
);

const a=document.createElement('a');

a.href=URL.createObjectURL(blob);

a.download='btech-tv-backup.json';

a.click();

alert('💾 Backup Completed');

}

function adminRestore(){

alert('♻ Backup Restore Ready');

}

function adminRestart(){

video.pause();

video.load();

setTimeout(()=>{

if(filteredChannels.length){

playChannel(currentIndex);

}

},1000);

alert('🔄 IPTV Restarted');

}

function adminShutdown(){

video.pause();

showOverlay('⛔ IPTV SYSTEM SHUTDOWN');

}

function adminPremium(){

all.forEach((c,index)=>{

if(index%3===0){

c.type='premium';

}

});

renderChannels();

alert('💎 Premium Channels Enabled');

}

function enableMaintenance(){

alert('🛡 Maintenance Mode Enabled');

}

function enableSecurity(){

alert('🔐 Security Lock Enabled');

}

function clearCache(){

localStorage.clear();

alert('🧹 Cache Cleared');

}

function refreshChannels(){

renderChannels();

updateStats();

alert('📺 Channels Refreshed');

}

function systemInfo(){

alert(

'📊 SYSTEM INFO\n\n'+
'Channels: '+all.length+'\n'+
'Favorites: '+Object.keys(favs).length+'\n'+
'Recent: '+recent.length+'\n'+
'Theme: '+(dark?'Dark':'Light')

);

}

/* ========================================================= */
/* AUTO SKIP */
/* ========================================================= */

let autoSkipOn=true;

function toggleAutoSkip(){

autoSkipOn=!autoSkipOn;

alert(

autoSkipOn
? '⏭ Auto Skip Enabled'
: '⏭ Auto Skip Disabled'

);

}

</script>
