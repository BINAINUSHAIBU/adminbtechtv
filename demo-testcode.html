<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAAS ENTERPRISE DASHBOARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b1020;
color:#fff;
}

.container{
display:flex;
height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#111a33;
padding:15px;
overflow:auto;
}

.sidebar h2{
color:#00d4ff;
}

button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
cursor:pointer;
background:#1c2a55;
color:white;
}

button:hover{
background:#00d4ff;
color:#000;
}

/* MAIN */
.main{
flex:1;
padding:20px;
overflow:auto;
}

.card{
background:#1a2448;
padding:10px;
margin:10px 0;
border-radius:10px;
}

/* LOGIN OVERLAY */
#login{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
}

.loginBox{
background:#111a33;
padding:20px;
width:300px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
background:#0b1020;
border:none;
color:white;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="loginBox">
    <h3>SAAS LOGIN</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>

    <button onclick="pay()">Upgrade (Paystack)</button>

    <p id="msg"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="container" id="app" style="display:none;">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>SAAS PANEL</h2>

<button onclick="loadUsers()">👤 Users</button>
<button onclick="loadProfile()">📄 My Profile</button>
<button onclick="banUserPrompt()">🚫 Ban User</button>
<button onclick="resetTrialPrompt()">⏳ Reset Trial</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">
<h2>Dashboard</h2>

<div id="output"></div>

</div>

</div>

<script>

let token="";

/* ================= REGISTER ================= */
function register(){
fetch("http://localhost:5000/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
})
.then(r=>r.json())
.then(d=>{
document.getElementById("msg").innerText=d.msg;
});
}

/* ================= LOGIN ================= */
function login(){
fetch("http://localhost:5000/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
})
.then(r=>r.json())
.then(d=>{

if(d.token){
token=d.token;
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";
}else{
document.getElementById("msg").innerText=d.msg;
}

});
}

/* ================= PAYSTACK ================= */
function pay(){
fetch("http://localhost:5000/pay/init",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:email.value})
})
.then(r=>r.json())
.then(d=>{
window.location.href = d.data.authorization_url;
});
}

/* ================= USERS (ADMIN) ================= */
function loadUsers(){
fetch("http://localhost:5000/admin/users",{
headers:{Authorization:token}
})
.then(r=>r.json())
.then(data=>{
document.getElementById("output").innerHTML=
data.map(u=>
`<div class="card">
Email: ${u.email}<br>
Status: ${u.subscription?.active ? "ACTIVE" : "TRIAL"}
</div>`
).join("");
});
}

/* ================= PROFILE ================= */
function loadProfile(){
fetch("http://localhost:5000/login",{
headers:{Authorization:token}
})
}

/* ================= BAN USER ================= */
function banUserPrompt(){
let id=prompt("Enter User ID to ban:");
fetch(`http://localhost:5000/admin/ban/${id}`,{
method:"POST",
headers:{Authorization:token}
}).then(r=>r.json()).then(alert);
}

/* ================= RESET TRIAL ================= */
function resetTrialPrompt(){
let id=prompt("Enter User ID:");
fetch(`http://localhost:5000/admin/reset/${id}`,{
method:"POST",
headers:{Authorization:token}
}).then(r=>r.json()).then(alert);
}

/* ================= LOGOUT ================= */
function logout(){
token="";
document.getElementById("login").style.display="flex";
document.getElementById("app").style.display="none";
}

</script>

</body>
</html>
