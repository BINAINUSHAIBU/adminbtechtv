<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Stream Platform</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
display:flex;
height:100vh;
}

.sidebar{
width:320px;
background:#0b1224;
padding:10px;
overflow:auto;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
}

button{
background:#2563eb;
color:#fff;
cursor:pointer;
}

button:hover{background:#1d4ed8;}

.card{
padding:10px;
background:#111c33;
margin:5px 0;
border-radius:6px;
cursor:pointer;
}

.card:hover{
background:#1e2a4a;
}

video{
width:100%;
height:100%;
background:black;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>📺 IPTV LOGIN</h2>

<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<hr>

<h3>➕ Add Channel</h3>
<input id="name" placeholder="Channel name">
<input id="url" placeholder="Stream URL (m3u8)">
<button onclick="addChannel()">Add</button>

<h3>📡 Channels</h3>
<div id="list"></div>
</div>

<div class="main">
<video id="video" controls></video>
</div>

<script>

let logged = false;

// Local database
let channels = JSON.parse(localStorage.getItem("channels") || "[]");

// LOGIN (simple demo)
function login(){
if(user.value && pass.value){
logged = true;
alert("Logged in successfully");
}
}

// ADD CHANNEL
function addChannel(){
if(!logged){
alert("Please login first");
return;
}

channels.push({
name:name.value,
url:url.value
});

localStorage.setItem("channels", JSON.stringify(channels));
render();
}

// RENDER CHANNELS
function render(){
list.innerHTML = "";
channels.forEach(c=>{
let div = document.createElement("div");
div.className = "card";
div.innerText = c.name;
div.onclick = ()=>play(c.url);
list.appendChild(div);
});
}

// PLAY STREAM
function play(url){
let v = document.getElementById("video");

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(v);
}else{
v.src = url;
}

v.play();
}

// INIT
render();

</script>

</body>
</html>
