```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV WORLD PRO MAX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:380px;
background:#0d1324;
padding:25px;
border-radius:15px;
border:1px solid #1f355d;
}

h1{
font-size:22px;
text-align:center;
margin-bottom:15px;
color:#00d4ff;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#111a31;
color:white;
}

button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#00d4ff;
}

.orange{
background:orange;
}

.green{
background:#00cc88;
}

.hidden{
display:none;
}

#timer{
text-align:center;
margin-top:10px;
color:#00d4ff;
font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<h1>📺 BTECH-TV WORLD</h1>

<div id="authSection">

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="register()">
Register
</button>

<button class="primary" onclick="login()">
Login
</button>

</div>


<div id="timer"></div>


<div id="upgradeSection" class="hidden">

<h3 style="text-align:center;margin-top:20px">
🔓 Upgrade Package
</h3>

<button
class="primary"
onclick="choosePackage('Premium')">
⭐ Premium Package
</button>

<button
class="orange"
onclick="choosePackage('Super Premium')">
🚀 Super Premium
</button>

<button
class="green"
onclick="choosePackage('Unlimited')">
♾ Unlimited Package
</button>

</div>


<div id="paymentSection"
class="hidden">

<h3 style="margin-top:20px">
💳 Payment
</h3>

<input
id="fullname"
placeholder="Full Name">

<input
id="payemail"
placeholder="Email">

<button
class="primary"
onclick="processPayment()">

Proceed Payment

</button>

</div>

</div>

<script>

const TRIAL_TIME=60000;
let selectedPackage="";

function register(){

let email=
document.getElementById(
"email"
).value;

let password=
document.getElementById(
"password"
).value;

if(!email||!password){

alert("Fill all fields");
return;

}

localStorage.setItem(
"user",
JSON.stringify({
email,
password
})
);

alert(
"Registration successful"
);

}


function login(){

let email=
document.getElementById(
"email"
).value;

let password=
document.getElementById(
"password"
).value;

let user=
JSON.parse(
localStorage.getItem(
"user"
)
);

if(
!user||
user.email!==email||
user.password!==password
){

alert(
"Invalid Login"
);

return;

}

if(
localStorage.getItem(
"premium"
)==="true"
){

document.getElementById(
"timer"
).innerHTML=
"🔓 Premium Active";

return;

}

startTrial();

}


function startTrial(){

let start=Date.now();

let interval=
setInterval(()=>{

let remaining=
TRIAL_TIME-
(Date.now()-start);

if(
remaining<=0
){

clearInterval(
interval
);

document
.getElementById(
"timer"
)
.innerHTML=
"Trial Ended";

document
.getElementById(
"upgradeSection"
)
.classList
.remove(
"hidden"
);

return;

}

let sec=
Math.floor(
remaining/1000
);

document
.getElementById(
"timer"
)
.innerHTML=
"Trial: "
+sec+
"s";

},1000);

}


function choosePackage(plan){

selectedPackage=
plan;

document
.getElementById(
"paymentSection"
)
.classList
.remove(
"hidden"
);

}


function processPayment(){

let fullname=
document.getElementById(
"fullname"
).value;

let email=
document.getElementById(
"payemail"
).value;

if(
!fullname||
!email
){

alert(
"Fill payment details"
);

return;

}


/* Replace with
Paystack / Flutterwave */

alert(
selectedPackage+
" activated"
);

localStorage.setItem(
"premium",
"true"
);

localStorage.setItem(
"package",
selectedPackage
);

location.reload();

}

</script>

</body>
</html>
