<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* AUTH */
#authScreen{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#0d1324;
padding:20px;
border-radius:10px;
width:320px;
border:1px solid #1d2b4f;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
background:#101a31;
border:none;
color:#fff;
border-radius:6px;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:10px;
background:#00d4ff;
border:none;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

/* EXPIRED */
#expiredScreen{
position:fixed;
inset:0;
background:#000;
display:none;
justify-content:center;
align-items:center;
z-index:10000;
text-align:center;
}

/* SIDEBAR */
.sidebar{
width:300px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.menu-title{
color:#00d4ff;
margin:15px 0 10px;
font-size:12px;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:10px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.search-box input{
padding:10px;
width:260px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
}

.timer{
background:#111827;
padding:6px 12px;
border-radius:20px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:8px;
}

.stat{
background:#101d39;
padding:8px;
border-radius:8px;
text-align:center;
}

/* PLAYER */
.player-container{
background:#000;
height:320px;
border-radius:10px;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{
border-color:#00d4ff;
transform:scale(1.03);
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authScreen">
<div class="auth-box">
<h3>🔐 IPTV TRIAL LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- EXPIRED -->
<div id="expiredScreen">
<h1>⛔ TRIAL EXPIRED</h1>
<p>Your 3–5 hour trial has ended.</p>
<button onclick="logout()">Logout</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 WORLDTV PRO MAX</div>

<div class="menu-title">⏳ Trial Time</div>
<div id="trialInfo"></div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="loadAll()">LOAD ALL CHANNELS</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadAll()">ALL CONTENT</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn">Scan</button>
<button class="nav-btn">Boost</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>

<div style="display:flex;gap:10px;align-items:center;">
<div class="live">🔴 LIVE</div>
<div class="timer" id="timer">00:00:00</div>
</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

const TRIAL_HOURS = 5;

/* AUTH */
function register(){
localStorage.setItem("user",JSON.stringify({
email:email.value,
pass:pass.value
}));
alert("Registered!");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u || u.email!=email.value || u.pass!=pass.value){
alert("Wrong login");
return;
}
startTrial();
document.getElementById("authScreen").style.display="none";
}

/* TRIAL */
function startTrial(){
let expiry = Date.now() + TRIAL_HOURS*60*60*1000;
localStorage.setItem("session",JSON.stringify({expiry}));

setInterval(updateTimer,1000);
}

function updateTimer(){
let s=JSON.parse(localStorage.getItem("session"));
if(!s) return;

let diff=s.expiry-Date.now();

if(diff<=0){
document.getElementById("expiredScreen").style.display="flex";
return;
}

let h=Math.floor(diff/3600000);
let m=Math.floor(diff%3600000/60000);
let sec=Math.floor(diff%60000/1000);

timer.innerText=`${h}:${m}:${sec}`;
trialInfo.innerText=`${h}h ${m}m left`;
}

/* LOAD ALL CHANNELS */
const SOURCES = {
countries:["ng","us","uk","in","fr","de","br","za","ca","au","jp","kr","cn","es","it","tr","mx","ae","sa","eg","ar","pk","id","ph","al"],
categories:["news","sports","movies","music","kids","comedy","documentary","business","science","travel"],
languages:["eng","spa","ara","fra","hin","zho","por"]
};

async function loadAll(){
all=[];

let urls=[
...SOURCES.countries.map(c=>`https://iptv-org.github.io/iptv/countries/${c}.m3u`),
...SOURCES.categories.map(c=>`https://iptv-org.github.io/iptv/categories/${c}.m3u`),
...SOURCES.languages.map(c=>`https://iptv-org.github.io/iptv/languages/${c}.m3u`)
];

await Promise.all(urls.map(u=>fetchM3U(u)));

filtered=[...all];
render();
stats();
}

async function fetchM3U(url){
try{
let res=await fetch(url);
let text=await res.text();

text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let link=a[i+1];
if(link && link.startsWith("http")){
if(!all.find(x=>x.url===link)){
all.push({name,url:link});
}
}
}
});
}catch(e){}
}

/* RENDER */
function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerText=c.name;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* STATS */
function stats(){
total.innerText=all.length;
live.innerText=all.length;
dead.innerText=0;
fav.innerText=0;
}

/* INIT */
if(localStorage.getItem("session")){
document.getElementById("authScreen").style.display="none";
startTrial();
loadAll();
}

</script>

</body>
</html>
