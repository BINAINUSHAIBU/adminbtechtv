<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV REAL LOGIN IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
overflow:hidden;
}

/* LOGIN SCREEN */
#authBox{
position:fixed;
inset:0;
background:#0b1220;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
}

input{
padding:10px;
margin:5px;
width:220px;
border:none;
border-radius:6px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1f2937;
color:white;
}

/* APP */
#app{
display:none;
height:100vh;
flex-direction:column;
}

.topbar{
padding:10px;
background:#111827;
display:flex;
justify-content:space-between;
}

.container{
display:flex;
flex:1;
}

.sidebar{
width:250px;
background:#0b1220;
padding:10px;
overflow:auto;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

video{
width:100%;
height:350px;
background:black;
}

.channels{
flex:1;
overflow:auto;
padding:10px;
}

.channel{
background:#111827;
padding:10px;
margin:5px 0;
border-radius:8px;
cursor:pointer;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.7);
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authBox">
<h2>📺 BTECH-TV LOGIN</h2>

<input id="email" placeholder="Email"/>
<input id="password" type="password" placeholder="Password"/>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- ================= APP ================= -->
<div id="app">

<div class="topbar">
<div>📺 BTECH-TV IPTV</div>
<button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="sidebar">
<h3>Channels</h3>
<div class="channel" onclick="playStream()">News Live</div>
<div class="channel" onclick="playStream()">Sports</div>
<div class="channel" onclick="playStream()">Movies</div>
</div>

<div class="main">

<video id="video" controls></video>

</div>

</div>
</div>

<script>

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ================= AUTH FUNCTIONS ================= */

function register(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,password)
.then(user=>{
alert("Registered: " + user.user.email);
})
.catch(err=>alert(err.message));
}

function login(){
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)
.then(user=>{
alert("Welcome " + user.user.email);
})
.catch(err=>alert(err.message));
}

function logout(){
auth.signOut();
}

/* ================= SESSION CONTROL ================= */
auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("authBox").style.display="none";
document.getElementById("app").style.display="flex";
}else{
document.getElementById("authBox").style.display="flex";
document.getElementById("app").style.display="none";
}
});

/* ================= IPTV PLAYER ================= */
function playStream(){
const video = document.getElementById("video");

if(Hls.isSupported()){
const hls = new Hls();
hls.loadSource("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
video.play();
}
}

</script>

</body>
</html>
