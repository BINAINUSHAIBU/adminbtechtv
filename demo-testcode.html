<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD ULTRA MAX X PRO MAX MERGED</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* TRIAL */
#trialLock{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999999;
text-align:center;
padding:20px;
}

/* SIDEBAR */
.sidebar{width:300px;background:#0d1324;padding:15px;overflow-y:auto;}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:10px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}

.nav-btn{
width:100%;padding:10px;margin:5px 0;
background:#121c33;border:none;border-radius:8px;
color:#fff;cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

.search-box input{
padding:10px;border-radius:8px;border:none;
background:#101a31;color:#fff;width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px}

.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;border-radius:10px;margin-bottom:10px;
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

.player{background:#000;border-radius:10px;overflow:hidden;height:320px;position:relative;}
video{width:100%;height:100%;}

.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,.85);
display:flex;justify-content:center;align-items:center;
}

.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.controls button{
padding:8px 10px;border:none;border-radius:6px;
background:#152445;color:#fff;cursor:pointer;
}
.controls button:hover{background:#00d4ff;color:#000}

.channels{
flex:1;overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}

.card{
background:#111a31;padding:10px;border-radius:10px;
cursor:pointer;border:1px solid #1f355d;
}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}

.badge{
background:red;padding:3px 6px;border-radius:10px;
font-size:10px;float:right;
}
</style>
</head>

<body>

<!-- TRIAL LOCK -->
<div id="trialLock">
<h1 style="color:#ff3b3b;">⛔ TRIAL EXPIRED</h1>
<p>Your 3-day trial has ended. Please upgrade to continue.</p>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH-TV WORLD ULTRA MAX X</div>
<div class="sub">PRO MAX MERGED SYSTEM</div>

<div class="menu-title">MAIN</div>
<button class="nav-btn" onclick="loadUltra()">Ultra Feeds</button>
<button class="nav-btn" onclick="shuffle()">Shuffle</button>
<button class="nav-btn" onclick="speedBoost()">Boost</button>

<div class="menu-title">COUNTRIES</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX SYSTEM</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ <div id="fav">0</div></div>
<div class="stat">🕘 <div id="rec">0</div></div>
<div class="stat">🌍 <div id="live">0</div></div>
</div>
</div>

<div class="player">
<div class="overlay" id="overlay">Loading...</div>
<video id="video" controls autoplay></video>
</div>

<div class="controls">
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
<button onclick="toggleMute()">🔊</button>
<button onclick="toggleFullscreen()">⛶</button>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

/* ================= TRIAL SYSTEM ================= */
const TRIAL_DAYS = 3;
const KEY = "btech_trial_start";

function checkTrial(){
let start = localStorage.getItem(KEY);

if(!start){
start = Date.now();
localStorage.setItem(KEY,start);
}

let diffDays = (Date.now() - parseInt(start)) / (1000*60*60*24);

if(diffDays > TRIAL_DAYS){
document.getElementById("trialLock").style.display="flex";
document.body.style.pointerEvents="none";
let v=document.getElementById("video");
if(v) v.pause();
return false;
}
}
checkTrial();

/* ================= IPTV APP ================= */

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
document.getElementById("overlay").style.display="flex";
const res=await fetch(url);
const text=await res.text();

all=[];

text.split("\n").forEach((l,idx,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let u=arr[idx+1];
if(u && u.startsWith("http")) all.push({name,url:u});
}
});

filtered=[...all];
render();
stats();
document.getElementById("overlay").style.display="none";
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else video.src=c.url;
}

function search(q){
filtered=all.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

function toggleMute(){video.muted=!video.muted;}
function toggleFullscreen(){video.requestFullscreen();}
function shuffle(){filtered.sort(()=>Math.random()-0.5);render();}
function speedBoost(){video.playbackRate=1.2;}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
}

loadUltra();

</script>
</body>
</html>
