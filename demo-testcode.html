<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV SAAS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050816;color:#fff}

/* LOGIN */
#login{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#050816;z-index:9999;
}

.card{
width:360px;background:#0f1830;
padding:25px;border-radius:12px;
border:1px solid #233b72;text-align:center;
}

input,button{
width:100%;padding:12px;margin:8px 0;
border:none;border-radius:8px;
}

input{background:#152445;color:#fff}
button{background:#00d4ff;font-weight:bold;cursor:pointer}

/* APP */
#app{display:none;height:100vh;display:flex}

/* SIDEBAR */
.sidebar{
width:260px;background:#0d1324;
padding:10px;overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.nav-btn{
width:100%;padding:10px;margin:5px 0;
background:#121c33;border:none;
color:#fff;border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px}

.topbar{
display:flex;justify-content:space-between;margin-bottom:10px;
}

.player{
height:320px;background:#000;
border-radius:10px;overflow:hidden;
}

video{width:100%;height:100%}

/* GRID */
.grid{
flex:1;overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;margin-top:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:8px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

.badge{background:red;font-size:10px;padding:3px 6px;border-radius:8px;float:right}

/* ADMIN */
.admin{
margin-top:10px;
background:#1a0d2b;
padding:10px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="card">
<h2>📺 BTECH-TV SAAS</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>
</div>

<!-- APP -->
<div id="app">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🌍 IPTV</h3>

<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>

<h3>👑 ADMIN</h3>
<button class="nav-btn" onclick="loadUsers()">Users</button>
<button class="nav-btn" onclick="loadStats()">Analytics</button>
<button class="nav-btn" onclick="upgrade()">Upgrade</button>
<button class="nav-btn" onclick="logout()">Logout</button>

<div class="admin" id="adminBox"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h3>LIVE IPTV PLAYER</h3>
<div>🔴 LIVE</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

let token="";
let all=[],hls;
let video=document.getElementById("video");

/* LOGIN (API READY) */
async function login(){

const res = await fetch("http://localhost:5000/api/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:pass.value
})
});

const data = await res.json();

if(!data.token){
alert("Login failed");
return;
}

token=data.token;

login.style.display="none";
app.style.display="flex";

load("ng");
}

/* LOAD IPTV */
async function load(code){

const res = await fetch(`http://localhost:5000/api/streams/countries/${code}`);
const text = await res.text();

all=[];

text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=a[i+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

render();
}

/* RENDER */
function render(){
grid.innerHTML="";
all.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(i);
grid.appendChild(div);
});
}

/* PLAY STREAM */
function play(i){
let c=all[i];

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* ADMIN: USERS */
async function loadUsers(){
const res=await fetch("http://localhost:5000/api/admin/users",{
headers:{Authorization:token}
});

const users=await res.json();

adminBox.style.display="block";
adminBox.innerHTML="<h4>Users</h4>";

users.forEach(u=>{
adminBox.innerHTML+=`
<div style="margin:5px;padding:5px;background:#111">
${u.email} ${u.banned?"🚫":"✔"}
<button onclick="banUser('${u._id}')">Ban</button>
</div>`;
});
}

/* BAN USER */
async function banUser(id){
await fetch(`http://localhost:5000/api/admin/ban/${id}`,{
method:"POST",
headers:{Authorization:token}
});
loadUsers();
}

/* ANALYTICS */
async function loadStats(){
const res=await fetch("http://localhost:5000/api/admin/stats",{
headers:{Authorization:token}
});

const s=await res.json();

adminBox.style.display="block";
adminBox.innerHTML=`
<h4>📊 Analytics</h4>
<p>Users: ${s.users}</p>
<p>Banned: ${s.banned}</p>
`;
}

/* UPGRADE */
function upgrade(){
alert("Connect Paystack / Flutterwave here");
}

/* LOGOUT */
function logout(){
location.reload();
}

</script>

</body>
</html>
