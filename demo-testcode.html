<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Channel Player</title>
  <style>
    body { background:#000; color:#fff; font-family:Arial; text-align:center; }
    video { width:80%; margin-top:30px; border-radius:10px; }
  </style>
</head>
<body>

<h2 id="title">Loading Channel...</h2>

<video controls autoplay>
  <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="video/mp4">
</video>

<br><br>
<a href="dashboard.html" style="color:#38bdf8;">⬅ Back to Dashboard</a>

<script>
const params = new URLSearchParams(window.location.search);
const channel = params.get("channel");

document.getElementById("title").innerText = "Channel: " + channel;
</script>

</body>
</html>
