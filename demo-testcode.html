<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BTECH CHURCH TV NETWORK + LIVE DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#07111f;
--panel:#0f172a;
--card:#182338;
--accent:#ffd700;
--text:#ffffff;
--muted:#94a3b8;
--hover:#233250;
--danger:#ef4444;
--success:#16a34a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:18px;
font-weight:bold;
color:var(--accent);
}

.topbar button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
background:var(--card);
color:white;
}

/* LAYOUT */
.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:340px;
background:#08101d;
padding:12px;
overflow:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:12px 0;
color:var(--accent);
font-size:14px;
}

/* PROGRAM CARD */
.card{
background:var(--card);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

input,textarea{
width:100%;
padding:8px;
margin-top:5px;
border:none;
border-radius:6px;
background:#0b1220;
color:white;
}

button{
width:100%;
margin-top:8px;
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-save{background:#16a34a;color:black;}
.btn-live{background:#ef4444;color:white;}
.btn-stop{background:#f59e0b;color:black;}

/* CHANNEL LIST */
.channel{
background:var(--card);
padding:10px;
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
}

.channel:hover{
background:var(--hover);
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:360px;
background:black;
position:relative;
}

.player video, .player iframe{
width:100%;
height:100%;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
display:none;
}

/* INFO BAR */
.info{
background:var(--panel);
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* PROGRAM LIST */
.program-item{
background:var(--card);
padding:8px;
margin-top:6px;
border-radius:6px;
cursor:pointer;
}

/* SEARCH */
.search{
padding:10px;
background:var(--panel);
display:flex;
gap:10px;
}

.search input{
flex:1;
}

/* GRID */
.grid{
flex:1;
overflow:auto;
padding:10px;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">✝ BTECH CHURCH TV NETWORK</div>
<button onclick="toggleLivePanel()">📡 Live Admin</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>✝ LIVE PROGRAM DASHBOARD</h3>

<div class="card">
<input id="title" placeholder="Program Title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="stream" placeholder="Stream URL (YouTube / HLS / MP4)">

<button class="btn-save" onclick="saveProgram()">Save Program</button>
<button class="btn-live" onclick="goLive()">🔴 Go Live</button>
<button class="btn-stop" onclick="stopLive()">⛔ Stop</button>
</div>

<h3>📺 Saved Programs</h3>
<div id="programList"></div>

<hr style="margin:10px 0;border:1px solid #1f2a44">

<h3>⛪ Church Channels</h3>
<div class="channel" onclick="loadChannel('RCCG LIVE')">✝ RCCG Live</div>
<div class="channel" onclick="loadChannel('Living Faith')">✝ Living Faith</div>
<div class="channel" onclick="loadChannel('Christ Embassy')">✝ Christ Embassy</div>
<div class="channel" onclick="loadChannel('Dunamis')">✝ Dunamis</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">

<div class="live-badge" id="liveBadge">🔴 LIVE</div>

<video id="video" controls></video>
<iframe id="frame" style="display:none;border:none;"></iframe>

</div>

<div class="info">
<div>
<b id="nowTitle">Welcome</b><br>
<small id="nowDesc">Church Streaming Platform</small>
</div>
</div>

<div class="search">
<input id="search" oninput="searchPrograms(this.value)" placeholder="Search programs...">
</div>

<div class="grid" id="grid"></div>

</div>

</div>

<script>

let programs = JSON.parse(localStorage.getItem("church_programs") || "[]");
let currentHls = null;

function renderPrograms(){
let list = document.getElementById("programList");
let grid = document.getElementById("grid");

list.innerHTML = "";
grid.innerHTML = "";

programs.forEach((p,i)=>{

let item = `<div class="program-item" onclick="playProgram(${i})">
<b>${p.title}</b><br>
<small>${p.desc}</small>
</div>`;

list.innerHTML += item;
grid.innerHTML += item;

});
}

function saveProgram(){
let title = document.getElementById("title").value;
let desc = document.getElementById("desc").value;
let stream = document.getElementById("stream").value;

if(!title || !stream){
alert("Fill required fields");
return;
}

programs.push({title,desc,stream});
localStorage.setItem("church_programs",JSON.stringify(programs));

renderPrograms();
alert("Saved!");
}

function playProgram(i){
let p = programs[i];
loadStream(p.stream,p.title,p.desc);
}

function loadStream(url,title,desc){

let video = document.getElementById("video");
let frame = document.getElementById("frame");

document.getElementById("nowTitle").innerText = title || "Live";
document.getElementById("nowDesc").innerText = desc || "";

document.getElementById("liveBadge").style.display="block";

if(url.includes("youtube")){
video.style.display="none";
frame.style.display="block";
frame.src = url.replace("watch?v=","embed/");
return;
}

frame.style.display="none";
video.style.display="block";

if(Hls.isSupported()){
if(currentHls) currentHls.destroy();

currentHls = new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src = url;
video.play();
}
}

function goLive(){
document.getElementById("liveBadge").style.display="block";
alert("🔴 Church LIVE Started");
}

function stopLive(){
document.getElementById("liveBadge").style.display="none";

let video = document.getElementById("video");
video.pause();
video.src="";

document.getElementById("frame").src="";
}

function loadChannel(name){
document.getElementById("nowTitle").innerText = name;
document.getElementById("nowDesc").innerText = "Live Church Broadcast";
}

function searchPrograms(q){
q = q.toLowerCase();
document.querySelectorAll(".program-item").forEach(el=>{
el.style.display = el.innerText.toLowerCase().includes(q) ? "block":"none";
});
}

function toggleLivePanel(){
alert("Live Admin Panel Active");
}

renderPrograms();

</script>

</body>
</html>
