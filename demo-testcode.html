<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Church Hosting Super Admin System</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:#fff;
}

header{
background:#111a2e;
padding:15px;
font-size:20px;
font-weight:bold;
text-align:center;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:260px;
background:#0f1a33;
padding:15px;
overflow:auto;
}

.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
cursor:pointer;
background:#1d2b4a;
color:white;
border-radius:5px;
}

.sidebar button:hover{
background:#2d4370;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.card{
background:#141f38;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

input, select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:5px;
border:none;
}

.btn{
padding:10px;
background:#2e6bff;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
margin-top:5px;
}

.btn-danger{background:red;}
.btn-green{background:green;}
.btn-yellow{background:orange;}

.small{
font-size:12px;
opacity:0.7;
}

.hidden{display:none;}
</style>
</head>

<body>

<header>⛪ CHURCH HOSTING SUPER ADMIN CONTROL PANEL</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('churches')">Church Management</button>
<button onclick="show('channels')">Channel Manager</button>
<button onclick="show('streams')">Live Streams</button>
<button onclick="show('controls')">Super Controls</button>
<button onclick="resetSystem()" class="btn-danger">RESET SYSTEM</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="card">
<h2>📊 Dashboard</h2>
<p>Total Churches: <span id="cCount">0</span></p>
<p>Total Channels: <span id="chCount">0</span></p>
<p>Blocked Items: <span id="bCount">0</span></p>
</div>

<!-- CHURCHES -->
<div id="churches" class="card hidden">
<h2>🏛 Church Management</h2>

<input id="churchName" placeholder="Church Name"/>
<input id="churchLocation" placeholder="Location (Nigeria etc.)"/>

<button class="btn" onclick="addChurch()">Add Church</button>

<div id="churchList"></div>
</div>

<!-- CHANNELS -->
<div id="channels" class="card hidden">
<h2>📺 Channel Manager</h2>

<select id="churchSelect"></select>
<input id="channelName" placeholder="Channel Name"/>
<input id="channelStream" placeholder="Stream URL (HLS / YouTube embed)"/>

<button class="btn" onclick="addChannel()">Create Channel</button>

<div id="channelList"></div>
</div>

<!-- STREAMS -->
<div id="streams" class="card hidden">
<h2>📡 Live Stream Tester</h2>

<input id="testStream" placeholder="Enter stream URL"/>
<button class="btn" onclick="playStream()">Play</button>

<video id="video" controls style="width:100%;margin-top:10px;"></video>
</div>

<!-- CONTROLS -->
<div id="controls" class="card hidden">
<h2>🛠 Super Admin Controls</h2>

<button class="btn btn-green" onclick="toggleSpeed()">⚡ Speed Boost</button>
<button class="btn btn-yellow" onclick="restartSystem()">♻ Restart System</button>
<button class="btn btn-danger" onclick="shutdown()">⛔ Shutdown System</button>

<p class="small">Controls simulate global IPTV/network behavior</p>
</div>

</div>
</div>

<script>

let churches = JSON.parse(localStorage.getItem("churches") || "[]");

function save(){
localStorage.setItem("churches", JSON.stringify(churches));
updateUI();
}

function show(id){
document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function addChurch(){
let name = churchName.value;
let loc = churchLocation.value;

if(!name) return alert("Enter church name");

churches.push({
name,
loc,
blocked:false,
channels:[]
});

save();
renderChurches();
}

function renderChurches(){
let html = "";
churches.forEach((c,i)=>{
html += `
<div class="card">
<h3>${c.name}</h3>
<p>${c.loc}</p>
<p>Status: ${c.blocked ? "🔴 Blocked" : "🟢 Active"}</p>

<button class="btn btn-danger" onclick="toggleChurch(${i})">Block/Unblock</button>
</div>`;
});
churchList.innerHTML = html;
updateChurchDropdown();
}

function toggleChurch(i){
churches[i].blocked = !churches[i].blocked;
save();
renderChurches();
}

function updateChurchDropdown(){
churchSelect.innerHTML = "";
churches.forEach((c,i)=>{
let opt = document.createElement("option");
opt.value = i;
opt.textContent = c.name;
churchSelect.appendChild(opt);
});
}

function addChannel(){
let i = churchSelect.value;
if(i === "") return;

churches[i].channels.push({
name: channelName.value,
stream: channelStream.value,
blocked:false
});

save();
renderChannels();
}

function renderChannels(){
let html = "";

churches.forEach((c,ci)=>{
c.channels.forEach((ch,ii)=>{
html += `
<div class="card">
<h3>${ch.name} (${c.name})</h3>
<p>${ch.stream}</p>

<button class="btn btn-danger" onclick="toggleChannel(${ci},${ii})">
Block/Unblock
</button>
</div>`;
});
});

channelList.innerHTML = html;
}

function toggleChannel(ci,ii){
churches[ci].channels[ii].blocked =
!churches[ci].channels[ii].blocked;
save();
renderChannels();
}

function playStream(){
let url = testStream.value;
let video = document.getElementById("video");

if(Hls.isSupported() && url.includes(".m3u8")){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src = url;
}
video.play();
}

let speed = false;

function toggleSpeed(){
speed = !speed;
alert(speed ? "⚡ Speed Boost ON" : "Speed Boost OFF");
}

function restartSystem(){
alert("♻ System Restarted (simulation)");
}

function shutdown(){
alert("⛔ System Shutdown (simulation)");
}

function resetSystem(){
localStorage.clear();
location.reload();
}

function updateUI(){
document.getElementById("cCount").innerText = churches.length;

let channels = 0;
let blocked = 0;

churches.forEach(c=>{
channels += c.channels.length;
if(c.blocked) blocked++;
c.channels.forEach(ch=>{
if(ch.blocked) blocked++;
});
});

document.getElementById("chCount").innerText = channels;
document.getElementById("bCount").innerText = blocked;
}

function init(){
renderChurches();
renderChannels();
updateUI();
}

init();

</script>

</body>
</html>
