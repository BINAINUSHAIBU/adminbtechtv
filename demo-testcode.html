<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0b0f1a"/>
<title>BTECH-TV WORLD ULTRA MAX X</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--premium:#8b5cf6;
--gold:#facc15;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

/* TOPBAR */
.topbar{
display:flex;align-items:center;justify-content:space-between;
padding:12px;background:#0f172a;border-bottom:1px solid #222;
}

.logo{color:var(--accent);font-weight:bold;font-size:18px;}

#trialBox{
margin-left:10px;
font-size:12px;
color:var(--gold);
background:#111827;
padding:6px 10px;
border-radius:8px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px);}

.sidebar{
width:260px;background:#0b1220;overflow:auto;padding:10px;
}

.main{flex:1;display:flex;flex-direction:column;}

/* PLAYER */
.player{height:320px;background:black;position:relative;}
video{width:100%;height:100%;}

/* CHANNELS */
.channels{flex:1;overflow:auto;padding:10px;}
.channel{padding:10px;background:#172033;margin-bottom:8px;cursor:pointer;border-radius:8px;}

/* OVERLAY */
.overlay{
position:absolute;inset:0;background:rgba(0,0,0,0.9);
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:10;
}

</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<div class="topbar">
<div class="logo">📺 BTECH-TV ULTRA MAX</div>
<div id="trialBox">Loading trial...</div>
</div>

<!-- ================= MAIN ================= -->
<div class="container">

<div class="sidebar">
<h3>Channels</h3>
<div onclick="loadUltraFeeds()" style="padding:8px;background:#172033;margin:5px;border-radius:6px;cursor:pointer;">Load IPTV</div>
</div>

<div class="main">

<div class="player">
<div class="overlay" id="overlay">
<h2>Loading...</h2>
</div>
<video id="video" controls autoplay></video>
</div>

<div class="channels" id="list"></div>

</div>
</div>

<!-- ================= SCRIPT ================= -->
<script>

let channels=[];
let currentIndex=0;
let hls;

const TRIAL_HOURS = 4;
const TRIAL_MS = TRIAL_HOURS * 60 * 60 * 1000;

let trialStart = localStorage.getItem("btech_trial_start");
let expired = false;

/* ================= TRIAL SYSTEM ================= */

function initTrial(){
if(!trialStart){
trialStart = Date.now();
localStorage.setItem("btech_trial_start", trialStart);
}
checkTrial();
setInterval(checkTrial, 10000);
}

function checkTrial(){
const elapsed = Date.now() - parseInt(trialStart);

if(elapsed >= TRIAL_MS){
expire();
return;
}

let remaining = TRIAL_MS - elapsed;
let h = Math.floor(remaining / 3600000);
let m = Math.floor((remaining % 3600000) / 60000);

document.getElementById("trialBox").innerText =
`⏳ Trial: ${h}h ${m}m left`;
}

function expire(){
expired = true;
document.body.innerHTML = upgradeUI();
}

function block(){
if(expired){
alert("Trial expired");
return true;
}
return false;
}

/* ================= UPGRADE SCREEN ================= */

function upgradeUI(){
return `
<div style="height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#050816;color:white;text-align:center;padding:20px;">
<h1 style="color:#00d4ff;font-size:40px;">Upgrade Required</h1>

<p style="max-width:400px;color:#94a3b8;margin-top:10px;">
Your 4-hour trial has ended. Upgrade to continue watching IPTV channels.
</p>

<div style="background:#111827;padding:20px;border-radius:12px;margin-top:20px;width:300px;">
<h3>Premium Plan</h3>
<p>✔ Unlimited Channels</p>
<p>✔ HD Streams</p>
<p>✔ No Limit</p>
<h2 style="color:#facc15;">₦1,999 / Month</h2>

<button onclick="alert('Payment gateway here')"
style="margin-top:10px;padding:10px 15px;background:#00d4ff;border:none;border-radius:8px;">
Upgrade Now
</button>

</div>
</div>
`;
}

/* ================= IPTV LOADER ================= */

async function loadUltraFeeds(){

if(block()) return;

document.getElementById("overlay").style.display="flex";

channels=[];

const url="https://iptv-org.github.io/iptv/index.m3u";

const res=await fetch(url);
const text=await res.text();

parseM3U(text);

render();

document.getElementById("overlay").style.display="none";
}

function parseM3U(data){
const lines=data.split("\n");

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith("#EXTINF")){
let name=lines[i].split(",")[1];
let url=lines[i+1];

if(url && url.startsWith("http")){
channels.push({name,url});
}
}
}
}

/* ================= RENDER ================= */

function render(){

let box=document.getElementById("list");
box.innerHTML="";

channels.forEach((c,i)=>{
let div=document.createElement("div");
div.className="channel";
div.innerHTML=c.name;
div.onclick=()=>play(i);
box.appendChild(div);
});
}

/* ================= PLAY ================= */

function play(i){

if(block()) return;

currentIndex=i;
let c=channels[i];

let video=document.getElementById("video");

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}

video.play();
}

/* ================= START ================= */

initTrial();

</script>

</body>
</html>
