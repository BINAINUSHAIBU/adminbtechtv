<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ULTRA MAX 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* LOGIN */
#login{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.box{
width:300px;
background:var(--panel);
padding:20px;
border-radius:10px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
}

button{
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* LAYOUT */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:260px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.card:hover{border-color:var(--accent)}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
margin-right:4px;
}

.free{background:var(--free)}
.paid{background:var(--paid)}
.locked{background:var(--locked);color:#000}

.admin-btn{display:none}

.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>🔐 ADMIN LOGIN</h3>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()">ENTER</button>
</div>
</div>

<div class="topbar">
<h3>🚀 ULTRA MAX IPTV</h3>
<div id="status">LOCKED</div>
</div>

<div class="container">

<div class="sidebar">
<h4>⚙ CONTROL</h4>
<button onclick="filterAll()">All</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterFree()">Free</button>
<button onclick="filterPaid()">Paid</button>
<input placeholder="Search..." oninput="search(this.value)">
</div>

<div class="main">
<div class="player">
<video id="video" controls></video>
</div>
<div class="list" id="list"></div>
</div>

<div class="right">
<h4>📊 STATS</h4>
<div class="stat">Total: <span id="t">0</span></div>
<div class="stat">Free: <span id="f">0</span></div>
<div class="stat">Paid: <span id="p">0</span></div>
<div class="stat">Locked: <span id="l">0</span></div>

<button class="admin-btn" onclick="lockAll()">🔒 Lock ALL</button>
<button class="admin-btn" onclick="unlockAll()">🔓 Unlock ALL</button>
<button class="admin-btn" onclick="deleteLocked()">❌ Delete Locked</button>
</div>

</div>

<script>

const ADMIN_PASS = "1234";
let isAdmin = false;

let channels = [];
let filtered = [];

function login(){
const p=document.getElementById("pass").value;

if(p === ADMIN_PASS){
document.getElementById("login").style.display="none";
document.getElementById("status").innerText="ADMIN MODE ACTIVE";
isAdmin = true;
document.querySelectorAll(".admin-btn").forEach(b=>b.style.display="block");
loadAPI();
}else alert("Wrong password");
}

/* SAVE */
function saveState(){
localStorage.setItem("channels", JSON.stringify(channels));
}

/* LOAD */
function loadState(){
const data = localStorage.getItem("channels");
if(data) channels = JSON.parse(data);
}

/* LOAD IPTV */
async function loadAPI(){
try{

loadState();

const [st]=await Promise.all([
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json())
]);

if(channels.length === 0){
let seen={};

st.forEach((s,idx)=>{
if(!s.url || seen[s.url]) return;
seen[s.url]=1;

channels.push({
id: s.channel || ("ch_"+idx),
name: s.title || "Channel",
url: s.url,
type: "free",
status: "free"
});
});
}

filtered=[...channels];
render();
stats();

document.getElementById("status").innerText="LIVE: "+channels.length;

}catch(e){console.log(e);}
}

/* FIND CHANNEL BY ID */
function getChannel(id){
return channels.find(c=>c.id===id);
}

/* RENDER */
function render(){
const box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c)=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
`;

div.onclick=()=>toggleLock(c.id);
div.ondblclick=()=>play(c.id);

box.appendChild(div);
});

stats();
}

/* PLAY */
function play(id){
const v=document.getElementById("video");
const c=getChannel(id);

if(!c || c.status==="locked"){
alert("Channel locked");
return;
}

if(Hls.isSupported()){
const h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else v.src=c.url;
}

/* TOGGLE LOCK (FIXED) */
function toggleLock(id){
if(!isAdmin) return alert("Admin only");

const c=getChannel(id);
if(!c) return;

c.status = c.status === "locked" ? "free" : "locked";

saveState();
render();
}

/* FILTERS */
function filterAll(){filtered=[...channels];render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterFree(){filtered=channels.filter(c=>c.status!=="locked");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* SEARCH */
function search(v){
filtered=channels.filter(c=>c.name.toLowerCase().includes(v.toLowerCase()));
render();
}

/* ADMIN ACTIONS (GLOBAL FIXED) */
function lockAll(){
channels.forEach(c=>c.status="locked");
saveState();
render();
}

function unlockAll(){
channels.forEach(c=>c.status="free");
saveState();
render();
}

function deleteLocked(){
channels = channels.filter(c=>c.status!=="locked");
saveState();
render();
}

/* STATS */
function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.status!=="locked").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
}

</script>

</body>
</html>
