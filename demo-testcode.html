<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV PRO MAX Subscription System</title>

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
}

.header{
background:#081126;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1e2f57;
}

.logo{
font-size:24px;
font-weight:900;
color:#00d4ff;
}

.container{
padding:20px;
max-width:1200px;
margin:auto;
}

.card{
background:#0f1d45;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
background:#101a31;
border:none;
border-radius:8px;
color:white;
}

button{
padding:12px 20px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.hidden{
display:none;
}

.plan-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.plan{
background:#101d39;
padding:20px;
border-radius:10px;
text-align:center;
}

.plan h2{
margin-bottom:10px;
}

.price{
font-size:30px;
font-weight:bold;
color:#00d4ff;
margin:10px 0;
}

.status{
font-size:18px;
padding:10px;
margin-top:10px;
border-radius:8px;
background:#152445;
}

.expired{
background:#5a1010;
}

.active{
background:#0f5d2d;
}

.player{
height:400px;
background:black;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
margin-top:20px;
}

.countdown{
font-size:18px;
margin-top:10px;
color:#00d4ff;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">📺 BTECH-TV PRO MAX</div>
<div id="userInfo">Guest</div>
</div>

<div class="container">

<!-- REGISTER -->

<div class="card" id="registerBox">

<h2>Create Account</h2>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">

<button onclick="registerUser()">
Start 7-Day Free Trial
</button>

</div>

<!-- DASHBOARD -->

<div class="card hidden" id="dashboard">

<h2>User Dashboard</h2>

<div id="welcome"></div>

<div id="statusBox" class="status"></div>

<div class="countdown" id="countdown"></div>

</div>

<!-- SUBSCRIPTION -->

<div class="card hidden" id="plans">

<h2>Subscription Plans</h2>

<div class="plan-grid">

<div class="plan">
<h2>Basic</h2>
<div class="price">₦5,000</div>
<p>30 Days Access</p>
<button onclick="payNow(5000)">
Subscribe
</button>
</div>

<div class="plan">
<h2>Premium</h2>
<div class="price">₦10,000</div>
<p>30 Days Access</p>
<button onclick="payNow(10000)">
Subscribe
</button>
</div>

<div class="plan">
<h2>Ultimate</h2>
<div class="price">₦20,000</div>
<p>30 Days Access</p>
<button onclick="payNow(20000)">
Subscribe
</button>
</div>

</div>

</div>

<!-- IPTV -->

<div class="card hidden" id="iptvSection">

<h2>IPTV Access Unlocked</h2>

<div class="player">
<h1>📺 IPTV PLAYER AREA</h1>
</div>

</div>

</div>

<script>

function registerUser(){

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;

if(!name || !email){
alert("Complete all fields");
return;
}

const trialEnd=Date.now()+(7*24*60*60*1000);

const user={
name,
email,
trialEnd,
subscriptionEnd:null
};

localStorage.setItem("iptvUser",JSON.stringify(user));

loadUser();
}

function loadUser(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userInfo")
.innerText=user.name;

document.getElementById("welcome")
.innerHTML=
"<h3>Welcome "+user.name+"</h3>";

checkAccess();
}

function checkAccess(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

const now=Date.now();

let active=false;

if(user.subscriptionEnd &&
now < user.subscriptionEnd){

active=true;

}else if(now < user.trialEnd){

active=true;
}

const box=document.getElementById("statusBox");

if(active){

box.className="status active";
box.innerHTML="✅ Active Subscription";

document.getElementById("iptvSection")
.classList.remove("hidden");

document.getElementById("plans")
.classList.add("hidden");

}else{

box.className="status expired";
box.innerHTML="❌ Trial Expired";

document.getElementById("plans")
.classList.remove("hidden");

document.getElementById("iptvSection")
.classList.add("hidden");
}

updateCountdown();
}

function updateCountdown(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

let expiry=
user.subscriptionEnd || user.trialEnd;

let diff=expiry-Date.now();

if(diff<0){
document.getElementById("countdown")
.innerHTML="Expired";
return;
}

let days=Math.floor(
diff/(1000*60*60*24)
);

document.getElementById("countdown")
.innerHTML=
"Access Ends In: "+days+" Days";
}

function payNow(amount){

let handler=PaystackPop.setup({

key:"YOUR_PAYSTACK_PUBLIC_KEY",

email:"customer@email.com",

amount:amount*100,

currency:"NGN",

callback:function(response){

let user=JSON.parse(
localStorage.getItem("iptvUser")
);

user.subscriptionEnd=
Date.now()+(30*24*60*60*1000);

localStorage.setItem(
"iptvUser",
JSON.stringify(user)
);

alert(
"Payment Successful\nReference: "
+response.reference
);

checkAccess();

}

});

handler.openIframe();
}

loadUser();

setInterval(checkAccess,5000);

</script>

</body>
</html>
