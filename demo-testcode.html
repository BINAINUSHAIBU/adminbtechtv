function render(){
let html="";
channels.slice(0,page*20).forEach((ch,index)=>{
html+=`
<tr>
<td>${ch.name}</td>
<td>${ch.category}</td>
<td>${ch.type}</td>
<td class="${ch.lock==='Locked'?'locked':'unlocked'}">${ch.lock}</td>
<td>
<button class="action lock" onclick="toggleLock(${index})">${ch.lock==='Locked'?'Unlock':'Lock'}</button>
<button class="action edit" onclick="editChannel(${index})">Edit</button>
<button class="action delete" onclick="deleteChannel(${index})">Delete</button>
</td>
</tr>`;
});
document.getElementById("grid").innerHTML=html;
}

function toggleLock(index){
channels[index].lock=
channels[index].lock==="Locked"?"Unlocked":"Locked";
render();
}

function editChannel(index){
let name=prompt("Edit Channel Name",channels[index].name);
if(name&&name.trim()!==""){
channels[index].name=name;
render();
}
}

function deleteChannel(index){
if(confirm("Delete "+channels[index].name+" ?")){
channels.splice(index,1);
render();
}
}

function loadMore(){
page++;
render();
}
