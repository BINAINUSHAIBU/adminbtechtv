<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV TRIAL 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN SCREEN */
.auth{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.auth-box{
background:#0d1324;
padding:20px;
border-radius:10px;
width:300px;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
background:#101a31;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:10px;
background:#00d4ff;
border:none;
border-radius:6px;
cursor:pointer;
}

/* HEADER */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

.timer{
background:#111827;
padding:6px 10px;
border-radius:8px;
color:#ffcc00;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0d1324;
padding:10px;
overflow-y:auto;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
color:#fff;
border-radius:6px;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:8px;
cursor:pointer;
}

/* PLAYER */
video{
width:100%;
height:320px;
background:#000;
}

</style>
</head>

<body>

<!-- ================= LOGIN / REGISTER ================= -->
<div class="auth" id="auth">

<div class="auth-box">

<h3>📺 IPTV TRIAL LOGIN</h3>

<input id="name" placeholder="Username">
<input id="pass" placeholder="Password" type="password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>
</div>

<!-- ================= APP ================= -->
<div style="flex:1;display:flex;flex-direction:column;">

<div class="topbar">
<div class="live">🔴 LIVE</div>
<div class="timer">⏳ <span id="time">00:00</span></div>
</div>

<div style="display:flex;flex:1;">

<!-- SIDEBAR -->
<div class="sidebar">

<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>
<button class="nav-btn" onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<video id="video" controls autoplay muted></video>

<div class="channels" id="grid"></div>

</div>

</div>
</div>

<script>

let all=[],filtered=[];
let video=document.getElementById("video");

/* ================= USER SYSTEM ================= */
function register(){
let u=document.getElementById("name").value;
let p=document.getElementById("pass").value;

if(!u||!p) return alert("Fill all fields");

localStorage.setItem("user",JSON.stringify({u,p,trial:300}));
alert("Registered! Now login");
}

function login(){
let u=document.getElementById("name").value;
let p=document.getElementById("pass").value;

let data=JSON.parse(localStorage.getItem("user"));

if(data && data.u===u && data.p===p){
document.getElementById("auth").style.display="none";

/* start trial */
startTrial(data);
}else{
alert("Invalid login");
}
}

function logout(){
localStorage.removeItem("active");
location.reload();
}

/* ================= TRIAL TIMER ================= */
let trial=0;
let timer;

function startTrial(user){
trial=user.trial || 300;
localStorage.setItem("active","1");

timer=setInterval(()=>{
trial--;

let m=Math.floor(trial/60);
let s=trial%60;

document.getElementById("time").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

if(trial<=0){
clearInterval(timer);
alert("⛔ Trial Expired - Upgrade Required");
video.pause();
document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:20%'>TRIAL EXPIRED</h1>";
}
},1000);
}

/* ================= IPTV LOAD ================= */
async function load(code){
let url=`https://iptv-org.github.io/iptv/countries/${code}.m3u`;
await loadM3U(url);
}

async function loadCat(cat){
let url=`https://iptv-org.github.io/iptv/categories/${cat}.m3u`;
await loadM3U(url);
}

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];

text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let u=a[i+1];
if(u && u.startsWith("http")){
all.push({name,url:u});
}
}
});

/* TRIAL LIMIT */
all=all.slice(0,50);

filtered=[...all];
render();
}

/* ================= CHANNELS ================= */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

filtered.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerText=c.name;
div.onclick=()=>play(i);
g.appendChild(div);
});
}

/* ================= PLAY ================= */
let hls;
function play(i){
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* AUTO LOGIN CHECK */
window.onload=()=>{
let u=localStorage.getItem("user");
if(u){
document.getElementById("auth").style.display="none";
startTrial(JSON.parse(u));
}
};

</script>

</body>
</html>
