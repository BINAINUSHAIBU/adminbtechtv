<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV SUPER ADMIN PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{color:var(--accent)}

.topbar input{
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
width:280px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px)}

.sidebar{
width:240px;
background:#0f1628;
padding:15px;
border-right:1px solid rgba(255,255,255,0.05);
overflow-y:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{background:var(--hover)}
.tab-active{background:var(--accent);color:black}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box p{color:var(--accent);font-size:20px;font-weight:bold}

/* GRID */
.grid{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
transition:0.3s;
border:1px solid transparent;
}

.card:hover{
transform:translateY(-3px);
border-color:var(--accent);
background:var(--hover);
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:#16a34a}
.paid{background:#dc2626}
.locked{background:#f59e0b;color:black}

button{
padding:8px 10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
margin-top:8px;
}

button:hover{opacity:0.8}
</style>
</head>

<body>

<div class="topbar">
<h2>🚀 BTECH IPTV SUPER ADMIN PRO MAX</h2>
<input placeholder="Search channels..." oninput="searchAll(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat tab-active" onclick="setCat('All',this)">📺 All Channels</div>
<div class="cat" onclick="setCat('Sports',this)">🏆 Sports</div>
<div class="cat" onclick="setCat('Movies',this)">🎬 Movies</div>
<div class="cat" onclick="setCat('News',this)">📰 News</div>
<div class="cat" onclick="setCat('Kids',this)">🧸 Kids</div>

<hr style="opacity:0.2;margin:10px 0">

<button onclick="loadAPI()">🚀 Load IPTV API</button>
<button onclick="generateChannels()">⚡ Generate Demo</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="stats">
<div class="box"><p id="t1">0</p><small>Total</small></div>
<div class="box"><p id="t2">0</p><small>Free</small></div>
<div class="box"><p id="t3">0</p><small>Paid</small></div>
<div class="box"><p id="t4">0</p><small>Locked</small></div>
</div>

<div class="grid" id="grid"></div>

</div>

</div>

<script>

/* =====================
STATE
===================== */
let all=[];
let filtered=[];
let cat='All';

/* =====================
LOAD IPTV API (MERGED ENGINE)
===================== */
async function loadAPI(){
try{

let [chRes,stRes,lgRes]=await Promise.all([
fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/logos.json').then(r=>r.json())
]);

let channelMap={},logoMap={};

for(let c of chRes) channelMap[c.id]=c;
for(let l of lgRes) if(!logoMap[l.channel]) logoMap[l.channel]=l.url;

let seen={};
all=[];

for(let s of stRes){
if(!s.url||seen[s.url]) continue;
seen[s.url]=1;

let ch=s.channel?channelMap[s.channel]:null;

all.push({
id:all.length+1,
name:ch?ch.name:(s.title||"Unknown"),
url:s.url,
category:ch?.categories?.[0]||"other",
type:Math.random()>0.5?"free":"paid",
status:Math.random()>0.9?"locked":"unlocked",
viewers:Math.floor(Math.random()*100000)
});
}

filtered=[...all];
render();
updateStats();

}catch(e){
console.log(e);
generateChannels();
}
}

/* =====================
GENERATOR
===================== */
function generateChannels(){
const cats=["Sports","Movies","News","Kids","Music","Africa"];
all=[];

for(let i=1;i<=200;i++){
all.push({
id:i,
name:"BTECH Channel "+i,
category:cats[i%cats.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"unlocked",
viewers:Math.floor(Math.random()*100000)
});
}

filtered=[...all];
render();
updateStats();
}

/* =====================
CATEGORY FILTER
===================== */
function setCat(c,el){
cat=c;

document.querySelectorAll(".cat")
.forEach(x=>x.classList.remove("tab-active"));

el.classList.add("tab-active");

filtered=c==="All"?all:all.filter(x=>x.category===c);
render();
}

/* =====================
SEARCH
===================== */
function searchAll(q){
q=q.toLowerCase();
filtered=all.filter(x=>
x.name.toLowerCase().includes(q)||
x.category.toLowerCase().includes(q)
);
render();
}

/* =====================
RENDER
===================== */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

for(let c of filtered){

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>📺 ${c.name}</h3>
<p>${c.category}</p>

<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>

<p>👥 ${c.viewers||0}</p>
`;

g.appendChild(div);
}
}

/* =====================
STATS
===================== */
function updateStats(){
document.getElementById("t1").innerText=all.length;
document.getElementById("t2").innerText=all.filter(x=>x.type==="free").length;
document.getElementById("t3").innerText=all.filter(x=>x.type==="paid").length;
document.getElementById("t4").innerText=all.filter(x=>x.status==="locked").length;
}

/* INIT */
generateChannels();

</script>

</body>
</html>
