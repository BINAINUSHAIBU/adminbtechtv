<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚀 BTECH-TV SUPER ADMIN PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{color:var(--accent)}

.topbar input{
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
width:280px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px)}

.sidebar{
width:240px;
background:#0f1628;
padding:15px;
border-right:1px solid rgba(255,255,255,0.05);
overflow-y:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{background:var(--hover)}

.tab-active{background:var(--accent);color:black}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box p{color:var(--accent);font-size:20px;font-weight:bold}

/* GRID */
.grid{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
background:var(--hover);
border:1px solid var(--accent);
}

/* BADGES */
.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:#16a34a}
.paid{background:#dc2626}
.online{background:#16a34a}
.offline{background:#dc2626}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
font-weight:bold;
margin-top:8px;
}

button:hover{opacity:0.85}

/* LIVE MONITOR */
.monitor{
position:fixed;
right:0;
top:65px;
width:320px;
height:calc(100vh - 65px);
background:#0f1628;
border-left:1px solid rgba(255,255,255,0.1);
display:flex;
flex-direction:column;
padding:10px;
}

.monitor h3{
color:var(--accent);
margin-bottom:10px;
}

video{
width:100%;
height:180px;
background:black;
border-radius:10px;
}

.liveList{
flex:1;
overflow:auto;
margin-top:10px;
}

.liveItem{
padding:8px;
background:var(--card);
margin-bottom:6px;
border-radius:8px;
cursor:pointer;
font-size:12px;
}

.liveItem:hover{background:var(--hover)}
</style>
</head>

<body>

<div class="topbar">
<h2>🚀 BTECH SUPER ADMIN PRO MAX</h2>
<input placeholder="Search channels..." oninput="searchAll(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat tab-active" onclick="switchTab('channels',this)">📺 Channels</div>

<hr style="opacity:0.2;margin:10px 0">

<button onclick="loadAPI()">🚀 Load IPTV API</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="stats">
<div class="box"><p id="t1">0</p><small>Total Channels</small></div>
<div class="box"><p id="t2">0</p><small>Free</small></div>
<div class="box"><p id="t3">0</p><small>Paid</small></div>
<div class="box"><p id="t4">0</p><small>Online</small></div>
</div>

<div class="grid" id="grid"></div>

</div>

</div>

<!-- LIVE MONITOR -->
<div class="monitor">
<h3>📺 LIVE IPTV MONITOR</h3>
<video id="player" controls></video>
<div class="liveList" id="liveList"></div>
</div>

<script>

/* =====================
STATE
===================== */
let channels=[];
let filtered=[];
let hls=null;

/* =====================
LOAD IPTV ENGINE (MERGED)
===================== */
async function loadAPI(){

channels=[];

try{
const [chRes,stRes]=await Promise.all([
fetch("https://iptv-org.github.io/api/channels.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json())
]);

let map={};

chRes.forEach(c=>{
map[c.id]=c;
});

let id=1;

stRes.forEach(s=>{
if(!s.url || s.url.includes("youtube")) return;

let ch=map[s.channel];

channels.push({
id:id++,
name: ch ? ch.name : (s.title || "Unknown"),
url: s.url,
type: Math.random()>0.5?"free":"paid",
status:"online"
});
});

}catch(e){
console.log("API failed → fallback M3U");
await loadM3UFallback();
}

filtered=[...channels];
render();
updateStats();
renderLiveList();
}

/* =====================
FALLBACK M3U ENGINE
===================== */
async function loadM3UFallback(){
try{
let r=await fetch("https://iptv-org.github.io/iptv/index.m3u");
let t=await r.text();

let lines=t.split("\n");
let temp={},id=1;

lines.forEach(l=>{
if(l.startsWith("#EXTINF")){
temp.name=l.split(",")[1]||"Channel";
}
if(l.startsWith("http")){
channels.push({
id:id++,
name:temp.name,
url:l,
type:"free",
status:"online"
});
}
});

}catch(e){
console.log("Fallback failed",e);
}
}

/* =====================
PLAYER
===================== */
function playStream(url){
let v=document.getElementById("player");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(v);
}else{
v.src=url;
}

v.play();
}

/* =====================
RENDER
===================== */
function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";

filtered.forEach(c=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>📺 ${c.name}</h3>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge online">${c.status}</span>
<button onclick="playStream('${c.url}')">▶ Play</button>
`;

grid.appendChild(div);
});
}

/* =====================
LIVE LIST
===================== */
function renderLiveList(){
let box=document.getElementById("liveList");
box.innerHTML="";

channels.forEach(c=>{
let div=document.createElement("div");
div.className="liveItem";

div.innerHTML=`
📺 ${c.name}<br>
<button onclick="playStream('${c.url}')">Play</button>
`;

box.appendChild(div);
});
}

/* =====================
STATS
===================== */
function updateStats(){
document.getElementById("t1").innerText=channels.length;
document.getElementById("t2").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("t3").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("t4").innerText=channels.filter(c=>c.status==="online").length;
}

/* =====================
SEARCH
===================== */
function searchAll(q){
q=q.toLowerCase();
filtered=channels.filter(c=>
(c.name||"").toLowerCase().includes(q)
);
render();
}

/* INIT */
loadAPI();

</script>

</body>
</html>
