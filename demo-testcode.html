<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BTECH-TV ULTIMATE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:#060b12;
color:white;
height:100vh;
overflow:hidden;

}

header{

height:70px;

background:#101927;

display:flex;

align-items:center;

justify-content:space-between;

padding:20px;

border-bottom:1px solid #222;

}

.logo{

font-size:26px;

font-weight:bold;

color:#00e6ff;

}

.logo span{

color:#00ff7f;

}

.search{

width:350px;

max-width:45%;

padding:12px;

border:none;

border-radius:30px;

background:#1c2736;

color:white;

}

button{

cursor:pointer;

}

.headerButtons button{

padding:10px 18px;

margin-left:8px;

border:none;

border-radius:8px;

background:#00b4ff;

color:white;

}

.container{

display:flex;

height:calc(100vh - 70px);

}

.sidebar{

width:270px;

background:#111b2a;

overflow:auto;

padding:15px;

}

.sidebar h2{

font-size:18px;

margin-bottom:15px;

color:#00ffea;

}

.category{

padding:12px;

margin-bottom:8px;

background:#162336;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

.category:hover{

background:#00b4ff;

}

.main{

flex:1;

display:flex;

flex-direction:column;

overflow:hidden;

}

.playerArea{

height:45%;

background:black;

display:flex;

justify-content:center;

align-items:center;

}

video{

width:100%;

height:100%;

background:black;

}

.channelHeader{

display:flex;

justify-content:space-between;

padding:12px 20px;

background:#121e2d;

}

.channelList{

flex:1;

overflow:auto;

padding:15px;

display:grid;

grid-template-columns:repeat(auto-fill,minmax(240px,1fr));

gap:12px;

}

.card{

background:#152338;

border-radius:12px;

padding:15px;

cursor:pointer;

transition:.3s;

}

.card:hover{

transform:scale(1.03);

background:#008cff;

}

.card h3{

font-size:16px;

margin-bottom:10px;

}

.card p{

font-size:13px;

opacity:.8;

}

footer{

height:40px;

display:flex;

align-items:center;

justify-content:center;

background:#111827;

}

.admin{

position:fixed;

top:70px;

right:0;

width:320px;

height:calc(100vh - 70px);

background:#08111b;

border-left:1px solid #222;

padding:20px;

overflow:auto;

display:none;

}

.admin h2{

margin-bottom:20px;

color:#00ffd5;

}

.stat{

background:#122236;

padding:12px;

margin-bottom:10px;

border-radius:8px;

}

.lock{

background:#ff4040!important;

}

.favorite{

color:gold;

}

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:#00aaff;

border-radius:20px;

}

</style>

</head>

<body>

<header>

<div class="logo">

BTECH<span>-TV</span>

</div>

<input

id="search"

class="search"

placeholder="Search channels..."

>

<div class="headerButtons">

<button onclick="toggleAdmin()">

ADMIN

</button>

<button onclick="toggleFullscreen()">

FULL

</button>

</div>

</header>

<div class="container">

<div class="sidebar">

<h2>Categories</h2>

<div class="category" onclick="filterCategory('ALL')">

All Channels

</div>

<div class="category" onclick="filterCategory('DSTV GENERAL')">

DSTV General

</div>

<div class="category" onclick="filterCategory('SPORT')">

Sports

</div>

<div class="category" onclick="filterCategory('MOVIES')">

Movies

</div>

<div class="category" onclick="filterCategory('ENTERTAINMENT')">

Entertainment

</div>

<div class="category" onclick="filterCategory('DOCUMENTARY')">

Documentary

</div>

<div class="category" onclick="filterCategory('NEWS')">

News

</div>

<div class="category" onclick="filterCategory('KIDS')">

Kids

</div>

<div class="category" onclick="filterCategory('MUSIC')">

Music

</div>

<div class="category" onclick="filterCategory('RELIGION')">

Religion

</div>

<div class="category" onclick="filterCategory('CANAL+')">

Canal+

</div>

<div class="category" onclick="showFavorites()">

Favorites

</div>

</div>

<div class="main">

<div class="playerArea">

<video

id="player"

controls

autoplay

></video>

</div>

<div class="channelHeader">

<div>

<h2 id="currentCategory">

All Channels

</h2>

</div>

<div>

<span id="count">

0

</span>

Channels

</div>

</div>

<div

class="channelList"

id="channelList"

>

</div>

</div>

</div>

<div

class="admin"

id="admin"

>

<h2>

SUPER ADMIN

</h2>

<div class="stat">

Users

<br>

<b>1</b>

</div>

<div class="stat">

Channels

<br>

<b id="adminCount">

0

</b>

</div>

<div class="stat">

Favorites

<br>

<b id="favCount">

0

</b>

</div>

<button style="width:100%;padding:14px;margin-top:20px;background:#00b4ff;border:none;border-radius:8px">

Refresh Playlist

</button>

</div>

<footer>

BTECH-TV ULTIMATE IPTV PLAYER

</footer>

<script>

/* JavaScript will be added in Part 2 */

</script>

</body>
</html>
