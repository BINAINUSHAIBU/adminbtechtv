```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BTECH TV WORLD PRO MAX SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0d1324;
padding:20px;
overflow-y:auto;
}

.logo{
font-size:24px;
font-weight:bold;
color:#00d4ff;
margin-bottom:20px;
}

.menu button{
width:100%;
padding:12px;
margin-bottom:8px;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
text-align:left;
}

.menu button:hover{
background:#1f355d;
}

.main{
flex:1;
display:flex;
flex-direction:column;
padding:15px;
overflow:hidden;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.search{
width:320px;
padding:12px;
border:none;
border-radius:8px;
background:#111a31;
color:white;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
}

.card{
background:#111a31;
padding:20px;
border-radius:10px;
text-align:center;
}

.player{
height:320px;
background:black;
border-radius:10px;
overflow:hidden;
margin-bottom:15px;
}

.player video{
width:100%;
height:100%;
}

.table-wrap{
flex:1;
overflow:auto;
background:#111a31;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0f1d45;
color:#00d4ff;
position:sticky;
top:0;
}

td,th{
padding:12px;
border-bottom:1px solid #1f355d;
text-align:left;
}

.action{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.lock{
background:#f59e0b;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

.load-more{
width:100%;
padding:14px;
background:#00d4ff;
border:none;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
📺 BTECH TV
</div>

<div class="menu">
<button>📊 Dashboard</button>
<button>📺 All Channels</button>
<button>🟢 Free Channels</button>
<button>💳 Pay To View</button>
<button>🚀 BTECH Super Channels</button>
<button>🔒 Locked Channels</button>
<button>👥 Users</button>
<button>💎 Subscription Plans</button>
<button>⚙ Settings</button>
</div>

</div>

<div class="main">

<div class="header">
<h2>BTECH TV WORLD PRO MAX</h2>

<input
class="search"
id="search"
placeholder="Search Channels..."
onkeyup="searchChannels()">
</div>

<div class="stats">

<div class="card">
<h3>Total Channels</h3>
<h1>40,000</h1>
</div>

<div class="card">
<h3>Free Channels</h3>
<h1>26,077</h1>
</div>

<div class="card">
<h3>Pay To View</h3>
<h1>13,923</h1>
</div>

<div class="card">
<h3>Locked</h3>
<h1>6,006</h1>
</div>

</div>

<div class="player">
<video id="player" controls autoplay muted></video>
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Channel</th>
<th>Category</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<button
class="load-more"
onclick="loadMore()">
LOAD MORE CHANNELS
</button>

</div>

</div>

<script>

const channels=[];
const categories=[
"Movies",
"Sports",
"Music",
"News",
"Kids",
"Documentary",
"Education",
"Entertainment"
];

for(let i=1;i<=40000;i++){

channels.push({

id:i,
name:`BTECH Channel ${i}`,

category:
categories[
Math.floor(
Math.random()*categories.length
)
],

type:
Math.random()>0.65
?
"Pay To View"
:
"Free",

status:
Math.random()>0.85
?
"Locked"
:
"Unlocked"

});

}

let page=1;

function render(){

const body=
document.getElementById(
"tableBody"
);

body.innerHTML="";

channels
.slice(0,page*50)
.forEach(c=>{

body.innerHTML+=`

<tr>

<td>${c.name}</td>

<td>${c.category}</td>

<td>${c.type}</td>

<td>${c.status}</td>

<td>

<button
class="action lock">
Lock
</button>

<button
class="action edit">
Edit
</button>

<button
class="action delete">
Delete
</button>

</td>

</tr>

`;

});

}

function loadMore(){

page++;

render();

}

function searchChannels(){

const value=
document
.getElementById("search")
.value
.toLowerCase();

const body=
document.getElementById(
"tableBody"
);

body.innerHTML="";

channels
.filter(c=>
c.name
.toLowerCase()
.includes(value)
)
.slice(0,100)
.forEach(c=>{

body.innerHTML+=`

<tr>

<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.type}</td>
<td>${c.status}</td>

<td>

<button class="action lock">
Lock
</button>

<button class="action edit">
Edit
</button>

<button class="action delete">
Delete
</button>

</td>

</tr>

`;

});

}

render();

</script>

</body>
</html>
