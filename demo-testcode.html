<!-- ================= SUPER ADMIN PANEL ================= -->
<div id="adminPanel" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#050816;
z-index:99999;
display:none;
overflow:auto;
padding:20px;
">

<h2 style="color:#00d4ff;">⚙️ SUPER ADMIN CONTROL PANEL</h2>

<div style="margin:10px 0;">
<button onclick="closeAdmin()" class="nav-btn">⬅ Close Panel</button>
<button onclick="resetSystem()" class="nav-btn">🔄 Reset System</button>
<button onclick="killSwitch()" class="nav-btn">🚨 KILL SWITCH</button>
</div>

<hr style="border:1px solid #1d2b4f;">

<h3 style="color:#00d4ff;">🔐 System Settings</h3>

<label><input type="checkbox" id="setPiP" onchange="saveSettings()"> Enable PiP</label><br>
<label><input type="checkbox" id="setScan" onchange="saveSettings()"> Enable Scan</label><br>
<label><input type="checkbox" id="setBoost" onchange="saveSettings()"> Enable Speed Boost</label><br>
<label><input type="checkbox" id="setRecord" onchange="saveSettings()"> Enable Record</label><br>
<label><input type="checkbox" id="setUltra" onchange="saveSettings()"> Enable Ultra Feeds</label><br>

<h3 style="color:#00d4ff;margin-top:20px;">📡 Channel Controls</h3>

<button onclick="disableAllChannels()" class="nav-btn">🚫 Disable All Channels</button>
<button onclick="enableAllChannels()" class="nav-btn">✅ Enable All Channels</button>

<h3 style="color:#00d4ff;margin-top:20px;">⏳ Trial Control</h3>

<input id="trialHours" placeholder="Set Trial Hours" style="padding:10px;width:200px;">
<button onclick="setTrial()" class="nav-btn">Set Trial</button>

<h3 style="color:#00d4ff;margin-top:20px;">📊 System Status</h3>
<div id="sysStatus" style="background:#111a31;padding:10px;border-radius:8px;"></div>

</div>
