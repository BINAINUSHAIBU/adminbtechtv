
<!DOCTYPE html>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.auth-card{
background:#0d1324;
padding:20px;
border-radius:10px;
width:320px;
border:1px solid #1d2b4f;
}

.auth-card input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
background:#101a31;
color:#fff;
}

.auth-card button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#00d4ff;
cursor:pointer;
font-weight:bold;
}

.small{font-size:12px;color:#8ea2d9;margin-top:8px}

/* EXPIRED SCREEN */
#expired{
position:fixed;
inset:0;
background:#050816;
display:none;
align-items:center;
justify-content:center;
z-index:99999;
text-align:center;
padding:20px;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}

.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:10px;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:8px;
}

.stat{
background:#101d39;
padding:8px;
border-radius:8px;
text-align:center;
}

/* PLAYER */
.player-container{
background:#000;
border-radius:10px;
overflow:hidden;
height:320px;
flex-shrink:0;
}

video{width:100%;height:100%;}

/* CONTROLS */
.controls{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:10px 0;
flex-shrink:0;
}

.controls button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#152445;
color:#fff;
cursor:pointer;
}
.controls button:hover{background:#00d4ff;color:#000}

/* CHANNELS */
.channel-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column;}

.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
transition:.3s;
}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}

.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

@media(max-width:900px){
body{flex-direction:column;}
.sidebar{width:100%;}
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>📺 IPTV TRIAL LOGIN</h3>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<div class="small">3-Day Trial System Active</div>
</div>
</div>

<!-- EXPIRED -->
<div id="expired">
<div>
<h1>⛔ TRIAL EXPIRED</h1>
<p>Your 3-day trial has ended.</p>
<button onclick="resetTrial()" style="padding:10px;margin-top:10px">Upgrade / Reset Demo</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X - TRIAL</div>

<div class="menu-title">🌍 Countries</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>

<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>
<button class="nav-btn" onclick="load('de')">🇩🇪 Germany</button>
<button class="nav-btn" onclick="load('br')">🇧🇷 Brazil</button>
<button class="nav-btn" onclick="load('za')">🇿🇦 South Africa</button>
<button class="nav-btn" onclick="load('ca')">🇨🇦 Canada</button>
<button class="nav-btn" onclick="load('au')">🇦🇺 Australia</button>

<button class="nav-btn" onclick="load('kr')">🇰🇷 South Korea</button>

<button class="nav-btn" onclick="load('pk')">🇵🇰 Pakistan</button>
<button class="nav-btn" onclick="load('id')">🇮🇩 Indonesia</button>

<button class="nav-btn" onclick="load('al')">🇦🇱 Albania</button>

<button class="nav-btn" onclick="speedBoost()">⚡ Boost</button>
<button class="nav-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM (TRIAL)</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ Fav <div id="fav">0</div></div>
<div class="stat">⚫ Dead <div id="dead">0</div></div>
<div class="stat">🌍 Live <div id="live">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="next()">▶ Next</button>
<button onclick="prev()">◀ Prev</button>
<button onclick="toggleMute()">🔊 Mute</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

/* ========== TRIAL SYSTEM ========== */

const TRIAL_DAYS = 3;

function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

if(!email||!pass)return alert("Fill all fields");

localStorage.setItem("user",JSON.stringify({email,pass}));

startTrial();
login();
}

function login(){
let user=JSON.parse(localStorage.getItem("user"));
if(!user)return alert("Register first");

let start=localStorage.getItem("trialStart");
if(!start){
startTrial();
start=Date.now();
}

checkExpiry();

document.getElementById("authBox").style.display="none";
}

function startTrial(){
localStorage.setItem("trialStart",Date.now());
}

function checkExpiry(){
let start=parseInt(localStorage.getItem("trialStart"));
let now=Date.now();

let diff=(now-start)/(1000*60*60*24);

if(diff>TRIAL_DAYS){
document.getElementById("expired").style.display="flex";
document.querySelector(".main").style.display="none";
document.querySelector(".sidebar").style.display="none";
}
}

function resetTrial(){
localStorage.clear();
location.reload();
}

/* ========== IPTV CORE (UNCHANGED) ========== */

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

let lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];
if(url && url.startsWith("http")) all.push({name,url});
}
}

filtered=[...all];
render();
stats();
}

function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

function toggleMute(){video.muted=!video.muted;}
function toggleFullscreen(){video.requestFullscreen();}

function speedBoost(){video.playbackRate=1.15;}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* AUTO CHECK */
setInterval(checkExpiry, 5000);

</script>

</body>
