<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SaaS Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

#saasDashboard{
padding:20px;
height:100vh;
overflow:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#172033;
padding:15px;
border-radius:12px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
background:#22304d;
color:white;
}

table{
width:100%;
background:#172033;
color:white;
border-collapse:collapse;
}

th,td{
padding:10px;
border:1px solid #22304d;
}
</style>
</head>

<body>

<div id="saasDashboard">

<h1>📺 BTECH-TV WORLD PRO MAX SaaS</h1>

<!-- ================= STATS ================= -->
<div class="grid">

<div class="card">
<h3>👥 Total Users</h3>
<h1 id="totalUsers">0</h1>
</div>

<div class="card">
<h3>🟢 Active Users</h3>
<h1 id="activeUsers">0</h1>
</div>

<div class="card">
<h3>⏳ Trial Users</h3>
<h1 id="trialUsers">0</h1>
</div>

<div class="card">
<h3>💰 Revenue</h3>
<h1 id="revenue">₦0</h1>
</div>

</div>

<hr>

<!-- ================= USERS ================= -->
<h2>👥 User Manager</h2>
<button onclick="createUser()">➕ Create User</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Package</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<hr>

<!-- ================= PACKAGES ================= -->
<h2>📦 Package Manager</h2>
<button onclick="createPackage()">➕ New Package</button>
<div id="packageList"></div>

<hr>

<!-- ================= CHANNELS ================= -->
<h2>📺 Channel Manager</h2>
<button onclick="addChannel()">➕ Add Channel</button>
<div id="channelManager"></div>

<hr>

<!-- ================= COUPONS ================= -->
<h2>🎟 Coupon Manager</h2>
<button onclick="createCoupon()">➕ Create Coupon</button>
<div id="couponList"></div>

<hr>

<!-- ================= PAYMENTS ================= -->
<h2>💳 Payment Manager</h2>
<div class="card">
Paystack Connected
<br><br>
<button>Configure Payments</button>
</div>

<hr>

<!-- ================= SETTINGS ================= -->
<h2>⚙️ System Settings</h2>

<label><input type="checkbox" checked> Enable Registration</label><br><br>
<label><input type="checkbox" checked> Enable Trial</label><br><br>
<label><input type="checkbox"> Maintenance Mode</label><br><br>

<button onclick="saveSettings()">💾 Save Settings</button>

</div>

<script>

/* ================= DEMO DATA ================= */

let users = [
{
name:"Admin",
email:"admin@btechtv.com",
package:"Gold",
status:"Active"
}
];

let packages = ["Trial","Basic","Premium","Gold"];

/* ================= LOAD DASHBOARD ================= */

function loadDashboard(){

document.getElementById("totalUsers").innerText = users.length;

document.getElementById("activeUsers").innerText =
users.filter(u => u.status === "Active").length;

document.getElementById("trialUsers").innerText =
users.filter(u => u.package === "Trial").length;

renderUsers();
renderPackages();
renderChannels();
}

/* ================= USERS ================= */

function renderUsers(){

let html = "";

users.forEach((u,i)=>{
html += `
<tr>
<td>${u.name}</td>
<td>${u.email}</td>
<td>${u.package}</td>
<td>${u.status}</td>
<td><button onclick="deleteUser(${i})">Delete</button></td>
</tr>`;
});

document.getElementById("userTable").innerHTML = html;
}

function createUser(){

let name = prompt("Enter user name");
if(!name) return;

users.push({
name,
email: name.toLowerCase()+"@mail.com",
package:"Trial",
status:"Active"
});

loadDashboard();
}

function deleteUser(i){
users.splice(i,1);
loadDashboard();
}

/* ================= PACKAGES ================= */

function renderPackages(){
document.getElementById("packageList").innerHTML =
packages.map(p => `<div class="card">${p}</div>`).join("");
}

function createPackage(){
let p = prompt("Package name");
if(!p) return;
packages.push(p);
renderPackages();
}

/* ================= CHANNELS ================= */

function renderChannels(){

let html = "";

if(typeof all !== "undefined"){
all.forEach(ch=>{
html += `
<div class="card">
${ch.name}
<select>
<option>Trial</option>
<option>Basic</option>
<option>Premium</option>
<option>Gold</option>
</select>
</div>`;
});
}

document.getElementById("channelManager").innerHTML = html;
}

function addChannel(){
alert("Connect backend API for real channel management");
}

/* ================= COUPONS ================= */

function createCoupon(){
alert("Coupon created (demo)");
}

/* ================= SETTINGS ================= */

function saveSettings(){
alert("Settings saved (demo)");
}

/* ================= INIT ================= */

setTimeout(loadDashboard,500);

</script>

</body>
</html>
