
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>BTECH-TV WORLD SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{

--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--danger:#ef4444;
--success:#22c55e;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:var(--bg);
color:var(--text);
overflow:hidden;
height:100vh;
display:flex;
flex-direction:column;

}

/* ===================================================== */
/* TOPBAR */
/* ===================================================== */

.topbar{

height:70px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.08);

}

.logo{

font-size:24px;
font-weight:bold;
color:var(--accent);

}

.top-actions{

display:flex;
gap:10px;
overflow:auto;

}

.top-actions button{

padding:10px 15px;
background:var(--card);
border:none;
border-radius:10px;
color:white;
cursor:pointer;

}

.top-actions button:hover{

background:var(--accent);
color:black;

}

/* ===================================================== */
/* LAYOUT */
/* ===================================================== */

.container{

flex:1;
display:flex;
overflow:hidden;

}

/* ===================================================== */
/* SIDEBAR */
/* ===================================================== */

.sidebar{

width:320px;
background:#08111f;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);

}

.sidebar h2{

margin:20px 0 10px;
color:var(--accent);
font-size:18px;

}

.menu{

display:flex;
flex-direction:column;
gap:10px;

}

.menu button{

padding:14px;
border:none;
border-radius:12px;
background:var(--card);
color:white;
cursor:pointer;
text-align:left;

}

.menu button:hover{

background:var(--hover);

}

/* ===================================================== */
/* MAIN */
/* ===================================================== */

.main{

flex:1;
display:flex;
flex-direction:column;

}

/* ===================================================== */
/* PLAYER */
/* ===================================================== */

.player{

height:380px;
background:black;
position:relative;

}

.player video{

width:100%;
height:100%;
object-fit:contain;

}

.live{

position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;

}

.overlay{

position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
z-index:10;

}

/* ===================================================== */
/* NOW PLAYING */
/* ===================================================== */

.now{

background:#0f172a;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;

}

.controls{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.controls button{

padding:10px 14px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;

}

.controls button:hover{

background:var(--hover);

}

/* ===================================================== */
/* SEARCH */
/* ===================================================== */

.search{

padding:15px;
background:#111827;
display:flex;
gap:10px;

}

.search input{

flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;

}

/* ===================================================== */
/* CHANNELS */
/* ===================================================== */

.channels{

flex:1;
overflow:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;

}

.channel{

background:var(--card);
padding:14px;
border-radius:14px;
cursor:pointer;
transition:.3s;
display:flex;
justify-content:space-between;
align-items:center;

}

.channel:hover{

background:var(--hover);

}

.channel img{

width:60px;
height:60px;
border-radius:12px;
object-fit:cover;

}

.info{

display:flex;
gap:12px;
align-items:center;

}

.badge{

padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;

}

.free{
background:var(--success);
}

.premium{
background:#8b5cf6;
}

.dead{
background:var(--danger);
}

/* ===================================================== */
/* ADMIN PANEL */
/* ===================================================== */

.admin-panel{

position:fixed;
inset:0;
background:rgba(0,0,0,.96);
z-index:99999;
display:none;
overflow:auto;
padding:30px;

}

.admin-header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}

.admin-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

}

.admin-grid button{

padding:18px;
border:none;
border-radius:14px;
background:#172033;
color:white;
font-size:14px;
cursor:pointer;

}

.admin-grid button:hover{

background:var(--accent);
color:black;

}

/* ===================================================== */
/* RESPONSIVE */
/* ===================================================== */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
height:280px;
}

.player{
height:250px;
}

.channels{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- ===================================================== -->
<!-- TOPBAR -->
<!-- ===================================================== -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD SUPER ADMIN
</div>

<div class="top-actions">

<button onclick="loadUltraFeeds()">🚀 Ultra Feeds</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
<button onclick="shuffleChannels()">🎲 Shuffle</button>
<button onclick="toggleMiniPlayer()">📺 Mini Player</button>
<button onclick="sleepTimer()">⏰ Sleep</button>
<button onclick="scanStreams()">📡 Scan</button>
<button onclick="speedBoost()">⚡ Boost</button>
<button onclick="openAdminPanel()">🛡 Super Admin</button>

</div>

</div>

<!-- ===================================================== -->
<!-- LAYOUT -->
<!-- ===================================================== -->

<div class="container">

<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div class="sidebar">

<h2>🌍 Countries</h2>

<div class="menu">

<button>🇳🇬 Nigeria</button>
<button>🇺🇸 USA</button>
<button>🇬🇧 UK</button>
<button>🇮🇳 India</button>
<button>🇩🇪 Germany</button>
<button>🇫🇷 France</button>
<button>🇧🇷 Brazil</button>
<button>🇯🇵 Japan</button>
<button>🇨🇳 China</button>
<button>🇸🇦 Saudi Arabia</button>

</div>

<div class="menu">

<button>📰 News</button>
<button>⚽ Sports</button>
<button>🎬 Movies</button>
<button>🎵 Music</button>
<button>👶 Kids</button>
<button>😂 Comedy</button>
<button>📚 Documentary</button>

</div>

<h2>🗣 Languages</h2>

<div class="menu">

<button>🇬🇧 English</button>
<button>🇪🇸 Spanish</button>
<button>🇸🇦 Arabic</button>
<button>🇫🇷 French</button>

</div>

</div>

<!-- ===================================================== -->
<!-- MAIN -->
<!-- ===================================================== -->

<div class="main">

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
></video>

<div class="overlay" id="overlay">
BTECH-TV WORLD
</div>

</div>

<div class="now">

<div>

<h2 id="channelName">
No Channel Selected
</h2>

<p>
BTECH-TV WORLD ULTRA MAX X
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>
<button onclick="nextChannel()">Next ▶</button>
<button onclick="togglePiP()">📺 PiP</button>
<button onclick="shareChannel()">🔗 Share</button>
<button onclick="muteToggle()">🔊 Mute</button>

</div>

</div>

<div class="search">

<input
type="text"
placeholder="Search IPTV Channels..."
oninput="searchChannels(this.value)"
>

</div>

<div class="channels" id="channelList">

<!-- CHANNELS GENERATED HERE -->

</div>

</div>

</div>

<!-- ===================================================== -->
<!-- SUPER ADMIN PANEL -->
<!-- ===================================================== -->

<div class="admin-panel" id="adminPanel">

<div class="admin-header">

<h1>🛡 SUPER ADMIN CONTROL PANEL</h1>

<button onclick="closeAdminPanel()">
✖ Close Panel
</button>

</div>

<div class="admin-grid">

<button onclick="scanAllStreams()">📡 Scan All Streams</button>
<button onclick="repairStreams()">🛠 Repair Streams</button>
<button onclick="speedBoost()">⚡ Speed Boost</button>
<button onclick="optimizeMemory()">🧠 Optimize Memory</button>
<button onclick="recordMode()">⏺ Record Mode</button>
<button onclick="loadUltraFeeds()">🚀 Global Feeds</button>
<button onclick="backupSystem()">💾 Backup System</button>
<button onclick="restartPlayer()">♻ Restart Player</button>
<button onclick="shutdownSystem()">⛔ Shutdown System</button>
<button onclick="premiumMode()">💎 Premium Mode</button>

<button onclick="blockAllChannels()">⛔ Block Channels</button>
<button onclick="unblockAllChannels()">✅ Unblock Channels</button>
<button onclick="stopAllStreams()">🛑 Stop Streams</button>
<button onclick="disableSite()">🚫 Disable Site</button>
<button onclick="enableSite()">🌐 Enable Site</button>

<button onclick="lockPlayer()">🔒 Lock Player</button>
<button onclick="unlockPlayer()">🔓 Unlock Player</button>

<button onclick="kickUsers()">👥 Kick Users</button>
<button onclick="clearCache()">🧹 Clear Cache</button>
<button onclick="blackoutScreen()">🌑 Blackout</button>

<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
<button onclick="exportFavorites()">⬇ Export</button>
<button onclick="toggleMiniPlayer()">📺 Mini Player</button>

</div>

</div>

<!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script>

let video=document.getElementById('video');

let channels=[

{
name:'Das Erste HD',
country:'Germany',
group:'News',
logo:'https://via.placeholder.com/60',
url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
},

{
name:'BBC Travel',
country:'Germany',
group:'Travel',
logo:'https://via.placeholder.com/60',
url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
},

{
name:'Comedy Central',
country:'Germany',
group:'Comedy',
logo:'https://via.placeholder.com/60',
url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
}

];

let current=0;

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

channels.forEach((c,i)=>{

box.innerHTML+=`

<div class="channel" onclick="playChannel(${i})">

<div class="info">

<img src="${c.logo}">

<div>

<h4>${c.name}</h4>

<p>${c.country}</p>

</div>

</div>

<div>

<span class="badge free">
FREE
</span>

</div>

</div>

`;

});

}

function playChannel(i){

current=i;

const ch=channels[i];

document.getElementById('channelName').innerText=
ch.name;

document.getElementById('overlay').style.display='none';

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(ch.url);

hls.attachMedia(video);

}else{

video.src=ch.url;

}

}

function nextChannel(){

current++;

if(current>=channels.length){
current=0;
}

playChannel(current);

}

function prevChannel(){

current--;

if(current<0){
current=channels.length-1;
}

playChannel(current);

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

function shareChannel(){

navigator.clipboard.writeText(video.currentSrc);

alert('Stream Link Copied');

}

function muteToggle(){

video.muted=!video.muted;

}

function searchChannels(q){

q=q.toLowerCase();

document.querySelectorAll('.channel').forEach(ch=>{

ch.style.display=
ch.innerText.toLowerCase().includes(q)
? 'flex'
: 'none';

});

}

function toggleTheme(){

document.body.classList.toggle('light');

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

function shuffleChannels(){

channels.sort(()=>Math.random()-0.5);

renderChannels();

}

function toggleMiniPlayer(){

alert('Mini Player Enabled');

}

function sleepTimer(){

setTimeout(()=>{

video.pause();

},1800000);

alert('30 Minute Sleep Timer');

}

function scanStreams(){

alert('Scanning Streams');

}

function speedBoost(){

video.playbackRate=1.25;

alert('Boost Enabled');

}

function openAdminPanel(){

document.getElementById('adminPanel').style.display='block';

}

function closeAdminPanel(){

document.getElementById('adminPanel').style.display='none';

}

function scanAllStreams(){

alert('Scanning All Streams');

}

function repairStreams(){

alert('Repairing Streams');

}

function optimizeMemory(){

alert('Memory Optimized');

}

function recordMode(){

alert('Record Mode Enabled');

}

function backupSystem(){

alert('System Backup Complete');

}

function restartPlayer(){

video.load();

alert('Player Restarted');

}

function shutdownSystem(){

video.pause();

document.body.innerHTML='
<div style="height:100vh;display:flex;justify-content:center;align-items:center;background:black;color:red;font-size:40px;">
SYSTEM SHUTDOWN
</div>';

}

function premiumMode(){

alert('Premium Mode Activated');

}

function blockAllChannels(){

document.querySelectorAll('.channel').forEach(ch=>{

ch.style.pointerEvents='none';
ch.style.opacity='.4';

});

alert('Channels Blocked');

}

function unblockAllChannels(){

document.querySelectorAll('.channel').forEach(ch=>{

ch.style.pointerEvents='auto';
ch.style.opacity='1';

});

alert('Channels Unblocked');

}

function stopAllStreams(){

video.pause();

video.removeAttribute('src');

alert('Streams Stopped');

}

function disableSite(){

document.body.style.pointerEvents='none';

alert('Site Disabled');

}

function enableSite(){

document.body.style.pointerEvents='auto';

alert('Site Enabled');

}

function lockPlayer(){

document.querySelector('.player').style.pointerEvents='none';

}

function unlockPlayer(){

document.querySelector('.player').style.pointerEvents='auto';

}

function kickUsers(){

localStorage.clear();

alert('Users Removed');

}

function clearCache(){

localStorage.clear();

sessionStorage.clear();

alert('Cache Cleared');

}

function blackoutScreen(){

document.body.innerHTML='
<div style="height:100vh;background:black;"></div>';

}

function exportFavorites(){

alert('Favorites Exported');

}

function loadUltraFeeds(){

alert('Global IPTV Loaded');

}

renderChannels();

</script>

</body>
</html>
