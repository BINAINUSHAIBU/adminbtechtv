<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📺 BTECH-TV PRO MAX | SUPER ADMIN IPTV SYSTEM</title>

<meta name="theme-color" content="#050816"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0b1220;
overflow:auto;
padding:12px;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:20px;
font-weight:900;
color:var(--accent);
margin-bottom:10px;
}

.section-title{
margin:15px 0 8px;
color:var(--accent);
font-size:14px;
font-weight:bold;
}

.btn{
width:100%;
padding:8px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
font-weight:bold;
}

.header{
padding:8px;
background:#0b1220;
color:var(--accent);
}

/* DASH */
.dashboard{
padding:8px;
background:#0b1220;
display:flex;
gap:10px;
}

.dashboard input{
flex:1;
padding:8px;
border:none;
border-radius:6px;
}

/* STATS */
.stats{
display:flex;
gap:10px;
padding:8px;
font-size:12px;
}

.stat{
background:#111827;
padding:6px 10px;
border-radius:6px;
}

/* PLAYER */
.player{
height:280px;
background:black;
}

video{
width:100%;
height:100%;
}

/* TABLE */
.table-wrap{
flex:1;
overflow:auto;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:6px;
border-bottom:1px solid #22304d;
font-size:12px;
}

button{
padding:4px 6px;
margin:2px;
border:none;
border-radius:4px;
cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
.container{flex-direction:column}
.sidebar{width:100%;height:220px}
.player{height:200px}
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<div class="section-title">🌍 Countries</div>
<button class="btn">🇳🇬 Nigeria 🇺🇸 USA 🇬🇧 UK 🇮🇳 India</button>
<button class="btn">🇫🇷 France 🇩🇪 Germany 🇧🇷 Brazil 🇿🇦 SA</button>
<button class="btn">🇨🇦 Canada 🇦🇺 Australia 🇯🇵 Japan 🇰🇷 Korea</button>
<button class="btn">🇨🇳 China 🇪🇸 Spain 🇮🇹 Italy 🇹🇷 Turkey</button>
<button class="btn">🇲🇽 Mexico 🇦🇪 UAE 🇸🇦 Saudi 🇪🇬 Egypt</button>
<button class="btn">🇦🇷 Argentina 🇵🇰 Pakistan 🇮🇩 Indonesia 🇵🇭 Philippines 🇦🇱 Albania</button>

<div class="section-title">🎬 Categories</div>
<button class="btn">📰 News ⚽ Sports 🎬 Movies 🎵 Music</button>
<button class="btn">👶 Kids 😂 Comedy 📚 Documentary</button>
<button class="btn">💼 Business 🔬 Science ✈ Travel</button>

<div class="section-title">🔥 Tools</div>
<button class="btn">📡 Scan</button>
<button class="btn">⚡ Boost</button>
<button class="btn">🛠 Repair</button>
<button class="btn">🧠 Optimize</button>
<button class="btn">⚙ Admin</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>📺 SUPER ADMIN IPTV SYSTEM</div>
<div>🔴 LIVE</div>
</div>

<div class="header">
📺 BTECH-TV PRO MAX | GLOBAL IPTV ENGINE
</div>

<div class="dashboard">
<input placeholder="Search Channels..." oninput="search(this.value)">
</div>

<div class="stats">
<div class="stat">📺 Channels: <span id="count">46</span></div>
<div class="stat">⚡ CDN Active</div>
<div class="stat">🧠 AI Ready</div>
<div class="stat">🌍 Global Feed</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>

<script>

/* ================= CHANNEL DATABASE (46+) ================= */

let channels = [
{name:"ACNN (480p)",cat:"Sports",type:"Free",status:"Unlocked"},
{name:"Advocate Broadcasting Network",cat:"News",type:"Pay",status:"Locked"},
{name:"Africa TV3",cat:"Music",type:"Pay",status:"Unlocked"},
{name:"BCS StarCross TV",cat:"Education",type:"Free",status:"Unlocked"},
{name:"Bride TV",cat:"Kids",type:"Pay",status:"Unlocked"},
{name:"Channels TV",cat:"Music",type:"Pay",status:"Unlocked"},
{name:"LN247",cat:"Sports",type:"Free",status:"Unlocked"},
{name:"LoveWorld USA",cat:"Music",type:"Free",status:"Unlocked"},
{name:"NTA International",cat:"News",type:"Pay",status:"Locked"},
{name:"Silverbird News 24",cat:"News",type:"Pay",status:"Unlocked"},
{name:"TVC",cat:"Sports",type:"Free",status:"Unlocked"},
{name:"TVC News",cat:"News",type:"Pay",status:"Locked"},
{name:"Wazobia Max TV",cat:"Kids",type:"Free",status:"Unlocked"},
{name:"Wap TV",cat:"Education",type:"Pay",status:"Locked"},
{name:"Sunna TV",cat:"Music",type:"Free",status:"Locked"}
];

let filtered=[...channels];
let video=document.getElementById("video");
let hls;

/* ================= RENDER ================= */
function render(){
let tbody=document.getElementById("tbody");
tbody.innerHTML="";

filtered.forEach((c,i)=>{
tbody.innerHTML+=`
<tr>
<td>${c.name}</td>
<td>${c.cat}</td>
<td>${c.type}</td>
<td>${c.status}</td>
<td>
<button onclick="play()">Play</button>
<button onclick="lock(${i})">Lock</button>
<button onclick="del(${i})">Del</button>
</td>
</tr>`;
});

document.getElementById("count").innerText=filtered.length;
}
render();

/* ================= PLAY ================= */
function play(){
let url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(Hls.isSupported()){
if(hls) hls.destroy();
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

/* ================= SEARCH ================= */
function search(v){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
|| c.cat.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* ================= ACTIONS ================= */
function lock(i){
filtered[i].status =
filtered[i].status==="Locked"?"Unlocked":"Locked";
render();
}

function del(i){
channels.splice(i,1);
filtered=[...channels];
render();
}

</script>

</body>
</html>
