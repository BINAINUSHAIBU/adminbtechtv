    'italy':'IT',
    'spain':'ES',

    'canada':'CA',
    'brazil':'BR',
    'japan':'JP',

    'china':'CN',
    'south africa':'ZA',
    'ghana':'GH',
    'kenya':'KE',
    'egypt':'EG',

    'argentina':'AR',
    'portugal':'PT',
    'netherlands':'NL',
    'sweden':'SE',
    'norway':'NO',
    'uae':'AE',

}

// ─────────────────────────────────────────────
// ENHANCED parseM3U
// ─────────────────────────────────────────────

var oldParse=parseM3U;

parseM3U=function(t){

  var parsed=oldParse(t);

  for(var i=0;i<parsed.length;i++){

    if(!parsed[i].cc){
      parsed[i].cc=detectCountry(parsed[i].n);
    }

    if(!parsed[i].cat){
      parsed[i].cat='Live TV';
    }

    // Auto HD labels
    if(parsed[i].n.match(/4k|2160/i)){
      parsed[i].q='4K';
    }else if(parsed[i].n.match(/1080|fhd/i)){
      parsed[i].q='1080p';
    }else if(parsed[i].n.match(/720|hd/i)){
      parsed[i].q='HD';
    }

    // Auto categories
    if(parsed[i].n.match(/sport|football|nba|ufc|wwe/i)){
      parsed[i].cat='Sports';
    }

    if(parsed[i].n.match(/movie|cinema|film/i)){
      parsed[i].cat='Movies';
    }

    if(parsed[i].n.match(/music|radio|dj/i)){
      parsed[i].cat='Music';
    }

    if(parsed[i].n.match(/news|cnn|bbc/i)){
      parsed[i].cat='News';
    }

    if(parsed[i].n.match(/kids|cartoon|baby/i)){
      parsed[i].cat='Kids';
    }

  }

  return parsed;
};
