```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Church Security Center - Enable 2FA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

.header{
background:#111a2e;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
color:#06b6d4;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
}

.card{
background:#111a2e;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.card h2{
color:#06b6d4;
margin-bottom:20px;
}

input,
select{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
border-radius:8px;
background:#1a2742;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#06b6d4;
color:white;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:.9;
}

.status{
margin-top:15px;
padding:15px;
background:#14532d;
border-radius:8px;
display:none;
}

.logs{
margin-top:20px;
background:#000;
padding:15px;
height:220px;
overflow:auto;
border-radius:10px;
font-family:monospace;
}

.badge{
display:inline-block;
padding:8px 15px;
background:#14532d;
border-radius:20px;
margin-bottom:15px;
}

</style>
</head>
<body>

<div class="header">
🔐 ENABLE TWO-FACTOR AUTHENTICATION
</div>

<div class="container">

<div class="card">

<div class="badge">
Security Center
</div>

<h2>Enable 2FA Protection</h2>

<input
type="email"
id="adminEmail"
placeholder="Administrator Email">

<select id="method">
<option>Email Verification</option>
<option>SMS Verification</option>
<option>Google Authenticator</option>
<option>Microsoft Authenticator</option>
</select>

<button onclick="enable2FA()">
Enable 2FA
</button>

<div id="status" class="status">
✅ Two-Factor Authentication Enabled Successfully
</div>

</div>

<div id="logs" class="logs">
SYSTEM READY...
</div>

</div>

<script>

function log(message){

const logs =
document.getElementById("logs");

logs.innerHTML +=
"<br>[" +
new Date().toLocaleTimeString() +
"] " + message;

logs.scrollTop =
logs.scrollHeight;

}

function enable2FA(){

const email =
document.getElementById("adminEmail").value;

const method =
document.getElementById("method").value;

if(email === ""){

alert("Please enter administrator email");

return;

}

document.getElementById("status")
.style.display = "block";

log(
"2FA Enabled for " +
email +
" using " +
method
);

alert(
"Two-Factor Authentication Enabled Successfully"
);

}

</script>

</body>
</html>
```
