<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN OVERLAY */
#auth{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#111827;
padding:20px;
border-radius:10px;
width:320px;
text-align:center;
}

.auth-box input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
background:#0d1324;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#00d4ff;
cursor:pointer;
font-weight:bold;
}

/* TIMER */
#timer{
position:absolute;
top:10px;
right:10px;
background:#ff0033;
padding:6px 10px;
border-radius:20px;
font-size:13px;
}

/* SIDEBAR */
.sidebar{width:300px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px;}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}

.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}

.search-box input{
padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px;}

.hero{background:linear-gradient(135deg,#07132f,#0f1d45);padding:10px;border-radius:10px;margin-bottom:10px;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}

.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;}

video{width:100%;height:100%;}

.controls{display:flex;gap:8px;margin:10px 0;}

.controls button{
padding:8px;border:none;border-radius:6px;background:#152445;color:#fff;cursor:pointer;
}

.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
}

/* EXPIRED SCREEN */
#expired{
position:fixed;
inset:0;
background:#000;
display:none;
justify-content:center;
align-items:center;
z-index:10000;
text-align:center;
padding:20px;
}

#expired button{
padding:10px 20px;
margin-top:10px;
border:none;
background:#00d4ff;
color:#000;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-box">
    <h2>📺 IPTV TRIAL ACCESS</h2>
    <input id="email" placeholder="Enter Email">
    <input id="pass" type="password" placeholder="Create Password">
    <button onclick="register()">Start Trial</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- EXPIRED -->
<div id="expired">
  <div>
    <h1>⛔ TRIAL EXPIRED</h1>
    <p>Your 4-hour trial has ended.</p>
    <button onclick="upgrade()">Upgrade to PRO</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn">Scan</button>
<button class="nav-btn">Boost</button>
<button class="nav-btn">Repair</button>
<button class="nav-btn">Optimize</button>

</div>

<!-- MAIN -->
<div class="main">

<div id="timer">⏳ 00:00:00</div>

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="next()">Next</button>
<button onclick="prev()">Prev</button>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* ===== TRIAL SYSTEM ===== */
const TRIAL_HOURS = 4;

function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(!email||!pass)return alert("Fill all fields");

localStorage.setItem("user",JSON.stringify({email,pass}));

startTrial();
}

function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

let user=JSON.parse(localStorage.getItem("user"));

if(user && user.email===email && user.pass===pass){
startTrial(true);
}else{
alert("Invalid login");
}
}

function startTrial(resume=false){
let now=Date.now();
let start=localStorage.getItem("startTime");

if(!start || !resume){
start=now;
localStorage.setItem("startTime",start);
}

document.getElementById("auth").style.display="none";
checkExpiry();
setInterval(updateTimer,1000);
}

/* TIMER */
function updateTimer(){
let start=parseInt(localStorage.getItem("startTime"));
let end=start+(TRIAL_HOURS*3600*1000);
let now=Date.now();

let diff=end-now;

if(diff<=0){
expire();
return;
}

let h=Math.floor(diff/3600000);
let m=Math.floor(diff%3600000/60000);
let s=Math.floor(diff%60000/1000);

document.getElementById("timer").innerText=
`⏳ ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function checkExpiry(){
let start=parseInt(localStorage.getItem("startTime"));
let end=start+(TRIAL_HOURS*3600*1000);

if(Date.now()>end){
expire();
}
}

function expire(){
document.getElementById("expired").style.display="flex";
document.querySelector(".main").style.display="none";
document.querySelector(".sidebar").style.display="none";
document.getElementById("timer").style.display="none";
}

/* UPGRADE */
function upgrade(){
alert("Redirecting to payment page...");
}

/* ===== IPTV CORE ===== */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((line,idx,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
stats();
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
}

load("ng");

</script>

</body>
</html>
