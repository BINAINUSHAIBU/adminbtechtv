<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV Trial Demo</title>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:40px}
button{padding:12px 24px;font-size:18px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8)}
#box{background:#222;padding:20px;max-width:400px;margin:10% auto}
</style>
</head>
<body>
<h1>Open Website</h1>
<p>2-Minute Trial</p>
<div id="timer">02:00</div>
<button onclick="startTrial()">Start Trial</button>
<div id="popup"><div id="box">
<h2>Subscription Required</h2>
<p>Choose Package</p>
<button>Monthly</button>
<button>Quarterly</button>
<button>Yearly</button>
<p>Flutterwave Payment → Payment Successful → Premium Activated → Watch Unlimited</p>
</div></div>
<script>
let t=120,i;
function startTrial(){
 clearInterval(i);
 i=setInterval(()=>{
  t--;
  let m=String(Math.floor(t/60)).padStart(2,'0');
  let s=String(t%60).padStart(2,'0');
  timer.textContent=m+':'+s;
  if(t<=0){clearInterval(i);popup.style.display='block';}
 },1000);
}
</script>
</body></html>
