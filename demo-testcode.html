<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX V2 ULTRA</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff}

header{
padding:12px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{display:flex;height:calc(100vh - 50px)}

.sidebar{width:300px;background:#0f172a;padding:10px;overflow:auto}

.main{flex:1;display:flex;flex-direction:column}

.video{height:360px;background:black}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#1f2937;
padding:10px;
border-radius:10px;
cursor:pointer;
position:relative;
}

.lock{
position:absolute;
top:8px;
right:8px;
background:red;
font-size:11px;
padding:3px 6px;
border-radius:5px;
}

button,input{padding:10px;margin:5px;border:none;border-radius:6px}

.panel{
position:fixed;
inset:0;
background:#000000ee;
display:none;
padding:20px;
overflow:auto;
}

small{color:#aaa}
</style>
</head>

<body>

<header>
<div>📺 BTECH-TV WORLD PRO MAX V2 ULTRA</div>
<div>
<button onclick="openAdmin()">Admin</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<!-- LOGIN -->
<div id="loginBox" style="padding:20px">
<h2>🔐 Login / Register</h2>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🌍 GLOBAL IPTV</h3>

<button onclick="loadAllChannels()">🌍 Load ALL Channels</button>

<hr>

<h3>👤 USER</h3>
<p id="userInfo"></p>

<h3>💳 PLAN</h3>
<p id="planInfo"></p>

<button onclick="upgrade()">💎 Upgrade</button>

<hr>

<h3>🔥 TOOLS</h3>
<button onclick="boost()">⚡ Boost</button>
<button onclick="pip()">📺 PiP</button>
<button onclick="clearRecents()">🗑 Recents</button>
<button onclick="record()">⏺ Record</button>
<button onclick="repair()">🛠 Repair</button>
<button onclick="optimize()">🧠 Optimize</button>

<hr>

<button onclick="lockAll()">🔒 Lock All</button>
<button onclick="unlockAll()">🔓 Unlock All</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="video">
<video id="video" controls autoplay style="width:100%;height:100%"></video>
</div>

<div class="list" id="list"></div>

</div>

</div>

</div>

<!-- ADMIN -->
<div class="panel" id="admin">

<h2>🧑‍💼 ADMIN DASHBOARD</h2>
<button onclick="closeAdmin()">Close</button>

<h3>📊 Analytics</h3>
<p id="analytics"></p>

<h3>📺 Channel Control</h3>
<div id="adminList"></div>

</div>

<script>

/* ================= USERS ================= */
let user=null;
let role="free";
let expiry=0;

let users=JSON.parse(localStorage.getItem("users")||"{}");
let unlocked=JSON.parse(localStorage.getItem("unlock")||"{}");
let stats=JSON.parse(localStorage.getItem("stats")||"{}");

/* ================= CHANNEL ENGINE ================= */
let channels=[];

let sources=[
"https://iptv-org.github.io/iptv/index.m3u",
"https://iptv-org.github.io/iptv/index.country.m3u",
"https://iptv-org.github.io/iptv/index.category.m3u",
"https://iptv-org.github.io/iptv/index.language.m3u"
];

function save(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("unlock",JSON.stringify(unlocked));
localStorage.setItem("stats",JSON.stringify(stats));
}

/* ================= GLOBAL LOADER ================= */
async function loadAllChannels(){

alert("🌍 Loading ALL GLOBAL CHANNELS...");

channels=[];

for(let url of sources){

try{
let res=await fetch(url);
let text=await res.text();
parseM3U(text);
}catch(e){
console.log("Failed:",url);
}

}

removeDup();
render();
alert("✅ ALL CHANNELS LOADED");
}

/* ================= M3U PARSER ================= */
function parseM3U(data){

let lines=data.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].includes("#EXTINF")){

let url=lines[i+1];
if(!url || !url.startsWith("http")) continue;

let name=lines[i].split(",").pop();

channels.push({
id:channels.length+1,
name,
url
});

}

}

}

/* ================= REMOVE DUP ================= */
function removeDup(){

let seen=new Set();

channels=channels.filter(c=>{
let key=c.name+c.url;
if(seen.has(key)) return false;
seen.add(key);
return true;
});

}

/* ================= PLAY ================= */
function play(url){

let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
}else v.src=url;

stats.plays=(stats.plays||0)+1;
save();
}

/* ================= RENDER ================= */
function render(){

let list=document.getElementById("list");
list.innerHTML="";

channels.forEach((c,i)=>{

let locked=role==="free"&&!unlocked[i];

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
${locked?'<div class="lock">LOCK</div>':''}
<b>${c.name}</b>
`;

div.onclick=()=>{
if(locked){alert("Upgrade Required");return;}
play(c.url);
};

list.appendChild(div);

});

updateAdmin();
}

/* ================= LOGIN ================= */
function register(){
users[email.value]={pass:pass.value,role:"free",expiry:Date.now()+86400000};
save();
alert("Registered");
}

function login(){
if(!users[email.value]||users[email.value].pass!==pass.value){
alert("Wrong login");return;
}

user=email.value;
role=users[user].role;
expiry=users[user].expiry;

loginBox.style.display="none";
app.style.display="block";
render();
}

/* ================= UPGRADE ================= */
function upgrade(){
role="premium";
users[user].role="premium";
save();
render();
alert("Upgraded");
}

/* ================= ADMIN ================= */
function openAdmin(){admin.style.display="block";updateAdmin();}
function closeAdmin(){admin.style.display="none";}

function updateAdmin(){
analytics.innerText=
"Users: "+Object.keys(users).length+
" | Channels: "+channels.length+
" | Plays: "+(stats.plays||0);

adminList.innerHTML="";

channels.slice(0,20).forEach((c,i)=>{

let div=document.createElement("div");
div.style="padding:10px;background:#111;margin:5px";

div.innerHTML=c.name;

adminList.appendChild(div);

});

}

/* ================= TOOLS ================= */
function boost(){video.playbackRate=1.15;}
function pip(){video.requestPictureInPicture();}
function clearRecents(){alert("Cleared");}
function record(){alert("Recording Ready");}
function repair(){alert("Repair Mode");}
function optimize(){alert("Optimized");}

/* ================= LOCK ================= */
function lockAll(){unlocked={};save();render();}
function unlockAll(){channels.forEach((c,i)=>unlocked[i]=true);save();render();}

/* ================= LOGOUT ================= */
function logout(){location.reload();}

</script>

</body>
</html>
