// ─────────────────────────────────────────────
// PARSE M3U
// ─────────────────────────────────────────────

function parseM3U(text){

  var lines=text.split('\n');
  var channels=[];
  var current=null;

  lines.forEach(function(line){

    line=line.trim();

    if(line.startsWith('#EXTINF')){

      current={};

      var name=line.split(',').pop();

      current.name=name;

    }
    else if(line && !line.startsWith('#')){

      if(current){

        current.url=line;

        channels.push(current);

        current=null;

      }

    }

  });

  return channels;

}

// ─────────────────────────────────────────────
// LOAD CHANNELS
// ─────────────────────────────────────────────

async function loadChannels(){

  all=[];

  document.getElementById('status').innerText=
  '🌍 LOADING CHANNELS...';

  for(let feed of extraFeeds){

    try{

      let res=await fetch(feed.url);

      let txt=await res.text();

      let parsed=parseM3U(txt);

      parsed.forEach(function(c){

        c.category=feed.name;

      });

      all=all.concat(parsed);

    }catch(e){

      console.log('FAILED',feed.name);

    }

  }

  filtered=all;

  renderChannels();

  document.getElementById('status').innerText=
  '🌍 MEGA IPTV ACTIVE · '+all.length+' CHANNELS';

}

      <div class="channel-meta">
        ${c.category}

    `;

    div.onclick=function(){

      playChannel(c.url);

    };

    list.appendChild(div);

  });

}

// ─────────────────────────────────────────────
// PLAY CHANNEL
// ─────────────────────────────────────────────

function playChannel(url){

  var video=document.getElementById('video');

  if(Hls.isSupported()){

    if(hls){
      hls.destroy();
    }

    hls=new Hls();

    hls.loadSource(url);

    hls.attachMedia(video);

  }else{

    video.src=url;

  }

}

  });

  renderChannels();

});

/* =========================================================
ENHANCED parseM3U
WITHOUT REMOVING ORIGINAL FEATURES
========================================================= */

const originalParse=parseM3U;

parseM3U=function(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=
info.match(/tvg-logo="(.*?)"/);

const countryMatch=
info.match(/tvg-country="(.*?)"/);

let quality='SD';

if(name.match(/4k|2160/i)){
quality='4K';
}
else if(name.match(/1080|fhd/i)){
quality='1080p';
}
else if(name.match(/720|hd/i)){
quality='HD';
}

const cc=
countryMatch
? countryMatch[1]
: detectCountry(name);

all.push({

id:all.length+1,

name:name,

url:url,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60',

country:cc || '',

group:group || 'Live TV',

quality:quality,

type:'free'

});

}

}

};
