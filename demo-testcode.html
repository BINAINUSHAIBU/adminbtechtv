<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>BTECH-TV WORLD MOBILE PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#08111f;
--panel:#101827;
--card:#162033;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--danger:#ef4444;
--success:#22c55e;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
height:100vh;
}

button,input,select{
outline:none;
border:none;
}

.app{
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
}

/* TOP BAR */

.topbar{
height:60px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid rgba(255,255,255,.05);
flex-shrink:0;
}

.logo{
font-size:20px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.top-actions{
display:flex;
gap:8px;
overflow-x:auto;
scrollbar-width:none;
}

.top-actions::-webkit-scrollbar{
display:none;
}

.top-actions button{
background:var(--card);
color:white;
padding:8px 12px;
border-radius:10px;
font-size:12px;
white-space:nowrap;
min-width:max-content;
}

.top-actions button.active{
background:var(--accent);
color:black;
}

/* PLAYER */

.player-wrap{
position:relative;
background:black;
width:100%;
aspect-ratio:16/9;
flex-shrink:0;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
font-size:11px;
font-weight:bold;
border-radius:30px;
z-index:5;
}

.loader{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

.loader h1{
font-size:50px;
margin-bottom:10px;
}

.loader p{
font-size:14px;
color:var(--muted);
}

/* INFO BAR */

.info-bar{
background:var(--panel);
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
}

.channel-title{
font-size:17px;
font-weight:bold;
}

.channel-group{
font-size:12px;
color:var(--muted);
margin-top:3px;
}

.controls{
display:flex;
gap:8px;
overflow-x:auto;
scrollbar-width:none;
}

.controls::-webkit-scrollbar{
display:none;
}

.controls button{
background:var(--card);
color:white;
padding:10px 14px;
border-radius:10px;
font-size:12px;
white-space:nowrap;
}

/* SEARCH */

.search-area{
padding:10px;
background:var(--panel);
display:flex;
gap:10px;
flex-shrink:0;
}

.search-area input,
.search-area select{
background:#0b1220;
color:white;
padding:12px;
border-radius:10px;
font-size:14px;
}

.search-area input{
flex:1;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
-webkit-overflow-scrolling:touch;
}

.channel{
background:var(--card);
padding:12px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
transition:.2s;
border:1px solid transparent;
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.channel-left{
display:flex;
align-items:center;
gap:12px;
overflow:hidden;
flex:1;
}

.channel img{
width:58px;
height:58px;
border-radius:12px;
object-fit:cover;
background:black;
flex-shrink:0;
}

.channel-info{
overflow:hidden;
}

.channel-info h4{
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:5px;
}

.channel-info p{
font-size:12px;
color:var(--muted);
}

.channel-right{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:6px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:10px;
font-weight:bold;
}

.live{
background:var(--success);
}

.offline{
background:var(--danger);
}

.fav{
font-size:18px;
}

.stats{
padding:8px 12px;
font-size:12px;
color:var(--muted);
background:#0b1220;
text-align:center;
border-top:1px solid rgba(255,255,255,.05);
}

/* MOBILE */

@media(max-width:768px){

.logo{
font-size:16px;
}

.player-wrap{
aspect-ratio:16/9;
}

.controls button{
padding:9px 12px;
font-size:11px;
}

.channel img{
width:52px;
height:52px;
}

}

/* LARGE */

@media(min-width:900px){

.app{
display:grid;
grid-template-columns:350px 1fr;
grid-template-rows:60px auto;
}

.topbar{
grid-column:1/3;
}

.channels{
height:calc(100vh - 260px);
}

.player-side{
display:flex;
flex-direction:column;
overflow:hidden;
}

}

</style>
</head>

<body>

<div class="app">

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-actions">

<button class="active" onclick="setFilter('all',this)">
ALL
</button>

<button onclick="setFilter('favs',this)">
⭐ FAVS
</button>

<button onclick="setFilter('recent',this)">
🕘 RECENT
</button>

<button onclick="toggleTheme()">
🌙 THEME
</button>

</div>

</div>

<!-- CHANNEL LIST -->

<div class="channels" id="channelList"></div>

<!-- PLAYER SIDE -->

<div class="player-side">

<div class="player-wrap">

<div class="live-badge">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
preload="metadata"
></video>

<div class="loader" id="loader">
<h1>📡</h1>
<p id="loadText">Loading Channels...</p>
</div>

</div>

<div class="info-bar">

<div>

<div class="channel-title" id="channelName">
No Channel Selected
</div>

<div class="channel-group" id="channelGroup">
BTECH-TV GLOBAL STREAMING
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>

<button onclick="nextChannel()">Next ▶</button>

<button onclick="togglePiP()">📺 PiP</button>

<button onclick="shareChannel()">🔗 Share</button>

<button onclick="toggleMute()">🔊 Sound</button>

</div>

</div>

<div class="search-area">

<input
type="text"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">
<option value="az">A-Z</option>
<option value="za">Z-A</option>
</select>

</div>

<div class="stats" id="stats">
0 Channels Loaded
</div>

</div>

</div>

<script>

let allChannels=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;

const favs=JSON.parse(localStorage.getItem('btech_favs')||'{}');
let recent=JSON.parse(localStorage.getItem('btech_recent')||'[]');

const video=document.getElementById('video');

const PLAYLIST='https://iptv-org.github.io/iptv/index.country.m3u';

/* LOAD PLAYLIST */

async function loadChannels(){

showLoader('Loading BTECH-TV World Channels...');

try{

const response=await fetch(PLAYLIST);

const text=await response.text();

parseM3U(text);

filteredChannels=[...allChannels];

renderChannels();

hideLoader();

updateStats();

}catch(err){

showLoader('Failed to Load Playlist');

console.log(err);

}

}

/* PARSE */

function parseM3U(data){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')) continue;

const name=info.split(',').pop();

const logoMatch=info.match(/tvg-logo="(.*?)"/);

const logo=logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60';

const countryMatch=info.match(/tvg-country="(.*?)"/);

const country=countryMatch
? countryMatch[1]
: '';

allChannels.push({

id:allChannels.length+1,
name,
url,
logo,
country,
group:'Global IPTV'

});

}

}

}

/* RENDER */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="channel-left">

<img src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'">

<div class="channel-info">

<h4>${c.name}</h4>

<p>${c.country || 'Global IPTV'}</p>

</div>

</div>

<div class="channel-right">

<div class="badge live">
LIVE
</div>

<div class="fav">
${favs[c.id] ? '⭐':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel) return;

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.country || 'Global IPTV';

if(currentHls){
currentHls.destroy();
}

video.pause();

video.removeAttribute('src');

if(Hls.isSupported()){

currentHls=new Hls({

maxBufferLength:8,
maxMaxBufferLength:12,
liveSyncDurationCount:2,
liveMaxLatencyDurationCount:4,
enableWorker:true,
lowLatencyMode:true,
backBufferLength:5

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play().catch(()=>{});

});

currentHls.on(Hls.Events.ERROR,function(event,data){

if(data.fatal){

console.log('HLS ERROR',data);

nextChannel();

}

});

}else{

video.src=channel.url;

video.play().catch(()=>{});

}

addRecent(channel.id);

renderChannels();

}

/* CONTROLS */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

function toggleMute(){

video.muted=!video.muted;

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

function shareChannel(){

const channel=filteredChannels[currentIndex];

if(!channel) return;

navigator.clipboard.writeText(channel.url);

alert('Channel URL Copied');

}

/* FILTERS */

function searchChannels(q){

const val=q.toLowerCase();

filteredChannels=allChannels.filter(c=>

c.name.toLowerCase().includes(val) ||
c.country.toLowerCase().includes(val)

);

renderChannels();

updateStats();

}

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

function setFilter(type,btn){

document.querySelectorAll('.top-actions button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){

filteredChannels=[...allChannels];

}

if(type==='favs'){

filteredChannels=allChannels.filter(c=>favs[c.id]);

}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=allChannels.find(c=>c.id===id);

if(ch) filteredChannels.push(ch);

});

}

renderChannels();

updateStats();

}

/* RECENT */

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'btech_recent',
JSON.stringify(recent)
);

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#08111f':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#101827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#162033':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* LOADER */

function showLoader(text){

document.getElementById('loader').style.display='flex';

document.getElementById('loadText').innerText=text;

}

function hideLoader(){

document.getElementById('loader').style.display='none';

}

/* STATS */

function updateStats(){

document.getElementById('stats').innerText=

filteredChannels.length + ' Channels Loaded';

}

/* KEYBOARD */

document.addEventListener('keydown',e=>{

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

/* START */

loadChannels();

</script>

</body>
</html>
