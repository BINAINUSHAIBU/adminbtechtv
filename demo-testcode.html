<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV ULTRA CONTROL PANEL</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--success:#16a34a;
--danger:#ef4444;
--warn:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
display:flex;
gap:8px;
padding:10px;
background:var(--panel);
overflow-x:auto;
}

.topbar button{
padding:8px 10px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
white-space:nowrap;
}

.topbar button:hover{background:var(--accent);color:black;}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 50px);}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0f1628;
padding:10px;
overflow-y:auto;
}

.cat{
padding:8px;
margin:5px 0;
background:var(--card);
border-radius:6px;
cursor:pointer;
}

.cat:hover{background:var(--hover);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;}

.player{
height:300px;
background:black;
position:relative;
}

video{width:100%;height:100%;object-fit:contain;}

.overlay{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.85);
flex-direction:column;
}

/* CHANNELS */
.channels{
flex:1;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{background:var(--hover);}

.badge{
font-size:11px;
padding:3px 6px;
border-radius:10px;
}

.locked{background:var(--warn);color:black;}
.unlocked{background:var(--success);}

/* NOW BAR */
.now{
background:var(--panel);
padding:10px;
display:flex;
justify-content:space-between;
}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

<button onclick="setTab('all')">📺 All</button>
<button onclick="setTab('fav')">⭐ Favorites</button>
<button onclick="setTab('recent')">🕘 Recent</button>
<button onclick="loadUltra()">🚀 Ultra Feeds</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFS()">⛶ Fullscreen</button>
<button onclick="shuffle()">🎲 Shuffle</button>
<button onclick="mini()">📺 Mini Player</button>
<button onclick="sleep()">⏰ Sleep</button>
<button onclick="scan()">📡 Scan</button>
<button onclick="boost()">⚡ Boost</button>
<button onclick="exportFav()">⬇ Export</button>
<button onclick="openAdmin()">⚙ Admin</button>
<button onclick="openSuper()">🛡 Super</button>
<button onclick="openUser()">👥 User</button>
<button onclick="pay()">💳 Pay</button>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="setTab('all')">📺 All Channels</div>
<div class="cat" onclick="setTab('fav')">⭐ Favorites</div>
<div class="cat" onclick="setTab('recent')">🕘 Recent</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="overlay" id="overlay">Loading...</div>
<video id="video" controls></video>
</div>

<div class="now">
<div>
<h3 id="title">No Channel</h3>
<small id="group">---</small>
</div>
</div>

<div class="channels" id="list"></div>

</div>

</div>

<script>

/* ================= DATA ================= */

let channels=[];
let filtered=[];
let favs=JSON.parse(localStorage.getItem("favs")||"{}");
let recent=JSON.parse(localStorage.getItem("recent")||"[]");
let index=0;
let dark=true;

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* ================= INIT ================= */

function init(){
for(let i=1;i<=120;i++){
channels.push({
id:i,
name:"BTECH CHANNEL "+i,
group:i%2?"Movies":"Sports",
url:streams[i%2],
locked:i%7===0
});
}
filtered=[...channels];
render();
document.getElementById("overlay").style.display="none";
}
init();

/* ================= RENDER ================= */

function render(){
let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{
box.innerHTML+=`
<div class="channel" onclick="play(${i})">
<div>
<b>${c.name}</b><br>
<small>${c.group}</small>
</div>

<div>
<span class="badge ${c.locked?'locked':'unlocked'}">
${c.locked?'LOCKED':'FREE'}
</span>
</div>
</div>`;
});
}

/* ================= PLAY ================= */

function play(i){
index=i;
let c=filtered[i];

document.getElementById("title").innerText=c.name;
document.getElementById("group").innerText=c.group;

let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else v.src=c.url;

/* recent */
recent.unshift(c.id);
localStorage.setItem("recent",JSON.stringify(recent));
}

/* ================= TABS ================= */

function setTab(t){
if(t==="all") filtered=[...channels];
if(t==="fav") filtered=channels.filter(c=>favs[c.id]);
if(t==="recent") filtered=recent.map(id=>channels.find(c=>c.id==id)).filter(Boolean);
render();
}

/* ================= FAVORITES ================= */

document.addEventListener("dblclick",()=>{
let c=filtered[index];
if(!c)return;
favs[c.id]=!favs[c.id];
localStorage.setItem("favs",JSON.stringify(favs));
alert("Favorite toggled");
});

/* ================= ULTRA ================= */

function loadUltra(){
alert("Ultra Feeds Loaded");
}

/* ================= THEME ================= */

function toggleTheme(){
dark=!dark;
document.body.style.background=dark?"#050816":"#eee";
document.body.style.color=dark?"#fff":"#000";
}

/* ================= FULLSCREEN ================= */

function toggleFS(){
document.documentElement.requestFullscreen();
}

/* ================= SHUFFLE ================= */

function shuffle(){
filtered.sort(()=>Math.random()-0.5);
render();
}

/* ================= MINI PLAYER ================= */

function mini(){
window.open(document.getElementById("video").src);
}

/* ================= SLEEP ================= */

function sleep(){
setTimeout(()=>document.getElementById("video").pause(),1800000);
alert("Sleep timer set 30min");
}

/* ================= SCAN ================= */

function scan(){alert("Scanning streams...");}

/* ================= BOOST ================= */

function boost(){
document.getElementById("video").playbackRate=1.25;
alert("Boost enabled");
}

/* ================= EXPORT ================= */

function exportFav(){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([JSON.stringify(favs)]));
a.download="favorites.json";
a.click();
}

/* ================= ADMIN ================= */

function openAdmin(){alert("Admin Panel");}
function openSuper(){alert("Super Admin");}
function openUser(){window.open("https://btech-tv.netlify.app/user_manager-settings");}
function pay(){alert("Payment Gateway Activated");}

</script>

</body>
</html>
