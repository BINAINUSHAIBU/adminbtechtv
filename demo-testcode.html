<!DOCTYPE html>
<html>
<head>
<title>Church Super Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#0a0f1d;color:#fff}
header{padding:15px;background:#111a33;display:flex;justify-content:space-between}
.container{display:flex;height:100vh}
.sidebar{width:240px;background:#0f1730;padding:10px}
button{width:100%;padding:10px;margin:5px 0;background:#1d2a55;color:white;border:none}
.main{flex:1;padding:15px}
.card{background:#141f3d;padding:10px;margin:10px 0}
input{width:100%;padding:10px;margin:5px 0}
video{width:100%;margin-top:10px}
</style>
</head>

<body>

<header>
<h3>⛪ CHURCH PLATFORM</h3>
<div>Super Admin System</div>
</header>

<div class="container">

<div class="sidebar">
<button onclick="loadChurches()">Churches</button>
<button onclick="loadChannels()">Channels</button>
<button onclick="loadPrograms()">Programs</button>
<button onclick="loadDonations()">Donations</button>
</div>

<div class="main">

<input placeholder="Search..." onkeyup="search(this.value)">

<div id="content"></div>

<video id="player" controls></video>

</div>
</div>

<script>

const API = "http://localhost:5000/api";

async function loadChurches(){
let res = await fetch(API+"/church");
let data = await res.json();

document.getElementById("content").innerHTML =
data.map(c=>`
<div class="card">${c.name} - ${c.location}</div>
`).join("");
}

async function loadChannels(){
let res = await fetch(API+"/channel");
let data = await res.json();

document.getElementById("content").innerHTML =
data.map(c=>`
<div class="card" onclick="play('${c.streamUrl}')">
${c.name}
</div>
`).join("");
}

async function loadPrograms(){
let res = await fetch(API+"/program");
let data = await res.json();

document.getElementById("content").innerHTML =
data.map(p=>`
<div class="card">${p.title} - ${p.status}</div>
`).join("");
}

async function loadDonations(){
let res = await fetch(API+"/donation");
let data = await res.json();

document.getElementById("content").innerHTML =
data.map(d=>`
<div class="card">₦${d.amount}</div>
`).join("");
}

function play(url){
document.getElementById("player").src = url;
document.getElementById("player").play();
}

loadChurches();

</script>

</body>
</html>
