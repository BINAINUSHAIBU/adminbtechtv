<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enterprise V5 Ultimate Demo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#08101f;color:#fff}
header{
background:#111c35;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:26px;
font-weight:bold;
color:#00d4ff;
}
.plan{
background:#00d4ff;
color:#000;
padding:8px 15px;
border-radius:20px;
font-weight:bold;
}

.hero{
padding:50px;
text-align:center;
background:linear-gradient(135deg,#111c35,#0b1430);
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
opacity:.8;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#101c38;
padding:25px;
border-radius:12px;
text-align:center;
}

.card h2{
margin-bottom:10px;
color:#00d4ff;
}

button{
margin-top:15px;
padding:12px 25px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
transform:scale(1.03);
}

#trial{
font-size:22px;
margin:20px;
text-align:center;
}

#modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
}

.popup{
background:#142347;
padding:30px;
border-radius:15px;
width:350px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

footer{
padding:20px;
text-align:center;
background:#111c35;
margin-top:40px;
}
</style>

</head>
<body>

<header>

<div class="logo">
📺 Enterprise V5 Ultimate
</div>

<div class="plan" id="plan">
TRIAL
</div>

</header>

<section class="hero">

<h1>Enterprise IPTV Platform</h1>

<p>
Single Page Demo
</p>

</section>

<div id="trial">

Trial Remaining:
<span id="time">120</span>s

</div>

<section class="cards">

<div class="card">
<h2>Premium</h2>
<p>Unlimited HD Channels</p>
<button onclick="buy('Premium')">Buy ₦3000</button>
</div>

<div class="card">
<h2>Super Premium</h2>
<p>4K + Ultra Features</p>
<button onclick="buy('Super Premium')">Buy ₦5000</button>
</div>

<div class="card">
<h2>Enterprise</h2>
<p>Business Package</p>
<button onclick="buy('Enterprise')">Buy ₦10000</button>
</div>

</section>

<div id="modal">

<div class="popup">

<h2>Demo Payment</h2>

<input placeholder="4111 1111 1111 1111">

<input placeholder="12/30">

<input placeholder="123">

<button onclick="completePayment()">
Pay Now
</button>

</div>

</div>

<footer>

Enterprise V5 Ultimate Demo

</footer>

<script>

let seconds=120;
let selected="";

const saved=localStorage.getItem("plan");

if(saved){
document.getElementById("plan").innerHTML=saved;
document.getElementById("trial").innerHTML="Subscription Active";
}else{

const timer=setInterval(()=>{

seconds--;

document.getElementById("time").innerHTML=seconds;

if(seconds<=0){

clearInterval(timer);

document.getElementById("modal").style.display="flex";

}

},1000);

}

function buy(plan){

selected=plan;

document.getElementById("modal").style.display="flex";

}

function completePayment(){

localStorage.setItem("plan",selected||"Premium");

document.getElementById("modal").style.display="none";

document.getElementById("plan").innerHTML=selected||"Premium";

document.getElementById("trial").innerHTML="Subscription Active";

alert("Demo payment completed.");

}

</script>

</body>
</html>
