<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ULTRA MAX IPTV ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

/* LOGIN */
#login{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
background:#000;
z-index:9999;
}

.box{
width:320px;
background:var(--panel);
padding:20px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#0f1628;
color:white;
}

button{background:var(--accent);font-weight:bold;cursor:pointer}

/* LAYOUT */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.container{display:flex;height:calc(100vh - 60px);}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column;}

.player{height:240px;background:black;}
video{width:100%;height:100%;object-fit:contain;}

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
}

.free{background:var(--free);}
.paid{background:var(--paid);}
.locked{background:var(--locked);color:#000;}

.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>🔐 ULTRA MAX LOGIN</h3>

<input id="pass" type="password" placeholder="Password">
<select id="role">
<option value="admin">Admin</option>
<option value="viewer">Viewer</option>
</select>

<button onclick="login()">ENTER</button>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h3>🚀 ULTRA MAX IPTV ENGINE</h3>
<div id="mode">LOCKED</div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="filterAll()">ALL</button>
<button onclick="filterLocked()">LOCKED</button>
<button onclick="filterFree()">FREE</button>
<button onclick="filterPaid()">PAID</button>
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="channels" id="list"></div>

</div>

<div class="right">

<h3>CONTROL PANEL</h3>

<button onclick="lockAll()">LOCK ALL</button>
<button onclick="unlockAll()">UNLOCK ALL</button>
<button onclick="lockSelected()">LOCK SELECTED</button>
<button onclick="unlockSelected()">UNLOCK SELECTED</button>
<button onclick="deleteLocked()">DELETE LOCKED</button>

<h3>STATS</h3>
<div class="stat">Total: <span id="t"></span></div>
<div class="stat">Free: <span id="f"></span></div>
<div class="stat">Paid: <span id="p"></span></div>
<div class="stat">Locked: <span id="l"></span></div>

</div>

</div>

<script>

/* =====================
SECURE LOGIN HASH
===================== */

function hash(str){
return btoa(unescape(encodeURIComponent(str)));
}

let role="viewer";

function login(){
const pass=document.getElementById("pass").value;
const r=document.getElementById("role").value;

if(hash(pass)==hash("admin123")){

role=r;
localStorage.setItem("ultra_role",role);

document.getElementById("login").style.display="none";
document.getElementById("mode").innerText=role.toUpperCase();

boot();

}else alert("Wrong Password");
}

/* AUTO SESSION */
window.onload=()=>{
const saved=localStorage.getItem("ultra_role");
if(saved){
role=saved;
document.getElementById("login").style.display="none";
document.getElementById("mode").innerText=role.toUpperCase();
boot();
}
};

/* =====================
ENGINE
===================== */

let channels=[],filtered=[],selected=new Set();

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =====================
VIRTUAL 100K ENGINE
===================== */

function generate(){
for(let i=0;i<800;i++){
channels.push({
id:i,
name:"ULTRA CH "+i,
url:streams[i%streams.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"free"
});
}
}

/* =====================
RENDER OPTIMIZED
===================== */

function render(){
filtered=[...channels];
const box=document.getElementById("list");
box.innerHTML="";

const frag=document.createDocumentFragment();

filtered.forEach((c,i)=>{
const div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
<br>
<input type="checkbox" onchange="toggle(${c.id})">
`;

div.onclick=()=>play(i);
frag.appendChild(div);
});

box.appendChild(frag);
stats();
}

/* =====================
SECURITY CHECK
===================== */

function adminOnly(){
if(role!=="admin"){
alert("Viewer mode blocked");
return false;
}
return true;
}

/* =====================
SELECT
===================== */

function toggle(id){
selected.has(id)?selected.delete(id):selected.add(id);
}

/* =====================
PLAY
===================== */

function play(i){
let c=filtered[i];
let v=document.getElementById("video");

if(window.Hls && Hls.isSupported()){
let h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else v.src=c.url;
}

/* =====================
FILTERS
===================== */

function filterAll(){render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterFree(){filtered=channels.filter(c=>c.type==="free");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* =====================
ADMIN ACTIONS
===================== */

function lockAll(){if(!adminOnly())return;channels.forEach(c=>c.status="locked");render();}
function unlockAll(){if(!adminOnly())return;channels.forEach(c=>c.status="free");render();}

function lockSelected(){
if(!adminOnly())return;
channels.forEach(c=>{if(selected.has(c.id))c.status="locked";});
render();
}

function unlockSelected(){
if(!adminOnly())return;
channels.forEach(c=>{if(selected.has(c.id))c.status="free";});
render();
}

function deleteLocked(){
if(!adminOnly())return;
channels=channels.filter(c=>c.status!=="locked");
render();
}

/* =====================
STATS
===================== */

function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
}

/* =====================
BOOT
===================== */

function boot(){
generate();
render();
}

</script>

</body>
</html>
