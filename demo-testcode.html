```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:Arial,sans-serif;
}

header{
background:#0d1226;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.live-monitor{
position:sticky;
top:0;
background:#111827;
padding:10px;
z-index:9999;
display:flex;
align-items:center;
gap:10px;
}

.dot{
width:12px;
height:12px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{opacity:.4}
}

#search{
width:100%;
padding:12px;
border:none;
background:#111827;
color:white;
}

video{
width:100%;
height:500px;
background:black;
}

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
padding:15px;
}

.card{
background:#111827;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.card:hover{
background:#1f2937;
}
</style>
</head>
<body>

<header>WORLDTV LIVE PLATFORM</header>

<div class="live-monitor">
<div class="dot"></div>
LIVE STREAMING MONITOR ACTIVE
</div>

<video id="player" controls autoplay></video>

<input type="text" id="search" placeholder="Search channels">

<div class="channels" id="channels"></div>

<script>

const m3uPlaylist = `

#EXTM3U

#EXTINF:-1,ESPN 2
https://example.com/espn2.m3u8

#EXTINF:-1,NBA TV
https://example.com/nbatv.m3u8

#EXTINF:-1,CNN
https://example.com/cnn.m3u8

`;

const channels=[];

function parseM3U(){

const lines=m3uPlaylist.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

channels.push({
name:lines[i].split(',').pop(),
url:lines[i+1]
});

}

}

render(channels);

}

function render(data){

const box=document.getElementById('channels');

box.innerHTML='';

data.forEach(ch=>{

const card=document.createElement('div');

card.className='card';

card.innerHTML=`<b>${ch.name}</b>`;

card.onclick=()=>play(ch.url);

box.appendChild(card);

});

}

function play(url){

const video=document.getElementById('player');

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

document.getElementById('search')
.addEventListener('input',e=>{

const q=e.target.value.toLowerCase();

render(
channels.filter(c=>
c.name.toLowerCase().includes(q)
)
);

});

parseM3U();

</script>

</body>
</html>
```
