<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <!-- LOGO -->
        <div class="logo-box">
            <h1>BTECH TV</h1>
            <p>SUPER ADMIN CONTROL PANEL</p>
        </div>

        <!-- DASHBOARD -->
        <button onclick="showPage('dashboard')">
            Dashboard
        </button>

        <!-- CHANNELS -->
        <button onclick="showPage('channels')">
            All Channels
        </button>

        <button onclick="showPage('free')">
            Free Channels
        </button>

        <button onclick="showPage('premium')">
            Premium Channels
        </button>

        <button onclick="showPage('locked')">
            Locked Channels
        </button>

        <!-- USERS -->
        <button onclick="showPage('users')">
            User Manager
        </button>

        <!-- SUBSCRIPTIONS -->
        <button onclick="showPage('subscriptions')">
            Subscription Manager
        </button>

        <!-- SERVER -->
        <button onclick="showPage('servers')">
            Streaming Servers
        </button>

        <!-- SECURITY -->
        <button onclick="showPage('security')">
            Security Center
        </button>

        <!-- SETTINGS -->
        <button onclick="showPage('settings')">
            Super Settings
        </button>

        <!-- CHURCH -->
        <button onclick="showPage('church')">
            Church Manager
        </button>

        <!-- ADMIN -->
        <button onclick="showPage('admins')">
            Admin Manager
        </button>

        <!-- ANALYTICS -->
        <button onclick="showPage('analytics')">
            Analytics
        </button>

    </aside>

    <!-- MAIN -->
    <main class="dashboard-main">

        <!-- DASHBOARD PAGE -->
        <section id="dashboardPage">

            <!-- STATS -->
            <div class="stats">

                <div class="stat">
                    <h3>Total Channels</h3>
                    <p id="totalChannels">0</p>
                </div>

                <div class="stat">
                    <h3>Premium</h3>
                    <p id="premiumChannels">0</p>
                </div>

                <div class="stat">
                    <h3>Locked</h3>
                    <p id="lockedChannels">0</p>
                </div>

                <div class="stat">
                    <h3>Users</h3>
                    <p id="totalUsers">0</p>
                </div>

            </div>

        </section>

        <!-- CHANNEL GRID -->
        <section id="channelsPage">

            <div class="channel-grid" id="channelGrid">

            </div>

        </section>

        <!-- USER MANAGER -->
        <section id="usersPage">

            <div class="card">

                <h3>User Manager</h3>

                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="userTable"></tbody>

                </table>

            </div>

        </section>

        <!-- SERVER DASHBOARD -->
        <section id="serversPage">

            <div class="card">

                <h3>Streaming Servers</h3>

                <table>

                    <thead>
                        <tr>
                            <th>Server</th>
                            <th>Region</th>
                            <th>Status</th>
                            <th>Bandwidth</th>
                        </tr>
                    </thead>

                    <tbody id="serverTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>
