<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLOBAL OTT SAAS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN */
#loginBox{
position:fixed;
inset:0;
background:#020617;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
z-index:999;
}

input{
padding:10px;
width:220px;
border:none;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#1f2a44;
color:#fff;
}

button:hover{background:#00d4ff;color:#000}

/* SIDEBAR */
.sidebar{
width:240px;
background:#0f172a;
padding:10px;
overflow:auto;
}

.menu{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

.menu:hover{background:#1e293b}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */
.player{
height:300px;
background:black;
}

video{
width:100%;
height:100%;
}

/* GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0b1220;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h2>🔐 OTT SAAS LOGIN</h2>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>
<p style="font-size:12px;color:#aaa">
Demo: admin@demo.com / admin123
</p>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="menu" onclick="loadDemo()">📺 Load Channels</div>
<div class="menu" onclick="showAdmin()">🛠 Admin Panel</div>
<div class="menu" onclick="logout()">🚪 Logout</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>🌍 GLOBAL OTT SAAS (DEMO MODE)</div>
<div id="status">OFFLINE</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>

<script>

let user=null;
let role="guest";
let video=document.getElementById("video");
let hls;

/* =========================
FAKE USERS (SIMULATED JWT)
========================= */
const users=[
{email:"admin@demo.com",pass:"admin123",role:"admin"},
{email:"user@demo.com",pass:"user123",role:"user"}
];

/* LOGIN */
function login(){

let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

let found=users.find(u=>u.email===email && u.pass===pass);

if(!found){
alert("Invalid login");
return;
}

user=found.email;
role=found.role;

document.getElementById("loginBox").style.display="none";
document.getElementById("status").innerText="ONLINE ("+role+")";

loadDemo();

}

/* LOGOUT */
function logout(){
location.reload();
}

/* DEMO CHANNELS */
const channels=[
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"NASA TV",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Sports Live",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Movie Channel",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
];

/* LOAD */
function loadDemo(){

let grid=document.getElementById("grid");
grid.innerHTML="";

channels.forEach((c,i)=>{

let div=document.createElement("div");
div.className="card";
div.innerHTML="📺 "+c.name;

div.onclick=()=>play(c.url);

grid.appendChild(div);

});

}

/* PLAY */
function play(url){

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* ADMIN */
function showAdmin(){

if(role!=="admin"){
alert("Admin only panel");
return;
}

alert("ADMIN DASHBOARD:\nUsers: 2\nStreams: "+channels.length);

}

</script>

</body>
</html>
