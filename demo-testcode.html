<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0b0f1a"/>
<title>BTECH-TV WORLD ULTRA MAX X</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
--premium:#8b5cf6;
--gold:#facc15;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* TOPBAR */
.topbar{
min-height:72px;
background:linear-gradient(90deg,#0f172a,#111827);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 18px;
flex-wrap:wrap;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
margin-left:auto;
}

.top-buttons button{
padding:10px 14px;
background:var(--card);
border:none;
border-radius:10px;
color:#fff;
cursor:pointer;
}

.top-buttons button.active,
.top-buttons button:hover{
background:var(--accent);
color:#000;
}

/* LAYOUT */
.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0b1220;
overflow-y:auto;
padding:15px;
}

.cat{
background:var(--card);
padding:10px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */
.player{
height:380px;
background:#000;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* NOW PLAYING */
.now-playing{
background:var(--panel);
padding:12px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
}

/* SEARCH */
.search-box{
display:flex;
gap:10px;
padding:10px;
background:var(--panel);
}

.search-box input{
flex:1;
padding:10px;
border-radius:8px;
border:none;
}

/* CHANNEL LIST (VERTICAL ONLY) */
.channels{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column; /* ✅ FORCE VERTICAL LIST */
gap:10px;
padding:10px;
}

.channel{
display:flex;
justify-content:space-between;
align-items:center;
background:var(--card);
padding:12px;
border-radius:12px;
cursor:pointer;
}

.channel:hover{
background:var(--hover);
}

.left{
display:flex;
gap:10px;
align-items:center;
}

.left img{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
}

.status{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:5px;
}

/* MINI PLAYER */
.mini-player{
position:fixed;
bottom:15px;
right:15px;
width:220px;
height:130px;
background:#000;
display:none;
z-index:999;
}

.mini-player video{
width:100%;
height:100%;
}

/* RESPONSIVE */
@media(max-width:900px){
.container{flex-direction:column;}
.sidebar{width:100%;max-height:220px;}
.player{height:240px;}
}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">📺 BTECH-TV ULTRA MAX</div>

<div class="top-buttons">
<button class="active">All</button>
<button>Favorites</button>
<button>Recent</button>
</div>
</div>

<div class="container">

<div class="sidebar">
<h3>🌍 Countries</h3>
<div class="cat">Nigeria</div>
<div class="cat">USA</div>
<div class="cat">UK</div>
<div class="cat">India</div>
</div>

<div class="main">

<div class="player">
<video id="video" controls autoplay></video>
<div class="overlay">Loading IPTV...</div>
</div>

<div class="now-playing">
<h3>No Channel Selected</h3>
</div>

<div class="search-box">
<input type="text" placeholder="Search channels...">
</div>

<div class="channels" id="channelList">
<!-- VERTICAL SCROLL ONLY LIST -->
</div>

</div>

</div>

<div class="mini-player" id="miniPlayer">
<video id="miniVideo" muted></video>
</div>
