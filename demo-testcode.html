<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026 - TRIAL SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* AUTH SCREEN */
#auth{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#0d1324;
padding:20px;
border-radius:10px;
width:320px;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
background:#101a31;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:8px;
background:#00d4ff;
border:none;
border-radius:6px;
cursor:pointer;
}

/* EXPIRED */
#expired{
position:fixed;
inset:0;
background:#000;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10000;
}

#expired button{
padding:10px;
margin-top:10px;
background:#00d4ff;
border:none;
}

/* SIDEBAR */
.sidebar{width:300px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}

.topbar{display:flex;justify-content:space-between;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px;}

.hero{background:#0f1d45;padding:10px;border-radius:10px;margin:10px 0;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

.player-container{background:#000;height:320px;border-radius:10px;overflow:hidden;}
video{width:100%;height:100%;}

.controls{display:flex;gap:8px;margin:10px 0;}
.controls button{padding:8px;background:#152445;border:none;color:#fff;border-radius:6px;cursor:pointer;}

.channels{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}

.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d;}
.card:hover{border-color:#00d4ff;}

.locked-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9998;
}

.locked-overlay button{
padding:10px;
margin-top:10px;
background:#00d4ff;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h3>🔐 IPTV TRIAL LOGIN</h3>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<p style="font-size:12px;margin-top:10px;color:#aaa">
Free trial: 5 minutes access
</p>
</div>
</div>

<!-- EXPIRED -->
<div id="expired">
<h2>⛔ TRIAL EXPIRED</h2>
<p>Upgrade to continue watching</p>
<button onclick="fakePayment()">💳 Unlock Premium</button>
</div>

<!-- LOCKED -->
<div class="locked-overlay" id="locked">
<h2>🔒 PREMIUM REQUIRED</h2>
<p>Trial ended or not activated</p>
<button onclick="fakePayment()">Activate Access</button>
</div>

<!-- APP -->
<div class="sidebar">
<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Trial + Login System</div>

<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>

<button class="nav-btn" onclick="logout()">Logout</button>
</div>

<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX TRIAL</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="next()">Next</button>
<button onclick="prev()">Prev</button>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

let trialTime=300; // 5 minutes
let timer;

/* AUTH */
function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

localStorage.setItem("user",JSON.stringify({email,pass}));
alert("Registered!");
}

function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

let u=JSON.parse(localStorage.getItem("user"));

if(u && u.email===email && u.pass===pass){
startTrial();
document.getElementById("auth").style.display="none";
}else{
alert("Invalid login");
}
}

/* TRIAL */
function startTrial(){
let start=Date.now();
localStorage.setItem("start",start);

timer=setInterval(()=>{
let used=Math.floor((Date.now()-start)/1000);
let left=trialTime-used;

if(left<=0){
clearInterval(timer);
expire();
}else{
console.log("Trial left:",left);
}
},1000);
}

function expire(){
document.getElementById("expired").style.display="flex";
document.getElementById("locked").style.display="flex";
}

/* FAKE PAYMENT */
function fakePayment(){
alert("Payment successful (demo)");
localStorage.setItem("premium","true");
document.getElementById("expired").style.display="none";
document.getElementById("locked").style.display="none";
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}

/* LOAD IPTV */
async function load(code){
if(!localStorage.getItem("premium")){
document.getElementById("locked").style.display="flex";
return;
}

let url=`https://iptv-org.github.io/iptv/countries/${code}.m3u`;
let res=await fetch(url);
let text=await res.text();

all=[];

text.split("\n").forEach((line,i,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[i+1];
if(url) all.push({name,url});
}
});

filtered=[...all];
render();
stats();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* AUTO CHECK */
if(localStorage.getItem("premium")==="true"){
document.getElementById("auth").style.display="none";
load("ng");
}

</script>

</body>
</html>
