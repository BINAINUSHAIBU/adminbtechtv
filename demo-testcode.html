<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

.topbar{
min-height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.top-buttons button,
.controls button,
.auth-box button{
padding:10px 16px;
background:var(--card);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.player{
height:360px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#111827;
padding:30px;
border-radius:20px;
width:95%;
max-width:400px;
}

.auth-box input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

.left{
display:flex;
gap:12px;
align-items:center;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
}

.now-playing,
.search-box,
.stats{
padding:15px;
background:var(--panel);
}

.search-box{
display:flex;
gap:10px;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.search-box input{
flex:1;
}

@media(max-width:900px){
.container{
flex-direction:column;
}

.sidebar{
width:100%;
max-height:240px;
}

.channels{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<!-- AUTH MODAL -->
<div id="authModal" class="overlay">
<div class="auth-box">
<h2 style="margin-bottom:20px;color:#00bfff;">🔐 BTECH-TV Account</h2>

<input id="authEmail" type="email" placeholder="Email">
<input id="authPassword" type="password" placeholder="Password">

<button onclick="registerUser()" style="width:100%;margin-bottom:10px;background:#00bfff;color:black;">
Create Account
</button>

<button onclick="loginUser()" style="width:100%;background:#16a34a;">
Login
</button>

<p id="authMsg" style="margin-top:15px;color:#94a3b8;font-size:13px;"></p>
</div>
</div>

<!-- PROFILE -->
<div id="profilePanel" class="overlay" style="display:none;">
<div class="auth-box">
<h2 style="color:#00bfff;margin-bottom:20px;">👤 User Profile</h2>

<p id="profileEmail"></p>
<p id="trialStatus"></p>
<p id="subscriptionStatus"></p>

<button onclick="logoutUser()" style="width:100%;margin-top:15px;background:#ef4444;">
Logout
</button>

<button onclick="closeProfile()" style="width:100%;margin-top:10px;">
Close
</button>
</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH-TV WORLD</div>

<div class="top-buttons">
<button onclick="setTab('all')">All</button>
<button onclick="setTab('favs')">⭐ Favorites</button>
<button onclick="setTab('recent')">🕘 Recent</button>
<button onclick="toggleTheme()">Theme</button>
<button onclick="openProfile()">👤 Profile</button>
</div>
</div>

<!-- MAIN -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🌍 Countries</h3>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>

<h3>🎬 Categories</h3>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎥 Movies</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

<div class="player">
<video id="video" controls autoplay playsinline></video>
</div>

<div class="now-playing">
<h2 id="channelName">No Channel Selected</h2>
<p id="channelGroup">Global BTECH-TV Streaming</p>

<div class="controls" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
<button onclick="prevChannel()">◀ Prev</button>
<button onclick="nextChannel()">Next ▶</button>
<button onclick="togglePiP()">📺 PiP</button>
<button onclick="shareChannel()">🔗 Share</button>
</div>
</div>

<div class="stats" id="stats">0 Channels Loaded</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search channels..." oninput="searchChannels(this.value)">

<select onchange="sortChannels(this.value)">
<option value="az">Sort A-Z</option>
<option value="za">Sort Z-A</option>
</select>
</div>

<div class="channels" id="channelList"></div>
</div>
</div>

<script>
/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig={
apiKey:'YOUR_API_KEY',
authDomain:'YOUR_PROJECT.firebaseapp.com',
projectId:'YOUR_PROJECT_ID',
storageBucket:'YOUR_PROJECT.appspot.com',
messagingSenderId:'XXXX',
appId:'XXXX'
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

/* =========================
APP VARIABLES
========================= */

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let currentUser=null;
let userData=null;
let dark=true;

let favs=JSON.parse(localStorage.getItem('atv_favs')||'{}');
let recent=JSON.parse(localStorage.getItem('atv_recent')||'[]');

const video=document.getElementById('video');

/* =========================
REGISTER
========================= */

async function registerUser(){

const email=document.getElementById('authEmail').value;
const password=document.getElementById('authPassword').value;

try{

const res=await auth.createUserWithEmailAndPassword(email,password);

const uid=res.user.uid;

const now=Date.now();
const trialEnds=now+(7*24*60*60*1000);

await db.collection('users').doc(uid).set({
email,
createdAt:now,
trialEnds,
subscriptionActive:false,
favorites:[],
recent:[]
});

document.getElementById('authMsg').innerText='✅ Account created';

}catch(err){

document.getElementById('authMsg').innerText=err.message;

}
}

/* =========================
LOGIN
========================= */

async function loginUser(){

const email=document.getElementById('authEmail').value;
const password=document.getElementById('authPassword').value;

try{

await auth.signInWithEmailAndPassword(email,password);

}catch(err){

document.getElementById('authMsg').innerText=err.message;

}
}

/* =========================
AUTH STATE
========================= */

auth.onAuthStateChanged(async(user)=>{

if(user){

currentUser=user;

document.getElementById('authModal').style.display='none';

const doc=await db.collection('users').doc(user.uid).get();

userData=doc.data();

if(userData.favorites){

favs={};

userData.favorites.forEach(id=>{
favs[id]=1;
});
}

checkAccess();

}else{

currentUser=null;

document.getElementById('authModal').style.display='flex';

}
});

/* =========================
TRIAL CHECK
========================= */

function checkAccess(){

const now=Date.now();

const trialValid=now<userData.trialEnds;
const subscribed=userData.subscriptionActive;

if(!trialValid && !subscribed){

alert('Your free trial has expired');

video.pause();
}
}

/* =========================
LOAD PLAYLIST
========================= */

async function loadPlaylist(url,group){

all=[];

const res=await fetch(url);
const text=await res.text();

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();
updateStats();
}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')) continue;

const name=info.split(',').pop();

const logoMatch=info.match(/tvg-logo="(.*?)"/);

all.push({
id:all.length+1,
name,
url,
logo:logoMatch?logoMatch[1]:'https://via.placeholder.com/60',
group,
type:'free'
});
}
}
}

/* =========================
RENDER CHANNELS
========================= */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`
<div class="left">
<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/60'">
<div>
<h4>${c.name}</h4>
<small>${c.group}</small>
</div>
</div>

<div onclick="event.stopPropagation();toggleFav(${c.id})" style="font-size:20px;">
${favs[c.id]?'★':'☆'}
</div>
`;

div.onclick=()=>playChannel(index);

box.appendChild(div);
});
}

/* =========================
PLAY CHANNEL
========================= */

function playChannel(index){

if(userData){

const now=Date.now();
const trialValid=now<userData.trialEnds;

if(!trialValid && !userData.subscriptionActive){
alert('Trial expired');
return;
}
}

currentIndex=index;

const channel=filteredChannels[index];

if(!channel) return;

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls();

currentHls.loadSource(channel.url);
currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,function(){
video.play();
});

}else{

video.src=channel.url;
video.play();
}

addRecent(channel.id);

renderChannels();

updateNowPlaying(channel);
}

/* =========================
FAVORITES
========================= */

async function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem('atv_favs',JSON.stringify(favs));

if(currentUser){

await db.collection('users').doc(currentUser.uid).update({
favorites:Object.keys(favs)
});
}

renderChannels();
}

/* =========================
RECENT
========================= */

function addRecent(id){

recent=recent.filter(r=>r!==id);
recent.unshift(id);

if(recent.length>30){
recent=recent.slice(0,30);
}

localStorage.setItem('atv_recent',JSON.stringify(recent));
}

/* =========================
SEARCH
========================= */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>
c.name.toLowerCase().includes(value)
||
c.group.toLowerCase().includes(value)
);

renderChannels();
updateStats();
}

/* =========================
SORT
========================= */

function sortChannels(type){

if(type==='az'){
filteredChannels.sort((a,b)=>a.name.localeCompare(b.name));
}else{
filteredChannels.sort((a,b)=>b.name.localeCompare(a.name));
}

renderChannels();
}

/* =========================
TABS
========================= */

function setTab(type){

if(type==='all'){
filteredChannels=[...all];
}

if(type==='favs'){
filteredChannels=all.filter(c=>favs[c.id]);
}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{
const ch=all.find(c=>c.id===id);
if(ch){
filteredChannels.push(ch);
}
});
}

renderChannels();
updateStats();
}

/* =========================
CONTROLS
========================= */

function nextChannel(){
currentIndex++;
if(currentIndex>=filteredChannels.length){
currentIndex=0;
}
playChannel(currentIndex);
}

function prevChannel(){
currentIndex--;
if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}
playChannel(currentIndex);
}

function togglePiP(){

if(document.pictureInPictureElement){
document.exitPictureInPicture();
}else if(document.pictureInPictureEnabled){
video.requestPictureInPicture();
}
}

function shareChannel(){

const channel=filteredChannels[currentIndex];

if(!channel) return;

if(navigator.share){

navigator.share({
title:channel.name,
url:channel.url
});

}else{

navigator.clipboard.writeText(channel.url);
alert('Channel URL copied');
}
}

/* =========================
PROFILE
========================= */

function openProfile(){

if(!currentUser) return;

document.getElementById('profilePanel').style.display='flex';

document.getElementById('profileEmail').innerText='Email: '+currentUser.email;

const daysLeft=Math.ceil((userData.trialEnds-Date.now())/(1000*60*60*24));

document.getElementById('trialStatus').innerText=
'Free Trial: '+(daysLeft>0?daysLeft+' days remaining':'Expired');

document.getElementById('subscriptionStatus').innerText=
'Subscription: '+(userData.subscriptionActive?'ACTIVE':'INACTIVE');
}

function closeProfile(){
document.getElementById('profilePanel').style.display='none';
}

async function logoutUser(){
await auth.signOut();
location.reload();
}

/* =========================
THEME
========================= */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty('--bg',dark?'#0b0f1a':'#f1f5f9');
document.documentElement.style.setProperty('--panel',dark?'#111827':'#ffffff');
document.documentElement.style.setProperty('--card',dark?'#1b2438':'#e2e8f0');
document.documentElement.style.setProperty('--text',dark?'#ffffff':'#000000');
}

/* =========================
UTILS
========================= */

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length+' Channels Loaded';
}

function updateNowPlaying(channel){

document.getElementById('channelName').innerText=channel.name;
document.getElementById('channelGroup').innerText=channel.group;
}

/* =========================
START APP
========================= */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);
</script>

</body>
</html>
