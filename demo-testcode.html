<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV Admin Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0b1020;color:#fff}

.login-box{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
background:#050816;
}

.card{
background:#141c33;
padding:20px;
border-radius:10px;
width:300px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
background:#0e1630;
color:#fff;
}

button{
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
margin:5px 0;
width:100%;
background:#00d4ff;
font-weight:bold;
}

.topbar{
padding:15px;
background:#111a31;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{padding:15px;}

.user-card{
background:#141c33;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #1f2b4f;
}

.actions button{
width:auto;
padding:6px 10px;
margin:3px;
font-size:12px;
}

.badge{padding:3px 6px;border-radius:6px;font-size:11px}
.banned{background:red}
.active{background:green}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="login-box" id="loginBox">
  <div class="card">
    <h3>👑 Admin Login</h3>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="msg"></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" style="display:none;">

<div class="topbar">
<h3>IPTV ADMIN PANEL</h3>
<button onclick="logout()">Logout</button>
</div>

<div class="container">
<h4>👥 Users</h4>
<div id="users"></div>
</div>

</div>

<script>

let token = localStorage.getItem("adminToken");

/* ============ LOGIN ============ */
async function login(){
let username = document.getElementById("user").value;
let password = document.getElementById("pass").value;

let res = await fetch("/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username,password})
});

let data = await res.json();

if(!res.ok){
document.getElementById("msg").innerText = data.msg;
return;
}

/* save token */
localStorage.setItem("adminToken",data.token);
token = data.token;

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

loadUsers();
}

/* ============ LOAD USERS ============ */
async function loadUsers(){

let res = await fetch("/admin/users",{
headers:{Authorization:token}
});

let users = await res.json();

document.getElementById("users").innerHTML =
users.map(u=>`
<div class="user-card">
<b>${u.username}</b><br>

<span class="badge ${u.isBanned ? "banned":"active"}">
${u.isBanned ? "BANNED":"ACTIVE"}
</span>

<br><br>

Trial Start: ${new Date(u.trialStart).toLocaleString()}<br>
Premium: ${u.isPaid ? "YES":"NO"}

<div class="actions">

<button onclick="ban('${u._id}')">Ban</button>
<button onclick="unban('${u._id}')">Unban</button>
<button onclick="extend('${u._id}',3)">+3 Days</button>
<button onclick="extend('${u._id}',7)">+7 Days</button>
<button onclick="premium('${u._id}')">Make Premium</button>

</div>
</div>
`).join("");
}

/* ============ ACTIONS ============ */
async function ban(id){
await fetch("/admin/ban/"+id,{method:"POST",headers:{Authorization:token}});
loadUsers();
}

async function unban(id){
await fetch("/admin/unban/"+id,{method:"POST",headers:{Authorization:token}});
loadUsers();
}

async function extend(id,days){
await fetch("/admin/extend-trial/"+id,{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:token
},
body:JSON.stringify({days})
});
loadUsers();
}

async function premium(id){
await fetch("/admin/make-premium/"+id,{
method:"POST",
headers:{Authorization:token}
});
loadUsers();
}

/* ============ LOGOUT ============ */
function logout(){
localStorage.removeItem("adminToken");
location.reload();
}

/* auto load */
if(token){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";
loadUsers();
}

</script>

</body>
</html>
