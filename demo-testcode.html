
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumMesh Voice Prototype</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.phone{width:360px;background:#1b1b1b;border-radius:18px;padding:16px;box-shadow:0 0 20px #000}
.top{display:flex;justify-content:space-between;font-size:12px;color:#8f8}
.avatar{width:90px;height:90px;border-radius:50%;background:#444;margin:20px auto}
.name{text-align:center;font-size:24px}.loc{text-align:center;color:#8fd}
.timer{text-align:center;font-size:28px;margin:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{padding:14px;border:none;border-radius:12px;background:#2d2d2d;color:#fff;cursor:pointer}
.end{background:#b00}
</style></head><body>
<div class="phone">
<div class="top"><span>🔒 Encrypted</span><span id="net">Online</span></div>
<div class="avatar"></div>
<div class="name">John Doe</div>
<div class="loc" id="loc">Detecting location…</div>
<div class="timer" id="t">00:00</div>
<div class="grid">
<button onclick="alert('Mute')">🎤 Mute</button>
<button onclick="alert('Speaker')">🔊 Speaker</button>
<button onclick="alert('Hold')">⏸ Hold</button>
<button onclick="share()">📍 Share</button>
<button onclick="alert('Contacts')">👥 Contacts</button>
<button class="end" onclick="endCall()">❌ End</button>
</div></div>
<script>
let s=0;setInterval(()=>{s++;let m=String(Math.floor(s/60)).padStart(2,'0');let ss=String(s%60).padStart(2,'0');t.textContent=m+':'+ss;},1000);
function endCall(){alert("Prototype: Call ended");}
function share(){alert(loc.textContent);}
if(navigator.geolocation){
 navigator.geolocation.getCurrentPosition(async p=>{
  const {latitude,longitude}=p.coords;
  try{
   const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`);
   const j=await r.json();
   const a=j.address||{};
   loc.textContent=(a.city||a.town||a.village||"Unknown")+", "+(a.country||"Unknown");
  }catch(e){loc.textContent=latitude.toFixed(4)+","+longitude.toFixed(4);}
 },()=>loc.textContent="Location unavailable");
}else loc.textContent="Geolocation unsupported";
</script></body></html>
