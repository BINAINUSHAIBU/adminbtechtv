<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WORLDTV ENTERPRISE V5</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#0f172a;
--card:#111827;
--accent:#00ff88;
--text:#ffffff;
--muted:#94a3b8;
--danger:#ef4444;
--border:#1f2937;
--sidebar-width:320px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

/* APP */

.app{
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:var(--sidebar-width);
background:#0b1220;
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
}

.logo{
padding:20px;
font-size:24px;
font-weight:700;
text-align:center;
color:var(--accent);
border-bottom:1px solid var(--border);
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
background:#1e293b;
border:none;
border-radius:10px;
color:white;
outline:none;
}

.channel-header{
padding:10px 15px;
font-size:14px;
color:var(--muted);
}

.channel-list{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
background:#111827;
padding:12px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
transition:.3s;
display:flex;
justify-content:space-between;
align-items:center;
}

.channel:hover{
background:#1f2937;
}

.channel-name{
font-size:14px;
}

.live-dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player-wrapper{
height:380px;
background:black;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid var(--border);
}

video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

/* TOP BAR */

.topbar{
height:60px;
background:#0b1220;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid var(--border);
}

.top-actions button{
padding:10px 14px;
margin-left:8px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
font-weight:bold;
}

/* CONTENT */

.content{
flex:1;
overflow:auto;
padding:20px;
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:var(--card);
padding:20px;
border-radius:12px;
border:1px solid var(--border);
}

.card h3{
color:var(--muted);
margin-bottom:10px;
}

.card h1{
font-size:32px;
}

/* PANELS */

.panel{
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.panel-title{
font-size:20px;
margin-bottom:15px;
color:var(--accent);
}

/* RECENTS */

.recent-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}

.recent-item{
background:#111827;
padding:12px;
border-radius:10px;
}

/* FAVORITES */

.favorite-btn{
background:#f59e0b;
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
width:260px;
}

.player-wrapper{
height:250px;
}

}

@media(max-width:768px){

.app{
flex-direction:column;
}

.sidebar{
width:100%;
height:260px;
}

.main{
height:calc(100vh - 260px);
}

}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
📺 WORLDTV
</div>

<div class="search-box">
<input
id="search"
placeholder="Search Channel..."
onkeyup="filterChannels()">
</div>

<div class="channel-header">
LIVE CHANNELS
</div>

<div id="channelList" class="channel-list">
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player-wrapper">

<video
id="video"
controls
autoplay>
</video>

</div>

<!-- TOP BAR -->

<div class="topbar">

<div>
🔴 LIVE STREAMING
</div>

<div class="top-actions">

<button onclick="toggleFullscreen()">
Fullscreen
</button>

<button onclick="addFavorite()">
Favorite
</button>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<div class="cards">

<div class="card">
<h3>Users</h3>
<h1>15,240</h1>
</div>

<div class="card">
<h3>Channels</h3>
<h1>10,000+</h1>
</div>

<div class="card">
<h3>Streams</h3>
<h1>4,120</h1>
</div>

<div class="card">
<h3>Status</h3>
<h1 style="color:#00ff88;">ONLINE</h1>
</div>

</div>

<div class="panel">

<div class="panel-title">
⭐ Favorites
</div>

<button class="favorite-btn">
View Favorites
</button>

</div>

<div class="panel">

<div class="panel-title">
🕒 Recently Watched
</div>

<div class="recent-list">

<div class="recent-item">
Sports Channel
</div>

<div class="recent-item">
News Channel
</div>

<div class="recent-item">
Movie Channel
</div>

</div>

</div>

<div class="panel">

<div class="panel-title">
🌍 Categories
</div>

Sports • Movies • News • Music • Kids • Documentary • Entertainment • Religious

</div>

</div>

</div>

</div>

<script>

const channels = [

{
name:"CBS Sports",
url:"https://dai.google.com/linear/hls/event/GxrCGmwST0ixsrc_QgB6qw/master.m3u8"
},

{
name:"AfroSport",
url:"https://newproxy3.vidivu.tv/vidivu_afrosport/index.m3u8"
},

{
name:"Abu Dhabi Sports",
url:"https://vo-live.cdb.cdn.orange.com/Content/Channel/AbuDhabiSportsChannel1/HLS/index.m3u8"
},

{
name:"World News",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}

];

const list =
document.getElementById("channelList");

function renderChannels(data){

list.innerHTML="";

data.forEach(ch=>{

const div =
document.createElement("div");

div.className="channel";

div.innerHTML=`
<span class="channel-name">${ch.name}</span>
<span class="live-dot"></span>
`;

div.onclick=()=>{
playChannel(ch.url);
};

list.appendChild(div);

});

}

renderChannels(channels);

function filterChannels(){

const q =
document.getElementById("search")
.value.toLowerCase();

renderChannels(

channels.filter(c=>
c.name.toLowerCase().includes(q)
)

);

}

function playChannel(url){

const video =
document.getElementById("video");

if(Hls.isSupported()){

const hls =
new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

function toggleFullscreen(){

const video =
document.getElementById("video");

if(video.requestFullscreen){
video.requestFullscreen();
}

}

function addFavorite(){

alert("Added to Favorites");

}

playChannel(channels[0].url);

</script>

</body>
</html>
