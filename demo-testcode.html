<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#050816">

<title>BTECH-TV WORLD ULTRA MAX X</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
--premium:#8b5cf6;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
height:70px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 15px;
gap:10px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 14px;
background:var(--card);
border:none;
border-radius:10px;
color:white;
cursor:pointer;
white-space:nowrap;
}

.top-buttons button:hover{
background:var(--accent);
color:black;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:320px;
background:#0b1220;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:18px 0 10px;
color:var(--accent);
font-size:15px;
}

.cat{
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(5px);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:380px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
}

.overlay h1{
font-size:70px;
margin-bottom:10px;
}

.overlay p{
color:#cbd5e1;
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 14px;
background:var(--card);
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

.controls button:hover{
background:var(--hover);
}

/* SEARCH */

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
border-color:var(--accent);
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:12px;
object-fit:cover;
background:black;
}

.info h4{
font-size:14px;
margin-bottom:5px;
}

.info small{
color:#cbd5e1;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#16a34a;
}

/* FOOTER */

.footer{
padding:10px;
background:#020617;
text-align:center;
font-size:12px;
color:#94a3b8;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:250px;
}

.player{
height:240px;
}

.channels{
grid-template-columns:1fr;
padding-bottom:120px;
}

}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV ULTRA MAX X
</div>

<div class="top-buttons">

<button onclick="loadUltraFeeds()">🚀 Ultra</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFullscreen()">⛶ Full</button>
<button onclick="shuffleChannels()">🎲 Shuffle</button>
<button onclick="togglePiP()">📺 PiP</button>

</div>

</div>

<!-- CONTAINER -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/in.m3u','India')">🇮🇳 India</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎬 Movies</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/music.m3u','Music')">🎵 Music</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/languages/eng.m3u','English')">🇬🇧 English</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/languages/ara.m3u','Arabic')">🇸🇦 Arabic</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading IPTV...
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div>

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
BTECH-TV STREAM ENGINE
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>

<button onclick="nextChannel()">Next ▶</button>

<button onclick="muteToggle()">🔊 Mute</button>

<button onclick="shareChannel()">🔗 Share</button>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search IPTV..."
oninput="searchChannels(this.value)"
>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

<!-- FOOTER -->

<div class="footer">
BTECH-TV WORLD ULTRA MAX X • EXTREME IPTV ENGINE
</div>

</div>

</div>

<script>

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;

const video=document.getElementById('video');

const extraFeeds=[

'https://iptv-org.github.io/iptv/index.m3u',

'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'

];

/* FLAGS */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* OVERLAY */

function showOverlay(text){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=text;

}

function hideOverlay(){

document.getElementById('overlay').style.display='none';

}

/* PLAYLIST */

async function loadPlaylist(url,group){

showOverlay('Loading '+group+' Channels...');

all=[];

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();

hideOverlay();

}catch(err){

alert('Playlist Load Failed');

}

}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=info.match(/tvg-logo="(.*?)"/);

const countryMatch=info.match(/tvg-country="(.*?)"/);

all.push({

id:all.length+1,
name:name,
url:url,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60',

country:
countryMatch
? countryMatch[1]
: '',

group:group

});

}

}

}

/* LOAD ULTRA */

async function loadUltraFeeds(){

showOverlay('Loading Ultra IPTV...');

all=[];

for(let url of extraFeeds){

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,'Ultra Feed');

}catch(err){

console.log(err);

}

}

filteredChannels=[...all];

renderChannels();

hideOverlay();

}

/* RENDER */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>${flag(c.country)} ${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div class="badge">
LIVE
</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAYER */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

showOverlay('Connecting Stream...');

if(currentHls){

currentHls.destroy();

currentHls=null;

}

video.pause();

video.removeAttribute('src');

video.load();

function startPlayback(){

video.play()
.then(()=>{

hideOverlay();

})
.catch(()=>{

showOverlay('Tap To Play');

});

}

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,
lowLatencyMode:true

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

startPlayback();

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

showOverlay('Stream Error');

setTimeout(()=>{
nextChannel();
},2000);

}

}
);

}else{

video.src=channel.url;

startPlayback();

}

}

/* SEARCH */

function searchChannels(q){

q=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(q)

||

c.group.toLowerCase().includes(q)

);

renderChannels();

}

/* NEXT/PREV */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* MUTE */

function muteToggle(){

video.muted=!video.muted;

}

/* SHARE */

function shareChannel(){

const channel=filteredChannels[currentIndex];

navigator.clipboard.writeText(channel.url);

alert('Stream URL Copied');

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#050816':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* SHUFFLE */

function shuffleChannels(){

filteredChannels.sort(()=>Math.random()-0.5);

renderChannels();

}

/* PiP */

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

/* SHORTCUTS */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

if(e.key==='f'){
toggleFullscreen();
}

});

/* AUTO LOAD */

loadUltraFeeds();

</script>

</body>
</html>
