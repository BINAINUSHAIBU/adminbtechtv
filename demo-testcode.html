<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:#0d1324;
border-right:1px solid #1d2b4f;
padding:20px;
overflow-y:auto;
z-index:1000;
}

.logo{font-size:28px;font-weight:900;color:#00d4ff;}
.subtitle{font-size:13px;color:#8ea2d9;margin-bottom:30px;}

.nav-btn{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#121c33;
color:#fff;
cursor:pointer;
transition:.3s;
}
.nav-btn:hover{background:#1e2f57;transform:translateX(5px);}

/* MAIN */
.main{
margin-left:260px;
padding:20px;
}

/* MARQUEE (SCROLLING TEXT) */
.marquee {
width:100%;
overflow:hidden;
white-space:nowrap;
}

.marquee span {
display:inline-block;
padding-left:100%;
animation:scroll 12s linear infinite;
font-weight:bold;
color:#00d4ff;
}

@keyframes scroll {
0% {transform:translateX(0);}
100% {transform:translateX(-100%);}
}

.marquee.big span{font-size:30px;margin-bottom:10px;}
.marquee.small span{font-size:20px;margin:15px 0;}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-bottom:20px;
}

.search-box input{
padding:12px;
border-radius:10px;
border:none;
background:#101a31;
color:#fff;
width:300px;
}

/* LIVE BADGE */
.live-badge{
background:red;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{opacity:.5;}
}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:25px;
border-radius:15px;
border:1px solid #1e3f78;
margin:20px 0;
}

.hero p{color:#c7d5ff;margin-top:10px;}

/* PLAYER */
.player-box{
background:#0f172d;
padding:15px;
border-radius:15px;
margin:20px 0;
}

video{
width:100%;
height:450px;
border-radius:10px;
background:black;
}

/* CHANNELS */
.section{
margin-top:20px;
}

.channels-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
margin-top:10px;
}

.channel-card{
background:#111a31;
padding:15px;
border-radius:15px;
cursor:pointer;
border:1px solid #1f355d;
transition:.3s;
}

.channel-card:hover{
transform:scale(1.05);
border-color:#00d4ff;
}

.badge{
background:red;
padding:4px 8px;
border-radius:10px;
font-size:10px;
float:right;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 WORLDTV</div>
<div class="subtitle">IPTV PRO SYSTEM</div>

<button class="nav-btn">🏠 Dashboard</button>
<button class="nav-btn">📡 Live TV</button>
<button class="nav-btn">⚽ Sports</button>
<button class="nav-btn">🎬 Movies</button>
<button class="nav-btn">📰 News</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- SCROLLING TITLE -->
<div class="marquee big">
  <span>WORLDTV IPTV MERGED SYSTEM • WORLDTV IPTV MERGED SYSTEM • WORLDTV IPTV MERGED SYSTEM •</span>
</div>

<!-- TOP BAR -->
<div class="topbar">
<input class="search-box" placeholder="Search channels...">
<div class="live-badge">🔴 LIVE</div>
</div>

<!-- HERO -->
<div class="hero">
<p>Global IPTV streaming dashboard with live channels, sports, movies & news.</p>
</div>

<!-- PLAYER -->
<div class="player-box">
<video id="video" controls autoplay muted></video>
</div>

<!-- SCROLLING SECTION TITLE -->
<div class="marquee small">
  <span>LIVE CHANNELS • SPORTS • NEWS • MOVIES • GOSPEL • INTERNATIONAL • LIVE CHANNELS •</span>
</div>

<!-- CHANNELS -->
<div class="section">
<div class="channels-grid" id="channelsGrid"></div>
</div>

</div>

<script>

const sampleStream =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

const video = document.getElementById("video");

function play(url){
if(Hls.isSupported()){
const hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

play(sampleStream);

/* SAMPLE CHANNELS */
const channels = [
"Sports TV",
"News 24",
"Music Live",
"Gospel World",
"Movie Hub",
"Global TV"
];

const grid = document.getElementById("channelsGrid");

channels.forEach(name=>{
const div=document.createElement("div");
div.className="channel-card";
div.innerHTML=`
<div class="badge">LIVE</div>
<h4>${name}</h4>
<p>Click to play</p>
`;
div.onclick=()=>play(sampleStream);
grid.appendChild(div);
});

</script>

</body>
</html>
