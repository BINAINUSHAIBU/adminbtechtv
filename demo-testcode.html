<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV SAAS PRO MAX ONE PAGE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
width:260px;background:#0d1324;padding:12px;overflow:auto;border-right:1px solid #1d2b4f
}
.sidebar h2{color:#00d4ff;font-size:18px}
.btn{
width:100%;padding:10px;margin:5px 0;background:#121c33;border:0;color:#fff;border-radius:8px;cursor:pointer
}
.btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOP */
.top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0f172a}
input{padding:10px;border-radius:8px;border:0;width:200px}

/* PLAYER */
.player{height:300px;background:#000}
video{width:100%;height:100%}

/* CHANNELS */
.channels{
flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:10px
}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d}
.card:hover{border-color:#00d4ff}

/* ADMIN PANEL */
.admin{
position:fixed;right:10px;bottom:10px;width:260px;background:#111827;padding:10px;border-radius:10px;
border:1px solid #00d4ff
}
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h2>📺 IPTV SAAS PRO</h2>

<button class="btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="btn" onclick="load('us')">🇺🇸 USA</button>
<button class="btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="btn" onclick="load('in')">🇮🇳 India</button>
<button class="btn" onclick="load('fr')">🇫🇷 France</button>

<hr>

<h2>🎬 Categories</h2>
<button class="btn" onclick="loadCat('news')">📰 News</button>
<button class="btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="btn" onclick="loadCat('movies')">🎬 Movies</button>

<hr>

<h2>⚙ SaaS Tools</h2>
<button class="btn" onclick="toggleAdmin()">Admin Panel</button>
<button class="btn" onclick="togglePiP()">PiP Mode</button>
<button class="btn" onclick="shuffle()">Shuffle</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="top">
<input oninput="search(this.value)" placeholder="Search IPTV channels...">
<div>🔴 LIVE IPTV SAAS</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin" style="display:none">
<b>🛠 ADMIN PANEL</b>
<p class="small">Channels: <span id="total">0</span></p>
<p class="small">Status: SaaS Demo Mode</p>
<button class="btn" onclick="clearAll()">Clear Channels</button>
<button class="btn" onclick="alert('User DB Simulated')">Users</button>
<button class="btn" onclick="alert('Upgrade to backend system')">Upgrade</button>
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* LOAD COUNTRY */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

/* LOAD CATEGORY */
async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

/* PARSE */
async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];

let lines=text.split("\n");

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith("#EXTINF")){
let name=lines[i].split(",").pop();
let url=lines[i+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
}

filtered=[...all];
render();
stats();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML="📺 "+c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* SHUFFLE */
function shuffle(){
filtered.sort(()=>Math.random()-0.5);
render();
}

/* PiP */
function togglePiP(){
if(document.pictureInPictureElement){
document.exitPictureInPicture();
}else{
video.requestPictureInPicture();
}
}

/* ADMIN */
function toggleAdmin(){
let a=document.getElementById("admin");
a.style.display=a.style.display==="none"?"block":"none";
}

/* CLEAR */
function clearAll(){
all=[];filtered=[];
render();
}

/* STATS */
function stats(){
document.getElementById("total").innerText=all.length;
}

/* AUTO START */
load("ng");

</script>

</body>
</html>
