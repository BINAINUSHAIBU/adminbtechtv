<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church TV Network Pro Max</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#070b14;
color:#fff;
}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
align-items:center;
}

.container{
display:flex;
height:calc(100vh - 50px);
}

.sidebar{
width:320px;
background:#0b1220;
padding:10px;
overflow:auto;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.player{
height:300px;
background:black;
position:relative;
}

video,iframe{
width:100%;
height:100%;
}

.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:5px 10px;
border-radius:20px;
display:none;
}

.card{
background:#111827;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

input,textarea{
width:100%;
padding:8px;
margin-top:5px;
border-radius:6px;
border:none;
background:#0b1220;
color:white;
}

button{
width:100%;
padding:8px;
margin-top:6px;
border:none;
border-radius:6px;
cursor:pointer;
}

.btn1{background:#22c55e;}
.btn2{background:#ef4444;}
.btn3{background:#f59e0b;}

.program{
padding:8px;
background:#1f2937;
margin-top:5px;
cursor:pointer;
border-radius:6px;
}

.chat{
flex:1;
overflow:auto;
padding:10px;
background:#111827;
}

.msg{
padding:6px;
background:#1f2937;
margin-bottom:5px;
border-radius:6px;
}

</style>
</head>

<body>

<div class="topbar">
<div>✝ CHURCH TV PRO MAX</div>
<button onclick="login()">Admin Login</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="card">
<h3>📡 Live Program Dashboard</h3>

<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="stream" placeholder="Stream URL">

<button class="btn1" onclick="save()">Save Program</button>
<button class="btn2" onclick="goLive()">Go Live</button>
<button class="btn3" onclick="stop()">Stop</button>
</div>

<div class="card">
<h3>Programs</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>⛪ Channels</h3>
<div class="program" onclick="load('RCCG LIVE')">RCCG LIVE</div>
<div class="program" onclick="load('Living Faith')">Living Faith</div>
<div class="program" onclick="load('Christ Embassy')">Christ Embassy</div>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">

<div class="live" id="live">🔴 LIVE</div>

<video id="video" controls></video>
<iframe id="frame" style="display:none;border:none;"></iframe>

</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<input id="msg" placeholder="Type message..." onkeydown="send(event)">

</div>

</div>

<script>

let programs = JSON.parse(localStorage.getItem("church") || "[]");
let logged=false;
let hls=null;

function login(){
let pass=prompt("Enter Admin Password");
if(pass==="rccg123"){
logged=true;
alert("Admin Logged In");
}else{
alert("Wrong Password");
}
}

function save(){
if(!logged){alert("Login required");return;}

programs.push({
title:title.value,
desc:desc.value,
stream:stream.value
});

localStorage.setItem("church",JSON.stringify(programs));
render();
}

function render(){
list.innerHTML="";
programs.forEach((p,i)=>{
list.innerHTML+=`
<div class="program" onclick="play(${i})">
<b>${p.title}</b><br><small>${p.desc}</small>
</div>`;
});
}

function play(i){
let p=programs[i];
loadStream(p.stream);
}

function loadStream(url){

live.style.display="block";

if(url.includes("youtube")){
video.style.display="none";
frame.style.display="block";
frame.src=url.replace("watch?v=","embed/");
return;
}

frame.style.display="none";
video.style.display="block";

if(Hls.isSupported()){
if(hls)hls.destroy();
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}
}

function goLive(){
live.style.display="block";
alert("LIVE STARTED ✝");
}

function stop(){
live.style.display="none";
video.pause();
video.src="";
frame.src="";
}

function load(name){
alert("Loading "+name);
}

function send(e){
if(e.key==="Enter"){
chat.innerHTML+=`<div class="msg">👤 ${msg.value}</div>`;
msg.value="";
}
}

render();

</script>

</body>
</html>
