<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* LOAD COUNTRY OR CATEGORY */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

/* PARSE M3U */
async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((line,idx,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="channel";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}
