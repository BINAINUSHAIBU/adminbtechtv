<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS - The Future of Social</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
/* =========================================================
NEXUS - GLOBAL STYLES
========================================================= */
:root{
--primary:#6366f1;
--primary2:#8b5cf6;
--accent:#22d3ee;
--accent2:#06ffa5;
--bg:#030712;
--bg2:#060c17;
--surface:#0f172a;
--surface2:#1e293b;
--surface3:#334155;
--text:#f1f5f9;
--text2:#94a3b8;
--text3:#64748b;
--success:#10b981;
--danger:#ef4444;
--warning:#f59e0b;
--gold:#ffd700;
--gradient:linear-gradient(135deg,#6366f1,#8b5cf6);
--glow:0 0 30px rgba(99,102,241,0.4);
--glow2:0 0 40px rgba(34,211,238,0.3);
--radius:12px;
--radius2:20px;
--radius3:30px;
--shadow:0 10px 40px rgba(0,0,0,0.4);
--transition:0.3s;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;font-size:15px;line-height:1.5}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
ul{list-style:none}
input,textarea,select{font-family:inherit}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

/* =========================================================
HEADER
========================================================= */
.topbar{position:fixed;top:0;width:100%;height:70px;background:rgba(3,7,18,0.95);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 25px;justify-content:space-between;z-index:2000;border-bottom:1px solid rgba(255,255,255,0.05)}
.logo{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.logo i{-webkit-text-fill-color:var(--accent);margin-right:5px}

.search-box{flex:1;max-width:450px;margin:0 40px;position:relative}
.search-box input{width:100%;background:var(--surface);border:none;padding:12px 20px 12px 45px;border-radius:30px;color:var(--text);font-size:14px;transition:var(--transition)}
.search-box input:focus{outline:none;box-shadow:0 0 0 2px var(--primary)}
.search-box i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text3)}

.top-actions{display:flex;gap:10px;align-items:center}
.top-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:none;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:var(--transition)}
.top-btn:hover{background:var(--surface2);color:var(--accent)}
.top-btn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;background:var(--danger);border-radius:50%;border:2px solid var(--bg)}
.top-btn .badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:white;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:bold}

.user-avatar{width:44px;height:44px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;cursor:pointer;border:3px solid transparent;transition:var(--transition)}
.user-avatar:hover{border-color:var(--accent);box-shadow:var(--glow)}

/* =========================================================
LAYOUT
========================================================= */
.container{display:flex;padding-top:70px;min-height:100vh}

/* LEFT SIDEBAR */
.left-panel{width:250px;position:fixed;height:calc(100vh-70px);overflow-y:auto;padding:15px}
.left-panel h3{text-transform:uppercase;font-size:10px;color:var(--text3);letter-spacing:1.5px;margin:20px 0 10px 15px;font-weight:700}

.nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);margin-bottom:3px;font-size:14px;font-weight:500;color:var(--text2);position:relative}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--gradient);color:white;box-shadow:var(--glow)}
.nav-item i{font-size:18px;width:22px}
.nav-item .badge{background:var(--danger);color:white;font-size:10px;padding:3px 8px;border-radius:10px;margin-left:auto;font-weight:bold}
.nav-item .live-dot{width:8px;height:8px;background:var(--danger);border-radius:50%;margin-left:8px;animation:pulse 1.5s infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.left-footer{position:fixed;bottom:15px;left:15px;font-size:11px;color:var(--text3)}

/* =========================================================
FEED
========================================================= */
.feed{width:600px;margin-left:270px;padding:20px;max-width:100%}

.stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{width:110px;height:190px;background:var(--surface);border-radius:var(--radius2);position:relative;overflow:hidden;flex-shrink:0;cursor:pointer;transition:var(--transition)}
.story:hover{transform:scale(1.04)}
.story::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent 40%);z-index:1}
.story img{width:100%;height:100%;object-fit:cover}
.story-avatar{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--gradient);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;z-index:2}
.story-user{position:absolute;bottom:10px;left:10px;font-size:12px;font-weight:600;z-index:2}

/* CREATE POST */
.create-post{background:var(--surface);border-radius:var(--radius2);padding:18px;margin-bottom:20px}
.cp-top{display:flex;gap:14px;align-items:center;margin-bottom:15px}
.cp-avatar{width:48px;height:48px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px}
.cp-input{flex:1}
.cp-input input{width:100%;background:var(--surface2);border:none;padding:13px 18px;border-radius:30px;color:var(--text);font-size:14px}
.cp-input input::placeholder{color:var(--text3)}
.cp-tools{display:flex;justify-content:space-around;border-top:1px solid var(--surface3);padding-top:15px}
.cp-tool{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:13px;font-weight:500;transition:var(--transition)}
.cp-tool:hover{background:var(--surface2);color:var(--text)}

/* POST CARD */
.post{background:var(--surface);border-radius:var(--radius2);margin-bottom:20px;overflow:hidden;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.post-header{display:flex;gap:14px;padding:18px;align-items:center}
.post-avatar{width:46px;height:46px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
.post-info{flex:1}
.post-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.verified{color:var(--primary);font-size:13px}
.post-meta{font-size:12px;color:var(--text3)}
.post-menu{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.post-content{padding:0 18px 15px}
.post-text{margin-bottom:14px;line-height:1.6}
.hashtag{color:var(--accent);cursor:pointer}
.hashtag:hover{text-decoration:underline}

/* POLL */
.post-poll{background:var(--surface2);border-radius:var(--radius);padding:15px;margin-bottom:15px}
.poll-question{font-weight:600;margin-bottom:12px}
.poll-opt{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--surface);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}
.poll-opt:hover{background(var(--surface3)}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:var(--primary);opacity:0.3;border-radius:10px 0 0 10px;width:0%;transition:width 0.8s}
.poll-percent{position:relative;z-index:1;font-weight:600}
.poll-votes{font-size:12px;color:var(--text3);margin-top:8px}

/* MEDIA */
.post-media{display:flex;gap:4px;border-radius:var(--radius);overflow:hidden;margin-bottom:15px}
.post-media.full img{width:100%;height:380px;object-fit:cover}
.post-media.cols2{flex:1}
.post-media.cols2 img{width:100%;height:250px;object-fit:cover}
.post-media.cols3{gap:3px}
.post-media.cols3 img{width:100%;height:180px;object-fit:cover}

/* REEL VIDEO */
.post-video{width:100%;height:380px;background:#000;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:15px}
.post-video video{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}
.vi-overlay{position:absolute;bottom:20px;left:20px;right:80px}
.vi-overlay h3{font-size:16px;margin-bottom:8px}
.vi-overlay p{font-size:13px;color:var(--text2)}
.vi-actions{position:absolute;right:15px;bottom:100px;display:flex;flex-direction:column;gap:20px}
.vi-action{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:white}
.vi-action i{font-size:26px}

/* TAGS */
.post-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{color:var(--accent);cursor:pointer;font-size:13px}
.tag:hover{text-decoration:underline}

/* STATS */
.post-stats{display:flex;justify-content:space-between;color:var(--text3);font-size:13px;padding:10px 18px;border-top:1px solid var(--surface2)}
.post-stats span{cursor:pointer}
.post-stats span:hover{color:var(--text)}

/* ACTIONS */
.post-actions{display:flex;justify-content:space-between;padding:8px 18px 15px}
.post-action{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:14px;font-weight:500;transition:var(--transition);flex:1;justify-content:center}
.post-action:hover{background:var(--surface2);color:var(--text)}
.post-action.liked{color:var(--danger)}
.post-action.liked i{font-weight:900}

/* COMMENTS */
.comments{padding:0 18px 18px;max-height:250px;overflow-y:auto}
.comment{display:flex;gap:10px;margin-top:12px}
.comment-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.comment-body{background:var(--surface2);padding:10px 14px;border-radius:var(--radius);flex:1}
.comment-name{font-weight:600;font-size:13px;margin-bottom:2px}
.comment-text{font-size:13px;color:var(--text2)}
.comment-likes{font-size:11px;color:var(--text3);margin-top:4px}

.comment-input{display:flex;gap:10px;padding:15px 18px;border-top:1px solid var(--surface2)}
.comment-input input{flex:1;background:var(--surface2);border:none;padding:10px 16px;border-radius:20px;color:var(--text);font-size:13px}
.comment-input input:focus{outline:none}
.comment-input button{background:var(--primary);border:none;padding:8px 14px;border-radius:20px;color:white;font-weight:600;cursor:pointer}

/* =========================================================
RIGHT PANEL
========================================================= */
.right-panel{width:300px;margin-left:900px;position:fixed;padding:15px;height:calc(100vh-70px);overflow-y:auto}
.panel-box{background:var(--surface);border-radius:var(--radius2);padding:18px;margin-bottom:18px}
.panel-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel-title span{color:var(--accent);font-size:12px;cursor:pointer}

/* TRENDING */
.trend-item{padding:12px 0;border-bottom:1px solid var(--surface2)}
.trend-item:last-child{border:none}
.trend-cat{font-size:11px;color:var(--text3)}
.trend-title{font-size:14px;font-weight:600;margin:4px 0}
.trend-posts{font-size:11px;color:var(--text3)}

/* SUGGESTIONS */
.sugg-item{display:flex;gap:12px;align-items:center;padding:8px 0}
.sugg-avatar{width:40px;height:40px;border-radius:50%;background:var(--gradient)}
.sugg-info{flex:1}
.sugg-name{font-size:14px;font-weight:600}
.sugg-mutual{font-size:11px;color:var(--text3)}
.sugg-btn{background:var(--primary);border:none;padding:6px 16px;border-radius:20px;color:white;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition)}
.sugg-btn:hover{background:var(--surface3)}

/* EVENTS */
.event-item{display:flex;gap:12px;padding:10px 0}
.event-date{width:45px;height:45px;background:var(--surface2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.event-day{font-size:18px;font-weight:bold;color:var(--accent)}
.event-month{font-size:10px;color:var(--text3);text-transform:uppercase}
.event-info{flex:1}
.event-title{font-size:14px;font-weight:600;margin-bottom:3px}
.event-loc{font-size:12px;color:var(--text3)}

/* MARKETplace */
.market-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.market-item{border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface2)}
.market-img{width:100%;height:90px;object-fit:cover}
.market-info{padding:10px}
.market-price{font-weight:700;color:var(--success);font-size:14px}
.market-title{font-size:12px;color:var(--text3)}

/* =========================================================
MODALS & POPUPS
================================
