<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA STREAM - Netflix + DSTV Clone</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
overflow:hidden;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:#111827;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00d4ff;
}

.menu button{
margin-left:8px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
cursor:pointer;
}

/* HERO */
.hero{
height:250px;
background:linear-gradient(90deg,#111827,#1f2937);
display:flex;
align-items:center;
padding:20px;
}

.hero h1{
font-size:28px;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 300px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0f172a;
padding:10px;
overflow:auto;
}

.sidebar h3{
color:#00d4ff;
}

.cat{
padding:10px;
margin-bottom:8px;
background:#1f2937;
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:#334155;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */
.player{
height:300px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
}

.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:5px 10px;
border-radius:20px;
}

/* ROWS */
.rows{
flex:1;
overflow:auto;
padding:10px;
}

.row-title{
margin:10px 0;
color:#00d4ff;
}

.row{
display:flex;
overflow-x:auto;
gap:10px;
}

.card{
min-width:160px;
height:90px;
background:#1f2937;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* LOGIN */
.login{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
}

.login-box{
background:#111827;
padding:20px;
border-radius:10px;
width:300px;
}

.login-box input{
width:100%;
padding:10px;
margin:5px 0;
background:#0f172a;
border:none;
color:white;
}

/* NOTIFY */
.notify{
position:fixed;
top:80px;
right:10px;
}

.note{
background:#1f2937;
padding:10px;
margin-bottom:5px;
border-left:4px solid #00d4ff;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">📺 ULTRA STREAM</div>
<div class="menu">
<button onclick="showLogin()">Login</button>
<button onclick="loadLive()">DSTV Live</button>
<button onclick="loadMovies()">Netflix Movies</button>
</div>
</div>

<div class="hero">
<h1>Unlimited Movies • Series • Live TV</h1>
</div>

<div class="container">

<div class="sidebar">
<h3>Categories</h3>
<div class="cat" onclick="loadMovies()">🎬 Movies</div>
<div class="cat" onclick="loadSeries()">📺 Series</div>
<div class="cat" onclick="loadLive()">📡 Live TV</div>
<div class="cat" onclick="notify('Premium Activated')">💎 Premium</div>
</div>

<div class="main">

<div class="player">
<div class="live">LIVE</div>
<video id="video" controls autoplay></video>
</div>

<div class="rows" id="rows"></div>

</div>

</div>

<!-- LOGIN -->
<div class="login" id="login">
<div class="login-box">
<h3>Login</h3>
<input placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="closeLogin()">Enter</button>
</div>
</div>

<!-- NOTIFY -->
<div class="notify" id="notify"></div>

<script>

let hls;
let video=document.getElementById("video");

/* NOTIFY */
function notify(msg){
let n=document.createElement("div");
n.className="note";
n.innerText=msg;
document.getElementById("notify").appendChild(n);
setTimeout(()=>n.remove(),3000);
}

/* LOGIN */
function showLogin(){
document.getElementById("login").style.display="flex";
}
function closeLogin(){
document.getElementById("login").style.display="none";
notify("Welcome User");
}

/* SAMPLE CONTENT */
function loadMovies(){

render([
{name:"Action Movie",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Drama Movie",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Sci-Fi Movie",url:"https://test-streams.mux.dev/dai-discontinuity-dash.mpd"}
],"Netflix Movies");

notify("Movies Loaded");
}

function loadSeries(){

render([
{name:"Series 1 Episode 1",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Series 2 Episode 3",url:"https://test-streams.mux.dev/test_001/stream.m3u8"}
],"Series");

notify("Series Loaded");
}

function loadLive(){

render([
{name:"DSTV Sports",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"News Live",url:"https://test-streams.mux.dev/test_001/stream.m3u8"}
],"Live TV");

notify("Live TV Loaded");
}

/* RENDER UI */
function render(items,title){

let box=document.getElementById("rows");
box.innerHTML="";

let h=document.createElement("div");
h.className="row-title";
h.innerText=title;
box.appendChild(h);

let row=document.createElement("div");
row.className="row";

items.forEach(v=>{

let d=document.createElement("div");
d.className="card";
d.innerText=v.name;

d.onclick=()=>play(v.url);

row.appendChild(d);

});

box.appendChild(row);
}

/* PLAY VIDEO */
function play(url){

notify("Playing Stream");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play();
});
}else{
video.src=url;
video.play();
}

}

</script>

</body>
</html>
