<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🚀 BTECH-TV SUPER ADMIN PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:white;
overflow:hidden;
}

/* TOPBAR */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar input{
padding:10px;
width:280px;
background:#0f1628;
border:none;
border-radius:8px;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:calc(100vh - 65px);
}

.sidebar{
width:240px;
background:#0f1628;
padding:15px;
overflow:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

.tab-active{
background:var(--accent);
color:black;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box p{
font-size:22px;
color:var(--accent);
}

/* GRID */

.grid{
flex:1;
overflow:auto;
padding:15px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

/* CARD */

.card{
background:var(--card);
padding:15px;
border-radius:12px;
}

.card:hover{
background:var(--hover);
}

/* BADGES */

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.active{background:#16a34a}
.banned{background:#dc2626}

.free{background:#16a34a}
.paid{background:#dc2626}

.online{background:#16a34a}
.offline{background:#dc2626}

.premium{
background:#f59e0b;
color:black;
}

/* BUTTON */

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
margin-top:8px;
font-weight:bold;
}

/* MONITOR */

.monitor{
position:fixed;
right:0;
top:65px;
width:320px;
height:calc(100vh - 65px);
background:#0f1628;
padding:10px;
overflow:auto;
}

video{
width:100%;
height:180px;
background:black;
border-radius:10px;
}

.liveItem{
padding:8px;
background:var(--card);
margin:6px 0;
border-radius:8px;
}

</style>
</head>

<body>

<div class="topbar">

<h2>
🚀 BTECH SUPER ADMIN PRO MAX
</h2>

<input
placeholder="Search users or channels..."
oninput="searchAll(this.value)"
>

</div>


<div class="container">

<div class="sidebar">

<div
class="cat tab-active"
onclick="switchTab('users',this)"
>
👥 Users
</div>

<div
class="cat"
onclick="switchTab('channels',this)"
>
📺 Channels
</div>

<hr style="margin:10px 0;opacity:.2">

<button onclick="generateUsers()">
Generate Users
</button>

<button onclick="loadAPI()">
Load IPTV API
</button>

</div>


<div class="main">

<div class="stats">

<div class="box">
<p id="t1">0</p>
<small>Total Users</small>
</div>

<div class="box">
<p id="t2">0</p>
<small>Total Channels</small>
</div>

<div class="box">
<p id="t3">0</p>
<small>Active / Free</small>
</div>

<div class="box">
<p id="t4">0</p>
<small>Banned / Online</small>
</div>

</div>

<div id="grid" class="grid"></div>

</div>

</div>



<!-- MONITOR -->

<div class="monitor">

<h3>
📺 LIVE IPTV MONITOR
</h3>

<video
id="player"
controls
></video>

<div id="liveList"></div>

</div>



<script>

/* ======================
STATE
====================== */

let users=[];
let channels=[];

let usersFiltered=[];
let channelsFiltered=[];

let view="users";
let hls=null;


/* ======================
TAB
====================== */

function switchTab(tab,el){

view=tab;

document.querySelectorAll(".cat")
.forEach(x=>x.classList.remove("tab-active"));

el.classList.add("tab-active");

render();

}


/* ======================
PLAYER
====================== */

function playStream(url){

let video=
document.getElementById("player");

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

video.play();

}


/* ======================
USERS
====================== */

function generateUsers(){

users=[];

for(let i=1;i<=200;i++){

users.push({

id:i,

name:"User_"+i,

email:
"user"+i+"@mail.com",

status:
i%10===0?
"banned":
"active",

premium:
i%7===0

});

}

usersFiltered=[...users];

render();

}


/* ======================
LOAD IPTV API
====================== */

async function loadAPI(){

channels=[];

try{

const [chRes,stRes]
= await Promise.all([

fetch(
"https://iptv-org.github.io/api/channels.json"
).then(r=>r.json()),

fetch(
"https://iptv-org.github.io/api/streams.json"
).then(r=>r.json())

]);

let map={};

chRes.forEach(c=>{

map[c.id]=c;

});


let id=1;

stRes.forEach(s=>{

if(
!s.url ||
s.url.includes("youtube")
)return;

let ch=
map[s.channel];

channels.push({

id:id++,

name:
ch?
ch.name:
"Unknown",

category:
ch?.categories?.[0]
||"General",

url:s.url,

type:
Math.random()>0.5
?"free"
:"paid",

status:"online",

viewers:
Math.floor(
Math.random()*100000
)

});

});

}catch{

await loadFallback();

}

channelsFiltered=
[...channels];

render();

renderLiveList();

}


/* ======================
M3U FALLBACK
====================== */

async function loadFallback(){

let r=
await fetch(
"https://iptv-org.github.io/iptv/index.m3u"
);

let t=
await r.text();

let lines=t.split("\n");

let temp={};

let id=1;

lines.forEach(l=>{

if(
l.startsWith("#EXTINF")
){

temp.name=
l.split(",")[1];

}

if(
l.startsWith("http")
){

channels.push({

id:id++,

name:
temp.name,

url:l,

category:
"General",

type:"free",

status:"online",

viewers:
Math.floor(
Math.random()*100000
)

});

}

});

}


/* ======================
LIVE LIST
====================== */

function renderLiveList(){

let box=
document.getElementById(
"liveList"
);

box.innerHTML="";

channels.slice(0,100)
.forEach(c=>{

let div=
document.createElement("div");

div.className=
"liveItem";

div.innerHTML=`

📺 ${c.name}

<br>

<button
onclick="playStream('${c.url}')">

Play

</button>

`;

box.appendChild(div);

});

}


/* ======================
RENDER
====================== */

function render(){

let grid=
document.getElementById(
"grid"
);

grid.innerHTML="";


if(view==="users"){

usersFiltered
.forEach(u=>{

grid.innerHTML+=`

<div class="card">

<h3>
👤 ${u.name}
</h3>

<p>
${u.email}
</p>

<span
class="badge ${u.status}"
>

${u.status}

</span>

${u.premium?
'<span class="badge premium">premium</span>'
:""}

</div>

`;

});

}else{

channelsFiltered
.forEach(c=>{

grid.innerHTML+=`

<div class="card">

<h3>
📺 ${c.name}
</h3>

<p>
${c.category}
</p>

<span
class="badge ${c.type}"
>

${c.type}

</span>

<span
class="badge online"
>

${c.status}

</span>

<p>

👥 ${c.viewers}

</p>

<button
onclick="playStream('${c.url}')"
>

▶ Play

</button>

</div>

`;

});

}

updateStats();

}


/* ======================
STATS
====================== */

function updateStats(){

t1.innerText=
users.length;

t2.innerText=
channels.length;

t3.innerText=
view==="users"

?

users.filter(
u=>u.status==="active"
).length

:

channels.filter(
c=>c.type==="free"
).length;


t4.innerText=
view==="users"

?

users.filter(
u=>u.status==="banned"
).length

:

channels.filter(
c=>c.status==="online"
).length;

}


/* ======================
SEARCH
====================== */

function searchAll(q){

q=q.toLowerCase();

if(view==="users"){

usersFiltered=
users.filter(u=>

u.name
.toLowerCase()
.includes(q)

||

u.email
.toLowerCase()
.includes(q)

);

}else{

channelsFiltered=
channels.filter(c=>

c.name
.toLowerCase()
.includes(q)

||

(c.category||"")
.toLowerCase()
.includes(q)

);

}

render();

}


/* INIT */

generateUsers();

loadAPI();

</script>

</body>
</html>
