<!-- BTECH-TV WORLD 2026 ULTRA PRO MAX -->
<!-- FULL UPGRADED ONE PAGE IPTV SYSTEM -->
<!-- GLASS UI + SMART SEARCH + FAST PLAYER -->
<!-- FAVORITES + RECENTS + HISTORY + AUTOSKIP -->
<!-- PIP + FULLSCREEN + KEYBOARD CONTROL -->
<!-- MOBILE + DESKTOP + SMART TV OPTIMIZED -->
<!-- NO FEATURES REMOVED -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
/>

<meta name="theme-color" content="#0ea5e9"/>

<title>BTECH-TV WORLD ULTRA</title>

<link rel="preconnect" href="https://iptv-org.github.io">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{

--bg:#020617;
--panel:#0f172a;
--card:#162033;
--hover:#22304d;
--accent:#0ea5e9;
--accent2:#38bdf8;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
--glass:rgba(255,255,255,.05);
--border:rgba(255,255,255,.08);

}

.light{

--bg:#f1f5f9;
--panel:#ffffff;
--card:#dbeafe;
--hover:#bfdbfe;
--text:#000000;
--muted:#475569;
--glass:rgba(255,255,255,.7);
--border:rgba(0,0,0,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{

width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);

}

body{
display:flex;
flex-direction:column;
transition:.3s;
}

/* TOPBAR */

.topbar{

min-height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 18px;
background:var(--panel);
border-bottom:1px solid var(--border);
gap:12px;
flex-wrap:wrap;

}

.logo{

font-size:24px;
font-weight:bold;
color:var(--accent2);

}

.top-buttons{

display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;

}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{

padding:10px 16px;
border:none;
border-radius:12px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.25s;
white-space:nowrap;

}

.top-buttons button:hover,
.top-buttons button.active{

background:var(--accent);
color:#000;
transform:translateY(-2px);

}

/* LAYOUT */

.container{

flex:1;
display:flex;
overflow:hidden;

}

.sidebar{

width:310px;
overflow-y:auto;
padding:15px;
background:var(--panel);
border-right:1px solid var(--border);

}

.sidebar h3{

margin:18px 0 12px;
color:var(--accent2);
font-size:16px;

}

.cat{

background:var(--card);
padding:13px;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
transition:.25s;
border:1px solid transparent;

}

.cat:hover{

background:var(--hover);
border-color:var(--accent);
transform:translateX(4px);

}

.main{

flex:1;
display:flex;
flex-direction:column;
overflow:hidden;

}

/* PLAYER */

.player{

height:380px;
background:black;
position:relative;
overflow:hidden;

}

.player video{

width:100%;
height:100%;
object-fit:contain;
background:black;

}

.live{

position:absolute;
top:15px;
left:15px;
background:red;
padding:7px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:10;
animation:pulse 1s infinite;

}

@keyframes pulse{

0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}

}

.overlay{

position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;

}

.loader{

width:60px;
height:60px;
border:5px solid rgba(255,255,255,.15);
border-top:5px solid var(--accent);
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:18px;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

/* NOW PLAYING */

.now-playing{

background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);

}

.now-info h2{

font-size:20px;
margin-bottom:5px;

}

.now-info p{

font-size:13px;
color:var(--muted);

}

.clock{

margin-top:6px;
font-size:12px;
color:var(--muted);

}

.controls{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.controls button{

padding:10px 15px;
border:none;
border-radius:12px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.25s;

}

.controls button:hover{

background:var(--accent);
color:#000;

}

/* STATS */

.stats{

padding:10px 16px;
background:#08101d;
font-size:13px;
color:var(--muted);
border-bottom:1px solid var(--border);

}

/* SEARCH */

.search-box{

padding:14px;
display:flex;
gap:10px;
background:var(--panel);
flex-wrap:wrap;

}

.search-box input,
.search-box select{

padding:13px;
border:none;
border-radius:12px;
background:var(--card);
color:var(--text);

}

.search-box input{

flex:1;
min-width:220px;

}

/* CHANNELS */

.channels{

flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:14px;

}

.channel{

background:var(--glass);
backdrop-filter:blur(10px);
padding:14px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
cursor:pointer;
border:1px solid var(--border);
transition:.25s;

}

.channel:hover{

background:var(--hover);
border-color:var(--accent);
transform:translateY(-2px);

}

.channel.active{

border-color:var(--accent);
box-shadow:0 0 0 1px var(--accent);

}

.left{

display:flex;
gap:12px;
align-items:center;
overflow:hidden;

}

.left img{

width:60px;
height:60px;
object-fit:cover;
border-radius:12px;
background:black;

}

.info{

overflow:hidden;

}

.info h4{

font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:5px;

}

.info small{

display:block;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:var(--muted);

}

.status{

display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;

}

.badge{

padding:5px 10px;
border-radius:30px;
font-size:11px;
font-weight:bold;

}

.liveBadge{
background:var(--success);
}

.dead{
background:var(--danger);
}

.fav{

font-size:21px;
cursor:pointer;

}

.fav.on{
color:gold;
}

/* FOOTER */

.footer{

height:55px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-top:1px solid var(--border);
font-size:13px;
color:var(--muted);

}

/* MOBILE */

@media(max-width:900px){

html,
body{
overflow:auto;
}

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{

width:100%;
max-height:260px;
border-right:none;
border-bottom:1px solid var(--border);

}

.player{
height:250px;
}

.channels{

grid-template-columns:1fr;
padding-bottom:120px;

}

.controls{
width:100%;
}

.controls button{

flex:1;
min-width:120px;

}

}

@media(max-width:600px){

.logo{
font-size:20px;
}

.player{
height:220px;
}

.left img{

width:50px;
height:50px;

}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
🌗 Theme
</button>

<button onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

</div>

</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎬 Movies</div>

<div class="cat" onclick="loadGlobalFeeds()">
🚀 Load Global Feeds
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
preload="auto"
></video>

<div class="overlay" id="overlay">

<div class="loader"></div>

<h2 id="overlayText">
Loading IPTV...
</h2>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global IPTV Streaming
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

<button id="autoBtn" onclick="toggleAutoSkip()">
⏭ Auto Skip
</button>

</div>

</div>

<!-- STATS -->

<div class="stats" id="stats">
0 Channels Loaded
</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">

<option value="az">
Sort A-Z
</option>

<option value="za">
Sort Z-A
</option>

</select>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">

<div id="footerNow">
Ready
</div>

<div>
⚡ BTECH-TV Ultra 2026
</div>

</div>

<script>

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let autoSkipOn=true;
let dark=true;

const video=
document.getElementById('video');

const overlay=
document.getElementById('overlay');

const favs=
JSON.parse(localStorage.getItem('btech_favs') || '{}');

let recent=
JSON.parse(localStorage.getItem('btech_recent') || '[]');

const extraFeeds=[

'https://iptv-org.github.io/iptv/index.m3u',
'https://iptv-org.github.io/iptv/index.country.m3u',
'https://iptv-org.github.io/iptv/index.category.m3u',
'https://iptv-org.github.io/iptv/index.language.m3u'

];

/* CLOCK */

function tick(){

document.getElementById('clock').innerText=

new Date().toLocaleTimeString([],{

hour:'2-digit',
minute:'2-digit'

});

}

setInterval(tick,1000);

tick();

/* FLAG */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=127462;

return String.fromCodePoint(

a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65

);

}

/* LOADING */

function loading(state,text='Loading...'){

overlay.style.display=
state ? 'flex':'none';

document.getElementById('overlayText').innerText=text;

}

/* LOAD PLAYLIST */

async function loadPlaylist(url,group){

loading(true,'Loading '+group+'...');

all=[];

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,group);

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

loading(false);

}catch(err){

alert('Failed to load playlist');

console.log(err);

loading(false);

}

}

/* GLOBAL FEEDS */

async function loadGlobalFeeds(){

loading(true,'Loading Global Feeds...');

all=[];

for(let url of extraFeeds){

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,'Global Feed');

}catch(err){

console.log(err);

}

}

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

loading(false);

}

/* PARSE */

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const logo=
info.match(/tvg-logo="(.*?)"/);

const country=
info.match(/tvg-country="(.*?)"/);

all.push({

id:all.length+1,

name:info.split(',').pop(),

url:url,

logo:logo
? logo[1]
: 'https://via.placeholder.com/60',

country:country
? country[1]
: '',

group:group

});

}

}

}

/* REMOVE DUPLICATES */

function removeDuplicates(){

const seen=new Set();

all=all.filter(ch=>{

const key=ch.name+ch.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

/* RENDER */

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){

div.classList.add('active');

}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<div class="badge liveBadge">
LIVE
</div>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=
filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

document.getElementById('footerNow').innerText=
'▶ '+channel.name;

if(currentHls){

currentHls.destroy();

}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,
lowLatencyMode:true,
backBufferLength:30,
maxBufferLength:10,
liveSyncDuration:3,
liveMaxLatencyDuration:5

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play().catch(()=>{});

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

if(autoSkipOn){

nextChannel();

}

}

}
);

}else{

video.src=channel.url;

video.play().catch(()=>{});

}

addRecent(channel.id);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

q=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(q)

||

c.group.toLowerCase().includes(q)

);

renderChannels();

updateStats();

}

/* SORT */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>

a.name.localeCompare(b.name)

);

}else{

filteredChannels.sort((a,b)=>

b.name.localeCompare(a.name)

);

}

renderChannels();

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){

delete favs[id];

}else{

favs[id]=1;

}

localStorage.setItem(
'btech_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* RECENT */

function addRecent(id){

recent=recent.filter(x=>x!==id);

recent.unshift(id);

recent=recent.slice(0,30);

localStorage.setItem(
'btech_recent',
JSON.stringify(recent)
);

}

/* TABS */

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){

filteredChannels=[...all];

}

if(type==='favs'){

filteredChannels=
all.filter(c=>favs[c.id]);

}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=
all.find(c=>c.id===id);

if(ch){

filteredChannels.push(ch);

}

});

}

renderChannels();

updateStats();

}

/* NEXT */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){

currentIndex=0;

}

playChannel(currentIndex);

}

/* PREV */

function prevChannel(){

currentIndex--;

if(currentIndex<0){

currentIndex=
filteredChannels.length-1;

}

playChannel(currentIndex);

}

/* PIP */

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

/* SHARE */

function shareChannel(){

const channel=
filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({

title:channel.name,
url:channel.url

});

}else{

navigator.clipboard.writeText(channel.url);

alert('Copied');

}

}

/* AUTOSKIP */

function toggleAutoSkip(){

autoSkipOn=!autoSkipOn;

document.getElementById('autoBtn').innerText=

autoSkipOn
? '⏭ Auto Skip'
: '⏭ Skip OFF';

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.body.classList.toggle('light');

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* STATS */

function updateStats(){

document.getElementById('stats').innerText=

filteredChannels.length+
' Channels Loaded';

}

/* KEYBOARD */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

if(e.key==='f'){
toggleFullscreen();
}

});

/* START */

loadPlaylist(

'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'

);

</script>

</body>
</html>
