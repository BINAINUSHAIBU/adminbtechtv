<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV WORLD ULTRA MAX X 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{
display:flex;justify-content:space-between;align-items:center;
padding:10px 15px;background:#0f172a;border-bottom:1px solid #1e293b;
}
.logo{color:var(--accent);font-size:20px;font-weight:bold;}
.btns button{
margin-left:8px;padding:8px 12px;border:none;border-radius:8px;
background:#172033;color:white;cursor:pointer;
}

/* DASHBOARD */
.dashboard{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:10px;
background:#020617;
}
.card{
background:var(--card);padding:10px;border-radius:10px;text-align:center;
}
.card h3{font-size:12px;color:var(--muted);}
.card span{font-size:18px;color:var(--accent);font-weight:bold;}

/* LAYOUT */
.container{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
.sidebar{
width:280px;background:#0b1220;overflow:auto;padding:10px;
}
.cat{padding:10px;background:var(--card);margin-bottom:8px;border-radius:8px;cursor:pointer;}
.cat:hover{background:#22304d;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* PLAYER */
.player{
height:350px;background:black;position:relative;
}
.player video{width:100%;height:100%;object-fit:contain;}
.live{
position:absolute;top:10px;left:10px;
background:red;padding:6px 10px;border-radius:20px;font-size:12px;
}

/* SEARCH */
.search{
padding:8px;background:#111827;
}
.search input{
width:100%;padding:10px;border:none;border-radius:8px;
background:#0f172a;color:white;
}

/* CHANNEL LIST */
.channels{
flex:1;overflow:auto;display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:10px;padding:10px;
}
.channel{
background:var(--card);padding:10px;border-radius:10px;
cursor:pointer;transition:.3s;
}
.channel:hover{transform:translateY(-2px);border:1px solid var(--accent);}
.channel small{color:var(--muted);}

/* NOTIFY */
.notify{
position:fixed;top:80px;right:10px;z-index:9999;
}
.note{
background:#172033;padding:10px;margin-bottom:8px;
border-left:4px solid var(--accent);border-radius:8px;
}

/* LOGIN */
.login{
position:fixed;inset:0;background:rgba(0,0,0,.8);
display:none;justify-content:center;align-items:center;
}
.box{
background:#111827;padding:20px;border-radius:10px;width:300px;
}
.box input{
width:100%;margin-bottom:10px;padding:10px;
background:#0f172a;border:none;color:white;border-radius:8px;
}
.box button{
width:100%;padding:10px;background:var(--accent);
border:none;border-radius:8px;font-weight:bold;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH-TV ULTRA MAX X 2026</div>

<div class="btns">
<button onclick="loadSample()">Feeds</button>
<button onclick="toggleLogin()">Login</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
<div class="card"><h3>Channels</h3><span id="tch">0</span></div>
<div class="card"><h3>Favorites</h3><span id="favc">0</span></div>
<div class="card"><h3>Recents</h3><span id="rec">0</span></div>
<div class="card"><h3>Status</h3><span>ONLINE</span></div>
</div>

<!-- MAIN -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat" onclick="loadSample()">📡 Load IPTV</div>
<div class="cat" onclick="clearRecents()">🗑 Clear Recents</div>
<div class="cat" onclick="notify('⚡ Boost Enabled')">⚡ Boost</div>
</div>

<!-- MAIN AREA -->
<div class="main">

<!-- PLAYER -->
<div class="player">
<div class="live">🔴 LIVE</div>
<video id="video" controls autoplay></video>
</div>

<!-- SEARCH -->
<div class="search">
<input id="search" placeholder="Search channels..." oninput="search(this.value)">
</div>

<!-- CHANNELS -->
<div id="list" class="channels"></div>

</div>
</div>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<h3>Login</h3>
<input placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="toggleLogin()">Enter</button>
</div>
</div>

<!-- NOTIFY -->
<div class="notify" id="notify"></div>

<script>

let all=[];
let fav={};
let rec=[];
let hls;
const video=document.getElementById("video");

/* NOTIFY */
function notify(msg){
const n=document.createElement("div");
n.className="note";
n.innerText=msg;
document.getElementById("notify").appendChild(n);
setTimeout(()=>n.remove(),3000);
}

/* LOGIN */
function toggleLogin(){
const l=document.getElementById("login");
l.style.display=l.style.display==="flex"?"none":"flex";
}

/* FULLSCREEN */
function toggleFullscreen(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* SAMPLE DATA */
function loadSample(){

all=[
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",group:"News"},
{name:"Sports Live",url:"https://test-streams.mux.dev/test_001/stream.m3u8",group:"Sports"},
{name:"Movie Channel",url:"https://test-streams.mux.dev/dai-discontinuity-dash.mpd",group:"Movies"}
];

render();
notify("Channels Loaded");
}

/* RENDER */
function render(){

document.getElementById("tch").innerText=all.length;
document.getElementById("favc").innerText=Object.keys(fav).length;
document.getElementById("rec").innerText=rec.length;

let box=document.getElementById("list");
box.innerHTML="";

all.forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";
div.innerHTML=`
<b>${c.name}</b><br>
<small>${c.group}</small>
`;

div.onclick=()=>play(c);

box.appendChild(div);

});

}

/* PLAY */
function play(c){

rec.unshift(c.name);
rec=rec.slice(0,20);

notify("Playing "+c.name);

if(hls)hls.destroy();

if(Hls.isSupported()){

hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play();
});

}else{
video.src=c.url;
video.play();
}

}

/* SEARCH */
function search(v){
v=v.toLowerCase();
let box=document.getElementById("list");
box.innerHTML="";

all.filter(c=>c.name.toLowerCase().includes(v))
.forEach(c=>{

let div=document.createElement("div");
div.className="channel";
div.innerHTML=`<b>${c.name}</b><br><small>${c.group}</small>`;
div.onclick=()=>play(c);
box.appendChild(div);

});

}

/* CLEAR RECENTS */
function clearRecents(){
rec=[];
notify("Recents cleared");
render();
}

</script>

</body>
</html>
