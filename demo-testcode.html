


<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH SCREEN */
#authBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.auth-card{
background:#0d1324;
padding:20px;
border-radius:12px;
width:320px;
text-align:center;
border:1px solid #1d2b4f;
}

.auth-card input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
background:#101a31;
color:#fff;
}

.auth-card button{
width:100%;
padding:10px;
margin-top:10px;
background:#00d4ff;
border:none;
border-radius:6px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{background:linear-gradient(135deg,#07132f,#0f1d45);padding:10px;border-radius:10px;margin-bottom:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* PLAYER */
.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;flex-shrink:0;}
video{width:100%;height:100%;}

/* CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;flex-shrink:0;}
.controls button{padding:8px 10px;border:none;border-radius:6px;background:#152445;color:#fff;cursor:pointer;}
.controls button:hover{background:#00d4ff;color:#000}

/* CHANNELS */
.channel-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}
.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
transition:.3s;
}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

/* TIMER */
#timerBar{
position:fixed;
top:10px;
right:10px;
background:#00d4ff;
color:#000;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
z-index:999;
}

@media(max-width:900px){
body{flex-direction:column;}
.sidebar{width:100%;}
}

</style>
</head>

<body>

<!-- TIMER -->
<div id="timerBar">Trial: Loading...</div>

<!-- AUTH -->
<div id="authBox">
  <div class="auth-card">
    <h3>🔐 BTECH-TV WORLD  ACCESS</h3>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV WORLD PRO MAX</div>
<div class="sub">Ultra BTECH-TV WORLD PRO MAX Engine X</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>

<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>
<button class="nav-btn" onclick="load('de')">🇩🇪 Germany</button>
<button class="nav-btn" onclick="load('br')">🇧🇷 Brazil</button>
<button class="nav-btn" onclick="load('za')">🇿🇦 South Africa</button>
<button class="nav-btn" onclick="load('ca')">🇨🇦 Canada</button>
<button class="nav-btn" onclick="load('au')">🇦🇺 Australia</button>
<button class="nav-btn" onclick="load('jp')">🇯🇵 Japan</button>
<button class="nav-btn" onclick="load('kr')">🇰🇷 South Korea</button>
<button class="nav-btn" onclick="load('cn')">🇨🇳 China</button>
<button class="nav-btn" onclick="load('es')">🇪🇸 Spain</button>
<button class="nav-btn" onclick="load('it')">🇮🇹 Italy</button>
<button class="nav-btn" onclick="load('tr')">🇹🇷 Turkey</button>
<button class="nav-btn" onclick="load('mx')">🇲🇽 Mexico</button>
<button class="nav-btn" onclick="load('ae')">🇦🇪 UAE</button>
<button class="nav-btn" onclick="load('sa')">🇸🇦 Saudi Arabia</button>
<button class="nav-btn" onclick="load('eg')">🇪🇬 Egypt</button>
<button class="nav-btn" onclick="load('ar')">🇦🇷 Argentina</button>
<button class="nav-btn" onclick="load('pk')">🇵🇰 Pakistan</button>
<button class="nav-btn" onclick="load('id')">🇮🇩 Indonesia</button>
<button class="nav-btn" onclick="load('ph')">🇵🇭 Philippines</button>
<button class="nav-btn" onclick="load('al')">🇦🇱 Albania</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">📰 News</button>

<div class="menu-title">🗣 Languages</div>
<button class="nav-btn" onclick="load('eng')">🇬🇧 English</button>
<button class="nav-btn" onclick="load('spa')">🇪🇸 Spanish</button>
<button class="nav-btn" onclick="load('ara')">🇸🇦 Arabic</button>
<button class="nav-btn" onclick="load('fra')">🇫🇷 French</button>
<button class="nav-btn" onclick="load('hin')">🇮🇳 Hindi</button>
<button class="nav-btn" onclick="load('zho')">🇨🇳 Chinese</button>
<button class="nav-btn" onclick="load('por')">🇵🇹 Portuguese</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn" onclick="scanStreams()">📡 Scan</button>

<button class="nav-btn" onclick="optimizeMemory()">🧠 Optimize</button>
<button class="nav-btn" onclick="logout()">🚪 Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>BTECH-TV WORLD PRO MAX SYSTEM</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ Fav <div id="fav">0</div></div>
<div class="stat">⚫ Dead <div id="dead">0</div></div>
<div class="stat">🌍 Live <div id="live">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="next()">▶ Next</button>
<button onclick="prev()">◀ Prev</button>
<button onclick="toggleMute()">🔊 Mute</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
<button onclick="loadUltra()">🚀 Global</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

/* AUTH + TRIAL */
const TRIAL_TIME = Infinity;
function register(){
let e=email.value,p=pass.value;
if(!e||!p)return alert("Fill all");
localStorage.setItem("user",JSON.stringify({e,p}));
alert("Registered");
}

function login(){
let e=email.value,p=pass.value;
let u=JSON.parse(localStorage.getItem("user"));
if(!u||u.e!==e||u.p!==p)return alert("Invalid");

/* start timer */
if(!localStorage.getItem("startTime")){
localStorage.setItem("startTime",Date.now());
}

authBox.style.display="none";
startTimer();
loadUltra();
}

function logout(){
localStorage.removeItem("startTime");
location.reload();
}

function startTimer(){
setInterval(()=>{
let s=localStorage.getItem("startTime");
if(!s)return;

let d=TRIAL_TIME-(Date.now()-s);
if(d<=0){
document.body.innerHTML=`
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
flex-direction:column;
color:white;
font-family:Arial">
<h1>🔓 Upgrade Required</h1>
<p>Your trial has ended.</p>
<button onclick="unlockChannels()" style="
padding:12px 20px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer">
UNLOCK ALL CHANNELS
</button>
</div>
`;
return;
}
  function unlockChannels(){
localStorage.setItem("premium","true");
location.reload();
}
  function login(){

let e=email.value,p=pass.value;
let u=JSON.parse(localStorage.getItem("user"));

if(!u||u.e!==e||u.p!==p)
return alert("Invalid");

if(localStorage.getItem("premium")==="true"){
authBox.style.display="none";
timerBar.innerHTML="🔓 PREMIUM UNLOCKED";
loadUltra();
return;
}

if(!localStorage.getItem("startTime")){
localStorage.setItem("startTime",Date.now());
}

authBox.style.display="none";
startTimer();
loadUltra();
}
  

timerBar.innerText=`Trial Left: ${Math.floor(d/3600000)}h ${Math.floor(d%3600000/60000)}m ${Math.floor(d%60000/1000)}s`;
},1000);
}

/* IPTV CORE */
let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((l,idx,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=arr[idx+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

filtered=[...all];
render();
stats();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class='badge'>LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}
function toggleFullscreen(){video.requestFullscreen();}

function scanStreams(){alert("Scanning...");}
function speedBoost(){video.playbackRate=1.15;}
function repairStreams(){alert("Repairing...");}
function optimizeMemory(){alert("Optimizing...");}

function stats(){
total.innerText=all.length;
live.innerText=all.length;
dead.innerText=0;
fav.innerText=0;
}

/* INIT */
loadUltra();

</script>

</body>
</html>
