<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLOBAL OTT SAAS PRO SECURE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN */
#auth{
position:fixed;
inset:0;
background:#020617;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
z-index:999;
}

input{
padding:10px;
width:220px;
border:none;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#1f2a44;
color:#fff;
}

button:hover{background:#00d4ff;color:#000}

/* SIDEBAR */
.sidebar{
width:240px;
background:#0f172a;
padding:10px;
overflow:auto;
}

.menu{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

.menu:hover{background:#1e293b}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0b1220;
}

/* PLAYER */
.player{
height:300px;
background:black;
}

video{
width:100%;
height:100%;
}

/* GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

/* ADMIN */
.admin{
position:fixed;
right:10px;
bottom:10px;
width:240px;
background:#0f172a;
border:1px solid #00d4ff;
border-radius:10px;
padding:10px;
display:none;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<h2>🔐 OTT SAAS LOGIN</h2>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="loadContent()">📺 Load Content</div>
<div class="menu" onclick="openAdmin()">🛠 Admin Panel</div>
<div class="menu" onclick="logout()">🚪 Logout</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>🌍 GLOBAL OTT SAAS PRO</div>
<div id="status">OFFLINE</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<button onclick="alert('Admin API protected')">Check Stats</button>
<button onclick="clearCache()">Clear Cache</button>
</div>

<script>

let token=null;
let role="user";
let content=[];
let video=document.getElementById("video");
let hls;

/* ================= LOGIN (JWT BACKEND) ================= */
async function login(){

const res = await fetch("http://localhost:5000/api/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:pass.value
})
});

const data = await res.json();

if(data.token){

token=data.token;
role=data.user.role;

localStorage.setItem("token",token);

document.getElementById("auth").style.display="none";
document.getElementById("status").innerText="ONLINE";

loadContent();

}else{
alert("Login failed");
}

}

/* ================= LOAD PROTECTED CONTENT ================= */
async function loadContent(){

const res = await fetch("http://localhost:5000/api/content",{
headers:{
Authorization:"Bearer "+localStorage.getItem("token")
}
});

content = await res.json();

render();

}

/* ================= RENDER ================= */
function render(){

let grid=document.getElementById("grid");
grid.innerHTML="";

content.forEach(c=>{

let div=document.createElement("div");
div.className="card";
div.innerHTML="📺 "+(c.title || c.name);

div.onclick=()=>play(c.url);

grid.appendChild(div);

});

}

/* ================= PLAYER ================= */
function play(url){

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* ================= ADMIN PROTECTION ================= */
async function openAdmin(){

if(role!=="admin"){
alert("❌ Admin only access");
return;
}

const res = await fetch("http://localhost:5000/api/admin/dashboard",{
headers:{
Authorization:"Bearer "+localStorage.getItem("token")
}
});

const data = await res.json();

alert(`Users: ${data.users}\nContent: ${data.content}`);

document.getElementById("admin").style.display="block";

}

/* ================= LOGOUT ================= */
function logout(){
localStorage.removeItem("token");
location.reload();
}

/* ================= UTILS ================= */
function clearCache(){
localStorage.clear();
alert("Cache cleared");
}

</script>

</body>
</html>
