<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global TV Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f1a;
  color: white;
}

/* HEADER */
header {
  background: #111;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #00ffcc;
}

/* LAYOUT */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  background: #1c1c2e;
  height: 100vh;
  padding: 10px;
  overflow-y: auto;
}

.channel {
  padding: 10px;
  margin: 5px 0;
  background: #2a2a40;
  cursor: pointer;
  border-radius: 5px;
}

.channel:hover {
  background: #00ffcc;
  color: black;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

video {
  width: 100%;
  max-height: 500px;
  background: black;
}

/* ADMIN PANEL */
.admin {
  margin-top: 20px;
  padding: 10px;
  background: #1c1c2e;
}

input, button {
  padding: 10px;
  margin: 5px;
  width: 90%;
}

button {
  background: #00ffcc;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #00b38f;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 10px;
  background: #111;
  color: #888;
}
</style>
</head>

<body>

<header>
📺 GLOBAL TV HUB — LIVE STREAM PLATFORM
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📡 Channels</h3>

<div class="channel" onclick="playChannel('channel1')">News Channel</div>
<div class="channel" onclick="playChannel('channel2')">Sports Live</div>
<div class="channel" onclick="playChannel('channel3')">Music TV</div>
<div class="channel" onclick="playChannel('channel4')">Movie Channel</div>
<div class="channel" onclick="playChannel('channel5')">Kids TV</div>

</div>

<!-- MAIN -->
<div class="main">

<h2 id="title">Select a Channel</h2>

<video id="player" controls autoplay>
<source id="source" src="" type="application/x-mpegURL">
</video>

<!-- ADMIN PANEL -->
<div class="admin">
<h3>🏢 Super Admin Panel (Demo)</h3>

<input type="text" id="channelName" placeholder="Channel Name">
<input type="text" id="streamURL" placeholder="Stream URL (.m3u8 or mp4)">
<button onclick="addChannel()">Add Channel</button>

<h4>📡 Dynamic Channels</h4>
<div id="dynamicChannels"></div>
</div>

</div>
</div>

<footer>
© 2026 Global TV Hub | OTT Streaming System
</footer>

<script>
// STATIC CHANNELS
let channels = {
  channel1: {
    name: "News Channel",
    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  },
  channel2: {
    name: "Sports Live",
    url: "https://test-streams.mux.dev/test_001/stream.m3u8"
  },
  channel3: {
    name: "Music TV",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  },
  channel4: {
    name: "Movie Channel",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
  },
  channel5: {
    name: "Kids TV",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
  }
};

// PLAY CHANNEL
function playChannel(key) {
  document.getElementById("title").innerText = channels[key].name;
  document.getElementById("source").src = channels[key].url;
  document.getElementById("player").load();
}

// ADD CHANNEL (ADMIN DEMO)
function addChannel() {
  let name = document.getElementById("channelName").value;
  let url = document.getElementById("streamURL").value;

  if (!name || !url) return alert("Fill all fields");

  let id = "ch" + Object.keys(channels).length;

  channels[id] = { name, url };

  renderChannels();
}

// RENDER DYNAMIC CHANNELS
function renderChannels() {
  let container = document.getElementById("dynamicChannels");
  container.innerHTML = "";

  Object.keys(channels).forEach(key => {
    let div = document.createElement("div");
    div.className = "channel";
    div.innerText = channels[key].name;
    div.onclick = () => playChannel(key);
    container.appendChild(div);
  });
}

// INIT
renderChannels();
</script>

</body>
</html>
