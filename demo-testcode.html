// ─────────────────────────────
// COUNTRY DETECTION
// ─────────────────────────────

function detectCountry(name){

name=(name||'').toLowerCase();

var map={

'nigeria':'NG',
'abuja':'NG',
'lagos':'NG',

'usa':'US',
'cnn':'US',
'fox':'US',

'bbc':'GB',
'uk':'GB',

'india':'IN',
'zee':'IN',

'pakistan':'PK',

'al jazeera':'QA',

'france':'FR',
'germany':'DE',
'italy':'IT',
'spain':'ES',
'turkey':'TR',
'canada':'CA',
'brazil':'BR',
'japan':'JP',
'korea':'KR',
'china':'CN',
'south africa':'ZA',
'ghana':'GH',
'kenya':'KE'

};

for(var k in map){

if(name.indexOf(k)!==-1){

return map[k];

}

}

return null;

}

// ─────────────────────────────
// PARSE M3U
// ─────────────────────────────

function parseM3U(text){

var lines=text.split('\n');

var channels=[];

var current=null;

lines.forEach(function(line){

line=line.trim();

if(line.startsWith('#EXTINF')){

current={};

var name=line.split(',').pop();

current.name=name;

current.cc=detectCountry(name);

if(name.match(/4k|2160/i)){
current.q='4K';
}
else if(name.match(/1080|fhd/i)){
current.q='1080p';
}
else if(name.match(/720|hd/i)){
current.q='HD';
}

}
else if(line && !line.startsWith('#')){

if(current){

current.url=line;

channels.push(current);

current=null;

}

}

});

return channels;

}

// ─────────────────────────────
// LOAD CHANNELS
// ─────────────────────────────

async function loadChannels(){

all=[];

document.getElementById('status').innerText=
'🌍 LOADING CHANNELS...';

for(let feed of extraFeeds){

try{

let res=await fetch(feed.url);

let txt=await res.text();

let parsed=parseM3U(txt);

parsed.forEach(function(c){

c.category=feed.name;

});

all=all.concat(parsed);

document.getElementById('status').innerText=
'⏳ '+all.length+' CHANNELS LOADED...';

}catch(e){

console.log('FAILED',feed.name);

}

}

filtered=all;

renderChannels();

document.getElementById('status').innerText=
'🌍 MEGA IPTV ACTIVE · '+all.length+' CHANNELS';

}

// ─────────────────────────────
// RENDER CHANNELS
// ─────────────────────────────

function renderChannels(){

var list=document.getElementById('channelList');

list.innerHTML='';

filtered.forEach(function(c,index){

var div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div>

<div class="channel-name">

${c.cc?flag(c.cc)+' ':''}

${c.name}

${c.q?'<span class="q">'+c.q+'</span>':''}

</div>

<div class="channel-meta">

${c.category}

</div>

</div>

<div
class="fav"
onclick="event.stopPropagation();toggleFav('${c.name.replace(/'/g,"\\'")}')"
>

${favs[c.name]?'★':'☆'}

</div>

`;

div.onclick=function(){

currentIndex=index;

currentChannel=c;

playChannel(c.url);

addRecent(c.name);

};

list.appendChild(div);

});

}

// ─────────────────────────────
// PLAY CHANNEL
// ─────────────────────────────

function playChannel(url){

var video=document.getElementById('video');

if(currentChannel){

document.getElementById('nowPlaying').innerText=
'▶ PLAYING: '+currentChannel.name;

document.getElementById('epg').innerText=
'📺 CATEGORY: '+currentChannel.category;

}

if(Hls.isSupported()){

if(hls){
hls.destroy();
}

hls=new Hls({
enableWorker:true
});

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play();

aliveCh[url]=1;

});

hls.on(Hls.Events.ERROR,function(){

deadCh[url]=1;

});

}else{

video.src=url;

video.play();

}

}

// ─────────────────────────────
// NEXT / PREV
// ─────────────────────────────

function nextChannel(){

if(filtered.length===0)return;

currentIndex++;

if(currentIndex>=filtered.length){

currentIndex=0;

}

currentChannel=filtered[currentIndex];

playChannel(currentChannel.url);

}

function prevChannel(){

if(filtered.length===0)return;

currentIndex--;

if(currentIndex<0){

currentIndex=filtered.length-1;

}

currentChannel=filtered[currentIndex];

playChannel(currentChannel.url);

}

// ─────────────────────────────
// FAVORITES
// ─────────────────────────────

function toggleFav(name){

if(favs[name]){

delete favs[name];

}else{

favs[name]=1;

}

localStorage.setItem(
'mega_favs',
JSON.stringify(favs)
);

doFilter();

}

// ─────────────────────────────
// RECENT
// ─────────────────────────────

function addRecent(name){

recent=recent.filter(function(r){

return r!==name;

});

recent.unshift(name);

if(recent.length>20){

recent=recent.slice(0,20);

}

localStorage.setItem(
'mega_recent',
JSON.stringify(recent)
);

}

// ─────────────────────────────
// SEARCH
// ─────────────────────────────

document
.getElementById('search')
.addEventListener('input',function(){

doFilter();

});

// ─────────────────────────────
// FILTER
// ─────────────────────────────

function doFilter(){

var q=document
.getElementById('search')
.value
.toLowerCase();

filtered=all.filter(function(c){

var ok=
c.name.toLowerCase().includes(q) ||
(c.category||'').toLowerCase().includes(q);

if(activeTab==='favs'){

ok=ok&&favs[c.name];

}

if(activeTab==='recent'){

ok=ok&&recent.includes(c.name);

}

return ok;

});

renderChannels();

}

// ─────────────────────────────
// TABS
// ─────────────────────────────

function setTab(tab){

activeTab=tab;

document
.querySelectorAll('.tab')
.forEach(function(t){

t.classList.remove('active');

});

document
.getElementById('tab-'+tab)
.classList.add('active');

doFilter();

}

// ─────────────────────────────
// CUSTOM CHANNELS
// ─────────────────────────────

function addCustomChannel(){

var name=document
.getElementById('customName')
.value
.trim();

var url=document
.getElementById('customUrl')
.value
.trim();

if(!url){

alert('ENTER STREAM URL');

return;

}

if(!name){

name='Custom Channel';

}

var ch={

name:name,
url:url,
category:'Custom IPTV',
cc:null

};

all.unshift(ch);

filtered=all;

renderChannels();

document.getElementById('customName').value='';
document.getElementById('customUrl').value='';

}

// ─────────────────────────────
// PiP
// ─────────────────────────────

function togglePiP(){

var v=document.getElementById('video');

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

if(v.requestPictureInPicture){

v.requestPictureInPicture();

}

}

}

// ─────────────────────────────
// KEYBOARD
// ─────────────────────────────

document.addEventListener('keydown',function(e){

if(e.target.tagName==='INPUT')return;

if(e.key==='ArrowDown'){

nextChannel();

}

if(e.key==='ArrowUp'){

prevChannel();

}

});

// ─────────────────────────────
// START
// ─────────────────────────────

loadChannels();

</script>
