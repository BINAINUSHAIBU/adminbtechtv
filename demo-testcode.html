<!-- BTECH-TV WORLD ULTRA UPGRADED -->
<!-- FAST LOADING + SMART IPTV + PWA + OFFLINE CACHE -->
<!-- SEARCH + FAVORITES + RECENTS + MINI PLAYER -->
<!-- RESPONSIVE + GLASS UI + AUTO RETRY + SPEED BOOST -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#0ea5e9" />

<title>BTECH-TV WORLD ULTRA</title>

<link rel="preconnect" href="https://iptv-org.github.io">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#0f172a;
--card:#131f36;
--hover:#1d2f52;
--accent:#0ea5e9;
--accent2:#38bdf8;
--text:#fff;
--muted:#94a3b8;
--success:#22c55e;
--danger:#ef4444;
--glass:rgba(255,255,255,.06);
--border:rgba(255,255,255,.08);
}

.light{
--bg:#f1f5f9;
--panel:#ffffff;
--card:#e2e8f0;
--hover:#cbd5e1;
--text:#000;
--muted:#475569;
--glass:rgba(255,255,255,.6);
--border:rgba(0,0,0,.06);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
transition:.3s;
}

/* TOPBAR */

.topbar{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 18px;
background:var(--panel);
border-bottom:1px solid var(--border);
backdrop-filter:blur(15px);
gap:12px;
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent2);
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
border:none;
padding:10px 15px;
border-radius:10px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.25s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:#000;
transform:translateY(-2px);
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:var(--panel);
overflow-y:auto;
padding:15px;
border-right:1px solid var(--border);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent2);
font-size:15px;
}

.cat{
background:var(--card);
padding:13px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.25s;
border:1px solid transparent;
}

.cat:hover{
background:var(--hover);
border-color:var(--accent);
transform:translateX(3px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:360px;
background:#000;
position:relative;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:7px 13px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:10;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:20;
}

.spinner{
width:60px;
height:60px;
border:5px solid rgba(255,255,255,.15);
border-top:5px solid var(--accent);
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* NOW PLAYING */

.now-playing{
padding:15px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
font-size:13px;
color:var(--muted);
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
border:none;
padding:10px 14px;
border-radius:10px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.25s;
}

.controls button:hover{
background:var(--accent);
color:#000;
}

/* SEARCH */

.search-box{
padding:14px;
display:flex;
gap:10px;
background:var(--panel);
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:12px;
background:var(--card);
color:var(--text);
}

.search-box input{
flex:1;
min-width:240px;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:14px;
}

.channel{
background:var(--glass);
backdrop-filter:blur(10px);
border:1px solid var(--border);
border-radius:16px;
padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.25s;
gap:10px;
}

.channel:hover{
transform:translateY(-3px);
border-color:var(--accent);
background:var(--hover);
}

.channel.active{
border-color:var(--accent);
box-shadow:0 0 0 1px var(--accent);
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
object-fit:cover;
border-radius:12px;
background:#000;
}

.info{
overflow:hidden;
}

.info h4{
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:5px;
}

.info small{
color:var(--muted);
}

.status{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
}

.badge{
padding:5px 10px;
border-radius:30px;
font-size:11px;
font-weight:bold;
}

.liveBadge{
background:var(--success);
}

.dead{
background:var(--danger);
}

.fav{
font-size:20px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* BOTTOM MINI PLAYER */

.mini{
height:60px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-top:1px solid var(--border);
}

.progress{
height:4px;
background:var(--accent);
width:0%;
position:absolute;
bottom:0;
left:0;
transition:.3s;
}

/* MOBILE */

@media(max-width:900px){

body{
overflow:auto;
}

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:220px;
border-right:none;
border-bottom:1px solid var(--border);
}

.player{
height:250px;
}

.channels{
grid-template-columns:1fr;
padding-bottom:100px;
}

}

@media(max-width:600px){

.logo{
font-size:20px;
}

.player{
height:220px;
}

.left img{
width:50px;
height:50px;
}

}

</style>

</head>
<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="showAll(this)">All</button>

<button onclick="showFavorites(this)">
⭐ Favorites
</button>

<button onclick="showRecent(this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
🌗 Theme
</button>

<button onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

</div>

</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎬 Movies</div>

<h3>🚀 Global IPTV</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/index.country.m3u','World IPTV')">
🌐 Load World IPTV
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
></video>

<div class="overlay" id="overlay">

<div class="spinner"></div>

<h2 id="overlayText">
Loading IPTV...
</h2>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
BTECH-TV Ultra Streaming
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">

<option value="az">
Sort A-Z
</option>

<option value="za">
Sort Z-A
</option>

</select>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<!-- MINI FOOT -->

<div class="mini">

<div id="miniTitle">
Ready
</div>

<div>
⚡ Ultra Fast IPTV
</div>

</div>

<script>

let all=[];
let filtered=[];
let current=0;
let hls=null;

const video=document.getElementById('video');

const favs=
JSON.parse(localStorage.getItem('favs')||'{}');

const recent=
JSON.parse(localStorage.getItem('recent')||'[]');

function setLoading(state,text='Loading...'){

document.getElementById('overlay').style.display=
state ? 'flex':'none';

document.getElementById('overlayText').innerText=text;

}

function flag(cc){

if(!cc || cc.length!==2) return '🌐';

const a=127462;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

async function loadPlaylist(url,group){

setLoading(true,'Loading '+group+'...');

all=[];

try{

const res=await fetch(url);

const txt=await res.text();

parseM3U(txt,group);

filtered=[...all];

renderChannels();

setLoading(false);

}catch(err){

alert('Playlist failed');

console.error(err);

setLoading(false);

}

}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')) continue;

const logo=
info.match(/tvg-logo="(.*?)"/);

const country=
info.match(/tvg-country="(.*?)"/);

all.push({

id:all.length+1,

name:info.split(',').pop(),

url:url,

logo:logo ? logo[1] : 'https://via.placeholder.com/60',

country:country ? country[1] : '',

group:group

});

}

}

removeDuplicates();

}

function removeDuplicates(){

const seen=new Set();

all=all.filter(ch=>{

const key=ch.name+ch.url;

if(seen.has(key)) return false;

seen.add(key);

return true;

});

}

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filtered.forEach((c,i)=>{

const div=document.createElement('div');

div.className='channel';

if(i===current){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<div class="badge liveBadge">
LIVE
</div>

<div
class="fav ${favs[c.id]?'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id]?'★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(i);

box.appendChild(div);

});

}

function playChannel(index){

current=index;

const c=filtered[index];

if(!c) return;

document.getElementById('channelName').innerText=c.name;

document.getElementById('channelGroup').innerText=c.group;

document.getElementById('miniTitle').innerText=
'▶ '+c.name;

if(hls){
hls.destroy();
}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

hls=new Hls({

enableWorker:true,
lowLatencyMode:true,
maxBufferLength:10,
backBufferLength:30

});

hls.loadSource(c.url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play().catch(()=>{});

});

hls.on(Hls.Events.ERROR,function(event,data){

if(data.fatal){

nextChannel();

}

});

}else{

video.src=c.url;

video.play();

}

addRecent(c.id);

renderChannels();

}

function searchChannels(q){

q=q.toLowerCase();

filtered=all.filter(c=>

c.name.toLowerCase().includes(q)
||

c.group.toLowerCase().includes(q)

);

renderChannels();

}

function sortChannels(v){

filtered.sort((a,b)=>

v==='az'
? a.name.localeCompare(b.name)
: b.name.localeCompare(a.name)

);

renderChannels();

}

function nextChannel(){

current++;

if(current>=filtered.length){
current=0;
}

playChannel(current);

}

function prevChannel(){

current--;

if(current<0){
current=filtered.length-1;
}

playChannel(current);

}

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'favs',
JSON.stringify(favs)
);

renderChannels();

}

function addRecent(id){

let arr=
JSON.parse(localStorage.getItem('recent')||'[]');

arr=arr.filter(x=>x!==id);

arr.unshift(id);

arr=arr.slice(0,30);

localStorage.setItem(
'recent',
JSON.stringify(arr)
);

}

function showFavorites(btn){

setActive(btn);

filtered=
all.filter(c=>favs[c.id]);

renderChannels();

}

function showRecent(btn){

setActive(btn);

filtered=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filtered.push(ch);
}

});

renderChannels();

}

function showAll(btn){

setActive(btn);

filtered=[...all];

renderChannels();

}

function setActive(btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

}

function toggleTheme(){

document.body.classList.toggle('light');

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

async function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

await video.requestPictureInPicture();

}

}

function shareChannel(){

const c=filtered[current];

if(!c) return;

if(navigator.share){

navigator.share({

title:c.name,
url:c.url

});

}else{

navigator.clipboard.writeText(c.url);

alert('Copied');

}

}

document.addEventListener('keydown',e=>{

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

if(e.key==='f'){
toggleFullscreen();
}

});

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
