<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ENTERPRISE PRO MAX v4</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--danger:#ef4444;
--warn:#f59e0b;
--ok:#22c55e;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text)}

.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:240px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.card:hover{border-color:var(--accent)}

.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.log{
font-size:12px;
background:#0f1628;
padding:8px;
margin-top:10px;
height:200px;
overflow:auto;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent)}
.danger{background:var(--danger)}
.warn{background:var(--warn)}

input,select{
width:100%;
padding:10px;
margin-top:10px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}

</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
<h3>🚀 BTECH-TV ENTERPRISE v4</h3>
<div id="roleBox">ADMIN MODE</div>
</div>

<div class="container">

<div class="sidebar">
<h4>📡 Controls</h4>
<p style="font-size:12px;color:#aaa">IPTV Ultra Engine Loaded</p>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Stream URL">
<button class="primary" onclick="addChannel()">Add Channel</button>

<button onclick="filterAll()">All</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterPaid()">Paid</button>

<input placeholder="Search..." oninput="search(this.value)">
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="list" id="chlist"></div>

</div>

<div class="right">
<h4>⚙ Status</h4>

<p id="status">Loading...</p>
<p id="chcount"></p>

<h4>📡 Logs</h4>
<div class="log" id="log"></div>
</div>

</div>

<script>

/* =====================
STATE
===================== */

var all=[],filtered=[],cur=null;
var deadCh={},aliveCh={};
var favs={};
var recent=[];
var channelMap={},logoMap={};

/* =====================
UTILS
===================== */

function esc(s){
return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';
}

function log(t){
console.log(t);
}

/* =====================
LOAD API
===================== */

async function loadAPI(){
try{
var [chRes,stRes,lgRes]=await Promise.all([
fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/logos.json').then(r=>r.json())
]);

for(var i=0;i<chRes.length;i++){
var ch=chRes[i];
if(!ch.is_nsfw&&!ch.closed)channelMap[ch.id]=ch;
}

for(var i=0;i<lgRes.length;i++){
var lg=lgRes[i];
if(!logoMap[lg.channel])logoMap[lg.channel]=lg.url;
}

var id=0,seen={};

for(var i=0;i<stRes.length;i++){
var st=stRes[i];
if(!st.url||seen[st.url])continue;
if(st.url.includes('youtube')||st.url.includes('twitch'))continue;

seen[st.url]=1;

var ch=st.channel?channelMap[st.channel]:null;

all.push({
id:++id,
n:ch?ch.name:(st.title||'Unknown'),
u:st.url,
cat:ch&&ch.categories?ch.categories[0]:'other'
});
}

render();
document.getElementById('status').innerText="Loaded "+all.length+" channels";

}catch(e){
document.getElementById('status').innerText="Error loading API";
}
}

/* =====================
RENDER
===================== */

function render(){
filtered=all;

var box=document.getElementById("chlist");
box.innerHTML="";

filtered.slice(0,300).forEach(c=>{
var div=document.createElement("div");
div.className="card";

div.onclick=()=>play(c);

div.innerHTML="<b>"+esc(c.n)+"</b><br><small>"+c.cat+"</small>";

box.appendChild(div);
});
}

/* =====================
PLAY
===================== */

function play(c){
var v=document.getElementById("video");

if(window.Hls&&Hls.isSupported()){
var hls=new Hls();
hls.loadSource(c.u);
hls.attachMedia(v);
}else{
v.src=c.u;
}

document.getElementById("status").innerText="Playing: "+c.n;
}

/* =====================
ADD CHANNEL
===================== */

function addChannel(){

all.push({
id:Date.now(),
n:name.value,
u:url.value,
cat:"custom"
});

name.value="";
url.value="";

render();
}

/* =====================
FILTERS
===================== */

function filterAll(){render();}
function filterLocked(){filtered=all.filter(c=>c.cat==="locked");}
function filterPaid(){filtered=all.filter(c=>c.cat==="paid");}

/* =====================
SEARCH
===================== */

function search(v){
filtered=all.filter(c=>c.n.toLowerCase().includes(v.toLowerCase()));
render();
}

/* =====================
BOOT
===================== */

loadAPI();

</script>

</body>
</html>
