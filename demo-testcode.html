<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--panel:#0f1729;
--card:#162033;
--line:#25324c;
--text:#ffffff;
--muted:#93a4c3;
--primary:#00d4ff;
--primary2:#4f46e5;
--success:#00d084;
--danger:#ff4d6d;
--warning:#ffb020;
--radius:20px;
--shadow:0 10px 30px rgba(0,0,0,.4);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

.app{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:280px;
background:#0b1220;
border-right:1px solid rgba(255,255,255,.05);
padding:25px;
position:fixed;
height:100vh;
overflow:auto;
z-index:100;
}

.logo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:35px;
}

.logo-icon{
width:58px;
height:58px;
border-radius:18px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:800;
}

.logo h1{
font-size:24px;
font-weight:800;
}

.logo p{
font-size:13px;
color:var(--muted);
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu button{
width:100%;
background:none;
border:none;
padding:14px 16px;
border-radius:16px;
display:flex;
align-items:center;
gap:14px;
color:#d8e2ff;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.menu button:hover,
.menu button.active{
background:linear-gradient(90deg,rgba(0,212,255,.18),rgba(79,70,229,.18));
border:1px solid rgba(255,255,255,.06);
}

/* MAIN */

.main{
margin-left:280px;
width:calc(100% - 280px);
padding:25px;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:25px;
}

.search{
flex:1;
min-width:250px;
background:var(--panel);
padding:15px 18px;
border-radius:16px;
display:flex;
align-items:center;
gap:12px;
border:1px solid rgba(255,255,255,.05);
}

.search input{
background:none;
border:none;
outline:none;
width:100%;
color:white;
font-size:15px;
}

/* PLAYER */

.player-wrapper{
display:grid;
grid-template-columns:2fr 1fr;
gap:25px;
margin-bottom:30px;
}

.player-card{
background:var(--panel);
border-radius:24px;
padding:20px;
border:1px solid rgba(255,255,255,.05);
box-shadow:var(--shadow);
}

.player-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.player-header h2{
font-size:24px;
}

.live-badge{
background:rgba(0,208,132,.15);
color:var(--success);
padding:10px 14px;
border-radius:999px;
font-size:13px;
font-weight:700;
}

video{
width:100%;
height:540px;
background:black;
border-radius:18px;
object-fit:cover;
}

/* CHANNEL LIST */

.channel-list{
background:var(--panel);
border-radius:24px;
padding:20px;
border:1px solid rgba(255,255,255,.05);
height:100%;
overflow:auto;
}

.channel{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:14px;
background:var(--card);
border-radius:16px;
margin-bottom:14px;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
border-color:rgba(0,212,255,.4);
transform:translateX(4px);
}

.channel-left{
display:flex;
align-items:center;
gap:14px;
}

.channel-logo{
width:55px;
height:55px;
border-radius:14px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:800;
}

.tag{
padding:6px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
background:rgba(0,212,255,.12);
color:#88e8ff;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat{
background:var(--panel);
padding:24px;
border-radius:22px;
border:1px solid rgba(255,255,255,.05);
box-shadow:var(--shadow);
}

.stat h2{
font-size:34px;
}

/* FOOTER */

.footer{
margin-top:30px;
text-align:center;
color:#8496b6;
padding-bottom:30px;
}

@media(max-width:1100px){
.player-wrapper{grid-template-columns:1fr;}
video{height:400px;}
}

@media(max-width:900px){
.app{flex-direction:column;}
.sidebar{position:relative;width:100%;height:auto;}
.main{margin-left:0;width:100%;}
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">
<div class="logo-icon">📺</div>
<div>
<h1>WORLDTV</h1>
<p>Ultra IPTV Network</p>
</div>
</div>

<div class="menu">
<button class="active">🏠 Dashboard</button>
<button>📡 Live TV</button>
<button>⚽ Sports</button>
<button>🎬 Movies</button>
<button>📰 News</button>
<button>🎵 Music</button>
<button>⛪ Gospel</button>
</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search">
🔍
<input type="text" id="searchInput" placeholder="Search channels...">
</div>
</div>

<!-- PLAYER -->
<div class="player-wrapper">

<div class="player-card">

<div class="player-header">
<h2 id="channelTitle">WORLD SPORTS HD</h2>
<div class="live-badge">🔴 LIVE STREAMING</div>
</div>

<video id="video" controls autoplay muted></video>

</div>

<!-- CHANNEL LIST -->
<div class="channel-list">
<h3>Live Channels</h3>
<div id="channelContainer"></div>
</div>

</div>

<!-- STATS -->
<div class="stats">
<div class="stat"><h2>2500+</h2><p>Channels</p></div>
<div class="stat"><h2>120K</h2><p>Viewers</p></div>
<div class="stat"><h2>4K</h2><p>Streaming</p></div>
<div class="stat"><h2>99.9%</h2><p>Uptime</p></div>
</div>

<div class="footer">
© 2026 WORLDTV LIVE PLATFORM
</div>

</div>
</div>

<script>

/* FULL ORIGINAL CHANNELS MERGED (UNCHANGED) */

const channels = [

{
name:"BEIN SPORTS NEWS",
category:"Sports",
logo:"⚽",
tag:"LIVE",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},
{
name:"SKY SPORTS MAIN EVENT",
category:"Sports",
logo:"🏆",
tag:"HD",
url:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"
},
{
name:"NBA TV HD",
category:"Basketball",
logo:"🏀",
tag:"LIVE",
url:"https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
},
{
name:"EURO SPORT",
category:"Sports",
logo:"🏁",
tag:"LIVE",
url:"https://test-streams.mux.dev/test_001/stream.m3u8"
},
{
name:"MOVIE MAX",
category:"Movies",
logo:"🎬",
tag:"4K",
url:"https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
},
{
name:"GLOBAL NEWS",
category:"News",
logo:"📰",
tag:"LIVE",
url:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"
},
{
name:"BBC WORLD NEWS",
category:"News",
logo:"🌍",
tag:"HD",
url:"https://moiptvhls-i.akamaihd.net/hls/live/652316/Live_1/master.m3u8"
},
{
name:"MUSIC TV",
category:"Music",
logo:"🎵",
tag:"LIVE",
url:"https://moiptvhls-i.akamaihd.net/hls/live/652316/Live_1/master.m3u8"
},
{
name:"KIDS WORLD",
category:"Kids",
logo:"🧸",
tag:"HD",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},
{
name:"GOSPEL TV",
category:"Church",
logo:"⛪",
tag:"LIVE",
url:"https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
}

];

let currentChannel = channels[0];
const video = document.getElementById('video');
const channelTitle = document.getElementById('channelTitle');
let hls;

/* RENDER */

function renderChannels(){
const container = document.getElementById('channelContainer');
container.innerHTML = '';

channels.forEach(channel=>{
container.innerHTML += `
<div class="channel" onclick='playChannel(${JSON.stringify(channel)})'>
<div class="channel-left">
<div class="channel-logo">${channel.logo}</div>
<div>
<h4>${channel.name}</h4>
<p>${channel.category} Streaming</p>
</div>
</div>
<div class="tag">${channel.tag}</div>
</div>`;
});
}

/* PLAY */

function playChannel(channel){

currentChannel = channel;
channelTitle.innerText = channel.name;

if(hls){
hls.destroy();
}

if(Hls.isSupported()){
hls = new Hls();
hls.loadSource(channel.url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){
video.play();
});

}else{
video.src = channel.url;
video.play();
}

}

/* STOP */

function stopPlayer(){
video.pause();
}

/* FULL INIT */

renderChannels();
playChannel(currentChannel);

/* SEARCH */

document.getElementById('searchInput').addEventListener('keyup',function(){
let value = this.value.toLowerCase();

document.querySelectorAll('.channel').forEach(c=>{
c.style.display = c.innerText.toLowerCase().includes(value)
? 'flex':'none';
});

});

</script>

</body>
</html>
