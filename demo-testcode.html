<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTECH-TV FULL SaaS SIM</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
header{padding:15px;background:#111827;display:flex;justify-content:space-between}
button{padding:8px 12px;margin:3px;border:none;border-radius:6px;cursor:pointer;background:#22304d;color:white}

.layout{display:flex;height:100vh}
.sidebar{width:220px;background:#0a0f1d;padding:10px;overflow:auto}
.main{flex:1;padding:10px;overflow:auto}

.card{background:#172033;padding:10px;margin:10px;border-radius:10px}
.hidden{display:none}

table{width:100%;background:#172033;border-collapse:collapse}
td,th{border:1px solid #333;padding:6px}
input,select{padding:8px;width:100%;margin:5px 0}
</style>
</head>

<body>

<header>
<div>📺 BTECH-TV SaaS SIM</div>
<div>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('users')">Users</button>
<button onclick="show('channels')">Channels</button>
<button onclick="show('packages')">Packages</button>
<button onclick="toggleAdmin()">Admin</button>
</div>
</header>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Trial System</h3>
<div class="card">
<button onclick="resetTrial()">Reset Trial</button>
<button onclick="checkTrial()">Check Trial</button>
</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="card">
<h2>📊 Stats</h2>
<p>Total Users: <span id="tusers">0</span></p>
<p>Active Users: <span id="ausers">0</span></p>
<p>Trial Users: <span id="trusers">0</span></p>
</div>

</div>

<!-- USERS -->
<div id="users" class="hidden">
<div class="card">
<h2>User Manager</h2>

<input id="uname" placeholder="Name">
<input id="uemail" placeholder="Email">
<button onclick="addUser()">Add User</button>

<table>
<thead>
<tr><th>Name</th><th>Email</th><th>Package</th><th>Action</th></tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>
</div>

<!-- CHANNELS -->
<div id="channels" class="hidden">
<div class="card">
<h2>Channels</h2>

<input id="cname" placeholder="Channel Name">
<input id="curl" placeholder="Stream URL">
<select id="cpack">
<option>Free</option>
<option>Premium</option>
<option>Gold</option>
</select>
<button onclick="addChannel()">Add Channel</button>

<div id="channelList"></div>
</div>
</div>

<!-- PACKAGES -->
<div id="packages" class="hidden">
<div class="card">
<h2>Packages</h2>

<input id="pname" placeholder="Package Name">
<button onclick="addPackage()">Add Package</button>

<div id="packageList"></div>
</div>
</div>

</div>
</div>

<script>

/* ================= FAKE DB ================= */
let users = JSON.parse(localStorage.getItem("users")||"[]");
let channels = JSON.parse(localStorage.getItem("channels")||"[]");
let packages = JSON.parse(localStorage.getItem("packages")||'["Free","Premium","Gold"]');

/* ================= SAVE ================= */
function save(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("channels",JSON.stringify(channels));
localStorage.setItem("packages",JSON.stringify(packages));
}

/* ================= NAV ================= */
function show(id){
document.querySelectorAll(".main > div").forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
render();
}

/* ================= USERS ================= */
function addUser(){
users.push({
name:uname.value,
email:uemail.value,
package:"Trial",
status:"Active"
});
save();render();
}

function delUser(i){
users.splice(i,1);
save();render();
}

/* ================= CHANNELS ================= */
function addChannel(){
channels.push({
name:cname.value,
url:curl.value,
pack:cpack.value
});
save();render();
}

function delChannel(i){
channels.splice(i,1);
save();render();
}

/* ================= PACKAGES ================= */
function addPackage(){
packages.push(pname.value);
save();render();
}

/* ================= RENDER ================= */
function render(){

// USERS
let ut="";
users.forEach((u,i)=>{
ut+=`<tr>
<td>${u.name}</td>
<td>${u.email}</td>
<td>${u.package}</td>
<td><button onclick="delUser(${i})">X</button></td>
</tr>`;
});
userTable.innerHTML=ut;

// CHANNELS
channelList.innerHTML=channels.map((c,i)=>
`<div class="card">${c.name} (${c.pack})
<button onclick="delChannel(${i})">Delete</button></div>`
).join("");

// PACKAGES
packageList.innerHTML=packages.map(p=>
`<div class="card">${p}</div>`
).join("");

// STATS
tusers.innerText=users.length;
ausers.innerText=users.filter(u=>u.status=="Active").length;
trusers.innerText=users.filter(u=>u.package=="Trial").length;

save();
}

/* ================= TRIAL ================= */
function resetTrial(){
localStorage.setItem("trialStart",Date.now());
alert("Trial Reset");
}

function checkTrial(){
let start=localStorage.getItem("trialStart");
if(!start){
alert("No trial started");
return;
}

let diff=Date.now()-start;
let hours=diff/1000/60/60;

if(hours>4){
alert("TRIAL EXPIRED - Upgrade Required");
}else{
alert("Trial Active: "+(4-hours).toFixed(2)+" hours left");
}
}

/* ================= ADMIN ================= */
function toggleAdmin(){
alert("Admin Mode Enabled (Demo)");
}

/* INIT */
render();

</script>

</body>
</html>
