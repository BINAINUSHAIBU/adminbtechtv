<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>BTECH-TV USER MANAGER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#08111f;
--panel:#111827;
--card:#1b2438;
--hover:#26344f;
--accent:#00d4ff;
--accent2:#00ff99;
--danger:#ef4444;
--warning:#f59e0b;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
border:none;
cursor:pointer;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:70px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.top-actions button{
padding:10px 16px;
border-radius:10px;
background:var(--card);
color:white;
transition:.3s;
font-size:13px;
}

.top-actions button:hover{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 70px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:280px;
background:#0f172a;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin-bottom:15px;
color:var(--accent);
}

.side-btn{
width:100%;
padding:14px;
margin-bottom:10px;
background:var(--card);
border-radius:12px;
color:white;
text-align:left;
transition:.3s;
}

.side-btn:hover,
.side-btn.active{
background:var(--accent);
color:black;
transform:translateX(4px);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
DASHBOARD STATS
========================= */

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:15px;
background:var(--panel);
border-bottom:1px solid rgba(255,255,255,.05);
}

.stat-card{
background:var(--card);
padding:20px;
border-radius:14px;
}

.stat-card h4{
color:var(--muted);
font-size:13px;
margin-bottom:10px;
}

.stat-card h2{
font-size:30px;
color:var(--accent);
}

/* =========================
TOOLS
========================= */

.toolbar{
display:flex;
gap:10px;
padding:15px;
background:#0f172a;
flex-wrap:wrap;
border-bottom:1px solid rgba(255,255,255,.05);
}

.toolbar input,
.toolbar select{
padding:12px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
}

.toolbar input{
flex:1;
min-width:220px;
}

.toolbar button{
padding:12px 16px;
border-radius:10px;
background:var(--accent);
font-weight:bold;
color:black;
}

/* =========================
TABLE
========================= */

.table-wrap{
flex:1;
overflow:auto;
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
min-width:1400px;
}

thead{
background:var(--panel);
position:sticky;
top:0;
z-index:10;
}

th{
padding:14px;
text-align:left;
font-size:13px;
color:var(--accent);
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.05);
font-size:13px;
}

tr{
background:var(--card);
transition:.3s;
}

tr:hover{
background:var(--hover);
}

.user-box{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

.badge{
padding:5px 10px;
border-radius:30px;
font-size:11px;
font-weight:bold;
display:inline-block;
}

.active{
background:#16a34a;
}

.blocked{
background:#dc2626;
}

.premium{
background:#2563eb;
}

.free{
background:#64748b;
}

.online{
background:#00ff99;
color:black;
}

.offline{
background:#475569;
}

/* =========================
ACTION BUTTONS
========================= */

.action-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.small-btn{
padding:8px 12px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

.edit{
background:#2563eb;
color:white;
}

.lock{
background:#dc2626;
color:white;
}

.unlock{
background:#16a34a;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

/* =========================
PLAYER
========================= */

.player-box{
height:300px;
background:black;
position:relative;
}

.player-box video{
width:100%;
height:100%;
object-fit:cover;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

/* =========================
MOBILE
========================= */

@media(max-width:1000px){

.sidebar{
display:none;
}

.container{
flex-direction:column;
}

.stats-grid{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV USER MANAGER
</div>

<div class="top-actions">

<button onclick="generateUsers()">
⚡ Generate 1,000,000 Users
</button>

<button onclick="toggleTheme()">
🌙 Theme
</button>

<button onclick="exportUsers()">
⬇ Export
</button>

<button onclick="reloadSystem()">
🚀 Reload Engine
</button>

</div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

<h3>📂 Management</h3>

<button class="side-btn active">
👥 All Users
</button>

<button class="side-btn">
⭐ Premium Users
</button>

<button class="side-btn">
🔒 Blocked Users
</button>

<button class="side-btn">
🟢 Online Users
</button>

<button class="side-btn">
📺 Active Streams
</button>

<button class="side-btn">
💳 Subscription Plans
</button>

<button class="side-btn">
📡 IPTV Sessions
</button>

<button class="side-btn">
🧠 AI Monitoring
</button>

<button class="side-btn">
⚙ System Settings
</button>

<button class="side-btn">
🛡 Security Logs
</button>

<hr style="margin:20px 0;border:0;border-top:1px solid #1e293b;">

<h3>📡 LIVE STREAM</h3>

<div class="player-box">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
muted
playsinline
></video>

</div>

</div>

<!-- =========================
MAIN
========================= -->

<div class="main">

<!-- =========================
STATS
========================= -->

<div class="stats-grid">

<div class="stat-card">
<h4>Total Users</h4>
<h2 id="totalUsers">0</h2>
</div>

<div class="stat-card">
<h4>Premium</h4>
<h2 id="premiumUsers">0</h2>
</div>

<div class="stat-card">
<h4>Blocked</h4>
<h2 id="blockedUsers">0</h2>
</div>

<div class="stat-card">
<h4>Online</h4>
<h2 id="onlineUsers">0</h2>
</div>

<div class="stat-card">
<h4>Streams</h4>
<h2 id="streamUsers">0</h2>
</div>

<div class="stat-card">
<h4>Server Load</h4>
<h2 id="serverLoad">0%</h2>
</div>

</div>

<!-- =========================
TOOLS
========================= -->

<div class="toolbar">

<input
type="text"
placeholder="Search users..."
oninput="searchUsers(this.value)"
>

<select onchange="sortUsers(this.value)">
<option value="az">Sort A-Z</option>
<option value="za">Sort Z-A</option>
<option value="premium">Premium First</option>
<option value="online">Online First</option>
</select>

<button onclick="generateUsers()">
➕ Add Users
</button>

<button onclick="blockAll()">
🔒 Block Random
</button>

<button onclick="unblockAll()">
🔓 Unblock All
</button>

</div>

<!-- =========================
TABLE
========================= -->

<div class="table-wrap">

<table>

<thead>

<tr>

<th>ID</th>
<th>User</th>
<th>Email</th>
<th>Plan</th>
<th>Status</th>
<th>Streaming</th>
<th>Devices</th>
<th>Country</th>
<th>Bandwidth</th>
<th>Expiry</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="userTable"></tbody>

</table>

</div>

</div>

</div>

<script>

/* =========================
GLOBAL STATE
========================= */

let users = [];
let filteredUsers = [];
let dark = true;

const maxUsers = 1000000;

/* =========================
STREAM PLAYER
========================= */

const stream =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

const video =
document.getElementById("video");

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(stream);

hls.attachMedia(video);

}

/* =========================
GENERATE USERS
========================= */

function generateUsers(){

users = [];

const countries = [
"Nigeria",
"USA",
"UK",
"India",
"France",
"Germany",
"Brazil",
"Canada"
];

for(let i=1;i<=maxUsers;i++){

users.push({

id:i,

name:"BTECH_USER_"+i,

email:"user"+i+"@btechtv.com",

premium:
Math.random() > 0.6,

blocked:
Math.random() > 0.95,

online:
Math.random() > 0.5,

streaming:
Math.random() > 0.4,

devices:
Math.floor(Math.random()*5)+1,

country:
countries[
Math.floor(
Math.random()*countries.length
)
],

bandwidth:
Math.floor(
Math.random()*1000
)+" Mbps",

expiry:
"2027-"+String(
Math.floor(Math.random()*12)+1
).padStart(2,"0")+"-"+String(
Math.floor(Math.random()*28)+1
).padStart(2,"0")

});

}

filteredUsers = [...users];

updateStats();

renderUsers();

}

/* =========================
RENDER USERS
========================= */

function renderUsers(limit=500){

const table =
document.getElementById(
"userTable"
);

table.innerHTML = "";

filteredUsers
.slice(0,limit)
.forEach(user=>{

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>${user.id}</td>

<td>

<div class="user-box">

<div class="avatar">
${user.name.charAt(0)}
</div>

<div>
<strong>${user.name}</strong>
</div>

</div>

</td>

<td>${user.email}</td>

<td>
<span class="badge ${
user.premium
? 'premium'
: 'free'
}">
${user.premium
? 'PREMIUM'
: 'FREE'}
</span>
</td>

<td>
<span class="badge ${
user.blocked
? 'blocked'
: 'active'
}">
${user.blocked
? 'BLOCKED'
: 'ACTIVE'}
</span>
</td>

<td>
<span class="badge ${
user.streaming
? 'online'
: 'offline'
}">
${user.streaming
? 'STREAMING'
: 'OFFLINE'}
</span>
</td>

<td>${user.devices}</td>

<td>${user.country}</td>

<td>${user.bandwidth}</td>

<td>${user.expiry}</td>

<td>

<div class="action-buttons">

<button
class="small-btn edit"
onclick="editUser(${user.id})"
>
Edit
</button>

<button
class="small-btn ${
user.blocked
? 'unlock'
: 'lock'
}"
onclick="toggleBlock(${user.id})"
>
${user.blocked
? 'Unlock'
: 'Block'}
</button>

<button
class="small-btn delete"
onclick="deleteUser(${user.id})"
>
Delete
</button>

</div>

</td>

`;

table.appendChild(tr);

});

}

/* =========================
STATS
========================= */

function updateStats(){

document.getElementById(
"totalUsers"
).innerText =
users.length.toLocaleString();

document.getElementById(
"premiumUsers"
).innerText =
users.filter(
u=>u.premium
).length.toLocaleString();

document.getElementById(
"blockedUsers"
).innerText =
users.filter(
u=>u.blocked
).length.toLocaleString();

document.getElementById(
"onlineUsers"
).innerText =
users.filter(
u=>u.online
).length.toLocaleString();

document.getElementById(
"streamUsers"
).innerText =
users.filter(
u=>u.streaming
).length.toLocaleString();

document.getElementById(
"serverLoad"
).innerText =
Math.floor(
Math.random()*100
)+"%";

}

/* =========================
SEARCH
========================= */

function searchUsers(q){

const value =
q.toLowerCase();

filteredUsers =
users.filter(u=>

u.name
.toLowerCase()
.includes(value)

||

u.email
.toLowerCase()
.includes(value)

||

u.country
.toLowerCase()
.includes(value)

);

renderUsers();

}

/* =========================
SORT
========================= */

function sortUsers(type){

if(type==="az"){

filteredUsers.sort(
(a,b)=>
a.name.localeCompare(b.name)
);

}

if(type==="za"){

filteredUsers.sort(
(a,b)=>
b.name.localeCompare(a.name)
);

}

if(type==="premium"){

filteredUsers.sort(
(a,b)=>
b.premium-a.premium
);

}

if(type==="online"){

filteredUsers.sort(
(a,b)=>
b.online-a.online
);

}

renderUsers();

}

/* =========================
ACTIONS
========================= */

function toggleBlock(id){

const user =
users.find(
u=>u.id===id
);

if(user){

user.blocked =
!user.blocked;

updateStats();

renderUsers();

}

}

function deleteUser(id){

users =
users.filter(
u=>u.id!==id
);

filteredUsers =
filteredUsers.filter(
u=>u.id!==id
);

updateStats();

renderUsers();

}

function editUser(id){

alert(
"Editing User ID: "+id
);

}

function blockAll(){

users.forEach(user=>{

if(Math.random()>0.7){

user.blocked=true;

}

});

updateStats();

renderUsers();

}

function unblockAll(){

users.forEach(user=>{

user.blocked=false;

});

updateStats();

renderUsers();

}

/* =========================
EXPORT
========================= */

function exportUsers(){

const blob =
new Blob(
[
JSON.stringify(users,null,2)
],
{
type:"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"btech-tv-users.json";

a.click();

}

/* =========================
THEME
========================= */

function toggleTheme(){

dark=!dark;

document.documentElement
.style.setProperty(
"--bg",
dark
?"#08111f"
:"#f1f5f9"
);

document.documentElement
.style.setProperty(
"--panel",
dark
?"#111827"
:"#ffffff"
);

document.documentElement
.style.setProperty(
"--card",
dark
?"#1b2438"
:"#e2e8f0"
);

document.documentElement
.style.setProperty(
"--text",
dark
?"#ffffff"
:"#000000"
);

}

/* =========================
AUTO UPDATE
========================= */

setInterval(()=>{

if(users.length){

for(let i=0;i<500;i++){

const random =
Math.floor(
Math.random()*users.length
);

if(users[random]){

users[random].online =
Math.random()>0.5;

users[random].streaming =
Math.random()>0.4;

}

}

updateStats();

}

},5000);

/* =========================
RELOAD
========================= */

function reloadSystem(){

location.reload();

}

/* =========================
START
========================= */

generateUsers();

</script>

</body>
</html>
