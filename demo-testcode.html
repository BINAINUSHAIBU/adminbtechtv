<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BTECH-TV WORLD PRO MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

#authBox,#upgradeBox{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
z-index:9999;
}

.card{
background:#101a31;
padding:25px;
border-radius:12px;
width:350px;
text-align:center;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#18264a;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00d4ff;
font-weight:bold;
}

#timerBar{
position:fixed;
top:10px;
right:10px;
background:#00d4ff;
color:black;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

#app{
display:none;
padding:20px;
}

.channel{
background:#101a31;
padding:12px;
margin:10px 0;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="timerBar">Loading...</div>

<!-- LOGIN -->
<div id="authBox">
<div class="card">

<h2>📺 BTECH-TV WORLD PRO MAX</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<select id="plan">
<option value="1">1 Hour Trial</option>
<option value="3">3 Hours</option>
<option value="6">6 Hours</option>
<option value="12">12 Hours</option>
<option value="24">24 Hours</option>
<option value="168">7 Days</option>
<option value="720">30 Days</option>
</select>

<button onclick="registerUser()">Register</button>

<button onclick="loginUser()">Login</button>

</div>
</div>

<!-- EXPIRED -->
<div id="upgradeBox" style="display:none;">
<div class="card">

<h2>⛔ Subscription Expired</h2>

<p>Your viewing period has ended.</p>

<button onclick="upgrade()">Upgrade Now</button>

</div>
</div>

<!-- APP -->
<div id="app">

<h1>📺 BTECH-TV WORLD PRO MAX</h1>

<button onclick="logoutUser()">Logout</button>

<hr>

<div class="channel">BBC News</div>
<div class="channel">Al Jazeera</div>
<div class="channel">ESPN</div>
<div class="channel">Sky Sports</div>
<div class="channel">Movie Channel</div>
<div class="channel">Kids Channel</div>

</div>

<script>

/* REGISTER */
function registerUser(){

const user={
email:email.value,
password:password.value
};

localStorage.setItem("iptvUser",JSON.stringify(user));

alert("Registration Successful");

}

/* LOGIN */
function loginUser(){

const saved=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!saved){
alert("Register First");
return;
}

if(
saved.email!==email.value ||
saved.password!==password.value
){
alert("Invalid Login");
return;
}

if(!localStorage.getItem("startTime")){

localStorage.setItem(
"startTime",
Date.now()
);

localStorage.setItem(
"duration",
Number(plan.value)*3600000
);

}

authBox.style.display="none";

app.style.display="block";

startTimer();

}

/* TIMER */
function startTimer(){

setInterval(()=>{

let start=
Number(localStorage.getItem("startTime"));

let duration=
Number(localStorage.getItem("duration"));

let left=
duration-(Date.now()-start);

if(left<=0){

app.style.display="none";

upgradeBox.style.display="flex";

localStorage.removeItem("startTime");

return;

}

let days=Math.floor(left/86400000);
let hrs=Math.floor((left%86400000)/3600000);
let mins=Math.floor((left%3600000)/60000);
let secs=Math.floor((left%60000)/1000);

timerBar.innerHTML=
`⏳ ${days}d ${hrs}h ${mins}m ${secs}s`;

},1000);

}

/* LOGOUT */
function logoutUser(){

location.reload();

}

/* UPGRADE */
function upgrade(){

alert(
"Redirect to payment page"
);
