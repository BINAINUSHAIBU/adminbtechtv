<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX + SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;z-index:9999;
}
.auth-card{background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;}
.auth-card input{width:100%;padding:10px;margin:8px 0;background:#101a31;color:#fff;border:none;border-radius:6px;}
.auth-card button{width:100%;padding:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer;}

/* SIDEBAR */
.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;}
.logo{font-size:20px;font-weight:bold;color:#00d4ff}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.topbar{display:flex;justify-content:space-between;}
.search-box input{padding:10px;width:250px;border:none;border-radius:8px;background:#101a31;color:#fff;}
.live{background:red;padding:6px 10px;border-radius:20px}

/* PLAYER */
.player-container{height:320px;background:#000;border-radius:10px;overflow:hidden;margin:10px 0;}
video{width:100%;height:100%;}

/* CHANNELS */
.channels{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;}
.card:hover{border:1px solid #00d4ff}
.badge{float:right;background:red;padding:3px 6px;border-radius:10px;font-size:10px}

/* ADMIN PANEL */
#adminPanel{
position:fixed;inset:0;background:#050816;z-index:99999;
display:none;overflow:auto;padding:20px;
}

label{display:block;margin:5px 0;}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH-TV PRO MAX</div>

<button class="nav-btn" onclick="openAdmin()">⚙️ Super Admin</button>

<div style="margin-top:10px;color:#00d4ff">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>

<div style="margin-top:10px;color:#00d4ff">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">News</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">Movies</button>

<div style="margin-top:10px;color:#00d4ff">🔥 Tools</div>
<button class="nav-btn" onclick="scanStreams()">Scan</button>
<button class="nav-btn" onclick="speedBoost()">Boost</button>
<button class="nav-btn" onclick="loadUltra()">Ultra</button>
<button class="nav-btn" onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input class="search-box" oninput="search(this.value)" placeholder="Search channels...">
<div class="live">🔴 LIVE</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel">

<h2 style="color:#00d4ff">⚙️ SUPER ADMIN PANEL</h2>

<button class="nav-btn" onclick="closeAdmin()">Close</button>
<button class="nav-btn" onclick="killSwitch()">🚨 KILL SWITCH</button>
<button class="nav-btn" onclick="resetSystem()">Reset System</button>

<h3>Features</h3>
<label><input type="checkbox" id="pip" onchange="saveSettings()"> PiP</label>
<label><input type="checkbox" id="scan" onchange="saveSettings()"> Scan</label>
<label><input type="checkbox" id="boost" onchange="saveSettings()"> Boost</label>
<label><input type="checkbox" id="record" onchange="saveSettings()"> Record</label>
<label><input type="checkbox" id="ultra" onchange="saveSettings()"> Ultra</label>

<h3 style="margin-top:10px;">Trial Control</h3>
<input id="trialHours" placeholder="Hours">
<button class="nav-btn" onclick="setTrial()">Set Trial</button>

<h3 style="margin-top:10px;">System Status</h3>
<div id="statusBox"></div>

</div>

<script>

/* AUTH */
function login(){
localStorage.setItem("auth","1");
authBox.style.display="none";
loadUltra();
startTimer();
}

/* IPTV */
let all=[],filtered=[],i=0,video=document.getElementById("video"),hls;

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];filtered=[];

text.split("\n").forEach((l,idx,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=a[idx+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

filtered=[...all];
render();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<span class='badge'>LIVE</span>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else video.src=c.url;
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function load(code){
loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

function loadCat(c){
loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

function loadUltra(){
loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

/* CONTROLS */
function scanStreams(){if(!settings.scan)return;alert("Scan");}
function speedBoost(){if(!settings.boost)return;video.playbackRate=1.3;}
function logout(){location.reload();}

/* SETTINGS */
let settings=JSON.parse(localStorage.getItem("settings"))||{pip:true,scan:true,boost:true,record:true,ultra:true};

function openAdmin(){
adminPanel.style.display="block";
pip.checked=settings.pip;
scan.checked=settings.scan;
boost.checked=settings.boost;
record.checked=settings.record;
ultra.checked=settings.ultra;
updateStatus();
}

function closeAdmin(){adminPanel.style.display="none";}

function saveSettings(){
settings={
pip:pip.checked,
scan:scan.checked,
boost:boost.checked,
record:record.checked,
ultra:ultra.checked
};
localStorage.setItem("settings",JSON.stringify(settings));
}

function killSwitch(){
document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:20%'>SYSTEM DISABLED</h1>";
}

function resetSystem(){
localStorage.clear();location.reload();
}

function setTrial(){
localStorage.setItem("trial",Date.now()+(parseInt(trialHours.value)*3600000));
alert("Trial Set");
}

/* TIMER */
function startTimer(){
setInterval(()=>{
let t=localStorage.getItem("trial");
if(!t)return;
let d=t-Date.now();
if(d<=0){
document.body.innerHTML="<h1>TRIAL EXPIRED</h1>";
return;
}
},1000);
}

/* STATUS */
function updateStatus(){
statusBox.innerHTML=`
PiP: ${settings.pip}<br>
Scan: ${settings.scan}<br>
Boost: ${settings.boost}<br>
Record: ${settings.record}<br>
Ultra: ${settings.ultra}
`;
}

loadUltra();

</script>

</body>
</html>
