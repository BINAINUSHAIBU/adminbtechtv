<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>MEGA GLOBAL IPTV PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:#fff;
overflow:hidden;
}

header{
height:60px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid #222;
}

header h1{
font-size:20px;
color:#00ff99;
}

#status{
font-size:13px;
color:#aaa;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

.sidebar{
width:360px;
background:#0f0f0f;
overflow-y:auto;
border-right:1px solid #222;
padding:10px;
}

.player-area{
flex:1;
display:flex;
flex-direction:column;
background:#000;
}

video{
width:100%;
height:65vh;
background:#000;
}

.controls{
display:flex;
gap:10px;
padding:10px;
background:#111;
border-top:1px solid #222;
flex-wrap:wrap;
}

.controls input,
.controls select{
flex:1;
padding:10px;
background:#222;
border:none;
color:#fff;
border-radius:6px;
}

.controls button{
padding:10px 14px;
background:#00aa66;
border:none;
color:#fff;
border-radius:6px;
cursor:pointer;
}

.controls button:hover{
background:#00cc77;
}

.channel{
padding:10px;
margin-bottom:8px;
background:#161616;
border-radius:8px;
cursor:pointer;
transition:0.2s;
position:relative;
}

.channel:hover{
background:#1f1f1f;
}

.channel.active{
border:1px solid #00ff99;
}

.channel-name{
font-size:14px;
font-weight:bold;
padding-right:30px;
}

.channel-meta{
font-size:12px;
color:#999;
margin-top:4px;
}

.fav-btn{
position:absolute;
right:10px;
top:10px;
font-size:18px;
cursor:pointer;
}

.category-title{
margin:15px 0 8px;
font-size:15px;
color:#00ff99;
font-weight:bold;
}

.player-info{
padding:12px;
background:#0f0f0f;
border-top:1px solid #222;
}

.player-info h2{
font-size:18px;
margin-bottom:6px;
}

.player-info p{
font-size:13px;
color:#aaa;
}

.top-tabs{
display:flex;
gap:8px;
padding:10px;
background:#111;
border-bottom:1px solid #222;
}

.tab{
padding:8px 12px;
background:#1b1b1b;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.tab.active{
background:#00aa66;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#333;
border-radius:10px;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
height:45vh;
}

.player-area{
height:55vh;
}

video{
height:38vh;
}

.controls{
padding:8px;
}

}

</style>

</head>
<body>

<header>

<h1>🌍 MEGA GLOBAL IPTV PRO</h1>

<div id="status">
LOADING CHANNELS...
</div>

</header>

<div class="container">

<div class="sidebar">

<div class="top-tabs">

<div class="tab active" onclick="switchTab('all',this)">
All
</div>

<div class="tab" onclick="switchTab('favorites',this)">
Favorites
</div>

<div class="tab" onclick="switchTab('recent',this)">
Recent
</div>

</div>

<div id="channelList"></div>

</div>

<div class="player-area">

<video
id="video"
controls
autoplay
playsinline
></video>

<div class="player-info">

<h2 id="nowPlaying">
No Channel Playing
</h2>

<p id="channelMeta">
Select a channel to start streaming
</p>

</div>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search channels..."
/>

<select id="qualityFilter">

<option value="">
All Quality
</option>

<option value="4K">
4K
</option>

<option value="1080p">
1080p
</option>

<option value="HD">
HD
</option>

</select>

<button onclick="loadChannels()">
Reload
</button>

<button onclick="nextChannel()">
Next
</button>

<button onclick="toggleFullscreen()">
Fullscreen
</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────

var all=[];
var filtered=[];
var currentIndex=0;
var currentTab='all';
var hls=null;

var favs=JSON.parse(localStorage.getItem('mega_favs')||'{}');
var recent=JSON.parse(localStorage.getItem('mega_recent')||'[]');

var deadCh={};

// ─────────────────────────────────────────────
// COUNTRY FLAG
// ─────────────────────────────────────────────

function flag(cc){

if(!cc||cc.length!==2)return '🌐';

var a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

// ─────────────────────────────────────────────
// EXTRA FEEDS
// ─────────────────────────────────────────────

var extraFeeds=[

{name:'Nigeria IPTV',url:'https://iptv-org.github.io/iptv/countries/ng.m3u'},
{name:'USA IPTV',url:'https://iptv-org.github.io/iptv/countries/us.m3u'},
{name:'UK IPTV',url:'https://iptv-org.github.io/iptv/countries/uk.m3u'},
{name:'India IPTV',url:'https://iptv-org.github.io/iptv/countries/in.m3u'},
{name:'Sports IPTV',url:'https://iptv-org.github.io/iptv/categories/sports.m3u'},
{name:'Movies IPTV',url:'https://iptv-org.github.io/iptv/categories/movies.m3u'},
{name:'News IPTV',url:'https://iptv-org.github.io/iptv/categories/news.m3u'},
{name:'Kids IPTV',url:'https://iptv-org.github.io/iptv/categories/kids.m3u'},
{name:'Anime IPTV',url:'https://iptv-org.github.io/iptv/categories/anime.m3u'},
{name:'Entertainment IPTV',url:'https://iptv-org.github.io/iptv/categories/entertainment.m3u'},
{name:'Global IPTV Master',url:'https://iptv-org.github.io/iptv/index.m3u'}

];

// ─────────────────────────────────────────────
// COUNTRY DETECTION
// ─────────────────────────────────────────────

function detectCountry(name){

name=(name||'').toLowerCase();

var map={

'nigeria':'NG',
'usa':'US',
'cnn':'US',
'bbc':'GB',
'india':'IN',
'zee':'IN',
'pakistan':'PK',
'al jazeera':'QA',
'france':'FR',
'germany':'DE',
'italy':'IT',
'spain':'ES',
'turkey':'TR',
'canada':'CA',
'brazil':'BR',
'japan':'JP',
'korea':'KR',
'china':'CN',
'south africa':'ZA'

};

for(var k in map){

if(name.indexOf(k)!==-1){

return map[k];

}

}

return null;

}

// ─────────────────────────────────────────────
// PARSE M3U
// ─────────────────────────────────────────────

function parseM3U(text){

var lines=text.split('\n');

var channels=[];

var current=null;

lines.forEach(function(line){

line=line.trim();

if(line.startsWith('#EXTINF')){

current={};

var name=line.split(',').pop();

current.name=name;

current.cc=detectCountry(name);

if(name.match(/4k|2160/i)){
current.q='4K';
}
else if(name.match(/1080|fhd/i)){
current.q='1080p';
}
else if(name.match(/720|hd/i)){
current.q='HD';
}

}
else if(line && !line.startsWith('#')){

if(current){

current.url=line;

channels.push(current);

current=null;

}

}

});

return channels;

}

// ─────────────────────────────────────────────
// LOAD CHANNELS
// ─────────────────────────────────────────────

async function loadChannels(){

all=[];

document.getElementById('status').innerText=
'🌍 LOADING CHANNELS...';

for(let feed of extraFeeds){

try{

let res=await fetch(feed.url);

let txt=await res.text();

let parsed=parseM3U(txt);

parsed.forEach(function(c){

c.category=feed.name;

});

all=all.concat(parsed);

document.getElementById('status').innerText=
'⏳ '+all.length+' CHANNELS LOADED...';

}catch(e){

console.log('FAILED',feed.name);

}

}

filtered=all;

renderChannels();

document.getElementById('status').innerText=
'🌍 IPTV ACTIVE · '+all.length+' CHANNELS';

}

// ─────────────────────────────────────────────
// RENDER CHANNELS
// ─────────────────────────────────────────────

function renderChannels(){

var list=document.getElementById('channelList');

list.innerHTML='';

filtered.forEach(function(c,index){

var div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="fav-btn"
onclick="event.stopPropagation();toggleFav('${c.name}')">
${favs[c.name]?'⭐':'☆'}
</div>

<div class="channel-name">
${c.cc?flag(c.cc)+' ':''}${c.name}
${c.q?'<span style="color:#00ff99;font-size:11px"> '+c.q+'</span>':''}
</div>

<div class="channel-meta">
${c.category}
</div>

`;

div.onclick=function(){

currentIndex=index;

playChannel(c);

};

list.appendChild(div);

});

}

// ─────────────────────────────────────────────
// PLAY CHANNEL
// ─────────────────────────────────────────────

function playChannel(c){

var video=document.getElementById('video');

document.getElementById('nowPlaying').innerText=c.name;

document.getElementById('channelMeta').innerText=
(c.category||'Unknown')+' • '+(c.q||'Live');

addRecent(c.name);

if(Hls.isSupported()){

if(hls){
hls.destroy();
}

hls=new Hls();

hls.loadSource(c.url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play();

});

hls.on(Hls.Events.ERROR,function(){

deadCh[c.url]=1;

});

}else{

video.src=c.url;

video.play();

}

}

// ─────────────────────────────────────────────
// NEXT CHANNEL
// ─────────────────────────────────────────────

function nextChannel(){

if(filtered.length===0)return;

currentIndex++;

if(currentIndex>=filtered.length){

currentIndex=0;

}

playChannel(filtered[currentIndex]);

}

// ─────────────────────────────────────────────
// FAVORITES
// ─────────────────────────────────────────────

function toggleFav(name){

if(favs[name]){

delete favs[name];

}else{

favs[name]=1;

}

localStorage.setItem(
'mega_favs',
JSON.stringify(favs)
);

applyFilters();

}

// ─────────────────────────────────────────────
// RECENT
// ─────────────────────────────────────────────

function addRecent(name){

recent=recent.filter(function(r){

return r!==name;

});

recent.unshift(name);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'mega_recent',
JSON.stringify(recent)
);

}

// ─────────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────────

function applyFilters(){

var q=document
.getElementById('search')
.value
.toLowerCase();

var quality=
document.getElementById('qualityFilter').value;

filtered=all.filter(function(c){

var ok=true;

if(q){

ok=
c.name.toLowerCase().includes(q) ||
(c.category||'').toLowerCase().includes(q);

}

if(ok && quality){

ok=c.q===quality;

}

if(ok && currentTab==='favorites'){

ok=favs[c.name];

}

if(ok && currentTab==='recent'){

ok=recent.includes(c.name);

}

return ok;

});

renderChannels();

}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────

document
.getElementById('search')
.addEventListener('input',applyFilters);

document
.getElementById('qualityFilter')
.addEventListener('change',applyFilters);

// ─────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────

function switchTab(tab,el){

currentTab=tab;

document.querySelectorAll('.tab').forEach(function(t){

t.classList.remove('active');

});

el.classList.add('active');

applyFilters();

}

// ─────────────────────────────────────────────
// FULLSCREEN
// ─────────────────────────────────────────────

function toggleFullscreen(){

var video=document.getElementById('video');

if(video.requestFullscreen){

video.requestFullscreen();

}

}

// ─────────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────────

document.addEventListener('keydown',function(e){

if(e.key==='ArrowDown'){

nextChannel();

}

});

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────

loadChannels();

</script>

</body>
</html>
