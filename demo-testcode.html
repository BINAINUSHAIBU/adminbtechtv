<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV SaaS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff}
.hidden{display:none}

header{
display:flex;justify-content:space-between;align-items:center;
padding:10px;background:#111827
}

button{
padding:8px 12px;border:0;border-radius:6px;cursor:pointer
}

input{
padding:10px;margin:5px 0;width:100%;
border-radius:6px;border:none
}

.container{padding:10px}

.card{
background:#1f2937;padding:10px;margin:10px 0;border-radius:10px
}

.channel{
padding:10px;margin:5px 0;background:#111827;
cursor:pointer;border-radius:6px
}

.channel:hover{background:#2563eb}

#player{
width:100%;height:300px;background:black;margin-top:10px
}

.badge{
background:red;padding:3px 6px;border-radius:5px;font-size:12px
}

.grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}

.upgrade{
position:fixed;bottom:20px;right:20px;background:#ef4444;
padding:10px;border-radius:10px;cursor:pointer
}

.modal{
position:fixed;top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.8);display:none;
justify-content:center;align-items:center
}

.modal-content{
background:#111827;padding:20px;border-radius:10px;width:300px
}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth">
<h2>Login / Register</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<hr>
<button onclick="demoLogin('admin')">Demo Admin</button>
<button onclick="demoLogin('user')">Demo User</button>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">

<header>
<div>📺 IPTV SaaS PRO</div>
<div>
<span id="timer" class="badge"></span>
<button onclick="logout()">Logout</button>
</div>
</header>

<div class="container">

<div id="status" class="card"></div>

<input id="search" placeholder="Search channels..." onkeyup="renderChannels()">

<div class="grid">

<div class="card">
<h3>Categories</h3>
<div onclick="setCat('All')" class="channel">All</div>
<div onclick="setCat('Sports')" class="channel">Sports</div>
<div onclick="setCat('News')" class="channel">News</div>
<div onclick="setCat('Movies')" class="channel">Movies</div>
</div>

<div class="card">
<h3>Channels</h3>
<div id="channels"></div>
</div>

</div>

<video id="player" controls></video>

<div class="card">
<h3>Stats</h3>
<p id="stats"></p>
</div>

</div>

<div class="upgrade" onclick="openUpgrade()">
🔥 Upgrade Plan
</div>

</div>

<!-- ================= UPGRADE MODAL ================= -->
<div class="modal" id="modal">
<div class="modal-content">
<h3>Upgrade Plans</h3>

<button onclick="buy('1-day')">1 Day - $1</button><br><br>
<button onclick="buy('7-day')">7 Days - $5</button><br><br>
<button onclick="buy('30-day')">30 Days - $10</button><br><br>

<button onclick="closeUpgrade()">Close</button>
</div>
</div>

<script>
// ================= DATA =================
let channels = [
{name:"BBC News",cat:"News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Sky Sports",cat:"Sports",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Movie Channel",cat:"Movies",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
];

let currentUser = null;
let currentCat = "All";

// ================= AUTH =================
function register(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;
localStorage.setItem("user_"+u,JSON.stringify({pass:p,trialStart:Date.now(),plan:"trial"}));
alert("Registered!");
}

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;
let data=JSON.parse(localStorage.getItem("user_"+u));
if(data && data.pass===p){
currentUser=u;
startApp();
}else alert("Invalid login");
}

function demoLogin(type){
currentUser=type;
if(type==="admin"){
localStorage.setItem("user_admin",JSON.stringify({pass:"admin",trialStart:Date.now(),plan:"30-day"}));
}
startApp();
}

// ================= APP =================
function startApp(){
document.getElementById("auth").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
checkTrial();
renderChannels();
setInterval(updateTimer,1000);
}

function logout(){
location.reload();
}

// ================= TRIAL SYSTEM =================
function checkTrial(){
let data=JSON.parse(localStorage.getItem("user_"+currentUser));
if(!data) return;

let now=Date.now();
let limit=5*60*60*1000; // 5 hours

if(data.plan==="trial" && now-data.trialStart>limit){
lockApp();
}else{
document.getElementById("status").innerHTML=
"Plan: "+data.plan+" | Active ✔";
}
}

function lockApp(){
document.getElementById("channels").innerHTML=
"<h3>⛔ Trial Expired</h3><p>Please upgrade</p>";
alert("Trial expired!");
}

// ================= TIMER =================
function updateTimer(){
let data=JSON.parse(localStorage.getItem("user_"+currentUser));
if(!data) return;

let limit=5*60*60*1000;
let left=limit-(Date.now()-data.trialStart);

if(left<=0){
document.getElementById("timer").innerText="EXPIRED";
lockApp();
return;
}

let h=Math.floor(left/3600000);
let m=Math.floor((left%3600000)/60000);
let s=Math.floor((left%60000)/1000);

document.getElementById("timer").innerText=
h+"h "+m+"m "+s+"s";
}

// ================= CHANNELS =================
function setCat(c){
currentCat=c;
renderChannels();
}

function renderChannels(){
let box=document.getElementById("channels");
box.innerHTML="";

let q=document.getElementById("search").value.toLowerCase();

channels.filter(ch=>{
return (currentCat==="All"||ch.cat===currentCat) &&
ch.name.toLowerCase().includes(q);
}).forEach(ch=>{
let div=document.createElement("div");
div.className="channel";
div.innerText=ch.name;
div.onclick=()=>play(ch.url);
box.appendChild(div);
});
}

function play(url){
let video=document.getElementById("player");
if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
video.play();
}

// ================= UPGRADE =================
function openUpgrade(){
document.getElementById("modal").style.display="flex";
}

function closeUpgrade(){
document.getElementById("modal").style.display="none";
}

function buy(plan){
alert("Purchased: "+plan+" (demo)");
let data=JSON.parse(localStorage.getItem("user_"+currentUser));
data.plan=plan;
localStorage.setItem("user_"+currentUser,JSON.stringify(data));
closeUpgrade();
}

// ================= STATS =================
setInterval(()=>{
document.getElementById("stats").innerText=
"Users: local | Channels: "+channels.length;
},2000);

</script>

</body>
</html>
