<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ENTERPRISE PRO MAX v4</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--danger:#ef4444;
--warn:#f59e0b;
--ok:#22c55e;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text)}

/* LOGIN */
#login{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.box{
width:320px;
background:var(--panel);
padding:20px;
border-radius:10px;
}

/* LAYOUT */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:240px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.card:hover{border-color:var(--accent)}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
}

.locked{background:var(--warn)}
.unlocked{background:var(--ok)}
.paid{background:var(--danger)}

.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.log{
font-size:12px;
background:#0f1628;
padding:8px;
margin-top:10px;
height:200px;
overflow:auto;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent)}
.danger{background:var(--danger)}
.warn{background:var(--warn)}

input,select{
width:100%;
padding:10px;
margin-top:10px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>🔐 ENTERPRISE LOGIN</h3>

<input id="user" placeholder="Username">
<select id="role">
<option value="superadmin">Super Admin</option>
<option value="admin">Admin</option>
<option value="viewer">Viewer</option>
</select>

<button class="primary" onclick="login()">LOGIN</button>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h3>🚀 BTECH-TV ENTERPRISE v4</h3>
<div id="roleBox"></div>
</div>

<div class="container">

<div class="sidebar">
<h4>📡 Controls</h4>
<p style="font-size:12px;color:#aaa">IPTV Ultra Engine Loaded</p>
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="list" id="chlist"></div>

</div>

<div class="right">
<h4>⚙ Status</h4>

<p id="status">Loading...</p>
<p id="chcount"></p>

<h4>📡 Logs</h4>
<div class="log" id="log"></div>
</div>

</div>

<script>

/* =====================
STATE
===================== */

var all=[],filtered=[],cur=null,cat='All',activeTab='all',hlsP=null;
var deadCh={},aliveCh={},autoSkipOn=true;
var favs=JSON.parse(localStorage.getItem('atv_favs')||'{}');
var recent=JSON.parse(localStorage.getItem('atv_recent')||'[]');
var channelMap={},logoMap={};

/* =====================
LOGIN
===================== */

function login(){
document.getElementById("login").style.display="none";
}

/* =====================
UTILS
===================== */

function flag(cc){
if(!cc||cc.length!==2)return'🌐';
var a=0x1F1E6;
return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);
}

function esc(s){
return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';
}

function tick(){
document.getElementById('clock')?.innerText=new Date().toLocaleTimeString();
}
setInterval(tick,30000);

/* =====================
LOAD API
===================== */

async function loadAPI(){
try{
var [chRes,stRes,lgRes]=await Promise.all([
fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/logos.json').then(r=>r.json())
]);

for(var i=0;i<chRes.length;i++){
var ch=chRes[i];
if(!ch.is_nsfw&&!ch.closed)channelMap[ch.id]=ch;
}

for(var i=0;i<lgRes.length;i++){
var lg=lgRes[i];
if(!logoMap[lg.channel])logoMap[lg.channel]=lg.url;
}

var id=0,seen={};

for(var i=0;i<stRes.length;i++){
var st=stRes[i];
if(!st.url||seen[st.url])continue;

if(st.url.includes('youtube')||st.url.includes('twitch'))continue;

seen[st.url]=1;

var ch=st.channel?channelMap[st.channel]:null;

all.push({
id:++id,
chId:st.channel||null,
n:ch?ch.name:(st.title||'Unknown'),
u:st.url,
cc:ch?ch.country:null,
cat:ch&&ch.categories?ch.categories[0]:'other',
logo:logoMap[st.channel]||null,
q:st.quality||''
});
}

renderCats();
doFilter();

document.getElementById('status').innerText="Loaded "+all.length+" channels";

}catch(e){
document.getElementById('status').innerText="Error loading API";
}
}

/* =====================
FILTER + RENDER
===================== */

function doFilter(){
filtered=all;
renderList();
}

function renderList(){
var box=document.getElementById("chlist");
box.innerHTML="";

filtered.slice(0,300).forEach(c=>{
var div=document.createElement("div");
div.className="card";
div.onclick=()=>tune(c.id);

div.innerHTML=`
<b>${esc(c.n)}</b><br>
<small>${c.cat}</small>
`;

box.appendChild(div);
});
}

/* =====================
PLAYER
===================== */

function tune(id){
var ch=all.find(x=>x.id===id);
if(!ch)return;

var v=document.getElementById("video");

if(window.Hls&&Hls.isSupported()){
var hls=new Hls();
hls.loadSource(ch.u);
hls.attachMedia(v);
}else{
v.src=ch.u;
}

document.getElementById("status").innerText="Playing: "+ch.n;
}

/* =====================
BOOT
===================== */

loadAPI();

</script>

</body>
</html>
