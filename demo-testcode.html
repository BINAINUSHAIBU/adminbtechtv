```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Church & Manage Roles</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

.header{
background:#111a2e;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#4da3ff;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
gap:20px;
}

.card{
background:#111a2e;
padding:20px;
border-radius:15px;
}

.card h2{
margin-bottom:15px;
color:#4da3ff;
}

input,
select{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
background:#1a2742;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:5px;
}

.create{
background:#16a34a;
color:white;
}

.role{
background:#7c3aed;
color:white;
}

.logs{
margin-top:20px;
background:#000;
padding:15px;
height:250px;
overflow:auto;
border-radius:10px;
font-family:monospace;
}

</style>
</head>

<body>

<div class="header">
⛪ CHURCH SUPER ADMIN
</div>

<div class="container">

<div class="grid">

<!-- CREATE CHURCH -->

<div class="card">

<h2>⛪ Create Church</h2>

<input id="churchName" placeholder="Church Name">

<input id="pastorName" placeholder="Pastor Name">

<input id="churchEmail" placeholder="Church Email">

<input id="churchPhone" placeholder="Phone Number">

<input id="country" placeholder="Country">

<input id="city" placeholder="City">

<select id="churchType">
<option>Pentecostal</option>
<option>Catholic</option>
<option>Anglican</option>
<option>Baptist</option>
<option>Methodist</option>
</select>

<button class="create" onclick="createChurch()">
Create Church
</button>

</div>

<!-- MANAGE ROLES -->

<div class="card">

<h2>🛡 Manage Roles</h2>

<input id="userName" placeholder="User Name">

<select id="roleSelect">
<option>Super Admin</option>
<option>Church Admin</option>
<option>Moderator</option>
<option>Editor</option>
<option>Viewer</option>
</select>

<button class="role" onclick="assignRole()">
Assign Role
</button>

<button class="role" onclick="viewRoles()">
View Assigned Roles
</button>

</div>

</div>

<div id="logs" class="logs">
SYSTEM READY...
</div>

</div>

<script>

let churches = [];
let roles = [];

function log(message){
const logs = document.getElementById('logs');
logs.innerHTML +=
"<br>[" +
new Date().toLocaleTimeString() +
"] " + message;
logs.scrollTop = logs.scrollHeight;
}

function createChurch(){

const church = {
name: churchName.value,
pastor: pastorName.value,
email: churchEmail.value,
phone: churchPhone.value,
country: country.value,
city: city.value,
type: churchType.value
};

churches.push(church);

log("Church Created: " + church.name);

alert("Church Created Successfully");
}

function assignRole(){

const role = {
user: userName.value,
role: roleSelect.value
};

roles.push(role);

log("Role Assigned: " + role.user + " → " + role.role);

alert("Role Assigned Successfully");
}

function viewRoles(){

if(roles.length === 0){
alert("No roles assigned");
return;
}

let output = roles
.map(r => r.user + " → " + r.role)
.join("\\n");

alert(output);
}

</script>

</body>
</html>
```
