<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0b0f1a"/>

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
background:var(--panel);
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
border-bottom:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.profile-box{
display:flex;
align-items:center;
gap:12px;
background:var(--card);
padding:10px 14px;
border-radius:12px;
display:none;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

.profile-info small{
color:var(--muted);
font-size:11px;
}

.trial-badge{
background:var(--success);
padding:4px 10px;
border-radius:30px;
font-size:11px;
margin-top:4px;
display:inline-block;
}

/* LOGIN */

.auth-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.auth-box{
width:100%;
max-width:400px;
background:var(--panel);
padding:30px;
border-radius:20px;
}

.auth-box h2{
text-align:center;
margin-bottom:20px;
color:var(--accent);
}

.auth-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.auth-box button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.quality{
position:absolute;
top:15px;
right:15px;
background:#16a34a;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:10;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

/* SEARCH */

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:var(--hover);
}

.left{
display:flex;
gap:12px;
align-items:center;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#16a34a;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
max-height:220px;
}

.player{
height:240px;
}

.channels{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="auth-modal" id="authModal">

<div class="auth-box">

<h2>🔐 BTECH-TV LOGIN</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="loginUser()">
ENTER IPTV
</button>

</div>

</div>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="profile-box" id="profileBox">

<div class="avatar" id="avatarLetter">
U
</div>

<div class="profile-info">

<b id="profileName">
Guest
</b>

<small>
Trial Active
</small>

<span class="trial-badge" id="daysLeft">
7 Days Left
</span>

</div>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎥 Movies</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/index.m3u','Global IPTV')">🚀 Global Feeds</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<div class="quality" id="qualityText">
⚡ CLEAR HD
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading IPTV Channels...
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div>

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global Streaming
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;

const video=document.getElementById('video');

/* LOGIN */

function loginUser(){

const username=
document.getElementById('username').value.trim();

const password=
document.getElementById('password').value.trim();

if(username==='' || password===''){
alert('Enter login details');
return;
}

let users=
JSON.parse(localStorage.getItem('btech_users') || '{}');

if(!users[username]){

users[username]={

password:password,
trialStart:Date.now()

};

localStorage.setItem(
'btech_users',
JSON.stringify(users)
);

}

if(users[username].password!==password){

alert('Wrong password');

return;

}

localStorage.setItem(
'btech_current_user',
username
);

document.getElementById('authModal').style.display='none';

document.getElementById('profileBox').style.display='flex';

document.getElementById('profileName').innerText=
username;

document.getElementById('avatarLetter').innerText=
username.charAt(0).toUpperCase();

checkTrial(users[username]);

}

function checkTrial(user){

const seven=
7*24*60*60*1000;

const left=
seven-(Date.now()-user.trialStart);

const days=
Math.ceil(left/(24*60*60*1000));

document.getElementById('daysLeft').innerText=
days+' Days Left';

}

/* IPTV */

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'Loading '+group+' Channels...';

all=[];

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();

document.getElementById('overlay').style.display='none';

}catch(err){

alert('Failed to load channels');

}

}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logo=
(info.match(/tvg-logo="(.*?)"/)||[])[1];

all.push({

name:name,
url:url,
group:group,
logo:logo || 'https://via.placeholder.com/60'

});

}

}

}

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img src="${c.logo}">

<div>

<h4>${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<span class="badge">
LIVE
</span>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,
lowLatencyMode:true,
maxBufferLength:50,
maxMaxBufferLength:100,
liveSyncDuration:2,
liveMaxLatencyDuration:4

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

}
);

}else{

video.src=channel.url;

video.play();

}

}

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=
all.filter(c=>

c.name.toLowerCase().includes(value)

);

renderChannels();

}

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

/* BUFFER STATUS */

video.addEventListener('waiting',()=>{

document.getElementById('qualityText').innerText=
'⚠ BUFFERING...';

});

video.addEventListener('playing',()=>{

document.getElementById('qualityText').innerText=
'⚡ CLEAR HD';

});

/* AUTO LOGIN */

window.onload=function(){

const saved=
localStorage.getItem('btech_current_user');

if(saved){

const users=
JSON.parse(localStorage.getItem('btech_users') || '{}');

if(users[saved]){

document.getElementById('authModal').style.display='none';

document.getElementById('profileBox').style.display='flex';

document.getElementById('profileName').innerText=
saved;

document.getElementById('avatarLetter').innerText=
saved.charAt(0).toUpperCase();

checkTrial(users[saved]);

}

}

};

/* LOAD */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
