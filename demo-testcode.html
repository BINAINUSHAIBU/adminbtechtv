<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
📺 BTECH-TV ULTRA MAX AFRICA IPTV
</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#08111f;
--panel:#111827;
--card:#1f2937;
--accent:#00c8ff;
--text:#fff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:white;
overflow:hidden;
}

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
}

.container{
display:flex;
height:calc(100vh - 65px);
}

.sidebar{
width:240px;
background:#0f172a;
overflow:auto;
padding:15px;
}

.cat{
padding:12px;
margin:6px 0;
background:var(--card);
cursor:pointer;
border-radius:8px;
}

.cat:hover{
background:var(--accent);
color:black;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.player{
height:320px;
background:black;
}

video{
width:100%;
height:100%;
}

.now{
padding:15px;
background:var(--panel);
display:flex;
justify-content:space-between;
}

.channels{
flex:1;
overflow:auto;
padding:10px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:10px;
}

.channel{

background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;

}

.channel:hover{
border:1px solid cyan;
}

.right{

width:280px;
background:#111827;
padding:15px;
overflow:auto;

}

input{

width:100%;
padding:12px;
background:#0f172a;
border:none;
color:white;
margin-bottom:10px;

}

button{

width:100%;
padding:12px;
background:cyan;
border:none;
cursor:pointer;
margin-top:10px;

}

.stat{

background:var(--card);
padding:15px;
margin-top:10px;
border-radius:10px;

}

</style>
</head>


<body>


<div class="topbar">

<h2>
📺 BTECH-TV ULTRA MAX
</h2>

<div>

<button onclick="
filterCat('All')
">

ALL

</button>

</div>

</div>



<div class="container">


<!-- LEFT -->

<div class="sidebar">

<div class="cat"
onclick="filterCat('All')">

All Channels

</div>


<div class="cat"
onclick="filterCat('Sports')">

Sports

</div>


<div class="cat"
onclick="filterCat('News')">

News

</div>


<div class="cat"
onclick="filterCat('Movies')">

Movies

</div>


<h3>

🌍 Africa Countries

</h3>

<div id="countryList"></div>

</div>




<!-- CENTER -->

<div class="main">


<div class="player">

<video
id="video"
controls
autoplay>

</video>

</div>



<div class="now">

<div>

<h2 id="name">

No Channel

</h2>

<p id="group">

Waiting...

</p>

</div>


<div>

<button onclick="prev()">

Prev

</button>


<button onclick="next()">

Next

</button>

</div>

</div>




<div
class="channels"
id="channels">

</div>


</div>




<!-- RIGHT -->

<div class="right">


<input

placeholder="Search channels"

oninput="
searchChannels(
this.value
)
"

>


<button onclick="
loadIPTV()
">

Load IPTV

</button>



<div class="stat">

Total:

<span id="total">

0

</span>

</div>



<div class="stat">

Free:

<span id="free">

0

</span>

</div>



<div class="stat">

Locked:

<span id="locked">

0

</span>

</div>


<div class="stat">

Favorites:

<span id="fav">

0

</span>

</div>



</div>


</div>



<script>


let channels=[];

let filtered=[];

let current=0;

let hls=null;

let favs=[];



/* LOAD IPTV */


async function loadIPTV(){

let ch=
await fetch(
"https://iptv-org.github.io/api/channels.json"
)
.then(r=>r.json());


let st=
await fetch(
"https://iptv-org.github.io/api/streams.json"
)
.then(r=>r.json());


channels=[];


st.forEach((s,i)=>{

let meta=
ch.find(

x=>x.id===s.channel

);

if(!meta) return;


channels.push({

name:
meta.name,

country:
meta.country||

"Africa",

category:
meta.categories
?

meta.categories[0]

:

"Other",

url:
s.url,

status:
i%10===0

?

"locked"

:

"free"

});


});


filtered=
channels;

render();

stats();

}



/* RENDER */


function render(){

channels.innerHTML="";


filtered
.slice(0,400)
.forEach((c,i)=>{

document
.getElementById(
"channels"
)

.innerHTML+=`

<div
class="channel"

onclick="
play(
${i}
)
">

<div>

<b>

📺 ${c.name}

</b>

<br>

${c.country}

</div>


<div>

${c.status}

</div>

</div>

`;

});

}



/* PLAY */


function play(i){

current=i;

let c=
filtered[i];


name.innerHTML=
c.name;

group.innerHTML=
c.country;


const video=
document.getElementById(
"video"
);


if(
Hls.isSupported()
){

if(hls)
hls.destroy();

hls=
new Hls();

hls.loadSource(
c.url
);

hls.attachMedia(
video
);

}
else{

video.src=
c.url;

}


}



/* SEARCH */


function searchChannels(q){

q=
q.toLowerCase();


filtered=

channels.filter(

x=>

x.name
.toLowerCase()
.includes(q)

||

x.country
.toLowerCase()
.includes(q)

);

render();

}



/* FILTER */


function filterCat(cat){

if(
cat==="All"
)

filtered=
channels;

else

filtered=
channels.filter(

x=>

x.category===cat

||

x.country===cat

);


render();

}



/* NEXT */


function next(){

current++;

if(
current>=filtered.length
)

current=0;


play(current);

}



/* PREV */


function prev(){

current--;

if(
current<0
)

current=
filtered.length-1;


play(current);

}



/* STATS */


function stats(){

total.innerHTML=
channels.length;


free.innerHTML=

channels.filter(

x=>

x.status==="free"

).length;



locked.innerHTML=

channels.filter(

x=>

x.status==="locked"

).length;



fav.innerHTML=

favs.length;

}



/* AFRICA */


const africa=[

"Nigeria",
"Ghana",
"Kenya",
"Uganda",
"Egypt",
"South Africa",
"Cameroon",
"Morocco",
"Rwanda"

];


africa.forEach(c=>{

countryList.innerHTML+=`

<div
class="cat"

onclick="
filterCat(
'${c}'
)
">

${c}

</div>

`;

});


loadIPTV();

</script>


</body>
</html>
