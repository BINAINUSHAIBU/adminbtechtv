/**********************************************************************
 BTECH-TV ULTIMATE
 JavaScript Engine
**********************************************************************/

const video = document.getElementById("player");
const list = document.getElementById("channelList");
const search = document.getElementById("search");
const admin = document.getElementById("admin");
const count = document.getElementById("count");
const adminCount = document.getElementById("adminCount");
const favCount = document.getElementById("favCount");
const categoryTitle = document.getElementById("currentCategory");

let channels = [];
let filteredChannels = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

updateFavoriteCounter();

function updateFavoriteCounter() {
    favCount.textContent = favorites.length;
}

function toggleAdmin() {
    admin.style.display =
        admin.style.display === "block"
            ? "none"
            : "block";
}

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

}

function playChannel(channel){

    if(Hls.isSupported()){

        const hls = new Hls();

        hls.loadSource(channel.url);

        hls.attachMedia(video);

    }else{

        video.src = channel.url;

    }

    video.play();

}

function render(data){

    list.innerHTML="";

    count.innerHTML=data.length;

    adminCount.innerHTML=data.length;

    data.forEach(channel=>{

        const card=document.createElement("div");

        card.className="card";

        const star=favorites.includes(channel.name)
        ? "★"
        : "☆";

        card.innerHTML=`

<h3>${channel.name}</h3>

<p>${channel.group}</p>

<button style="margin-top:10px">

▶ Play

</button>

<button
style="margin-left:8px"
onclick="event.stopPropagation();toggleFavorite('${channel.name}')">

${star}

</button>

`;

        card.onclick=()=>playChannel(channel);

        list.appendChild(card);

    });

}

function toggleFavorite(name){

    if(favorites.includes(name)){

        favorites=favorites.filter(x=>x!==name);

    }else{

        favorites.push(name);

    }

    localStorage.setItem(

        "favorites",

        JSON.stringify(favorites)

    );

    updateFavoriteCounter();

    render(filteredChannels);

}

function showFavorites(){

    categoryTitle.innerHTML="Favorites";

    filteredChannels=channels.filter(c=>favorites.includes(c.name));

    render(filteredChannels);

}

function filterCategory(cat){

    categoryTitle.innerHTML=cat;

    if(cat==="ALL"){

        filteredChannels=channels;

    }else{

        filteredChannels=channels.filter(c=>

            c.group.toUpperCase().includes(cat.toUpperCase())

        );

    }

    render(filteredChannels);

}

search.addEventListener("input",()=>{

    const value=search.value.toLowerCase();

    filteredChannels=channels.filter(c=>

        c.name.toLowerCase().includes(value)

    );

    render(filteredChannels);

});

/*****************************************************************
 M3U Parser
*****************************************************************/

function parseM3U(text){

    const lines=text.split("\n");

    channels=[];

    let current={};

    lines.forEach(line=>{

        if(line.startsWith("#EXTINF")){

            const group=line.match(/group-title="([^"]+)"/);

            const name=line.split(",").pop();

            current={

                name:name.trim(),

                group:group?group[1]:"Other"

            };

        }

        else if(

            line.startsWith("http")

        ){

            current.url=line.trim();

            channels.push(current);

        }

    });

    filteredChannels=channels;

    render(channels);

}

function exportFavorites(){

    const json=JSON.stringify(favorites);

    const blob=new Blob([json]);

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="favorites.json";
