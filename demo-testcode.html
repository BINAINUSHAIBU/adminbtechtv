<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra IPTV Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f1a;
color:white;
display:flex;
height:100vh;
}

.left{
width:30%;
background:#15152a;
overflow-y:auto;
padding:10px;
}

.right{
flex:1;
display:flex;
flex-direction:column;
}

.video{
height:60%;
background:black;
}

video{
width:100%;
height:100%;
}

.controls{
padding:10px;
background:#1c1c33;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:8px;
cursor:pointer;
border:none;
border-radius:5px;
background:#2d2d55;
color:white;
}

input{
padding:8px;
width:95%;
margin-bottom:10px;
}

.card{
padding:10px;
margin:5px 0;
background:#222244;
cursor:pointer;
border-radius:5px;
}

.badge{
font-size:12px;
padding:2px 5px;
border-radius:3px;
}

.free{background:green;}
.locked{background:red;}

.stats{
padding:10px;
background:#111;
}
</style>
</head>

<body>

<!-- LEFT PANEL -->
<div class="left">

<h3>📺 Channels</h3>

<input id="search" placeholder="Search channels..." oninput="render()">

<div class="stats">
Total: <span id="t">0</span> |
Free: <span id="f">0</span> |
Locked: <span id="l">0</span>
</div>

<button onclick="lockAll()">🔒 Lock All</button>
<button onclick="unlockAll()">🔓 Unlock All</button>
<button onclick="shuffle()">🎲 Shuffle</button>

<div id="list"></div>
</div>

<!-- RIGHT PANEL -->
<div class="right">

<div class="video">
<video id="video" controls></video>
</div>

<div class="controls">

<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFS()">⛶ Fullscreen</button>
<button onclick="pip()">📺 PiP</button>
<button onclick="addFav()">⭐ Favorite</button>
<button onclick="showFav()">⭐ Show Fav</button>
<button onclick="showRecent()">🕘 Recent</button>

</div>

<div id="status" style="padding:10px;">Ready</div>

</div>

<script>

let channels=[
{name:"BBC",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",status:"free"},
{name:"CNN",url:"https://test-streams.mux.dev/test.m3u8",status:"free"},
{name:"Sports",url:"https://test-streams.mux.dev/dai-discontinuity-deltatre/manifest.m3u8",status:"free"},
{name:"Movies",url:"https://test-streams.mux.dev/pts_shift/master.m3u8",status:"locked"}
];

let filtered=[...channels];
let fav=JSON.parse(localStorage.getItem("fav")||"[]");
let recent=[];
let dark=true;

/* RENDER */
function render(){

let q=document.getElementById("search").value?.toLowerCase()||"";

let list=document.getElementById("list");
list.innerHTML="";

filtered=channels.filter(c=>c.name.toLowerCase().includes(q));

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.status}">${c.status}</span>
`;

div.onclick=()=>play(c);

list.appendChild(div);
});

stats();
}

/* PLAY */
function play(c){

if(c.status==="locked"){
alert("Channel Locked");
return;
}

let video=document.getElementById("video");

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}

video.play();

document.getElementById("status").innerText="▶ "+c.name;

recent.unshift(c.name);
recent=recent.slice(0,5);
}

/* STATS */
function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.status==="free").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
}

/* LOCK */
function lockAll(){
channels.forEach(c=>c.status="locked");
render();
}

function unlockAll(){
channels.forEach(c=>c.status="free");
render();
}

/* FAVORITE */
function addFav(){
let current=document.getElementById("status").innerText.replace("▶ ","");
fav.push(current);
localStorage.setItem("fav",JSON.stringify(fav));
alert("Added to favorites");
}

function showFav(){
alert("Favorites:\n"+fav.join("\n"));
}

/* RECENT */
function showRecent(){
alert("Recent:\n"+recent.join("\n"));
}

/* THEME */
function toggleTheme(){
dark=!dark;
document.body.style.background=dark?"#0f0f1a":"#eaeaea";
document.body.style.color=dark?"white":"black";
}

/* FULLSCREEN */
function toggleFS(){
let v=document.getElementById("video");
if(!document.fullscreenElement){
v.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* PiP */
function pip(){
let v=document.getElementById("video");
if(document.pictureInPictureEnabled){
v.requestPictureInPicture();
}
}

/* SHUFFLE */
function shuffle(){
channels.sort(()=>Math.random()-0.5);
render();
}

render();

</script>

</body>
</html>
