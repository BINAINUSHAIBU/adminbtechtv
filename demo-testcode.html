<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>🚀 BTECH-TV ULTRA CONTROL + IPTV MAX MERGED</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* LOGIN */
.login{
position:fixed;inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.login-box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:300px;
}

.login-box input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#0f1628;
color:white;
}

.login-box button{
width:100%;
padding:10px;
margin-top:10px;
background:var(--accent);
border:none;
border-radius:8px;
cursor:pointer;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar h2{
color:var(--accent);
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{background:var(--hover);}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
padding:10px;
}

.box{
background:var(--card);
padding:10px;
border-radius:8px;
text-align:center;
}

/* GRID (IPTV CARDS) */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.card:hover{background:var(--hover);transform:scale(1.02)}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:#16a34a}
.paid{background:#dc2626}
.online{background:#16a34a}
.offline{background:#dc2626}

/* PLAYER MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.player{
width:85%;
height:75%;
background:black;
position:relative;
border-radius:10px;
overflow:hidden;
}

.player video{width:100%;height:100%}

.close{
position:absolute;
top:10px;right:10px;
background:red;
border:none;
padding:8px;
color:white;
cursor:pointer;
}

.monitor{
position:absolute;
bottom:10px;
left:10px;
background:rgba(0,0,0,.6);
padding:6px 10px;
border-radius:8px;
font-size:12px;
}

/* USER LIST */
.user-list{
max-height:420px;
overflow:auto;
}

.user-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#0f1628;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

/* BADGES */
.active{background:#16a34a;}
.blocked{background:#dc2626;}
.premium{background:#2563eb;}
.freeplan{background:#f59e0b;}

</style>

</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="login-box">
<h3>🔐 ADMIN LOGIN</h3>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- PLAYER -->
<div class="modal" id="modal">
<div class="player">
<button class="close" onclick="closePlayer()">X</button>
<video id="video" controls autoplay></video>
<div class="monitor" id="monitor">LIVE MONITOR</div>
</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
<h2>🚀 BTECH-TV ULTRA IPTV CONTROL CENTER</h2>
<input placeholder="Search..." oninput="globalSearch(this.value)" style="padding:8px;border:none;border-radius:8px;background:#0f1628;color:white">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat">📺 IPTV Channels</div>
<div class="cat">👥 Users</div>
<div class="cat">⭐ Favorites</div>
<button onclick="loadPlaylists()">🚀 Load IPTV</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- STATS -->
<div class="stats">
<div class="box"><b id="t1">0</b><br>Total</div>
<div class="box"><b id="t2">0</b><br>Free</div>
<div class="box"><b id="t3">0</b><br>Paid</div>
<div class="box"><b id="t4">0</b><br>Online</div>
<div class="box"><b id="t5">0</b><br>Favorites</div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div>

</div>

<script>

/* =====================
STATE
===================== */

let channels=[];
let filtered=[];
let favs=new Set();
let hls=null;

/* LOGIN */
function login(){
if(document.getElementById("pass").value==="admin123"){
document.getElementById("login").style.display="none";
}
}

/* IPTV SOURCES */
const playlists=[
"https://iptv-org.github.io/iptv/index.m3u"
];

const fallback=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
];

/* =====================
LOAD IPTV
===================== */
async function loadPlaylists(){

channels=[];

try{
const res=await fetch(playlists[0]);
const text=await res.text();

const lines=text.split("\n");
let temp={};

lines.forEach(line=>{
if(line.startsWith("#EXTINF")){
temp.name=line.split(",")[1]||"Channel";
}
if(line.startsWith("http")){
temp.url=line;
temp.id=channels.length;
temp.type=Math.random()>0.5?"free":"paid";
temp.status=Math.random()>0.2?"online":"offline";
channels.push({...temp});
}
});

}catch(e){}

/* fallback virtual channels */
for(let i=0;i<200;i++){
channels.push({
id:channels.length,
name:"BTECH LIVE "+i,
url:fallback[0],
type:i%2?"free":"paid",
status:"online"
});
}

filtered=[...channels];
render();
updateStats();
}

/* =====================
RENDER GRID
===================== */
function render(){

let g=document.getElementById("grid");
g.innerHTML="";

filtered.forEach(c=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h4>${c.name}</h4>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
<br><br>
<button onclick="play(${c.id})">▶ Play</button>
<button onclick="fav(${c.id})">⭐</button>
`;

g.appendChild(div);

});

}

/* =====================
PLAY CHANNEL
===================== */
function play(id){

let c=channels[id];

document.getElementById("modal").style.display="flex";

let v=document.getElementById("video");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);
}else{
v.src=c.url;
}

v.play();

/* monitor */
setInterval(()=>{
document.getElementById("monitor").innerText=
`LIVE: ${c.name} | STATUS: ${c.status}`;
},1000);

}

/* CLOSE */
function closePlayer(){
document.getElementById("modal").style.display="none";
}

/* FAVORITE */
function fav(id){
if(favs.has(id))favs.delete(id);
else favs.add(id);
updateStats();
}

/* SEARCH */
function globalSearch(q){
q=q.toLowerCase();
filtered=channels.filter(c=>c.name.toLowerCase().includes(q));
render();
}

/* STATS */
function updateStats(){

document.getElementById("t1").innerText=channels.length;
document.getElementById("t2").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("t3").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("t4").innerText=channels.filter(c=>c.status==="online").length;
document.getElementById("t5").innerText=favs.size;

}

/* INIT */
loadPlaylists();

</script>

</body>
</html>
