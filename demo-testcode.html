<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* ================= LAYOUT ================= */

.container{
display:flex;
height:100vh;
}

/* ================= SIDEBAR ================= */

.sidebar{
width:320px;
background:#0d1324;
padding:12px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:24px;
font-weight:900;
color:var(--accent);
margin-bottom:15px;
text-align:center;
}

.section-title{
margin-top:15px;
margin-bottom:8px;
font-size:16px;
font-weight:bold;
color:var(--accent);
}

.nav-btn{
width:100%;
padding:10px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;
text-align:left;
font-size:14px;
}

.nav-btn:hover{
background:var(--hover);
transform:translateX(3px);
}

/* ================= MAIN ================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#0f172a;
border-bottom:1px solid #1d2b4f;
font-weight:bold;
}

.live{
color:red;
font-size:15px;
}

/* ================= PLAYER ================= */

.player{
height:320px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
background:black;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
}

/* ================= TABLE ================= */

.table-wrap{
flex:1;
overflow:auto;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
background:var(--panel);
}

th{
background:#0f172a;
color:var(--accent);
position:sticky;
top:0;
z-index:10;
}

td,th{
padding:10px;
border-bottom:1px solid #1f2b4d;
text-align:left;
font-size:14px;
}

tr:hover{
background:#16213a;
cursor:pointer;
}

.locked{
color:red;
font-weight:bold;
}

.unlocked{
color:lime;
font-weight:bold;
}

/* ================= ACTION BUTTONS ================= */

.action{
padding:6px 8px;
border:none;
border-radius:6px;
cursor:pointer;
margin:2px;
font-size:12px;
}

.lock{
background:var(--warning);
color:black;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:var(--danger);
color:white;
}

/* ================= MODAL ================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

.modal-box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:320px;
}

.modal-box h3{
margin-bottom:15px;
color:var(--accent);
}

.modal-box button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
cursor:pointer;
}

/* ================= SEARCH ================= */

.search-box{
padding:10px;
background:#111827;
}

.search-box input{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;

/* ================= STATUS ================= */

font-size:13px;
border-top:1px solid #1d2b4f;
}

/* ================= RESPONSIVE ================= */

}

height:240px;
}

.player{

function render(){

body.innerHTML="";

filtered.slice(0,page*50).forEach((c,i)=>{

body.innerHTML+=`

/* ================= PLAY ================= */

function play(i){

let c=filtered[i];

if(c.lock==="Locked"){
alert("🔒 Locked Channel");
return;
}

overlay.style.display="flex";

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(c.url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{

overlay.style.display="none";
video.play();

});

}else{

video.src=c.url;

video.play();

overlay.style.display="none";

}

}

/* ================= ACTIONS ================= */

function toggleLock(i){

filtered[i].lock=
filtered[i].lock==="Locked"?"Unlocked":"Locked";

render();

}

function editChannel(i){

let name=prompt("Edit Channel Name",filtered[i].name);

if(name){

filtered[i].name=name;

render();

}

}

function deleteChannel(i){

if(confirm("Delete Channel?")){

filtered.splice(i,1);

render();

}

}

/* ================= SEARCH ================= */

let q=document.getElementById("search").value.toLowerCase();

);
