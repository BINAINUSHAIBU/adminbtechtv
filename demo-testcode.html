<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>BTECH-TV WORLD</title>

<meta name="theme-color" content="#0b0f1a"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
overflow:auto;
}

.top-buttons button{
padding:10px 16px;
background:var(--card);
border:none;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:20px 0 10px;
color:var(--accent);
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:340px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
text-align:center;
}

.overlay h1{
font-size:60px;
margin-bottom:10px;
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
gap:15px;
flex-wrap:wrap;
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
color:var(--muted);
font-size:13px;
}

.clock{
margin-top:5px;
font-size:12px;
color:var(--muted);
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
border:none;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* SEARCH */

.stats{
padding:10px 15px;
font-size:12px;
background:#0f172a;
color:var(--muted);
}

.search-box{
padding:15px;
display:flex;
gap:10px;
background:var(--panel);
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.search-box input{
flex:1;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.country{
background:#2563eb;
}

.dead{
background:#ef4444;
}

.fav{
font-size:20px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:250px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.player{
height:240px;
}

.channels{
grid-template-columns:1fr;
}

.search-box{
flex-direction:column;
}

.search-box input,
.search-box select{
width:100%;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<div class="container">

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/in.m3u','India')">🇮🇳 India</div>

<h3>🎬 Categories</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎥 Movies</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/music.m3u','Music')">🎵 Music</div>

<h3>➕ Extra Feeds</h3>

<div class="cat" onclick="loadExtraPlaylists()">
🚀 Load Global Feeds
</div>

</div>

<div class="main">

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading IPTV Channels...
</p>

</div>

</div>

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global Streaming
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>

<button onclick="nextChannel()">Next ▶</button>

<button onclick="togglePiP()">📺 PiP</button>

<button onclick="shareChannel()">🔗 Share</button>

<button id="autoSkipBtn" onclick="toggleAutoSkip()">
⏭ Auto Skip
</button>

</div>

</div>

<div class="stats" id="stats">
0 Channels Loaded
</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">

<option value="az">
Sort A-Z
</option>

<option value="za">
Sort Z-A
</option>

</select>

</div>

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

// ============================
// STATE
// ============================

let all = [];
let filteredChannels = [];
let currentIndex = 0;
let currentHls = null;
let autoSkipOn = true;
let dark = true;

let favs =
JSON.parse(localStorage.getItem('atv_favs') || '{}');

let recent =
JSON.parse(localStorage.getItem('atv_recent') || '[]');

let deadCh = {};
let aliveCh = {};

const video =
document.getElementById('video');

// ============================
// EXTRA FEEDS
// ============================

const extraFeeds = [

'https://iptv-org.github.io/iptv/index.m3u',

'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',

'https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u'

];

// ============================
// CLOCK
// ============================

function tick(){

document.getElementById('clock').innerText =
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(tick,1000);

tick();

// ============================
// FLAGS
// ============================

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a = 0x1F1E6;

return String.fromCodePoint(
a + cc.charCodeAt(0)-65,
a + cc.charCodeAt(1)-65
);

}

// ============================
// LOAD PLAYLIST
// ============================

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText =
'Loading '+group+' channels...';

all=[];

try{

const res = await fetch(url);

const text = await res.text();

parseM3U(text,group);

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}catch(err){

alert('Failed to load playlist');

console.error(err);

}

}

// ============================
// PARSE M3U
// ============================

function parseM3U(data,group){

const lines = data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info = lines[i];
const url = lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name = info.split(',').pop();

const logoMatch =
info.match(/tvg-logo="(.*?)"/);

const countryMatch =
info.match(/tvg-country="(.*?)"/);

all.push({

id:all.length+1,

name:name,

url:url,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60',

country:
countryMatch
? countryMatch[1]
: '',

group:group

});

}

}

}

// ============================
// REMOVE DUPLICATES
// ============================

function removeDuplicates(){

const seen = new Set();

all = all.filter(ch=>{

const key = ch.name + '_' + ch.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

// ============================
// LOAD EXTRA FEEDS
// ============================

async function loadExtraPlaylists(){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText =
'Loading Global Feeds...';

for(let url of extraFeeds){

try{

const res = await fetch(url);

const text = await res.text();

parseM3U(text,'Global Feed');

}catch(err){

console.log(err);

}

}

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}

// ============================
// RENDER CHANNELS
// ============================

function renderChannels(){

const box =
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div = document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<span class="badge free">
FREE
</span>

<span class="badge ${
deadCh[c.id]
? 'dead'
: 'country'
}">
${deadCh[c.id] ? 'OFF':'LIVE'}
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick = ()=>playChannel(index);

box.appendChild(div);

});

}

// ============================
// PLAY CHANNEL
// ============================

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText =
channel.name;

document.getElementById('channelGroup').innerText =
channel.group;

if(currentHls){
currentHls.destroy();
}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

currentHls = new Hls({

enableWorker:true,
lowLatencyMode:true,
maxBufferLength:10

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play().catch(()=>{});

aliveCh[channel.id]=1;

delete deadCh[channel.id];

renderChannels();

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

deadCh[channel.id]=1;

renderChannels();

if(autoSkipOn){
nextChannel();
}

}

}
);

}else{

video.src = channel.url;

video.play().catch(()=>{});

}

addRecent(channel.id);

renderChannels();

}

// ============================
// SEARCH
// ============================

function searchChannels(q){

const value = q.toLowerCase();

filteredChannels = all.filter(c=>

c.name.toLowerCase().includes(value)

||

c.group.toLowerCase().includes(value)

);

renderChannels();

updateStats();

}

// ============================
// SORT
// ============================

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

// ============================
// FAVORITES
// ============================

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

// ============================
// RECENT
// ============================

function addRecent(id){

recent = recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){
recent = recent.slice(0,30);
}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

// ============================
// TABS
// ============================

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){
filteredChannels=[...all];
}

if(type==='favs'){
filteredChannels=all.filter(c=>favs[c.id]);
}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch = all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

updateStats();

}

// ============================
// PLAYER CONTROLS
// ============================

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

function shareChannel(){

const channel =
filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({
title:channel.name,
url:channel.url
});

}else{

navigator.clipboard.writeText(channel.url);

alert('Channel URL copied');

}

}

function toggleAutoSkip(){

autoSkipOn=!autoSkipOn;

document.getElementById('autoSkipBtn').innerText =
autoSkipOn
? '⏭ Auto Skip'
: '⏭ Skip OFF';

}

// ============================
// THEME
// ============================

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

// ============================
// UPDATE STATS
// ============================

function updateStats(){

document.getElementById('stats').innerText =
filteredChannels.length +
' Channels Loaded';

}

// ============================
// KEYBOARD
// ============================

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

// ============================
// START
// ============================

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
