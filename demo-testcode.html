<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPTV Business System Pro</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{
margin:0;
font-family:Arial;
background:#060b18;
color:#fff;
display:flex;
height:100vh;
}

.sidebar{
width:320px;
background:#0f172a;
padding:12px;
overflow-y:auto;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
background:#0f172a;
padding:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

button{
padding:8px 10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#2563eb;
color:#fff;
font-size:12px;
}

button:hover{background:#1d4ed8;}

input,select{
width:100%;
padding:8px;
margin:5px 0;
border-radius:6px;
border:none;
outline:none;
}

.channel{
padding:10px;
background:#111c33;
margin:5px 0;
border-radius:6px;
cursor:pointer;
display:flex;
justify-content:space-between;
font-size:13px;
}

.channel:hover{background:#1e2a4a;}

.badge{
font-size:10px;
background:#334155;
padding:2px 6px;
border-radius:5px;
}

.videoBox{
flex:1;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
}

.sectionTitle{
margin:10px 0 5px;
font-size:13px;
color:#38bdf8;
}

.hidden{display:none;}

.loginBox{
padding:20px;
}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="sidebar">
<h2>🔐 IPTV Login</h2>
<input id="user" placeholder="Username" />
<input id="pass" type="password" placeholder="Password" />
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;width:100%;height:100%;">

<div class="sidebar">
<h2>🌍 Country</h2>
<select id="country" onchange="loadM3U()">
<option value="ng">Nigeria</option>
<option value="us">USA</option>
<option value="gb">UK</option>
<option value="in">India</option>
<option value="za">South Africa</option>
</select>

<h2>📂 Playlist Manager</h2>
<input id="m3uUrl" placeholder="Add M3U URL" />
<button onclick="addPlaylist()">Add Playlist</button>

<h2>📊 Categories</h2>
<select id="category" onchange="filterCat()">
<option value="all">All</option>
<option value="Sports">Sports</option>
<option value="News">News</option>
<option value="Movies">Movies</option>
<option value="Kids">Kids</option>
<option value="Entertainment">Entertainment</option>
</select>

<h2>📺 Channels</h2>
<div id="channels"></div>
</div>

<div class="main">
<div class="topbar">
<button onclick="toggleFav()">⭐ Favorites</button>
<button onclick="toggleAdmin()">⚙ Admin</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<div class="videoBox">
<video id="video" controls></video>
</div>
</div>

</div>

<script>
let channels=[];
let fav=JSON.parse(localStorage.getItem('fav')||'[]');
let playlists=JSON.parse(localStorage.getItem('pls')||'[]');
let isAdmin=false;

function login(){
let u=document.getElementById('user').value;
let p=document.getElementById('pass').value;

if(u && p){
document.getElementById('login').style.display='none';
document.getElementById('app').classList.remove('hidden');
loadM3U();
}
}

function logout(){location.reload();}

async function loadM3U(){
let country=document.getElementById('country').value;
let url=`https://iptv-org.github.io/iptv/countries/${country}.m3u`;

let res=await fetch(url);
let text=await res.text();
parse(text);
}

function addPlaylist(){
let url=document.getElementById('m3uUrl').value;
if(url){
playlists.push(url);
localStorage.setItem('pls',JSON.stringify(playlists));
alert('Playlist added');
}
}

function parse(data){
channels=[];
let lines=data.split('\n');
let name='';
let group='General';

for(let i=0;i<lines.length;i++){
if(lines[i].includes('#EXTINF')){
name=lines[i].split(',')[1]||'Unknown';
let g=lines[i].match(/group-title="(.*?)"/);
group=g?g[1]:'General';
}else if(lines[i].startsWith('http')){
channels.push({name,url:lines[i],group});
}
}
render(channels);
}

function render(list){
let c=document.getElementById('channels');
c.innerHTML='';

list.forEach(ch=>{
let d=document.createElement('div');
d.className='channel';
d.innerHTML=`<span>${ch.name}</span><span class='badge'>${ch.group}</span>`;
d.onclick=()=>play(ch.url);
c.appendChild(d);
});
}

function play(url){
let v=document.getElementById('video');
if(window.hls) window.hls.destroy();

if(Hls.isSupported()){
window.hls=new Hls();
window.hls.loadSource(url);
window.hls.attachMedia(v);
}else{v.src=url;}
v.play();
}

function filterCat(){
let c=document.getElementById('category').value;
if(c==='all') render(channels);
else render(channels.filter(x=>x.group.includes(c)));
}

function toggleFav(){
alert('Favorites feature upgrade coming next build');
}

function toggleAdmin(){
isAdmin=!isAdmin;
alert(isAdmin?'Admin Mode ON':'Admin Mode OFF');
}

loadM3U();
</script>

</body>
</html>
