<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLOBAL IPTV ONE PAGE SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1d;
color:white;
}

header{
padding:15px;
background:#111a33;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:220px;
background:#0f1730;
padding:10px;
overflow-y:auto;
}

.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#1d2a55;
color:white;
cursor:pointer;
border-radius:6px;
}

.sidebar button:hover{
background:#2c3f7a;
}

.main{
flex:1;
padding:15px;
overflow-y:auto;
}

.card{
background:#141f3d;
padding:12px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
}

.card:hover{
background:#1d2a55;
}

video{
width:100%;
margin-top:10px;
border-radius:10px;
background:black;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<header>
<h2>🌍 IPTV GLOBAL SYSTEM</h2>
<div>Live TV • Sports • Movies</div>
</header>

<div class="container">

<div class="sidebar">
<button onclick="loadChannels()">📺 Channels</button>
<button onclick="loadSports()">⚽ Sports</button>
<button onclick="loadMovies()">🎬 Movies</button>
<button onclick="loadAdmin()">⚙ Admin</button>
</div>

<div class="main">

<input placeholder="Search..." onkeyup="search(this.value)">

<div id="content"></div>

<video id="player" controls></video>

</div>
</div>

<script>

////////////////////////////////////////////////////
// FAKE DATABASE (MOCK API)
////////////////////////////////////////////////////

const DB = {
channels:[
{id:1,name:"Sports HD",category:"Sports"},
{id:2,name:"Movie Max",category:"Movies"},
{id:3,name:"News 24",category:"News"}
],

sports:[
{home:"Arsenal",away:"Chelsea",status:"LIVE",minute:"65"},
{home:"Madrid",away:"Barca",status:"UPCOMING"}
],

movies:[
{title:"Avengers Endgame",year:2019},
{title:"Fast X",year:2023}
]
};

let current = [];

////////////////////////////////////////////////////
// CHANNELS
////////////////////////////////////////////////////

function loadChannels(){
current = DB.channels;
render(current,"channel");
}

////////////////////////////////////////////////////
// SPORTS
////////////////////////////////////////////////////

function loadSports(){
let html = "<h3>⚽ Live Sports</h3>";
DB.sports.forEach(m=>{
html += `
<div class="card">
${m.home} vs ${m.away}<br>
${m.status} ${m.minute||""}
</div>`;
});
document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// MOVIES
////////////////////////////////////////////////////

function loadMovies(){
let html = "<h3>🎬 Movies</h3>";
DB.movies.forEach(m=>{
html += `
<div class="card">
${m.title} (${m.year})
</div>`;
});
document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// ADMIN PANEL
////////////////////////////////////////////////////

function loadAdmin(){
document.getElementById("content").innerHTML = `
<h3>⚙ Admin Panel</h3>

<div class="card">Users: 1200</div>
<div class="card">Active Streams: 45</div>
<div class="card">Revenue: $5,000</div>

<button onclick="addChannel()">+ Add Channel</button>
`;
}

function addChannel(){
let name = prompt("Channel Name");
if(name){
DB.channels.push({id:Date.now(),name,category:"Custom"});
alert("Channel Added");
loadChannels();
}
}

////////////////////////////////////////////////////
// RENDER
////////////////////////////////////////////////////

function render(data,type){
let html = "<h3>📺 Channels</h3>";

data.forEach(c=>{
html += `
<div class="card" onclick="play('${c.id || c.name}')">
${c.name} - ${c.category}
</div>`;
});

document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// STREAM PLAYER (DEMO HLS)
////////////////////////////////////////////////////

function play(id){
document.getElementById("player").src =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

document.getElementById("player").play();
}

////////////////////////////////////////////////////
// SEARCH
////////////////////////////////////////////////////

function search(q){
let filtered = DB.channels.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase())
);
render(filtered);
}

// INIT
loadChannels();

</script>

</body>
</html>
