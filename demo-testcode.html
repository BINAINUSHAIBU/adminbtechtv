/* ───────── FLAG SYSTEM ───────── */

function flag(cc){

if(!cc || cc.length !== 2){
return '🌐';
}

var a = 0x1F1E6;

return String.fromCodePoint(
a + cc.charCodeAt(0) - 65,
a + cc.charCodeAt(1) - 65
);

}

/* ───────── INIT ───────── */

function init(){

tick();

setInterval(tick,30000);

loadAPI();

loadSavedCustom();

}

function tick(){

document.title =
'📺 SUPER ADMIN IPTV • '+
new Date().toLocaleTimeString();

}

/* ───────── IPTV ORG API ───────── */

async function loadAPI(){

try{

document.getElementById('overlay').style.display='flex';

document.getElementById('overlay').innerHTML =
'Loading IPTV Global API...';

const [channelsRes,streamsRes,logosRes] =
await Promise.all([

fetch('https://iptv-org.github.io/api/channels.json')
.then(r=>r.json()),

fetch('https://iptv-org.github.io/api/streams.json')
.then(r=>r.json()),

fetch('https://iptv-org.github.io/api/logos.json')
.then(r=>r.json())

]);

/* CHANNEL LOOKUP */

for(let ch of channelsRes){

if(ch.is_nsfw || ch.closed){
continue;
}

channelMap[ch.id] = ch;

}

/* LOGO LOOKUP */

for(let lg of logosRes){

if(!logoMap[lg.channel]){

logoMap[lg.channel] = lg.url;

}

}

/* BUILD CHANNELS */

let seen = {};

for(let st of streamsRes){

if(!st.url){
continue;
}

if(seen[st.url]){
continue;
}

if(
st.url.includes('youtube.com')
||
st.url.includes('youtu.be')
||
st.url.includes('twitch.tv')
){
continue;
}

seen[st.url]=1;

let ch =
st.channel
?
channelMap[st.channel]
:
null;

let logo =
st.channel
?
logoMap[st.channel]
:
'https://via.placeholder.com/60';

all.push({

id:all.length+1,

name:
ch
?
ch.name
:
(st.title || 'Unknown'),

url:st.url,

logo:logo,

country:
ch
?
ch.country
:
'',

group:
ch &&
ch.categories &&
ch.categories.length
?
ch.categories[0]
:
'Global IPTV',

quality:
st.quality || 'HD',

channelId:
st.channel || null,

ref:
st.referrer || null,

ua:
st.user_agent || null

});

}

/* SORT */

all.sort((a,b)=>{

return a.name.localeCompare(b.name);

});

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

/* LOAD EXTRA */

loadExtraFeeds();

/* LOAD BULK EPG */

loadBulkEPG();

}catch(e){

console.log(e);

document.getElementById('overlay').innerHTML =
'API Failed Loading Playlists...';

loadExtraFeeds();

}

}

/* ───────── PLAYLIST LOADER ───────── */

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlay').innerHTML =
'Loading '+group+' Channels...';

try{

let text = await fetchWithProxy(url);

parseM3U(text,group);

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}catch(err){

console.log(err);

alert('Playlist Failed');

}

}

/* ───────── PROXY FETCH ───────── */

async function fetchWithProxy(url){

try{

let r =
await fetch(url);

if(r.ok){

return await r.text();

}

}catch(e){}

for(let p of corsProxies){

try{

let r =
await fetch(
p + encodeURIComponent(url)
);

if(r.ok){

return await r.text();

}

}catch(e){}

}

throw new Error('All Fetches Failed');

}

/* ───────── M3U PARSER ───────── */

function parseM3U(data,group){

const lines = data.split('\n');

for(let i=0;i<lines.length;i++){

let line = lines[i];

if(line.startsWith('#EXTINF')){

let url = lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

if(
url.includes('youtube.com')
||
url.includes('youtu.be')
||
url.includes('twitch.tv')
){
continue;
}

let name =
line.split(',').pop().trim();

let logo =
(line.match(/tvg-logo="(.*?)"/)||[])[1]
||
'https://via.placeholder.com/60';

let country =
(line.match(/tvg-country="(.*?)"/)||[])[1]
||
'';

let quality =
(line.match(/tvg-quality="(.*?)"/)||[])[1]
||
'HD';

all.push({

id:all.length+1,

name:name,

url:url,

logo:logo,

country:country,

group:group,

quality:quality,

channelId:null

});

}

}

}

/* ───────── REMOVE DUPLICATES ───────── */

function removeDuplicates(){

const seen = new Set();

all = all.filter(ch=>{

const key = ch.name+'_'+ch.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

/* ───────── EXTRA FEEDS ───────── */

async function loadExtraFeeds(){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlay').innerHTML =
'Loading Global IPTV APIs...';

for(let feed of extraFeeds){

try{

let text =
await fetchWithProxy(feed.url);

parseM3U(text,feed.name);

}catch(e){

console.log(feed.name,e);

}

}

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}

/* ───────── RENDER CHANNELS ───────── */

function renderChannels(){

const grid =
document.getElementById('channelGrid');

grid.innerHTML='';

filteredChannels.slice(0,1000).forEach((c,index)=>{

grid.innerHTML += `

<div class="channel">

<div class="channel-top">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div>

<h3>${c.name}</h3>

<p>
${c.group}
${c.country ? ' • '+flag(c.country) : ''}
</p>

<div class="badges">

<span class="badge live">
LIVE
</span>

<span class="badge premium">
${c.quality || 'HD'}
</span>

<span class="badge ${
deadCh[c.id]
?
'dead'
:
'favorite'
}">
${
deadCh[c.id]
?
'OFFLINE'
:
(favs[c.id] ? '★ FAV' : 'ONLINE')
}
</span>

</div>

</div>

</div>

<button onclick="playChannel(${index})">
▶ Watch Live
</button>

</div>

`;

});

}

/* ───────── PLAYER ───────── */

function cleanupPlayer(){

if(currentHls){

currentHls.destroy();

currentHls = null;

}

video.pause();

video.removeAttribute('src');

video.load();

}

function playChannel(index){

currentIndex = index;

const channel =
filteredChannels[index];

currentChannel = channel;

if(!channel){
return;
}

document.getElementById('overlay').style.display='flex';

document.getElementById('overlay').innerHTML =
'Connecting To Live IPTV...';

cleanupPlayer();

const startPlayback = ()=>{

video.play()

.then(()=>{

document.getElementById('overlay').style.display='none';

aliveCh[channel.id]=1;

delete deadCh[channel.id];

updateStats();

})

.catch(()=>{

document.getElementById('overlay').innerHTML =
'Tap To Play';

});

};

/* AUTOSKIP */

if(window._askip){
clearTimeout(window._askip);
}

if(autoSkipOn){

window._askip = setTimeout(()=>{

deadCh[channel.id]=1;

renderChannels();

nextChannel();

},8000);

}

/* HLS */

if(Hls.isSupported()){

currentHls = new Hls({

enableWorker:true,
lowLatencyMode:true,
backBufferLength:90,
maxBufferLength:120,
maxMaxBufferLength:180,
manifestLoadingTimeOut:30000,
fragLoadingTimeOut:40000,
liveSyncDurationCount:3

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

if(window._askip){
clearTimeout(window._askip);
}

startPlayback();

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

deadCh[channel.id]=1;

delete aliveCh[channel.id];

renderChannels();

if(autoSkipOn){

nextChannel();

}

}

}
);

}else{

video.src = channel.url;

startPlayback();

}

addRecent(channel.id);

fetchEPG(channel.channelId);

}

/* ───────── SEARCH ───────── */

function searchChannels(q){

q=q.toLowerCase();

filteredChannels = all.filter(c=>

c.name.toLowerCase().includes(q)

||

c.group.toLowerCase().includes(q)

||

(c.country||'')
.toLowerCase()
.includes(q)

);

renderChannels();

updateStats();

}

/* ───────── CHANNEL NAVIGATION ───────── */

function nextChannel(){

currentIndex++;

if(currentIndex >= filteredChannels.length){

currentIndex = 0;

}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex < 0){

currentIndex =
filteredChannels.length - 1;

}

playChannel(currentIndex);

}

/* ───────── FAVORITES ───────── */

function toggleFav(id){

if(favs[id]){

delete favs[id];

}else{

favs[id]=1;

}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* ───────── PiP ───────── */

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

/* ───────── MINI PLAYER ───────── */

function toggleMiniPlayer(){

const mini =
document.getElementById('miniPlayer');

if(mini.style.display==='block'){

mini.style.display='none';

}else{

mini.style.display='block';

document.getElementById('miniVideo').src =
video.currentSrc;

}

}

/* ───────── THEME ───────── */

function toggleTheme(){

const root =
document.documentElement;

const current =
getComputedStyle(root)
.getPropertyValue('--bg');

if(current.trim()==='#050505'){

root.style.setProperty('--bg','#f5f5f5');
root.style.setProperty('--text','#000');
root.style.setProperty('--panel','#ffffff');
root.style.setProperty('--card','#e5e7eb');

}else{

root.style.setProperty('--bg','#050505');
root.style.setProperty('--text','#fff');
root.style.setProperty('--panel','#101010');
root.style.setProperty('--card','#171717');

}

}

/* ───────── SHARE ───────── */

function shareChannel(){

const channel =
filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({

title:channel.name,
url:channel.url

});

}else{

navigator.clipboard.writeText(channel.url);

alert('Stream URL Copied');

}

}

/* ───────── RECENT ───────── */

function addRecent(id){

recent = recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

/* ───────── EPG SYSTEM ───────── */

async function fetchEPG(channelId){

if(!channelId){
return;
}

try{

let url =
'https://epg.pw/api/epg.json?channel_id='+
encodeURIComponent(channelId);

let text =
await fetchWithProxy(url);

let data =
JSON.parse(text);

if(
data &&
data.epg_listings &&
data.epg_listings.length
){

showEPG(data.epg_listings);

}

}catch(e){

console.log(e);

}

}

function showEPG(list){

let now =
Date.now()/1000;

let current = null;

for(let l of list){

let start =
l.start_timestamp || 0;

let end =
l.end_timestamp || 0;

if(start<=now && end>now){

current=l;

break;

}

}

if(current){

document.getElementById('stats').innerHTML +=
' • NOW PLAYING: '+
(current.title || 'Live Program');

}

}

for(let cc of customChannels){

/* ───────── STATS ───────── */

function updateStats(){

document.getElementById('stats').innerHTML =

filteredChannels.length+
' IPTV Channels Loaded • '+

Object.keys(aliveCh).length+
' Online Streams • '+

Object.keys(deadCh).length+
' Offline Streams';

document.addEventListener(
'keydown',
function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

prevChannel();
}

if(e.key==='p'){
togglePiP();

}
);
