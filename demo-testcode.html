
<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:300px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:15px;
}

.menu-title{
color:#00d4ff;
margin:15px 0 10px;
font-size:12px;
}

/* NAV BUTTONS */
.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

.nav-btn:hover{
background:#1e2f57;
}

/* STATUS LIST (ON/OFF PANEL) */
.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px;
margin:5px 0;
background:#172033;
border-radius:6px;
font-size:13px;
}

.item button{
background:#111827;
border:none;
color:#fff;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:10px;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
width:260px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:8px;
}

.stat{
background:#101d39;
padding:8px;
border-radius:8px;
text-align:center;
}

/* PLAYER */
.player-container{
background:#000;
border-radius:10px;
overflow:hidden;
height:320px;
flex-shrink:0;
}

video{
width:100%;
height:100%;
}

/* CONTROLS */
.controls{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:10px 0;
}

.controls button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#152445;
color:#fff;
cursor:pointer;
}

.controls button:hover{
background:#00d4ff;
color:#000;
}

/* CHANNELS */
.channel-wrapper{
flex:1;
overflow:hidden;
display:flex;
flex-direction:column;
}

.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{
transform:scale(1.03);
border-color:#00d4ff;
}

/* ADMIN */
.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
}

.admin-box{
background:#111827;
padding:20px;
border-radius:10px;
width:90%;
}

.admin-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
}

.admin-grid button{
padding:12px;
border:none;
border-radius:8px;
background:#172033;
color:#fff;
cursor:pointer;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>
<button class="nav-btn" onclick="load('fr')">France</button>
<button class="nav-btn" onclick="load('de')">Germany</button>
<button class="nav-btn" onclick="load('br')">Brazil</button>
<button class="nav-btn" onclick="load('za')">South Africa</button>
<button class="nav-btn" onclick="load('ca')">Canada</button>
<button class="nav-btn" onclick="load('au')">Australia</button>
<button class="nav-btn" onclick="load('jp')">Japan</button>
<button class="nav-btn" onclick="load('kr')">South Korea</button>
<button class="nav-btn" onclick="load('cn')">China</button>
<button class="nav-btn" onclick="load('es')">Spain</button>
<button class="nav-btn" onclick="load('it')">Italy</button>
<button class="nav-btn" onclick="load('tr')">Turkey</button>
<button class="nav-btn" onclick="load('mx')">Mexico</button>
<button class="nav-btn" onclick="load('ae')">UAE</button>
<button class="nav-btn" onclick="load('sa')">Saudi Arabia</button>
<button class="nav-btn" onclick="load('eg')">Egypt</button>
<button class="nav-btn" onclick="load('ar')">Argentina</button>
<button class="nav-btn" onclick="load('pk')">Pakistan</button>
<button class="nav-btn" onclick="load('id')">Indonesia</button>
<button class="nav-btn" onclick="load('ph')">Philippines</button>
<button class="nav-btn" onclick="load('al')">Albania</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">News</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">Movies</button>
<button class="nav-btn" onclick="loadCat('music')">Music</button>
<button class="nav-btn" onclick="loadCat('kids')">Kids</button>
<button class="nav-btn" onclick="loadCat('comedy')">Comedy</button>
<button class="nav-btn" onclick="loadCat('documentary')">Documentary</button>
<button class="nav-btn" onclick="loadCat('business')">Business</button>
<button class="nav-btn" onclick="loadCat('science')">Science</button>
<button class="nav-btn" onclick="loadCat('travel')">Travel</button>

<div class="menu-title">🗣 Languages</div>
<button class="nav-btn" onclick="load('eng')">English</button>
<button class="nav-btn" onclick="load('spa')">Spanish</button>
<button class="nav-btn" onclick="load('ara')">Arabic</button>
<button class="nav-btn" onclick="load('fra')">French</button>
<button class="nav-btn" onclick="load('hin')">Hindi</button>
<button class="nav-btn" onclick="load('zho')">Chinese</button>
<button class="nav-btn" onclick="load('por')">Portuguese</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn" onclick="scan()">Scan</button>
<button class="nav-btn" onclick="boost()">Boost</button>
<button class="nav-btn" onclick="repair()">Repair</button>
<button class="nav-btn" onclick="optimize()">Optimize</button>
<button class="nav-btn" onclick="openAdmin()">Admin</button>

<div class="menu-title">⚙ Status Panel</div>
<div id="status"></div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="toggleMute()">Mute</button>
<button onclick="toggleFS()">Fullscreen</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<div class="admin-box">

<h2>SUPER ADMIN PANEL</h2>

<div class="admin-grid">
<button onclick="scan()">Scan</button>
<button onclick="boost()">Boost</button>
<button onclick="repair()">Repair</button>
<button onclick="optimize()">Optimize</button>
<button onclick="toggleLock()">LOCK/UNLOCK</button>
<button onclick="closeAdmin()">Close</button>
</div>

</div>
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;
let locked=false;

/* LOAD */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((line,idx,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
stats();
renderStatus();
}

/* GRID */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* CONTROLS */
function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}
function toggleFS(){video.requestFullscreen();}

/* ADMIN */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}
function scan(){alert("Scanning streams...");}
function boost(){video.playbackRate=1.2;}
function repair(){alert("Repair mode active");}
function optimize(){alert("Optimizing system");}

function toggleLock(){
locked=!locked;
alert(locked?"SYSTEM LOCKED":"SYSTEM UNLOCKED");
}

/* STATUS PANEL */
function renderStatus(){
let box=document.getElementById("status");
box.innerHTML="";

["Countries","Categories","Languages","Tools"].forEach(name=>{
let div=document.createElement("div");
div.className="item";
div.innerHTML=`<span>${name}</span><button onclick="toggle(this)">ON</button>`;
box.appendChild(div);
});
}

function toggle(btn){
btn.innerText=btn.innerText==="ON"?"OFF":"ON";
}

/* STATS */
function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* INIT */
load("ng");

</script>

</body>
</html>
