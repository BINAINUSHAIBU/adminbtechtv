<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WORLDTV PRO MAX IPTV MERGED 2026 (TRIAL)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* WATERMARK */
.watermark{
position:fixed;
top:10px;
right:15px;
z-index:9999;
color:#00d4ff;
font-weight:bold;
opacity:0.7;
}

/* TRIAL BANNER */
.trial{
position:fixed;
top:0;
left:0;
right:0;
background:#ff2d2d;
color:#fff;
text-align:center;
padding:5px;
z-index:9999;
font-weight:bold;
}

/* SIDEBAR */
.sidebar{
width:300px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:15px;
}

.menu-title{
color:#00d4ff;
margin:15px 0 10px;
font-size:12px;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:10px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
width:260px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:8px;
}

.stat{
background:#101d39;
padding:8px;
border-radius:8px;
text-align:center;
}

/* PLAYER */
.player-container{
background:#000;
border-radius:10px;
overflow:hidden;
height:320px;
flex-shrink:0;
}

video{
width:100%;
height:100%;
}

/* CONTROLS */
.controls{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:10px 0;
}

.controls button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#152445;
color:#fff;
cursor:pointer;
}

/* CHANNELS */
.channel-wrapper{
flex:1;
overflow:hidden;
display:flex;
flex-direction:column;
}

.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

/* ADMIN LOCKED */
.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
justify-content:center;
align-items:center;
}

.admin-box{
background:#111827;
padding:20px;
border-radius:10px;
width:90%;
text-align:center;
}

.admin-box h2{
color:#ff2d2d;
}

.admin-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-top:15px;
}

.admin-grid button{
padding:12px;
border:none;
border-radius:8px;
background:#172033;
color:#fff;
cursor:pointer;
}

/* LOCK MESSAGE */
.lock-msg{
color:#ff2d2d;
margin-top:10px;
}

</style>
</head>

<body>

<div class="trial">⏳ TRIAL VERSION - LIMITED ACCESS</div>
<div class="watermark">WORLDTV PRO MAX • TRIAL</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X (TRIAL MODE)</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>
<button class="nav-btn" onclick="load('fr')">France</button>
<button class="nav-btn" onclick="load('de')">Germany</button>
<button class="nav-btn" onclick="load('br')">Brazil</button>
<button class="nav-btn" onclick="load('za')">South Africa</button>
<button class="nav-btn" onclick="load('ca')">Canada</button>
<button class="nav-btn" onclick="load('au')">Australia</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">News</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">Movies</button>
<button class="nav-btn" onclick="loadCat('music')">Music</button>
<button class="nav-btn" onclick="loadCat('kids')">Kids</button>

<div class="menu-title">🗣 Languages</div>
<button class="nav-btn" onclick="load('eng')">English</button>
<button class="nav-btn" onclick="load('spa')">Spanish</button>
<button class="nav-btn" onclick="load('ara')">Arabic</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn" onclick="scan()">Scan</button>
<button class="nav-btn" onclick="boost()">Boost</button>
<button class="nav-btn" onclick="repair()">Repair</button>
<button class="nav-btn" onclick="optimize()">Optimize</button>
<button class="nav-btn" onclick="openAdmin()">Admin</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="toggleMute()">Mute</button>
<button onclick="toggleFS()">Fullscreen</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<!-- ADMIN LOCK -->
<div class="admin" id="admin">
<div class="admin-box">
<h2>🔒 ADMIN LOCKED (TRIAL)</h2>
<p class="lock-msg">Upgrade required to unlock full admin controls.</p>

<div class="admin-grid">
<button disabled>Scan</button>
<button disabled>Boost</button>
<button disabled>Repair</button>
<button disabled>Optimize</button>
<button onclick="closeAdmin()">Close</button>
</div>

</div>
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* ⏳ TRIAL TIMER (5 MIN LIMIT) */
let trialTime = 300;
setInterval(()=>{
trialTime--;
if(trialTime<=0){
alert("Trial expired. Restart page or upgrade.");
video.pause();
}
},1000);

/* LOAD */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((line,idx,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

/* 🔒 TRIAL LIMIT (FIRST 50 CHANNELS ONLY) */
all = all.slice(0,50);
filtered=[...all];

render();
stats();
}

/* GRID */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* CONTROLS */
function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}
function toggleFS(){video.requestFullscreen();}

/* ADMIN */
function openAdmin(){
document.getElementById("admin").style.display="flex";
}
function closeAdmin(){
document.getElementById("admin").style.display="none";
}

/* STATS */
function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* INIT */
load("ng");

</script>

</body>
</html>
