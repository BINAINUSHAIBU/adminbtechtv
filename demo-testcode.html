<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV SYSTEM 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#0f172d;
--card:#111a31;
--accent:#00d4ff;
--text:#fff;
--danger:red;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:var(--bg);
color:var(--text);
}

/* LOGIN */
.login{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.login-box{
background:#0f172d;
padding:30px;
border-radius:15px;
width:300px;
border:1px solid #1f355d;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#111a31;
color:#fff;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* APP */
.app{display:none;}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0d1324;
}

.sidebar{
position:fixed;
left:0;top:0;
width:240px;height:100%;
background:#0d1324;
padding:15px;
overflow:auto;
}

.main{
margin-left:240px;
padding:15px;
}

.nav{
padding:10px;
background:#111a31;
margin:5px 0;
border-radius:10px;
cursor:pointer;
}

.player video{
width:100%;
height:350px;
background:black;
}

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
margin-top:15px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:var(--accent)}

.badge{
font-size:10px;
padding:3px 8px;
background:red;
border-radius:10px;
float:right;
}

.admin{
position:fixed;
right:10px;
top:60px;
width:260px;
background:#0f172d;
padding:10px;
border-radius:10px;
border:1px solid #1f355d;
display:none;
}

.small{
font-size:12px;
color:#aaa;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="login-box">
<h3>🔐 PRO MAX LOGIN</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p class="small">admin / admin</p>
</div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="topbar">
<div>📺 WORLDTV PRO MAX</div>
<button onclick="toggleAdmin()">ADMIN</button>
</div>

<div class="sidebar">

<div class="nav" onclick="load('https://iptv-org.github.io/iptv/countries/ng.m3u')">🇳🇬 Nigeria</div>
<div class="nav" onclick="load('https://iptv-org.github.io/iptv/countries/us.m3u')">🇺🇸 USA</div>
<div class="nav" onclick="load('https://iptv-org.github.io/iptv/countries/uk.m3u')">🇬🇧 UK</div>
<div class="nav" onclick="load('https://iptv-org.github.io/iptv/index.country.m3u')">🌍 GLOBAL</div>

<div class="nav" onclick="recordMode()">⏺ Record Mode</div>
<div class="nav" onclick="scan()">📡 Scan Streams</div>
<div class="nav" onclick="toggleFavs()">⭐ Favorites</div>

</div>

<div class="main">

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<h3>📡 Channels</h3>
<div class="channels" id="list"></div>

</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin">
<h4>⚙ ADMIN PANEL</h4>
<p class="small">System Control</p>
<button onclick="clearCache()">Clear Cache</button>
<button onclick="reset()">Reset System</button>
<button onclick="fakePaywall()">Toggle Paywall</button>
</div>

</div>

<script>

let all=[],filtered=[],index=0;
let paywall=false;
let favs={};
let showFav=false;
let currentHls;

const video=document.getElementById("video");
const list=document.getElementById("list");

/* LOGIN */
function login(){
let u=user.value,p=pass.value;
if(u==="admin" && p==="admin"){
login.style.display="none";
app.style.display="block";
}
}

/* LOAD M3U */
async function load(url){

const res=await fetch(url);
const text=await res.text();

all=[];

text.split("\n").forEach((l,i,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let link=arr[i+1];

if(link && link.startsWith("http")){
all.push({name,link,id:all.length+1});
}
}
});

filtered=[...all];
render();
}

/* RENDER */
function render(){

list.innerHTML="";

filtered.forEach((c,i)=>{

if(paywall && i%5===0){
return;
}

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="badge">LIVE</div>
${c.name}
`;

div.onclick=()=>play(i);

list.appendChild(div);
});
}

/* PLAY */
function play(i){

index=i;
let c=filtered[i];

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.link);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.link;
video.play();
}

}

/* ADMIN */
function toggleAdmin(){
admin.style.display = admin.style.display==="block"?"none":"block";
}

function clearCache(){
localStorage.clear();
alert("Cache Cleared");
}

function reset(){
all=[];filtered=[];
list.innerHTML="";
alert("System Reset");
}

function fakePaywall(){
paywall=!paywall;
alert("Paywall toggled: "+paywall);
}

/* FEATURES */
function recordMode(){
alert("Recording Started (UI mode)");
}

function scan(){
alert("Scanning streams...");
}

function toggleFavs(){
showFav=!showFav;
filtered = showFav ? all.filter(x=>favs[x.id]) : all;
render();
}

/* AUTO LOAD */
load("https://iptv-org.github.io/iptv/index.country.m3u");

</script>

</body>
</html>
