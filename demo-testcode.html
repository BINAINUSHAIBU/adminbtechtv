<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH TV - SUPER ADMIN SAAS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#020617;color:#fff;overflow-x:hidden}

/* ================= LAYOUT ================= */
.container{display:flex;min-height:100vh}

/* ================= SIDEBAR ================= */
.sidebar{
width:260px;
background:#0f172a;
padding:15px;
overflow-y:auto;
border-right:1px solid #1e293b;
}

.logo{
text-align:center;
margin-bottom:20px;
color:#00d4ff;
font-size:22px;
font-weight:bold;
}

.menu button{
width:100%;
padding:10px;
margin:5px 0;
background:#111827;
border:none;
color:#fff;
border-radius:10px;
cursor:pointer;
text-align:left;
}

.menu button:hover{background:#00d4ff;color:#000}

/* ================= MAIN ================= */
.main{flex:1;padding:15px}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.card{
background:#111827;
padding:10px 15px;
border-radius:10px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-bottom:15px;
}

.stat{
background:#111827;
padding:15px;
border-radius:12px;
text-align:center;
}

.stat h3{color:#94a3b8;font-size:12px}
.stat p{color:#00d4ff;font-size:22px}

/* CHANNELS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

.channel{
background:#1e293b;
border-radius:12px;
overflow:hidden;
}

.channel img{width:100%;height:120px;object-fit:cover}

.body{padding:10px}

.badge{
font-size:10px;
padding:4px 8px;
border-radius:20px;
margin-right:5px;
}

.free{background:#16a34a}
.premium{background:#dc2626}
.locked{background:#f59e0b}

.btns button{
margin-top:8px;
width:32%;
padding:6px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.watch{background:#00d4ff}
.edit{background:#2563eb;color:#fff}
.del{background:#dc2626;color:#fff}

/* PLAYER */
.player{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.player video{width:90%;max-width:900px}

.close{
background:red;
padding:10px;
border:none;
color:#fff;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
}

/* AUTH */
#auth{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#020617;
}

.auth-box{
background:#111827;
padding:20px;
border-radius:12px;
width:280px;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
background:#00d4ff;
border:none;
margin-top:5px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h3>SUPER ADMIN LOGIN</h3>
<input id="u" placeholder="User">
<input id="p" type="password" placeholder="Pass">
<button onclick="login()">Login</button>
</div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
<button class="close" onclick="closePlayer()">Close</button>
<video id="video" controls></video>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">BTECH TV</div>

<div class="menu">
<button onclick="load('ng')">🇳🇬 Nigeria</button>
<button onclick="load('us')">🇺🇸 USA</button>
<button onclick="loadCat('sports')">⚽ Sports</button>
<button onclick="loadCat('news')">📰 News</button>
<button onclick="loadCat('movies')">🎬 Movies</button>
<button onclick="openAdmin()">⚙ Admin</button>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
<h2>SUPER ADMIN DASHBOARD</h2>
<div class="card">BTECH ADMIN</div>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat"><h3>Total</h3><p id="t">0</p></div>
<div class="stat"><h3>Free</h3><p id="f">0</p></div>
<div class="stat"><h3>Premium</h3><p id="p">0</p></div>
<div class="stat"><h3>Locked</h3><p id="l">0</p></div>
</div>

<!-- CHANNELS -->
<div class="grid" id="grid"></div>

</div>
</div>
</div>

<script>

let channels=[];

function login(){
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
generate();
render();
}

function generate(){
for(let i=1;i<=60;i++){
channels.push({
name:"BTECH LIVE "+i,
type:Math.random()>0.5?"Free":"Premium",
status:Math.random()>0.3?"Unlocked":"Locked",
views:Math.floor(Math.random()*900000),
stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
img:"https://via.placeholder.com/400x200"
});
}
stats();
}

function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.type=="Free").length;
document.getElementById("p").innerText=channels.filter(c=>c.type=="Premium").length;
document.getElementById("l").innerText=channels.filter(c=>c.status=="Locked").length;
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
channels.forEach(c=>{
g.innerHTML+=`
<div class="channel">
<img src="${c.img}">
<div class="body">
<h4>${c.name}</h4>
<span class="badge ${c.type=="Free"?"free":"premium"}">${c.type}</span>
<span class="badge ${c.status=="Locked"?"locked":""}">${c.status}</span>
<p>👁 ${c.views}</p>
<div class="btns">
<button class="watch" onclick="play('${c.stream}','${c.name}')">Watch</button>
<button class="edit">Edit</button>
<button class="del">Del</button>
</div>
</div>
</div>`;
});
}

function play(url,name){
document.getElementById("player").style.display="flex";
let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());
}else{
v.src=url;
v.play();
}
}

function closePlayer(){
document.getElementById("player").style.display="none";
document.getElementById("video").pause();
}

function load(code){
fetch(`https://iptv-org.github.io/iptv/countries/${code}.m3u`)
.then(r=>r.text()).then(parse);
}

function loadCat(cat){
fetch(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`)
.then(r=>r.text()).then(parse);
}

function parse(t){
channels=[];
let l=t.split("\n");
for(let i=0;i<l.length;i++){
if(l[i].startsWith("#EXTINF")){
let name=l[i].split(",")[1];
let url=l[i+1];
if(url && url.startsWith("http")){
channels.push({
name,
type:"Free",
status:"Unlocked",
views:0,
stream:url,
img:"https://via.placeholder.com/400x200"
});
}
}
}
stats();
render();
}

</script>

</body>
</html>
