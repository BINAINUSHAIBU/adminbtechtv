<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRO MULTIPLAYER QUIZ SYSTEM</title>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff}

.topbar{
background:#11182a;
padding:12px;
display:flex;
justify-content:space-between;
}

.container{display:flex;height:calc(100vh - 50px)}

.sidebar{
width:260px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;padding:15px;overflow:auto}

.card{
background:#1b2438;
padding:12px;
margin-bottom:10px;
border-radius:10px;
}

button{
padding:10px;
margin-top:8px;
background:#00bfff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
background:#0f1628;
color:#fff;
}

.option{
padding:10px;
margin:5px 0;
background:#0f1628;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
<h3>🎮 MULTIPLAYER QUIZ SYSTEM</h3>
<div id="me"></div>
</div>

<div class="container">

<div class="sidebar">

<h3>🎯 MENU</h3>

<input id="roomId" placeholder="Room ID">
<input id="name" placeholder="Your Name">

<button onclick="createRoom()">Create Room</button>
<button onclick="joinRoom()">Join Room</button>

<button onclick="startGame()">Start Game (Host)</button>

</div>

<div class="main" id="main"></div>

</div>

<script>

/* ======================
GLOBAL STATE
====================== */

let rooms = {};
let currentRoom = null;
let me = null;
let isHost = false;
let index = 0;
let timer = null;

/* ======================
1000 QUESTIONS ENGINE
====================== */

let questions = [];

for(let i=1;i<=1000;i++){
questions.push({
q:`Math Question ${i}: ${i} + 5 = ?`,
options:[i+5,i+3,i+10,i],
answer:i+5
});
}

/* ======================
CREATE ROOM
====================== */

function createRoom(){

let id = document.getElementById("roomId").value;
let name = document.getElementById("name").value;

if(!id || !name) return alert("Fill fields");

rooms[id] = {
host:name,
players:{},
index:0,
time:15,
started:false
};

joinRoom();
isHost = true;
}

/* ======================
JOIN ROOM
====================== */

function joinRoom(){

let id = document.getElementById("roomId").value;
let name = document.getElementById("name").value;

if(!rooms[id]) return alert("Room not found");

currentRoom = id;
me = name;

rooms[id].players[name] = {
score:0,
answered:false
};

document.getElementById("me").innerHTML =
`👤 ${name} ${isHost ? "(Host)" : ""}`;

renderLobby();
}

/* ======================
LOBBY
====================== */

function renderLobby(){

let room = rooms[currentRoom];

document.getElementById("main").innerHTML = `
<div class="card">
<h2>🎮 ROOM: ${currentRoom}</h2>

<h3>👥 Players</h3>

${Object.keys(room.players).map(p=>
`<div class="card">👤 ${p} — ⭐ ${room.players[p].score}</div>`
).join("")}

</div>
`;
}

/* ======================
START GAME
====================== */

function startGame(){

if(!isHost) return alert("Only host can start");

rooms[currentRoom].started = true;

loadQuestion();
startTimer();
}

/* ======================
LOAD QUESTION
====================== */

function loadQuestion(){

let room = rooms[currentRoom];
let q = questions[room.index];

document.getElementById("main").innerHTML = `
<div class="card">

<h2>⏱ Question ${room.index+1}</h2>
<h3>${q.q}</h3>

${q.options.map(o=>
`<div class="option" onclick="answer(${o})">${o}</div>`
).join("")}

</div>
`;

updateBoard();
}

/* ======================
ANSWER
====================== */

function answer(val){

let room = rooms[currentRoom];
let q = questions[room.index];

if(val == q.answer){
room.players[me].score++;
}

nextQ();
}

/* ======================
NEXT QUESTION
====================== */

function nextQ(){

let room = rooms[currentRoom];

room.index++;

if(room.index >= questions.length){

endGame();
return;
}

loadQuestion();
startTimer();
}

/* ======================
TIMER
====================== */

function startTimer(){

let room = rooms[currentRoom];

clearInterval(timer);

room.time = 15;

timer = setInterval(()=>{

room.time--;

if(room.time <= 0){
clearInterval(timer);
nextQ();
}

},1000);
}

/* ======================
LEADERBOARD
====================== */

function updateBoard(){

let room = rooms[currentRoom];

let board = Object.entries(room.players)
.map(([n,v])=>({name:n,score:v.score}))
.sort((a,b)=>b.score-a.score);

let html = `
<div class="card">
<h3>🏆 LIVE LEADERBOARD</h3>
${board.map(b=>
`<div class="card">👤 ${b.name} — ⭐ ${b.score}</div>`
).join("")}
</div>
`;

document.getElementById("main").innerHTML += html;
}

/* ======================
END GAME
====================== */

function endGame(){

let room = rooms[currentRoom];

let result = Object.entries(room.players)
.map(([n,v])=>({name:n,score:v.score}))
.sort((a,b)=>b.score-a.score);

document.getElementById("main").innerHTML = `
<div class="card">
<h1>🏁 GAME OVER</h1>
<h2>🏆 Winner: ${result[0].name}</h2>

${result.map(r=>
`<div class="card">👤 ${r.name} — ⭐ ${r.score}</div>`
).join("")}

</div>
`;
}

</script>

</body>
</html>
