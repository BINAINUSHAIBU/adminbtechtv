<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV IPTV SAAS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- PAYSTACK -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff}

/* AUTH */
#auth{
position:fixed;inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#0b1220;
z-index:9999;
}

input{
padding:10px;
margin:5px;
width:220px;
border-radius:6px;
border:none;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1f2937;
color:#fff;
}

/* APP */
#app{display:none;height:100vh;flex-direction:column}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#111827;
}

.container{display:flex;flex:1}

.sidebar{
width:250px;
background:#0b1220;
padding:10px;
overflow:auto;
}

.channel{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

.main{flex:1;display:flex;flex-direction:column}

video{
width:100%;
height:360px;
background:black;
}

/* PAYWALL */
#paywall{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.9);
z-index:9998;
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth">
<h2>📺 BTECH-TV SAAS LOGIN</h2>

<input id="email" placeholder="Email"/>
<input id="password" type="password" placeholder="Password"/>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- ================= PAYWALL ================= -->
<div id="paywall">
<h2>⚠ Premium Required</h2>
<p>Upgrade to continue watching IPTV</p>
<button onclick="payWithPaystack()">Upgrade ₦2000</button>
</div>

<!-- ================= APP ================= -->
<div id="app">

<div class="topbar">
<div>📺 BTECH-TV SAAS IPTV</div>
<button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="sidebar">
<div class="channel" onclick="playStream()">News Live</div>
<div class="channel" onclick="playStream()">Sports HD</div>
<div class="channel" onclick="playStream()">Movies Zone</div>
</div>

<div class="main">
<video id="video" controls></video>
</div>

</div>
</div>

<script>

/* ================= FIREBASE CONFIG ================= */
firebase.initializeApp({
apiKey:"109094502077750831602",
authDomain:"YOUR_PROJECT.firebaseapp.com"
});

const auth = firebase.auth();

let currentUserEmail = "";
let hasAccess = false;

/* ================= AUTH ================= */
function register(){
auth.createUserWithEmailAndPassword(email.value,password.value)
.then(u=>{
alert("Registered");
});
}

function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.then(u=>{
currentUserEmail = u.user.email;
checkAccess();
});
}

function logout(){
auth.signOut();
location.reload();
}

/* ================= ACCESS CHECK (BACKEND READY) ================= */
async function checkAccess(){

// SIMULATED BACKEND CHECK (replace with Node.js API)
let trialStart = localStorage.getItem("trial_"+currentUserEmail);

if(!trialStart){
localStorage.setItem("trial_"+currentUserEmail,Date.now());
trialStart = Date.now();
}

let limit = 4 * 60 * 60 * 1000;
let diff = Date.now() - parseInt(trialStart);

// DEMO LOGIC
if(diff < limit){
hasAccess = true;
}else{
hasAccess = false;
}

if(hasAccess){
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="flex";
}else{
document.getElementById("paywall").style.display="flex";
}
}

/* ================= PAYSTACK ================= */
function payWithPaystack(){

let handler = PaystackPop.setup({
key:"YOUR_PAYSTACK_PUBLIC_KEY",
email:currentUserEmail,
amount:2000*100,
currency:"NGN",

callback:function(){
alert("Payment successful");

// unlock premium
localStorage.setItem("paid_"+currentUserEmail,"true");

document.getElementById("paywall").style.display="none";
document.getElementById("app").style.display="flex";
},

onClose:function(){
alert("Payment cancelled");
}
});

handler.openIframe();
}

/* ================= IPTV PLAYER ================= */
function playStream(){

if(!currentUserEmail){
alert("Login required");
return;
}

// CHECK ACCESS
let paid = localStorage.getItem("paid_"+currentUserEmail);

if(!paid && !hasAccess){
document.getElementById("paywall").style.display="flex";
return;
}

const video = document.getElementById("video");

let url = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src = url;
video.play();
}
}

/* ================= AUTO AUTH ================= */
auth.onAuthStateChanged(user=>{
if(user){
currentUserEmail = user.email;
checkAccess();
}
});

</script>

</body>
</html>
