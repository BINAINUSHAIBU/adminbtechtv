
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV LOCKED CHANNEL SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--danger:#ef4444;
--success:#22c55e;
--warn:#f59e0b;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer}

/* =========================
TOPBAR
========================= */

.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 60px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:300px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.85);
flex-direction:column;
}

/* NOW BAR */

.now{
padding:10px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
}

/* CHANNEL LIST */

.channels{
flex:1;
overflow-y:auto;
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:var(--hover);
}

.channel.active{
border:2px solid var(--accent);
}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
}

.locked{background:var(--warn); color:black;}
.unlocked{background:var(--success);}
.free{background:#16a34a;}
.paid{background:var(--danger);}

/* RIGHT PANEL */

.right{
width:300px;
background:var(--panel);
padding:15px;
overflow-y:auto;
}

/* BUTTONS */

.btn{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
background:var(--accent);
color:black;
font-weight:bold;
}

.btn.danger{background:var(--danger); color:white;}
.btn.warn{background:var(--warn);}

/* SEARCH */

input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
background:#0f1628;
color:white;
margin-top:10px;
}

</style>

</head>

<body>

<div class="topbar">
<h2>🔒 BTECH-TV LOCKED ADMIN</h2>
<button class="btn warn" onclick="showLockedOnly()">Show Locked</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="filterAll()">📺 All Channels</div>
<div class="cat" onclick="showLockedOnly()">🔒 Locked</div>
<div class="cat" onclick="unlockAll()">🔓 Unlock All</div>
<div class="cat" onclick="deleteLocked()">❌ Delete Locked</div>

<input placeholder="Search..." oninput="search(this.value)">

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
<div class="overlay" id="overlay">
<h1>🔒</h1>
<p>Locked Channel Admin Engine</p>
</div>
</div>

<div class="now">
<div>
<h3 id="name">No Channel</h3>
<small id="cat">---</small>
</div>

<div>
<button class="btn" onclick="prev()">Prev</button>
<button class="btn" onclick="next()">Next</button>
</div>
</div>

<div class="channels" id="list"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right">

<h3>⚙ ADMIN PANEL</h3>

<button class="btn" onclick="lockSelected()">🔒 Lock Selected</button>
<button class="btn warn" onclick="unlockSelected()">🔓 Unlock Selected</button>
<button class="btn danger" onclick="deleteSelected()">❌ Delete Selected</button>

<h3 style="margin-top:15px;">📊 Stats</h3>

<p>Total: <span id="total">0</span></p>
<p>Locked: <span id="locked">0</span></p>
<p>Unlocked: <span id="unlocked">0</span></p>

</div>

</div>

<script>

/* =========================
DATA
========================= */

let channels=[];
let filtered=[];
let index=0;
let selected=new Set();

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =========================
GENERATE
========================= */

function generate(){

for(let i=1;i<=200;i++){

channels.push({
id:i,
name:"BTECH CHANNEL "+i,
category:i%2===0?"Sports":"Movies",
url:streams[i%streams.length],
status:i%7===0?"locked":"unlocked",
type:i%3===0?"paid":"free"
});

}

filtered=[...channels];
render();
stats();
document.getElementById("overlay").style.display="none";
}

generate();

/* =========================
RENDER
========================= */

function render(){

let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>

<div>
<span class="badge ${c.status}">${c.status}</span><br>
<span class="badge ${c.type}">${c.type}</span>
</div>
`;

div.onclick=()=>play(i);

box.appendChild(div);

});

}

/* =========================
PLAY
========================= */

function play(i){

index=i;

let c=filtered[i];

document.getElementById("name").innerText=c.name;
document.getElementById("cat").innerText=c.category;

let video=document.getElementById("video");

if(Hls.isSupported()){

let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);

}else{
video.src=c.url;
}

}

/* =========================
FILTER
========================= */

function filterAll(){
filtered=[...channels];
render();
}

function showLockedOnly(){
filtered=channels.filter(c=>c.status==="locked");
render();
}

/* =========================
SEARCH
========================= */

function search(v){

filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
);

render();

}

/* =========================
ADMIN ACTIONS
========================= */

function lockSelected(){
channels.forEach(c=>c.status="locked");
filterAll(); stats();
}

function unlockSelected(){
channels.forEach(c=>c.status="unlocked");
filterAll(); stats();
}

function deleteSelected(){
channels=channels.filter(c=>c.status!=="locked");
filterAll(); stats();
}

function unlockAll(){
channels.forEach(c=>c.status="unlocked");
filterAll(); stats();
}

function deleteLocked(){
channels=channels.filter(c=>c.status!=="unlocked");
filterAll(); stats();
}

/* =========================
NEXT/PREV
========================= */

function next(){
if(index<filtered.length-1) play(index+1);
}

function prev(){
if(index>0) play(index-1);
}

/* =========================
STATS
========================= */

function stats(){

document.getElementById("total").innerText=channels.length;
document.getElementById("locked").innerText=channels.filter(c=>c.status==="locked").length;
document.getElementById("unlocked").innerText=channels.filter(c=>c.status==="unlocked").length;

}

</script>

</body>
</html>
