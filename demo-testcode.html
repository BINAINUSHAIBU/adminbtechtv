<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
height:100vh;
overflow:hidden;
display:flex;
}

.sidebar{
width:250px;
background:#0d1324;
padding:15px;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00d4ff;
margin-bottom:20px;
}

.main{
flex:1;
padding:10px;
display:flex;
flex-direction:column;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.live{
background:red;
padding:8px 12px;
border-radius:20px;
}

.hero{
background:#101d39;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

.player-container{
background:#000;
height:350px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

.controls{
margin-top:10px;
display:flex;
gap:10px;
}

.controls button{
padding:10px;
background:#152445;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.controls button:hover{
background:#00d4ff;
color:black;
}

.channels{
margin-top:10px;
padding:10px;
background:#101d39;
border-radius:10px;
height:150px;
overflow:auto;
}

#timer{
color:#00d4ff;
font-weight:bold;
}

.expired-box{
width:100%;
max-width:600px;
padding:25px;
background:#111a31;
border:1px solid #00d4ff;
border-radius:12px;
}

.expired-box h2{
margin-bottom:10px;
}

.expired-box h3{
color:#ff5555;
margin-bottom:15px;
}

.expired-box p{
margin-bottom:10px;
}

.expired-box input,
.expired-box select{
width:100%;
padding:10px;
margin:8px 0;
background:#0d1324;
color:white;
border:none;
border-radius:6px;
}

</style>
</head>

<body>

<div class="sidebar" id="sidebar">

<div class="logo">
📺 BTECH-TV PRO MAX
</div>

<p>Dashboard Tools</p>

</div>

<div class="main">

<div class="topbar">

<div id="timer">
⏱ 2m 00s
</div>

<div class="live">
🔴 BTECH-TV LIVE
</div>

</div>

<div class="hero" id="hero">

<h2>
BTECH-TV World PRO MAX SYSTEM
</h2>

<p>
Full dashboard active during trial period.
</p>

</div>

<div class="player-container" id="player">

<video id="video" controls muted autoplay></video>

</div>

<div class="controls" id="controls">

<button>Next</button>
<button>Previous</button>
<button>Mute</button>
<button>Fullscreen</button>

</div>

<div class="channels" id="channels">

Channel list appears here...

</div>

</div>

<script>

let t=120;

let timer=setInterval(()=>{

let mins=Math.floor(t/60);
let secs=t%60;

document.getElementById("timer").innerHTML=
"⏱ "+mins+"m "+secs+"s";

t--;

if(t<0){

clearInterval(timer);

trialExpired();

}

},1000);


function trialExpired(){

let video=document.getElementById("video");

video.pause();

document.getElementById("sidebar").style.display="none";
document.getElementById("controls").style.display="none";
document.getElementById("channels").style.display="none";
document.getElementById("hero").style.display="none";

document.getElementById("player").innerHTML=`

<div class="expired-box">

<h2>
BTECH-TV Trial Version
</h2>

<h3>
Trial Expired
</h3>

<p>
Watch free for 2 minutes.
</p>

<p>
Your trial version has expired.
</p>

<select>
<option>
Demo Payment
</option>
</select>

<select>
<option>
Premium
</option>
</select>

<input placeholder="Full Name">

<input placeholder="Email Address">

<input placeholder="Phone Number">

<input placeholder="Other Information">

</div>

`;

}

</script>

</body>
</html>
