<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV PRO MAX IPTV 2026 + PAYMENTS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- PAYSTACK -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<!-- FLUTTERWAVE -->
<script src="https://checkout.flutterwave.com/v3.js"></script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

#authBox{position:fixed;inset:0;background:#050816;display:flex;justify-content:center;align-items:center;z-index:99999;}
.auth-card{background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;border:1px solid #1d2b4f;}
.auth-card input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#101a31;color:#fff;}
.auth-card button{width:100%;padding:10px;margin-top:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:99999;}
.modal-box{background:#0d1324;padding:20px;border-radius:12px;width:340px;text-align:center;}
.paybtn{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}
.ps{background:#00c3ff}
.fw{background:#ff7b00}
.pp{background:#0070ba}
.interswitch{background:#2ecc71}

.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;}
.nav-btn{width:100%;padding:9px;margin:4px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}

.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;}
video{width:100%;height:100%;}
.channels{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d;}

#timerBar{position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;padding:8px 12px;border-radius:8px;font-weight:bold;z-index:9999;}
</style>
</head>

<body>

<div id="timerBar">Trial Active</div>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="paymentModal">
<div class="modal-box">
<h3>💳 Choose Payment Method</h3>

<button class="paybtn ps" onclick="paystackPay()">Paystack</button>
<button class="paybtn fw" onclick="flutterPay()">Flutterwave</button>

<div id="paypal-button-container" style="margin-top:10px;"></div>

<button class="paybtn interswitch" onclick="interswitchPay()">Interswitch WebPAY</button>

</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📺 IPTV PRO MAX</h3>
<button class="nav-btn" onclick="loadUltra()">🌍 Load Channels</button>
<button class="nav-btn" onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* LOGIN */
function login(){
localStorage.setItem("logged",true);
authBox.style.display="none";
loadUltra();
}

/* PAYMENT GATE */
function openPayment(){
paymentModal.style.display="flex";
renderPaypal();
}

/* PAYSTACK */
function paystackPay(){
let handler = PaystackPop.setup({
key: "YOUR_PAYSTACK_PUBLIC_KEY",
email: "user@email.com",
amount: 5000 * 100,
currency: "NGN",
callback: function(response){
alert("Paystack Success: " + response.reference);
activatePremium();
}
});
handler.openIframe();
}

/* FLUTTERWAVE */
function flutterPay(){
FlutterwaveCheckout({
public_key: "YOUR_FLUTTERWAVE_PUBLIC_KEY",
tx_ref: Date.now(),
amount: 5000,
currency: "NGN",
payment_options: "card,banktransfer,ussd",
callback: function (data) {
alert("Flutterwave Success");
activatePremium();
}
});
}

/* PAYPAL */
function renderPaypal(){
paypal.Buttons({
createOrder: (data, actions) => {
return actions.order.create({
purchase_units: [{
amount: { value: "10.00" }
}]
});
},
onApprove: (data, actions) => {
return actions.order.capture().then(function(details){
alert("PayPal Success " + details.payer.name.given_name);
activatePremium();
});
}
}).render('#paypal-button-container');
}

/* INTERSWITCH WEBPAY (redirect style) */
function interswitchPay(){
alert("Redirecting to Interswitch WebPAY...");
window.location.href =
"https://webpay.interswitchng.com/collections/payment?amount=5000";
}

/* PREMIUM */
function activatePremium(){
localStorage.setItem("premium",true);
paymentModal.style.display="none";
}

/* IPTV */
async function loadUltra(){
let res = await fetch("https://iptv-org.github.io/iptv/index.country.m3u");
let txt = await res.text();

all=[];
txt.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=a[i+1];
if(url?.startsWith("http"))all.push({name,url});
}
});

filtered=[...all];
render();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=c.name;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
