<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV PRO MAX LOCKED ADMIN v2</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:black;
z-index:9999;
}

.login-box{
width:320px;
background:var(--panel);
padding:20px;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* TOPBAR */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px);}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column;}

.player{height:260px;background:black;}
video{width:100%;height:100%;object-fit:contain;}

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
}

.free{background:var(--free);}
.paid{background:var(--paid);}
.locked{background:var(--locked);color:#000;}

.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}

.danger{background:#dc2626;}
.warn{background:#f59e0b;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h3>🔐 BTECH LOGIN</h3>

<input id="pass" type="password" placeholder="Enter password">
<select id="role">
<option value="admin">Admin</option>
<option value="viewer">Viewer</option>
</select>

<button onclick="login()">LOGIN</button>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h3>🚀 PRO MAX LOCKED ADMIN v2</h3>
<div id="mode">LOCKED</div>
</div>

<div class="container">

<div class="sidebar">
<h3>CONTROL</h3>

<button onclick="filterAll()">All</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterFree()">Free</button>
<button onclick="filterPaid()">Paid</button>
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="channels" id="list"></div>

</div>

<div class="right">

<h3>ADMIN PANEL</h3>

<button onclick="lockAll()">🔒 Lock ALL</button>
<button onclick="unlockAll()">🔓 Unlock ALL</button>
<button class="warn" onclick="lockSelected()">Lock Selected</button>
<button class="warn" onclick="unlockSelected()">Unlock Selected</button>
<button class="danger" onclick="deleteLocked()">Delete Locked</button>

<h3>STATS</h3>
<div class="stat">Total: <span id="t"></span></div>
<div class="stat">Free: <span id="f"></span></div>
<div class="stat">Paid: <span id="p"></span></div>
<div class="stat">Locked: <span id="l"></span></div>

</div>

</div>

<script>

/* ======================
LOGIN SYSTEM (UPGRADED)
====================== */

let role = "viewer";

function login(){

const pass = document.getElementById("pass").value;
role = document.getElementById("role").value;

if(pass === "admin123"){

localStorage.setItem("btech_role", role);

document.getElementById("login").style.display="none";
document.getElementById("mode").innerText=role.toUpperCase();

load();

}else{
alert("Wrong Password");
}

}

/* AUTO LOGIN */
window.onload = function(){
const saved = localStorage.getItem("btech_role");

if(saved){
role = saved;
document.getElementById("login").style.display="none";
document.getElementById("mode").innerText=role.toUpperCase();
load();
}
}

/* ======================
STATE
====================== */

let channels=[];
let filtered=[];
let selected=new Set();

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* ======================
GENERATE
====================== */

function generate(){
for(let i=0;i<500;i++){
channels.push({
id:i,
name:"BTECH CHANNEL "+i,
url:streams[i%streams.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"free"
});
}
}

/* ======================
RENDER
====================== */

function render(){

filtered=[...channels];

let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
<br>
<input type="checkbox" onchange="toggle(${c.id})">
`;

div.onclick=()=>play(i);
box.appendChild(div);
});

stats();
}

/* ======================
LOCK CHECK (SECURITY)
====================== */

function requireAdmin(){
if(role !== "admin"){
alert("Viewer mode: no permission");
return false;
}
return true;
}

/* ======================
SELECT
====================== */

function toggle(id){
selected.has(id)?selected.delete(id):selected.add(id);
}

/* ======================
PLAY
====================== */

function play(i){
let c=filtered[i];
let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else{
v.src=c.url;
}
}

/* ======================
FILTERS
====================== */

function filterAll(){render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterFree(){filtered=channels.filter(c=>c.type==="free");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* ======================
ADMIN ACTIONS
====================== */

function lockAll(){
if(!requireAdmin())return;
channels.forEach(c=>c.status="locked");
render();
}

function unlockAll(){
if(!requireAdmin())return;
channels.forEach(c=>c.status="free");
render();
}

function lockSelected(){
if(!requireAdmin())return;
channels.forEach(c=>{
if(selected.has(c.id)) c.status="locked";
});
render();
}

function unlockSelected(){
if(!requireAdmin())return;
channels.forEach(c=>{
if(selected.has(c.id)) c.status="free";
});
render();
}

function deleteLocked(){
if(!requireAdmin())return;
channels = channels.filter(c=>c.status!=="locked");
render();
}

/* ======================
STATS
====================== */

function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
}

/* ======================
BOOT
====================== */

function load(){
generate();
render();
}

</script>

</body>
</html>
