<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden;
}

/* --------------------------
TRIAL PAGE
--------------------------- */

#trialPage{
display:block;
}

header{
background:#0d1324;
padding:15px;
text-align:center;
color:#00d4ff;
}

#trialPlayer{
width:100%;
height:50vh;
background:#000;
}

.center{
padding:20px;
text-align:center;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
background:#00d4ff;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00ffee;
}

.overlay{
position:fixed;
left:0;
top:0;
right:0;
bottom:0;
background:rgba(0,0,0,.92);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.box{
width:350px;
background:#10192d;
padding:20px;
border-radius:10px;
}

.box input,
.box select{
width:100%;
padding:10px;
margin:6px 0;
}

/* --------------------------
IPTV PAGE
--------------------------- */

#iptvPage{
display:none;
width:100%;
height:100vh;
}

.sidebar{
width:270px;
height:100%;
float:left;
background:#10192d;
overflow:auto;
padding:15px;
}

.main{
margin-left:270px;
height:100%;
display:flex;
flex-direction:column;
}

.player{
height:340px;
background:#000;
}

.player video{
width:100%;
height:100%;
}

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#152445;
padding:10px;
border-radius:8px;
cursor:pointer;
}

.card:hover{
border:1px solid #00d4ff;
}

</style>

</head>

<body>

<!-- ======================
TRIAL
====================== -->

<div id="trialPage">

<header>

<h1>📺 BTECH-TV WORLD PRO MAX</h1>

Free Trial
<span id="timer">02:00</span>

</header>

<video id="trialPlayer" controls autoplay></video>

<div class="center">

<button onclick="playDemo()">

Play Demo Channel

</button>

</div>

</div>

<!-- ======================
SUBSCRIPTION
====================== -->

<div class="overlay" id="overlay">

<div class="box">

<h2>Trial Expired</h2>

<p>Subscribe to unlock all channels.</p>

<select>

<option>Starter ₦2,000</option>
<option>Premium ₦5,000</option>
<option>VIP ₦10,000</option>
<option>Lifetime ₦50,000</option>

</select>

<input placeholder="Full Name">
<input placeholder="Email">
<input placeholder="Phone">

<button onclick="subscribe()">

Proceed

</button>

<div id="status"></div>

</div>

</div>

<!-- ======================
FULL IPTV
====================== -->

<div id="iptvPage">

<div class="sidebar">

<h2>BTECH-TV</h2>

<button onclick="loadUltra()">

🌍 World Channels

</button>

<button onclick="load('ng')">

🇳🇬 Nigeria

</button>

<button onclick="load('us')">

🇺🇸 USA

</button>

<button onclick="loadCat('sports')">

⚽ Sports

</button>

<button onclick="loadCat('movies')">

🎬 Movies

</button>

</div>

<div class="main">

<div class="player">

<video id="video" controls autoplay></video>

</div>

<div class="channels" id="grid">

</div>

</div>

</div>

<script>

const demo=document.getElementById("trialPlayer");

function playDemo(){

const url="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(Hls.isSupported()){

let hls=new Hls();

hls.loadSource(url);

hls.attachMedia(demo);

}else{

demo.src=url;

}

}

playDemo();

let sec=120;

const interval=setInterval(()=>{

sec--;

timer.innerHTML=

String(Math.floor(sec/60)).padStart(2,"0")

+":"

+

String(sec%60).padStart(2,"0");

if(sec<=0){

clearInterval(interval);

demo.pause();

overlay.style.display="flex";

}

},1000);

function subscribe(){

localStorage.setItem("btechSubscribed","yes");

overlay.style.display="none";

trialPage.style.display="none";

iptvPage.style.display="block";

loadUltra();

}

if(localStorage.getItem("btechSubscribed")){

trialPage.style.display="none";

iptvPage.style.display="block";

}

let all=[];

let filtered=[];

let hls;

const video=document.getElementById("video");

async function load(code){

loadM3U(

`https://iptv-org.github.io/iptv/countries/${code}.m3u`

);

}

async function loadCat(cat){

loadM3U(

`https://iptv-org.github.io/iptv/categories/${cat}.m3u`

);

}

async function loadUltra(){

loadM3U(

"https://iptv-org.github.io/iptv/index.country.m3u"

);

}

async function loadM3U(url){

const res=await fetch(url);

const txt=await res.text();

all=[];

let lines=txt.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith("#EXTINF")){

all.push({

name:lines[i].split(",").pop(),

url:lines[i+1]

});

}

}

filtered=[...all];

render();

}

function render(){

grid.innerHTML="";

filtered.forEach((c,i)=>{

const d=document.createElement("div");

d.className="card";

d.innerHTML=

"<b>CH "+String(i+1).padStart(3,"0")+"</b><br>"+c.name;

d.onclick=()=>play(i);

grid.appendChild(d);

});

}

function play(i){

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(filtered[i].url);

hls.attachMedia(video);

}else{

video.src=filtered[i].url;

}

}

</script>

</body>
</html>
