<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV Offline</title>
<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;display:flex;height:100vh}
#side{width:260px;background:#0d1324;padding:12px;overflow:auto}
button{display:block;width:100%;margin:6px 0;padding:10px;background:#152445;color:#fff;border:0;border-radius:6px;cursor:pointer}
#main{flex:1;padding:10px;display:flex;flex-direction:column}
video{width:100%;height:60vh;background:#000}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;overflow:auto}
.card{background:#111a31;padding:8px;border-radius:8px;cursor:pointer}
input{width:100%;padding:8px}
</style></head><body>
<div id="side">
<h2>BTECH-TV Offline</h2>
<input id="q" placeholder="Search..." oninput="search()">
<button onclick="pick()">📂 Import Local Videos</button>
<input id="picker" type="file" multiple accept="video/*" style="display:none">
</div>
<div id="main">
<video id="v" controls autoplay></video>
<div id="grid"></div>
</div>
<script>
let files=[],filtered=[],i=0,v=document.getElementById('v');
picker.onchange=e=>{
files=[...e.target.files].map(f=>({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
filtered=[...files];render();if(filtered.length)play(0);}
function pick(){picker.click()}
function render(){grid.innerHTML='';filtered.forEach((c,n)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>CH '+String(n+1).padStart(3,'0')+'</b><br>'+c.name;d.onclick=()=>play(n);grid.appendChild(d);});}
function play(n){i=n;v.src=filtered[n].url;v.play();}
function search(){let q=document.getElementById('q').value.toLowerCase();filtered=files.filter(f=>f.name.toLowerCase().includes(q));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&filtered.length)play((i+1)%filtered.length);if(e.key==='ArrowLeft'&&filtered.length)play((i-1+filtered.length)%filtered.length);});
</script></body></html>
