<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLDTV LIVE PLATFORM - SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden;
}

.header{
height:70px;
background:#0d1226;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:24px;
font-weight:700;
color:#00e5ff;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

.sidebar{
width:280px;
background:#0b1020;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.08);
padding:15px;
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.live-monitor{
position:sticky;
top:0;
z-index:9999;
background:#111827;
padding:10px 20px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
gap:10px;
}

.live-dot{
width:12px;
height:12px;
background:red;
border-radius:50%;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{opacity:.3;}
}

.player-section{
padding:15px;
background:#000;
}

video{
width:100%;
height:500px;
background:#000;
border-radius:10px;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

.channel-grid{
flex:1;
overflow:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.channel-card{
background:#111827;
padding:15px;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.channel-card:hover{
transform:translateY(-4px);
}

.admin-panel{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.admin-btn{
padding:12px;
background:#00e5ff;
color:#000;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.stat-card{
background:#111827;
padding:15px;
border-radius:10px;
text-align:center;
}
</style>

</head>
<body>

<div class="header">
<div class="logo">WORLDTV LIVE PLATFORM</div>
<div>SUPER ADMIN DASHBOARD</div>
</div>

<div class="container">

<div class="sidebar">

<h3>ADMIN TOOLS</h3>

<div class="admin-panel">
<button class="admin-btn">Add Channel</button>
<button class="admin-btn">Delete Channel</button>
<button class="admin-btn">Edit Channel</button>
<button class="admin-btn">Create User</button>
<button class="admin-btn">Manage Users</button>
<button class="admin-btn">Lock Channel</button>
<button class="admin-btn">Premium Access</button>
<button class="admin-btn">Backup</button>
<button class="admin-btn">Restore</button>
<button class="admin-btn">Settings</button>
</div>

</div>

<div class="main">

<div class="live-monitor">
<div class="live-dot"></div>
<div>LIVE STREAMING MONITOR ACTIVE</div>
</div>

<div class="stats">
<div class="stat-card">
<h2 id="totalChannels">0</h2>
<p>Channels</p>
</div>

<div class="stat-card">
<h2 id="activeStreams">0</h2>
<p>Active Streams</p>
</div>

<div class="stat-card">
<h2 id="totalUsers">0</h2>
<p>Users</p>
</div>

<div class="stat-card">
<h2 id="favorites">0</h2>
<p>Favorites</p>
</div>
</div>

<div class="player-section">
<video id="video" controls autoplay></video>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search channels...">
</div>

<div class="channel-grid" id="channelGrid"></div>

</div>

</div>

<script>
const m3uPlaylist = `#EXTM3U

# Paste the COMPLETE tvnewdoc.docx playlist here

#EXTINF:-1,ESPN 2
https://example.com/espn2.m3u8

#EXTINF:-1,NBA TV
https://example.com/nbatv.m3u8

#EXTINF:-1,FOX SPORTS
https://example.com/foxsports.m3u8

#EXTINF:-1,DISCOVERY WORLD
https://example.com/discovery.m3u8
`;

const channels=[];

function parseM3U(){
const lines=m3uPlaylist.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const name=lines[i].split(',').pop();

const url=lines[i+1];

channels.push({
name,
url
});
}
}

document.getElementById('totalChannels').innerText=
channels.length;

renderChannels(channels);
}

function renderChannels(data){

const grid=
document.getElementById('channelGrid');

grid.innerHTML='';

data.forEach(channel=>{

const card=document.createElement('div');

card.className='channel-card';

card.innerHTML=
`<h4>${channel.name}</h4>`;

card.onclick=()=>playChannel(channel.url);

grid.appendChild(card);

});
}

function playChannel(url){

const video=
document.getElementById('video');

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}
}

document
.getElementById('searchInput')
.addEventListener('input',e=>{

const value=
e.target.value.toLowerCase();

const filtered=
channels.filter(c=>
c.name.toLowerCase().includes(value)
);

renderChannels(filtered);

});

parseM3U();
</script>

</body>
</html>
