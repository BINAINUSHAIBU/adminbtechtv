<style>

/* =========================================================

html,
body{

overflow:hidden;
-webkit-text-size-adjust:100%;
scroll-behavior:smooth;
touch-action:manipulation;
}

video{
max-width:100%;
max-height:100%;
outline:none;
-webkit-user-select:none;
user-select:none;

}

/* MOBILE SAFE AREA */
body{
padding:
env(safe-area-inset-top)
env(safe-area-inset-right)
env(safe-area-inset-bottom)
env(safe-area-inset-left);
}

}

<script>

/* =========================================================
ADVANCED STREAM OPTIMIZATION
NO BUFFER + PHONE + ANDROID + DESKTOP SUPPORT
========================================================= */

/* DEVICE DETECTION */

const isMobile =
/Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i
.test(navigator.userAgent);

const isIOS =
/iPad|iPhone|iPod/.test(navigator.userAgent);

const isAndroid =
/Android/i.test(navigator.userAgent);

/* PREVENT SLEEP ON MOBILE */

let wakeLock = null;

async function enableWakeLock(){

try{

if('wakeLock' in navigator){

wakeLock = await navigator.wakeLock.request('screen');

}

}catch(err){

console.log(err);

}

}

document.addEventListener('click',enableWakeLock,{once:true});

/* NETWORK SPEED CHECK */

function getConnectionSpeed(){

if(navigator.connection){

return navigator.connection.effectiveType || '4g';

}

return '4g';

}

/* AUTO QUALITY */

function getBufferSettings(){

const speed = getConnectionSpeed();

if(speed.includes('2g')){

return {
maxBufferLength:5,
maxMaxBufferLength:10,
liveSyncDurationCount:1
};

}

if(speed.includes('3g')){

return {
maxBufferLength:10,
maxMaxBufferLength:20,
liveSyncDurationCount:2
};

}

return {
maxBufferLength:20,
maxMaxBufferLength:30,
liveSyncDurationCount:3
};

}

/* IMPROVED PLAYER */

function optimizeVideo(){

const video = document.getElementById('video');

video.setAttribute('playsinline',true);
video.setAttribute('webkit-playsinline',true);
video.setAttribute('x5-playsinline',true);
video.setAttribute('x5-video-player-type','h5');
video.setAttribute('preload','auto');

video.autoplay = true;
video.muted = false;

video.addEventListener('waiting',()=>{

document.getElementById('overlay').style.display='flex';
document.getElementById('overlayText').innerText='Buffering Stream...';

});

video.addEventListener('playing',()=>{

document.getElementById('overlay').style.display='none';

});

video.addEventListener('stalled',()=>{

video.load();
video.play();

});

video.addEventListener('error',()=>{

if(autoSkipOn){

nextChannel();

}

});

}

/* AUTO RECONNECT */

function reconnectStream(channel){

setTimeout(()=>{

playChannel(currentIndex);

},2000);

}

/* OVERRIDE EXISTING PLAYER */

const oldPlayChannel = playChannel;

playChannel = function(index){

currentIndex=index;

const channel=filteredChannels[index];

document.getElementById('channelName').innerText=channel.name;
document.getElementById('channelGroup').innerText=channel.group;

const video=document.getElementById('video');

if(currentHls){

currentHls.destroy();

}

const hlsConfig = {

enableWorker:true,
lowLatencyMode:true,
backBufferLength:90,

maxBufferHole:1,
highBufferWatchdogPeriod:2,

liveDurationInfinity:true,

fragLoadingTimeOut:20000,
manifestLoadingTimeOut:15000,

levelLoadingTimeOut:15000,

startLevel:-1,

capLevelToPlayerSize:true,

...getBufferSettings()

};

if(Hls.isSupported()){

currentHls = new Hls(hlsConfig);

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play()
.catch(()=>{

video.muted=true;
video.play();

});

aliveCh[channel.id]=1;

delete deadCh[channel.id];

renderChannels();

document.getElementById('overlay').style.display='none';

});

currentHls.on(Hls.Events.ERROR,function(event,data){

if(data.fatal){

deadCh[channel.id]=1;

renderChannels();

reconnectStream(channel);

if(autoSkipOn){

setTimeout(()=>{

nextChannel();

},3000);

}

}

});

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

video.src = channel.url;

video.play();

}else{

video.src = channel.url;

video.play();

}

addRecent(channel.id);

renderChannels();

};

/* AUTO RESIZE */

window.addEventListener('resize',()=>{

const player = document.querySelector('.player');

if(window.innerWidth < 900){

player.style.height='230px';

}else{

player.style.height='340px';

}

});

/* MOBILE GESTURES */

let touchStartX = 0;

document.addEventListener('touchstart',(e)=>{

touchStartX = e.changedTouches[0].screenX;

});

document.addEventListener('touchend',(e)=>{

const touchEndX = e.changedTouches[0].screenX;

if(touchEndX < touchStartX - 80){

nextChannel();

}

if(touchEndX > touchStartX + 80){

prevChannel();

}

});

/* FULLSCREEN AUTO ROTATE */

document.getElementById('video').addEventListener('fullscreenchange',()=>{

if(screen.orientation && screen.orientation.lock){

screen.orientation.lock('landscape')
.catch(()=>{});

}

});

/* START OPTIMIZATION */

optimizeVideo();

console.log(
'✅ BTECH-TV WORLD FULL DEVICE COMPATIBILITY ACTIVATED'
);

</script>
