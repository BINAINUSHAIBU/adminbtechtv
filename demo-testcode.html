<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:300px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:15px;
}

.menu-title{
color:#00d4ff;
margin:15px 0 10px;
font-size:12px;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

.nav-btn:hover{
background:#1e2f57;
}

/* ================= MAIN ================= */
.main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
overflow:hidden;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
width:260px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:8px;
}

.stat{
background:#101d39;
padding:8px;
border-radius:8px;
text-align:center;
}

/* WORLD CUP BANNER */
.worldcup{
background:linear-gradient(90deg,#009739,#FEDD00,#002776);
padding:10px;
border-radius:10px;
margin-bottom:10px;
text-align:center;
font-weight:bold;
}

/* PLAYER */
.player{
background:#000;
height:320px;
border-radius:10px;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

/* CONTROLS */
.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:10px 0;
}

.controls button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#152445;
color:#fff;
cursor:pointer;
}

.controls button:hover{
background:#00d4ff;
color:#000;
}

/* CHANNEL GRID */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{
transform:scale(1.03);
border-color:#00d4ff;
}

/* ADMIN */
.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
}

.admin-box{
background:#111827;
padding:20px;
border-radius:10px;
width:90%;
}

.admin-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.admin-grid button{
padding:12px;
border:none;
border-radius:8px;
background:#172033;
color:#fff;
}

/* FOOTER */
.footer{
position:fixed;
bottom:10px;
right:10px;
background:rgba(0,0,0,.7);
border:1px solid #00d4ff;
padding:6px 12px;
border-radius:20px;
font-size:12px;
color:#00d4ff;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">News</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">Movies</button>

<div class="menu-title">🏆 WORLD CUP 2026</div>
<button class="nav-btn" onclick="loadWorldCup()">World Cup Hub</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn" onclick="scan()">Scan</button>
<button class="nav-btn" onclick="boost()">Boost</button>
<button class="nav-btn" onclick="repair()">Repair</button>
<button class="nav-btn" onclick="optimize()">Optimize</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>
<div class="live">LIVE</div>
</div>

<div class="worldcup">
🏆 FIFA WORLD CUP 2026 LIVE CENTER • SPORTS • MATCHES • NEWS • HIGHLIGHTS
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">Total <div id="total">0</div></div>
<div class="stat">Live <div id="live">0</div></div>
<div class="stat">Dead <div id="dead">0</div></div>
<div class="stat">Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="toggleMute()">Mute</button>
<button onclick="fs()">Fullscreen</button>
</div>

<div class="channels" id="grid"></div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<div class="admin-box">

<h3>SUPER ADMIN</h3>

<div class="admin-grid">
<button onclick="scan()">Scan</button>
<button onclick="boost()">Boost</button>
<button onclick="repair()">Repair</button>
<button onclick="optimize()">Optimize</button>
<button onclick="toggleLock()">Lock</button>
<button onclick="closeAdmin()">Close</button>
</div>

</div>
</div>

<!-- FOOTER -->
<div class="footer">
© 2026 DESIGN BY BTECH-TV WORLD BY BINAINU SHAIBU
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;
let locked=false;

/* LOAD IPTV */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((l,idx,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
stats();
}

/* WORLD CUP FILTER (ALL SPORTS CHANNELS) */
function loadWorldCup(){

filtered = all.filter(c=>{
let n=c.name.toLowerCase();
return (
n.includes("sport")||
n.includes("football")||
n.includes("soccer")||
n.includes("bein")||
n.includes("espn")||
n.includes("sky")||
n.includes("fox")||
n.includes("supersport")||
n.includes("fifa")||
n.includes("world cup")
);
});

render();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* CONTROLS */
function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}
function fs(){video.requestFullscreen();}

/* ADMIN */
function scan(){alert("Scanning...");}
function boost(){video.playbackRate=1.2;}
function repair(){alert("Repair mode");}
function optimize(){alert("Optimizing");}
function closeAdmin(){document.getElementById("admin").style.display="none";}
function toggleLock(){locked=!locked;alert(locked?"LOCKED":"UNLOCKED");}

/* STATS */
function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* INIT */
load("ng");

</script>

</body>
</html>
