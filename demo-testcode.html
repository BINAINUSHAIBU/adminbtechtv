<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;
}
.auth-card{background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;border:1px solid #1d2b4f;}
.auth-card input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#101a31;color:#fff;}
.auth-card button{width:100%;padding:10px;margin-top:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer;}

/* SIDEBAR */
.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{background:linear-gradient(135deg,#07132f,#0f1d45);padding:10px;border-radius:10px;margin-bottom:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* PLAYER */
.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;}
video{width:100%;height:100%;}

/* CHANNELS */
.channel-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d;}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

/* TIMER */
#timerBar{
position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;
padding:8px 12px;border-radius:8px;font-weight:bold;z-index:999;
}

/* MODALS */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,0.8);
display:none;justify-content:center;align-items:center;z-index:99999;
}
.modal-box{
background:#0d1324;padding:20px;border-radius:12px;width:340px;text-align:center;
border:1px solid #1d2b4f;
}
.modal-box button{
width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;cursor:pointer;
}

.upgrade-btn{background:#ffcc00;color:#000;font-weight:bold;}

.pay-btn{background:#00d4ff;color:#000;}

.close-btn{background:#333;color:#fff;}

@media(max-width:900px){body{flex-direction:column;}.sidebar{width:100%;}}

</style>
</head>

<body>

<div id="timerBar">Trial Active</div>

<!-- AUTH -->
<div id="authBox">
  <div class="auth-card">
    <h3>🔐 BTECH-TV ACCESS</h3>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- UPGRADE MODAL -->
<div class="modal" id="upgradeModal">
  <div class="modal-box">
    <h3>⛔ Trial Expired</h3>
    <p>Upgrade to continue watching</p>
    <button class="upgrade-btn" onclick="openPayment()">💳 Upgrade Now</button>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="paymentModal">
  <div class="modal-box">
    <h3>🏦 Payment Gateway (DEMO)</h3>

    <button onclick="selectPlan('Premium')">Premium</button>
    <button onclick="selectPlan('Super Premium')">Super Premium</button>
    <button onclick="selectPlan('Unlimited')">Unlimited</button>

    <hr style="margin:10px 0;opacity:0.2">

    <button class="pay-btn" onclick="payNow()">Pay & Unlock</button>
    <button class="close-btn" onclick="closePayment()">Close</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH-TV WORLD PRO MAX</div>
<div class="sub">Ultra IPTV Engine</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="loadUltra()">Global</button>

<div class="menu-title">🎬 Tools</div>
<button class="nav-btn" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search IPTV..." class="search-box">
<div class="live">LIVE</div>
</div>

<div class="hero">
<h3>System Dashboard</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ <div id="fav">0</div></div>
<div class="stat">⚫ <div id="dead">0</div></div>
<div class="stat">🌍 <div id="live">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

const TRIAL_TIME = 3600000; // 1 hour
let plan = null;

function register(){
localStorage.setItem("user",JSON.stringify({e:email.value,p:pass.value}));
alert("Registered");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u || u.e!==email.value || u.p!==pass.value) return alert("Invalid");

if(!localStorage.getItem("startTime")){
localStorage.setItem("startTime",Date.now());
}

authBox.style.display="none";
startTimer();
loadUltra();
}

function logout(){
localStorage.clear();
location.reload();
}

/* TIMER */
function startTimer(){
setInterval(()=>{
let start=localStorage.getItem("startTime");
if(!start) return;

let diff = TRIAL_TIME - (Date.now()-start);

if(localStorage.getItem("premium")==="true"){
timerBar.innerText="🔓 PREMIUM ACTIVE";
return;
}

if(diff<=0){
timerBar.innerText="⛔ Trial Expired";
document.getElementById("upgradeModal").style.display="flex";
return;
}

timerBar.innerText=`Trial: ${Math.floor(diff/60000)} min left`;
},1000);
}

/* PAYMENT */
function openPayment(){
document.getElementById("paymentModal").style.display="flex";
}

function closePayment(){
document.getElementById("paymentModal").style.display="none";
}

function selectPlan(p){
plan=p;
alert("Selected: "+p);
}

function payNow(){
if(!plan) return alert("Select plan first");

localStorage.setItem("premium","true");
document.getElementById("upgradeModal").style.display="none";
document.getElementById("paymentModal").style.display="none";

timerBar.innerText="🔓 PREMIUM UNLOCKED";
loadUltra();
}

/* IPTV CORE */
let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((l,idx,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=arr[idx+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

filtered=[...all];
render();
stats();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class='badge'>LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function stats(){
total.innerText=all.length;
live.innerText=all.length;
dead.innerText=0;
fav.innerText=0;
}

/* INIT */
loadUltra();

</script>

</body>
</html>
