<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLOBAL OTT SAAS PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* AUTH */
#auth{
position:fixed;
inset:0;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:10px;
z-index:999;
}

input,button{
padding:10px;
border:none;
border-radius:8px;
width:220px;
}

button{cursor:pointer;background:#1f2a44;color:#fff}
button:hover{background:#00d4ff;color:#000}

/* SIDEBAR */
.sidebar{
width:240px;
background:#0f172a;
padding:10px;
overflow:auto;
}

.menu{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

.menu:hover{background:#1e293b}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0b1220;
}

/* PLAYER */
.player{
height:300px;
background:black;
}

video{
width:100%;
height:100%;
}

/* GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

/* ADMIN */
.admin{
position:fixed;
right:10px;
bottom:10px;
width:220px;
background:#0f172a;
border:1px solid #00d4ff;
border-radius:10px;
padding:10px;
display:none;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<h2>GLOBAL OTT SAAS LOGIN</h2>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="loadContent()">📺 Load Content</div>
<div class="menu" onclick="toggleAdmin()">🛠 Admin</div>
<div class="menu" onclick="logout()">🚪 Logout</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>🌍 GLOBAL OTT SAAS PRO</div>
<div id="status">Offline</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<button onclick="addFake()">Add Content</button>
<button onclick="clearAll()">Clear</button>
<button onclick="exportData()">Export</button>
</div>

<script>

let token=null;
let content=[];
let video=document.getElementById("video");
let hls;

/* LOGIN (REAL API READY) */
async function login(){

const res = await fetch("http://localhost:5000/api/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:pass.value
})
});

const data=await res.json();

if(data.token){
token=data.token;
document.getElementById("auth").style.display="none";
document.getElementById("status").innerText="Online";
loadContent();
}else{
alert("Login failed");
}

}

/* LOAD CONTENT FROM BACKEND */
async function loadContent(){

const res=await fetch("http://localhost:5000/api/content");
content=await res.json();

render();

}

/* RENDER */
function render(){

let grid=document.getElementById("grid");
grid.innerHTML="";

content.forEach(c=>{

let div=document.createElement("div");
div.className="card";
div.innerHTML=`📺 ${c.title || c.name}`;

div.onclick=()=>play(c.url);

grid.appendChild(div);

});

}

/* PLAYER */
function play(url){

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
}

}

/* ADMIN */
function toggleAdmin(){
let a=document.getElementById("admin");
a.style.display=a.style.display==="block"?"none":"block";
}

function addFake(){
content.push({
title:"New Stream "+Date.now(),
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
});
render();
}

function clearAll(){
content=[];
render();
}

function exportData(){
let blob=new Blob([JSON.stringify(content)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="ott.json";
a.click();
}

/* LOGOUT */
function logout(){
location.reload();
}

</script>

</body>
</html>
