<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#0d1324;
}

.leftSide{
display:flex;
gap:10px;
align-items:center;
}

.live{
background:red;
padding:8px 15px;
border-radius:20px;
}

.trial{
background:#101d39;
padding:8px 15px;
border-radius:20px;
color:#00d4ff;
font-weight:bold;
}

.package{
background:#16a34a;
padding:8px 15px;
border-radius:20px;
display:none;
}

/* PLAYER */

.main{
padding:10px;
flex:1;
}

.player{
height:65vh;
background:black;
border-radius:10px;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
margin-top:15px;
}

.card{
background:#111a31;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.card:hover{
border:1px solid #00d4ff;
}

/* PAYMENT */

#upgradeScreen{

display:none;

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.95);

justify-content:center;
align-items:center;

z-index:999;
}

.box{

width:400px;
max-width:90%;
background:#0d1324;

padding:30px;
border-radius:15px;

}

.box h2{
color:#00d4ff;
margin-bottom:20px;
}

input,select{

width:100%;
padding:12px;

margin-bottom:10px;

border:none;
border-radius:8px;

background:#121c33;
color:white;

}

button{

width:100%;
padding:12px;

border:none;
border-radius:8px;

background:#00d4ff;
cursor:pointer;

font-weight:bold;

}

button:hover{
opacity:.9;
}

.success{

display:none;
padding:10px;
margin-top:10px;

background:green;
border-radius:8px;
text-align:center;

}

</style>
</head>

<body>

<div class="topbar">

<div class="leftSide">

<div class="live">
🔴 BTECH-TV LIVE
</div>

<div id="trialTimer" class="trial">
⏳ Trial 02:00
</div>

<div id="premiumPackage" class="package">
⭐ Super Premium Compact Plus
</div>

</div>

</div>

<div id="tvArea" class="main">

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>


<!-- PAYMENT SCREEN -->

<div id="upgradeScreen">

<div class="box">

<h2>
⭐ Upgrade To Super Premium Compact Plus
</h2>

<input
id="name"
placeholder="Full Name"
>

<input
id="email"
placeholder="Email Address"
>

<select id="payment">

<option>
Select Payment
</option>

<option>
Demo Card
</option>

<option>
Demo Transfer
</option>

<option>
Demo Wallet
</option>

</select>

<button onclick="payNow()">

Pay Demo

</button>

<div id="success" class="success">

Payment successful...
Activating package

</div>

</div>

</div>


<script>

const video=
document.getElementById("video");

const channels=[
{
name:"Nature TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},
{
name:"Sports TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},
{
name:"News TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
];

let hls;


/* CHANNELS */

function render(){

let grid=
document.getElementById("grid");

grid.innerHTML="";

channels.forEach((c,index)=>{

grid.innerHTML+=`

<div class='card'
onclick='play(${index})'>

${c.name}

</div>

`;

});

}

render();


function play(index){

if(hls){

hls.destroy();

}

if(Hls.isSupported()){

hls=
new Hls();

hls.loadSource(
channels[index].url
);

hls.attachMedia(video);

}

}


/* TRIAL */

let trialStart=
localStorage.getItem(
"trialStart"
);

if(!trialStart){

trialStart=
Date.now();

localStorage.setItem(
"trialStart",
trialStart
);

}

let trialDuration=
120000;

let endTime=
Number(trialStart)+trialDuration;

let timer=
document.getElementById(
"trialTimer"
);

function updateTimer(){

if(
localStorage.getItem(
"premium"
)
==="yes"
){

timer.style.display=
"none";

document
.getElementById(
"premiumPackage"
)
.style.display=
"block";

return;

}

let remain=
endTime-Date.now();

if(remain<=0){

document
.getElementById(
"tvArea"
)
.style.display=
"none";

document
.getElementById(
"upgradeScreen"
)
.style.display=
"flex";

timer.innerHTML=
"Expired";

return;

}

let mins=
Math.floor(
remain/60000
);

let secs=
Math.floor(
(remain%60000)/1000
);

secs=
secs<10?
"0"+secs:
secs;

timer.innerHTML=
"⏳ Trial "+mins+":"+secs;

}

setInterval(
updateTimer,
1000
);


/* PAYMENT */

function payNow(){

document
.getElementById(
"success"
)
.style.display=
"block";

setTimeout(()=>{

localStorage.setItem(
"premium",
"yes"
);

document
.getElementById(
"upgradeScreen"
)
.style.display=
"none";

document
.getElementById(
"tvArea"
)
.style.display=
"block";

document
.getElementById(
"premiumPackage"
)
.style.display=
"block";

timer.style.display=
"none";

alert(
"Super Premium Compact Plus Activated"
);

},3000);

}


</script>

</body>
</html>
