<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH SUPER ADMIN IPTV SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden}

/* AUTH */
#authBox,#adminBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;
}
.card{background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center}
input{width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px;background:#101a31;color:#fff}
button{width:100%;padding:10px;margin-top:8px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer}

/* TIMER */
#timerBar{position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;padding:8px;border-radius:8px;z-index:999}

/* SIDEBAR */
.sidebar{width:260px;background:#0d1324;overflow-y:auto;padding:10px;border-right:1px solid #1d2b4f}
.logo{font-size:18px;font-weight:900;color:#00d4ff;margin-bottom:10px}
.nav-btn{width:100%;padding:8px;margin:4px 0;background:#121c33;border:none;color:#fff;border-radius:6px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden}
.topbar{display:flex;gap:10px}
.player{height:300px;background:#000;border-radius:10px;overflow:hidden}
video{width:100%;height:100%}

/* GRID */
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.card2{background:#111a31;padding:10px;border-radius:10px;cursor:pointer}

/* ADMIN PANEL */
#adminPanel{
position:fixed;right:-420px;top:0;width:420px;height:100%;
background:#0b1224;border-left:2px solid #00d4ff;
transition:.3s;overflow:auto;padding:10px;z-index:9998
}
#adminPanel.active{right:0}
.section{background:#111a31;padding:10px;margin:10px 0;border-radius:10px}

/* BLOCK SCREENS */
.block{
position:fixed;inset:0;background:#000;display:flex;
align-items:center;justify-content:center;flex-direction:column;z-index:99999
}
</style>
</head>

<body>

<div id="timerBar">Loading...</div>

<!-- AUTH -->
<div id="authBox">
<div class="card">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
<button onclick="openAdmin()">Super Admin</button>
</div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminBox" style="display:none">
<div class="card">
<h3>ADMIN LOGIN</h3>
<input id="auser" placeholder="Admin">
<input id="apass" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
</div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">

<h3>⚙ SUPER ADMIN CONTROL</h3>

<div class="section">
<button onclick="toggleTrial()">Toggle Trial</button>
<button onclick="resetTrial()">Reset Trial</button>
<button onclick="expireNow()">Force Expire</button>
</div>

<div class="section">
<button onclick="CONFIG.ads=!CONFIG.ads;save()">Ads ON/OFF</button>
<button onclick="CONFIG.mode='block';save()">Block Mode</button>
<button onclick="CONFIG.mode='limited';save()">Limited Mode</button>
<button onclick="CONFIG.mode='upgrade';save()">Upgrade Mode</button>
</div>

<div class="section">
<button onclick="CONFIG.countries.ng=!CONFIG.countries.ng;save()">Nigeria</button>
<button onclick="CONFIG.countries.us=!CONFIG.countries.us;save()">USA</button>
</div>

<button onclick="closeAdmin()">Close</button>

</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH IPTV PRO</div>

<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="loadUltra()">Global</button>

<button class="nav-btn" onclick="toggleAdmin()">Admin Panel</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search">
</div>

<div class="player"><video id="video" controls autoplay muted></video></div>

<div class="grid" id="grid"></div>

</div>

<script>

/* CONFIG */
let CONFIG = JSON.parse(localStorage.getItem("CONFIG")) || {
trial:true,
trialTime:5*3600*1000,
mode:"free",
ads:false,
countries:{ng:true,us:true}
};

function save(){localStorage.setItem("CONFIG",JSON.stringify(CONFIG));}

/* USERS */
function register(){
localStorage.setItem("user",JSON.stringify({e:email.value,p:pass.value}));
alert("Registered");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u||u.e!==email.value||u.p!==pass.value)return alert("Invalid");

if(!localStorage.getItem("start"))localStorage.setItem("start",Date.now());

authBox.style.display="none";
startTimer();
loadUltra();
}

/* ADMIN */
function openAdmin(){adminBox.style.display="flex"}
function adminLogin(){
if(auser.value==="admin"&&apass.value==="1234"){
adminBox.style.display="none";
adminPanel.classList.add("active");
}
}
function toggleAdmin(){adminPanel.classList.add("active")}
function closeAdmin(){adminPanel.classList.remove("active")}

/* TIMER */
function startTimer(){
setInterval(()=>{
let s=localStorage.getItem("start");
if(!s)return;

let d=CONFIG.trialTime-(Date.now()-s);

if(d<=0){
document.body.innerHTML="<div class='block'><h1>⛔ EXPIRED</h1></div>";
return;
}

timerBar.innerText=`Trial: ${Math.floor(d/3600000)}h ${Math.floor(d%3600000/60000)}m`;
},1000);
}

/* IPTV */
let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function loadUltra(){loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");}
async function load(c){loadM3U(`https://iptv-org.github.io/iptv/countries/${c}.m3u`);}

async function loadM3U(url){
let r=await fetch(url);
let t=await r.text();
all=[];

t.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=a[i+1];
if(url?.startsWith("http"))all.push({name,url});
}
});

filtered=[...all];
render();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,i)=>{
let d=document.createElement("div");
d.className="card2";
d.innerText=c.name;
d.onclick=()=>play(i);
grid.appendChild(d);
});
}

function play(idx){
let c=filtered[idx];

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else video.src=c.url;
}

function search(q){
filtered=all.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
render();
}

</script>

</body>
</html>
