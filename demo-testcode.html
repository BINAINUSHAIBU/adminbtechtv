<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden; /* IMPORTANT: only channels scroll */
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:24px;
font-weight:900;
color:#00d4ff;
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:10px;
margin:6px 0;
background:#121c33;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.nav-btn:hover{
background:#1e2f57;
}

/* MAIN */
.main{
margin-left:260px;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
padding:15px;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.search-box input{
width:300px;
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
}

/* LIVE BADGE */
.live-badge{
background:red;
padding:8px 14px;
border-radius:20px;
font-weight:bold;
}

/* FIXED IPTV MONITOR */
.player-box{
background:#0f172d;
border-radius:12px;
padding:10px;
margin-bottom:10px;
}

video{
width:100%;
height:380px;
border-radius:10px;
background:black;
}

/* CHANNELS SCROLL ONLY */
.channels-scroll{
flex:1;
overflow-y:auto;
padding-right:5px;
}

/* SCROLL BAR */
.channels-scroll::-webkit-scrollbar{
width:6px;
}
.channels-scroll::-webkit-scrollbar-thumb{
background:#00d4ff;
border-radius:10px;
}

/* CHANNEL CARD */
.channel-card{
background:#111a31;
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
transition:.2s;
}

.channel-card:hover{
transform:scale(1.02);
border-color:#00d4ff;
}

/* MOBILE */
@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
height:auto;
overflow:visible;
}

video{
height:240px;
}

body{
overflow:auto;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 WORLDTV</div>

<button class="nav-btn">🏠 Dashboard</button>
<button class="nav-btn">📡 Live TV</button>
<button class="nav-btn">⚽ Sports</button>
<button class="nav-btn">🎬 Movies</button>
<button class="nav-btn">📰 News</button>
<button class="nav-btn">⭐ Favorites</button>
<button class="nav-btn">🕘 Recents</button>
<button class="nav-btn">⚙ Settings</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- TOP -->
<div class="topbar">

<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>

<div class="live-badge">🔴 LIVE</div>

</div>

<!-- FIXED PLAYER -->
<div class="player-box">
<video id="video" controls autoplay muted></video>
</div>

<!-- CHANNEL LIST -->
<div class="channels-scroll" id="grid"></div>

</div>

<script>

const video=document.getElementById("video");
const grid=document.getElementById("grid");

let currentHls;

/* STREAM PLAY */
function play(url){

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* SEARCH */
function search(q){
document.querySelectorAll(".channel-card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q.toLowerCase())
?"block":"none";
});
}

/* SAMPLE CHANNELS */
const channels=[
"BBC World","CNN","Al Jazeera","Sky News",
"France 24","DW News","Bloomberg","Euronews",
"Fox News","ABC News"
];

/* RENDER */
channels.forEach(name=>{
const div=document.createElement("div");
div.className="channel-card";
div.innerHTML=`<b>${name}</b><br><small>Live Stream</small>`;
div.onclick=()=>play("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");
grid.appendChild(div);
});

/* AUTO PLAY */
play("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");

</script>

</body>
</html>
