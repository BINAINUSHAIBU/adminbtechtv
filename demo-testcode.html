<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#050816;color:#fff;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{
position:fixed;left:0;top:0;width:260px;height:100vh;
background:#0d1324;border-right:1px solid #1d2b4f;
padding:20px;overflow-y:auto;
}

.logo{font-size:26px;font-weight:900;color:#00d4ff;}
.subtitle{font-size:12px;color:#8ea2d9;margin-bottom:20px;}

.nav-btn{
width:100%;padding:12px;margin:6px 0;
background:#121c33;color:#fff;border:none;border-radius:10px;
cursor:pointer;transition:.3s;
}
.nav-btn:hover{background:#1e2f57;transform:translateX(4px);}

.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}

/* MAIN */
.main{margin-left:260px;padding:20px;}

/* TOP */
.topbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;}

.search-box input{
width:300px;max-width:100%;
padding:12px;border-radius:10px;border:none;
background:#101a31;color:#fff;
}

.live-badge{
background:red;padding:10px 15px;border-radius:20px;
font-weight:bold;animation:pulse 1s infinite;
}

@keyframes pulse{50%{opacity:.5}}

/* PLAYER (FIXED MONITOR) */
.player-box{
position:sticky;
top:0;
z-index:999;
background:#0f172d;
padding:15px;
border-radius:15px;
margin:20px 0;
border:1px solid #203860;
}

video{
width:100%;
height:400px;
background:black;
border-radius:10px;
}

/* CHANNELS SCROLL ONLY */
.channels-scroll{
max-height:55vh;
overflow-y:auto;
padding-right:5px;
}

.channels-scroll::-webkit-scrollbar{
width:6px;
}

.channels-scroll::-webkit-scrollbar-thumb{
background:#00d4ff;
border-radius:10px;
}

/* CHANNEL CARD */
.section-title{color:#00d4ff;margin:20px 0 10px;font-size:22px;}

.channel-card{
background:#111a31;padding:15px;border-radius:15px;
cursor:pointer;transition:.3s;border:1px solid #1f355d;
margin-bottom:10px;
}
.channel-card:hover{
transform:scale(1.03);border-color:#00d4ff;
}

.badge{
background:red;padding:4px 8px;border-radius:10px;
font-size:10px;float:right;
}

/* MOBILE */
@media(max-width:900px){
.sidebar{position:relative;width:100%;height:auto;}
.main{margin-left:0;}
video{height:250px;}
.player-box{position:relative;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 WORLDTV</div>
<div class="subtitle">Live Streaming Network</div>

<div class="menu-title">Navigation</div>

<button class="nav-btn">🏠 Dashboard</button>
<button class="nav-btn">📡 Live TV</button>
<button class="nav-btn">⚽ Sports</button>
<button class="nav-btn">🎬 Movies</button>
<button class="nav-btn">📰 News</button>
<button class="nav-btn">🎵 Music</button>
<button class="nav-btn">⛪ Gospel</button>
<button class="nav-btn">🌍 International</button>

<div class="menu-title">User</div>

<button class="nav-btn">❤️ Favorites</button>
<button class="nav-btn">🕘 Watch History</button>
<button class="nav-btn">⬇ Downloads</button>
<button class="nav-btn">⚙ Settings</button>
<button class="nav-btn">🚪 Logout</button>

<div class="menu-title">Streaming</div>
<div style="color:#00ff84">Server Online</div>
<div style="color:#00ff84">CDN Active</div>
<div style="color:#00ff84">4K Enabled</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>
<div class="live-badge">🔴 LIVE</div>
</div>

<!-- PLAYER -->
<div class="player-box">
<video id="video" controls autoplay muted></video>
</div>

<!-- CHANNELS -->
<div class="section-title">Live Channels</div>
<div class="channels-scroll" id="grid"></div>

</div>

<script>

let currentHls;
const video=document.getElementById("video");
const grid=document.getElementById("grid");

const sampleStream="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

/* PLAY */
function play(url){

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* SEARCH */
function search(q){
document.querySelectorAll(".channel-card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q.toLowerCase())
?"block":"none";
});
}

/* CHANNELS */
const channels=[
"Kanali 7","A2 CNN","ABC News","Top News","BBC World",
"Al Jazeera","France 24","Sky News","CNN","DW News",
"CCTV","RT News","Euronews","Bloomberg","Fox News"
];

channels.forEach(name=>{
const div=document.createElement("div");
div.className="channel-card";
div.innerHTML=`
<div class="badge">LIVE</div>
<h4>${name}</h4>
<small>IPTV Stream</small>
`;
div.onclick=()=>play(sampleStream);
grid.appendChild(div);
});

/* AUTO START */
play(sampleStream);

</script>

</body>
</html>
