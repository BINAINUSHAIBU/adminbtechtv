<body>

<div id="timerBar">Trial Active</div>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 WORLDTV PRO MAX</h3>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>
</div>

<!-- UPGRADE -->
<div class="modal" id="upgradeModal">
<div class="modal-box">

<h3>Premium Required</h3>

<button class="upgrade-btn" onclick="openPayment()">
Upgrade Now
</button>

</div>
</div>

<!-- PAYMENT -->
<div class="modal" id="paymentModal">
<div class="modal-box">

<h3>Select Plan</h3>

<button onclick="selectPlan('Premium')">
Premium
</button>

<button onclick="selectPlan('Super Premium')">
Super Premium
</button>

<button onclick="selectPlan('Unlimited')">
Unlimited
</button>

<button class="pay-btn" onclick="payNow()">
Pay & Unlock
</button>

<button class="close-btn" onclick="closePayment()">
Close
</button>

</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">
📺 WORLDTV PRO MAX
</div>

<div class="sub">
Ultra IPTV Engine X
</div>

<!-- COUNTRIES -->
<div class="menu-title">🌍 Countries</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>
<button class="nav-btn" onclick="load('de')">🇩🇪 Germany</button>

<button class="nav-btn" onclick="loadUltra()">
🚀 Global IPTV
</button>

<!-- CATEGORIES -->
<div class="menu-title">🎬 Categories</div>

<button class="nav-btn" onclick="loadCat('news')">
📰 News
</button>

<button class="nav-btn" onclick="loadCat('sports')">
⚽ Sports
</button>

<button class="nav-btn" onclick="loadCat('movies')">
🎬 Movies
</button>

<button class="nav-btn" onclick="loadCat('music')">
🎵 Music
</button>

<button class="nav-btn" onclick="loadCat('kids')">
👶 Kids
</button>

<!-- TOOLS -->
<div class="menu-title">🔥 Tools</div>

<button class="nav-btn" onclick="scanStreams()">
📡 Scan
</button>

<button class="nav-btn" onclick="speedBoost()">
⚡ Boost
</button>

<button class="nav-btn" onclick="togglePiP()">
📺 PiP
</button>

<button class="nav-btn" onclick="recordMode()">
⏺ Record
</button>

<button class="nav-btn" onclick="repairStreams()">
🛠 Repair
</button>

<button class="nav-btn" onclick="optimizeMemory()">
🧠 Optimize
</button>

<button class="nav-btn" onclick="logout()">
🚪 Logout
</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<div class="search-box">
<input oninput="search(this.value)"
placeholder="Search IPTV Channels...">
</div>

<div class="live">🔴 LIVE</div>

</div>

<div class="hero">

<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>

<div class="stats">

<div class="stat">
📺
<div id="total">0</div>
</div>

<div class="stat">
⭐
<div id="fav">0</div>
</div>

<div class="stat">
⚫
<div id="dead">0</div>
</div>

<div class="stat">
🌍
<div id="live">0</div>
</div>

</div>

</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">

<button onclick="prev()">◀ Prev</button>

<button onclick="next()">▶ Next</button>

<button onclick="toggleMute()">🔊 Mute</button>

<button onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

<button onclick="loadUltra()">
🚀 Global
</button>

</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

</body>
