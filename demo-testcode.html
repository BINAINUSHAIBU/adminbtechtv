<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📺 BTECH TV ULTRA MAX ENTERPRISE 2026 (MERGED)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
:root{
--bg:#050816;
--panel:#0d1324;
--card:#111a31;
--accent:#00d4ff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
--unlock:#2563eb;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
display:flex;
}

/* AUTH */
#auth{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#000;
z-index:99999;
}

.auth-box{
width:340px;
background:var(--panel);
padding:20px;
border-radius:10px;
border:1px solid #1f355d;
}

.auth-box input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
}

.auth-box button{
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:var(--panel);
padding:15px;
overflow:auto;
border-right:1px solid #1f355d;
}

.logo{
font-size:20px;
font-weight:bold;
color:var(--accent);
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

.nav-btn:hover{
background:var(--accent);
color:#000;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
overflow:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.search{
padding:10px;
width:300px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:10px;
}

.stat{
background:var(--card);
padding:10px;
border-radius:10px;
text-align:center;
}

.stat h3{font-size:12px;}
.stat p{font-size:22px;color:var(--accent);}

/* PLAYER */
.player{
height:320px;
background:#000;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

video{
width:100%;
height:100%;
}

/* TABLE */
.table{
flex:1;
overflow:auto;
background:var(--card);
border-radius:10px;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #1f355d;
text-align:left;
font-size:13px;
}

th{color:var(--accent);}

.free{background:var(--free);padding:4px 8px;border-radius:20px;}
.paid{background:var(--paid);padding:4px 8px;border-radius:20px;}
.locked{background:var(--locked);padding:4px 8px;border-radius:20px;}
.unlocked{background:var(--unlock);padding:4px 8px;border-radius:20px;}

button.action{
padding:5px 8px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:4px;
}

.lock{background:var(--locked);}
.edit{background:var(--accent);}
.del{background:#ef4444;color:#fff;}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h3>🔐 BTECH ULTRA LOGIN</h3>
<input id="user" placeholder="Email / User">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">ENTER SYSTEM</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH ULTRA MAX</div>

<button class="nav-btn">Dashboard</button>
<button class="nav-btn">Live IPTV</button>
<button class="nav-btn">Enterprise 40K DB</button>
<button class="nav-btn">Favorites</button>
<button class="nav-btn">Locked</button>
<button class="nav-btn">Settings</button>

<hr style="margin:10px 0;border:0;border-top:1px solid #1f355d">

<button class="nav-btn">🇳🇬 Nigeria</button>
<button class="nav-btn">🇺🇸 USA</button>
<button class="nav-btn">🇬🇧 UK</button>
<button class="nav-btn">🇮🇳 India</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input class="search" placeholder="Search channels..." oninput="search(this.value)">
<div class="live">🔴 LIVE</div>
</div>

<div class="stats">
<div class="stat"><h3>Total</h3><p id="t">0</p></div>
<div class="stat"><h3>Free</h3><p id="f">0</p></div>
<div class="stat"><h3>Paid</h3><p id="p">0</p></div>
<div class="stat"><h3>Locked</h3><p id="l">0</p></div>
</div>

<div class="player">
<video id="video" controls></video>
</div>

<div class="table">
<table>
<thead>
<tr>
<th>Name</th>
<th>Source</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

</div>

<script>

/* =========================
AUTH
========================= */
function login(){
document.getElementById("auth").style.display="none";
}

/* =========================
DATASETS MERGED
========================= */
let channels=[];

/* REAL IPTV */
async function loadLive(){
try{
const [ch,st]=await Promise.all([
fetch("https://iptv-org.github.io/api/channels.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json())
]);

let used={};

st.forEach(s=>{
if(!s.url || used[s.url]) return;
used[s.url]=1;

channels.push({
name:s.title || "Live Channel",
url:s.url,
type:"Free",
status:"Unlocked",
source:"LIVE IPTV"
});
});

/* FAKE ENTERPRISE 40K */
for(let i=1;i<=500;i++){
channels.push({
name:`Enterprise Channel ${i}`,
url:"",
type:Math.random()>0.6?"Paid":"Free",
status:Math.random()>0.8?"Locked":"Unlocked",
source:"ENTERPRISE DB"
});
}

render();
}catch(e){console.log(e);}
}

/* =========================
RENDER
========================= */
function render(){
let html="";
channels.slice(0,120).forEach((c,i)=>{

html+=`
<tr>
<td>${c.name}</td>
<td>${c.source}</td>
<td><span class="${c.type==="Free"?"free":"paid"}">${c.type}</span></td>
<td><span class="${c.status==="Locked"?"locked":"unlocked"}">${c.status}</span></td>
<td>
<button class="action lock">Lock</button>
<button class="action edit">Edit</button>
<button class="action del">Del</button>
</td>
</tr>
`;

});

document.getElementById("body").innerHTML=html;

stats();
}

/* =========================
PLAY STREAM
========================= */
function play(url){
const v=document.getElementById("video");
if(Hls.isSupported() && url){
const h=new Hls();
h.loadSource(url);
h.attachMedia(v);
}else v.src=url;
}

/* =========================
SEARCH
========================= */
function search(v){
v=v.toLowerCase();
let filtered=channels.filter(c=>c.name.toLowerCase().includes(v));
renderFiltered(filtered);
}

function renderFiltered(list){
let html="";
list.slice(0,120).forEach(c=>{
html+=`
<tr>
<td>${c.name}</td>
<td>${c.source}</td>
<td><span class="${c.type==="Free"?"free":"paid"}">${c.type}</span></td>
<td><span class="${c.status==="Locked"?"locked":"unlocked"}">${c.status}</span></td>
<td>
<button class="action lock">Lock</button>
<button class="action edit">Edit</button>
<button class="action del">Del</button>
</td>
</tr>`;
});
document.getElementById("body").innerHTML=html;
}

/* =========================
STATS
========================= */
function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.type==="Free").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="Paid").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="Locked").length;
}

/* BOOT */
loadLive();

</script>

</body>
</html>
