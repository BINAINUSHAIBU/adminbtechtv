<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX PREMIUM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:15px;
}

.menu-title{
margin:15px 0 10px;
color:#00d4ff;
font-size:12px;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#121c33;
color:#fff;
cursor:pointer;
}

.nav-btn:hover{
background:#1e2f57;
}

.main{
flex:1;
display:flex;
flex-direction:column;
padding:10px;
overflow:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
width:260px;
padding:10px;
border:none;
border-radius:8px;
background:#101a31;
color:#fff;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:10px;
}

.stat{
background:#101d39;
padding:10px;
border-radius:8px;
text-align:center;
}

.player-container{
height:320px;
background:#000;
border-radius:10px;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:10px 0;
}

.controls button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#152445;
color:white;
cursor:pointer;
}

.controls button:hover{
background:#00d4ff;
color:black;
}

.channel-wrapper{
flex:1;
overflow:hidden;
}

.channels{
height:100%;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
border:1px solid #1f355d;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
border-color:#00d4ff;
}

.badge{
float:right;
background:red;
padding:2px 6px;
border-radius:10px;
font-size:10px;
}

#premiumBar{
position:fixed;
top:10px;
right:10px;
background:#00d4ff;
color:#000;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
z-index:999;
}

@media(max-width:900px){
body{
flex-direction:column;
}
.sidebar{
width:100%;
}
}
</style>
</head>

<body>

<div id="premiumBar">🔓 PREMIUM UNLOCKED</div>

<div class="sidebar">

<div class="logo">📺 BTECH-TV WORLD PRO MAX</div>
<div class="sub">Premium IPTV Dashboard</div>

<div class="menu-title">🌍 Countries</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>
<button class="nav-btn" onclick="load('de')">🇩🇪 Germany</button>

<div class="menu-title">🎬 Categories</div>

<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>
<button class="nav-btn" onclick="loadCat('music')">🎵 Music</button>

<div class="menu-title">🔥 Tools</div>

<button class="nav-btn" onclick="loadUltra()">🚀 Global IPTV</button>
<button class="nav-btn" onclick="togglePiP()">📺 Picture in Picture</button>
<button class="nav-btn" onclick="speedBoost()">⚡ Boost</button>

</div>

<div class="main">

<div class="topbar">
<div class="search-box">
<input type="text" placeholder="Search Channels..." oninput="search(this.value)">
</div>

<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>BTECH-TV WORLD PREMIUM IPTV</h3>

<div class="stats">
<div class="stat">📺<div id="total">0</div></div>
<div class="stat">🌍<div id="liveCount">0</div></div>
<div class="stat">⭐<div id="fav">0</div></div>
<div class="stat">⚡<div id="speed">MAX</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">⏮ Previous</button>
<button onclick="next()">⏭ Next</button>
<button onclick="toggleMute()">🔊 Mute</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

let all=[];
let filtered=[];
let current=0;

const video=document.getElementById("video");

let hls;

async function load(code){
loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadUltra(){
loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){

const res=await fetch(url);
const text=await res.text();

all=[];

text.split("\n").forEach((line,index,array)=>{

if(line.startsWith("#EXTINF")){

const name=line.split(",").pop();
const stream=array[index+1];

if(stream && stream.startsWith("http")){
all.push({
name:name,
url:stream
});
}

}

});

filtered=[...all];

render();
updateStats();
}

function render(){

grid.innerHTML="";

filtered.forEach((channel,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=
`<span class="badge">LIVE</span>${channel.name}`;

card.onclick=()=>play(index);

grid.appendChild(card);

});

}

function play(index){

current=index;

const stream=filtered[index];

if(hls){
hls.destroy();
}

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(stream.url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){
video.play();
});

}else{

video.src=stream.url;
video.play();

}

}

function search(q){

filtered=all.filter(ch=>
ch.name.toLowerCase().includes(q.toLowerCase())
);

render();

}

function next(){

current=(current+1)%filtered.length;
play(current);

}

function prev(){

current=(current-1+filtered.length)%filtered.length;
play(current);

}

function toggleMute(){
video.muted=!video.muted;
}

function toggleFullscreen(){

if(video.requestFullscreen){
video.requestFullscreen();
}

}

function speedBoost(){
video.playbackRate=1.25;
}

function togglePiP(){

if(document.pictureInPictureEnabled){
video.requestPictureInPicture();
}

}

function updateStats(){

document.getElementById("total").innerText=all.length;
document.getElementById("liveCount").innerText=all.length;

}

loadUltra();

</script>

</body>
</html>
