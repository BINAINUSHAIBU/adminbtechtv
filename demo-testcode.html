<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global TV Hub PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b1a;
  color: white;
}

/* HEADER */
header {
  background: #111;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  color: #00ffcc;
}

/* LAYOUT */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  height: 100vh;
  background: #1b1b2e;
  padding: 10px;
  overflow-y: auto;
}

.channel {
  background: #2a2a44;
  padding: 10px;
  margin: 8px 0;
  cursor: pointer;
  border-radius: 5px;
}

.channel:hover {
  background: #00ffcc;
  color: black;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

video {
  width: 100%;
  max-height: 500px;
  background: black;
}

/* ADMIN */
.admin {
  margin-top: 20px;
  background: #1b1b2e;
  padding: 15px;
  border-radius: 10px;
}

input, button {
  padding: 10px;
  margin: 5px;
  width: 95%;
  border-radius: 5px;
  border: none;
}

button {
  background: #00ffcc;
  cursor: pointer;
}

button:hover {
  background: #00bfa6;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 10px;
  background: #111;
  color: gray;
}
</style>
</head>

<body>

<header>
📺 GLOBAL TV HUB PRO — ONE PAGE OTT SYSTEM
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📡 Channels</h3>
<div id="channelList"></div>
</div>

<!-- MAIN -->
<div class="main">

<h2 id="title">Select a Channel</h2>

<video id="player" controls autoplay></video>

<!-- ADMIN PANEL -->
<div class="admin">
<h3>🏢 Admin Panel</h3>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Video URL (.m3u8 / mp4)">
<button onclick="addChannel()">Add Channel</button>

<h4>⚡ System Control</h4>
<button onclick="resetChannels()">Reset Channels</button>
</div>

</div>
</div>

<footer>
© 2026 Global TV Hub PRO | OTT Streaming System
</footer>

<script>

// ================= INITIAL CHANNEL DATABASE =================
let channels = [
  {
    name: "News Live",
    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  },
  {
    name: "Sports HD",
    url: "https://test-streams.mux.dev/test_001/stream.m3u8"
  },
  {
    name: "Movie Channel",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  }
];

// ================= RENDER CHANNELS =================
function renderChannels() {
  const list = document.getElementById("channelList");
  list.innerHTML = "";

  channels.forEach((ch, index) => {
    const div = document.createElement("div");
    div.className = "channel";
    div.innerText = ch.name;

    div.onclick = () => {
      document.getElementById("title").innerText = ch.name;
      document.getElementById("player").src = ch.url;
    };

    list.appendChild(div);
  });
}

// ================= ADD CHANNEL =================
function addChannel() {
  const name = document.getElementById("name").value;
  const url = document.getElementById("url").value;

  if (!name || !url) {
    alert("Please fill all fields");
    return;
  }

  channels.push({ name, url });
  renderChannels();

  document.getElementById("name").value = "";
  document.getElementById("url").value = "";
}

// ================= RESET SYSTEM =================
function resetChannels() {
  channels = [];
  renderChannels();
  document.getElementById("player").src = "";
  document.getElementById("title").innerText = "Select a Channel";
}

// INIT
renderChannels();

</script>

</body>
</html>
