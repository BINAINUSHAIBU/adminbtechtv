<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📺 SUPER ADMIN IPTV ULTRA MAX WORLD</title>

<meta name="theme-color" content="#050816"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* ================= LAYOUT ================= */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:340px;
background:#0d1324;
padding:10px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:20px;
font-weight:900;
color:var(--accent);
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:8px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
}

.brand-header{
padding:10px;
background:#0b1220;
font-weight:700;
}

.dashboard{
padding:8px;
background:#0b1220;
display:flex;
gap:10px;
align-items:center;
}

.dashboard input{
flex:1;
padding:8px;
border-radius:6px;
border:none;
}

.stats{
display:flex;
gap:10px;
padding:8px;
font-size:13px;
}

.stat{
background:#111827;
padding:6px 10px;
border-radius:6px;
}

/* PLAYER */
.player{
height:280px;
background:black;
}

.player video{
width:100%;
height:100%;
}

/* TABLE GRID */
.table-wrap{
flex:1;
overflow:auto;
padding:10px;
}

.table{
width:100%;
border-collapse:collapse;
}

.table th,.table td{
padding:6px;
border-bottom:1px solid #22304d;
font-size:12px;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:340px;
}

button{cursor:pointer}

</style>
</head>

<body>

<div class="container">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<h4>🌍 Countries</h4>
<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>

<h4>🎬 Categories</h4>
<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>

<h4>🔥 Tools</h4>
<button class="nav-btn" onclick="scan()">📡 Scan</button>
<button class="nav-btn" onclick="boost()">⚡ Boost</button>
<button class="nav-btn" onclick="openAdmin()">⚙ Admin</button>

</div>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="topbar">
<div>📺 SUPER ADMIN IPTV SYSTEM</div>
<div>🔴 LIVE</div>
</div>

<div class="brand-header">
📺 BTECH-TV PRO MAX | GLOBAL IPTV ENGINE
</div>

<div class="dashboard">
<input id="search" placeholder="Search Channels..." oninput="searchChannels()"/>
</div>

<div class="stats">
<div class="stat">📺 Channels: <span id="count">0</span></div>
<div class="stat">⚡ CDN Active</div>
<div class="stat">🧠 AI Ready</div>
<div class="stat">🌍 Global Feed</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="table-wrap">
<table class="table">
<thead>
<tr>
<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Lock</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>

<!-- ================= ADMIN ================= -->
<div class="modal" id="admin">
<div class="modal-box">
<h3>SUPER ADMIN PANEL</h3>
<button onclick="scan()">Scan</button>
<button onclick="boost()">Boost</button>
<button onclick="closeAdmin()">Close</button>
</div>
</div>

<script>

/* ================= CHANNEL DATABASE ================= */
let channels = [
{name:"ACNN (480p)",category:"Sports",type:"Free",lock:"Unlocked"},
{name:"Advocate Broadcasting Network (576p)",category:"News",type:"Pay To View",lock:"Locked"},
{name:"Africa TV3 (720p) [Not 24/7]",category:"Music",type:"Free",lock:"Unlocked"},
{name:"BCS StarCross TV (576p)",category:"Education",type:"Free",lock:"Unlocked"},
{name:"Bride TV (576p)",category:"Kids",type:"Free",lock:"Unlocked"},
{name:"Channels 24",category:"Sports",type:"Free",lock:"Unlocked"},
{name:"Channels TV",category:"News",type:"Free",lock:"Unlocked"},
{name:"LN247 (1080p)",category:"Sports",type:"Free",lock:"Unlocked"},
{name:"LoveWorld USA (720p)",category:"Music",type:"Free",lock:"Unlocked"},
{name:"TVC (1080p)",category:"Sports",type:"Free",lock:"Unlocked"},
{name:"TVC News (576p)",category:"News",type:"Pay To View",lock:"Locked"},
{name:"Whole Word TV (720p)",category:"Education",type:"Pay To View",lock:"Unlocked"}
];

let all=[],filtered=[];
let video=document.getElementById("video");
let hls;

/* ================= INIT ================= */
function init(){
all = channels.map(c=>({
...c,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}));

filtered=[...all];
render();
updateCount();
}
init();

/* ================= PLAY ================= */
function play(i){
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* ================= SEARCH ================= */
function searchChannels(){
let v=document.getElementById("search").value.toLowerCase();
filtered = all.filter(c =>
c.name.toLowerCase().includes(v) ||
c.category.toLowerCase().includes(v)
);
render();
updateCount();
}

/* ================= LOCK ================= */
function toggleLock(i){
filtered[i].lock = filtered[i].lock==="Locked"?"Unlocked":"Locked";
render();
}

/* ================= EDIT ================= */
function edit(i){
let c=filtered[i];
c.name = prompt("Name",c.name)||c.name;
c.category = prompt("Category",c.category)||c.category;
render();
}

/* ================= DELETE ================= */
function del(i){
let item=filtered[i];
all = all.filter(c=>c.name!==item.name);
filtered=[...all];
render();
updateCount();
}

/* ================= RENDER ================= */
function render(){
let t=document.getElementById("tbody");
t.innerHTML="";

filtered.forEach((c,i)=>{
t.innerHTML += `
<tr>
<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.type}</td>
<td>${c.lock}</td>
<td>
<button onclick="play(${i})">Play</button>
<button onclick="toggleLock(${i})">Lock</button>
<button onclick="edit(${i})">Edit</button>
<button onclick="del(${i})">Delete</button>
</td>
</tr>`;
});
}

/* ================= ADMIN ================= */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}
function scan(){alert("Scanning IPTV...");}
function boost(){video.playbackRate=1.25;}

/* ================= COUNT ================= */
function updateCount(){
document.getElementById("count").innerText=filtered.length;
}

</script>

</body>
</html>
