<!DOCTYPE html>
<html>
<head>
    <title>Audio Call Link Generator</title>
</head>
<body>

<h2>Create Audio Call Link</h2>

<button onclick="createLink()">Create Link</button>

<p id="link"></p>

<script>
function createLink() {
    const room = Math.random().toString(36).substring(2,10);
    const url = window.location.origin + "/call/" + room;

    document.getElementById("link").innerHTML =
        `<a href="${url}" target="_blank">${url}</a>`;
}
</script>

</body>
</html>
