<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX - SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{position:fixed;inset:0;background:#050816;display:flex;justify-content:center;align-items:center;z-index:9999}
.auth-card{background:#0d1324;padding:20px;border-radius:12px;width:320px}
.auth-card input{width:100%;padding:10px;margin:8px 0;background:#101a31;color:#fff;border:none;border-radius:6px}
.auth-card button{width:100%;padding:10px;margin-top:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer}

/* LAYOUT */
.sidebar{width:260px;background:#0d1324;padding:10px;overflow:auto}
.main{flex:1;display:flex;flex-direction:column;padding:10px}

.nav-btn{width:100%;padding:10px;margin:5px 0;background:#152445;color:#fff;border:none;border-radius:6px;cursor:pointer}
.nav-btn:hover{background:#00d4ff;color:#000}

/* PLAYER */
.player{background:#000;height:300px;border-radius:10px;overflow:hidden}
video{width:100%;height:100%}

/* CHANNELS */
.channels{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.card{background:#111a31;padding:10px;border-radius:8px;cursor:pointer;border:1px solid #1f355d}
.card.locked{opacity:0.3;pointer-events:none}

/* ADMIN */
#admin{
position:fixed;
right:0;top:0;
width:320px;
height:100%;
background:#0b1220;
border-left:2px solid #00d4ff;
padding:10px;
overflow:auto;
display:none;
z-index:99999;
}

.admin-btn{width:100%;padding:10px;margin:5px 0;background:#152445;border:none;color:#fff;border-radius:6px;cursor:pointer}
.admin-btn:hover{background:#00d4ff;color:#000}

#timer{position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;padding:8px;border-radius:6px;font-weight:bold}
</style>
</head>

<body>

<div id="timer">Loading...</div>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📺 IPTV MENU</h3>

<button class="nav-btn" onclick="load()">🌍 Load Channels</button>
<button class="nav-btn" onclick="toggleAdmin()">⚙ Super Admin</button>
<button class="nav-btn" onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="channels" id="grid"></div>

</div>

<!-- ADMIN PANEL -->
<div id="admin">
<h3>⚙ SUPER ADMIN PANEL</h3>

<h4>Trial Controls</h4>
<button class="admin-btn" onclick="setTrial(false)">Disable Trial</button>
<button class="admin-btn" onclick="setTrial(true)">Enable Trial</button>

<h4>Channel Controls</h4>
<button class="admin-btn" onclick="unlockAll()">Unlock All</button>
<button class="admin-btn" onclick="lockRandom()">Lock Random</button>

<h4>System Controls</h4>
<button class="admin-btn" onclick="setMode('block')">Block Platform</button>
<button class="admin-btn" onclick="setMode('free')">Free Mode</button>
<button class="admin-btn" onclick="setMode('radio')">Radio Mode</button>
<button class="admin-btn" onclick="setMode('upgrade')">Upgrade Page</button>
<button class="admin-btn" onclick="setMode('payment')">Payment Page</button>
<button class="admin-btn" onclick="setMode('limited')">Limited Mode</button>

<button class="admin-btn" onclick="closeAdmin()">Close</button>
</div>

<script>

/* CONFIG */
let CONFIG = JSON.parse(localStorage.getItem("CONFIG")) || {
trial:true,
duration:3600000,
locked:[],
mode:"active"
};

function save(){localStorage.setItem("CONFIG",JSON.stringify(CONFIG));}

/* AUTH */
function register(){
localStorage.setItem("user",JSON.stringify({
email:email.value,
pass:pass.value,
exp:Date.now()+CONFIG.duration
}));
alert("Registered");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u || u.email!=email.value || u.pass!=pass.value) return alert("Invalid");

if(Date.now()>u.exp){
handleExpiry();
return;
}

authBox.style.display="none";
startTimer(u);
load();
}

/* TIMER */
function startTimer(u){
setInterval(()=>{
let left=u.exp-Date.now();
if(left<=0) handleExpiry();
timer.innerText="Trial: "+Math.floor(left/60000)+" min left";
},1000);
}

/* IPTV */
let all=[],current=[],video=document.getElementById("video");

async function load(){
let res=await fetch("https://iptv-org.github.io/iptv/index.country.m3u");
let text=await res.text();

all=[];
text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=a[i+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

current=[...all];
render();
}

function render(){
grid.innerHTML="";
current.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";

if(CONFIG.locked.includes(c.name)) div.classList.add("locked");

div.innerHTML=c.name;
div.onclick=()=>play(c);
grid.appendChild(div);
});
}

function play(c){
if(CONFIG.locked.includes(c.name)){
alert("LOCKED");
return;
}
video.src=c.url;
video.play();
}

/* ADMIN */
function toggleAdmin(){admin.style.display="block";}
function closeAdmin(){admin.style.display="none";}

function setTrial(v){
CONFIG.trial=v;save();
alert("Trial "+v);
}

function unlockAll(){
CONFIG.locked=[];save();render();
}

function lockRandom(){
CONFIG.locked=all.slice(0,5).map(c=>c.name);
save();render();
}

function setMode(m){
CONFIG.mode=m;save();
handleExpiry();
}

/* EXPIRY SYSTEM */
function handleExpiry(){
if(CONFIG.mode=="block"){
document.body.innerHTML="<h1>⛔ PLATFORM BLOCKED</h1>";
}
if(CONFIG.mode=="upgrade"){
document.body.innerHTML="<h1>⬆ UPGRADE REQUIRED</h1>";
}
if(CONFIG.mode=="payment"){
document.body.innerHTML="<h1>💳 PAYMENT REQUIRED</h1>";
}
if(CONFIG.mode=="free"){
alert("Free mode active");
}
if(CONFIG.mode=="radio"){
alert("Radio only mode");
}
if(CONFIG.mode=="limited"){
alert("Limited viewing mode");
}
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
