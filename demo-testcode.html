<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV SaaS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* LOGIN */
#login{
position:fixed;inset:0;
background:#050816;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
z-index:9999;
}

input{
padding:10px;width:250px;
border:none;border-radius:6px;
background:#101a31;color:#fff;
}

button{
padding:10px 15px;
border:none;border-radius:6px;
background:#00d4ff;color:#000;
cursor:pointer;
}

/* TRIAL LOCK */
#lock{
position:fixed;inset:0;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
text-align:center;
padding:20px;
}

/* APP */
.sidebar{width:250px;background:#0d1324;padding:10px;overflow:auto;}
.main{flex:1;display:flex;flex-direction:column;padding:10px;}

.player{
height:320px;
background:#000;
border-radius:10px;
overflow:hidden;
}

video{width:100%;height:100%;}

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
margin-top:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:8px;
cursor:pointer;
}
.card:hover{background:#1e2f57;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>IPTV SAAS LOGIN</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- TRIAL LOCK -->
<div id="lock">
<h1>⛔ TRIAL EXPIRED</h1>
<p>Your 3-day trial has ended.</p>
</div>

<!-- APP -->
<div class="sidebar">
<h3>MENU</h3>
<button onclick="load('ng')">Nigeria</button>
<button onclick="load('us')">USA</button>
<button onclick="load('uk')">UK</button>
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

/* ================= DEMO + REAL LOGIN ================= */
function login(){

const demoEmail="demo@iptv.com";
const demoPass="1234";

if(email.value===demoEmail && pass.value===demoPass){
localStorage.setItem("token","demo_token");
document.getElementById("login").style.display="none";
checkAccess();
return;
}

/* REAL BACKEND LOGIN */
fetch("http://localhost:3000/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:pass.value
})
})
.then(r=>r.json())
.then(d=>{
if(d.token){
localStorage.setItem("token",d.token);
document.getElementById("login").style.display="none";
checkAccess();
}else alert("Login failed");
});
}

/* ================= TRIAL CHECK ================= */
async function checkAccess(){
try{
const res = await fetch("http://localhost:3000/me",{
headers:{authorization:localStorage.getItem("token")}
});

const data = await res.json();

if(!data.access){
document.getElementById("lock").style.display="flex";
document.body.style.pointerEvents="none";
}
}catch(e){}
}

/* ================= IPTV ================= */
let all=[],hls;

async function load(code){
const url=`https://iptv-org.github.io/iptv/countries/${code}.m3u`;
const res=await fetch(url);
const text=await res.text();

all=[];
text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let u=a[i+1];
if(u && u.startsWith("http")) all.push({name,url:u});
}
});

render();
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
all.forEach((c)=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=c.name;
d.onclick=()=>play(c.url);
g.appendChild(d);
});
}

function play(url){
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else video.src=url;
}

/* AUTO LOGIN CHECK */
if(localStorage.getItem("token")){
document.getElementById("login").style.display="none";
checkAccess();
}

</script>

</body>
</html>
