<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NETFLIX IPTV SAAS PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050816;color:#fff;height:100vh;overflow:hidden}

/* ================= LOGIN ================= */
#login{
position:fixed;inset:0;background:#020617;
display:flex;flex-direction:column;justify-content:center;align-items:center;
gap:10px;z-index:999;
}

input{
padding:10px;width:240px;border-radius:8px;border:none;
}

button{
padding:10px 14px;border:none;border-radius:8px;
background:#1f2a44;color:#fff;cursor:pointer;
}

button:hover{background:#00d4ff;color:#000}

/* ================= LAYOUT ================= */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:260px;background:#0d1324;overflow:auto;padding:10px
}

.menu{
padding:10px;margin:5px 0;background:#111827;border-radius:8px;cursor:pointer
}
.menu:hover{background:#1e293b}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* TOP */
.topbar{
display:flex;justify-content:space-between;
padding:10px;background:#0b1220
}

/* PLAYER */
.player{
height:300px;background:black
}

video{width:100%;height:100%}

/* GRID */
.grid{
flex:1;overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;padding:10px;
}

.card{
background:#111a31;padding:10px;border-radius:10px;
cursor:pointer;border:1px solid #1f355d
}
.card:hover{border-color:#00d4ff}

/* SEARCH */
.search{
padding:10px;background:#0f172a;
display:flex;gap:10px
}

.search input{
flex:1;padding:10px;border-radius:8px;border:none
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login">
<h2>🔐 IPTV SAAS LOGIN</h2>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">

<button onclick="login()">Login</button>

<p style="font-size:12px;color:#aaa">
Demo: admin@demo.com / admin123
</p>
</div>

<!-- ================= APP ================= -->
<div class="container" id="app" style="display:none">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="loadGlobal()">🌍 Global IPTV</div>

<div class="menu" onclick="load('ng')">🇳🇬 Nigeria</div>
<div class="menu" onclick="load('us')">🇺🇸 USA</div>
<div class="menu" onclick="load('uk')">🇬🇧 UK</div>
<div class="menu" onclick="load('in')">🇮🇳 India</div>
<div class="menu" onclick="load('fr')">🇫🇷 France</div>

<div class="menu" onclick="loadCat('news')">📰 News</div>
<div class="menu" onclick="loadCat('sports')">⚽ Sports</div>
<div class="menu" onclick="loadCat('movies')">🎬 Movies</div>
<div class="menu" onclick="loadCat('music')">🎵 Music</div>

<div class="menu" onclick="showFavs()">⭐ Favorites</div>
<div class="menu" onclick="showRecent()">🕘 Recents</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>📺 NETFLIX IPTV SAAS</div>
<div id="status">OFFLINE</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="search">
<input oninput="search(this.value)" placeholder="Search channels...">
<button onclick="shuffle()">🎲 Shuffle</button>
<button onclick="toggleMute()">🔊 Mute</button>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* ================= LOGIN ================= */
function login(){

const email=document.getElementById("email").value;
const pass=document.getElementById("pass").value;

if(
(email==="admin@demo.com" && pass==="admin123") ||
(email==="user@demo.com" && pass==="user123")
){

localStorage.setItem("token","demo");

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";

document.getElementById("status").innerText="ONLINE";

loadGlobal();

}else{
alert("Invalid login");
}

}

/* ================= LOAD SOURCES ================= */
async function load(url){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${url}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadGlobal(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

/* ================= PARSER ================= */
async function loadM3U(url){

const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];

const lines=text.split("\n");

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith("#EXTINF")){
let name=lines[i].split(",").pop();
let url=lines[i+1];

if(url && url.startsWith("http")){
all.push({name,url});
}
}
}

filtered=[...all];
render();

}

/* ================= RENDER ================= */
function render(){

let grid=document.getElementById("grid");
grid.innerHTML="";

filtered.forEach((c,idx)=>{

let div=document.createElement("div");
div.className="card";
div.innerHTML=c.name;

div.onclick=()=>play(idx);

grid.appendChild(div);

});

}

/* ================= PLAYER ================= */
function play(idx){

i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

}

/* ================= SEARCH ================= */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* ================= UTIL ================= */
function shuffle(){
filtered.sort(()=>Math.random()-0.5);
render();
}

function toggleMute(){
video.muted=!video.muted;
}

function showFavs(){alert("Favorites feature ready for backend");}
function showRecent(){alert("Recents stored in SaaS backend");}

</script>

</body>
</html>
