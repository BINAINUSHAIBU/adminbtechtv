```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
}

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0f172a;
padding:15px;
overflow-y:auto;
}

.cat{
padding:12px;
background:var(--card);
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.player{
height:350px;
background:black;
}

video{
width:100%;
height:100%;
background:black;
}

.search{
padding:10px;
background:var(--panel);
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:12px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
gap:10px;
align-items:center;
}

.left img{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#111827;
padding:30px;
border-radius:20px;
width:95%;
max-width:400px;
}

.auth-box input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
max-height:240px;
}

.channels{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="overlay" id="authModal">

<div class="auth-box">

<h2 style="margin-bottom:20px;color:#00bfff;">
🔐 BTECH-TV LOGIN
</h2>

<input
id="authEmail"
type="email"
placeholder="Email"
value="demo@btechtv.com"
>

<input
id="authPassword"
type="password"
placeholder="Password"
value="Demo1234"
>

<button
onclick="loginUser()"
style="width:100%;background:#16a34a;margin-bottom:10px;"
>
Login
</button>

<button
onclick="registerUser()"
style="width:100%;background:#00bfff;color:black;"
>
Create Account
</button>

<p
id="authMsg"
style="margin-top:15px;font-size:13px;"
></p>

</div>

</div>

<!-- PROFILE -->

<div
class="overlay"
id="profilePanel"
style="display:none;"
>

<div class="auth-box">

<h2 style="margin-bottom:20px;color:#00bfff;">
👤 Profile
</h2>

<p id="profileEmail"></p>
<p id="trialStatus"></p>
<p id="subscriptionStatus"></p>

<button
onclick="logoutUser()"
style="width:100%;margin-top:15px;background:#ef4444;"
>
Logout
</button>

<button
onclick="closeProfile()"
style="width:100%;margin-top:10px;"
>
Close
</button>

</div>

</div>

<!-- TOP -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button onclick="openProfile()">
👤 Profile
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<!-- CONTENT -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')"
>
🇳🇬 Nigeria
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')"
>
🇺🇸 USA
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')"
>
📰 News
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')"
>
⚽ Sports
</div>

</div>

<!-- MAIN -->

<div class="main">

<div class="player">

<video
id="video"
controls
autoplay
playsinline
></video>

</div>

<div class="search">

<input
type="text"
placeholder="Search channels..."
oninput="searchChannels(this.value)"
>

</div>

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_PROJECT.firebaseapp.com",

projectId:"YOUR_PROJECT_ID",

storageBucket:"YOUR_PROJECT.appspot.com",

messagingSenderId:"XXXX",

appId:"XXXX"

};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

/* VARIABLES */

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let currentUser=null;
let userData=null;
let dark=true;

let favs=
JSON.parse(localStorage.getItem('atv_favs')||'{}');

const video=
document.getElementById('video');

/* REGISTER */

async function registerUser(){

const email=
document.getElementById('authEmail').value;

const password=
document.getElementById('authPassword').value;

try{

const res=
await auth.createUserWithEmailAndPassword(
email,
password
);

const uid=res.user.uid;

const now=Date.now();

const trialEnds=
now+(7*24*60*60*1000);

await db.collection('users').doc(uid).set({

email,

createdAt:now,

trialEnds,

subscriptionActive:false,

favorites:[]

});

document.getElementById('authMsg').innerText=
'✅ Account Created';

}catch(err){

document.getElementById('authMsg').innerText=
err.message;

}

}

/* LOGIN */

async function loginUser(){

const email=
document.getElementById('authEmail').value;

const password=
document.getElementById('authPassword').value;

try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(err){

document.getElementById('authMsg').innerText=
err.message;

}

}

/* AUTH */

auth.onAuthStateChanged(async(user)=>{

if(user){

currentUser=user;

document.getElementById('authModal').style.display='none';

const doc=
await db.collection('users')
.doc(user.uid)
.get();

userData=doc.data();

}else{

document.getElementById('authModal').style.display='flex';

}

});

/* PLAYLIST */

async function loadPlaylist(url,group){

const res=await fetch(url);

const text=await res.text();

all=[];

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();

}

/* PARSE */

function parseM3U(data,group){

const lines=data.split('\\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=
info.match(/tvg-logo=\"(.*?)\"/);

all.push({

id:all.length+1,

name,

url,

group,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60'

});

}

}

}

/* RENDER */

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div>

<h4>${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div
onclick="event.stopPropagation();toggleFav(${c.id})"
style="font-size:22px;"
>
${favs[c.id] ? '★':'☆'}
</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

if(userData){

const trialValid=
Date.now()<userData.trialEnds;

if(!trialValid && !userData.subscriptionActive){

alert('Trial Expired');

return;

}

}

currentIndex=index;

const channel=
filteredChannels[index];

if(!channel){
return;
}

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls();

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){
video.play();
}
);

}else{

video.src=channel.url;

video.play();

}

}

/* FAVORITES */

async function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value)

||

c.group.toLowerCase().includes(value)

);

renderChannels();

}

/* PROFILE */

function openProfile(){

if(!currentUser){
return;
}

document.getElementById('profilePanel').style.display='flex';

document.getElementById('profileEmail').innerText=
'Email: '+currentUser.email;

const daysLeft=Math.ceil(
(userData.trialEnds-Date.now())
/
(1000*60*60*24)
);

document.getElementById('trialStatus').innerText=
'Trial: '+
(daysLeft>0
? daysLeft+' days left'
: 'Expired');

document.getElementById('subscriptionStatus').innerText=
'Subscription: '+
(userData.subscriptionActive
? 'ACTIVE'
: 'INACTIVE');

}

function closeProfile(){

document.getElementById('profilePanel').style.display='none';

}

async function logoutUser(){

await auth.signOut();

location.reload();

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* START */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
```
