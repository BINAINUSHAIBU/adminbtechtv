<script>

/* =========================================================
TRIAL SYSTEM + AUTO USER LOGIN ENGINE
========================================================= */

const TRIAL_DAYS = 5;

let currentUser =
JSON.parse(localStorage.getItem('btech_user') || 'null');

/* =========================================================
AUTO REGISTER USER
========================================================= */

function autoRegisterUser(){

if(!currentUser){

const userId =
'BTECH-' + Math.random().toString(36).substring(2,10).toUpperCase();

const startDate = new Date();

const expireDate = new Date();

expireDate.setDate(
expireDate.getDate() + TRIAL_DAYS
);

currentUser = {

id:userId,

username:'trial_user_' +
Math.floor(Math.random()*99999),

password:'AUTO_LOGIN',

plan:'5 DAYS FREE TRIAL',

registered:startDate.toISOString(),

expires:expireDate.toISOString(),

premium:true,

favorites:[],

lastLogin:new Date().toISOString()

};

localStorage.setItem(
'btech_user',
JSON.stringify(currentUser)
);

}

showUserPanel();

}

/* =========================================================
CHECK TRIAL STATUS
========================================================= */

function checkTrialStatus(){

if(!currentUser){
return false;
}

const now = new Date();

const expiry = new Date(currentUser.expires);

const diff =
expiry.getTime() - now.getTime();

const daysLeft =
Math.ceil(diff / (1000*60*60*24));

if(diff <= 0){

showExpiredScreen();

return false;

}

document.getElementById('trialDays').innerText =
daysLeft + ' Days Left';

return true;

}

/* =========================================================
USER PANEL
========================================================= */

function showUserPanel(){

const topbar =
document.querySelector('.topbar');

const userBox = document.createElement('div');

userBox.id='userPanel';

userBox.style.display='flex';
userBox.style.alignItems='center';
userBox.style.gap='10px';
userBox.style.background='#111827';
userBox.style.padding='10px 15px';
userBox.style.borderRadius='12px';

userBox.innerHTML = `

<div style="font-size:13px;line-height:1.5;">

<div style="font-weight:bold;color:#00d4ff;">
👤 ${currentUser.username}
</div>

<div style="font-size:11px;color:#94a3b8;">
🎁 ${currentUser.plan}
</div>

<div style="font-size:11px;color:#22c55e;">
⏳ <span id="trialDays">5 Days Left</span>
</div>

</div>

<button
onclick="logoutUser()"
style="
padding:8px 12px;
background:#ef4444;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
"
>
Logout
</button>

`;

topbar.appendChild(userBox);

}

/* =========================================================
LOGOUT
========================================================= */

function logoutUser(){

localStorage.removeItem('btech_user');

location.reload();

}

/* =========================================================
TRIAL EXPIRED SCREEN
========================================================= */

function showExpiredScreen(){

document.body.innerHTML = `

<div style="
width:100%;
height:100vh;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
font-family:Arial;
padding:30px;
text-align:center;
">

<h1 style="
font-size:60px;
margin-bottom:20px;
">
🚫
</h1>

<h2 style="
font-size:34px;
margin-bottom:15px;
color:#00d4ff;
">
Trial Expired
</h2>

<p style="
color:#94a3b8;
max-width:500px;
line-height:1.7;
margin-bottom:25px;
">
Your 5 Days Free Trial has ended.
Upgrade to continue enjoying all Ultra IPTV Features.
</p>

<button
onclick="activateNewTrial()"
style="
padding:15px 25px;
background:#00d4ff;
color:black;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
"
>
🔄 Activate New Trial
</button>

</div>

`;

}

/* =========================================================
NEW TRIAL
========================================================= */

function activateNewTrial(){

localStorage.removeItem('btech_user');

location.reload();

}

/* =========================================================
USER MANAGER
========================================================= */

function openUserManager(){

alert(

'👤 USER MANAGER\n\n' +

'User ID: ' + currentUser.id + '\n\n' +

'Username: ' + currentUser.username + '\n\n' +

'Plan: ' + currentUser.plan + '\n\n' +

'Expires: ' +

new Date(currentUser.expires)
.toLocaleString()

);

}

/* =========================================================
QUIZ CHANNELS
========================================================= */

function openQuizChannels(){

alert(

'🧠 QUIZ CHANNELS ENABLED\n\n' +

'✔ Sports Quiz\n' +
'✔ Movie Quiz\n' +
'✔ Music Quiz\n' +
'✔ News Quiz\n' +
'✔ Science Quiz\n' +
'✔ Kids Quiz\n' +
'✔ Geography Quiz'

);

}

/* =========================================================
PREMIUM FEATURES BOOST
========================================================= */

function activatePremiumMode(){

console.log('PREMIUM MODE ACTIVE');

document.querySelectorAll('.badge.free')
.forEach(b=>{

b.innerText='PREMIUM';
b.classList.add('premium');

});

}

/* =========================================================
ALL EXTRA FEATURES
========================================================= */

function ultraAIEngine(){

console.log('AI IPTV ENGINE READY');

}

function globalCountryEngine(){

console.log('GLOBAL COUNTRIES LOADED');

}

function categoryEngine(){

console.log('CATEGORY ENGINE ACTIVE');

}

function languageEngine(){

console.log('LANGUAGE ENGINE ACTIVE');

}

function ultraSecurity(){

console.log('ULTRA SECURITY ENABLED');

}

function cloudSync(){

console.log('CLOUD SYNC READY');

}

function adaptiveBitrate(){

console.log('ADAPTIVE STREAMING ENABLED');

}

function streamRecovery(){

console.log('AUTO RECOVERY ENABLED');

}

function performanceMode(){

console.log('ULTRA PERFORMANCE MODE');

}

/* =========================================================
ULTRA STARTUP
========================================================= */

window.addEventListener('load',()=>{

autoRegisterUser();

checkTrialStatus();

activatePremiumMode();

ultraAIEngine();

globalCountryEngine();

categoryEngine();

languageEngine();

ultraSecurity();

cloudSync();

adaptiveBitrate();

streamRecovery();

performanceMode();

});

/* =========================================================
CHECK TRIAL EVERY MINUTE
========================================================= */

setInterval(()=>{

checkTrialStatus();

},60000);

</script>
