<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden;
height:100vh;
}

/* HEADER */
.header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,.08);
position:fixed;
top:0;
left:0;
right:0;
z-index:99999;
}

.logo{
font-size:22px;
font-weight:700;
color:#00d4ff;
}

/* MAIN LAYOUT */
.main{
display:flex;
height:100vh;
padding-top:60px;
}

/* SIDEBAR */
.sidebar{
width:320px;
background:#08101f;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.08);
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#121d33;
color:#fff;
}

/* FIXED PLAYER */
.content{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.player-wrapper{
height:430px;
background:#000;
position:fixed;
top:60px;
left:320px;
right:0;
z-index:9999;
}

.player-wrapper video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.live-badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 12px;
border-radius:20px;
font-weight:700;
z-index:99999;
}

/* DASHBOARD CONTENT */
.dashboard{
margin-top:430px;
overflow-y:auto;
height:calc(100vh - 490px);
padding:20px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.card{
background:#101827;
padding:15px;
border-radius:12px;
border:1px solid rgba(255,255,255,.08);
}

.channel{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

.channel:hover{
background:#121d33;
}

@media(max-width:900px){

.sidebar{
width:100%;
height:250px;
}

.main{
flex-direction:column;
}

.player-wrapper{
left:0;
top:310px;
height:250px;
}

.dashboard{
margin-top:250px;
height:calc(100vh - 560px);
}
}
</style>

</head>

<body>

<header class="header">
<div class="logo">🌍 WORLDTV LIVE PLATFORM</div>
<div>🔴 LIVE</div>
</header>

<div class="main">

<aside class="sidebar">

<div class="search-box">
<input type="text" placeholder="Search channels...">
</div>

<div id="channelList">
<!-- Your entire M3U channel list goes here -->
</div>

</aside>

<section class="content">

<div class="player-wrapper">

<div class="live-badge">
🔴 LIVE STREAMING
</div>

<video id="videoPlayer" controls autoplay></video>

</div>

<div class="dashboard">

<div class="card-grid">

<div class="card">
<h3>📺 Total Channels</h3>
<p id="totalChannels">0</p>
</div>

<div class="card">
<h3>⭐ Favorites</h3>
<p id="favoritesCount">0</p>
</div>

<div class="card">
<h3>🕒 Recent</h3>
<p id="recentCount">0</p>
</div>

<div class="card">
<h3>📡 EPG Status</h3>
<p>Connected</p>
</div>

</div>

<!-- KEEP ALL YOUR EXISTING DASHBOARD FEATURES HERE -->

<!-- Categories -->

<!-- EPG -->

<!-- Favorites -->

<!-- Recently Watched -->

<!-- PiP -->

<!-- Multi Screen -->

<!-- Admin Tools -->

<!-- Analytics -->

<!-- Xtream Integration -->

<!-- M3U Import -->

<!-- Global Search -->

<!-- Settings -->

<!-- Notifications -->

<!-- AI IPTV Features -->

</div>

</section>

</div>

<script>
const video = document.getElementById("videoPlayer");

function playChannel(url){
if(Hls.isSupported()){
const hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}
else{
video.src = url;
}
}
</script>

</body>
</html>
