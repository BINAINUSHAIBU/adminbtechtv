<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<meta name="theme-color" content="#0b0f1a"/>

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* =========================
TOPBAR
========================= */

.topbar{
min-height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
gap:15px;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
margin-left:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 16px;
background:var(--card);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:13px;
transition:.3s;
white-space:nowrap;
flex-shrink:0;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
flex:1;
display:flex;
overflow:hidden;
min-height:0;
}

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
-webkit-overflow-scrolling:touch;
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
min-width:0;
}

/* =========================
PLAYER
========================= */

.player{
height:350px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
text-align:center;
padding:20px;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
}

.overlay p{
color:var(--muted);
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;
}

.now-info h2{
font-size:18px;
