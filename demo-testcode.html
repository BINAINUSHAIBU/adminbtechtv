<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#0f1729;
--card:#162033;
--line:#25324c;
--text:#fff;
--muted:#93a4c3;
--primary:#00d4ff;
--primary2:#4f46e5;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:320px;
background:#0b1220;
border-right:1px solid rgba(255,255,255,.05);
display:flex;
flex-direction:column;
}

.logo{
padding:20px;
font-size:24px;
font-weight:800;
background:#111827;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#162033;
color:#fff;
}

.channel-list{
flex:1;
overflow:auto;
padding:10px;
}

.channel{
padding:12px;
margin-bottom:10px;
background:var(--card);
border-radius:12px;
cursor:pointer;
transition:.2s;
}

.channel:hover{
border:1px solid var(--primary);
}

.channel small{
color:var(--muted);
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.player-card{
background:var(--panel);
padding:20px;
border-radius:20px;
}

video{
width:100%;
height:65vh;
background:black;
border-radius:15px;
}

.title{
margin-bottom:15px;
font-size:22px;
font-weight:700;
}

.meta{
margin-top:10px;
color:var(--muted);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.stat{
background:var(--panel);
padding:18px;
border-radius:15px;
}

@media(max-width:900px){
.app{
flex-direction:column;
}
.sidebar{
width:100%;
height:40vh;
}
}
</style>
</head>
<body>

<div class="app">

<div class="sidebar">

<div class="logo">
📺 WORLDTV LIVE
</div>

<div class="search">
<input type="text" id="searchInput" placeholder="Search channels">
</div>

<div class="channel-list" id="channelList"></div>

</div>

<div class="main">

<div class="player-card">

<div class="title" id="channelTitle">
Select a Channel
</div>

<video id="videoPlayer" controls autoplay></video>

<div class="meta" id="channelInfo">
Ready
</div>

</div>

<div class="stats">

<div class="stat">
<h2 id="totalChannels">0</h2>
<p>Total Channels</p>
</div>

<div class="stat">
<h2 id="sportsCount">0</h2>
<p>Sports</p>
</div>

<div class="stat">
<h2 id="newsCount">0</h2>
<p>News</p>
</div>

<div class="stat">
<h2 id="movieCount">0</h2>
<p>Movies</p>
</div>

</div>

</div>

</div>

<script>

/***************************************************
PASTE FULL M3U PLAYLIST BELOW
****************************************************/

const PLAYLIST_DATA = `
#EXTM3U

#EXTINF:-1 group-title="Sports",BEIN Sports News
http://example.com/stream1.m3u8

#EXTINF:-1 group-title="Sports",BEIN NBA HD
http://example.com/stream2.m3u8

#EXTINF:-1 group-title="News",Global News
http://example.com/stream3.m3u8

#EXTINF:-1 group-title="Movies",Movie Channel
http://example.com/stream4.m3u8
`;

/***************************************************
M3U PARSER
****************************************************/

function parseM3U(m3u){

const lines = m3u.split(/\r?\n/);

const channels = [];

for(let i=0;i<lines.length;i++){

const line = lines[i].trim();

if(line.startsWith('#EXTINF')){

const url = lines[i+1] ? lines[i+1].trim() : '';

const nameMatch = line.split(',');

const name =
nameMatch.length > 1
? nameMatch[nameMatch.length-1]
: 'Unknown Channel';

const groupMatch =
line.match(/group-title="([^"]+)"/i);

const group =
groupMatch
? groupMatch[1]
: 'General';

channels.push({
name,
group,
url
});

}

}

return channels;

}

const channels = parseM3U(PLAYLIST_DATA);

document.getElementById('totalChannels').textContent =
channels.length;

document.getElementById('sportsCount').textContent =
channels.filter(c =>
c.group.toLowerCase().includes('sport')
).length;

document.getElementById('newsCount').textContent =
channels.filter(c =>
c.group.toLowerCase().includes('news')
).length;

document.getElementById('movieCount').textContent =
channels.filter(c =>
c.group.toLowerCase().includes('movie')
).length;

const channelList =
document.getElementById('channelList');

function renderChannels(list){

channelList.innerHTML='';

list.forEach(ch=>{

const item=document.createElement('div');

item.className='channel';

item.innerHTML=`
<div><strong>${ch.name}</strong></div>
<small>${ch.group}</small>
`;

item.onclick=()=>{
playChannel(ch);
};

channelList.appendChild(item);

});

}

renderChannels(channels);

/***************************************************
PLAYER
****************************************************/

const video =
document.getElementById('videoPlayer');

function playChannel(channel){

document.getElementById(
'channelTitle'
).textContent = channel.name;

document.getElementById(
'channelInfo'
).textContent =
channel.group;

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(channel.url);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
function(){
video.play();
}
);

}else{

video.src = channel.url;
video.play();

}

}

/***************************************************
SEARCH
****************************************************/

document
.getElementById('searchInput')
.addEventListener('keyup',function(){

const value =
this.value.toLowerCase();

const filtered =
channels.filter(c=>
c.name.toLowerCase().includes(value)
||
c.group.toLowerCase().includes(value)
);

renderChannels(filtered);

});

</script>

</body>
</html>
