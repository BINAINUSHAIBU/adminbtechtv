<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--accent:#00bfff;
--text:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */

.topbar{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0f172a;
padding:15px;
overflow-y:auto;
}

.cat{
padding:12px;
background:var(--card);
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:360px;
background:black;
}

video{
width:100%;
height:100%;
background:black;
}

/* SEARCH */

.search{
padding:10px;
background:var(--panel);
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(260px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:12px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

.left{

}

.left img{
width:55px;

border-radius:10px;

}

/* OVERLAY */

.overlay{

.box{

.container{

</style>
</head>

<div

>

<div class="box">

<h2 style="margin-bottom:20px;color:#00bfff;">
👤 DEMO PROFILE
</h2>

<p>
Demo User Access
</p>

<p style="margin-top:10px;">
Subscription: ACTIVE
</p>

<button
onclick="closeProfile()"
style="
margin-top:20px;
width:100%;
"
>
Close
</button>

</div>

</div>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button onclick="openProfile()">
👤 Profile
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u')"
>
🇳🇬 Nigeria
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u')"
>
🇺🇸 USA
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u')"
>
📰 News
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u')"
>
⚽ Sports
</div>

<div
class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u')"
>
🎬 Movies
</div>

</div>

<!-- MAIN CONTENT -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<video
id="video"
controls
autoplay
playsinline
></video>

</div>

<!-- SEARCH -->

<div class="search">

<input
type="text"
placeholder="Search channels..."

>

</div>

<!-- CHANNEL LIST -->

<div
class="channels"
id="channelList"
></div>

</div>

</div>

<script>

/* VARIABLES */

let all=[];
let filteredChannels=[];
let currentHls=null;
let currentIndex=0;
let dark=true;

let favs=
JSON.parse(localStorage.getItem('favs')||'{}');

const video=
document.getElementById('video');

/* ENTER */

function enterApp(){

document.getElementById('loginBox').style.display='none';

}

/* PLAYLIST */

async function loadPlaylist(url){

const res=await fetch(url);

const text=await res.text();

all=[];

parseM3U(text);

filteredChannels=[...all];

renderChannels();

}

/* PARSE */

function parseM3U(data){

const lines=data.split('\\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=
info.split(',').pop();

const logoMatch=
info.match(/tvg-logo=\"(.*?)\"/);

all.push({

id:all.length+1,

name:name,

url:url,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60'

});

}

}

}

/* RENDER */

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=
document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div>

<h4>${c.name}</h4>

</div>

</div>

<div
onclick="event.stopPropagation();toggleFav(${c.id})"
style="font-size:22px;"
>
${favs[c.id] ? '★':'☆'}
</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=
filteredChannels[index];

if(!channel){
return;
}

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls();

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){
video.play();
}
);

}else{

video.src=channel.url;

video.play();

}

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'favs',
JSON.stringify(favs)
);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value)

);

renderChannels();

}

/* PROFILE */

function openProfile(){

document.getElementById('profileBox').style.display='flex';

}

function closeProfile(){

document.getElementById('profileBox').style.display='none';

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* START */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u'
);

</script>

</body>
</html>
