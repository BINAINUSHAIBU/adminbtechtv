<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#050816"/>
<title>BTECH-TV ULTRA MERGED SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--success:#16a34a;
--danger:#ef4444;
--warn:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
display:flex;
flex-direction:column;
}

/* TOPBAR */
.topbar{
display:flex;
gap:8px;
padding:10px;
background:#0f172a;
overflow-x:auto;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
color:var(--accent);
font-weight:bold;
font-size:18px;
margin-right:10px;
white-space:nowrap;
}

.topbar button{
background:var(--card);
border:none;
padding:8px 12px;
border-radius:8px;
color:white;
cursor:pointer;
}

.topbar button:hover{
background:var(--accent);
color:black;
}

/* LAYOUT */
.container{
display:flex;
flex:1;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0b1220;
padding:10px;
overflow:auto;
}

.cat{
background:var(--card);
padding:10px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
}

.cat:hover{background:var(--hover);}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */
.player{
height:340px;
background:black;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* CHANNEL LIST */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{background:var(--hover);}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
}

.free{background:var(--success);}
.paid{background:var(--danger);}
.locked{background:var(--warn);color:black;}

/* ADMIN */
.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
}

.admin-box{
background:#111827;
padding:20px;
border-radius:12px;
width:90%;
max-width:700px;
}

.admin-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.admin-grid button{
padding:12px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH-TV MERGED ENGINE</div>

<button onclick="setMode('real')">Real IPTV</button>
<button onclick="setMode('engine')">100K Engine</button>
<button onclick="setMode('hybrid')">Hybrid</button>

<button onclick="loadReal('https://iptv-org.github.io/iptv/countries/ng.m3u')">Nigeria</button>
<button onclick="generate()">Generate</button>

<button onclick="shuffle()">Shuffle</button>
<button onclick="toggleTheme()">Theme</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
<button onclick="openAdmin()">Admin</button>
</div>

<!-- LAYOUT -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadReal('https://iptv-org.github.io/iptv/countries/us.m3u')">USA</div>
<div class="cat" onclick="loadReal('https://iptv-org.github.io/iptv/countries/uk.m3u')">UK</div>
<div class="cat" onclick="loadReal('https://iptv-org.github.io/iptv/countries/za.m3u')">South Africa</div>

<h3>⚡ Engine</h3>
<div class="cat" onclick="generate()">Generate 100K Channels</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="overlay" id="overlay">Loading...</div>
<video id="video" controls autoplay></video>
</div>

<div class="channels" id="list"></div>

</div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<div class="admin-box">

<h2 style="color:#00d4ff">SUPER ADMIN</h2>

<div class="admin-grid">
<button onclick="alert('Scan')">Scan</button>
<button onclick="alert('Repair')">Repair</button>
<button onclick="alert('Boost')">Boost</button>
<button onclick="alert('Backup')">Backup</button>
<button onclick="location.reload()">Restart</button>
<button onclick="closeAdmin()">Close</button>
</div>

</div>
</div>

<script>

let real=[];
let engine=[];
let display=[];
let mode="real";
let current=0;
let hls=null;

const testStreams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
];

/* MODE */
function setMode(m){
mode=m;
if(m==="real") display=real;
if(m==="engine") display=engine;
if(m==="hybrid") display=[...real,...engine];
render();
}

/* REAL IPTV */
async function loadReal(url){
document.getElementById("overlay").style.display="flex";

const res=await fetch(url);
const text=await res.text();

real=[];
const lines=text.split("\n");

for(let i=0;i<lines.length;i++){
if(lines[i].includes("#EXTINF")){
const name=lines[i].split(",")[1]||"Channel";
const url=lines[i+1];

real.push({
name,
url,
type:"free"
});
}
}

display=real;
render();
document.getElementById("overlay").style.display="none";
}

/* ENGINE */
function generate(){
engine=[];
for(let i=0;i<1000;i++){
engine.push({
name:"ENGINE CHANNEL "+i,
url:testStreams[i%testStreams.length],
type:i%3===0?"paid":"free"
});
}

display=engine;
render();
}

/* RENDER */
function render(){
const box=document.getElementById("list");
box.innerHTML="";

display.forEach((c,i)=>{
const div=document.createElement("div");
div.className="channel";
div.innerHTML=`
<span>${c.name}</span>
<span class="badge ${c.type}">${c.type}</span>
`;
div.onclick=()=>play(i);
box.appendChild(div);
});
}

/* PLAY */
function play(i){
current=i;
const c=display[i];
if(!c) return;

const video=document.getElementById("video");

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* UTIL */
function shuffle(){
display.sort(()=>Math.random()-0.5);
render();
}

function toggleTheme(){
document.body.style.background =
document.body.style.background==="#000"?"#050816":"#000";
}

function toggleFullscreen(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* ADMIN */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}

</script>

</body>
</html>
