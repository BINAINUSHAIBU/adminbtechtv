```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise IPTV Ultra Max</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#0b1224;
--card:#111b34;
--accent:#00e5ff;
--text:#fff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

header{
height:60px;
background:#08142f;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
font-weight:bold;
}

.wrapper{
display:grid;
grid-template-columns:250px 1fr 300px;
height:calc(100vh - 60px);
}

.sidebar,
.right{
background:var(--panel);
overflow:auto;
padding:10px;
}

.main{
padding:10px;
overflow:auto;
}

.player{
height:350px;
background:#000;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

video{
width:100%;
height:100%;
}

.menu{
padding:12px;
background:var(--card);
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
}

.menu:hover{
background:#162447;
}

.card{
background:var(--card);
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
}

button{
padding:10px;
border:none;
background:var(--accent);
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:8px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

.stat{
padding:15px;
background:var(--card);
border-radius:10px;
margin-bottom:10px;
text-align:center;
}

@media(max-width:900px){

.wrapper{
grid-template-columns:1fr;
}

.sidebar,
.right{
display:none;
}

}

</style>
</head>
<body>

<header>

<div>🌍 Enterprise IPTV Ultra Max</div>

<div>SUPER ADMIN</div>

</header>

<div class="wrapper">

<!-- LEFT -->

<div class="sidebar">

<h3>Countries</h3>

<div id="countryList"></div>

</div>

<!-- CENTER -->

<div class="main">

<div class="player">

<video id="video" controls autoplay></video>

</div>

<input
id="search"
placeholder="Search channels..."
onkeyup="searchChannels()">

<div class="grid">

<div class="card">
<h3>Live Channels</h3>
<p id="liveCount">0</p>
</div>

<div class="card">
<h3>Favorites</h3>
<p id="favCount">0</p>
</div>

<div class="card">
<h3>Countries</h3>
<p id="countryCount">0</p>
</div>

<div class="card">
<h3>Users</h3>
<p>Admin</p>
</div>

</div>

<br>

<h2>Channels</h2>

<div id="channels"></div>

</div>

<!-- RIGHT -->

<div class="right">

<div class="stat">
<h3>Admin Tools</h3>
</div>

<button onclick="backup()">Backup</button>

<button onclick="toggleFullscreen()">
Fullscreen
</button>

<button onclick="loadFavorites()">
Favorites
</button>

<button onclick="clearFavorites()">
Clear Favorites
</button>

</div>

</div>

<script>

const CHANNELS={

Nigeria:[
{
name:"NTA",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},
{
name:"Channels TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
],

USA:[
{
name:"USA News",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
],

UK:[
{
name:"UK Sports",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
],

Canada:[
{
name:"Canada TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
],

India:[
{
name:"Bollywood TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
]

};

let hls;
let current=[];

function init(){

let c='';

Object.keys(CHANNELS).forEach(country=>{

c+=`
<div class="menu"
onclick="loadCountry('${country}')">
${country}
</div>
`;

});

countryList.innerHTML=c;

countryCount.innerText=
Object.keys(CHANNELS).length;

}

function loadCountry(country){

current=CHANNELS[country];

renderChannels(current);

}

function renderChannels(arr){

liveCount.innerText=arr.length;

let html='';

arr.forEach(ch=>{

html+=`

<div class="card">

<h3>${ch.name}</h3>

<button onclick="playStream('${ch.url}')">
Play
</button>

<button onclick="favorite('${ch.name}')">
Favorite
</button>

</div>

`;

});

channels.innerHTML=html;

}

function playStream(url){

const video=
document.getElementById('video');

if(Hls.isSupported()){

if(hls) hls.destroy();

hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

function favorite(name){

let f=
JSON.parse(
localStorage.getItem('favs')||'[]'
);

if(!f.includes(name))
f.push(name);

localStorage.setItem(
'favs',
JSON.stringify(f)
);

favCount.innerText=f.length;

}

function loadFavorites(){

let f=
JSON.parse(
localStorage.getItem('favs')||'[]'
);

alert(f.join("\n"));

}

function clearFavorites(){

localStorage.removeItem('favs');

favCount.innerText=0;

}

function searchChannels(){

let q=
search.value.toLowerCase();

renderChannels(
current.filter(x=>
x.name.toLowerCase().includes(q)
)
);

}

function backup(){

let data=
JSON.stringify(CHANNELS);

let blob=
new Blob([data]);

let a=
document.createElement('a');

a.href=
URL.createObjectURL(blob);

a.download='iptv_backup.json';

a.click();

}

function toggleFullscreen(){

if(!document.fullscreenElement)
document.documentElement.requestFullscreen();
else
document.exitFullscreen();

}

init();

</script>

</body>
</html>
```
