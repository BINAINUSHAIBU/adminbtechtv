<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026 - TRIAL SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* LOGIN OVERLAY */
#authBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.auth{
background:#0d1324;
padding:20px;
border-radius:12px;
width:320px;
border:1px solid #1d2b4f;
}

.auth input{
width:100%;
padding:10px;
margin:8px 0;
background:#111a31;
border:none;
color:#fff;
border-radius:8px;
}

.auth button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00d4ff;
color:#000;
font-weight:bold;
}

/* TRIAL EXPIRED SCREEN */
#expired{
position:fixed;
inset:0;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:99999;
flex-direction:column;
text-align:center;
}

#expired button{
padding:12px 20px;
margin-top:15px;
background:red;
border:none;
color:#fff;
border-radius:8px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}

.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}

.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}

.search-box input{
padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px}

.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;border-radius:10px;margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;margin-top:8px;
}

.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;}

video{width:100%;height:100%;}

.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}

.controls button{
padding:8px 10px;border:none;border-radius:6px;background:#152445;color:#fff;cursor:pointer;
}
.controls button:hover{background:#00d4ff;color:#000}

.channel-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column;}

.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}

.card{
background:#111a31;padding:10px;border-radius:10px;cursor:pointer;
border:1px solid #1f355d;
}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}

.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
<div class="auth">
<h3>📺 IPTV TRIAL LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register (Start Trial)</button>
<button onclick="login()">Login</button>

<p style="font-size:12px;margin-top:10px;color:#aaa;">
3-Day Free Trial Active System
</p>
</div>
</div>

<!-- EXPIRED -->
<div id="expired">
<h1>⛔ TRIAL EXPIRED</h1>
<p>Your 3-day trial has ended.</p>
<button onclick="upgrade()">💳 Upgrade to Continue Watching</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🌍 Countries</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>

<div class="menu-title">🎬 Categories</div>

<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>

<div class="menu-title">🔥 Tools</div>

<button class="nav-btn" onclick="logout()">🚪 Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ Fav <div id="fav">0</div></div>
<div class="stat">⚫ Dead <div id="dead">0</div></div>
<div class="stat">🌍 Live <div id="live">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="next()">▶ Next</button>
<button onclick="prev()">◀ Prev</button>
<button onclick="toggleMute()">🔊 Mute</button>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* =======================
   TRIAL SYSTEM
======================= */

function now(){return new Date().getTime();}

function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(!email||!pass){alert("Fill all fields");return;}

let user={
email,pass,
start:now(),
trialDays:3
};

localStorage.setItem("user",JSON.stringify(user));
login();
}

function login(){
let user=JSON.parse(localStorage.getItem("user"));
if(!user){alert("No account found. Register first.");return;}

let diff=(now()-user.start)/(1000*60*60*24);

if(diff>user.trialDays){
document.getElementById("authBox").style.display="none";
document.getElementById("expired").style.display="flex";
return;
}

document.getElementById("authBox").style.display="none";
loadUltra();
}

function logout(){
localStorage.removeItem("user");
location.reload();
}

function upgrade(){
alert("Redirecting to payment gateway...");
}

/* =======================
   IPTV CORE (UNCHANGED)
======================= */

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

let lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];
if(url && url.startsWith("http")) all.push({name,url});
}
}

filtered=[...all];
render();
stats();
}

function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

</script>

</body>
</html>
