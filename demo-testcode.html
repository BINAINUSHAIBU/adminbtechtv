<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global TV Hub PRO SaaS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a1a;
  color: white;
}

/* HEADER */
header {
  background: #111;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  color: #00ffcc;
}

/* LAYOUT */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  height: 100vh;
  background: #1c1c2e;
  padding: 10px;
  overflow-y: auto;
}

.channel {
  padding: 10px;
  margin: 8px 0;
  background: #2a2a44;
  cursor: pointer;
  border-radius: 6px;
}

.channel:hover {
  background: #00ffcc;
  color: black;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

video {
  width: 100%;
  max-height: 450px;
  background: black;
  border-radius: 10px;
}

/* ADMIN PANEL */
.admin {
  margin-top: 20px;
  background: #1c1c2e;
  padding: 15px;
  border-radius: 10px;
}

input, button {
  width: 95%;
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  background: #00ffcc;
  cursor: pointer;
}

button:hover {
  background: #00bfa6;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 10px;
  background: #111;
  color: gray;
}
</style>
</head>

<body>

<header>
📺 GLOBAL TV HUB PRO — OTT SAAS PLATFORM (ONE PAGE)
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📡 TV Channels</h3>
<div id="channelList"></div>
</div>

<!-- MAIN -->
<div class="main">

<h2 id="title">Select a Channel</h2>

<video id="player" controls autoplay></video>

<!-- ADMIN PANEL -->
<div class="admin">
<h3>🏢 Super Admin Panel (SaaS Demo)</h3>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Stream URL (.m3u8 / mp4)">
<button onclick="addChannel()">➕ Add Channel</button>

<h4>⚡ SaaS Controls</h4>
<button onclick="resetSystem()">Reset All Channels</button>
<button onclick="seedSystem()">Restore Default Channels</button>

<h4>💰 Monetization (Demo)</h4>
<button onclick="alert('Subscription feature coming in backend upgrade')">Enable Subscription</button>
<button onclick="alert('Ads system coming in backend upgrade')">Enable Ads</button>

</div>

</div>
</div>

<footer>
© 2026 Global TV Hub PRO SaaS | Netflix-style OTT System
</footer>

<script>

/* ================= FAKE DATABASE ================= */
let channels = [
  {
    name: "News Live",
    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  },
  {
    name: "Sports HD",
    url: "https://test-streams.mux.dev/test_001/stream.m3u8"
  },
  {
    name: "Movie Channel",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  }
];

/* ================= RENDER ================= */
function render() {
  const list = document.getElementById("channelList");
  list.innerHTML = "";

  channels.forEach((ch, i) => {
    const div = document.createElement("div");
    div.className = "channel";
    div.innerText = ch.name;

    div.onclick = () => {
      document.getElementById("title").innerText = ch.name;
      document.getElementById("player").src = ch.url;
    };

    list.appendChild(div);
  });
}

/* ================= ADD CHANNEL ================= */
function addChannel() {
  const name = document.getElementById("name").value;
  const url = document.getElementById("url").value;

  if (!name || !url) {
    alert("Fill all fields");
    return;
  }

  channels.push({ name, url });
  render();

  document.getElementById("name").value = "";
  document.getElementById("url").value = "";
}

/* ================= RESET ================= */
function resetSystem() {
  channels = [];
  render();
  document.getElementById("player").src = "";
  document.getElementById("title").innerText = "Select a Channel";
}

/* ================= RESTORE DEFAULT ================= */
function seedSystem() {
  channels = [
    { name: "News Live", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
    { name: "Sports HD", url: "https://test-streams.mux.dev/test_001/stream.m3u8" },
    { name: "Movie Channel", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
  ];
  render();
}

/* INIT */
render();

</script>

</body>
</html>
