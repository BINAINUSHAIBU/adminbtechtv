<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV WORLD ULTRA MAX X</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
 --bg:#08111f;
 --card:#121c2c;
 --accent:#00d4ff;
 --text:#fff;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:Arial,sans-serif;
}

body{
 background:var(--bg);
 color:var(--text);
 height:100vh;
 display:flex;
 flex-direction:column;
}

header{
 background:#111827;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:var(--accent);
 font-size:22px;
 font-weight:bold;
}

.player{
 height:35vh;
 background:#000;
}

video{
 width:100%;
 height:100%;
}

.toolbar{
 display:flex;
 gap:10px;
 padding:10px;
 overflow:auto;
 background:#0f172a;
}

.toolbar button{
 border:none;
 padding:10px;
 border-radius:8px;
 cursor:pointer;
}

.search{
 padding:10px;
}

.search input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:10px;
}

.channels{
 flex:1;
 overflow:auto;
 padding:10px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:10px;
}

.channel{
 background:var(--card);
 padding:12px;
 border-radius:12px;
 cursor:pointer;
}

.channel:hover{
 border:1px solid var(--accent);
}

@media(max-width:768px){
 .channels{
   grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<header>
<div class="logo">📺 BTECH-TV WORLD ULTRA MAX X</div>
</header>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="toolbar">
<button onclick="loadFeeds()">🌍 Channels</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="shuffleChannels()">🎲 Shuffle</button>
<button onclick="showFavorites()">⭐ Favorites</button>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search Channels..." onkeyup="searchChannels()">
</div>

<div id="channelList" class="channels"></div>

<script>

let channels=[];
let filtered=[];

const feeds=[
'https://iptv-org.github.io/iptv/index.m3u'
];

async function loadFeeds(){

channels=[];

for(const url of feeds){

const txt=await fetch(url).then(r=>r.text());

parseM3U(txt);

}

filtered=[...channels];

renderChannels();

}

function parseM3U(data){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

channels.push({
name:lines[i].split(',').pop(),
url:lines[i+1]
});

}

}

}

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filtered.forEach(ch=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`<strong>${ch.name}</strong>`;

div.onclick=()=>playChannel(ch.url);

box.appendChild(div);

});

}

function playChannel(url){

const video=document.getElementById('video');

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

function searchChannels(){

const q=document
.getElementById('search')
.value
.toLowerCase();

filtered=channels.filter(c=>
c.name.toLowerCase().includes(q)
);

renderChannels();

}

function shuffleChannels(){

filtered.sort(()=>Math.random()-0.5);

renderChannels();

}

function toggleTheme(){

document.body.classList.toggle('light');

}

loadFeeds();

</script>

</body>
</html>
