```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV WORLD PRO MAX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
height:100vh;
overflow:hidden;
}

#timerBar{
position:fixed;
top:10px;
right:10px;
background:#00d4ff;
color:#000;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
z-index:1000;
}

#authBox,
#upgradeBox{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
z-index:999;
}

.card{
width:340px;
padding:25px;
background:#0d1324;
border-radius:12px;
text-align:center;
border:1px solid #1f355d;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:6px;
background:#111d39;
color:#fff;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#00d4ff;
cursor:pointer;
font-weight:bold;
}

.main{
display:none;
height:100vh;
padding:20px;
}

.logo{
font-size:28px;
font-weight:900;
color:#00d4ff;
margin-bottom:15px;
}

.player{
height:300px;
background:black;
border-radius:10px;
margin-bottom:15px;
overflow:hidden;
}

video{
width:100%;
height:100%;
}

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
overflow:auto;
height:calc(100vh - 420px);
}

.channel{
background:#101d39;
padding:15px;
border-radius:8px;
cursor:pointer;
}

.channel:hover{
border:1px solid #00d4ff;
}

</style>
</head>
<body>

<div id="timerBar">
Loading...
</div>

<div id="authBox">

<div class="card">

<h2>🔐 BTECH-TV Login</h2>

<input id="email" placeholder="Email">

<input id="password"
type="password"
placeholder="Password">

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

</div>

</div>

<div id="upgradeBox" style="display:none">

<div class="card">

<h1>🔒 Trial Expired</h1>

<p style="margin:15px">
Upgrade to continue watching channels
</p>

<button onclick="unlockChannels()">
🚀 UPGRADE NOW
</button>

</div>

</div>

<div class="main" id="main">

<div class="logo">
📺 BTECH-TV WORLD PRO MAX
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

const TRIAL_TIME=24*60*60*1000;

const channels=[

{
name:"News TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Sports TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Movie TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Kids TV",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}

];

function register(){

let e=email.value;
let p=password.value;

if(!e||!p){

alert("Fill all fields");
return;

}

localStorage.setItem(
"user",
JSON.stringify({e,p})
);

alert("Registered");

}

function login(){

let e=email.value;
let p=password.value;

let u=JSON.parse(
localStorage.getItem("user")
);

if(!u||u.e!==e||u.p!==p){

alert("Invalid Login");
return;

}

authBox.style.display="none";
main.style.display="block";

if(localStorage.getItem("premium")==="true"){

timerBar.innerHTML=
"🔓 PREMIUM ACTIVE";

renderChannels();

return;

}

if(!localStorage.getItem("startTime")){

localStorage.setItem(
"startTime",
Date.now()
);

}

renderChannels();

startTimer();

}

function startTimer(){

setInterval(()=>{

let start=
localStorage.getItem("startTime");

let remain=
TRIAL_TIME-(Date.now()-start);

if(remain<=0){

main.style.display="none";

upgradeBox.style.display="flex";

return;

}

let h=Math.floor(
remain/3600000
);

let m=Math.floor(
remain%3600000/60000
);

let s=Math.floor(
remain%60000/1000
);

timerBar.innerHTML=
`⏳ ${h}h ${m}m ${s}s`;

},1000);

}

function unlockChannels(){

localStorage.setItem(
"premium",
"true"
);

upgradeBox.style.display="none";

main.style.display="block";

timerBar.innerHTML=
"🔓 PREMIUM ACTIVE";

}

function renderChannels(){

grid.innerHTML="";

channels.forEach(c=>{

let div=document.createElement(
"div"
);

div.className="channel";

div.innerHTML=c.name;

div.onclick=()=>{

video.src=c.url;
video.play();

};

grid.appendChild(div);

});

}

</script>

</body>
</html>
```
