<!-- =========================================
BTECH-TV PRO 100K SUPER ADMIN + QUIZ ENGINE
QUIZ CHANNEL + 1000 QUESTION SYSTEM
========================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH SUPER QUIZ ADMIN</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--good:#16a34a;
--bad:#dc2626;
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}

.topbar{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
}

.container{display:flex;height:calc(100vh - 60px);}

.sidebar{
width:260px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.menu{
padding:12px;
margin:8px 0;
background:var(--card);
cursor:pointer;
border-radius:8px;
}

.main{flex:1;padding:15px;overflow:auto;}

.quizCard{
background:var(--card);
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

.option{
padding:10px;
margin:6px 0;
background:#0f1628;
border-radius:8px;
cursor:pointer;
}

.adminBox{
background:#0f1628;
padding:10px;
border-radius:10px;
}

button{
padding:10px;
margin-top:8px;
background:var(--accent);
border:none;
color:#000;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<h2>🎯 SUPER QUIZ ADMIN + CHANNEL ENGINE</h2>
<div id="user"></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="openQuiz()">🧠 Quiz Channel</div>
<div class="menu" onclick="openMillionaire()">💰 Millionaire Mode</div>
<div class="menu" onclick="openAdd()">➕ Add Question</div>
<div class="menu" onclick="openBank()">📚 Question Bank</div>
<div class="menu" onclick="openWinners()">🏆 Winners</div>
<div class="menu" onclick="openPayments()">💳 Payment Approval</div>
<div class="menu" onclick="generate1000()">⚡ Generate 1000 Quiz</div>

</div>

<!-- MAIN -->
<div class="main" id="main"></div>

</div>

<script>

/* =========================
STATE
========================= */

let user={name:"Admin",role:"admin"};

let questions=[];

let score=0;
let index=0;

let winners=[];
let payments=[];

/* =========================
AUTO 1000 QUIZ ENGINE
========================= */

function generate1000(){

questions = [];

let topics=["Math","Science","Sports","History","Tech","Movies"];

for(let i=1;i<=1000;i++){

let t = topics[i % topics.length];

questions.push({
q:`${t} Question ${i}: What is ${i} + 10?`,
options:[`${i+10}`,`${i+5}`,`${i+1}`,`${i+20}`],
answer:`${i+10}`,
type:"mcq"
});

}

alert("✅ 1000 Quiz Questions Generated!");
}

/* =========================
QUIZ CHANNEL
========================= */

function openQuiz(){

index=0;
score=0;

renderQuiz();

}

function renderQuiz(){

if(questions.length===0){
document.getElementById("main").innerHTML="⚠ Generate quiz first";
return;
}

let q=questions[index];

document.getElementById("main").innerHTML=`
<div class="quizCard">

<h3>🧠 Quiz ${index+1}/1000</h3>
<h2>${q.q}</h2>

${q.options.map(o=>
`<div class="option" onclick="answer('${o}')">${o}</div>`
).join("")}

<p>Score: ${score}</p>

</div>
`;
}

function answer(val){

if(val===questions[index].answer){
score++;
}

index++;

if(index>=questions.length){

winners.push({
name:user.name,
score:score,
time:new Date().toLocaleString()
});

document.getElementById("main").innerHTML=
`<h2>🏁 Finished</h2><h3>Score: ${score}</h3>`;

return;
}

renderQuiz();
}

/* =========================
MILLIONAIRE MODE
========================= */

function openMillionaire(){

document.getElementById("main").innerHTML=`
<div class="quizCard">
<h2>💰 WHO WANTS TO BE A MILLIONAIRE</h2>
<button onclick="startMillionaire()">Start Game</button>
</div>
`;
}

function startMillionaire(){

index=0;
score=0;
renderQuiz();
}

/* =========================
ADD QUESTION
========================= */

function openAdd(){

document.getElementById("main").innerHTML=`
<div class="adminBox">

<h3>➕ Add Question</h3>

<input id="q" placeholder="Question"><br>
<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">
<input id="ans" placeholder="Answer">

<button onclick="addQ()">Add</button>

</div>
`;
}

function addQ(){

questions.push({
q:q.value,
options:[o1.value,o2.value,o3.value,o4.value],
answer:ans.value
});

alert("Question Added");
}

/* =========================
QUESTION BANK
========================= */

function openBank(){

document.getElementById("main").innerHTML=
questions.slice(0,50).map((q,i)=>
`<div class="quizCard">
<b>${i+1}. ${q.q}</b>
</div>`
).join("");
}

/* =========================
WINNERS
========================= */

function openWinners(){

document.getElementById("main").innerHTML=
winners.map(w=>
`<div class="quizCard">
🏆 ${w.name} - Score: ${w.score} - ${w.time}
</div>`
).join("");
}

/* =========================
PAYMENT APPROVAL
========================= */

function openPayments(){

document.getElementById("main").innerHTML=`
<div class="quizCard">

<h3>💳 Payment Requests</h3>

<div id="payList"></div>

</div>
`;

payments.forEach((p,i)=>{

let div=document.createElement("div");
div.className="quizCard";
div.innerHTML=`
👤 ${p.name} - ₦${p.amount}
<button onclick="approve(${i})">Approve</button>
`;

document.getElementById("payList").appendChild(div);

});

}

function approve(i){

alert("💰 Payment Approved!");
payments.splice(i,1);
openPayments();
}

/* =========================
FAKE PAYMENT REQUEST
========================= */

setInterval(()=>{

if(Math.random()>0.7){

payments.push({
name:"User"+Math.floor(Math.random()*100),
amount:Math.floor(Math.random()*50000)
});

}

},5000);

</script>

</body>
</html>
