<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV SAAS 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* ===== BASE ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* ===== LOGIN ===== */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;align-items:center;justify-content:center;z-index:99999;
}

.auth{
background:#0d1324;padding:20px;border-radius:12px;width:320px;
border:1px solid #1d2b4f;
}

.auth input{
width:100%;padding:10px;margin:8px 0;
background:#111a31;border:none;color:#fff;border-radius:8px;
}

.auth button{
width:100%;padding:10px;margin-top:8px;
background:#00d4ff;border:none;border-radius:8px;
cursor:pointer;font-weight:bold;
}

/* ===== EXPIRED ===== */
#expired{
position:fixed;inset:0;background:#000;
display:none;align-items:center;justify-content:center;
flex-direction:column;z-index:99999;
}

#expired button{
margin-top:15px;padding:12px 20px;
background:red;border:none;color:#fff;border-radius:8px;
cursor:pointer;
}

/* ===== SIDEBAR ===== */
.sidebar{
width:280px;background:#0d1324;padding:15px;overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}

.nav-btn{
width:100%;padding:10px;margin:5px 0;
background:#121c33;border:none;border-radius:8px;
color:#fff;cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;padding:10px;}

.topbar{display:flex;justify-content:space-between;}

.search-box input{
padding:10px;border-radius:8px;border:none;
background:#101a31;color:#fff;width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px}

/* ===== HERO ===== */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;border-radius:10px;margin:10px 0;
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* ===== PLAYER ===== */
.player-container{background:#000;height:320px;border-radius:10px;}
video{width:100%;height:100%;}

/* ===== CHANNELS ===== */
.channels{
flex:1;overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;margin-top:10px;
}

.card{
background:#111a31;padding:10px;border-radius:10px;
cursor:pointer;border:1px solid #1f355d;
}
.card:hover{border-color:#00d4ff;transform:scale(1.03);}

.badge{float:right;background:red;padding:3px 6px;font-size:10px;border-radius:10px;}

/* ===== LOCK ===== */
.locked{filter:blur(6px);pointer-events:none;opacity:0.5;}

.upgradeBox{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111a31;padding:20px;
border-radius:12px;text-align:center;
display:none;z-index:9999;
}

.upgradeBox button{
margin-top:10px;padding:10px 15px;
background:#00d4ff;border:none;color:#000;
border-radius:8px;cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
<div class="auth">
<h3>📺 IPTV SAAS LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register (3-Day Trial)</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- EXPIRED -->
<div id="expired">
<h1>⛔ TRIAL EXPIRED</h1>
<p>Upgrade to continue watching IPTV</p>
<button onclick="upgrade()">💳 Paystack Upgrade</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="ui">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>

<div class="nav-btn" onclick="adminView()">👨‍💼 Admin Panel</div>

</div>

<!-- MAIN -->
<div class="main" id="uiMain">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search channels...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX SAAS</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">🌍 Live <div id="live">0</div></div>
<div class="stat">⭐ Fav <div id="fav">0</div></div>
<div class="stat">⚫ Dead <div id="dead">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

<div class="upgradeBox" id="upgradeBox">
<h3>Upgrade Required</h3>
<button onclick="upgrade()">Paystack Checkout</button>
</div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* ===== TRIAL ===== */
function now(){return Date.now();}

function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(!email||!pass){alert("Fill fields");return;}

localStorage.setItem("user",JSON.stringify({
email,pass,start:now(),trialDays:3
}));

login();
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u){alert("Register first");return;}

let diff=(now()-u.start)/(1000*60*60*24);

if(diff>3){
document.getElementById("authBox").style.display="none";
document.getElementById("expired").style.display="flex";
document.getElementById("ui").classList.add("locked");
document.getElementById("uiMain").classList.add("locked");
document.getElementById("upgradeBox").style.display="block";
return;
}

document.getElementById("authBox").style.display="none";
loadUltra();
}

function logout(){localStorage.removeItem("user");location.reload();}

/* ===== UPGRADE (PAYSTACK MOCK) ===== */
function upgrade(){
alert("Redirecting to Paystack payment gateway...");
}

/* ===== IPTV ===== */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((l,idx,arr)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=arr[idx+1];
if(url && url.startsWith("http")) all.push({name,url});
}
});

filtered=[...all];
render();stats();
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
}

/* ADMIN SIM */
function adminView(){
alert("Admin Panel (demo): users stored in localStorage");
console.log(localStorage);
}

</script>

</body>
</html>
