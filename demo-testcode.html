<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD IPTV PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#050816;
  color:#fff;
}

/* HEADER */
header{
  background:#0b1430;
  padding:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#00e5ff;
}

/* LAYOUT */
.container{
  display:flex;
  flex-wrap:wrap;
}

/* SIDEBAR */
.sidebar{
  width:320px;
  background:#0a1024;
  height:100vh;
  overflow-y:auto;
  padding:10px;
}

/* PLAYER */
.player{
  flex:1;
  padding:10px;
}

video{
  width:100%;
  background:black;
  border-radius:10px;
}

/* ITEMS */
.section-title{
  margin:10px 0;
  color:#00e5ff;
  font-size:14px;
}

.item{
  background:#111a33;
  padding:8px 10px;
  margin:5px 0;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.item:hover{
  background:#1a2a55;
}

.num{
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  padding:2px 6px;
  border-radius:5px;
  font-size:11px;
}

/* MOBILE */
@media(max-width:900px){
  .container{flex-direction:column;}
  .sidebar{width:100%;height:auto;}
}
</style>
</head>

<body>

<header>📺 BTECH-TV WORLD IPTV PRO MAX 2026</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="section-title">🌍 Countries</div>
    <div id="countries"></div>

    <div class="section-title">🎬 Categories</div>
    <div id="categories"></div>

    <div class="section-title">🗣 Languages</div>
    <div id="languages"></div>

    <div class="section-title">🔥 Tools</div>
    <div id="tools"></div>

  </div>

  <!-- PLAYER -->
  <div class="player">
    <video id="video" controls></video>
  </div>

</div>

<script>
// ================= DATA =================
const countries = [
"🇳🇬 Nigeria","🇺🇸 USA","🇬🇧 UK","🇮🇳 India","🇫🇷 France","🇩🇪 Germany",
"🇧🇷 Brazil","🇿🇦 South Africa","🇨🇦 Canada","🇦🇺 Australia","🇯🇵 Japan",
"🇰🇷 South Korea","🇨🇳 China","🇪🇸 Spain","🇮🇹 Italy","🇹🇷 Turkey",
"🇲🇽 Mexico","🇦🇪 UAE","🇸🇦 Saudi Arabia","🇪🇬 Egypt","🇦🇷 Argentina",
"🇵🇰 Pakistan","🇮🇩 Indonesia","🇵🇭 Philippines","🇦🇱 Albania"
];

const categories = [
"📰 News","⚽ Sports","🎬 Movies","🎵 Music","👶 Kids",
"😂 Comedy","📚 Documentary","💼 Business","🔬 Science","✈ Travel"
];

const languages = [
"🇬🇧 English","🇪🇸 Spanish","🇸🇦 Arabic","🇫🇷 French","🇮🇳 Hindi",
"🇨🇳 Chinese","🇵🇹 Portuguese"
];

const tools = [
"📡 Scan","⚡ Boost","📺 PiP","🛠 Repair","🚀 Ultra Feeds","🚪 Logout"
];

// ================= RENDER FUNCTION =================
function render(list, id){
  const box = document.getElementById(id);
  box.innerHTML = "";

  list.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<span class="num">${i+1}</span> ${name}`;
    box.appendChild(div);
  });
}

// ================= INIT =================
render(countries,"countries");
render(categories,"categories");
render(languages,"languages");
render(tools,"tools");

// ================= IPTV PLAYER (HLS) =================
const video = document.getElementById('video');

function playStream(url){
  if(Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }
}

// Example test stream (replace with real IPTV links)
playStream("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8");
</script>

</body>
</html>
