<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚀 RELOAD IPTV DASHBOARD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* LOGIN */
#lock{
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
z-index:9999;
}
#lock input,#lock button{
padding:10px;margin:5px;border-radius:8px;border:none;width:220px;
}
#lock button{background:var(--accent);cursor:pointer}

/* TOPBAR */
.topbar{
height:65px;background:var(--panel);
display:flex;justify-content:space-between;align-items:center;
padding:0 20px;
}
.topbar h2{color:var(--accent)}
.topbar input{
padding:10px;border:none;border-radius:8px;
background:#0f1628;color:white;width:260px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px)}

.sidebar{
width:240px;background:#0f1628;
padding:15px;overflow-y:auto;
}

.cat{
padding:12px;margin:8px 0;
background:var(--card);
border-radius:8px;cursor:pointer;
}
.cat:hover{background:var(--hover)}
.active{background:var(--accent);color:black}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;padding:15px;
}
.box{
background:var(--card);
padding:12px;border-radius:10px;text-align:center;
}
.box p{color:var(--accent);font-size:18px;font-weight:bold}

/* GRID */
.grid{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

/* CARD */
.card{
background:var(--card);
padding:12px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}
.card:hover{background:var(--hover)}

/* PLAYER */
.player{
position:fixed;
right:0;top:65px;
width:320px;height:calc(100vh - 65px);
background:#000;
display:flex;flex-direction:column;
}
video{width:100%;height:180px}
.list{overflow:auto;flex:1;padding:8px}
.item{padding:6px;background:#1f2937;margin:5px;border-radius:6px;cursor:pointer}

/* BUTTON */
button{
padding:8px;
margin-top:6px;
border:none;
border-radius:8px;
background:var(--accent);
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="lock">
<h2>🔐 RELOAD IPTV LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="msg"></p>
</div>

<!-- TOPBAR -->
<div class="topbar">
<h2>🚀 RELOAD IPTV DASHBOARD</h2>
<input placeholder="Search..." oninput="searchAll(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat active" onclick="setView('users',this)">👥 Users</div>
<div class="cat" onclick="setView('channels',this)">📺 IPTV Channels</div>

<hr style="opacity:0.2;margin:10px 0">

<button onclick="generateUsers()">Generate Users</button>
<button onclick="init()">🔄 Reload IPTV</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="stats">
<div class="box"><p id="t1">0</p><small>Users</small></div>
<div class="box"><p id="t2">0</p><small>Channels</small></div>
<div class="box"><p id="t3">0</p><small>Alive</small></div>
<div class="box"><p id="t4">0</p><small>Banned</small></div>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<!-- PLAYER -->
<div class="player">
<video id="player" controls></video>
<div class="list" id="list"></div>
</div>

<script>

/* LOGIN */
const ADMIN="admin";
const PASS=btoa("1234");

function login(){
if(user.value===ADMIN && btoa(pass.value)===PASS){
lock.style.display="none";
init();
}else msg.innerText="❌ Wrong login";
}

/* STATE */
let users=[];
let all=[];
let filteredUsers=[];
let filtered=[];
let view="users";
let alive={},dead={};

/* USERS */
function generateUsers(){
users=[];
for(let i=1;i<=200;i++){
users.push({
id:i,
name:"User_"+i,
email:"user"+i+"@mail.com",
status:i%10===0?"banned":"active",
vip:i%7===0
});
}
filteredUsers=[...users];
render();
}

/* IPTV LOAD */
async function init(){
try{
let [ch,st]=await Promise.all([
fetch("https://iptv-org.github.io/api/channels.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json())
]);

let map={};
ch.forEach(c=>map[c.id]=c);

all=[];
let seen={};

st.forEach(s=>{
if(!s.url||seen[s.url])return;
seen[s.url]=1;

let c=s.channel?map[s.channel]:null;

all.push({
id:all.length+1,
n:c?c.name:(s.title||"Unknown"),
u:s.url,
cc:c?c.country:"Global"
});
});

filtered=[...all];

document.getElementById("t2").innerText=all.length;
render();
renderList();

}catch(e){
console.log(e);
}
}

/* VIEW */
function setView(v,el){
view=v;
document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
el.classList.add("active");
render();
}

/* SEARCH */
function searchAll(q){
q=q.toLowerCase();

if(view==="users"){
filteredUsers=users.filter(u=>
u.name.toLowerCase().includes(q)||
u.email.toLowerCase().includes(q)
);
}else{
filtered=all.filter(c=>
c.n.toLowerCase().includes(q)
);
}
render();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

if(view==="users"){
filteredUsers.forEach(u=>{
g.innerHTML+=`
<div class="card">
<h3>👤 ${u.name}</h3>
<p>${u.email}</p>
<span>${u.status}</span>
</div>`;
});
}else{
filtered.slice(0,200).forEach(c=>{
g.innerHTML+=`
<div class="card">
<h3>📺 ${c.n}</h3>
<p>${c.cc}</p>
<button onclick="play(${c.id})">▶ Play</button>
</div>`;
});
}
updateStats();
}

/* PLAY */
function play(id){
let c=all.find(x=>x.id===id);
let v=document.getElementById("player");

if(!c)return;

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(c.u);
h.attachMedia(v);
}else v.src=c.u;

v.play();
renderList();
}

/* LIST */
function renderList(){
list.innerHTML="";
all.slice(0,50).forEach(c=>{
list.innerHTML+=`
<div class="item" onclick="play(${c.id})">
📺 ${c.n}
</div>`;
});
}

/* STATS */
function updateStats(){
document.getElementById("t1").innerText=users.length;
document.getElementById("t2").innerText=all.length;
document.getElementById("t3").innerText=Object.keys(alive).length;
document.getElementById("t4").innerText=users.filter(u=>u.status==="banned").length;
}

</script>

</body>
</html>
