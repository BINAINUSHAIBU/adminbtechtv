<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;
}
.auth-card{
background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;border:1px solid #1d2b4f;
}
.auth-card input{
width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#101a31;color:#fff;
}
.auth-card button{
width:100%;padding:10px;margin-top:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:280px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;
}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{background:linear-gradient(135deg,#07132f,#0f1d45);padding:10px;border-radius:10px;margin-bottom:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* PLAYER */
.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;flex-shrink:0;}
video{width:100%;height:100%;}

/* CHANNELS */
.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}
.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}
.card:hover{border-color:#00d4ff;}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

/* TIMER */
#timerBar{
position:fixed;
top:10px;
right:10px;
background:#00d4ff;
color:#000;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
z-index:999;
}

/* UPGRADE */
.modal{
position:fixed;inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}
.modal-box{
background:#0d1324;
padding:20px;
border-radius:12px;
width:320px;
border:1px solid #1d2b4f;
}
.modal-box select,
.modal-box input{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
background:#101a31;
color:#fff;
}
.modal-box button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#00d4ff;
cursor:pointer;
}
.upgradeBtn{
display:none;
width:100%;
padding:10px;
margin-top:10px;
background:#ffb300;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="timerBar">Trial: 60s</div>

<!-- AUTH -->
<div id="authBox">
  <div class="auth-card">
    <h3>🔐 LOGIN</h3>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- UPGRADE -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>💳 Upgrade Plan</h3>

    <select id="package">
      <option value="premium">Premium</option>
      <option value="super">Super Premium</option>
      <option value="unlimited">Unlimited</option>
    </select>

    <input id="bank" placeholder="Bank Name">
    <input id="acc" placeholder="Account Number">
    <input id="name" placeholder="Account Name">

    <button onclick="pay()">Proceed Payment</button>
    <button onclick="closeModal()" style="background:red">Cancel</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH-TV PRO MAX</div>

<button class="nav-btn" onclick="loadUltra()">🌍 Global Channels</button>

<button class="upgradeBtn" id="upgradeBtn" onclick="openModal()">
⬆ Upgrade Required
</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search...">
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>IPTV DASHBOARD</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ <div id="fav">0</div></div>
<div class="stat">⚫ <div id="dead">0</div></div>
<div class="stat">🌍 <div id="live">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");

const TRIAL_TIME = 60000; // ✅ 1 MINUTE TRIAL

function login(){
if(!localStorage.getItem("start")){
localStorage.setItem("start",Date.now());
}
authBox.style.display="none";
startTimer();
loadUltra();
}

/* TIMER */
function startTimer(){
setInterval(()=>{
let start=localStorage.getItem("start");
if(!start)return;

let left=TRIAL_TIME-(Date.now()-start);

if(left<=0 && !localStorage.getItem("premium")){
document.getElementById("upgradeBtn").style.display="block";
timerBar.innerText="⛔ Trial Expired";
return;
}

timerBar.innerText=`Trial Left: ${Math.max(0,Math.floor(left/1000))} sec`;
},1000);
}

/* UPGRADE */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}

function pay(){
localStorage.setItem("premium",document.getElementById("package").value);
alert("✔ Payment Successful (DEMO)");
document.getElementById("upgradeBtn").style.display="none";
modal.style.display="none";
timerBar.innerText="🔓 PREMIUM ACTIVE";
}

/* IPTV */
async function loadUltra(){
loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((l,idx,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=a[idx+1];
if(url?.startsWith("http")) all.push({name,url});
}
});

filtered=[...all];
render();
stats();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class='badge'>LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function stats(){
total.innerText=all.length;
live.innerText=all.length;
dead.innerText=0;
fav.innerText=0;
}

loadUltra();

</script>

</body>
</html>
