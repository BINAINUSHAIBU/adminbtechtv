<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV PRO MAX SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--danger:#ef4444;
--warn:#f59e0b;
--ok:#22c55e;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
z-index:9999;
}

.login-box{
background:var(--panel);
padding:20px;
border-radius:10px;
width:300px;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#0f1628;
color:#fff;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent)}
.danger{background:var(--danger);color:#fff}

/* TOP */
.topbar{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
background:var(--panel);
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:230px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:250px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
position:relative;
}

.badge{
font-size:11px;
padding:3px 6px;
border-radius:20px;
}

.locked{background:var(--warn)}
.unlocked{background:var(--ok)}
.paid{background:var(--danger)}

/* RIGHT */
.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h3>🔐 BTECH ADMIN LOGIN</h3>

<input id="user" placeholder="Username">
<select id="role">
<option value="superadmin">Super Admin</option>
<option value="admin">Admin</option>
</select>

<button class="primary" onclick="login()">LOGIN</button>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h3>🚀 PRO MAX DASHBOARD</h3>
<div id="roleText"></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h4>➕ Add Channel</h4>

<input id="cname" placeholder="Channel Name">
<input id="curl" placeholder="Stream URL">

<button class="primary" onclick="addChannel()">Add</button>

<button onclick="filterAll()">All</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterPaid()">Paid</button>

<input placeholder="Search..." oninput="search(this.value)">

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="list" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h4>⚙ Actions</h4>

<button class="primary" onclick="lockSelected()">Lock Selected</button>
<button class="primary" onclick="unlockSelected()">Unlock Selected</button>
<button class="danger" onclick="deleteSelected()">Delete Selected</button>

<h4>📊 Stats</h4>
<p>Total: <span id="t"></span></p>
<p>Locked: <span id="l"></span></p>
<p>Paid: <span id="p"></span></p>

</div>

</div>

<script>

/* =====================
AUTH
===================== */

let role="";

function login(){

role=document.getElementById("role").value;

document.getElementById("login").style.display="none";

document.getElementById("roleText").innerText=
"Role: "+role.toUpperCase();

}

/* =====================
DB
===================== */

let channels=[];
let filtered=[];
let selected=new Set();
let index=0;

/* LOAD */
function init(){

let data=localStorage.getItem("btech_promax");

if(data){
channels=JSON.parse(data);
}else{
generate();
}

filtered=[...channels];
render();
stats();

}

/* GENERATE */
function generate(){

for(let i=1;i<=120;i++){

channels.push({
id:i,
name:"BTECH TV "+i,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
status:i%7===0?"locked":"unlocked",
type:i%5===0?"paid":"free"
});

}

}

/* SAVE */
function save(){
localStorage.setItem("btech_promax",JSON.stringify(channels));
}

/* RENDER */
function render(){

let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<input type="checkbox" onchange="toggle(${c.id})">
<b>${c.name}</b><br>
<span class="badge ${c.status}">${c.status}</span>
<span class="badge ${c.type}">${c.type}</span>
`;

div.onclick=()=>play(i);

box.appendChild(div);

});

}

/* TOGGLE */
function toggle(id){

if(selected.has(id)) selected.delete(id);
else selected.add(id);

}

/* PLAY */
function play(i){

let c=filtered[i];

let v=document.getElementById("video");

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);
}else{
v.src=c.url;
}

}

/* ADD */
function addChannel(){

channels.push({
id:Date.now(),
name:document.getElementById("cname").value,
url:document.getElementById("curl").value,
status:"unlocked",
type:"free"
});

refresh();

}

/* FILTERS */
function filterAll(){filtered=[...channels];render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* SEARCH */
function search(v){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* ACTIONS */
function lockSelected(){
channels.forEach(c=>{
if(selected.has(c.id)) c.status="locked";
});
refresh();
}

function unlockSelected(){
channels.forEach(c=>{
if(selected.has(c.id)) c.status="unlocked";
});
refresh();
}

function deleteSelected(){
channels=channels.filter(c=>!selected.has(c.id));
refresh();
}

/* REFRESH */
function refresh(){
filtered=[...channels];
save();
render();
stats();
}

/* STATS */
function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="paid").length;
}

/* BOOT */
init();

</script>

</body>
</html>
