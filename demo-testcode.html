```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Channels - WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
}

header{
background:#0d1226;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.search-bar{
padding:15px;
background:#111827;
}

.search-bar input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
font-size:16px;
}

.player{
padding:15px;
background:black;
}

video{
width:100%;
height:500px;
border-radius:10px;
background:black;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
padding:15px;
}

.stat{
background:#111827;
padding:15px;
border-radius:10px;
text-align:center;
}

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
padding:15px;
}

.channel{
background:#111827;
padding:15px;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
transform:translateY(-5px);
background:#1f2937;
}

.name{
font-size:16px;
font-weight:bold;
}
</style>
</head>
<body>

<header>
ALL CHANNELS
</header>

<div class="search-bar">
<input type="text" id="search" placeholder="Search channels...">
</div>

<div class="stats">
<div class="stat">
<h2 id="channelCount">0</h2>
<p>Total Channels</p>
</div>

<div class="stat">
<h2 id="playing">0</h2>
<p>Now Playing</p>
</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="channels" id="channelList"></div>

<script>

const m3uPlaylist = `

#EXTM3U

# Paste the FULL playlist from tvnewdoc.docx here

#EXTINF:-1,ESPN 2
https://example.com/espn2.m3u8

#EXTINF:-1,NBA TV
https://example.com/nbatv.m3u8

#EXTINF:-1,CNN
https://example.com/cnn.m3u8

#EXTINF:-1,FOX SPORTS
https://example.com/foxsports.m3u8

`;

const channels=[];

function parseM3U(){

const lines=m3uPlaylist.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

channels.push({
name:lines[i].split(',').pop().trim(),
url:(lines[i+1]||'').trim()
});

}

}

document.getElementById("channelCount").innerText =
channels.length;

renderChannels(channels);

}

function renderChannels(list){

const box =
document.getElementById("channelList");

box.innerHTML='';

list.forEach(channel=>{

const div=document.createElement("div");

div.className="channel";

div.innerHTML=
`<div class="name">${channel.name}</div>`;

div.onclick=()=>{
playChannel(channel.url);
};

box.appendChild(div);

});

}

function playChannel(url){

const video =
document.getElementById("video");

document.getElementById("playing").innerText = "1";

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src = url;

}

}

document.getElementById("search")
.addEventListener("input",function(){

const q =
this.value.toLowerCase();

renderChannels(

channels.filter(c=>
c.name.toLowerCase().includes(q)
)

);

});

parseM3U();

</script>

</body>
</html>
```
