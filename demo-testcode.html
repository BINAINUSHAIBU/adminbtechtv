<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO ULTRA MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
   ROOT SYSTEM
========================= */

:root{

--bg:#0b1020;
--panel:#111827;
--card:#1e293b;
--hover:#334155;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#22c55e;
--danger:#ef4444;
--warning:#f59e0b;

}

/* =========================
   GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

a{
text-decoration:none;
color:inherit;
}

/* =========================
   TOPBAR
========================= */

.topbar{

height:65px;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 20px;

background:var(--panel);

border-bottom:1px solid #1f2937;

position:sticky;
top:0;
z-index:999;

}

.logo{

font-size:20px;
font-weight:bold;
color:var(--accent);

}

.menu{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.menu button{

background:var(--card);
border:none;
padding:10px 14px;
border-radius:8px;
color:white;
cursor:pointer;
transition:.3s;

}

.menu button:hover{
background:var(--hover);
}

/* =========================
   LAYOUT
========================= */

.container{

display:flex;

height:calc(100vh - 65px);

}

/* =========================
   SIDEBAR
========================= */

.sidebar{

width:340px;
background:var(--panel);

display:flex;
flex-direction:column;

border-right:1px solid #1f2937;

}

/* =========================
   SIDEBAR HEADER
========================= */

.sidebar-header{

padding:15px;

border-bottom:1px solid #1f2937;

}

.sidebar-header h2{

font-size:18px;
color:var(--accent);
margin-bottom:8px;

}

.stats{

font-size:13px;
color:var(--muted);

}

/* =========================
   SEARCH
========================= */

.search-box{

padding:12px;

border-bottom:1px solid #1f2937;

}

.search-box input{

width:100%;

padding:12px;

background:#1e293b;
border:none;
outline:none;

border-radius:10px;

color:white;

}

/* =========================
   CHANNEL LIST
========================= */

.channel-list{

flex:1;

overflow-y:auto;

padding:10px;

}

/* =========================
   CHANNEL CARD
========================= */

.channel{

display:flex;
align-items:center;
gap:12px;

background:var(--card);

padding:12px;

border-radius:12px;

margin-bottom:10px;

cursor:pointer;

transition:.3s;

}

.channel:hover{

background:var(--hover);
transform:scale(1.01);

}

.channel img{

width:55px;
height:55px;

object-fit:cover;

border-radius:10px;

background:black;

}

.channel-info{

flex:1;
overflow:hidden;

}

.channel-name{

font-size:14px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.channel-meta{

font-size:12px;
color:var(--muted);

margin-top:5px;

}

.live{

font-size:11px;
color:var(--success);

}

/* =========================
   MAIN PLAYER
========================= */

.main{

flex:1;

display:flex;
flex-direction:column;

}

/* =========================
   PLAYER
========================= */

.player{

flex:1;

position:relative;

background:black;

display:flex;
align-items:center;
justify-content:center;

}

video{

width:100%;
height:100%;

object-fit:contain;

background:black;

}

/* =========================
   OVERLAY
========================= */

.overlay{

position:absolute;
inset:0;

background:rgba(0,0,0,.85);

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

z-index:5;

}

.overlay h1{

font-size:60px;
margin-bottom:15px;

}

.overlay p{

font-size:18px;
color:var(--muted);

}

/* =========================
   CONTROLS
========================= */

.controls{

height:90px;

background:var(--panel);

display:flex;
justify-content:space-between;
align-items:center;

padding:0 20px;

border-top:1px solid #1f2937;

}

.now-playing h3{

font-size:18px;
margin-bottom:5px;

}

.now-playing p{

font-size:13px;
color:var(--muted);

}

.control-buttons{

display:flex;
gap:10px;

}

.control-buttons button{

padding:12px 16px;

background:var(--card);

border:none;
border-radius:10px;

color:white;

cursor:pointer;

transition:.3s;

}

.control-buttons button:hover{

background:var(--hover);

}

/* =========================
   SETTINGS PANEL
========================= */

.settings{

position:fixed;

right:20px;
top:80px;

width:280px;

background:var(--panel);

padding:20px;

border-radius:14px;

border:1px solid #1f2937;

display:none;

z-index:9999;

}

.settings h3{

margin-bottom:15px;
color:var(--accent);

}

.settings label{

display:block;

margin-top:14px;
margin-bottom:5px;

font-size:13px;

}

.settings select{

width:100%;

padding:10px;

border:none;
outline:none;

border-radius:8px;

background:#1e293b;
color:white;

}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.sidebar{

position:absolute;

z-index:999;

height:100%;

width:100%;

}

.menu{
display:none;
}

.controls{

flex-direction:column;
justify-content:center;
gap:10px;

height:auto;
padding:15px;

}

}

</style>
</head>

<body>

<!-- =========================
     TOPBAR
========================= -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV PRO ULTRA MAX
</div>

<div class="menu">

<button onclick="filterCategory('ALL')">
All
</button>

<button onclick="filterCategory('SPORTS')">
Sports
</button>

<button onclick="filterCategory('MOVIES')">
Movies
</button>

<button onclick="filterCategory('NEWS')">
News
</button>

<button onclick="filterCategory('KIDS')">
Kids
</button>

<button onclick="toggleSettings()">
Settings
</button>

</div>

</div>

<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<div class="sidebar-header">

<h2>LIVE BTECH-TV CHANNELS</h2>

<div class="stats" id="stats">
Loading IPTV Sources...
</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search BTECH-TV Channels..."
onkeyup="searchChannels(this.value)"
>

</div>

<!-- CHANNEL LIST -->

<div
class="channel-list"
id="channelList"
></div>

</div>

<!-- =========================
     MAIN PLAYER
========================= -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<video
id="videoPlayer"
controls
autoplay
playsinline
></video>

<div
class="overlay"
id="overlay"
>

<h1>🚀</h1>

<p>
Initializing BTECH IPTV Engine...
</p>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<div class="now-playing">

<h3 id="channelName">
No Channel Selected
</h3>

<p id="channelGroup">
BTECH IPTV Streaming
</p>

</div>

<div class="control-buttons">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

</div>

</div>

</div>

</div>

<!-- =========================
     SETTINGS PANEL
========================= -->

<div
class="settings"
id="settingsBox"
>

<h3>System Settings</h3>

<label>Theme</label>

<select onchange="setTheme(this.value)">

<option value="dark">
Dark
</option>

<option value="blue">
Blue
</option>

<option value="green">
Green
</option>

</select>

<label>Auto Play</label>

<select onchange="autoPlay=this.value==='true'">

<option value="true">
ON
</option>

<option value="false">
OFF
</option>

</select>

<label>Stream Quality</label>

<select>

<option>
Auto
</option>

<option>
1080p
</option>

<option>
720p
</option>

<option>
480p
</option>

</select>

</div>

<!-- =========================
     SCRIPT
========================= -->

<script>

/* =========================
   IPTV PLAYLIST SOURCES
========================= */

const playlists = [

"https://iptv-org.github.io/iptv/index.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",

"https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u",

"https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u"

];

/* =========================
   GLOBAL STATE
========================= */

let allChannels = [];

let filteredChannels = [];

let currentIndex = 0;

let hls = null;

let autoPlay = true;

/* =========================
   LOAD PLAYLISTS
========================= */

async function loadPlaylists(){

const stats =
document.getElementById("stats");

stats.innerHTML =
"Loading IPTV playlists...";

const seen =
new Set();

for(const url of playlists){

try{

const res =
await fetch(url);

const text =
await res.text();

const parsed =
parseM3U(text);

parsed.forEach(ch=>{

if(
ch.url &&
!seen.has(ch.url)
){

seen.add(ch.url);

allChannels.push(ch);

}

});

stats.innerHTML =

`${allChannels.length.toLocaleString()} Channels Loaded`;

}catch(err){

console.log(
"FAILED:",
url
);

}

}

/* GENERATE VIRTUAL CHANNELS */

generateVirtualChannels();

filteredChannels =
allChannels;

renderChannels();

document.getElementById(
"overlay"
).style.display =
"none";

}

/* =========================
   VIRTUAL CHANNELS
========================= */

function generateVirtualChannels(){

const categories = [

"SPORTS",
"MOVIES",
"NEWS",
"KIDS",
"MUSIC",
"AFRICA",
"USA",
"UK"

];

for(let i=1;i<=10000;i++){

const cat =
categories[
i % categories.length
];

allChannels.push({

id:i,

name:
`${cat} LIVE ${i}`,

group:cat,

logo:
"https://via.placeholder.com/60",

url:
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

});

}

}

/* =========================
   PARSE M3U
========================= */

function parseM3U(text){

const lines =
text.split("\n");

const result = [];

let temp = {};

for(let line of lines){

line = line.trim();

if(
line.startsWith("#EXTINF")
){

temp = {

name:
line.match(/,(.*)/)?.[1]
|| "Unknown",

logo:
line.match(/tvg-logo="(.*?)"/)?.[1]
|| "",

group:
line.match(/group-title="(.*?)"/)?.[1]
|| "LIVE"

};

}

else if(
line.startsWith("http")
){

temp.url = line;

result.push(temp);

temp = {};

}

}

return result;

}

/* =========================
   RENDER CHANNELS
========================= */

function renderChannels(){

const list =
document.getElementById(
"channelList"
);

list.innerHTML = "";

filteredChannels
.slice(0,1000)
.forEach((channel,index)=>{

const div =
document.createElement("div");

div.className =
"channel";

div.innerHTML = `

<img
src="${
channel.logo ||
'https://via.placeholder.com/60'
}"
loading="lazy"
>

<div class="channel-info">

<div class="channel-name">
${channel.name}
</div>

<div class="channel-meta">
${channel.group}
</div>

</div>

<div class="live">
● LIVE
</div>

`;

div.onclick =
()=>playChannel(index);

list.appendChild(div);

});

}

/* =========================
   SEARCH CHANNELS
========================= */

function searchChannels(query){

filteredChannels =
allChannels.filter(channel=>

channel.name
.toLowerCase()
.includes(
query.toLowerCase()
)

||

channel.group
.toLowerCase()
.includes(
query.toLowerCase()
)

);

renderChannels();

}

/* =========================
   FILTER CATEGORY
========================= */

function filterCategory(category){

if(category==="ALL"){

filteredChannels =
allChannels;

}else{

filteredChannels =
allChannels.filter(channel=>

channel.group
.toUpperCase()
.includes(category)

);

}

renderChannels();

}

/* =========================
   PLAY CHANNEL
========================= */

function playChannel(index){

currentIndex = index;

const channel =
filteredChannels[index];

document.getElementById(
"channelName"
).innerText =
channel.name;

document.getElementById(
"channelGroup"
).innerText =
channel.group;

const video =
document.getElementById(
"videoPlayer"
);

if(hls){

hls.destroy();

hls = null;

}

if(Hls.isSupported()){

hls = new Hls({

enableWorker:true,
lowLatencyMode:true

});

hls.loadSource(
channel.url
);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

if(autoPlay){

video.play();

}

}
);

}else{

video.src =
channel.url;

if(autoPlay){

video.play();

}

}

}

/* =========================
   NEXT CHANNEL
========================= */

function nextChannel(){

currentIndex++;

if(
currentIndex >=
filteredChannels.length
){

currentIndex = 0;

}

playChannel(currentIndex);

}

/* =========================
   PREVIOUS CHANNEL
========================= */

function prevChannel(){

currentIndex--;

if(currentIndex < 0){

currentIndex =
filteredChannels.length - 1;

}

playChannel(currentIndex);

}

/* =========================
   SETTINGS
========================= */

function toggleSettings(){

const box =
document.getElementById(
"settingsBox"
);

box.style.display =

box.style.display==="block"
? "none"
: "block";

}

/* =========================
   THEMES
========================= */

function setTheme(theme){

if(theme==="blue"){

document.documentElement
.style.setProperty(
"--bg",
"#061a33"
);

}

else if(theme==="green"){

document.documentElement
.style.setProperty(
"--bg",
"#052e16"
);

}

else{

document.documentElement
.style.setProperty(
"--bg",
"#0b1020"
);

}

}

/* =========================
   START ENGINE
========================= */

loadPlaylists();

</script>

</body>
</html>
