<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>BTECH-TV WORLD ULTRA MAX X MOBILE APP</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#050816;
font-family:Arial,sans-serif;
overflow:hidden;
color:white;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

.topbar{
height:60px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
color:#00d4ff;
font-weight:bold;
font-size:18px;
}

.player{
height:35%;
background:black;
position:relative;
}

.player iframe,
.player video,
.player webview{
width:100%;
height:100%;
border:none;
}

.controls{
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
background:#0f172a;
}

.controls button{
background:#172033;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
white-space:nowrap;
}

.search{
padding:10px;
background:#111827;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#172033;
color:white;
}

.channels{
flex:1;
overflow:auto;
padding:10px;
display:grid;
grid-template-columns:1fr;
gap:10px;
background:#050816;
}

.channel{
background:#172033;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:#22304d;
}

.left{
display:flex;
align-items:center;
gap:10px;
overflow:hidden;
}

.left img{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
background:black;
}

.info{
overflow:hidden;
}

.info h4{
margin:0;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#94a3b8;
}

.badge{
padding:5px 10px;
background:#16a34a;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.footer{
height:45px;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
color:#94a3b8;
}

.mini-player{
position:fixed;
bottom:15px;
right:15px;
width:220px;
height:130px;
background:black;
display:none;
border-radius:12px;
overflow:hidden;
z-index:999;
}

.mini-player video{
width:100%;
height:100%;
object-fit:cover;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>

<body>

<div id="app">

<div class="topbar">
📺 BTECH-TV WORLD ULTRA MAX X
</div>

<div class="player">

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
></video>

</div>

<div class="controls">

<button onclick="loadUltraFeeds()">🚀 Ultra</button>
<button onclick="toggleFullscreen()">⛶ Full</button>
<button onclick="togglePiP()">📺 PiP</button>
<button onclick="shuffleChannels()">🎲 Shuffle</button>
<button onclick="toggleMiniPlayer()">🖥 Mini</button>
<button onclick="speedBoost()">⚡ Boost</button>
<button onclick="sleepTimer()">⏰ Sleep</button>
<button onclick="nextChannel()">▶ Next</button>

</div>

<div class="search">

<input
type="text"
placeholder="Search Channels..."
oninput="searchChannels(this.value)"
>

</div>

<div class="channels" id="channels"></div>

<div class="footer">
BTECH-TV WORLD ULTRA MAX X • MOBILE IPTV APP
</div>

</div>

<div class="mini-player" id="miniPlayer">
<video id="miniVideo" muted autoplay playsinline></video>
</div>

<script>

let channels=[];
let filtered=[];
let current=0;
let hls=null;

const video=document.getElementById('video');

const feeds=[

'https://iptv-org.github.io/iptv/index.m3u',
'https://iptv-org.github.io/iptv/categories/news.m3u',
'https://iptv-org.github.io/iptv/categories/sport.m3u',
'https://iptv-org.github.io/iptv/categories/movies.m3u',
'https://iptv-org.github.io/iptv/countries/ng.m3u',
'https://iptv-org.github.io/iptv/countries/us.m3u'

];

async function loadUltraFeeds(){

channels=[];

for(let url of feeds){

try{

const r=await fetch(url);
const t=await r.text();

parseM3U(t);

}catch(e){

console.log(e);

}

}

removeDuplicates();

filtered=[...channels];

render();

}

function parseM3U(data){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logo=
(info.match(/tvg-logo="(.*?)"/)||[])[1]
||
'https://via.placeholder.com/60';

channels.push({

name:name,
url:url,
logo:logo,
group:'LIVE TV'

});

}

}

}

function removeDuplicates(){

const seen=new Set();

channels=channels.filter(c=>{

const key=c.name+c.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

function render(){

const box=document.getElementById('channels');

box.innerHTML='';

filtered.forEach((c,i)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img src="${c.logo}">

<div class="info">

<h4>${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div class="badge">
LIVE
</div>

`;

div.onclick=()=>play(i);

box.appendChild(div);

});

}

function play(i){

current=i;

const ch=filtered[i];

if(!ch){
return;
}

if(hls){

hls.destroy();

}

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(ch.url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play();

});

}else{

video.src=ch.url;

video.play();

}

}

function searchChannels(q){

q=q.toLowerCase();

filtered=channels.filter(c=>

c.name.toLowerCase().includes(q)

);

render();

}

function nextChannel(){

current++;

if(current>=filtered.length){
current=0;
}

play(current);

}

function shuffleChannels(){

filtered.sort(()=>Math.random()-0.5);

render();

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

function speedBoost(){

video.playbackRate=1.15;

alert('Speed Boost Enabled');

}

function sleepTimer(){

setTimeout(()=>{

video.pause();

alert('Sleep Timer Finished');

},1800000);

alert('30 Minute Sleep Timer Started');

}

function toggleMiniPlayer(){

const mini=document.getElementById('miniPlayer');

if(mini.style.display==='block'){

mini.style.display='none';

}else{

mini.style.display='block';

document.getElementById('miniVideo').src=
video.currentSrc;

}

}

loadUltraFeeds();

</script>

</body>
</html>
