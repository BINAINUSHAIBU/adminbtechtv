<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV LOGIN DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN */
.login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#000;
flex-direction:column;
gap:10px;
}

.login input{
padding:10px;
width:200px;
border:none;
border-radius:8px;
}

.login button{
padding:10px 20px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer;
}

/* APP */
.app{
display:none;
width:100%;
height:100%;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#111827;
padding:10px;
overflow:auto;
}

.channel{
padding:10px;
margin:5px 0;
background:#172033;
border-radius:8px;
cursor:pointer;
position:relative;
}

.locked{
background:#ef4444;
}

.premium{
background:#8b5cf6;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

video{
width:100%;
height:350px;
background:black;
}

.topbar{
display:flex;
gap:10px;
padding:10px;
background:#0f172a;
}

button{
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div class="login" id="login">
<h2>🔐 BTECH-TV LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="sidebar" id="list"></div>

<div class="main">

<div class="topbar">
<button onclick="filter('all')">All</button>
<button onclick="filter('free')">Free</button>
<button onclick="filter('locked')">Locked</button>
<button onclick="unlockVIP()">💎 Unlock VIP</button>
<button onclick="logout()">Logout</button>
</div>

<video id="video" controls autoplay></video>

</div>
</div>

<script>

let userRole = "guest";

let channels = [
{name:"News HD", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type:"free"},
{name:"Sports Live", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type:"locked"},
{name:"Movies VIP", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type:"premium"},
{name:"Music TV", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type:"free"}
];

let filtered = [...channels];

const video = document.getElementById("video");

/* LOGIN SYSTEM */
function login(){

let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

if(u === "admin" && p === "admin123"){
userRole = "admin";
}

else if(u === "vip"){
userRole = "vip";
}

else{
userRole = "user";
}

localStorage.setItem("role", userRole);

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";

render();

}

/* LOAD ROLE */
function loadRole(){
let r = localStorage.getItem("role");
if(r){
userRole = r;
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";
render();
}
}

/* RENDER */
function render(){

let box = document.getElementById("list");
box.innerHTML="";

filtered.forEach((c)=>{

let div = document.createElement("div");
div.className="channel " + c.type;

div.innerHTML = `
<b>${c.name}</b><br>
<small>${c.type.toUpperCase()}</small>
`;

div.onclick = ()=>play(c);

box.appendChild(div);

});

}

/* PLAY CONTROL */
function play(c){

// LOCK LOGIC
if(c.type === "locked" && userRole !== "admin"){
alert("🔒 Locked Channel - VIP Required");
return;
}

if(c.type === "premium" && userRole !== "vip" && userRole !== "admin"){
alert("💎 Premium Channel - Upgrade Required");
return;
}

video.src = c.url;
video.play();

}

/* FILTERS */
function filter(type){

if(type === "all") filtered = channels;

if(type === "free") filtered = channels.filter(c=>c.type==="free");

if(type === "locked") filtered = channels.filter(c=>c.type==="locked");

render();

}

/* VIP UNLOCK */
function unlockVIP(){
if(userRole === "admin"){
channels.forEach(c=>{
if(c.type === "locked") c.type="free";
});
alert("ALL LOCKED CHANNELS UNLOCKED 🔓");
render();
}else{
alert("Admin Only Feature");
}
}

/* LOGOUT */
function logout(){
localStorage.removeItem("role");
location.reload();
}

loadRole();

</script>

</body>
</html>
