<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b0f1a">

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#243352;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
}

body{
display:flex;
flex-direction:column;
}

/* TOP */

.topbar{
height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 18px;
border-bottom:1px solid rgba(255,255,255,.05);
gap:10px;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
}

.top-buttons{
display:flex;
gap:10px;
overflow:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 16px;
border:none;
border-radius:10px;
background:var(--card);
color:#fff;
cursor:pointer;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:#000;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:16px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:360px;
background:#000;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
image-rendering:auto;
backface-visibility:hidden;
transform:translateZ(0);
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
text-align:center;
}

.overlay h1{
font-size:55px;
margin-bottom:10px;
}

.overlay p{
color:var(--muted);
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px 18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
}

.now-info h2{
font-size:18px;
margin-bottom:4px;
}

.now-info p{
font-size:13px;
color:var(--muted);
}

.clock{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* SEARCH */

.stats{
padding:8px 15px;
background:#0f172a;
font-size:12px;
color:var(--muted);
}

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
min-height:48px;
}

.search-box input{
flex:1;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
scroll-behavior:smooth;
}

.channel{
background:var(--card);
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
gap:10px;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:12px;
object-fit:cover;
background:#000;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.livebadge{
background:#2563eb;
}

.dead{
background:var(--danger);
}

.fav{
font-size:20px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* MOBILE */

@media(max-width:900px){

html,body{
overflow:auto;
}

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:260px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.channels{
grid-template-columns:1fr;
padding-bottom:120px;
}

.player{
height:250px;
}

.search-box{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">All</button>
<button onclick="setTab('favs',this)">⭐ Favorites</button>
<button onclick="setTab('recent',this)">🕘 Recent</button>
<button onclick="toggleTheme()">Theme</button>

</div>

</div>

<div class="container">

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">🇺🇸 USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">🇬🇧 UK</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">🎥 Movies</div>

<h3>🚀 Extra</h3>

<div class="cat" onclick="loadExtraPlaylists()">
🌍 Load Global Feeds
</div>

</div>

<div class="main">

<div class="player">

<div class="live">
🔴 LIVE HD
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
preload="auto"
crossorigin="anonymous"
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading Stable HD Channels...
</p>

</div>

</div>

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global IPTV Streaming
</p>

<div class="clock" id="clock"></div>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>
<button onclick="nextChannel()">Next ▶</button>
<button onclick="togglePiP()">📺 PiP</button>
<button onclick="shareChannel()">🔗 Share</button>

</div>

</div>

<div class="stats" id="stats">
0 Channels Loaded
</div>

<div class="search-box">

<input
type="text"
placeholder="Search Channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">
<option value="az">Sort A-Z</option>
<option value="za">Sort Z-A</option>
</select>

</div>

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;

const video=document.getElementById('video');

let favs=
JSON.parse(localStorage.getItem('favs')||'{}');

let recent=
JSON.parse(localStorage.getItem('recent')||'[]');

const extraFeeds=[

'https://iptv-org.github.io/iptv/index.m3u',
'https://iptv-org.github.io/iptv/index.country.m3u',
'https://iptv-org.github.io/iptv/index.category.m3u'

];

/* CLOCK */

function tick(){

document.getElementById('clock').innerText=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(tick,1000);

tick();

/* FLAGS */

function flag(cc){

if(!cc||cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* PLAYLIST */

async function loadPlaylist(url,group){

const overlay=document.getElementById('overlay');

overlay.style.display='flex';

document.getElementById('overlayText').innerText=
'Loading '+group+' Channels...';

all=[];

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,group);

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

overlay.style.display='none';

}catch(err){

alert('Failed To Load Playlist');

console.log(err);

}

}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url||!url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logo=
(info.match(/tvg-logo="(.*?)"/)||[])[1]||
'https://via.placeholder.com/60';

const country=
(info.match(/tvg-country="(.*?)"/)||[])[1]||'';

all.push({

id:all.length+1,
name,
url,
logo,
country,
group

});

}

}

}

function removeDuplicates(){

const seen=new Set();

all=all.filter(ch=>{

const key=ch.name+ch.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

/* EXTRA */

async function loadExtraPlaylists(){

for(let url of extraFeeds){

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,'Global Feed');

}catch(err){

console.log(err);

}

}

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

}

/* RENDER */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<span class="badge free">
HD
</span>

<span class="badge livebadge">
LIVE
</span>

<div
class="fav ${favs[c.id]?'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id]?'★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAYER */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

const overlay=document.getElementById('overlay');

overlay.style.display='flex';

document.getElementById('overlayText').innerText=
'Connecting Stable HD Stream...';

if(currentHls){

currentHls.destroy();

currentHls=null;

}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,

lowLatencyMode:false,

backBufferLength:90,

maxBufferLength:120,

maxMaxBufferLength:180,

liveSyncDurationCount:3,

manifestLoadingTimeOut:30000,

fragLoadingTimeOut:40000,

manifestLoadingMaxRetry:10,

fragLoadingMaxRetry:10,

capLevelToPlayerSize:true,

startLevel:-1,

testBandwidth:true,

progressive:true,

abrBandWidthFactor:0.95,

abrBandWidthUpFactor:0.7,

maxStarvationDelay:6,

maxLoadingDelay:6

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play().catch(()=>{});

overlay.style.display='none';

});

currentHls.on(Hls.Events.ERROR,function(event,data){

if(data.fatal){

switch(data.type){

case Hls.ErrorTypes.NETWORK_ERROR:

document.getElementById('overlayText').innerText=
'Reconnecting Stable Stream...';

currentHls.startLoad();

break;

case Hls.ErrorTypes.MEDIA_ERROR:

document.getElementById('overlayText').innerText=
'Repairing Video Stream...';

currentHls.recoverMediaError();

break;

default:

setTimeout(()=>{

playChannel(currentIndex);

},3000);

break;

}

}

});

}else{

video.src=channel.url;

video.play().catch(()=>{});

overlay.style.display='none';

}

addRecent(channel.id);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

q=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(q)

||

c.group.toLowerCase().includes(q)

);

renderChannels();

updateStats();

}

/* SORT */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'favs',
JSON.stringify(favs)
);

renderChannels();

}

/* RECENT */

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'recent',
JSON.stringify(recent)
);

}

/* TABS */

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){

filteredChannels=[...all];

}

if(type==='favs'){

filteredChannels=all.filter(c=>favs[c.id]);

}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

updateStats();

}

/* CONTROLS */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

function shareChannel(){

const channel=filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({
title:channel.name,
url:channel.url
});

}else{

navigator.clipboard.writeText(channel.url);

alert('Channel URL Copied');

}

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark?'#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark?'#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark?'#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark?'#ffffff':'#000000'
);

}

/* STATS */

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length+
' Stable HD Channels Loaded';

}

/* KEYBOARD */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

/* NETWORK */

window.addEventListener('offline',()=>{

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'No Internet Connection';

});

window.addEventListener('online',()=>{

document.getElementById('overlay').style.display='none';

});

/* LOAD */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
