
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IPTV Trial Demo</title>
<style>
body{font-family:Arial;background:#08111f;color:#fff;text-align:center}
#player{display:none}
#upgrade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85)}
button{padding:12px 20px;margin:10px}
</style>
</head>
<body>
<h1>HOME</h1>
<button onclick="startTrial()">Start Free Trial</button>
<h2 id="timer"></h2>

<div id="player">
<h2>Premium IPTV Demo</h2>
<video id="video" controls width="700"></video>
</div>

<div id="upgrade">
<h1>Trial Ended</h1>
<button>Basic</button>
<button>Premium</button>
<button>VIP</button>
<button onclick="pay()">Flutterwave Checkout</button>
</div>

<script>
let t=120,id;
function startTrial(){
document.getElementById('player').style.display='block';
id=setInterval(()=>{
let m=Math.floor(t/60),s=t%60;
timer.textContent=`${m}:${String(s).padStart(2,'0')}`;
if(t--<=0){
clearInterval(id);
video.pause();
upgrade.style.display='block';
}
},1000);
}
function pay(){
alert('Payment Successful');
localStorage.setItem('premium','true');
upgrade.style.display='none';
alert('Premium Activated');
}
</script>
</body>
</html>
