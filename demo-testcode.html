<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV ENTERPRISE DEMO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
}

.box{
background:#0f172d;
padding:25px;
border-radius:12px;
width:280px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
background:#111a31;
color:white;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#00d4ff;
font-weight:bold;
cursor:pointer;
}

/* APP */
#app{display:none;}

.header{
display:flex;
justify-content:space-between;
padding:10px;
background:#0d1324;
}

.container{
display:flex;
height:calc(100vh - 50px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0d1324;
padding:10px;
overflow:auto;
}

.nav{
padding:10px;
margin:5px 0;
background:#111a31;
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
padding:10px;
}

video{
width:100%;
height:300px;
background:black;
border-radius:10px;
}

/* CHANNELS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
margin-top:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{
border-color:#00d4ff;
}

.badge{
font-size:10px;
background:red;
padding:3px 6px;
border-radius:6px;
float:right;
}

/* ADMIN */
.admin{
position:fixed;
right:10px;
top:60px;
width:250px;
background:#0f172d;
padding:10px;
border-radius:10px;
display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>🔐 ENTERPRISE LOGIN</h3>
<input id="u" placeholder="username">
<input id="p" type="password" placeholder="password">
<button onclick="login()">Login</button>
<p style="font-size:12px;color:#aaa">admin / admin</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="header">
<div>📺 WORLDTV ENTERPRISE</div>
<button onclick="toggleAdmin()">ADMIN</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="nav" onclick="loadGlobal()">🌍 Global</div>
<div class="nav" onclick="loadSample()">📡 Sample Feed</div>
<div class="nav" onclick="toggleFavView()">⭐ Favorites</div>
<div class="nav" onclick="addFakeChannel()">➕ Add Channel</div>

</div>

<!-- MAIN -->
<div class="main">

<video id="tv" controls autoplay muted></video>

<h3>Channels</h3>
<div class="grid" id="grid"></div>

</div>

</div>

</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin">
<h4>⚙ Admin Panel</h4>

<button onclick="clearAll()">Clear Channels</button>
<button onclick="togglePremium()">Toggle Premium Mode</button>

</div>

<script>

let channels=[];
let filtered=[];
let favs={};
let premium=false;
let current=0;

const video=document.getElementById("tv");
const grid=document.getElementById("grid");

/* LOGIN */
function login(){
if(u.value==="admin" && p.value==="admin"){
login.style.display="none";
app.style.display="block";
loadGlobal();
}
}

/* LOAD M3U */
async function loadGlobal(){
const res=await fetch("https://iptv-org.github.io/iptv/index.country.m3u");
const text=await res.text();

channels=[];

text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=a[i+1];

if(url && url.startsWith("http")){
channels.push({
id:channels.length+1,
name,
url,
premium:Math.random()>0.8
});
}
}
});

filtered=[...channels];
render();
}

/* RENDER */
function render(){
grid.innerHTML="";

filtered.forEach((c,i)=>{

if(premium && c.premium) return;

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="badge">${c.premium?"VIP":"LIVE"}</div>
${c.name}
`;

div.onclick=()=>play(i);
grid.appendChild(div);
});
}

/* PLAY */
function play(i){
current=i;
let c=filtered[i];

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
}else{
video.src=c.url;
}
video.play();
}

/* ADMIN */
function toggleAdmin(){
admin.style.display = admin.style.display==="block"?"none":"block";
}

function clearAll(){
channels=[];
filtered=[];
render();
}

function togglePremium(){
premium=!premium;
render();
}

/* EXTRA */
function addFakeChannel(){
channels.push({
id:channels.length+1,
name:"NEW CHANNEL "+channels.length,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
premium:false
});
filtered=[...channels];
render();
}

function toggleFavView(){
filtered = channels.filter(c=>favs[c.id]);
render();
}

function loadSample(){
loadGlobal();
}

</script>

</body>
</html>
