<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH PRO QUIZ SYSTEM</title>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
}

.center{
display:flex;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
}

input,button{
padding:12px;
margin:6px;
border-radius:8px;
border:none;
}

button{
background:var(--accent);
cursor:pointer;
font-weight:bold;
}

/* DASHBOARD */

.topbar{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

.sidebar{
width:220px;
background:#0f1628;
padding:10px;
}

.menu{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.main{
flex:1;
padding:15px;
overflow:auto;
}

/* QUIZ */

.quiz{
background:var(--card);
padding:20px;
border-radius:10px;
margin-bottom:10px;
}

.option{
display:block;
margin:8px 0;
padding:10px;
background:#0f1628;
border-radius:8px;
cursor:pointer;
}

/* PROFILE */

.profile{
background:var(--card);
padding:15px;
border-radius:10px;
}

/* ADMIN */

.admin-box{
background:#0f1628;
padding:10px;
border-radius:10px;
margin-top:10px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">

<h1>🔐 BTECH QUIZ LOGIN</h1>

<input id="name" placeholder="Username">
<input id="role" placeholder="admin / user">

<button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div id="app" style="display:none">

<div class="topbar">

<h3>🎯 PRO QUIZ SYSTEM</h3>

<div id="userBox"></div>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="showQuiz()">🧠 Play Quiz</div>
<div class="menu" onclick="showProfile()">👤 Profile</div>
<div class="menu" onclick="showLeaderboard()">🏆 Leaderboard</div>
<div class="menu" onclick="showAdmin()">⚙ Admin</div>

</div>

<!-- MAIN -->
<div class="main" id="main"></div>

</div>
</div>

<script>

/* =====================
DATA STORAGE
===================== */

let user=null;

let questions=[
{
type:"multiple",
q:"Capital of Nigeria?",
options:["Lagos","Abuja","Kano","Ibadan"],
answer:"Abuja"
},
{
type:"picture",
q:"Guess image",
img:"https://picsum.photos/500/300",
options:["Cat","Dog","Car","House"],
answer:"Cat"
},
{
type:"audio",
q:"Listen and answer",
audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
options:["Song A","Song B","Song C","Song D"],
answer:"Song A"
}
];

let index=0;
let score=0;
let timer;

/* =====================
LOGIN
===================== */

function login(){

let name=document.getElementById("name").value;
let role=document.getElementById("role").value;

user={name,role};

document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userBox").innerHTML=
`👤 ${name} (${role})`;

showQuiz();

}

/* =====================
QUIZ ENGINE
===================== */

function showQuiz(){

index=0;
score=0;
renderQuiz();

}

function renderQuiz(){

let q=questions[index];

let box=document.getElementById("main");

clearInterval(timer);
let time=15;

timer=setInterval(()=>{
time--;
if(time<=0){
next();
}
},1000);

box.innerHTML=`
<div class="quiz">

<h3>⏱ Time: <span id="t">${time}</span>s</h3>

<h2>${q.q}</h2>

${q.img?`<img src="${q.img}" style="width:100%">`:''}

${q.audio?`<audio controls autoplay src="${q.audio}"></audio>`:''}

<div>
${q.options.map(o=>
`<div class="option" onclick="answer('${o}')">${o}</div>`
).join("")}
</div>

</div>
`;

}

/* =====================
ANSWER CHECK
===================== */

function answer(val){

let q=questions[index];

if(val===q.answer) score++;

next();

}

/* =====================
NEXT QUESTION
===================== */

function next(){

index++;

if(index>=questions.length){

saveScore();

document.getElementById("main").innerHTML=
`<h2>🏁 Finished</h2><h3>Score: ${score}</h3>`;

return;
}

renderQuiz();

}

/* =====================
LEADERBOARD
===================== */

function saveScore(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.push({
name:user.name,
score:score
});

localStorage.setItem("board",JSON.stringify(board));

}

function showLeaderboard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.sort((a,b)=>b.score-a.score);

document.getElementById("main").innerHTML=`
<h2>🏆 Leaderboard</h2>
${board.map(b=>
`<p>👤 ${b.name} - ${b.score}</p>`
).join("")}
`;

}

/* =====================
PROFILE
===================== */

function showProfile(){

document.getElementById("main").innerHTML=`
<div class="profile">

<h2>👤 Profile</h2>
<p>Name: ${user.name}</p>
<p>Role: ${user.role}</p>

</div>
`;

}

/* =====================
ADMIN PANEL
===================== */

function showAdmin(){

if(user.role!=="admin"){
document.getElementById("main").innerHTML=
"<h3>❌ Admin Only</h3>";
return;
}

document.getElementById("main").innerHTML=`
<div class="admin-box">

<h3>➕ Add Question</h3>

<input id="q" placeholder="Question"><br>
<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">
<input id="ans" placeholder="Correct Answer">

<button onclick="addQ()">Add</button>

</div>
`;

}

function addQ(){

questions.push({
type:"multiple",
q:document.getElementById("q").value,
options:[
o1.value,o2.value,o3.value,o4.value
],
answer:document.getElementById("ans").value
});

alert("Question Added!");
}

</script>

</body>
</html>
