<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;overflow-x:hidden}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0d1324;padding:15px;overflow:auto}
.main{margin-left:260px;padding:15px}
.logo{font-size:26px;color:#00d4ff;font-weight:bold}
.btn{width:100%;padding:12px;margin:5px 0;background:#121c33;border:none;color:#fff;border-radius:10px;cursor:pointer}
.btn:hover{background:#1e2f57}
.top{display:flex;gap:10px;flex-wrap:wrap}
input{padding:12px;border-radius:10px;border:none;width:100%;background:#101a31;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:20px}
.card{background:#111a31;padding:12px;border-radius:12px;cursor:pointer;border:1px solid #1f355d}
.card:hover{transform:scale(1.03)}
.player{width:100%;height:450px;background:#000;border-radius:12px;margin-top:10px}
video{width:100%;height:100%}
.badge{background:red;padding:4px 8px;font-size:10px;border-radius:8px;float:right}
.admin{background:#0f172d;padding:15px;border-radius:12px;margin-top:20px}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">📺 WORLDTV PRO MAX</div>

<button class="btn" onclick="showAll()">📡 Live TV</button>
<button class="btn" onclick="showFav()">❤️ Favorites</button>
<button class="btn" onclick="showAdmin()">⚙ Admin</button>

<hr>

<input id="m3uUrl" placeholder="Paste M3U URL">
<button class="btn" onclick="loadM3U()">Load Playlist</button>

</div>

<div class="main">

<input id="search" placeholder="Search channels..." oninput="render()">

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<h2>Channels</h2>
<div class="grid" id="grid"></div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin" style="display:none">

<h2>ADMIN PANEL</h2>

<input id="cName" placeholder="Channel Name">
<input id="cUrl" placeholder="Stream URL">
<button class="btn" onclick="addCustom()">➕ Add Channel</button>

</div>

</div>

<script>

/* ===== DATA ===== */
let channels=[];
let filtered=[];
let favs=JSON.parse(localStorage.getItem("favs")||"{}");

/* SAMPLE STARTERS */
channels.push(
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"CNN Live",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Sky Sports",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
);

function render(){
let q=document.getElementById("search").value.toLowerCase();
filtered=channels.filter(c=>c.name.toLowerCase().includes(q));

let g=document.getElementById("grid");
g.innerHTML="";

filtered.forEach(c=>{
let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<div class="badge">LIVE</div>
📺 ${c.name}
`;

d.onclick=()=>play(c);
g.appendChild(d);
});
}

/* ===== PLAYER ===== */
let video=document.getElementById("video");

function play(c){
if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* ===== M3U LOADER ===== */
function loadM3U(){
let url=document.getElementById("m3uUrl").value;
if(!url)return;

fetch(url)
.then(r=>r.text())
.then(t=>{
parseM3U(t);
render();
});
}

function parseM3U(text){
let lines=text.split("\n");
let name="";

lines.forEach(l=>{
if(l.startsWith("#EXTINF")){
name=l.split(",")[1]||"Unknown";
}
else if(l.startsWith("http")){
channels.push({name,url:l});
}
});
}

/* ===== ADMIN ===== */
function showAdmin(){
document.getElementById("admin").style.display="block";
}

function addCustom(){
let n=document.getElementById("cName").value;
let u=document.getElementById("cUrl").value;
if(!n||!u)return;

channels.push({name:n,url:u});
render();
alert("Channel added!");
}

/* ===== FILTERS ===== */
function showAll(){render();}
function showFav(){
filtered=channels.filter(c=>favs[c.name]);
render();
}

/* ===== INIT ===== */
render();

</script>

</body>
</html>
