<script>

/* =========================
COMBINED ENGINE (NO FORMAT CHANGE)
========================= */

/* SYSTEM 1 */
let all=[];
let filteredChannels=[];
let currentIndex=0;
let favs=JSON.parse(localStorage.getItem('favs')||'{}');
let recent=JSON.parse(localStorage.getItem('recent')||'[]');

/* SYSTEM 2 */
let channels=[];
let filtered=[];
let currentHls=null;

const video=document.getElementById('video');

/* =========================
M3U LOADER (SYSTEM 1)
========================= */

async function loadPlaylist(url,group){
document.getElementById('overlay').style.display='flex';

const res=await fetch(url);
const text=await res.text();

all=[];

const lines=text.split('\n');

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith('#EXTINF')){
const name=lines[i].split(',')[1];
const url=lines[i+1];

all.push({
name,
url,
group
});
}
}

filteredChannels=[...all];
render();
document.getElementById('overlay').style.display='none';
}

/* =========================
100K ENGINE (SYSTEM 2)
========================= */

function generateChannels(){
channels=[];
for(let i=0;i<5000;i++){
channels.push({
name:'ENGINE '+i,
url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
type:i%3===0?'paid':'free',
status:i%10===0?'locked':'free'
});
}

filtered=[...channels];
updateStats();
render();
}

/* =========================
RENDER (MERGED LOGIC)
========================= */

function render(){

const box=document.getElementById('channelList');
box.innerHTML='';

const data=filteredChannels.length?filteredChannels:filtered;

data.forEach((c,i)=>{

const div=document.createElement('div');
div.className='channel';

div.innerHTML=`
<span>${c.name}</span>
<span class="badge">${c.type||'free'}</span>
`;

div.onclick=()=>play(i);
box.appendChild(div);

});

}

/* =========================
PLAYER (MERGED)
========================= */

function play(i){

const data=filteredChannels.length?filteredChannels:filtered;
const c=data[i];
if(!c) return;

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

}

/* =========================
UTILITIES (COMBINED)
========================= */

function shuffleChannels(){
const data=filteredChannels.length?filteredChannels:filtered;
data.sort(()=>Math.random()-0.5);
render();
}

function toggleFullscreen(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else document.exitFullscreen();
}

function speedBoost(){
video.playbackRate=1.2;
alert('Boost Active');
}

function scanStreams(){alert('Scanning...');}
function repairStreams(){alert('Repairing...');}

function toggleTheme(){
document.body.style.background=
document.body.style.background==='#000'?'#050816':'#000';
}

/* ADMIN */
function openSuperAdmin(){
document.getElementById('adminPanel').style.display='flex';
}

function closeSuperAdmin(){
document.getElementById('adminPanel').style.display='none';
}

/* INIT */
loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria');

</script>
