<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO 100K ULTRA MAX ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{color:var(--accent);font-size:20px}

.container{display:flex;height:calc(100vh - 65px)}

.sidebar{
width:250px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.cat:hover{background:var(--hover)}

.main{flex:1;display:flex;flex-direction:column}

.player{height:320px;background:#000;position:relative}

video{width:100%;height:100%}

.overlay{
position:absolute;inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,0.8);
}

.now{
display:flex;
justify-content:space-between;
padding:10px;
background:var(--panel);
}

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{background:var(--hover)}

.right{
width:280px;
background:var(--panel);
padding:10px;
overflow:auto;
}

input{
width:100%;
padding:10px;
background:#0f1628;
border:none;
color:white;
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
background:var(--accent);
border:none;
cursor:pointer;
}

.stat{
background:var(--card);
padding:10px;
margin-top:10px;
border-radius:6px;
}
</style>
</head>

<body>

<div class="topbar">
<h2>📺 BTECH-TV ULTRA 100K ENGINE</h2>
<button onclick="filterCat('All')">ALL</button>
</div>

<div class="container">

<!-- LEFT -->
<div class="sidebar">
<div class="cat" onclick="filterCat('All')">All</div>
<div class="cat" onclick="filterCat('Sports')">Sports</div>
<div class="cat" onclick="filterCat('News')">News</div>
<div class="cat" onclick="filterCat('Movies')">Movies</div>
<div class="cat" onclick="filterCat('Africa')">Africa</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
<div class="overlay" id="overlay">
<h2>🚀 Loading Engine...</h2>
</div>
</div>

<div class="now">
<div>
<h3 id="name">No Channel</h3>
<small id="group">Ready</small>
</div>

<div>
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>
</div>

<div id="channels" class="channels"></div>

</div>

<!-- RIGHT -->
<div class="right">

<input placeholder="Search..." oninput="search(this.value)">

<button onclick="generate()">Generate 100K</button>

<div class="stat">Total: <span id="total">0</span></div>
<div class="stat">Free: <span id="free">0</span></div>
<div class="stat">Locked: <span id="locked">0</span></div>

</div>

</div>

<script>

let channels=[],filtered=[],index=0,hls=null;

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

function generate(){

channels=[];

for(let i=0;i<100000;i++){

let cat=["Sports","News","Movies","Africa"][i%4];

channels.push({
id:i,
name:`BTECH ${cat} ${i}`,
category:cat,
url:streams[i%streams.length],
status:i%10===0?"locked":"free"
});
}

filtered=[...channels];

render();
stats();

document.getElementById("overlay").style.display="none";
}

function render(){

let box=document.getElementById("channels");
box.innerHTML="";

filtered.slice(0,300).forEach((c,i)=>{

box.innerHTML+=`
<div class="channel" onclick="play(${i})">
<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>
<div>${c.status}</div>
</div>`;
});

}

function play(i){

index=i;
let c=filtered[i];

name.innerText=c.name;
group.innerText=c.category;

let v=document.getElementById("video");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);
}else{
v.src=c.url;
}
}

function next(){
index=(index+1)%filtered.length;
play(index);
}

function prev(){
index=(index-1+filtered.length)%filtered.length;
play(index);
}

function search(q){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(q.toLowerCase())||
c.category.toLowerCase().includes(q.toLowerCase())
);
render();
}

function filterCat(cat){
filtered=(cat==="All")?channels:channels.filter(c=>c.category===cat);
render();
}

function stats(){
total.innerText=channels.length;
free.innerText=channels.filter(c=>c.status==="free").length;
locked.innerText=channels.filter(c=>c.status==="locked").length;
}

generate();

</script>

</body>
</html>
