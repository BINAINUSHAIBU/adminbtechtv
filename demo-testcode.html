<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;z-index:9999;
}
.auth{
background:#0d1324;padding:20px;border-radius:10px;width:320px;
}
.auth input{
width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;
background:#101a31;color:#fff;
}
.auth button{
width:100%;padding:10px;margin-top:8px;border:none;border-radius:6px;
background:#00d4ff;color:#000;cursor:pointer;
}

/* UPGRADE */
#upgradeBox{
position:fixed;inset:0;background:#000;
display:none;justify-content:center;align-items:center;flex-direction:column;
z-index:99999;color:#fff;text-align:center;
}

/* TIMER */
#timer{
position:fixed;top:10px;right:10px;
background:#00d4ff;color:#000;padding:8px;border-radius:8px;
font-weight:bold;z-index:9999;
}

/* SIDEBAR */
.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;}
.nav-btn{width:100%;padding:10px;margin:5px 0;border:none;border-radius:8px;background:#121c33;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px;}

/* PLAYER */
.player-container{background:#000;border-radius:10px;height:320px;position:relative;}
video{width:100%;height:100%;}

/* WATERMARK */
.watermark{
position:absolute;
bottom:10px;
right:10px;
font-size:12px;
background:rgba(0,0,0,0.5);
padding:5px 8px;
border-radius:6px;
}

/* CHANNELS */
.channels{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;}

</style>
</head>

<body>

<!-- TIMER -->
<div id="timer">Trial: 00:00:00</div>

<!-- AUTH -->
<div id="authBox">
  <div class="auth">
    <h3>IPTV LOGIN</h3>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- UPGRADE -->
<div id="upgradeBox">
  <h1>⛔ TRIAL EXPIRED</h1>
  <p>Upgrade to continue watching all channels</p>
  <button onclick="location.reload()" style="padding:10px;margin-top:10px;">Upgrade Now</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>

<button class="nav-btn" onclick="loadCat('news')">News</button>
<button class="nav-btn" onclick="loadCat('sports')">Sports</button>

<button class="nav-btn" onclick="loadUltra()">Ultra Feeds</button>
<button class="nav-btn" onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search IPTV...">
<div class="live">LIVE</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
<div class="watermark">Design by BINAINU SHAIBU BTECH-TV WORLD PRO MAX</div>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

/* =========================
AUTH + TRIAL (5 HOURS)
========================= */

const LIMIT = 5 * 3600 * 1000;

function register(){
localStorage.setItem("user",JSON.stringify({
email:email.value,
pass:pass.value
}));
alert("Registered");
}

function login(){
let u=JSON.parse(localStorage.getItem("user")||"null");
if(!u || u.email!=email.value || u.pass!=pass.value){
return alert("Invalid login");
}

if(!localStorage.getItem("start")){
localStorage.setItem("start",Date.now());
}

authBox.style.display="none";
startTimer();
loadUltra();
}

function logout(){
localStorage.removeItem("start");
location.reload();
}

function startTimer(){
setInterval(()=>{
let start=localStorage.getItem("start");
if(!start)return;

let diff=LIMIT-(Date.now()-start);

if(diff<=0){
upgradeBox.style.display="flex";
document.body.innerHTML="";
return;
}

let h=Math.floor(diff/3600000);
let m=Math.floor(diff%3600000/60000);
let s=Math.floor(diff%60000/1000);

timer.innerText=`Trial: ${h}h ${m}m ${s}s`;

},1000);
}

/* =========================
IPTV ENGINE
========================= */

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let text=await res.text();

all=[];filtered=[];

let lines=text.split("\n");

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith("#EXTINF")){
let name=lines[i].split(",").pop();
let url=lines[i+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
}

filtered=[...all];
render();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerText=c.name;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

loadUltra();

</script>

</body>
</html>
