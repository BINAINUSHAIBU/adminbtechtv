<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Live Streaming Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#070b14;
color:#fff;
}

header{
background:#0f1c33;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #1f3a66;
}

header h1{
font-size:18px;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

.sidebar{
width:340px;
background:#0b1426;
padding:15px;
overflow:auto;
border-right:2px solid #14284a;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.card{
background:#111c33;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:6px;
background:#070b14;
color:#fff;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.btn-save{background:#00c853;color:#000;}
.btn-live{background:#ff2d2d;color:#fff;}
.btn-stop{background:#ff9800;color:#000;}

.viewer{
flex:1;
background:#000;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

video, iframe{
width:100%;
height:100%;
}

.liveBadge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:6px;
display:none;
font-weight:bold;
}

.program{
padding:10px;
background:#0f1c33;
border-radius:8px;
margin-top:8px;
cursor:pointer;
}

.program:hover{
background:#15284a;
}

.brand{
font-size:12px;
opacity:0.8;
}
</style>
</head>

<body>

<header>
<h1>✝ Church Live Streaming Dashboard</h1>
<div class="brand">Powered by Live Worship System</div>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="card">
<h3>Create Church Program</h3>

<input id="title" placeholder="Service Title (e.g Sunday Service)">
<textarea id="desc" placeholder="Message / Description"></textarea>
<input id="stream" placeholder="Stream URL (YouTube / HLS / MP4)">

<button class="btn-save" onclick="saveProgram()">Save Program</button>
<button class="btn-live" onclick="goLive()">🔴 Go Live</button>
<button class="btn-stop" onclick="stopLive()">⛔ Stop Live</button>
</div>

<div class="card">
<h3>Programs Schedule</h3>
<div id="list"></div>
</div>

</div>

<!-- MAIN VIEWER -->
<div class="main">

<div class="viewer">

<div class="liveBadge" id="live">🔴 LIVE SERVICE</div>

<video id="video" controls></video>
<iframe id="frame" style="display:none;border:none;"></iframe>

</div>

</div>

</div>

<script>

let programs = JSON.parse(localStorage.getItem("church_programs") || "[]");
let hls = null;

function render(){
let list = document.getElementById("list");
list.innerHTML = "";

programs.forEach((p,i)=>{
let div = document.createElement("div");
div.className = "program";
div.innerHTML = `
<b>${p.title}</b><br>
<small>${p.desc}</small>
`;

div.onclick = ()=>play(i);
list.appendChild(div);
});
}

function saveProgram(){
let title = document.getElementById("title").value;
let desc = document.getElementById("desc").value;
let stream = document.getElementById("stream").value;

if(!title || !stream){
alert("Please fill required fields");
return;
}

programs.push({title, desc, stream});
localStorage.setItem("church_programs", JSON.stringify(programs));

render();
alert("Church program saved!");
}

function play(index){
let p = programs[index];
loadStream(p.stream);
}

function loadStream(url){

let video = document.getElementById("video");
let frame = document.getElementById("frame");

document.getElementById("live").style.display = "block";

frame.style.display = "none";
video.style.display = "block";

if(url.includes("youtube.com") || url.includes("youtu.be")){
video.style.display = "none";
frame.style.display = "block";
frame.src = url.replace("watch?v=", "embed/");
return;
}

if(Hls.isSupported()){
if(hls) hls.destroy();

hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED, ()=>video.play());
}else{
video.src = url;
video.play();
}
}

function goLive(){
document.getElementById("live").style.display = "block";
alert("✝ Church LIVE Broadcast Started");
}

function stopLive(){
document.getElementById("live").style.display = "none";

let video = document.getElementById("video");
video.pause();
video.src = "";

document.getElementById("frame").src = "";
document.getElementById("frame").style.display = "none";
}

render();

</script>

</body>
</html>
