<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ULTRA MAX 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--locked:#f59e0b;
--paid:#dc2626;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOP */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:260px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
}

.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:var(--free)}
.locked{background:var(--locked);color:#000}
.paid{background:var(--paid)}

.right{
width:240px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="topbar">
<h3>🚀 BTECH-TV ULTRA MAX</h3>
<div id="status">Loading...</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h4>⚙ CONTROL</h4>

<button onclick="filterAll()">All</button>
<button onclick="setAllLocked()">🔒 Lock ALL</button>
<button onclick="setAllFree()">🔓 Free ALL</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterFree()">Free</button>

<input placeholder="Search..." oninput="search(this.value)">
</div>

<!-- MAIN -->
<div class="main">
<div class="player">
<video id="video" controls></video>
</div>
<div class="list" id="list"></div>
</div>

<!-- RIGHT -->
<div class="right">
<h4>📊 STATS</h4>
<div class="stat">Total: <span id="t">0</span></div>
<div class="stat">Free: <span id="f">0</span></div>
<div class="stat">Locked: <span id="l">0</span></div>
<div class="stat">Paid: <span id="p">0</span></div>
</div>

</div>

<script>

let channels = [];
let filtered = [];

/* LOAD IPTV */
async function loadAPI(){
try{
const [ch,st] = await Promise.all([
fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json())
]);

let seen = {};

st.forEach(s=>{
if(!s.url || seen[s.url]) return;
seen[s.url] = true;

channels.push({
name: s.title || "Channel",
url: s.url,
type: "free",
status: "free"
});
});

filtered = [...channels];
render();
stats();

document.getElementById("status").innerText =
"LIVE CHANNELS: " + channels.length;

}catch(e){
console.log(e);
}
}

/* RENDER */
function render(){
const box = document.getElementById("list");
box.innerHTML = "";

filtered.forEach((c,i)=>{
const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>${c.name}</b><br>
<span class="badge ${c.status}">${c.status}</span>
`;

/* CLICK PLAY */
div.onclick = ()=>play(i);

box.appendChild(div);
});

stats();
}

/* PLAY */
function play(i){
const v = document.getElementById("video");
const c = filtered[i];

if(Hls.isSupported()){
const h = new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else{
v.src = c.url;
}
}

/* FILTERS */
function filterAll(){
filtered = [...channels];
render();
}

function filterLocked(){
filtered = channels.filter(c=>c.status==="locked");
render();
}

function filterFree(){
filtered = channels.filter(c=>c.status==="free");
render();
}

function search(v){
filtered = channels.filter(c =>
c.name.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* 🔒 GLOBAL LOCK / UNLOCK */
function setAllLocked(){
channels.forEach(c=>c.status="locked");
filtered = [...channels];
render();
stats();
}

function setAllFree(){
channels.forEach(c=>c.status="free");
filtered = [...channels];
render();
stats();
}

/* STATS */
function stats(){
document.getElementById("t").innerText = channels.length;
document.getElementById("f").innerText = channels.filter(c=>c.status==="free").length;
document.getElementById("l").innerText = channels.filter(c=>c.status==="locked").length;
document.getElementById("p").innerText = channels.filter(c=>c.type==="paid").length;
}

/* BOOT */
loadAPI();

</script>

</body>
</html>
