<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 BTECH TV ULTRA MAX - FULL CHANNEL UNIFIED SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{padding:10px;background:#0d1324;display:flex;justify-content:space-between;align-items:center}
.main{display:flex;flex:1;overflow:hidden}
.side{width:260px;background:#0d1324;overflow:auto;padding:10px}
.content{flex:1;display:flex;flex-direction:column;padding:10px}
.player{height:300px;background:#000;border-radius:10px;overflow:hidden}
video{width:100%;height:100%}
.list{flex:1;overflow:auto;margin-top:10px}
.card{padding:8px;background:#111a31;margin-bottom:6px;border-radius:8px;cursor:pointer}
.badge{padding:2px 6px;border-radius:20px;font-size:11px;margin-left:5px}
.free{background:#16a34a}
.paid{background:#dc2626}
.locked{background:#f59e0b;color:#000}
input{width:100%;padding:8px;margin-bottom:10px;border:none;border-radius:6px}
button{width:100%;padding:8px;margin:3px 0;border:none;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="top">
<h3>📺 UNIFIED ULTRA MAX CHANNEL ENGINE</h3>
<div id="stats">Loading...</div>
</div>

<div class="main">

<div class="side">
<input placeholder="Search..." oninput="search(this.value)">

<button onclick="filter('all')">ALL</button>
<button onclick="filter('free')">FREE</button>
<button onclick="filter('paid')">PAID</button>
<button onclick="filter('locked')">LOCKED</button>
</div>

<div class="content">

<div class="player">
<video id="v" controls></video>
</div>

<div class="list" id="list"></div>

</div>

</div>

<script>

/* =========================
UNIFIED CHANNEL ENGINE
========================= */

let channels = [];
let view = [];

/* LIVE IPTV + ENTERPRISE MERGE INTO ONE ARRAY */
async function boot(){

/* 1. LIVE IPTV */
try{
const streams = await fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json());

streams.forEach(s=>{
if(!s.url) return;

channels.push({
name: s.title || "LIVE CHANNEL",
url: s.url,
type: "free",
status: "unlocked",
source: "IPTV LIVE"
});
});
}catch(e){}

/* 2. ENTERPRISE MASS GENERATION (ALL INSIDE SAME ARRAY) */
const cats=["Sports","News","Movies","Kids","Music","Docs","Entertainment"];

for(let i=1;i<=2000;i++){
channels.push({
name:`Enterprise Channel ${i}`,
url:"",
type:Math.random()>0.7?"paid":"free",
status:Math.random()>0.85?"locked":"unlocked",
source:"ENTERPRISE CORE"
});
}

/* 3. FINAL UNIFIED VIEW */
view=[...channels];

render();
stats();
}

/* =========================
RENDER
========================= */

function render(){
const box=document.getElementById("list");
box.innerHTML="";

view.slice(0,200).forEach((c,i)=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${c.name}</b><br>
<small>${c.source}</small>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
`;

div.onclick=()=>play(c.url);

box.appendChild(div);
});
}

/* =========================
PLAYER
========================= */

function play(url){
const v=document.getElementById("v");
if(!url) return;

if(Hls.isSupported()){
const h=new Hls();
h.loadSource(url);
h.attachMedia(v);
}else v.src=url;
}

/* =========================
FILTER SYSTEM
========================= */

function filter(type){
if(type==="all") view=[...channels];
else view=channels.filter(c=>c.type===type);
render();
}

/* =========================
SEARCH
========================= */

function search(v){
v=v.toLowerCase();
view=channels.filter(c=>c.name.toLowerCase().includes(v));
render();
}

/* =========================
STATS
========================= */

function stats(){
document.getElementById("stats").innerText=
`TOTAL:${channels.length} | FREE:${channels.filter(c=>c.type==="free").length} | PAID:${channels.filter(c=>c.type==="paid").length} | LOCKED:${channels.filter(c=>c.status==="locked").length}`;
}

/* START */
boot();

</script>

</body>
</html>
