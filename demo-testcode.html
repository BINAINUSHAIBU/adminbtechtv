<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>BTECH TV - Ultra IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* DASHBOARD */

.dashboard{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#111827;
padding:20px;
overflow-y:auto;
}

.sidebar h2{
text-align:center;
color:#00d4ff;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin-bottom:12px;
}

.sidebar ul li a{
display:block;
padding:14px;
border-radius:10px;
background:#1e293b;
text-decoration:none;
color:white;
transition:0.3s;
}

.sidebar ul li a:hover,
.sidebar ul li.active a{
background:#00d4ff;
color:black;
}

/* MAIN */

.main{
flex:1;
padding:25px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.header h1{
font-size:30px;
}

.header p{
color:#94a3b8;
}

/* SEARCH */

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
font-size:16px;
outline:none;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
transition:0.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card h3{
margin-bottom:10px;
color:#cbd5e1;
}

.card p{
font-size:28px;
font-weight:bold;
color:#00d4ff;
}

/* GRID */

.channel-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

/* CARD */

.channel-card{
background:#1e293b;
border-radius:15px;
overflow:hidden;
transition:0.3s;
}

.channel-card:hover{
transform:translateY(-5px);
}

/* BANNER */

.channel-banner{
height:160px;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
color:#00d4ff;
background-size:cover;
background-position:center;
position:relative;
}

.channel-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* INFO */

.channel-info{
padding:15px;
}

.channel-info h3{
margin-bottom:10px;
font-size:18px;
}

.channel-info p{
margin-bottom:8px;
color:#cbd5e1;
}

/* BADGES */

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-right:5px;
margin-top:6px;
}

.free{
background:#16a34a;
}

.paid{
background:#dc2626;
}

.locked{
background:#f59e0b;
}

.unlocked{
background:#2563eb;
}

/* BUTTON */

.watch-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00d4ff;
color:black;
font-weight:bold;
margin-top:12px;
transition:0.3s;
}

.watch-btn:hover{
opacity:0.8;
}

/* PLAYER */

.player-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.player-box{
width:90%;
max-width:1000px;
background:#111827;
padding:20px;
border-radius:15px;
}

.player-box video{
width:100%;
height:500px;
background:black;
border-radius:10px;
}

.close-btn{
background:red;
border:none;
padding:10px 15px;
border-radius:8px;
color:white;
cursor:pointer;
margin-bottom:15px;
}

/* MOBILE */

@media(max-width:768px){

.sidebar{
display:none;
}

.main{
padding:15px;
}

.player-box video{
height:250px;
}

}

</style>

</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->

<aside class="sidebar">

<h2>BTECH TV</h2>

<ul>

<li class="active">
<a href="#">All Channels</a>
</li>

<li>
<a href="#">Free Channels</a>
</li>

<li>
<a href="#">Premium Channels</a>
</li>

<li>
<a href="#">Sports</a>
</li>

<li>
<a href="#">Movies</a>
</li>

<li>
<a href="#">Kids</a>
</li>

<li>
<a href="#">News</a>
</li>

<li>
<a href="#">Favorites</a>
</li>

<li>
<a href="#">Settings</a>
</li>

</ul>

</aside>

<!-- MAIN -->

<main class="main">

<div class="header">

<h1>BTECH TV ULTRA</h1>

<p id="liveCount">
Loading IPTV Channels...
</p>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search IPTV channels..."
onkeyup="searchChannels()"
>

</div>

<!-- STATS -->

<section class="stats">

<div class="card">

<h3>Total Channels</h3>

<p id="totalChannels">
0
</p>

</div>

<div class="card">

<h3>Free Channels</h3>

<p id="freeChannels">
0
</p>

</div>

<div class="card">

<h3>Premium Channels</h3>

<p id="premiumChannels">
0
</p>

</div>

<div class="card">

<h3>Locked Channels</h3>

<p id="lockedChannels">
0
</p>

</div>

</section>

<!-- CHANNEL GRID -->

<section
class="channel-grid"
id="channelGrid"
>

</section>

</main>

</div>

<!-- VIDEO PLAYER -->

<div
class="player-modal"
id="playerModal"
>

<div class="player-box">

<button
class="close-btn"
onclick="closePlayer()"
>

Close

</button>

<h2 id="playerTitle"></h2>

<video
id="videoPlayer"
controls
autoplay
></video>

</div>

</div>

<script>

/* ====================================
SETTINGS
==================================== */

let settings = {

theme:"dark",
autoplay:true

};

/* ====================================
PLAYLIST SOURCES
==================================== */

const playlistSources = [

"https://iptv-org.github.io/iptv/index.m3u",

"https://iptv-org.github.io/iptv/index.country.m3u",

"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8",

"https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u"

];

/* ====================================
GLOBAL STATE
==================================== */

const channels = [];

let filteredChannels = [];

let currentPage = 0;

const limit = 120;

let currentHls = null;

/* ====================================
CATEGORIES
==================================== */

const categories = [

"Sports",
"Movies",
"Kids",
"News",
"Music",
"Entertainment",
"Education",
"Documentary",
"VIP",
"Africa",
"USA",
"UK",
"Europe",
"Asia"

];

/* ====================================
GENERATE 100,000 CHANNELS
==================================== */

function generateChannels(){

for(let i=1;i<=100000;i++){

channels.push({

id:i,

name:`BTECH LIVE ${i}`,

category:
categories[
Math.floor(
Math.random()*categories.length
)],

type:
Math.random()>0.5
? "Free"
: "Premium",

status:
Math.random()>0.2
? "Unlocked"
: "Locked",

live:
Math.random()>0.08,

views:
Math.floor(
Math.random()*1000000
),

logo:
`https://via.placeholder.com/300x150/111827/00d4ff?text=BTECH+${i}`,

streamUrl:
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

});

}

}

/* ====================================
LOAD PLAYLISTS
==================================== */

async function loadPlaylists(){

const seen = new Set();

for(const url of playlistSources){

try{

const response =
await fetch(url);

const text =
await response.text();

const parsed =
parseM3U(text);

parsed.forEach(channel=>{

if(
channel.url &&
!seen.has(channel.url)
){

seen.add(channel.url);

channels.push({

id:
channels.length + 1,

name:
channel.name,

category:
channel.group,

type:
Math.random()>0.5
? "Free"
: "Premium",

status:
Math.random()>0.2
? "Unlocked"
: "Locked",

live:true,

views:
Math.floor(
Math.random()*500000
),

logo:
channel.logo ||
"https://via.placeholder.com/300x150",

streamUrl:
channel.url

});

}

});

}catch(err){

console.log(
"Playlist failed:",
url
);

}

}

/* ADD GENERATED CHANNELS */

generateChannels();

filteredChannels = channels;

renderChannels(filteredChannels);

}

/* ====================================
PARSE M3U
==================================== */

function parseM3U(text){

const lines =
text.split("\n");

const result = [];

let temp = {};

for(let line of lines){

line = line.trim();

if(
line.startsWith("#EXTINF")
){

temp = {

name:
line.match(/,(.*)/)?.[1]
|| "Unknown",

logo:
line.match(
/tvg-logo="(.*?)"/
)?.[1] || "",

group:
line.match(
/group-title="(.*?)"/
)?.[1] || "LIVE"

};

}

else if(
line.startsWith("http")
){

temp.url = line;

result.push(temp);

temp = {};

}

}

return result;

}

/* ====================================
RENDER CHANNELS
==================================== */

function renderChannels(
list,
append=false
){

const grid =
document.getElementById(
"channelGrid"
);

if(!append){

grid.innerHTML = "";

}

const start =
currentPage * limit;

const end =
start + limit;

list
.slice(start,end)

.forEach(channel=>{

grid.innerHTML += `

<div class="channel-card">

<div
class="channel-banner"
style="
background-image:
url('${channel.logo}');
"
>

<div class="channel-overlay">

${channel.live
? "🔴 LIVE"
: "⚫ OFFLINE"}

<br>

${channel.category}

</div>

</div>

<div class="channel-info">

<h3>
${channel.name}
</h3>

<p>
${channel.views.toLocaleString()}
views
</p>

<span class="
badge
${channel.type==="Free"
? "free"
: "paid"}
">

${channel.type}

</span>

<span class="
badge
${channel.status==="Locked"
? "locked"
: "unlocked"}
">

${channel.status}

</span>

<button
class="watch-btn"
onclick="
watchChannel(
${channel.id}
)
"
>

▶ Watch Channel

</button>

</div>

</div>

`;

});

/* LOAD MORE */

if(end < list.length){

grid.innerHTML += `

<button
class="watch-btn"
onclick="loadMore()"
style="
width:100%;
margin-top:20px;
"
>

LOAD MORE CHANNELS

</button>

`;

}

/* UPDATE STATS */

document.getElementById(
"totalChannels"
).innerText =
channels.length
.toLocaleString();

document.getElementById(
"freeChannels"
).innerText =
channels.filter(
c=>c.type==="Free"
).length
.toLocaleString();

document.getElementById(
"premiumChannels"
).innerText =
channels.filter(
c=>c.type==="Premium"
).length
.toLocaleString();

document.getElementById(
"lockedChannels"
).innerText =
channels.filter(
c=>c.status==="Locked"
).length
.toLocaleString();

document.getElementById(
"liveCount"
).innerText =
`${channels.length.toLocaleString()} IPTV Channels`;

}

/* ====================================
LOAD MORE
==================================== */

function loadMore(){

currentPage++;

renderChannels(
filteredChannels,
true
);

}

/* ====================================
SEARCH
==================================== */

function searchChannels(){

const value =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

filteredChannels =
channels.filter(channel=>

channel.name
.toLowerCase()
.includes(value)

||

channel.category
.toLowerCase()
.includes(value)

);

currentPage = 0;

renderChannels(filteredChannels);

}

/* ====================================
WATCH CHANNEL
==================================== */

function watchChannel(id){

const channel =
channels.find(
c=>c.id===id
);

if(
channel.status==="Locked"
){

alert(
"This channel is locked"
);

return;

}

document
.getElementById(
"playerModal"
)
.style.display =
"flex";

document
.getElementById(
"playerTitle"
)
.innerText =
channel.name;

const video =
document
.getElementById(
"videoPlayer"
);

if(currentHls){

currentHls.destroy();

}

if(Hls.isSupported()){

currentHls = new Hls({

enableWorker:true,
lowLatencyMode:true

});

currentHls.loadSource(
channel.streamUrl
);

currentHls.attachMedia(
video
);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

}
);

}else{

video.src =
channel.streamUrl;

video.play();

}

}

/* ====================================
CLOSE PLAYER
==================================== */

function closePlayer(){

document
.getElementById(
"playerModal"
)
.style.display =
"none";

const video =
document
.getElementById(
"videoPlayer"
);

video.pause();

video.src = "";

if(currentHls){

currentHls.destroy();

}

}

/* ====================================
AUTO REFRESH LIVE
==================================== */

setInterval(()=>{

channels.forEach(channel=>{

channel.live =
Math.random()>0.08;

});

},30000);

/* ====================================
INIT
==================================== */

loadPlaylists();

</script>

</body>

</html>
