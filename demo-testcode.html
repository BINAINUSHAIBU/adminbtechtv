<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Netflix Style OTT UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #141414;
  color: white;
}

/* Sidebar */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 80px;
  height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 20px;
}

.sidebar div {
  margin: 20px 0;
  cursor: pointer;
  font-size: 12px;
  text-align: center;
}

/* Main */
.main {
  margin-left: 90px;
  padding: 20px;
}

/* Hero */
.hero {
  height: 300px;
  background: linear-gradient(to right, #000, transparent),
              url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4') center/cover;
  border-radius: 10px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h1 {
  font-size: 40px;
}

.hero p {
  max-width: 400px;
}

/* Rows */
.row {
  margin-top: 30px;
}

.row h2 {
  margin-bottom: 10px;
}

.movies {
  display: flex;
  overflow-x: auto;
}

.movie {
  min-width: 160px;
  height: 100px;
  background: #222;
  margin-right: 10px;
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.3s;
}

.movie:hover {
  transform: scale(1.1);
}

.movie img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Search */
.search {
  margin-bottom: 20px;
}

.search input {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 5px;
}

/* Responsive */
@media(max-width:768px){
  .sidebar { width: 60px; }
  .main { margin-left: 70px; }
}
</style>
</head>

<body>

<div class="sidebar">
  <div>🏠 Home</div>
  <div>📺 TV</div>
  <div>🎬 Movies</div>
  <div>❤️ Likes</div>
</div>

<div class="main">

  <div class="search">
    <input type="text" placeholder="Search movies..." onkeyup="searchMovies(this.value)">
  </div>

  <div class="hero">
    <h1>Featured Movie</h1>
    <p>Watch unlimited movies and TV shows in HD quality.</p>
  </div>

  <div class="row">
    <h2>Trending Now</h2>
    <div class="movies" id="trending"></div>
  </div>

  <div class="row">
    <h2>Action</h2>
    <div class="movies" id="action"></div>
  </div>

  <div class="row">
    <h2>Comedy</h2>
    <div class="movies" id="comedy"></div>
  </div>

</div>

<script>
const data = {
  trending: [
    "https://picsum.photos/200/300?1",
    "https://picsum.photos/200/300?2",
    "https://picsum.photos/200/300?3",
    "https://picsum.photos/200/300?4"
  ],
  action: [
    "https://picsum.photos/200/300?5",
    "https://picsum.photos/200/300?6",
    "https://picsum.photos/200/300?7"
  ],
  comedy: [
    "https://picsum.photos/200/300?8",
    "https://picsum.photos/200/300?9",
    "https://picsum.photos/200/300?10"
  ]
};

function loadMovies() {
  for (let cat in data) {
    let container = document.getElementById(cat);
    data[cat].forEach(img => {
      let div = document.createElement("div");
      div.className = "movie";
      div.innerHTML = `<img src="${img}">`;
      container.appendChild(div);
    });
  }
}

function searchMovies(value) {
  value = value.toLowerCase();
  document.querySelectorAll(".movie").forEach(m => {
    m.style.display = m.innerText.toLowerCase().includes(value) ? "block" : "none";
  });
}

loadMovies();
</script>

</body>
</html>
