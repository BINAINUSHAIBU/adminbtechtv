<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV SUPER LOCKED ADMIN v2</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--warn:#f59e0b;
--danger:#ef4444;
--ok:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOP */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
}
.topbar h2{color:var(--accent)}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

/* SIDEBAR */
.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}
.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{
height:260px;
background:black;
position:relative;
}
video{width:100%;height:100%;object-fit:contain}

/* LIST */
.list{
flex:1;
overflow:auto;
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:2px solid transparent;
position:relative;
}

.card:hover{border-color:var(--accent)}
.card.active{border-color:var(--accent)}

.locked{color:var(--warn)}
.unlocked{color:var(--ok)}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
background:#000;
margin-right:5px;
}

/* RIGHT PANEL */
.right{
width:280px;
background:var(--panel);
padding:10px;
overflow:auto;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent)}
.danger{background:var(--danger);color:#fff}
.warn{background:var(--warn)}

/* CHECKBOX */
.sel{
position:absolute;
top:8px;
right:8px;
}

input[type="text"]{
width:100%;
padding:10px;
margin-top:10px;
background:#0f1628;
border:none;
color:#fff;
border-radius:8px;
}

</style>
</head>

<body>

<div class="topbar">
<h2>🔒 BTECH-TV SUPER ADMIN v2</h2>
<button class="primary" onclick="saveState()">💾 Save</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat" onclick="filterAll()">📺 All</div>
<div class="cat" onclick="filterLocked()">🔒 Locked</div>
<div class="cat" onclick="filterUnlocked()">🔓 Unlocked</div>
<input type="text" placeholder="Search..." oninput="search(this.value)">
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="list" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h3>⚙ ADMIN TOOLS</h3>

<button class="primary" onclick="lockSelected()">🔒 Lock Selected</button>
<button class="primary" onclick="unlockSelected()">🔓 Unlock Selected</button>
<button class="danger" onclick="deleteLocked()">❌ Delete Locked</button>

<h3 style="margin-top:10px">📊 STATS</h3>
<p>Total: <span id="t">0</span></p>
<p>Locked: <span id="l">0</span></p>
<p>Unlocked: <span id="u">0</span></p>

</div>

</div>

<script>

/* =========================
STATE
========================= */

let channels=[];
let filtered=[];
let selected=new Set();
let currentIndex=0;

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =========================
INIT OR LOAD
========================= */

function init(){

let saved=localStorage.getItem("btech_channels");

if(saved){

channels=JSON.parse(saved);

}else{

generate();

}

filtered=[...channels];
render();
stats();

}

/* =========================
GENERATE
========================= */

function generate(){

for(let i=1;i<=150;i++){

channels.push({
id:i,
name:"BTECH CHANNEL "+i,
category:i%2?"Movies":"Sports",
url:streams[i%streams.length],
status:i%6===0?"locked":"unlocked",
type:i%3===0?"paid":"free"
});

}

}

/* =========================
RENDER
========================= */

function render(){

let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<input class="sel" type="checkbox" onchange="toggleSel(${c.id})">
<b>${c.name}</b><br>
<small>${c.category}</small><br>
<span class="badge ${c.status}">${c.status}</span>
`;

div.onclick=()=>play(i);

box.appendChild(div);

});

}

/* =========================
SELECT
========================= */

function toggleSel(id){

if(selected.has(id)){
selected.delete(id);
}else{
selected.add(id);
}

}

/* =========================
PLAY
========================= */

function play(i){

currentIndex=i;

let c=filtered[i];

let v=document.getElementById("video");

if(Hls.isSupported()){

let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);

}else{
v.src=c.url;
}

}

/* =========================
FILTERS
========================= */

function filterAll(){filtered=[...channels];render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterUnlocked(){filtered=channels.filter(c=>c.status==="unlocked");render();}

function search(v){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* =========================
ACTIONS
========================= */

function lockSelected(){

channels.forEach(c=>{
if(selected.has(c.id)) c.status="locked";
});

refresh();

}

function unlockSelected(){

channels.forEach(c=>{
if(selected.has(c.id)) c.status="unlocked";
});

refresh();

}

function deleteLocked(){

channels=channels.filter(c=>c.status!=="locked");
refresh();

}

/* =========================
REFRESH
========================= */

function refresh(){
filtered=[...channels];
render();
stats();
saveState();
}

/* =========================
STATS
========================= */

function stats(){

document.getElementById("t").innerText=channels.length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
document.getElementById("u").innerText=channels.filter(c=>c.status==="unlocked").length;

}

/* =========================
SAVE
========================= */

function saveState(){
localStorage.setItem("btech_channels",JSON.stringify(channels));
}

/* =========================
BOOT
========================= */

init();

</script>

</body>
</html>
