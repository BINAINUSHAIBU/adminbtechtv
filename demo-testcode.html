<style>

/* ==================================================
ROOT
================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* ==================================================
AUTH
================================================== */

#authBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.auth-card{
width:350px;
background:#0d1324;
padding:25px;
border-radius:12px;
border:1px solid #1d2b4f;
text-align:center;
}

.auth-card input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#101a31;
color:#fff;
}

.auth-card button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00d4ff;
font-weight:bold;
}

/* ==================================================
SIDEBAR
================================================== */

.sidebar{
width:300px;
background:#0d1324;
overflow-y:auto;
padding:15px;
border-right:1px solid #1f355d;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:20px;
}

.nav-btn{
width:100%;
padding:10px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

.nav-btn:hover{
background:#00d4ff;
color:#000;
}

.menu-title{
margin-top:15px;
margin-bottom:8px;
font-size:12px;
color:#00d4ff;
}

/* ==================================================
MAIN
================================================== */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:12px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.search{
padding:12px;
width:300px;
border:none;
border-radius:8px;
background:#101a31;
color:#fff;
}

.live{
background:red;
padding:8px 14px;
border-radius:20px;
}

/* ==================================================
STATS
================================================== */

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:10px;
}

.stat-card{
background:#101d39;
padding:15px;
border-radius:10px;
text-align:center;
}

.stat-card h3{
font-size:14px;
margin-bottom:5px;
}

.stat-card p{
font-size:26px;
font-weight:bold;
color:#00d4ff;
}

/* ==================================================
PLAYER
================================================== */

.player-container{
height:350px;
background:#000;
border-radius:12px;
overflow:hidden;
margin-bottom:10px;
}

video{
width:100%;
height:100%;
}

/* ==================================================
CHANNEL TABLE
================================================== */

.table-section{
background:#111a31;
border-radius:10px;
padding:10px;
overflow:auto;
flex:1;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #1f355d;
text-align:left;
}

th{
color:#00d4ff;
}

.free{
background:#16a34a;
padding:4px 10px;
border-radius:20px;
}

.paid{
background:#dc2626;
padding:4px 10px;
border-radius:20px;
}

.locked{
background:#f59e0b;
padding:4px 10px;
border-radius:20px;
}

.unlocked{
background:#2563eb;
padding:4px 10px;
border-radius:20px;
}

.action-btn{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.lock-btn{
background:#f59e0b;
}

.edit-btn{
background:#00d4ff;
}

.delete-btn{
background:#ef4444;
color:white;
}

</style>
</head>

<body>

<!-- AUTH -->

<div id="authBox">

<div class="auth-card">

<h2>📺 BTECH TV PRO MAX</h2>

<input id="email" placeholder="Email">

<input id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
📺 BTECH TV
</div>

<div class="sub">
WORLD PRO MAX ENTERPRISE
</div>

<button class="nav-btn">
Dashboard
</button>

<button class="nav-btn">
All Channels
</button>

<button class="nav-btn">
Free Channels
</button>

<button class="nav-btn">
Pay To View
</button>

<button class="nav-btn">
Locked Channels
</button>

<button class="nav-btn">
Users
</button>

<button class="nav-btn">
Subscriptions
</button>

<button class="nav-btn">
Settings
</button>

<div class="menu-title">
🌍 Countries
</div>

<button class="nav-btn">🇳🇬 Nigeria</button>
<button class="nav-btn">🇺🇸 USA</button>
<button class="nav-btn">🇬🇧 UK</button>
<button class="nav-btn">🇮🇳 India</button>

<div class="menu-title">
🔥 Tools
</div>

<button class="nav-btn">
📡 Scan
</button>

<button class="nav-btn">
⚡ Boost
</button>

<button class="nav-btn">
🚀 Ultra Feeds
</button>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<input
class="search"
placeholder="Search Channels..."
onkeyup="searchChannels(this.value)"
>

<div class="live">
🔴 LIVE
</div>

</div>

<div class="stats-grid">

<div class="stat-card">
<h3>Total Channels</h3>
<p id="totalChannels">40000</p>
</div>

<div class="stat-card">
<h3>Free Channels</h3>
<p id="freeChannels">26015</p>
</div>

<div class="stat-card">
<h3>Pay To View</h3>
<p id="premiumChannels">13985</p>
</div>

<div class="stat-card">
<h3>Locked Channels</h3>
<p id="lockedChannels">5917</p>
</div>

</div>

<div class="player-container">
<video id="videoPlayer" controls autoplay></video>
</div>

<div class="table-section">

<table>

<thead>

<tr>

<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="channelTable">

</tbody>

</table>

</div>

</div>

<script>

let channels=[];

const categories=[
"Sports",
"Movies",
"News",
"Kids",
"Music",
"Documentary",
"Entertainment",
"Education"
];

for(let i=1;i<=40000;i++){

channels.push({

id:i,

name:`BTECH Channel ${i}`,

category:
categories[
Math.floor(
Math.random()*categories.length
)],

type:
Math.random()>0.65
?
"Pay To View"
:
"Free",

status:
Math.random()>0.85
?
"Locked"
:
"Unlocked"

});

}

function render(){

let html="";

channels.slice(0,100).forEach(c=>{

html+=`

<tr>

<td>${c.name}</td>

<td>${c.category}</td>

<td>
<span class="${
c.type==="Free"
?
"free"
:
"paid"
}">
${c.type}
</span>
</td>

<td>
<span class="${
c.status==="Locked"
?
"locked"
:
"unlocked"
}">
${c.status}
</span>
</td>

<td>

<button class="action-btn lock-btn">
Lock
</button>

<button class="action-btn edit-btn">
Edit
</button>

<button class="action-btn delete-btn">
Delete
</button>

</td>

</tr>

`;

});

document
.getElementById("channelTable")
.innerHTML=html;

}

function login(){

document
.getElementById("authBox")
.style.display="none";

}

render();

</script>
