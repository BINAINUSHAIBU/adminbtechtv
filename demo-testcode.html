
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV Android IPTV App</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

/* LOGIN */
#login{
position:fixed;inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#050816;
}

.box{
background:#0f172d;
padding:20px;
border-radius:12px;
width:300px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
background:#111a31;
color:white;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#00d4ff;
font-weight:bold;
cursor:pointer;
}

/* APP */
#app{display:none;}

.header{
display:flex;
justify-content:space-between;
padding:10px;
background:#0d1324;
}

/* CHANNEL LIST */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{
border-color:#00d4ff;
}

/* VIDEO */
video{
width:100%;
height:220px;
background:black;
}

.menu{
display:flex;
gap:10px;
padding:10px;
flex-wrap:wrap;
}

.menu button{
flex:1;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>📱 WORLDTV LOGIN</h3>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="login()">LOGIN</button>
<p>demo: admin / admin</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="header">
<div>📺 WORLDTV APP</div>
<button onclick="logout()">Logout</button>
</div>

<video id="video" controls autoplay muted></video>

<div class="menu">
<button onclick="loadChannels()">📡 Load</button>
<button onclick="showFav()">⭐ Fav</button>
<button onclick="showAll()">🌍 All</button>
<button onclick="openAdmin()">⚙ Admin</button>
</div>

<div class="grid" id="grid"></div>

</div>

<script>

/* =========================
STATE
========================= */

let channels=[];
let fav = JSON.parse(localStorage.getItem("fav")||"{}");

/* =========================
LOGIN
========================= */

function login(){

let e=document.getElementById("email").value;
let p=document.getElementById("password").value;

if(e==="admin" && p==="admin"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
loadChannels();
}
}

function logout(){
location.reload();
}

/* =========================
LOAD IPTV (REAL M3U)
========================= */

async function loadChannels(){

const res=await fetch("https://iptv-org.github.io/iptv/index.m3u");
const text=await res.text();

let lines=text.split("\n");

channels=[];

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith("#EXTINF")){

let name=lines[i].split(",")[1];
let url=lines[i+1];

if(url && url.startsWith("http")){
channels.push({id:i,name,url});
}
}

}

render(channels);

}

/* =========================
RENDER
========================= */

function render(list){

let grid=document.getElementById("grid");
grid.innerHTML="";

list.forEach(c=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
${c.name}<br>
${fav[c.id]?"⭐":"♡"}
`;

div.onclick=()=>play(c.url);

div.ondblclick=()=>{
fav[c.id]=!fav[c.id];
localStorage.setItem("fav",JSON.stringify(fav));
render(list);
};

grid.appendChild(div);

});

}

/* =========================
PLAY VIDEO
========================= */

function play(url){

const video=document.getElementById("video");

if(Hls.isSupported()){
const hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}

video.play();

}

/* =========================
FILTERS
========================= */

function showFav(){

let list=channels.filter(c=>fav[c.id]);
render(list);

}

function showAll(){
render(channels);
}

/* =========================
ADMIN LINK
========================= */

function openAdmin(){
alert("Admin Panel: connect backend API here");
}

</script>

</body>
</html>
