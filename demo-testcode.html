<script>

/* FIREBASE */

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_PROJECT.firebaseapp.com",

projectId:"YOUR_PROJECT_ID",

appId:"YOUR_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();

/* VARIABLES */

let all=[];
let filteredChannels=[];
let currentHls=null;
let currentIndex=0;
let dark=true;

let favs=
JSON.parse(localStorage.getItem('favs')||'{}');

const video=
document.getElementById('video');

/* LOGIN */

async function loginUser(){

const email='demo@btechtv.com';

const password='Demo1234';

try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(err){

document.getElementById('authMsg').innerText=
err.message;

}

}

/* AUTH */

auth.onAuthStateChanged((user)=>{

if(user){

document.getElementById('authModal').style.display='none';

}else{

document.getElementById('authModal').style.display='flex';

}

});

/* LOAD PLAYLIST */

async function loadPlaylist(url){

const res=await fetch(url);

const text=await res.text();

all=[];

parseM3U(text);

filteredChannels=[...all];

renderChannels();

}

/* PARSE */

function parseM3U(data){

const lines=data.split('\\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=
info.match(/tvg-logo=\"(.*?)\"/);

all.push({

id:all.length+1,

name:name,

url:url,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60'

});

}

}

}

/* RENDER */

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div>

<h4>${c.name}</h4>

</div>

</div>

<div
onclick="event.stopPropagation();toggleFav(${c.id})"
style="font-size:22px;"
>
${favs[c.id] ? '★':'☆'}
</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=
filteredChannels[index];

if(!channel){
return;
}

if(currentHls){
currentHls.destroy();
}

if(Hls.isSupported()){

currentHls=new Hls();

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){
video.play();
}
);

}else{

video.src=channel.url;

video.play();

}

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'favs',
JSON.stringify(favs)
);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value)

);

renderChannels();

}

/* PROFILE */

function openProfile(){

const user=auth.currentUser;

if(!user){
return;
}

document.getElementById('profilePanel').style.display='flex';

document.getElementById('profileEmail').innerText=
'Email: '+user.email;

}

function closeProfile(){

document.getElementById('profilePanel').style.display='none';

}

/* LOGOUT */

async function logoutUser(){

await auth.signOut();

location.reload();

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* START */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u'
);

</script>

</body>
</html>
