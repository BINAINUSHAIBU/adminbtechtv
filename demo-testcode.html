
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV WORLD ULTRA MAX X OFFLINE</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
header{background:#111827;padding:12px;text-align:center;font-weight:bold}
.wrap{display:flex;height:calc(100vh - 50px)}
aside{width:300px;background:#0f172a;padding:10px;overflow:auto}
main{flex:1;display:flex;flex-direction:column}
input{width:100%;padding:10px;border-radius:8px;border:0}
.player{height:320px;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%}
.channels{flex:1;overflow:auto;padding:10px}
.channel{background:#1e293b;margin:8px 0;padding:10px;border-radius:8px;cursor:pointer}
.channel:hover{background:#334155}
.stats{padding:10px;background:#111827}
button{padding:8px 12px;margin:4px;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header>📺 BTECH-TV WORLD ULTRA MAX X OFFLINE EDITION</header>
<div class="wrap">
<aside>
<input id="search" placeholder="Search channels...">
<div class="stats">Offline Demo • 5000 Capacity Engine Structure</div>
</aside>
<main>
<div class="player">
<video id="video" controls></video>
</div>
<div style="padding:10px">
<button onclick="prevChannel()">◀ Prev</button>
<button onclick="nextChannel()">Next ▶</button>
</div>
<div class="channels" id="list"></div>
</main>
</div>
<script>
const channels=[];
for(let i=1;i<=5000;i++){
 channels.push({
  name:"Channel "+i,
  group:"Demo Group "+((i%20)+1),
  url:""
 });
}
let filtered=[...channels];
let current=0;

function render(){
 const box=document.getElementById("list");
 box.innerHTML="";
 filtered.slice(0,300).forEach((c,i)=>{
   const d=document.createElement("div");
   d.className="channel";
   d.innerHTML="<b>"+c.name+"</b><br><small>"+c.group+"</small>";
   d.onclick=()=>play(i);
   box.appendChild(d);
 });
}

function play(i){
 current=i;
 alert("Offline demo: attach your own M3U/HLS streams.");
}

function nextChannel(){
 current=(current+1)%filtered.length;
 play(current);
}
function prevChannel(){
 current=(current-1+filtered.length)%filtered.length;
 play(current);
}

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 filtered=channels.filter(c=>c.name.toLowerCase().includes(q));
 render();
});

render();
</script>
</body>
</html>
