<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📺 SUPER ADMIN IPTV ULTRA MAX WORLD</title>

<meta name="theme-color" content="#050816"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--accent:#00d4ff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0d1324;
padding:10px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:20px;
font-weight:900;
color:var(--accent);
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:8px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
}

/* PLAYER */
.player{height:300px;background:black}
video{width:100%;height:100%}

/* TABLE */
.table-wrap{flex:1;overflow:auto;padding:10px}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th{position:sticky;top:0;background:#0f172a;color:var(--accent)}
td,th{padding:8px;border-bottom:1px solid #1f2b4d}

.locked{color:red;font-weight:bold}
.unlocked{color:lime;font-weight:bold}

.actions button{margin:2px;padding:4px 6px;border:none;border-radius:4px;cursor:pointer}
.lock{background:#f59e0b}
.edit{background:#2563eb;color:#fff}
.del{background:#dc2626;color:#fff}

/* MODAL */
.modal{
position:fixed;inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:#111827;
padding:20px;
border-radius:10px;
width:320px;
}

</style>
</head>

<body>

<div class="container">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<h4>🌍 Countries</h4>
<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>

<h4>🎬 Categories</h4>
<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>
<button class="nav-btn" onclick="loadCat('music')">🎵 Music</button>

<h4>🔥 Tools</h4>
<button class="nav-btn" onclick="scan()">📡 Scan</button>
<button class="nav-btn" onclick="boost()">⚡ Boost</button>
<button class="nav-btn" onclick="repair()">🛠 Repair</button>
<button class="nav-btn" onclick="openPay()">💳 Upgrade</button>
<button class="nav-btn" onclick="startTrial()">⏱ Trial</button>
<button class="nav-btn" onclick="openAdmin()">⚙ Admin</button>

</div>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="topbar">
<div>📺 SUPER ADMIN IPTV SYSTEM</div>
<div id="status">TRIAL: OFF</div>
</div>

<div class="player">
<video id="video" controls></video>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Name</th><th>Category</th><th>Type</th><th>Status</th><th>Actions</th>
</tr>
</thead>
<tbody id="grid"></tbody>
</table>
</div>

</div>
</div>

<!-- ================= PAYMENT MODAL ================= -->
<div class="modal" id="pay">
<div class="box">
<h3>UPGRADE PLAN</h3>
<button onclick="pay('Paystack')">Paystack</button>
<button onclick="pay('Flutterwave')">Flutterwave</button>
<button onclick="pay('OPay')">OPay</button>
<button onclick="closePay()">Close</button>
</div>
</div>

<!-- ================= ADMIN ================= -->
<div class="modal" id="admin">
<div class="box">
<h3>ADMIN PANEL</h3>
<button onclick="scan()">Scan</button>
<button onclick="boost()">Boost</button>
<button onclick="repair()">Repair</button>
<button onclick="closeAdmin()">Close</button>
</div>
</div>

<script>

let video=document.getElementById("video");
let hls;
let trial=false;

/* ================= FULL CHANNEL LIST ================= */
let channels=[
{name:"ACNN (480p)",cat:"Education",type:"Pay To View",lock:"Locked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Channels TV",cat:"News",type:"Pay To View",lock:"Unlocked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Africa TV3 (720p)",cat:"Sports",type:"Pay To View",lock:"Unlocked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Bride TV",cat:"Education",type:"Free",lock:"Unlocked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"LoveWorld USA",cat:"Movies",type:"Pay To View",lock:"Unlocked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Wazobia TV",cat:"Music",type:"Free",lock:"Unlocked",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
];

/* ================= RENDER ================= */
function render(){
let g=document.getElementById('grid');
g.innerHTML='';
channels.forEach((c,i)=>{
g.innerHTML+=`
<tr onclick="play(${i})">
<td>${c.name}</td>
<td>${c.cat}</td>
<td>${c.type}</td>
<td class="${c.lock==='Locked'?'locked':'unlocked'}">${c.lock}</td>
<td>
<button class="lock" onclick="event.stopPropagation();toggle(${i})">Lock</button>
<button class="edit" onclick="event.stopPropagation();edit(${i})">Edit</button>
<button class="del" onclick="event.stopPropagation();del(${i})">Delete</button>
</td>
</tr>`;
});
}
render();

/* ================= PLAY ================= */
function play(i){
let c=channels[i];
if(c.lock==="Locked"){alert("Locked Channel");return;}

if(hls)hls.destroy();
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}

/* ================= ACTIONS ================= */
function toggle(i){
channels[i].lock=channels[i].lock==="Locked"?"Unlocked":"Locked";
render();
}

function edit(i){
let n=prompt("Edit Name",channels[i].name);
if(n)channels[i].name=n;
render();
}

function del(i){
if(confirm("Delete channel?"))channels.splice(i,1);
render();
}

/* ================= TRIAL ================= */
function startTrial(){
trial=true;
document.getElementById("status").innerText="TRIAL: 3 MIN ACTIVE";
setTimeout(()=>{
trial=false;
document.getElementById("status").innerText="TRIAL EXPIRED";
},180000);
}

/* ================= PAYMENT ================= */
function openPay(){document.getElementById("pay").style.display="flex";}
function closePay(){document.getElementById("pay").style.display="none";}
function pay(gw){
alert("Payment successful via "+gw+" (DEMO)");
closePay();
}

/* ================= ADMIN ================= */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}

function scan(){alert("Scanning channels...");}
function boost(){video.playbackRate=1.2;}
function repair(){alert("Repairing streams...");}

</script>

</body>
</html>
