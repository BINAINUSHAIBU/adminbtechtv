<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTT TV</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #000;
    color: white;
}

header {
    padding: 15px;
    text-align: center;
    background: #111;
    font-size: 18px;
}

#player {
    width: 100%;
    height: 220px;
    background: black;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.channels {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
}

.channel {
    flex: 1 1 45%;
    background: #222;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
}

.channel:hover {
    background: red;
}

.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    background: #111;
    padding: 10px;
}

button {
    background: red;
    border: none;
    color: white;
    padding: 10px;
    border-radius: 5px;
}
</style>
</head>

<body>

<header>📺 MY OTT TV APP</header>

<!-- PLAYER -->
<div id="player">
    <iframe id="screen" src="https://YOUR-IPTV-WEBSITE.com"></iframe>
</div>

<!-- CHANNELS -->
<div class="channels">

    <div class="channel" onclick="play('https://YOUR-IPTV-WEBSITE.com')">
        🏠 Home
    </div>

    <div class="channel" onclick="play('https://example.com/live1.m3u8')">
        📡 Live 1
    </div>

    <div class="channel" onclick="play('https://example.com/live2.m3u8')">
        📡 Live 2
    </div>

    <div class="channel" onclick="play('https://example.com/movie.mp4')">
        🎬 Movies
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <button onclick="home()">Home</button>
    <button onclick="reload()">Reload</button>
    <button onclick="fullscreen()">Fullscreen</button>
</div>

<script>

function play(url){
    document.getElementById("screen").src = url;
}

function home(){
    document.getElementById("screen").src = "https://YOUR-IPTV-WEBSITE.com";
}

function reload(){
    let frame = document.getElementById("screen");
    frame.src = frame.src;
}

function fullscreen(){
    let el = document.getElementById("screen");
    if (el.requestFullscreen) {
        el.requestFullscreen();
    }
}

</script>

</body>
</html>
