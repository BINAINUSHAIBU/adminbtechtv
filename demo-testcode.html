<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH QUIZ PRO MAX SUPER ADMIN</title>

<style>

/* =========================================
ROOT
========================================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer;border:none}

/* =========================================
TOPBAR
========================================= */

.topbar{
height:70px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

.container{
display:flex;
height:calc(100vh - 70px);
}

/* SIDEBAR */

.sidebar{
width:270px;
background:#0f1628;
padding:15px;
overflow:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.cat{
padding:12px;
background:var(--card);
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */

.main{
flex:1;
padding:15px;
overflow:auto;
}

/* QUIZ CHANNELS */

.channels{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:10px;
}

.channel{
background:var(--card);
padding:15px;
border-radius:12px;
cursor:pointer;
}

.channel:hover{
background:var(--hover);
}

/* ADMIN PANEL */

.admin{
width:340px;
background:var(--panel);
padding:15px;
overflow:auto;
border-left:1px solid rgba(255,255,255,.05);
}

.box{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
}

.btn{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
font-weight:bold;
background:var(--accent);
color:black;
}

.success{background:var(--success);color:white}
.danger{background:var(--danger);color:white}
.warning{background:var(--warning);color:black}

.quizBox{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

.option{
padding:10px;
background:#0f1628;
margin-top:8px;
border-radius:8px;
cursor:pointer;
}

.option:hover{background:var(--hover)}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">🎯 BTECH QUIZ SUPER ADMIN</div>
<div id="userBox">ADMIN PANEL</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="loadChannel('multiple')">📝 Multiple Quiz</div>
<div class="cat" onclick="loadChannel('audio')">🎧 Audio Quiz</div>
<div class="cat" onclick="loadChannel('picture')">🖼 Picture Quiz</div>
<div class="cat" onclick="loadChannel('millionaire')">🏆 Who Wants Millionaire</div>

<div class="cat" onclick="showWinners()">🏆 Winners</div>
<div class="cat" onclick="showPayments()">💳 Payments</div>
<div class="cat" onclick="showLeaderboard()">📊 Leaderboard</div>

</div>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- ADMIN PANEL -->
<div class="admin">

<div class="box">
<h3>➕ Add Question</h3>

<input id="q" placeholder="Question">
<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">
<input id="ans" placeholder="Correct Answer">

<button class="btn" onclick="addQuestion()">Add Question</button>
</div>

<div class="box">
<h3>⚙ Quiz Settings</h3>

<select>
<option>Multiple Choice</option>
<option>Audio Quiz</option>
<option>Picture Quiz</option>
<option>Millionaire Mode</option>
</select>

<button class="btn warning">Save Settings</button>
</div>

<div class="box">
<h3>💰 Jackpot Control</h3>
<p>Total Jackpot: ₦1,000,000</p>
<button class="btn success">Approve Winner</button>
<button class="btn danger">Reset Jackpot</button>
</div>

</div>

</div>

<script>

/* =========================================
DATA
========================================= */

let questions=[
{
type:"multiple",
q:"Capital of Nigeria?",
options:["Lagos","Abuja","Kano","Ibadan"],
answer:"Abuja"
}
];

let submissions=[];
let winners=[];
let jackpot=1000000;

/* =========================================
LOAD CHANNEL
========================================= */

function loadChannel(type){

let box=document.getElementById("main");

box.innerHTML="";

let filtered=questions.filter(q=>q.type===type || type==="multiple");

filtered.forEach((q,i)=>{

box.innerHTML+=`
<div class="quizBox">

<h3>${q.q}</h3>

${q.options.map(o=>`
<div class="option" onclick="submitAnswer('${o}','${q.answer}')">${o}</div>
`).join("")}

</div>
`;

});

}

/* =========================================
SUBMIT ANSWER
========================================= */

function submitAnswer(val,correct){

let time=new Date().toLocaleTimeString();

let score=(val===correct)?10:0;

submissions.push({
answer:val,
correct:correct,
score:score,
time:time
});

alert("Submitted: "+score+" points");
}

/* =========================================
ADD QUESTION
========================================= */

function addQuestion(){

questions.push({
type:"multiple",
q:document.getElementById("q").value,
options:[
o1.value,o2.value,o3.value,o4.value
],
answer:ans.value
});

alert("Question Added");
}

/* =========================================
WINNERS
========================================= */

function showWinners(){

let box=document.getElementById("main");

box.innerHTML="<h2>🏆 Winners</h2>";

winners.forEach(w=>{

box.innerHTML+=`
<p>👤 ${w.name} - ₦${w.amount}</p>
`;

});

}

/* =========================================
PAYMENTS
========================================= */

function showPayments(){

document.getElementById("main").innerHTML=`
<h2>💳 Payment Requests</h2>
<p>No pending payments</p>
`;
}

/* =========================================
LEADERBOARD
========================================= */

function showLeaderboard(){

let box=document.getElementById("main");

box.innerHTML="<h2>📊 Leaderboard</h2>";

submissions.forEach((s,i)=>{

box.innerHTML+=`
<p>#${i+1} - Score: ${s.score} - Time: ${s.time}</p>
`;

});

}

</script>

</body>
</html>
