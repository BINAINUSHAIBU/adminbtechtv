<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV USER MANAGER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#08111f;
--panel:#111827;
--card:#1b2438;
--hover:#26344f;
--accent:#00d4ff;
--accent2:#00ff99;
--danger:#ef4444;
--warning:#f59e0b;
--text:#ffffff;
--muted:#94a3b8;
--bdr:rgba(255,255,255,.06);
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
border:none;
cursor:pointer;
}

img{
max-width:100%;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:70px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid var(--bdr);
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.top-actions button{
padding:10px 16px;
border-radius:10px;
background:var(--card);
color:white;
transition:.3s;
font-size:13px;
}

.top-actions button:hover{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 70px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:340px;
background:#0f172a;
display:flex;
flex-direction:column;
border-right:1px solid var(--bdr);
overflow:hidden;
}

.sidebar-top{
padding:15px;
border-bottom:1px solid var(--bdr);
}

.sidebar h3{
margin-bottom:15px;
color:var(--accent);
}

.side-btn{
width:100%;
padding:14px;
margin-bottom:10px;
background:var(--card);
border-radius:12px;
color:white;
text-align:left;
transition:.3s;
}

.side-btn:hover,
.side-btn.active{
background:var(--accent);
color:black;
transform:translateX(4px);
}

/* =========================
SEARCH + FILTERS
========================= */

.search-box{
padding:15px;
border-bottom:1px solid var(--bdr);
}

.search-box input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:var(--card);
color:white;
}

.filters{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:12px;
border-bottom:1px solid var(--bdr);
}

.ftag{
padding:7px 10px;
border-radius:20px;
background:var(--card);
color:white;
font-size:11px;
}

.ftag.on{
background:var(--accent);
color:black;
}

/* =========================
CHANNEL LIST
========================= */

.channel-list{
flex:1;
overflow:auto;
padding:10px;
}

.ch{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:12px;
background:var(--card);
margin-bottom:8px;
cursor:pointer;
transition:.3s;
}

.ch:hover,
.ch.on{
background:var(--hover);
border:1px solid rgba(0,212,255,.4);
}

.ch-logo{
width:50px;
height:50px;
border-radius:12px;
background:#0b1220;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:12px;
font-weight:bold;
flex-shrink:0;
}

.ch-logo img{
width:100%;
height:100%;
object-fit:cover;
}

.ch-inf{
flex:1;
min-width:0;
}

.ch-nm{
font-size:13px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.ch-meta{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.qbadge{
display:inline-block;
padding:2px 6px;
border-radius:20px;
background:#334155;
font-size:9px;
margin-left:4px;
}

.hd{
background:#2563eb;
}

.fav-star{
font-size:18px;
cursor:pointer;
color:#64748b;
}

.fav-star.on{
color:#facc15;
}

.alive-dot{
color:#22c55e;
}

.dead-x{
color:#ef4444;
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */

.player-wrap{
padding:15px;
background:#0f172a;
border-bottom:1px solid var(--bdr);
}

.player-box{
width:100%;
height:340px;
background:black;
border-radius:16px;
overflow:hidden;
position:relative;
border:2px solid rgba(0,212,255,.15);
}

.player-box video{
width:100%;
height:100%;
object-fit:cover;
background:black;
}

.live{
position:absolute;
top:12px;
left:12px;
background:red;
padding:6px 12px;
border-radius:30px;
font-size:11px;
font-weight:bold;
z-index:10;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.65);
font-size:18px;
font-weight:bold;
z-index:20;
}

.overlay.off{
display:none;
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
display:flex;
align-items:center;
gap:15px;
padding:15px;
background:var(--panel);
border-bottom:1px solid var(--bdr);
}

.np-logo{
width:70px;
height:70px;
border-radius:14px;
background:#0b1220;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:30px;
}

.np-logo img{
width:100%;
height:100%;
object-fit:cover;
}

.np-info{
flex:1;
}

.np-name{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.np-meta{
font-size:13px;
color:var(--muted);
margin-bottom:6px;
}

.np-program{
font-size:13px;
color:var(--accent2);
}

.np-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.np-actions button{
padding:10px 14px;
border-radius:10px;
background:var(--card);
color:white;
font-size:12px;
}

.np-actions button:hover{
background:var(--accent);
color:black;
}

/* =========================
STATS
========================= */

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
padding:15px;
background:var(--panel);
border-bottom:1px solid var(--bdr);
}

.stat-card{
background:var(--card);
padding:20px;
border-radius:14px;
}

.stat-card h4{
color:var(--muted);
font-size:13px;
margin-bottom:10px;
}

.stat-card h2{
font-size:28px;
color:var(--accent);
}

/* =========================
TABLE
========================= */

.table-wrap{
flex:1;
overflow:auto;
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
min-width:1400px;
}

thead{
background:var(--panel);
position:sticky;
top:0;
z-index:10;
}

th{
padding:14px;
text-align:left;
font-size:13px;
color:var(--accent);
}

td{
padding:14px;
border-bottom:1px solid var(--bdr);
font-size:13px;
}

tr{
background:var(--card);
transition:.3s;
}

tr:hover{
background:var(--hover);
}

.user-box{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:black;
}

.badge{
padding:5px 10px;
border-radius:30px;
font-size:11px;
font-weight:bold;
display:inline-block;
}

.active{
background:#16a34a;
}

.blocked{
background:#dc2626;
}

.premium{
background:#2563eb;
}

.free{
background:#64748b;
}

.online{
background:#00ff99;
color:black;
}

.offline{
background:#475569;
}

/* =========================
ACTION BUTTONS
========================= */

.action-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.small-btn{
padding:8px 12px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

.edit{
background:#2563eb;
color:white;
}

.lock{
background:#dc2626;
color:white;
}

.unlock{
background:#16a34a;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

/* =========================
MOBILE
========================= */

@media(max-width:1000px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
height:400px;
}

.player-box{
height:240px;
}

.stats-grid{
grid-template-columns:1fr 1fr;
}

.now-playing{
flex-direction:column;
align-items:flex-start;
}

}

</style>
</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV USER MANAGER
</div>

<div class="top-actions">

<button onclick="generateUsers()">
⚡ Generate Users
</button>

<button onclick="toggleTheme()">
🌙 Theme
</button>

<button onclick="exportUsers()">
⬇ Export
</button>

<button onclick="reloadSystem()">
🚀 Reload
</button>

</div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

<div class="sidebar-top">

<h3>📂 IPTV CHANNELS</h3>

<button class="side-btn active">📺 Live Channels</button>
<button class="side-btn">⭐ Favorites</button>
<button class="side-btn">🕘 Recent</button>

</div>

<div class="search-box">

<input
id="srch"
type="text"
placeholder="Search channels..."
oninput="debouncedFilter()"
>

</div>

<div class="filters" id="filters"></div>

<div class="channel-list" id="chlist"></div>

</div>

<!-- =========================
MAIN
========================= -->

<div class="main">

<!-- =========================
PLAYER
========================= -->

<div class="player-wrap">

<div class="player-box">

<div class="live">
🔴 LIVE
</div>

<div class="overlay" id="overlay">
Loading Stream...
</div>

<video
id="vid"
controls
autoplay
muted
playsinline>
</video>

</div>

</div>

<!-- =========================
NOW PLAYING
========================= -->

<div class="now-playing">

<div class="np-logo" id="np-logo">
📡
</div>

<div class="np-info">

<div class="np-name" id="np-name">
No Channel Selected
</div>

<div class="np-meta" id="np-meta">
Ready
</div>

<div class="np-program" id="np-program">
Waiting for stream...
</div>

</div>

<div class="np-actions">

<button onclick="prev()">
⏮ Prev
</button>

<button onclick="next()">
⏭ Next
</button>

<button onclick="togglePiP()">
🖼 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

</div>

</div>

<!-- =========================
STATS
========================= -->

<div class="stats-grid">

<div class="stat-card">
<h4>Total Users</h4>
<h2 id="totalUsers">0</h2>
</div>

<div class="stat-card">
<h4>Premium</h4>
<h2 id="premiumUsers">0</h2>
</div>

<div class="stat-card">
<h4>Blocked</h4>
<h2 id="blockedUsers">0</h2>
</div>

<div class="stat-card">
<h4>Online</h4>
<h2 id="onlineUsers">0</h2>
</div>

<div class="stat-card">
<h4>Streams</h4>
<h2 id="streamUsers">0</h2>
</div>

<div class="stat-card">
<h4>Channels</h4>
<h2 id="channelCount">0</h2>
</div>

</div>

<!-- =========================
TABLE
========================= -->

<div class="table-wrap">

<table>

<thead>

<tr>
<th>ID</th>
<th>User</th>
<th>Email</th>
<th>Plan</th>
<th>Status</th>
<th>Streaming</th>
<th>Devices</th>
<th>Country</th>
<th>Bandwidth</th>
<th>Expiry</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="userTable"></tbody>

</table>

</div>

</div>

</div>

<script>

/* =========================
GLOBAL STATE
========================= */

let users = [];
let filteredUsers = [];
let dark = true;

const maxUsers = 5000;

/* =========================
IPTV STATE
========================= */

var all=[],filtered=[],cur=null,cat='All',hlsP=null;
var deadCh={},aliveCh={};
var favs=JSON.parse(localStorage.getItem('atv_favs')||'{}');

/* =========================
FLAG
========================= */

function flag(cc){
if(!cc||cc.length!==2)return'🌐';
var a=0x1F1E6;
return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);
}

/* =========================
INIT IPTV
========================= */

async function initIPTV(){

document.getElementById("overlay").innerHTML =
"Loading IPTV Channels...";

try{

const chRes =
await fetch(
'https://iptv-org.github.io/api/channels.json'
).then(r=>r.json());

const stRes =
await fetch(
'https://iptv-org.github.io/api/streams.json'
).then(r=>r.json());

const lgRes =
await fetch(
'https://iptv-org.github.io/api/logos.json'
).then(r=>r.json());

const channelMap = {};
const logoMap = {};

chRes.forEach(ch=>{

if(!ch.is_nsfw){

channelMap[ch.id]=ch;

}

});

lgRes.forEach(lg=>{

if(!logoMap[lg.channel]){

logoMap[lg.channel]=lg.url;

}

});

let id=0;
let seen={};

stRes.forEach(st=>{

if(!st.url || seen[st.url]) return;

if(
st.url.includes("youtube.com") ||
st.url.includes("youtu.be")
)return;

seen[st.url]=1;

const ch = st.channel
? channelMap[st.channel]
: null;

id++;

all.push({

id:id,
chId:st.channel||null,
n:ch?ch.name:(st.title||"Unknown"),
u:st.url,
q:st.quality||null,
cc:ch?ch.country:null,
cat:
ch &&
ch.categories &&
ch.categories.length
? ch.categories[0]
: 'other',
logo:
st.channel
? logoMap[st.channel]
: null

});

});

document.getElementById(
"channelCount"
).innerText =
all.length.toLocaleString();

renderCats();

doFilter();

document.getElementById("overlay")
.classList.add("off");

}catch(e){

document.getElementById("overlay")
.innerHTML =
"Failed To Load IPTV";

console.log(e);

}

}

/* =========================
RENDER CATEGORIES
========================= */

function renderCats(){

var cs=['All'];
var seen={};

for(var i=0;i<all.length;i++){

var k=all[i].cat;

if(k&&!seen[k]){

cs.push(k);
seen[k]=1;

}

}

document.getElementById("filters")
.innerHTML = cs.map(c=>`

<button
class="ftag ${c===cat?'on':''}"
onclick="setCat('${c}')">

${c}

</button>

`).join('');

}

function setCat(c){

cat=c;

renderCats();

doFilter();

}

/* =========================
FILTER CHANNELS
========================= */

function debouncedFilter(){

clearTimeout(window.ft);

window.ft=setTimeout(
doFilter,
200
);

}

function doFilter(){

const q =
document.getElementById("srch")
.value
.toLowerCase();

filtered=[];

all.forEach(c=>{

const mc =
cat==="All" || c.cat===cat;

const mq =
!q ||
c.n.toLowerCase().includes(q);

if(mc && mq){

filtered.push(c);

}

});

renderList();

}

/* =========================
RENDER CHANNELS
========================= */

function renderList(){

const box =
document.getElementById("chlist");

let h='';

filtered.slice(0,500).forEach(c=>{

const logo =
c.logo
? `<img src="${c.logo}">`
: c.n.slice(0,2);

h+=`

<div
class="ch ${cur&&cur.id===c.id?'on':''}"
onclick="tune(${c.id})">

<div class="ch-logo">
${logo}
</div>

<div class="ch-inf">

<div class="ch-nm">
${c.n}

${c.q
? `<span class="qbadge">${c.q}</span>`
: ''}
</div>

<div class="ch-meta">
${c.cc?flag(c.cc):'🌐'}
${c.cat}
</div>

</div>

<div
class="fav-star ${favs[c.id]?'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})">

${favs[c.id]?'★':'☆'}

</div>

</div>

`;

});

box.innerHTML = h;

}

/* =========================
FAVORITES
========================= */

function toggleFav(id){

favs[id]
? delete favs[id]
: favs[id]=1;

localStorage.setItem(
"atv_favs",
JSON.stringify(favs)
);

renderList();

}

/* =========================
TUNE CHANNEL
========================= */

function tune(id){

const ch =
all.find(c=>c.id===id);

if(!ch)return;

cur=ch;

renderList();

document.getElementById(
"np-name"
).innerText = ch.n;

document.getElementById(
"np-meta"
).innerText =
(ch.cc?flag(ch.cc)+' ':'') +
(ch.cat||'');

document.getElementById(
"np-program"
).innerText =
"Streaming Live";

document.getElementById(
"np-logo"
).innerHTML =
ch.logo
? `<img src="${ch.logo}">`
: '📡';

const video =
document.getElementById("vid");

if(hlsP){

hlsP.destroy();

hlsP=null;

}

video.pause();

document.getElementById("overlay")
.classList.remove("off");

document.getElementById("overlay")
.innerHTML =
"Loading Stream...";

if(Hls.isSupported()){

hlsP = new Hls();

hlsP.loadSource(ch.u);

hlsP.attachMedia(video);

hlsP.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

document.getElementById(
"overlay"
).classList.add("off");

aliveCh[ch.id]=1;

}

);

hlsP.on(
Hls.Events.ERROR,
function(){

document.getElementById(
"overlay"
).classList.remove("off");

document.getElementById(
"overlay"
).innerHTML =
"Stream Failed";

deadCh[ch.id]=1;

}

);

}else{

video.src = ch.u;

video.play();

}

}

/* =========================
PLAYER ACTIONS
========================= */

function prev(){

if(!cur || !filtered.length){

tune(filtered[0].id);

return;

}

let i =
filtered.findIndex(
c=>c.id===cur.id
);

i = i<=0
? filtered.length-1
: i-1;

tune(filtered[i].id);

}

function next(){

if(!cur || !filtered.length){

tune(filtered[0].id);

return;

}

let i =
filtered.findIndex(
c=>c.id===cur.id
);

i = i>=filtered.length-1
? 0
: i+1;

tune(filtered[i].id);

}

function togglePiP(){

const v =
document.getElementById("vid");

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

v.requestPictureInPicture();

}

}

function shareChannel(){

if(!cur){

alert("Select a channel first");

return;

}

navigator.clipboard.writeText(cur.u);

alert("Stream URL copied!");

}

/* =========================
GENERATE USERS
========================= */

function generateUsers(){

users = [];

const countries = [
"Nigeria",
"USA",
"UK",
"India",
"France",
"Germany",
"Brazil",
"Canada"
];

for(let i=1;i<=maxUsers;i++){

users.push({

id:i,

name:"BTECH_USER_"+i,

email:"user"+i+"@btechtv.com",

premium:Math.random()>0.6,
blocked:Math.random()>0.95,
online:Math.random()>0.5,
streaming:Math.random()>0.4,

devices:
Math.floor(Math.random()*5)+1,

country:
countries[
Math.floor(
Math.random()*countries.length
)
],

bandwidth:
Math.floor(
Math.random()*1000
)+" Mbps",

expiry:
"2027-"+String(
Math.floor(Math.random()*12)+1
).padStart(2,"0")+"-"+String(
Math.floor(Math.random()*28)+1
).padStart(2,"0")

});

}

filteredUsers = [...users];

updateStats();

renderUsers();

}

/* =========================
RENDER USERS
========================= */

function renderUsers(limit=500){

const table =
document.getElementById("userTable");

table.innerHTML = "";

filteredUsers
.slice(0,limit)
.forEach(user=>{

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>${user.id}</td>

<td>
<div class="user-box">
<div class="avatar">
${user.name.charAt(0)}
</div>
<div>
<strong>${user.name}</strong>
</div>
</div>
</td>

<td>${user.email}</td>

<td>
<span class="badge ${
user.premium
? 'premium'
: 'free'
}">
${user.premium
? 'PREMIUM'
: 'FREE'}
</span>
</td>

<td>
<span class="badge ${
user.blocked
? 'blocked'
: 'active'
}">
${user.blocked
? 'BLOCKED'
: 'ACTIVE'}
</span>
</td>

<td>
<span class="badge ${
user.streaming
? 'online'
: 'offline'
}">
${user.streaming
? 'STREAMING'
: 'OFFLINE'}
</span>
</td>

<td>${user.devices}</td>
<td>${user.country}</td>
<td>${user.bandwidth}</td>
<td>${user.expiry}</td>

<td>

<div class="action-buttons">

<button
class="small-btn edit"
onclick="editUser(${user.id})">
Edit
</button>

<button
class="small-btn ${
user.blocked
? 'unlock'
: 'lock'
}"
onclick="toggleBlock(${user.id})">
${user.blocked
? 'Unlock'
: 'Block'}
</button>

<button
class="small-btn delete"
onclick="deleteUser(${user.id})">
Delete

`;

});

users.find(
u=>u.id===id
);

user.blocked =
!user.blocked;

updateStats();

renderUsers();

}

}

function deleteUser(id){

users =
users.filter(
u=>u.id!==id
);

filteredUsers =
filteredUsers.filter(
u=>u.id!==id
);

updateStats();

renderUsers();

}
