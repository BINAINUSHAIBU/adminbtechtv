<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV SAAS IPTV ONE PAGE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;overflow:hidden}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#111827;
flex-wrap:wrap;
}

button{
margin:3px;
padding:8px 10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1f2937;
color:#fff;
font-size:12px;
}
button:hover{background:#374151}

.logo{color:#00d4ff;font-weight:bold}

/* LAYOUT */
.container{display:flex;height:100vh}

.sidebar{
width:260px;
background:#0b1220;
overflow:auto;
padding:10px;
}

.cat{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}
.cat:hover{background:#1f2937}

.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{
height:320px;
background:black;
position:relative;
}

video{width:100%;height:100%;object-fit:contain}

.overlay{
position:absolute;inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.85);
flex-direction:column;
}

/* CHANNELS */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:#111827;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.channel.locked{opacity:.5;border:1px solid red}

.badge{
font-size:10px;
padding:3px 6px;
border-radius:6px;
}
.free{background:green}
.lock{background:red}

/* ADMIN */
.admin{
position:fixed;
right:10px;
top:60px;
width:250px;
background:#111827;
padding:10px;
border-radius:10px;
display:none;
}

.expired{
position:fixed;
inset:0;
background:black;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:999;
}

.expired h1{color:red}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="logo">📺 BTECH SAAS IPTV</div>

<div>
<button onclick="toggleAdmin()">🧑‍💼 Admin</button>
<button onclick="unlockAll()">🔓 Unlock</button>
<button onclick="lockAll()">🔒 Lock</button>
<button onclick="checkTrial()">⏳ Trial</button>
</div>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="adminBox">
<h4>ADMIN LOGIN</h4>
<input id="pass" placeholder="password" style="width:100%;padding:6px"/>
<button onclick="login()">Login</button>
<button onclick="resetTrial()">Reset Trial</button>
</div>

<!-- EXPIRED -->
<div class="expired" id="expired">
<h1>TRIAL EXPIRED</h1>
<p>Upgrade to Premium Access</p>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🌍 Countries</h3>
<div class="cat" onclick="loadMock('Nigeria')">Nigeria</div>
<div class="cat" onclick="loadMock('USA')">USA</div>
<div class="cat" onclick="loadMock('UK')">UK</div>

<h3>⚡ Tools</h3>
<div class="cat" onclick="scan()">Scan Streams</div>
<div class="cat" onclick="boost()">Speed Boost</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="overlay" id="overlay">Loading IPTV...</div>
<video id="video" controls></video>
</div>

<div class="channels" id="list"></div>

</div>

</div>

<script>

/* ================= TRIAL SYSTEM ================= */
const key="trial_start_v1";

function initTrial(){
if(!localStorage.getItem(key)){
localStorage.setItem(key,Date.now());
}
}

function checkTrial(){
let start=+localStorage.getItem(key);
let now=Date.now();
let limit=4*60*60*1000;

if(now-start>limit){
document.getElementById("expired").style.display="flex";
return false;
}
return true;
}

setInterval(checkTrial,5000);
initTrial();

/* ================= ADMIN ================= */
let admin=false;

function toggleAdmin(){
document.getElementById("adminBox").style.display="block";
}

function login(){
if(document.getElementById("pass").value==="1234"){
admin=true;
alert("Admin Logged In");
}else{
alert("Wrong Password");
}
}

function resetTrial(){
localStorage.removeItem(key);
location.reload();
}

function lockAll(){
channels.forEach(c=>c.locked=true);
render();
}

function unlockAll(){
channels.forEach(c=>c.locked=false);
render();
}

/* ================= CHANNELS ================= */

let channels=[
{name:"News Live",group:"News",locked:false},
{name:"Sports Max",group:"Sports",locked:false},
{name:"Movie Zone",group:"Movies",locked:true},
{name:"Kids TV",group:"Kids",locked:false},
{name:"Music Live",group:"Music",locked:true}
];

function render(){
let box=document.getElementById("list");
box.innerHTML="";

channels.forEach((c,i)=>{
let div=document.createElement("div");
div.className="channel"+(c.locked?" locked":"");

div.innerHTML=`
<b>${c.name}</b><br>
<small>${c.group}</small><br>
<span class="badge ${c.locked?'lock':'free'}">
${c.locked?'LOCKED':'FREE'}
</span>
`;

div.onclick=()=>play(i);
box.appendChild(div);
});
}

/* ================= PLAYER ================= */
function play(i){

if(!checkTrial()) return;

if(channels[i].locked && !admin){
alert("Premium Channel Locked");
return;
}

document.getElementById("overlay").style.display="none";

/* demo stream */
document.getElementById("video").src=
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
}

/* ================= MOCK ================= */
function loadMock(x){
alert("Loading "+x+" IPTV...");
}

function scan(){alert("Scanning streams...")}
function boost(){alert("Boost enabled")}

/* INIT */
render();
checkTrial();

</script>

</body>
</html>
