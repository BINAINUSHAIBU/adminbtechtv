<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>BTECH-TV WORLD</title>

<meta name="theme-color" content="#0b0f1a"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* LOGIN */

.auth-screen{
position:fixed;
inset:0;
background:#000000ee;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
padding:20px;
}

.auth-box{
width:100%;
max-width:400px;
background:var(--panel);
padding:30px;
border-radius:20px;
}

.auth-box h1{
text-align:center;
margin-bottom:20px;
color:var(--accent);
}

.auth-box input{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.auth-box button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:var(--accent);
color:black;
font-weight:bold;
cursor:pointer;
}
