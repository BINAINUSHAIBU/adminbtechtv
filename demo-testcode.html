<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV LOCKED CHANNEL SUPER ADMIN (NO LOGIN)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
}

.container{display:flex;height:calc(100vh - 60px);}

/* SIDEBAR */
.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.cat{
padding:10px;
background:var(--card);
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
}

.cat:hover{background:#2b3a5a;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;}

.player{
height:260px;
background:black;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* LIST */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.channel:hover{border-color:var(--accent);}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
}

.free{background:var(--free);}
.paid{background:var(--paid);}
.locked{background:var(--locked);color:#000;}

/* RIGHT */
.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:0.85;}
.danger{background:#dc2626;}
.warn{background:#f59e0b;}

input{
width:100%;
padding:10px;
margin-top:8px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}
</style>
</head>

<body>

<div class="topbar">
<h3>🚀 BTECH-TV LOCKED SUPER ADMIN</h3>
<div id="status">NO LOGIN MODE</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>CONTROL PANEL</h3>

<div class="cat" onclick="filterAll()">📺 All</div>
<div class="cat" onclick="filterLocked()">🔒 Locked</div>
<div class="cat" onclick="filterFree()">🟢 Free</div>
<div class="cat" onclick="filterPaid()">💰 Paid</div>

<input placeholder="Search channels..." oninput="search(this.value)">
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="channels" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h3>⚙ ADMIN ACTIONS</h3>

<button onclick="lockAll()">🔒 Lock ALL</button>
<button onclick="unlockAll()">🔓 Unlock ALL</button>

<button class="warn" onclick="lockSelected()">🔒 Lock Selected</button>
<button class="warn" onclick="unlockSelected()">🔓 Unlock Selected</button>

<button class="danger" onclick="deleteLocked()">❌ Delete Locked</button>

<h3 style="margin-top:10px">📊 STATS</h3>
<div class="stat">Total: <span id="t">0</span></div>
<div class="stat">Free: <span id="f">0</span></div>
<div class="stat">Paid: <span id="p">0</span></div>
<div class="stat">Locked: <span id="l">0</span></div>

</div>

</div>

<script>

/* =====================
STATE
===================== */
let channels = [];
let filtered = [];
let selected = new Set();

const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =====================
GENERATE DATA
===================== */
function generate(){
for(let i=0;i<600;i++){
channels.push({
id:i,
name:"BTECH CHANNEL "+i,
url:streams[i%streams.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"free"
});
}
}

/* =====================
RENDER
===================== */
function render(){
filtered=[...channels];
let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{
let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
<br>
<input type="checkbox" onchange="toggle(${c.id})">
`;

div.onclick=()=>play(i);
box.appendChild(div);
});

stats();
}

/* =====================
TOGGLE SELECT
===================== */
function toggle(id){
selected.has(id) ? selected.delete(id) : selected.add(id);
}

/* =====================
PLAY
===================== */
function play(i){
let c=filtered[i];
let v=document.getElementById("video");

if(window.Hls && Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);
}else{
v.src=c.url;
}
}

/* =====================
FILTERS
===================== */
function filterAll(){render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterFree(){filtered=channels.filter(c=>c.type==="free");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* =====================
SEARCH
===================== */
function search(v){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* =====================
ADMIN ACTIONS
===================== */
function lockAll(){
channels.forEach(c=>c.status="locked");
render();
}

function unlockAll(){
channels.forEach(c=>c.status="free");
render();
}

function lockSelected(){
channels.forEach(c=>{
if(selected.has(c.id)) c.status="locked";
});
render();
}

function unlockSelected(){
channels.forEach(c=>{
if(selected.has(c.id)) c.status="free";
});
render();
}

function deleteLocked(){
channels = channels.filter(c=>c.status!=="locked");
render();
}

/* =====================
STATS
===================== */
function stats(){
document.getElementById("t").innerText=channels.length;
document.getElementById("f").innerText=channels.filter(c=>c.type==="free").length;
document.getElementById("p").innerText=channels.filter(c=>c.type==="paid").length;
document.getElementById("l").innerText=channels.filter(c=>c.status==="locked").length;
}

/* BOOT */
generate();
render();

</script>

</body>
</html>
