
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV LIVE STREAMING NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow-x:hidden;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:#0d1324;
border-right:1px solid #1d2b4f;
padding:20px;
overflow-y:auto;
z-index:1000;
}

.logo{font-size:28px;font-weight:900;color:#00d4ff;margin-bottom:5px;}
.subtitle{font-size:13px;color:#8ea2d9;margin-bottom:30px;}

.menu-title{font-size:13px;color:#00d4ff;margin:20px 0 10px;text-transform:uppercase;}

.nav-btn{
display:flex;align-items:center;gap:12px;
width:100%;padding:14px;margin-bottom:10px;
border:none;border-radius:12px;
background:#121c33;color:#fff;cursor:pointer;
}

.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{margin-left:260px;padding:20px;}

.topbar{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px;flex-wrap:wrap;}

.search-box input{
width:100%;padding:14px;border:none;border-radius:14px;
background:#101a31;color:#fff;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:30px;border-radius:20px;margin-bottom:20px;
}

.hero h1{color:#00d4ff;font-size:34px;margin-bottom:10px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}

.stat-card{background:#111a31;padding:15px;border-radius:12px;text-align:center}

/* PLAYER */
.video-player{width:100%;height:480px;background:#000;border-radius:12px;overflow:hidden;}
video{width:100%;height:100%;}

/* CHANNEL GRID */
.channels-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.channel-card{
background:#111a31;
padding:15px;
border-radius:14px;
cursor:pointer;
border:1px solid #1f355d;
}

.channel-card:hover{transform:scale(1.03)}

.badge{background:red;padding:4px 8px;border-radius:10px;font-size:10px;float:right}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 WORLDTV</div>
<div class="subtitle">Live Streaming Network</div>

<div class="menu-title">Navigation</div>
<button class="nav-btn">🏠 Dashboard</button>
<button class="nav-btn">📡 Live TV</button>
<button class="nav-btn">⚽ Sports</button>
<button class="nav-btn">🎬 Movies</button>
<button class="nav-btn">📰 News</button>
<button class="nav-btn">🎵 Music</button>
<button class="nav-btn">⛪ Gospel</button>
<button class="nav-btn">🌍 International</button>

<div class="menu-title">User</div>
<button class="nav-btn">❤️ Favorites</button>
<button class="nav-btn">🕘 History</button>
<button class="nav-btn">⚙ Settings</button>
<button class="nav-btn">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input id="srch" oninput="doFilter()" placeholder="Search channels, countries, movies...">
</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>WORLDTV GLOBAL IPTV NETWORK</h1>
<p>Live global IPTV streaming system with sports, news, movies & worldwide channels.</p>

<div class="stats">
<div class="stat-card"><h2 id="totalCh">0</h2><p>Channels</p></div>
<div class="stat-card"><h2>120K</h2><p>Users</p></div>
<div class="stat-card"><h2>4K</h2><p>Quality</p></div>
<div class="stat-card"><h2>99%</h2><p>Uptime</p></div>
</div>
</div>

<!-- PLAYER -->
<div class="video-player">
<video id="vid" controls autoplay muted></video>
</div>

<button onclick="prev()">⬅ Prev</button>
<button onclick="next()">Next ➡</button>
<button onclick="togglePiP()">PiP</button>

<h2 style="margin-top:20px;color:#00d4ff;">Live Channels</h2>
<div class="channels-grid" id="channelsGrid"></div>

</div>

<script>

/* ===== IPTV ENGINE ===== */

var all=[],filtered=[],cur=null;
var favs=JSON.parse(localStorage.getItem('favs')||'{}');

function esc(s){return s?s.replace(/&/g,'&amp;'):"";}

/* EXTENDED GLOBAL CHANNELS */
var channels = [
"BBC News UK","CNN USA","Al Jazeera","France 24","DW Germany",
"Sky Sports","ESPN","SuperSport Africa","BeIN Sports",
"RAI Italia","TVE Spain","ARD Germany","ZDF",
"NHK Japan","CCTV China","KBS Korea",
"ABC Australia","CTV Canada","CBC Canada",
"Channels TV Nigeria","AIT Nigeria","Arise News",
"Zee TV India","Star Plus India","Sony TV India",
"RT Russia","TRT Turkey","MBC Middle East"
];

/* BUILD STREAMS */
function init(){
all = channels.map((n,i)=>({
id:i+1,
n:n,
u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
cat:"global"
}));

document.getElementById("totalCh").innerText=all.length;
doFilter();
render();
}

/* FILTER */
function doFilter(){
var q=document.getElementById("srch").value.toLowerCase();
filtered=all.filter(c=>c.n.toLowerCase().includes(q));
render();
}

/* RENDER GRID */
function render(){
var grid=document.getElementById("channelsGrid");
grid.innerHTML="";

filtered.forEach(c=>{
var div=document.createElement("div");
div.className="channel-card";
div.innerHTML=`
<div class="badge">LIVE</div>
📺 ${c.n}
`;

div.onclick=()=>play(c);
grid.appendChild(div);
});
}

/* PLAYER */
var video=document.getElementById("vid");

function play(c){
cur=c;

if(Hls.isSupported()){
var hls=new Hls();
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}
else{
video.src=c.u;
video.play();
}
}

function next(){
var i=filtered.indexOf(cur);
if(i<filtered.length-1)play(filtered[i+1]);
}

function prev(){
var i=filtered.indexOf(cur);
if(i>0)play(filtered[i-1]);
}

function togglePiP(){
if(video.requestPictureInPicture){
video.requestPictureInPicture();
}
}

init();

</script>

</body>
</html>
