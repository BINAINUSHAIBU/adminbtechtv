<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLDTV PRO MAX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:#fff;
}

header{
    background:#0d1324;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #1d2b4f;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00d4ff;
}

.subscription-btn{
    background:#00d4ff;
    color:#000;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.hero{
    padding:30px;
    text-align:center;
}

.hero h1{
    margin-bottom:10px;
}

.hero p{
    color:#9cb0df;
}

.video-area{
    max-width:1000px;
    margin:20px auto;
    padding:20px;
}

video{
    width:100%;
    border-radius:12px;
    background:#000;
}

.plans{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.plan{
    background:#111a31;
    padding:20px;
    border-radius:12px;
    text-align:center;
    border:1px solid #1f355d;
}

.plan h3{
    color:#00d4ff;
}

.plan button{
    margin-top:15px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#00d4ff;
    color:#000;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
<div class="logo">📺 WORLDTV PRO MAX</div>
<button class="subscription-btn">
Subscription Plans
</button>
</header>

<section class="hero">
<h1>Premium Streaming Platform</h1>
<p>Watch your licensed media content on any device.</p>
</section>

<section class="video-area">
<video controls>
<source src="" type="video/mp4">
</video>
</section>

<section class="plans">

<div class="plan">
<h3>Weekly</h3>
<h2>₦1,000</h2>
<p>7 Days Access</p>
<button>Select Plan</button>
</div>

<div class="plan">
<h3>Monthly</h3>
<h2>₦3,000</h2>
<p>30 Days Access</p>
<button>Select Plan</button>
</div>

<div class="plan">
<h3>Yearly</h3>
<h2>₦20,000</h2>
<p>365 Days Access</p>
<button>Select Plan</button>
</div>

</section>

</body>
</html>
