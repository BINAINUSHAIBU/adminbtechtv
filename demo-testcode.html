<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026 - SaaS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#auth{
position:fixed;
inset:0;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.auth-box{
background:#0d1324;
padding:20px;
border-radius:10px;
width:340px;
border:1px solid #1d2b4f;
}

.auth-box input{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
background:#111a31;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:8px;
background:#00d4ff;
border:none;
color:#000;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

/* EXPIRY */
#expired{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:#000;
z-index:999999;
}

/* SIDEBAR */
.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f;}
.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer;}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.search-box input{padding:10px;border-radius:8px;border:none;background:#101a31;color:#fff;width:260px;}
.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{background:linear-gradient(135deg,#07132f,#0f1d45);padding:10px;border-radius:10px;margin-bottom:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* PLAYER */
.player-container{background:#000;border-radius:10px;overflow:hidden;height:320px;}
video{width:100%;height:100%;}

/* CHANNELS */
.channel-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.channels{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d;}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

</style>
</head>

<body>

<!-- AUTH SYSTEM -->
<div id="auth">
  <div class="auth-box">
    <h3>📺 IPTV SAAS LOGIN</h3>

    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>

    <hr style="margin:10px 0;opacity:.2">

    <input id="key" placeholder="Upgrade Key (optional)">
    <button onclick="upgrade()">Upgrade</button>

    <p style="font-size:11px;color:#8ea2d9;margin-top:10px">
      Trial: 3 days per account • Upgrade unlocks unlimited access
    </p>
  </div>
</div>

<!-- EXPIRED -->
<div id="expired">
  <h1>⛔ TRIAL EXPIRED</h1>
  <button onclick="location.reload()">Login Again</button>
</div>

<!-- SIDEBAR (UNCHANGED) -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🌍 Countries</div>

<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="load('fr')">🇫🇷 France</button>
<button class="nav-btn" onclick="load('de')">🇩🇪 Germany</button>
<button class="nav-btn" onclick="load('br')">🇧🇷 Brazil</button>
<button class="nav-btn" onclick="load('za')">🇿🇦 South Africa</button>
<button class="nav-btn" onclick="load('ca')">🇨🇦 Canada</button>
<button class="nav-btn" onclick="load('au')">🇦🇺 Australia</button>

<div class="menu-title">🎬 Categories</div>

<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>
<button class="nav-btn" onclick="loadCat('music')">🎵 Music</button>
<button class="nav-btn" onclick="loadCat('kids')">👶 Kids</button>

<div class="menu-title">🔥 Tools</div>

<button class="nav-btn" onclick="loadUltra()">🚀 Ultra Feeds</button>
<button class="nav-btn" onclick="speedBoost()">⚡ Boost</button>
<button class="nav-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="hero">
<h3>WORLDTV PRO MAX IPTV SYSTEM</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">🌍 Live <div id="live">0</div></div>
<div class="stat">⚫ Dead <div id="dead">0</div></div>
<div class="stat">⭐ Fav <div id="fav">0</div></div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channel-wrapper">
<div class="channels" id="grid"></div>
</div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* ---------------- USERS DB ---------------- */
let users = JSON.parse(localStorage.getItem("users")||"{}");
let currentUser=null;

/* ---------------- AUTH ---------------- */

function register(){
let email=emailVal(), pass=passVal();
if(!email||!pass) return alert("Fill all fields");

if(users[email]) return alert("User exists");

users[email]={
pass,
trial_start:Date.now(),
premium:false
};

saveUsers();
alert("Registered! Now login.");
}

function login(){
let email=emailVal(), pass=passVal();

if(!users[email] || users[email].pass!==pass){
return alert("Invalid login");
}

currentUser=email;
checkAccess();
hideAuth();
}

function upgrade(){
let key=document.getElementById("key").value;

if(key==="BTECH-UNLOCK-2026"){
users[currentUser].premium=true;
saveUsers();
alert("UPGRADED SUCCESS!");
}else{
alert("Invalid key");
}
}

/* ---------------- TRIAL LOGIC ---------------- */

function checkAccess(){
let u=users[currentUser];

if(u.premium) return true;

let diff=(Date.now()-u.trial_start)/(1000*60*60*24);

if(diff>3){
document.getElementById("expired").style.display="flex";
document.querySelector(".main").style.display="none";
document.querySelector(".sidebar").style.display="none";
return false;
}

return true;
}

function guard(){
if(!currentUser) return false;
return checkAccess();
}

/* ---------------- UI ---------------- */

function hideAuth(){
document.getElementById("auth").style.display="none";
}

function emailVal(){return document.getElementById("email").value;}
function passVal(){return document.getElementById("pass").value;}
function saveUsers(){localStorage.setItem("users",JSON.stringify(users));}

/* ---------------- IPTV CORE (UNCHANGED) ---------------- */

async function load(code){
if(!guard()) return;
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
if(!guard()) return;
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadUltra(){
if(!guard()) return;
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
if(!guard()) return;

const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

let lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];
if(url && url.startsWith("http")) all.push({name,url});
}
}

filtered=[...all];
render();
stats();
}

function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
if(!guard()) return;

i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* TOOLS */
function speedBoost(){video.playbackRate=1.2;}
function toggleFullscreen(){video.requestFullscreen();}

/* INIT */
if(localStorage.getItem("currentUser")){
currentUser=localStorage.getItem("currentUser");
}

</script>

</body>
</html>
