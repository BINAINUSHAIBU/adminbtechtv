<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPTV Pro Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#070b18;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:320px;
background:#0f172a;
padding:15px;
overflow-y:auto;
}

h2{
font-size:16px;
margin:10px 0;
color:#38bdf8;
}

select,input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
outline:none;
}

.channel{
padding:10px;
margin:5px 0;
background:#111c33;
cursor:pointer;
border-radius:6px;
font-size:14px;
transition:0.2s;
display:flex;
justify-content:space-between;
}

.channel:hover{
background:#1e2a4a;
}

.channel small{
color:#94a3b8;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
padding:10px;
background:#0f172a;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:8px 10px;
border:none;
border-radius:5px;
cursor:pointer;
background:#2563eb;
color:white;
font-size:13px;
}

button:hover{
background:#1d4ed8;
}

.player{
flex:1;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
}

.badge{
font-size:10px;
padding:2px 6px;
border-radius:4px;
background:#334155;
}

.searchBox{
margin-top:10px;
}

</style>
</head>
<body>

<div class="sidebar">
<h2>🌍 Country</h2>
<select id="countrySelect" onchange="loadChannels()">
<option value="ng">Nigeria</option>
<option value="us">USA</option>
<option value="gb">UK</option>
<option value="in">India</option>
<option value="za">South Africa</option>
<option value="fr">France</option>
<option value="de">Germany</option>
<option value="br">Brazil</option>
</select>

<h2>📂 Category Filter</h2>
<select id="categoryFilter" onchange="filterCategory()">
<option value="all">All</option>
<option value="Sports">Sports</option>
<option value="News">News</option>
<option value="Music">Music</option>
<option value="Kids">Kids</option>
<option value="Entertainment">Entertainment</option>
</select>

<h2>🔍 Search</h2>
<input type="text" placeholder="Search channels..." onkeyup="searchChannel(this.value)" />

<h2>📺 Channels</h2>
<div id="channels"></div>
</div>

<div class="main">
<div class="topbar">
<button onclick="toggleFav()">⭐ Favorites</button>
<button onclick="loadChannels()">🔄 Reload</button>
<button onclick="clearPlayer()">⛔ Stop</button>
</div>
<div class="player">
<video id="video" controls autoplay></video>
</div>
</div>

<script>
let allChannels = [];
let filteredChannels = [];
let favorites = JSON.parse(localStorage.getItem('fav') || '[]');

async function loadChannels(){
let country = document.getElementById('countrySelect').value;
let url = `https://iptv-org.github.io/iptv/countries/${country}.m3u`;

let res = await fetch(url);
let text = await res.text();
parseM3U(text);
}

function parseM3U(data){
allChannels = [];
let lines = data.split('\n');
let name = '';
let group = 'General';

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith('#EXTINF')){
name = lines[i].split(',')[1] || 'Unknown';
let match = lines[i].match(/group-title="(.*?)"/);
group = match ? match[1] : 'General';
}else if(lines[i].startsWith('http')){
allChannels.push({name,url:lines[i],group});
}
}
filteredChannels = allChannels;
renderChannels(allChannels);
}

function renderChannels(list){
let container = document.getElementById('channels');
container.innerHTML = '';

list.forEach(ch=>{
let div = document.createElement('div');
div.className='channel';
div.innerHTML = `<span>${ch.name}</span><small class='badge'>${ch.group}</small>`;
div.onclick=()=>playChannel(ch.url);
container.appendChild(div);
});
}

function playChannel(url){
let video = document.getElementById('video');

if(Hls.isSupported()){
if(window.hls) window.hls.destroy();
window.hls = new Hls();
window.hls.loadSource(url);
window.hls.attachMedia(video);
}else{
video.src = url;
}
video.play();
}

function searchChannel(val){
val = val.toLowerCase();
let result = filteredChannels.filter(c=>c.name.toLowerCase().includes(val));
renderChannels(result);
}

function filterCategory(){
let cat = document.getElementById('categoryFilter').value;
if(cat==='all'){
filteredChannels = allChannels;
}else{
filteredChannels = allChannels.filter(c=>c.group.includes(cat));
}
renderChannels(filteredChannels);
}

function toggleFav(){
alert('Favorites system will be enabled in next upgrade');
}

function clearPlayer(){
let video = document.getElementById('video');
video.pause();
video.src = '';
}

loadChannels();
</script>

</body>
</html>
