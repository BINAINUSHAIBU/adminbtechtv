
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV ULTRA USER MANAGER + IPTV SUPER ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#08111f;color:#fff}
header{background:#111827;padding:15px;display:flex;justify-content:space-between}
.container{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 60px)}
.sidebar{background:#0f172a;padding:12px;overflow:auto}
.main{padding:12px;overflow:auto}
.card{background:#1b2438;border-radius:12px;padding:12px;margin-bottom:12px}
button{padding:10px;border:none;border-radius:8px;cursor:pointer}
input,select{padding:10px;border:none;border-radius:8px;width:100%;margin:5px 0}
video{width:100%;height:320px;background:#000}
.user{display:flex;justify-content:space-between;background:#0f1628;padding:10px;border-radius:8px;margin:5px 0}
.stat{display:inline-block;background:#1b2438;padding:10px;margin:5px;border-radius:8px}
</style>
</head>
<body>
<header>
<h2>BTECH-TV ULTRA USER MANAGER</h2>
<div>SUPER ADMIN</div>
</header>

<div class="container">
<div class="sidebar">
<div class="card"><b>Navigation</b><hr>
<p>👥 All Users</p>
<p>💳 Premium Users</p>
<p>🔒 Blocked Users</p>
<p>📺 Sessions</p>
<p>📊 Analytics</p>
<p>⚡ Performance</p>
<p>🛡 Super Admin</p>
<p>💳 Pay TV</p>
<p>🔒 Locked Channels</p>
</div>

<div class="card">
<button onclick="generateUsers()">⚡ Generate Users</button>
<button onclick="exportUsers()">⬇ Export</button>
<button onclick="location.reload()">🚀 Reload</button>
</div>
</div>

<div class="main">
<div>
<span class="stat">Users: <span id="total">0</span></span>
<span class="stat">Premium: <span id="premium">0</span></span>
<span class="stat">Blocked: <span id="blocked">0</span></span>
</div>

<div class="card">
<h3>📺 IPTV Player</h3>
<video id="video" controls></video><br><br>
<button onclick="playDemo()">Play Demo Stream</button>
</div>

<div class="card">
<h3>➕ Create User</h3>
<input id="name" placeholder="Username">
<select id="plan">
<option>Free</option>
<option>Premium</option>
</select>
<button onclick="addUser()">Create User</button>
</div>

<div class="card">
<h3>👥 User List</h3>
<div id="users"></div>
</div>
</div>
</div>

<script>
let users=[];
function update(){
document.getElementById('total').innerText=users.length;
document.getElementById('premium').innerText=users.filter(x=>x.premium).length;
document.getElementById('blocked').innerText=users.filter(x=>x.blocked).length;

let html='';
users.forEach(u=>{
html+=`<div class="user">
<div>${u.name}</div>
<div>
<button onclick="toggleBlock(${u.id})">${u.blocked?'Unlock':'Block'}</button>
</div></div>`;
});
document.getElementById('users').innerHTML=html;
}
function addUser(){
const n=document.getElementById('name').value;
if(!n)return;
users.unshift({id:Date.now(),name:n,premium:plan.value==='Premium',blocked:false});
update();
}
function generateUsers(){
for(let i=1;i<=100;i++){
users.push({id:i,name:'USER_'+i,premium:Math.random()>.5,blocked:false});
}
update();
}
function toggleBlock(id){
const u=users.find(x=>x.id===id);
if(u)u.blocked=!u.blocked;
update();
}
function exportUsers(){
const b=new Blob([JSON.stringify(users,null,2)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='users.json';
a.click();
}
function playDemo(){
const url='https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
const video=document.getElementById('video');
if(Hls.isSupported()){
const hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}
}
</script>
</body>
</html>
