<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden;
height:100vh;
}

/* MAIN LAYOUT */

.container{
display:grid;
grid-template-columns:380px 1fr;
height:100vh;
}

/* CHANNEL PANEL */

.sidebar{
background:#0f172a;
border-right:1px solid #1e293b;
display:flex;
flex-direction:column;
height:100vh;
}

.logo{
padding:15px;
font-size:20px;
font-weight:bold;
background:#111827;
text-align:center;
}

.search{
padding:10px;
}

.search input{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#1e293b;
color:#fff;
}

/* ONLY CHANNEL LIST SCROLLS */

.channel-list{
flex:1;
overflow-y:auto;
padding:10px;
}

.channel{
display:flex;
align-items:center;
gap:10px;
padding:10px;
margin-bottom:8px;
background:#111827;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:#1e40af;
}

.channel img{
width:50px;
height:50px;
object-fit:contain;
background:#fff;
border-radius:8px;
}

.channel-name{
font-size:14px;
font-weight:bold;
}

/* PLAYER AREA */

.main{
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
}

/* DASHBOARD FIXED */

.dashboard{
height:70px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-around;
border-bottom:1px solid #1f2937;
}

.stat{
text-align:center;
}

.stat h3{
color:#00ff99;
}

/* PLAYER FIXED */

.player-box{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
}

.video-wrapper{
width:100%;
height:100%;
background:#000;
border-radius:15px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* MOBILE */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
grid-template-rows:45vh 55vh;
}

.sidebar{
height:45vh;
border-right:none;
border-bottom:1px solid #1f2937;
}

.main{
height:55vh;
}

}

</style>
</head>
<body>

<div class="container">

    <!-- CHANNELS -->
    <div class="sidebar">

        <div class="logo">
            🔴 LIVE CHANNELS
        </div>

        <div class="search">
            <input type="text"
                   id="search"
                   placeholder="Search channel..."
                   onkeyup="filterChannels()">
        </div>

        <div class="channel-list" id="channelList">
        </div>

    </div>

    <!-- PLAYER -->
    <div class="main">

        <!-- DASHBOARD -->
        <div class="dashboard">

            <div class="stat">
                <small>Total Channels</small>
                <h3 id="totalChannels">0</h3>
            </div>

            <div class="stat">
                <small>Live Status</small>
                <h3>ONLINE</h3>
            </div>

            <div class="stat">
                <small>Current Channel</small>
                <h3 id="currentChannel">None</h3>
            </div>

        </div>

        <!-- VIDEO -->
        <div class="player-box">

            <div class="video-wrapper">

                <video
                    id="videoPlayer"
                    controls
                    autoplay>
                </video>

            </div>

        </div>

    </div>

</div>

<script>

const channels = [

{
name:"BBC News",
logo:"https://upload.wikimedia.org/wikipedia/commons/b/bc/BBC_News_2022.svg",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"CNN Live",
logo:"https://upload.wikimedia.org/wikipedia/commons/b/b1/CNN.svg",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Al Jazeera",
logo:"https://upload.wikimedia.org/wikipedia/en/f/f2/Aljazeera_eng.svg",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"DW TV",
logo:"https://upload.wikimedia.org/wikipedia/commons/7/75/DW_new_logo.svg",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}

];

const list=document.getElementById("channelList");

function loadChannels(){

list.innerHTML="";

channels.forEach(ch=>{

list.innerHTML+=`
<div class="channel" onclick="playChannel('${ch.url}','${ch.name}')">
<img src="${ch.logo}">
<div class="channel-name">${ch.name}</div>
</div>
`;

});

document.getElementById("totalChannels").innerText=
channels.length;

}

function playChannel(url,name){

const video=document.getElementById("videoPlayer");

document.getElementById("currentChannel").innerText=name;

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

video.play();

}

function filterChannels(){

const search=
document.getElementById("search")
.value.toLowerCase();

const items=
document.querySelectorAll(".channel");

items.forEach(item=>{

item.style.display=
item.innerText.toLowerCase().includes(search)
? "flex":"none";

});

}

loadChannels();

</script>

</body>
</html>
