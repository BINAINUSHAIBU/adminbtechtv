<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH TV PRO MAX + ADMIN DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;overflow:hidden}

/* LAYOUT */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:260px;background:#0d1324;padding:15px;overflow-y:auto;
border-right:1px solid #1d2b4f;
}
.logo{color:#00d4ff;font-size:20px;font-weight:900;margin-bottom:5px}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:10px}

.btn{
width:100%;padding:9px;margin:5px 0;
background:#121c33;border:none;color:#fff;
border-radius:6px;cursor:pointer
}
.btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* TOP */
.topbar{display:flex;justify-content:space-between;padding:10px}
input{padding:10px;border-radius:6px;border:none;background:#101a31;color:#fff}

/* PLAYER */
.player{height:320px;background:#000}
video{width:100%;height:100%}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:10px;overflow:auto}
.card{background:#111a31;padding:10px;border-radius:8px;cursor:pointer}

/* MODAL */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,0.8);
display:none;justify-content:center;align-items:center
}
.box{background:#0d1324;padding:20px;width:320px;border-radius:10px}

/* ADMIN */
.admin{
display:none;
position:fixed;inset:0;
background:#0f172a;
overflow:auto;
padding:20px;
z-index:9999
}

table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #2b3a55}

/* TIMER */
#timer{position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;padding:6px;border-radius:6px}

</style>
</head>

<body>

<div id="timer">Trial Active</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 BTECH TV</div>
<div class="sub">PRO MAX SYSTEM</div>

<button class="btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="btn" onclick="load('us')">🇺🇸 USA</button>
<button class="btn" onclick="loadUltra()">🌍 Ultra</button>

<button class="btn" onclick="toggleAdmin()">🧑‍💼 Admin Panel</button>
<button class="btn" onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search channels...">
<button onclick="openPayment()">Upgrade</button>
</div>

<div class="player">
<video id="video" controls></video>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="payModal">
<div class="box">
<h3>Upgrade Premium</h3>
<input id="emailPay" placeholder="Email">
<button onclick="pay()">Pay ₦5000</button>
</div>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin">

<h2>🧑‍💼 ADMIN DASHBOARD</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<button onclick="toggleAdmin()">Close</button>
</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;
const TRIAL=240000;

/* AUTH STORAGE */
if(!localStorage.getItem("start"))
localStorage.setItem("start",Date.now());

/* TIMER */
setInterval(()=>{
let s=localStorage.getItem("start");

if(localStorage.getItem("premium")==="true"){
timer.innerText="PREMIUM ACTIVE";
return;
}

let d=TRIAL-(Date.now()-s);
if(d<=0){
timer.innerText="EXPIRED";
document.getElementById("payModal").style.display="flex";
return;
}

timer.innerText="Trial "+Math.floor(d/60000)+"m";
},1000);

/* LOAD IPTV */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let txt=await res.text();
all=[];

txt.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=a[i+1];
if(url?.startsWith("http"))all.push({name,url});
}
});

filtered=[...all];
render();
}

/* RENDER IPTV */
function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
grid.innerHTML+=`
<div class="card" onclick="play(${idx})">
${c.name}
</div>`;
});
}

/* PLAY */
function play(idx){
let c=filtered[idx];
if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* ADMIN DATA */
let channels=[];

for(let i=1;i<=50;i++){
channels.push({
name:"Channel "+i,
category:"Movies",
status:Math.random()>0.5?"Locked":"Unlocked"
});
}

function renderAdmin(){
let t=document.getElementById("tbody");
t.innerHTML="";
channels.forEach((c,i)=>{
t.innerHTML+=`
<tr>
<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.status}</td>
<td>
<button onclick="toggleLock(${i})">Toggle</button>
</td>
</tr>`;
});
}

function toggleLock(i){
channels[i].status =
channels[i].status==="Locked"?"Unlocked":"Locked";
renderAdmin();
}

/* ADMIN TOGGLE */
function toggleAdmin(){
let a=document.getElementById("admin");
a.style.display=a.style.display==="block"?"none":"block";
renderAdmin();
}

/* PAYMENT */
function openPayment(){
document.getElementById("payModal").style.display="flex";
}

function pay(){
let email=document.getElementById("emailPay").value;

let handler=PaystackPop.setup({
key:"pk_test_xxxxxxxxx",
email:email,
amount:5000*100,
currency:"NGN",
callback:function(){
localStorage.setItem("premium","true");
document.getElementById("payModal").style.display="none";
alert("Premium Activated");
}
});

handler.openIframe();
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}

/* INIT */
loadUltra();
renderAdmin();

</script>

</body>
</html>
