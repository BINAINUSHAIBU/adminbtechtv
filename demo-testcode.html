<!-- ===========================
MULTI-USER SAAS DASHBOARD
=========================== -->

<div id="saasDashboard" style="display:none;padding:20px;background:#0b1220;height:100%;overflow:auto;">

<h1>📺 BTECH-TV WORLD PRO MAX SaaS</h1>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:20px;">

<div class="card">
<h3>👥 Total Users</h3>
<h1 id="totalUsers">0</h1>
</div>

<div class="card">
<h3>🟢 Active Users</h3>
<h1 id="activeUsers">0</h1>
</div>

<div class="card">
<h3>⏳ Trial Users</h3>
<h1 id="trialUsers">0</h1>
</div>

<div class="card">
<h3>💰 Revenue</h3>
<h1 id="revenue">₦0</h1>
</div>

</div>

<hr style="margin:20px 0;">

<h2>👥 User Manager</h2>

<button onclick="createUser()">➕ Create User</button>

<table width="100%" border="1" cellspacing="0" cellpadding="8">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Package</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<hr style="margin:20px 0;">

<h2>📦 Package Manager</h2>

<button onclick="createPackage()">➕ New Package</button>

<div id="packageList"></div>

<hr style="margin:20px 0;">

<h2>📺 Channel Manager</h2>

<button onclick="addChannel()">➕ Add Channel</button>

<div id="channelManager"></div>

<hr style="margin:20px 0;">

<h2>🎟 Coupon Manager</h2>

<button onclick="createCoupon()">➕ Create Coupon</button>

<div id="couponList"></div>

<hr style="margin:20px 0;">

<h2>💳 Payment Manager</h2>

<div class="card">
Paystack Connected
<br><br>
<button>Configure Payments</button>
</div>

<hr style="margin:20px 0;">

<h2>⚙️ System Settings</h2>

<label>
<input type="checkbox" checked>
Enable Registration
</label>

<br><br>

<label>
<input type="checkbox" checked>
Enable Trial
</label>

<br><br>

<label>
<input type="checkbox">
Maintenance Mode
</label>

<br><br>

<button onclick="saveSettings()">
💾 Save Settings
</button>

</div>

<style>
.card{
background:#172033;
padding:15px;
border-radius:12px;
}
table{
background:#172033;
color:white;
}
button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
}
</style>

<script>

/* ==========================
DEMO SAAS DATA
========================== */

let users=[
{
name:"Admin",
email:"admin@btechtv.com",
package:"Gold",
status:"Active"
}
];

let packages=[
"Trial",
"Basic",
"Premium",
"Gold"
];

function loadDashboard(){

document.getElementById("totalUsers").innerText=
users.length;

document.getElementById("activeUsers").innerText=
users.filter(x=>x.status==="Active").length;

document.getElementById("trialUsers").innerText=
users.filter(x=>x.package==="Trial").length;

renderUsers();
renderPackages();
renderChannels();

}

function renderUsers(){

let html="";

users.forEach((u,i)=>{

html+=`
<tr>
<td>${u.name}</td>
<td>${u.email}</td>
<td>${u.package}</td>
<td>${u.status}</td>
<td>
<button onclick="deleteUser(${i})">
Delete
</button>
</td>
</tr>
`;

});

document.getElementById("userTable").innerHTML=
html;

}

function createUser(){

let name=prompt("Name");

if(!name) return;

users.push({
name:name,
email:name.toLowerCase()+"@mail.com",
package:"Trial",
status:"Active"
});

loadDashboard();

}

function deleteUser(i){

users.splice(i,1);

loadDashboard();

}

function renderPackages(){

document.getElementById("packageList").innerHTML=
packages.map(x=>`
<div class="card">${x}</div>
`).join("");

}

function createPackage(){

let p=prompt("Package Name");

if(!p) return;

packages.push(p);

renderPackages();

}

function renderChannels(){

let html="";

all.forEach(ch=>{

html+=`
<div class="card" style="margin-bottom:10px;">
${ch.name}
<select>
<option>Trial</option>
<option>Basic</option>
<option>Premium</option>
<option>Gold</option>
</select>
</div>
`;

});

document.getElementById("channelManager").innerHTML=
html;

}

function addChannel(){

alert("Connect to backend API");

}

function createCoupon(){

alert("Coupon created");

}

function saveSettings(){

alert("Settings saved");

}

/* LOAD */
setTimeout(loadDashboard,1000);

</script>
