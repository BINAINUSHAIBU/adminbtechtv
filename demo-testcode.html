```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH Streaming Platform</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
display:flex;
}

/* LOGIN */
#authBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-card{
width:350px;
background:#0d1324;
padding:20px;
border-radius:12px;
border:1px solid #1d2b4f;
}

.auth-card h2{
text-align:center;
margin-bottom:15px;
color:#00d4ff;
}

.auth-card input{
width:100%;
padding:12px;
margin:8px 0;
background:#101a31;
border:none;
border-radius:6px;
color:white;
}

.auth-card button{
width:100%;
padding:12px;
margin-top:10px;
background:#00d4ff;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0d1324;
padding:15px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00d4ff;
margin-bottom:15px;
}

.menu-btn{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#121c33;
color:white;
cursor:pointer;
}

.menu-btn:hover{
background:#1f355d;
}

/* MAIN */
.main{
flex:1;
padding:15px;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

#timerBar{
background:#00d4ff;
color:black;
padding:10px;
border-radius:8px;
font-weight:bold;
}

.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px;
}

.stat{
background:#101d39;
padding:15px;
border-radius:8px;
text-align:center;
}

.video-box{
height:320px;
background:black;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
margin-bottom:15px;
}

video{
width:100%;
height:100%;
border-radius:10px;
}

.content-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
}

.card{
background:#111a31;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.card:hover{
border:1px solid #00d4ff;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}

.modal-box{
width:350px;
background:#0d1324;
padding:20px;
border-radius:12px;
}

.modal-box h3{
margin-bottom:15px;
}

.modal-box input,
.modal-box select{
width:100%;
padding:10px;
margin:5px 0;
background:#101a31;
border:none;
border-radius:6px;
color:white;
}

.modal-box button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.upgrade{
background:#ffcc00;
color:black;
}

.pay{
background:#00d4ff;
color:black;
}

#paymentResult{
margin-top:10px;
background:#101a31;
padding:10px;
border-radius:6px;
display:none;
}
</style>
</head>
<body>

<div id="authBox">
<div class="auth-card">
<h2>BTECH Platform</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">Register</button>
<button onclick="loginUser()">Login</button>

</div>
</div>

<div id="upgradeModal" class="modal">
<div class="modal-box">

<h3>Trial Expired</h3>

<button class="upgrade" onclick="openPayment()">
Upgrade Subscription
</button>

</div>
</div>

<div id="paymentModal" class="modal">
<div class="modal-box">

<h3>Select Plan</h3>

<input id="fullName" placeholder="Full Name">

<input id="payEmail" placeholder="Email">

<select id="plan">
<option>Premium - ₦5,000</option>
<option>Super Premium - ₦10,000</option>
<option>Ultra Premium - ₦20,000</option>
</select>

<select id="gateway">
<option>Paystack</option>
<option>Flutterwave</option>
<option>Interswitch WebPAY</option>
<option>OPay</option>
<option>PalmPay</option>
<option>PayPal</option>
</select>

<button class="pay" onclick="payNow()">
Proceed To Payment
</button>

<div id="paymentResult"></div>

</div>
</div>

<div class="sidebar">
<div class="logo">BTECH</div>

<button class="menu-btn">Dashboard</button>
<button class="menu-btn">Videos</button>
<button class="menu-btn">Premium</button>
<button class="menu-btn">Settings</button>
<button class="menu-btn" onclick="logout()">Logout</button>
</div>

<div class="main">

<div class="topbar">
<h2>Streaming Dashboard</h2>
<div id="timerBar">Trial Active</div>
</div>

<div class="hero">
<h3>Welcome</h3>

<div class="stats">

<div class="stat">
<h2 id="videos">100</h2>
<p>Videos</p>
</div>

<div class="stat">
<h2 id="users">1</h2>
<p>User</p>
</div>

<div class="stat">
<h2 id="subs">0</h2>
<p>Subscribers</p>
</div>

<div class="stat">
<h2 id="status">FREE</h2>
<p>Status</p>
</div>

</div>
</div>

<div class="video-box">
<video controls>
<source src="" type="video/mp4">
</video>
</div>

<div class="content-grid">
<div class="card">Content 1</div>
<div class="card">Content 2</div>
<div class="card">Content 3</div>
<div class="card">Content 4</div>
<div class="card">Content 5</div>
<div class="card">Content 6</div>
</div>

</div>

<script>

const TRIAL=180000;

function registerUser(){
localStorage.setItem("user",
JSON.stringify({
email:email.value,
password:password.value
}));
alert("Registered");
}

function loginUser(){

let user=
JSON.parse(localStorage.getItem("user"));

if(!user) return alert("No account");

if(
user.email!==email.value ||
user.password!==password.value
){
alert("Invalid Login");
return;
}

if(!localStorage.getItem("start")){
localStorage.setItem("start",Date.now());
}

authBox.style.display="none";
startTimer();
}

function logout(){
localStorage.clear();
location.reload();
}

function startTimer(){

setInterval(()=>{

if(localStorage.getItem("premium")==="true"){
timerBar.innerHTML="👑 PREMIUM ACTIVE";
status.innerHTML="PREMIUM";
return;
}

let start=localStorage.getItem("start");
let left=TRIAL-(Date.now()-start);

if(left<=0){
timerBar.innerHTML="EXPIRED";
upgradeModal.style.display="flex";
return;
}

timerBar.innerHTML=
"Trial " +
Math.floor(left/60000) +
" min";

},1000);

}

function openPayment(){
paymentModal.style.display="flex";
}

function payNow(){

let name=fullName.value;
let email=payEmail.value;

if(!name || !email){
alert("Complete all fields");
return;
}

localStorage.setItem("premium","true");

paymentResult.style.display="block";

paymentResult.innerHTML=
`
<h3>✅ Success</h3>
<p>${plan.value}</p>
<p>${gateway.value}</p>
`;

status.innerHTML="PREMIUM";
subs.innerHTML="1";

setTimeout(()=>{
paymentModal.style.display="none";
upgradeModal.style.display="none";
},1500);

}

</script>

</body>
</html>
```
