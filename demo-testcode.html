<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ALL USERS SUPER ADMIN</title>

<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* =========================
TOPBAR
========================= */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
}

.topbar input{
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
width:300px;
}

/* =========================
LAYOUT
========================= */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* =========================
MAIN
========================= */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* =========================
STATS
========================= */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box h3{
color:var(--muted);
font-size:12px;
margin-bottom:8px;
}

.box p{
font-size:20px;
color:var(--accent);
font-weight:bold;
}

/* =========================
USER GRID
========================= */
.users{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:12px;
}

.user{
background:var(--card);
padding:15px;
border-radius:12px;
transition:0.3s;
border:1px solid transparent;
}

.user:hover{
transform:translateY(-3px);
border-color:var(--accent);
background:var(--hover);
}

.user h4{
margin-bottom:5px;
}

.user small{
color:var(--muted);
display:block;
margin-bottom:10px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.active{background:#16a34a;}
.banned{background:#dc2626;}
.premium{background:#f59e0b;}

/* =========================
BUTTONS
========================= */
button{
padding:10px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
font-weight:bold;
}

button:hover{opacity:0.8;}

.danger{background:#dc2626;}
.warning{background:#f59e0b;color:black;}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<h2>👥 BTECH-TV ALL USERS ADMIN</h2>

<input placeholder="Search users..." oninput="searchUsers(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="filterUsers('all')">📁 All Users</div>
<div class="cat" onclick="filterUsers('active')">🟢 Active</div>
<div class="cat" onclick="filterUsers('banned')">🔴 Banned</div>
<div class="cat" onclick="filterUsers('premium')">⭐ Premium</div>

<hr style="margin:15px 0;opacity:0.2;">

<button onclick="generateUsers()">🚀 Generate Users</button>
<br><br>
<button class="warning" onclick="clearBanned()">🧹 Clear Banned</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- STATS -->
<div class="stats">
<div class="box">
<h3>Total Users</h3>
<p id="total">0</p>
</div>

<div class="box">
<h3>Active</h3>
<p id="active">0</p>
</div>

<div class="box">
<h3>Banned</h3>
<p id="banned">0</p>
</div>

<div class="box">
<h3>Premium</h3>
<p id="premium">0</p>
</div>
</div>

<!-- USERS -->
<div class="users" id="userList"></div>

</div>
</div>

<script>

/* =========================
DATA
========================= */
let users=[];
let filtered=[];

/* =========================
GENERATE USERS
========================= */
function generateUsers(){

users=[];

for(let i=1;i<=500;i++){

let status=
i%10===0?"banned":"active";

users.push({

id:i,
name:"User_"+i,
email:"user"+i+"@mail.com",
status:status,
premium:i%7===0,
country:"NG"

});

}

filtered=[...users];
render();
updateStats();

}

/* =========================
RENDER USERS
========================= */
function render(){

const box=document.getElementById("userList");
box.innerHTML="";

filtered.forEach(u=>{

const div=document.createElement("div");
div.className="user";

div.innerHTML=`
<h4>👤 ${u.name}</h4>
<small>${u.email}</small>

<span class="badge ${u.status}">
${u.status.toUpperCase()}
</span>

${u.premium?'<span class="badge premium">PREMIUM</span>':''}

<br><br>

<button onclick="toggleStatus(${u.id})">Toggle</button>
<button class="danger" onclick="deleteUser(${u.id})">Delete</button>
`;

box.appendChild(div);

});

}

/* =========================
STATS
========================= */
function updateStats(){

document.getElementById("total").innerText=users.length;
document.getElementById("active").innerText=users.filter(u=>u.status==="active").length;
document.getElementById("banned").innerText=users.filter(u=>u.status==="banned").length;
document.getElementById("premium").innerText=users.filter(u=>u.premium).length;

}

/* =========================
SEARCH
========================= */
function searchUsers(q){

q=q.toLowerCase();

filtered=users.filter(u=>
u.name.toLowerCase().includes(q)||
u.email.toLowerCase().includes(q)
);

render();

}

/* =========================
FILTER
========================= */
function filterUsers(type){

if(type==="all") filtered=[...users];
else if(type==="active") filtered=users.filter(u=>u.status==="active");
else if(type==="banned") filtered=users.filter(u=>u.status==="banned");
else if(type==="premium") filtered=users.filter(u=>u.premium);

render();

}

/* =========================
ACTIONS
========================= */
function toggleStatus(id){

users=users.map(u=>{
if(u.id===id){
u.status=(u.status==="active")?"banned":"active";
}
return u;
});

render();
updateStats();

}

function deleteUser(id){

users=users.filter(u=>u.id!==id);
filtered=filtered.filter(u=>u.id!==id);

render();
updateStats();

}

function clearBanned(){

users=users.filter(u=>u.status!=="banned");
filtered=[...users];

render();
updateStats();

}

/* INIT */
generateUsers();

</script>

</body>
</html>
