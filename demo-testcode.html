<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<meta name="theme-color" content="#0b0f1a">

<title>BTECH-TV WORLD ULTRA MAX</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#22c55e;
--danger:#ef4444;
--gold:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* =========================
LOGIN SYSTEM
========================= */

.login-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
padding:20px;
backdrop-filter:blur(15px);
}

.login-box{
width:100%;
max-width:520px;
background:var(--panel);
padding:25px;
border-radius:24px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 40px rgba(0,0,0,.6);
animation:pop .4s ease;
}

@keyframes pop{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.login-header{
text-align:center;
margin-bottom:20px;
}

.login-header h1{
font-size:30px;
color:var(--accent);
margin-bottom:8px;
}

.login-header p{
color:var(--muted);
}

.login-tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.login-tab{
padding:12px;
border:none;
border-radius:12px;
background:var(--card);
color:white;
cursor:pointer;
font-size:12px;
transition:.3s;
}

.login-tab.active{
background:var(--accent);
color:black;
font-weight:bold;
}

.login-content{
display:none;
flex-direction:column;
gap:15px;
}

.login-content.active{
display:flex;
}

.login-content input{
padding:14px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:14px;
}

.login-btn{
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:.3s;
background:var(--accent);
color:black;
}

.login-btn:hover{
transform:translateY(-2px);
}

.google-btn{
background:#22c55e;
color:white;
}

.premium-btn{
background:var(--gold);
color:black;
}

.login-footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
gap:10px;
flex-wrap:wrap;
}

.close-login{
padding:12px 16px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
}

/* =========================
TOPBAR
========================= */

.topbar{
min-height:72px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
gap:15px;
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 16px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

.user-profile{
display:flex;
align-items:center;
gap:10px;
background:var(--card);
padding:10px 15px;
border-radius:14px;
}

.user-avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--accent);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
color:black;
}

.premium-badge{
background:var(--gold);
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
color:black;
margin-top:4px;
}

/* =========================
LAYOUT
========================= */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */

.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
}

.overlay h1{
font-size:70px;
margin-bottom:10px;
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* =========================
SEARCH
========================= */

.stats{
padding:8px 15px;
background:#0f172a;
color:var(--muted);
font-size:12px;
}

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
}

.search-box input{
flex:1;
}

/* =========================
CHANNELS
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
border-color:var(--accent);
transform:translateY(-2px);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:12px;
object-fit:cover;
background:black;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:var(--success);
}

.country{
background:#2563eb;
}

.dead{
background:var(--danger);
}

.fav{
font-size:22px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

html,
body{
overflow:auto;
}

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:260px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.channels{
grid-template-columns:1fr;
padding-bottom:120px;
}

.player{
height:250px;
}

.login-tabs{
grid-template-columns:1fr 1fr;
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="login-modal" id="loginModal">

<div class="login-box">

<div class="login-header">

<h1>📺 BTECH-TV LOGIN</h1>

<p>Premium IPTV Streaming Platform</p>

</div>

<div class="login-tabs">

<button class="login-tab active" onclick="showLoginTab('email',this)">
📧 Email
</button>

<button class="login-tab" onclick="showLoginTab('phone',this)">
📱 Phone
</button>

<button class="login-tab" onclick="showLoginTab('google',this)">
🟢 Google
</button>

<button class="login-tab" onclick="showLoginTab('subscription',this)">
💳 Premium
</button>

</div>

<!-- EMAIL -->

<div class="login-content active" id="emailLogin">

<input
type="email"
id="emailInput"
placeholder="Enter Email"
>

<input
type="password"

>

<input
type="tel"
id="phoneInput"
placeholder="Enter Phone Number"
>

<input
type="password"
id="phonePassword"
placeholder="Enter PIN"
>

<button class="login-btn" onclick="phoneLogin()">
LOGIN WITH PHONE
</button>

<!-- GOOGLE -->

<div class="login-content" id="googleLogin">

<button class="login-btn google-btn" onclick="googleLogin()">
CONTINUE WITH GOOGLE
</button>

</div>

<div class="login-content" id="subscriptionLogin">

<input
type="text"
id="subCode"
placeholder="Subscription Code"
>

<input
type="password"

>

ENTER IPTV

</div>

<div class="topbar">

</div>

All
</button>

<button onclick="setTab('favs',this)">

Theme
</button>

</div>

G
</div>

<div>

<div id="loggedUser">
Guest User
</div>

FREE PLAN
</div>

</div>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">
🇳🇬 Nigeria
</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">
🇺🇸 USA
</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">
🇬🇧 UK
</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">
📰 News
</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">
⚽ Sports
</div>

<div class="cat" onclick="loadExtraPlaylists()">
🚀 Global IPTV Feeds
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
preload="auto"
></video>

<div class="overlay" id="overlay">

<p id="overlayText">
Loading IPTV Channels...
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div>

No Channel Selected
</h2>

<p id="channelGroup">
Global IPTV Streaming
</p>

◀ Prev
</button>

Next ▶
</button>

📺 PiP
</button>

🔗 Share

</div>

0 Channels Loaded
</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search IPTV Channels..."
oninput="searchChannels(this.value)"
>

Sort A-Z

<script>

/* =========================
VARIABLES
========================= */

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;

let favs=
JSON.parse(localStorage.getItem('atv_favs') || '{}');

let recent=
JSON.parse(localStorage.getItem('atv_recent') || '[]');

let currentUser=
JSON.parse(localStorage.getItem('btech_user') || 'null');

const video=
document.getElementById('video');

const extraFeeds=[

'https://iptv-org.github.io/iptv/index.m3u',

'https://iptv-org.github.io/iptv/index.country.m3u',

'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'

];

/* =========================
LOGIN
========================= */

function showLoginTab(type,btn){

document
.querySelectorAll('.login-tab')
.forEach(t=>t.classList.remove('active'));

btn.classList.add('active');

document
.querySelectorAll('.login-content')
.forEach(c=>c.classList.remove('active'));

document
.getElementById(type+'Login')
.classList.add('active');

}

function saveUser(user){

currentUser=user;

localStorage.setItem(
'btech_user',
JSON.stringify(user)
);

updateUserUI();

}

function updateUserUI(){

if(!currentUser){
return;
}

document.getElementById('loggedUser').innerText=
currentUser.name;

document.getElementById('userAvatar').innerText=
currentUser.name.charAt(0).toUpperCase();

document.getElementById('premiumStatus').innerText=
currentUser.plan;

document.getElementById('userStatus').innerText=
'✅ Logged In';

}

function emailLogin(){

const email=
document.getElementById('emailInput').value;

const password=
document.getElementById('emailPassword').value;

if(!email || !password){

alert('Enter email and password');

return;

}

saveUser({

name:email.split('@')[0],
plan:'PREMIUM PLAN'

});

closeLogin();

}

function phoneLogin(){

const phone=
document.getElementById('phoneInput').value;

const password=
document.getElementById('phonePassword').value;

if(!phone || !password){

alert('Enter phone and password');

return;

}

saveUser({

name:phone,
plan:'MOBILE PLAN'

});

closeLogin();

}

function googleLogin(){

saveUser({

name:'Google User',
plan:'GOOGLE PREMIUM'

});

closeLogin();

}

function subscriptionLogin(){

const code=
document.getElementById('subCode').value;

const pin=
document.getElementById('subPin').value;

if(!code || !pin){

alert('Enter subscription details');

return;

}

saveUser({

name:'Premium Subscriber',
plan:'ULTRA PREMIUM'

});

closeLogin();

}

function closeLogin(){

document.getElementById('loginModal').style.display='none';

}

window.onload=function(){

if(currentUser){

updateUserUI();

closeLogin();

}

};

/* =========================
IPTV FUNCTIONS
========================= */

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'Loading '+group+' Channels...';

all=[];

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}catch(err){

alert('Playlist Failed');

}

}

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];

const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=
info.split(',').pop();

const logoMatch=
info.match(/tvg-logo="(.*?)"/);

all.push({

id:all.length+1,
name:name,
url:url,
group:group,

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60'

});

}

}

}

async function loadExtraPlaylists(){

for(let url of extraFeeds){

try{

const res=await fetch(url);

const text=await res.text();

parseM3U(text,'Global Feed');

}catch(err){

console.log(err);

}

}

filteredChannels=[...all];

renderChannels();

updateStats();

}

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div class="status">

<span class="badge free">
LIVE
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

function playChannel(index){

currentIndex=index;

const channel=
filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

if(currentHls){

currentHls.destroy();

}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

currentHls=new Hls();

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

document.getElementById('overlay').style.display='none';

}
);

}else{

video.src=channel.url;

video.play();

}

addRecent(channel.id);

renderChannels();

}

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value)

||

c.group.toLowerCase().includes(value)

);

renderChannels();

updateStats();

}

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

function toggleFav(id){

if(favs[id]){

delete favs[id];

}else{

favs[id]=1;

}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){
filteredChannels=[...all];
}

if(type==='favs'){
filteredChannels=all.filter(c=>favs[c.id]);
}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){

filteredChannels.push(ch);

}

});

}

renderChannels();

updateStats();

}

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){

currentIndex=0;

}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){

currentIndex=
filteredChannels.length-1;

}

playChannel(currentIndex);

}

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

function shareChannel(){

const channel=
filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({

title:channel.name,
url:channel.url

});

}else{

navigator.clipboard.writeText(channel.url);

alert('Channel URL Copied');

}

}

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length+
' Channels Loaded';

}
