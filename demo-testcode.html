<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Hotel Booking SaaS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
header {background:#111; color:#fff; padding:15px; text-align:center;}
.container {padding:20px; max-width:1100px; margin:auto;}
.card {background:#fff; padding:15px; margin:10px 0; border-radius:10px;}
input, button, select {
  padding:10px; margin:5px 0; width:100%;
}
button {background:green; color:#fff; border:none; cursor:pointer;}
button:hover {background:darkgreen;}
.grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px;}
.nav {display:flex; gap:10px; justify-content:center; background:#222; padding:10px;}
.nav button {width:auto; padding:10px 15px;}
.hidden {display:none;}
.small {font-size:12px; color:#555;}
</style>
</head>

<body>

<header>
<h1>🌍 World Hotel Booking SaaS (ONE PAGE)</h1>
</header>

<div class="nav">
<button onclick="show('user')">User</button>
<button onclick="show('hotel')">Hotel Admin</button>
<button onclick="show('super')">Super Admin</button>
</div>

<div class="container">

<!-- USER PANEL -->
<div id="user">

<h2>🔎 Search Hotels</h2>
<input id="search" placeholder="Search city or hotel..." onkeyup="renderHotels()">

<div id="hotelList" class="grid"></div>

</div>

<!-- HOTEL ADMIN -->
<div id="hotel" class="hidden">

<h2>🏨 Hotel Dashboard</h2>

<input id="hname" placeholder="Hotel Name">
<input id="hlocation" placeholder="Location">
<button onclick="addHotel()">Add Hotel</button>

<h3>Your Hotels</h3>
<div id="myHotels"></div>

</div>

<!-- SUPER ADMIN -->
<div id="super" class="hidden">

<h2>🛠 Super Admin Panel</h2>
<p class="small">Manage all bookings & hotels</p>

<h3>All Bookings</h3>
<div id="bookings"></div>

</div>

</div>

<script>

// STORAGE INIT
let hotels = JSON.parse(localStorage.getItem("hotels") || "[]");
let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");

// NAV
function show(tab){
  document.getElementById("user").classList.add("hidden");
  document.getElementById("hotel").classList.add("hidden");
  document.getElementById("super").classList.add("hidden");
  document.getElementById(tab).classList.remove("hidden");
  renderHotels();
  renderMyHotels();
  renderBookings();
}

// ADD HOTEL
function addHotel(){
  let name = document.getElementById("hname").value;
  let location = document.getElementById("hlocation").value;

  if(!name || !location) return alert("Fill all fields");

  hotels.push({
    id: Date.now(),
    name,
    location,
    price: Math.floor(Math.random()*500)+50
  });

  localStorage.setItem("hotels", JSON.stringify(hotels));

  document.getElementById("hname").value="";
  document.getElementById("hlocation").value="";

  renderHotels();
  renderMyHotels();
}

// BOOK HOTEL
function book(id){
  let hotel = hotels.find(h=>h.id==id);

  let booking = {
    id: Date.now(),
    hotel: hotel.name,
    location: hotel.location,
    price: hotel.price,
    date: new Date().toLocaleString()
  };

  bookings.push(booking);
  localStorage.setItem("bookings", JSON.stringify(bookings));

  alert("Booking Successful!");
  renderBookings();
}

// RENDER HOTELS (USER)
function renderHotels(){
  let q = document.getElementById("search").value?.toLowerCase() || "";

  let list = hotels.filter(h =>
    h.name.toLowerCase().includes(q) ||
    h.location.toLowerCase().includes(q)
  );

  document.getElementById("hotelList").innerHTML =
    list.map(h=>`
      <div class="card">
        <h3>${h.name}</h3>
        <p>${h.location}</p>
        <p>💰 $${h.price}/night</p>
        <button onclick="book(${h.id})">Book Now</button>
      </div>
    `).join("");
}

// HOTEL ADMIN VIEW
function renderMyHotels(){
  document.getElementById("myHotels").innerHTML =
    hotels.map(h=>`
      <div class="card">
        <b>${h.name}</b><br>
        ${h.location}<br>
        💰 $${h.price}
      </div>
    `).join("");
}

// BOOKINGS (SUPER ADMIN)
function renderBookings(){
  document.getElementById("bookings").innerHTML =
    bookings.map(b=>`
      <div class="card">
        <b>${b.hotel}</b><br>
        📍 ${b.location}<br>
        💰 $${b.price}<br>
        🕒 ${b.date}
      </div>
    `).join("");
}

// INIT
show('user');

</script>

</body>
</html>
