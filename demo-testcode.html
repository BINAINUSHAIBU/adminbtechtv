<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--panel:#0f1729;
--card:#162033;
--text:#fff;
--muted:#93a4c3;
--primary:#00d4ff;
--primary2:#4f46e5;
--success:#00d084;
--danger:#ff4d6d;
--shadow:0 10px 30px rgba(0,0,0,.4);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

.app{
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:270px;
background:#0b1220;
padding:25px;
position:fixed;
height:100vh;
overflow:auto;
}

.logo{
display:flex;
gap:15px;
align-items:center;
margin-bottom:30px;
}

.logo-icon{
width:55px;height:55px;border-radius:16px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
display:flex;align-items:center;justify-content:center;
font-size:26px;font-weight:800;
}

.menu button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#162033;
color:#fff;
cursor:pointer;
}

/* MAIN */
.main{
margin-left:270px;
width:calc(100% - 270px);
padding:20px;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
gap:15px;
margin-bottom:20px;
}

.search{
flex:1;
background:var(--panel);
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:10px;
}

.search input{
width:100%;
background:none;
border:none;
outline:none;
color:#fff;
}

/* PLAYER */
.player-wrapper{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.player{
background:var(--panel);
padding:15px;
border-radius:18px;
box-shadow:var(--shadow);
}

video{
width:100%;
height:520px;
border-radius:14px;
background:#000;
}

/* CHANNELS */
.channels{
background:var(--panel);
padding:15px;
border-radius:18px;
height:100%;
overflow:auto;
}

.channel{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:var(--card);
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
}

.tag{
font-size:11px;
background:#00d4ff22;
padding:5px 10px;
border-radius:999px;
color:#8ee7ff;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px;
}

.stat{
background:var(--panel);
padding:18px;
border-radius:14px;
}

@media(max-width:1000px){
.player-wrapper{grid-template-columns:1fr;}
.main{margin-left:0;width:100%;}
.sidebar{position:relative;width:100%;}
video{height:350px;}
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">
<div class="logo-icon">📺</div>
<div>
<h2>WORLDTV</h2>
<p>IPTV Platform</p>
</div>
</div>

<div class="menu">
<button>Dashboard</button>
<button>Live TV</button>
<button>Sports</button>
<button>Movies</button>
<button>News</button>
<button>Settings</button>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search">
🔍
<input id="searchInput" placeholder="Search channels...">
</div>
</div>

<!-- PLAYER -->
<div class="player-wrapper">

<div class="player">

<h3 id="channelTitle">Loading...</h3>
<br>

<video id="video" controls autoplay muted></video>

</div>

<!-- CHANNEL LIST -->
<div class="channels">
<h3>Channels</h3>
<div id="channelContainer"></div>
</div>

</div>

<!-- STATS -->
<div class="stats">
<div class="stat">📺 2500+ Channels</div>
<div class="stat">👥 120K Users</div>
<div class="stat">⚡ 4K Quality</div>
<div class="stat">🟢 99.9% Uptime</div>
</div>

</div>
</div>

<script>

/* =========================
   IPTV SOURCE SYSTEM
========================= */

const API_SOURCE = {
enabled: false,
server: "http://your-server.com:8080",
username: "USER",
password: "PASS"
};

/* fallback channels */
let channels = [
{name:"BEIN SPORTS",category:"Sports",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",tag:"LIVE"},
{name:"GLOBAL NEWS",category:"News",url:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",tag:"LIVE"},
{name:"MUSIC TV",category:"Music",url:"https://moiptvhls-i.akamaihd.net/hls/live/652316/Live_1/master.m3u8",tag:"LIVE"},
{name:"GOSPEL TV",category:"Church",url:"https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8",tag:"LIVE"}
];

let currentChannel = channels[0];

const video = document.getElementById("video");
const channelTitle = document.getElementById("channelTitle");

/* LOAD API */
async function loadFromAPI(){

if(!API_SOURCE.enabled){
render();
play(channels[0]);
return;
}

try{

const url =
`${API_SOURCE.server}/player_api.php?username=${API_SOURCE.username}&password=${API_SOURCE.password}&action=get_live_streams`;

const res = await fetch(url);
const data = await res.json();

channels = data.map(c=>({
name:c.name,
category:c.category_id || "Live",
url:`${API_SOURCE.server}/live/${API_SOURCE.username}/${API_SOURCE.password}/${c.stream_id}.m3u8`,
tag:"LIVE"
}));

render();
play(channels[0]);

}catch(e){
console.log("API failed");
render();
play(channels[0]);
}

}

/* RENDER */
function render(){

const box = document.getElementById("channelContainer");
box.innerHTML = "";

channels.forEach(c=>{
box.innerHTML += `
<div class="channel" onclick='play(${JSON.stringify(c)})'>
<div>
<b>${c.name}</b><br>
<small>${c.category}</small>
</div>
<div class="tag">${c.tag}</div>
</div>`;
});

}

/* PLAY */
let hls;

function play(channel){

currentChannel = channel;
channelTitle.innerText = channel.name;

if(hls) hls.destroy();

if(Hls.isSupported()){
hls = new Hls();
hls.loadSource(channel.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src = channel.url;
video.play();
}

}

/* SEARCH */
document.getElementById("searchInput").addEventListener("keyup",e=>{
const v = e.target.value.toLowerCase();
document.querySelectorAll(".channel").forEach(c=>{
c.style.display = c.innerText.toLowerCase().includes(v)?"flex":"none";
});
});

/* INIT */
loadFromAPI();

</script>

</body>
</html>
