```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 BTECH-TV PRO MAX Subscription System</title>

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#fff;
min-height:100vh;
}

.header{
background:#081126;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1e2f57;
}

.logo{
font-size:24px;
font-weight:bold;
color:#00d4ff;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#0f1d45;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
background:#101a31;
border:none;
border-radius:8px;
color:white;
}

button{
padding:12px 20px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.hidden{
display:none;
}

.plan-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

.plan{
background:#101d39;
padding:20px;
border-radius:10px;
text-align:center;
}

.price{
font-size:32px;
font-weight:bold;
color:#00d4ff;
margin:15px 0;
}

.status{
padding:15px;
border-radius:8px;
margin-top:15px;
font-weight:bold;
}

.active{
background:#0f5d2d;
}

.expired{
background:#5a1010;
}

.player{
height:400px;
background:black;
display:flex;
justify-content:center;
align-items:center;
border-radius:12px;
margin-top:20px;
font-size:30px;
}

.countdown{
margin-top:15px;
font-size:18px;
color:#00d4ff;
}

.payment-history{
margin-top:15px;
background:#081126;
padding:15px;
border-radius:8px;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">📺 BTECH-TV PRO MAX</div>
<div id="userInfo">Guest</div>
</div>

<div class="container">

<!-- Registration -->
<div class="card" id="registerBox">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<button onclick="registerUser()">
Start Free 7-Day Trial
</button>

</div>

<!-- Dashboard -->
<div class="card hidden" id="dashboard">

<h2>User Dashboard</h2>

<div id="welcome"></div>

<div id="statusBox" class="status"></div>

<div class="countdown" id="countdown"></div>

<div class="payment-history" id="paymentHistory">
No payment records.
</div>

</div>

<!-- Plans -->
<div class="card hidden" id="plans">

<h2>Subscription Plans</h2>

<div class="plan-grid">

<div class="plan">
<h3>Basic</h3>
<div class="price">₦5,000</div>
<p>30 Days Access</p>
<br>
<button onclick="payNow(5000)">
Subscribe
</button>
</div>

<div class="plan">
<h3>Premium</h3>
<div class="price">₦10,000</div>
<p>30 Days Access</p>
<br>
<button onclick="payNow(10000)">
Subscribe
</button>
</div>

<div class="plan">
<h3>Ultimate</h3>
<div class="price">₦20,000</div>
<p>30 Days Access</p>
<br>
<button onclick="payNow(20000)">
Subscribe
</button>
</div>

</div>

</div>

<!-- IPTV Section -->
<div class="card hidden" id="iptvSection">

<h2>IPTV Access Unlocked</h2>

<div class="player">
📺 IPTV PLAYER AREA
</div>

</div>

</div>

<script>

function registerUser(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();

if(!name || !email){
alert("Please complete all fields.");
return;
}

const user={
name:name,
email:email,
trialEnd:Date.now()+(7*24*60*60*1000),
subscriptionEnd:null,
lastPaymentReference:null,
lastPaymentDate:null
};

localStorage.setItem(
"iptvUser",
JSON.stringify(user)
);

loadUser();
}

function loadUser(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userInfo")
.innerText=user.name;

document.getElementById("welcome")
.innerHTML=
"<h3>Welcome, "+user.name+"</h3>";

showPaymentInfo();
checkAccess();
}

function showPaymentInfo(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

let html="No payment records.";

if(user.lastPaymentReference){

html=
"<b>Last Payment Reference:</b><br>"
+user.lastPaymentReference+
"<br><br><b>Payment Date:</b><br>"
+new Date(user.lastPaymentDate)
.toLocaleString();

}

document.getElementById(
"paymentHistory"
).innerHTML=html;

}

function checkAccess(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

const now=Date.now();

let active=false;

if(user.subscriptionEnd &&
now<user.subscriptionEnd){
active=true;
}
else if(now<user.trialEnd){
active=true;
}

const box=document.getElementById(
"statusBox"
);

if(active){

box.className="status active";
box.innerHTML="✅ Active Access";

document.getElementById(
"iptvSection"
).classList.remove("hidden");

document.getElementById(
"plans"
).classList.add("hidden");

}else{

box.className="status expired";
box.innerHTML="❌ Subscription Expired";

document.getElementById(
"iptvSection"
).classList.add("hidden");

document.getElementById(
"plans"
).classList.remove("hidden");

}

updateCountdown();
}

function updateCountdown(){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user) return;

const expiry=
user.subscriptionEnd ||
user.trialEnd;

const diff=
expiry-Date.now();

if(diff<=0){

document.getElementById(
"countdown"
).innerHTML="Expired";

return;
}

const days=Math.floor(
diff/(1000*60*60*24)
);

document.getElementById(
"countdown"
).innerHTML=
"Access Ends In: "+days+" Days";

}

function payNow(amount){

const user=JSON.parse(
localStorage.getItem("iptvUser")
);

if(!user){
alert("Please register first.");
return;
}

let handler=PaystackPop.setup({

key:"pk_test_REPLACE_WITH_YOUR_KEY",

email:user.email,

amount:amount*100,

currency:"NGN",

ref:"BTECHTV_"+
Math.floor(
Math.random()*1000000000
),

metadata:{
custom_fields:[
{
display_name:"Customer",
variable_name:"customer",
value:user.name
}
]
},

callback:function(response){

user.subscriptionEnd=
Date.now()+
(30*24*60*60*1000);

user.lastPaymentReference=
response.reference;

user.lastPaymentDate=
new Date().toISOString();

localStorage.setItem(
"iptvUser",
JSON.stringify(user)
);

alert(
"Payment Successful!\nReference: "+
response.reference
);

showPaymentInfo();
checkAccess();

},

onClose:function(){
alert("Payment Cancelled");
}

});

handler.openIframe();

}

loadUser();

setInterval(checkAccess,5000);

</script>

</body>
</html>
