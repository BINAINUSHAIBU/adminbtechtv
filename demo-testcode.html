<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV DEMO SAAS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050816;color:#fff}

/* LOGIN */
#login{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#050816;
}

.card{
width:340px;background:#0f1830;
padding:20px;border-radius:12px;
border:1px solid #233b72;text-align:center;
}

input,button{
width:100%;padding:12px;margin:8px 0;
border:none;border-radius:8px;
}

input{background:#152445;color:#fff}
button{background:#00d4ff;font-weight:bold;cursor:pointer}

/* APP */
#app{display:none;height:100vh;display:flex}

/* SIDEBAR */
.sidebar{
width:240px;background:#0d1324;
padding:10px;border-right:1px solid #1d2b4f;
}

.nav-btn{
width:100%;padding:10px;margin:5px 0;
background:#121c33;color:#fff;border:none;border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px}

.player{
height:300px;background:#000;border-radius:10px;overflow:hidden;
}

video{width:100%;height:100%}

.grid{
flex:1;overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:10px;margin-top:10px;
}

.card{
background:#111a31;padding:10px;
border-radius:8px;cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

.badge{
background:red;font-size:10px;
padding:3px 6px;border-radius:8px;float:right;
}

/* ADMIN */
.admin{
margin-top:10px;
background:#1a0d2b;
padding:10px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="card">
<h2>📺 BTECH-TV DEMO</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p style="font-size:12px;margin-top:10px">
DEMO USER: demo@tv.com / 1234<br>
ADMIN: admin@tv.com / admin
</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="sidebar">
<h3>📡 IPTV</h3>

<button class="nav-btn" onclick="loadDemo()">Load Channels</button>
<button class="nav-btn" onclick="loadStats()">Analytics</button>
<button class="nav-btn" onclick="upgrade()">Upgrade</button>
<button class="nav-btn" onclick="logout()">Logout</button>

<div class="admin" id="adminBox"></div>
</div>

<div class="main">

<h3>LIVE PLAYER</h3>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>

</div>

<script>

let all=[],hls;
let video=document.getElementById("video");

/* DEMO USERS */
const USERS = [
{email:"demo@tv.com",pass:"1234",role:"user"},
{email:"admin@tv.com",pass:"admin",role:"admin"}
];

let currentUser=null;

/* LOGIN */
function login(){

let u=USERS.find(x=>
x.email===email.value && x.pass===pass.value
);

if(!u){
alert("Invalid login");
return;
}

currentUser=u;

login.style.display="none";
app.style.display="flex";

loadDemo();
}

/* DEMO IPTV DATA */
function loadDemo(){

all=[
{name:"CNN",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"BBC News",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Sports HD",url:"https://test-streams.mux.dev/dai-discontinuity-detection/hls.m3u8"}
];

render();
}

/* RENDER */
function render(){
grid.innerHTML="";
all.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(i);
grid.appendChild(div);
});
}

/* PLAY */
function play(i){

let c=all[i];

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* ANALYTICS (DEMO) */
function loadStats(){

adminBox.style.display="block";

adminBox.innerHTML=`
<h4>📊 DEMO ANALYTICS</h4>
<p>Users: 2</p>
<p>Active: 1</p>
<p>Streams Played: ${all.length}</p>
`;
}

/* UPGRADE */
function upgrade(){
alert("Connect Paystack / Flutterwave here");
}

/* LOGOUT */
function logout(){
location.reload();
}

</script>

</body>
</html>
