<!DOCTYPE html>

<meta charset="UTF-8"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* ================= LAYOUT ================= */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0d1324;
padding:10px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:20px;
font-weight:900;
color:var(--accent);
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:8px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{
height:320px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

/* CHANNEL TABLE */
.table-wrap{
flex:1;
overflow:auto;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
background:var(--panel);
}

th{
background:#0f172a;
color:var(--accent);
position:sticky;
top:0;
}

td,th{
padding:10px;
border-bottom:1px solid #1f2b4d;
text-align:left;
}

.action{
padding:6px 8px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.lock{background:#f59e0b;}
.edit{background:#2563eb;color:white;}
.delete{background:#dc2626;color:white;}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:320px;
}

button{cursor:pointer}

</style>
</head>

<body>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="topbar">
<div>📺 SUPER ADMIN IPTV SYSTEM</div>
<div>🔴 LIVE</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
<div class="overlay" id="overlay"></div>
</div>

<!-- ================= CHANNEL TABLE ================= -->
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Lock Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="grid"></tbody>
</table>

<button class="nav-btn" onclick="loadMore()">⬇ LOAD MORE CHANNELS</button>
</div>

</div>

<!-- ================= ADMIN ================= -->
<div class="modal" id="admin">
<div class="modal-box">
<h3>SUPER ADMIN PANEL</h3>
<button onclick="scan()">Scan</button>
<button onclick="boost()">Boost</button>
<button onclick="repair()">Repair</button>
<button onclick="optimize()">Optimize</button>
<button onclick="closeAdmin()">Close</button>
</div>
</div>

<script>

let all=[],filtered=[],page=1;
let video=document.getElementById("video");
let hls;

/* ================= LOAD ================= */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

/* ================= M3U ================= */
async function loadM3U(url){

const res=await fetch(url);
const text=await res.text();

all=[];

text.split("\n").forEach((line,i,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[i+1];

if(url && url.startsWith("http")){
all.push({
name,
url,
category:["News","Sports","Movies","Music","Kids","Education"][Math.floor(Math.random()*6)],
type:Math.random()>0.5?"Free":"Pay To View",
lock:Math.random()>0.8?"Locked":"Unlocked"
});
}
}
});

filtered=[...all];
render();
}

/* ================= RENDER TABLE ================= */
function render(){

let body=document.getElementById("grid");
body.innerHTML="";

filtered.slice(0,page*50).forEach((c,i)=>{

body.innerHTML+=`
<tr onclick="play(${i})">

<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.type}</td>
<td>${c.lock}</td>

<td>
<button class="action lock">Lock</button>
<button class="action edit">Edit</button>
<button class="action delete">Delete</button>
</td>

</tr>
`;

});

}

/* ================= LOAD MORE ================= */
function loadMore(){
page++;
render();
}

/* ================= PLAY ================= */
function play(i){

let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

}

/* ================= ADMIN ================= */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}
function scan(){alert("Scanning Channels...");}
function boost(){video.playbackRate=1.2;}
function repair(){alert("Repairing Streams...");}
function optimize(){alert("Optimizing System...");}

</script>

</body>
