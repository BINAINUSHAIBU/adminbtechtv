<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<meta name="theme-color" content="#0b0f1a"/>

<title>BTECH-TV WORLD OFFLINE</title>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
min-height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
gap:15px;
flex-wrap:wrap;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 16px;
background:var(--card);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:13px;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* MAIN */

.container{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:340px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
text-align:center;
padding:20px;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
}

.overlay p{
color:var(--muted);
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
color:var(--muted);
font-size:13px;
}

.clock{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* SEARCH */

.stats{
padding:8px 15px;
background:#0f172a;
font-size:12px;
color:var(--muted);
border-bottom:1px solid rgba(255,255,255,.05);
}

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
min-height:48px;
}

.search-box input{
flex:1;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
gap:10px;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.country{
background:#2563eb;
}

.dead{
background:var(--danger);
}

.fav{
font-size:20px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:250px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.channels{
grid-template-columns:1fr;
padding-bottom:120px;
}

.player{
height:250px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD OFFLINE
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<div class="container">

<div class="sidebar">

<h3>🎬 Offline Categories</h3>

<div class="cat" onclick="loadCategory('Movies')">
🎥 Movies
</div>

<div class="cat" onclick="loadCategory('Sports')">
⚽ Sports
</div>

<div class="cat" onclick="loadCategory('News')">
📰 News
</div>

<div class="cat" onclick="loadCategory('Music')">
🎵 Music
</div>

<div class="cat" onclick="loadCategory('Kids')">
👶 Kids
</div>

<div class="cat" onclick="loadCategory('ALL')">
🌍 All Channels
</div>

</div>

<div class="main">

<div class="player">

<div class="live">
🔴 OFFLINE
</div>

<video
id="video"
controls
autoplay
playsinline
preload="auto"
></video>

<div class="overlay" id="overlay">

<h1>📺</h1>

<p>
Offline BTECH-TV Ready
</p>

</div>

</div>

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Offline Media Streaming
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

</div>

</div>

<div class="stats" id="stats">
0 Offline Channels Loaded
</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search offline channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">
<option value="az">Sort A-Z</option>
<option value="za">Sort Z-A</option>
</select>

</div>

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* OFFLINE CHANNELS */

let all=[

{
id:1,
name:"BTECH MOVIES",
url:"videos/movies.mp4",
logo:"logos/movie.png",
group:"Movies",
country:"NG"
},

{
id:2,
name:"BTECH SPORTS",
url:"videos/sports.mp4",
logo:"logos/sports.png",
group:"Sports",
country:"US"
},

{
id:3,
name:"BTECH NEWS",
url:"videos/news.mp4",
logo:"logos/news.png",
group:"News",
country:"UK"
},

{
id:4,
name:"BTECH MUSIC",
url:"videos/music.mp4",
logo:"logos/music.png",
group:"Music",
country:"FR"
},

{
id:5,
name:"BTECH KIDS",
url:"videos/kids.mp4",
logo:"logos/kids.png",
group:"Kids",
country:"IN"
}

];

let filteredChannels=[...all];
let currentIndex=0;
let dark=true;

let favs=JSON.parse(
localStorage.getItem('atv_favs') || '{}'
);

let recent=JSON.parse(
localStorage.getItem('atv_recent') || '[]'
);

const video=document.getElementById('video');

/* CLOCK */

function tick(){

document.getElementById('clock').innerText=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(tick,1000);
tick();

/* FLAGS */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* RENDER */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>${flag(c.country)} ${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div class="status">

<span class="badge free">
OFFLINE
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

updateStats();

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('overlay').style.display='none';

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

video.pause();

video.src=channel.url;

video.load();

video.play().catch(()=>{});

addRecent(channel.id);

renderChannels();

}

/* NEXT */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

/* PREV */

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* SEARCH */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value) ||

c.group.toLowerCase().includes(value)

);

renderChannels();

}

/* SORT */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

/* CATEGORY */

function loadCategory(group){

if(group==='ALL'){

filteredChannels=[...all];

}else{

filteredChannels=all.filter(c=>
c.group===group
);

}

renderChannels();

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* RECENT */

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){
recent=recent.slice(0,30);
}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

/* TABS */

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){
filteredChannels=[...all];
}

if(type==='favs'){
filteredChannels=all.filter(c=>favs[c.id]);
}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark?'#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark?'#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark?'#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark?'#ffffff':'#000000'
);

}

/* PIP */

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

/* SHARE */

function shareChannel(){

const channel=filteredChannels[currentIndex];

if(!channel){
return;
}

navigator.clipboard.writeText(channel.name);

alert('Channel copied!');

}

/* STATS */

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length+' Offline Channels Loaded';

}

/* KEYBOARD */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

/* AUTO LOAD */

renderChannels();

</script>

</body>
</html>
