<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📺 BTECH-TV PRO MAX ULTRA</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--accent:#00d4ff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0d1324;
padding:10px;
overflow:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:18px;
font-weight:900;
color:var(--accent);
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:7px;
margin:4px 0;
background:#121c33;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
}

.player{
height:300px;
background:black;
}

.player video{
width:100%;
height:100%;
}

.controls{
display:flex;
gap:10px;
padding:8px;
background:#0b1220;
}

.controls input{
flex:1;
padding:8px;
border:none;
border-radius:6px;
}

.grid{
flex:1;
overflow:auto;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
margin:6px 0;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.badge{
font-size:11px;
padding:2px 6px;
border-radius:4px;
background:#1e2b44;
}

button{cursor:pointer}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<h4>🌍 Countries</h4>
<button class="nav-btn" onclick="setCountry('global')">🌍 Global</button>
<button class="nav-btn" onclick="setCountry('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="setCountry('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="setCountry('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="setCountry('in')">🇮🇳 India</button>

<h4>🎬 Categories</h4>
<button class="nav-btn" onclick="setCategory('all')">All</button>
<button class="nav-btn" onclick="setCategory('News')">📰 News</button>
<button class="nav-btn" onclick="setCategory('Sports')">⚽ Sports</button>
<button class="nav-btn" onclick="setCategory('Music')">🎵 Music</button>
<button class="nav-btn" onclick="setCategory('Kids')">👶 Kids</button>

<h4>🔥 Tools</h4>
<button class="nav-btn" onclick="alert('Scan running...')">📡 Scan</button>
<button class="nav-btn" onclick="video.playbackRate=1.2">⚡ Boost</button>
<button class="nav-btn" onclick="alert('Repair complete')">🛠 Repair</button>
<button class="nav-btn" onclick="alert('Optimized')">🧠 Optimize</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>📺 SUPER IPTV ENGINE</div>
<div>🔴 LIVE</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<input id="search" placeholder="Search channels..." oninput="render()"/>
</div>

<div class="grid" id="grid"></div>

</div>

</div>

<script>

/* ================= CHANNEL DATABASE ================= */
let channels = [
{name:"ACNN",category:"Sports",country:"ng",url:""},
{name:"Channels TV",category:"News",country:"ng",url:""},
{name:"Africa TV",category:"Music",country:"ng",url:""},
{name:"BBC World",category:"News",country:"uk",url:""},
{name:"CNN USA",category:"News",country:"us",url:""},
{name:"Bollywood TV",category:"Music",country:"in",url:""},
{name:"Kids World",category:"Kids",country:"global",url:""},
{name:"Sport Live",category:"Sports",country:"global",url:""}
];

let filtered=[...channels];
let country="global";
let category="all";

let video=document.getElementById("video");
let hls;

/* ================= FILTER SYSTEM ================= */
function setCountry(c){
country=c;
render();
}

function setCategory(c){
category=c;
render();
}

/* ================= RENDER ================= */
function render(){
let q=document.getElementById("search").value.toLowerCase();

filtered = channels.filter(ch=>{

let matchCountry = (country==="global" || ch.country===country);
let matchCategory = (category==="all" || ch.category===category);
let matchSearch = ch.name.toLowerCase().includes(q);

return matchCountry && matchCategory && matchSearch;

});

let grid=document.getElementById("grid");
grid.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<span>${c.name}</span>
<span class="badge">${c.category}</span>
`;

div.onclick=()=>play(c);

grid.appendChild(div);

});
}

/* ================= PLAY ================= */
function play(c){

let url = c.url || "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* INIT */
render();

</script>

</body>
</html>
