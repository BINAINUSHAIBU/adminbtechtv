<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENTERPRISE OTT SAAS PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* LOGIN */
#loginBox{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
gap:10px;
z-index:999;
}

input{
padding:10px;
border:none;
border-radius:8px;
width:220px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#1f2a44;
color:#fff;
}

button:hover{background:#00d4ff;color:#000}

/* SIDEBAR */
.sidebar{
width:240px;
background:#111827;
padding:10px;
overflow:auto;
}

.sidebar h3{color:#00d4ff;font-size:14px}

.menu{
padding:8px;
margin:5px 0;
background:#1b2436;
border-radius:8px;
cursor:pointer;
}

.menu:hover{background:#22304d}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
}

/* PLAYER */
.player{
height:300px;
background:black;
}

video{
width:100%;
height:100%;
}

/* CONTENT */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

.card:hover{border-color:#00d4ff}

/* ADMIN PANEL */
.admin{
position:fixed;
right:10px;
bottom:10px;
width:260px;
background:#111827;
padding:10px;
border-radius:10px;
border:1px solid #00d4ff;
display:none;
}

.small{font-size:12px;color:#aaa}

</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginBox">
<h2>🔐 ENTERPRISE SAAS LOGIN</h2>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>📺 ENTERPRISE OTT</h3>

<div class="menu" onclick="loadSample()">📡 Load Content</div>
<div class="menu" onclick="toggleAdmin()">🛠 Admin Panel</div>
<div class="menu" onclick="addSample()">➕ Add Content</div>
<div class="menu" onclick="logout()">🚪 Logout</div>

<hr>

<h3>📊 Stats</h3>
<div id="stats">0 Users • 0 Videos</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>🚀 ENTERPRISE OTT SAAS PLATFORM</div>
<div>🔴 LIVE SYSTEM</div>
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<b>🛠 ADMIN PANEL</b>
<p class="small">System Control Center</p>
<button onclick="clearContent()">Clear Content</button>
<button onclick="seedData()">Seed Demo Data</button>
<button onclick="showStats()">Refresh Stats</button>
</div>

<script>

/* ================= STATE ================= */
let user=null;
let content=[];
let hls;
let video=document.getElementById("video");

/* ================= AUTH (SIMULATED SAAS) ================= */
function register(){
alert("User registered (demo mode)");
}

function login(){
user={
email:email.value,
role: email.value==="admin@saas.com" ? "admin":"user"
};

document.getElementById("loginBox").style.display="none";

if(user.role==="admin"){
document.getElementById("admin").style.display="block";
}

loadSample();
}

/* ================= CONTENT ================= */
function loadSample(){
content=[
{name:"Movie Stream 1",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Movie Stream 2",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Live Channel Demo",url:"https://test-streams.mux.dev/dai-discontinuity-dash.m3u8"}
];

render();
updateStats();
}

function addSample(){
content.push({
name:"New Upload "+Date.now(),
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
});

render();
updateStats();
}

/* ================= RENDER ================= */
function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";

content.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML="📺 "+c.name;
div.onclick=()=>play(c.url);
grid.appendChild(div);
});
}

/* ================= PLAYER ================= */
function play(url){

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

}

/* ================= ADMIN ================= */
function toggleAdmin(){
let a=document.getElementById("admin");
a.style.display=a.style.display==="none"?"block":"none";
}

function clearContent(){
content=[];
render();
updateStats();
}

function seedData(){
loadSample();
}

/* ================= STATS ================= */
function updateStats(){
document.getElementById("stats").innerText=
"1 User • "+content.length+" Videos";
}

function showStats(){
alert("Users: 1\nVideos: "+content.length);
}

/* ================= LOGOUT ================= */
function logout(){
location.reload();
}

</script>

</body>
</html>
