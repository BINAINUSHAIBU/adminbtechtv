<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV IPTV SAAS PRO MAX (NO LOGIN)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:10px;
background:#111827;
}

/* LAYOUT */
.container{display:flex;height:100vh}

.sidebar{
width:250px;
background:#0b1220;
padding:10px;
overflow:auto;
}

.channel{
padding:10px;
margin:5px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

.main{flex:1;display:flex;flex-direction:column}

video{
width:100%;
height:360px;
background:black;
}

/* PAYWALL */
#paywall{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.9);
z-index:9999;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1f2937;
color:#fff;
}
</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<div class="topbar">
<div>📺 BTECH-TV IPTV SAAS PRO MAX</div>
<button onclick="resetTrial()">Reset Trial</button>
</div>

<!-- ================= PAYWALL ================= -->
<div id="paywall">
<h2>⚠ Trial Expired</h2>
<p>Upgrade to continue watching</p>
<button onclick="payWithPaystack()">Upgrade ₦2000</button>
</div>

<!-- ================= APP ================= -->
<div class="container">

<div class="sidebar">
<div class="channel" onclick="playStream()">News Live</div>
<div class="channel" onclick="playStream()">Sports HD</div>
<div class="channel" onclick="playStream()">Movies Zone</div>
</div>

<div class="main">
<video id="video" controls></video>
</div>

</div>

<script>

/* ================= TRIAL SYSTEM (4 HOURS PER DEVICE) ================= */
const trialKey = "btechtv_trial_start";

function initTrial(){
if(!localStorage.getItem(trialKey)){
localStorage.setItem(trialKey,Date.now());
}
}

function checkTrial(){
let start = parseInt(localStorage.getItem(trialKey));
let limit = 4 * 60 * 60 * 1000;

if(Date.now() - start > limit){
document.getElementById("paywall").style.display="flex";
return false;
}

return true;
}

setInterval(checkTrial,5000);
initTrial();

/* ================= RESET TRIAL ================= */
function resetTrial(){
localStorage.removeItem(trialKey);
location.reload();
}

/* ================= PAYSTACK ================= */
function payWithPaystack(){

let handler = PaystackPop.setup({
key:"YOUR_PAYSTACK_PUBLIC_KEY",
email:"guest@btechtv.com",
amount:2000*100,
currency:"NGN",

callback:function(){
alert("Payment Successful - Premium Unlocked");
localStorage.setItem("premium","true");
document.getElementById("paywall").style.display="none";
},

onClose:function(){
alert("Payment cancelled");
}
});

handler.openIframe();
}

/* ================= IPTV PLAYER ================= */
function playStream(){

if(!checkTrial() && !localStorage.getItem("premium")){
document.getElementById("paywall").style.display="flex";
return;
}

const video = document.getElementById("video");

let url = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

if(Hls.isSupported()){
let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

</script>

</body>
</html>
