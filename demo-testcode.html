<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📺 SUPER ADMIN IPTV ULTRA MAX WORLD</title>

<meta name="theme-color" content="#050816"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--danger:#ef4444;
--premium:#7c3aed;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
body{display:flex;flex-direction:column;}

.topbar{
height:70px;background:#0f172a;display:flex;
justify-content:space-between;align-items:center;
padding:0 20px;gap:15px;
}

.logo{font-size:20px;font-weight:bold;color:var(--accent);}

.container{display:flex;flex:1;overflow:hidden;}

.sidebar{
width:320px;background:#0b1220;overflow-y:auto;padding:15px;
}

.cat,.control,.menu-link{
background:var(--card);padding:10px;border-radius:10px;
margin-bottom:8px;cursor:pointer;color:white;text-decoration:none;
display:block;
}

.cat:hover,.control:hover{background:var(--hover);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.player{height:320px;background:black;position:relative;}
.player video{width:100%;height:100%;object-fit:cover;}

.overlay{
position:absolute;inset:0;background:rgba(0,0,0,.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;
}

.now-playing{
background:var(--panel);padding:10px;display:flex;
justify-content:space-between;align-items:center;
}

.search-box{display:flex;padding:10px;background:var(--panel);}
.search-box input{
flex:1;padding:10px;background:#0f172a;color:white;border:none;
}

.channels{
flex:1;overflow-y:auto;padding:10px;
display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:10px;
}

.channel{
background:var(--card);padding:10px;border-radius:10px;
cursor:pointer;
}

.channel:hover{background:var(--hover);}

.rightpanel{
width:300px;background:var(--panel);overflow-y:auto;
padding:10px;
}

.mini{
position:fixed;right:20px;bottom:20px;width:240px;height:140px;
display:none;border:2px solid var(--accent);
}

.mini video{width:100%;height:100%;}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">📺 SUPER ADMIN IPTV</div>
<div>
<button onclick="setTab('all',this)">All</button>
<button onclick="setTab('favs',this)">⭐ Fav</button>
<button onclick="setTab('recent',this)">🕘 Recent</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','UK')">UK</div>

<h3>⚙ Admin</h3>

<a class="menu-link" href="https://superadminbtech-tv.netlify.app/super_admin">Super Admin</a>

<a class="menu-link" href="https://superadminbtech-tv.netlify.app/user_manager">
User Manager
</a>

<a class="menu-link" href="https://superadminbtech-tv.netlify.app/pay_to-view">
Pay To View
</a>

<a class="menu-link" href="https://superadminbtech-tv.netlify.app/locked_channels">
Locked Channels
</a>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="videoPlayer" controls autoplay muted></video>
<div class="overlay" id="overlay">Loading...</div>
</div>

<div class="now-playing">
<div>
<h3 id="channelName">No Channel</h3>
<small id="channelGroup">---</small>
</div>
<div>
<button onclick="prevChannel()">◀</button>
<button onclick="nextChannel()">▶</button>
<button onclick="muteToggle()">🔊</button>
</div>
</div>

<div class="search-box">
<input oninput="searchChannels(this.value)" placeholder="Search channels..."/>
</div>

<div class="channels" id="channelList"></div>

</div>

<!-- RIGHT -->
<div class="rightpanel">
<h3>📊 Stats</h3>
<p>Total: <span id="totalChannels">0</span></p>
<p>Favs: <span id="favoritesCount">0</span></p>
<p>Dead: <span id="deadCount">0</span></p>
</div>

</div>

<div class="mini" id="miniPlayer">
<video id="miniVideo" muted autoplay></video>
</div>

<script>

let allChannels=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;

let favs=JSON.parse(localStorage.getItem('favs')||'{}');
let recent=JSON.parse(localStorage.getItem('recent')||'[]');

const overlay=document.getElementById('overlay');

function showOverlay(t){overlay.style.display='flex';overlay.innerText=t;}
function hideOverlay(){overlay.style.display='none';}

async function loadPlaylist(url,group){
showOverlay("Loading "+group);

allChannels=[];

const res=await fetch(url);
const text=await res.text();

parseM3U(text,group);

filteredChannels=[...allChannels];
render();
updateStats();
hideOverlay();
}

function parseM3U(data,group){
const lines=data.split('\n');

for(let i=0;i<lines.length;i++){
if(lines[i].startsWith('#EXTINF')){
const url=lines[i+1];
if(!url || !url.startsWith('http')) continue;

allChannels.push({
id:allChannels.length+1,
name:lines[i].split(',').pop(),
url,
group,
logo:'https://via.placeholder.com/60'
});
}
}
}

function render(){
const box=document.getElementById('channelList');
box.innerHTML='';

filteredChannels.forEach((c,i)=>{
const div=document.createElement('div');
div.className='channel';
div.innerHTML=`<b>${c.name}</b><br><small>${c.group}</small>`;
div.onclick=()=>play(i);
box.appendChild(div);
});
}

function play(i){
if(!filteredChannels[i]) return;

currentIndex=i;
const c=filteredChannels[i];

document.getElementById('channelName').innerText=c.name;
document.getElementById('channelGroup').innerText=c.group;

const video=document.getElementById('videoPlayer');

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(c.url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}

addRecent(c.id);
}

function searchChannels(q){
q=q.toLowerCase();
filteredChannels=allChannels.filter(c=>
c.name.toLowerCase().includes(q)
);
render();
}

function nextChannel(){
if(!filteredChannels.length) return;
currentIndex=(currentIndex+1)%filteredChannels.length;
play(currentIndex);
}

function prevChannel(){
if(!filteredChannels.length) return;
currentIndex=(currentIndex-1+filteredChannels.length)%filteredChannels.length;
play(currentIndex);
}

function muteToggle(){
const v=document.getElementById('videoPlayer');
v.muted=!v.muted;
}

function addRecent(id){
recent=recent.filter(r=>r!==id);
recent.unshift(id);
localStorage.setItem('recent',JSON.stringify(recent));
}

function setTab(type){
if(type==='all') filteredChannels=[...allChannels];
if(type==='favs') filteredChannels=allChannels.filter(c=>favs[c.id]);
if(type==='recent'){
filteredChannels=recent.map(id=>allChannels.find(c=>c.id===id)).filter(Boolean);
}
render();
}

function updateStats(){
document.getElementById('totalChannels').innerText=allChannels.length;
document.getElementById('favoritesCount').innerText=Object.keys(favs).length;
document.getElementById('deadCount').innerText=0;
}

loadPlaylist('https://iptv-org.github.io/iptv/index.country.m3u','World');

</script>

</body>
</html>
