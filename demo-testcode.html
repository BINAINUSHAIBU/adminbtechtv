<!-- =========================================
BTECH-TV WORLD
FULL MOBILE + TABLET + WEB + DESKTOP VERSION
NO UI CHANGES
ULTRA LOW BUFFER MODE
========================================= -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
}

/* BODY */

body{
display:flex;
flex-direction:column;
}

/* BUTTONS */

button{
cursor:pointer;
border:none;
outline:none;
}

/* TOPBAR */

.topbar{
height:65px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
flex-shrink:0;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
overflow-y:hidden;
scrollbar-width:none;
-webkit-overflow-scrolling:touch;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 15px;
background:var(--card);
color:white;
border-radius:8px;
font-size:13px;
transition:.3s;
white-space:nowrap;
min-width:max-content;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* MAIN CONTAINER */

.container{
display:flex;
height:calc(100vh - 65px);
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:300px;
min-width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
-webkit-overflow-scrolling:touch;
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */

.player{
height:340px;
min-height:220px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
flex-shrink:0;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

/* LIVE BADGE */

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 15px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
}

.overlay p{
color:var(--muted);
}

/* NOW PLAYING */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
word-break:break-word;
}

.now-info p{
color:var(--muted);
font-size:13px;
}

.clock{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

/* CONTROLS */

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
color:white;
border-radius:8px;
font-size:13px;
}

.controls button:hover{
background:var(--hover);
}

/* STATS */

.stats{
padding:8px 15px;
background:#0f172a;
font-size:12px;
color:var(--muted);
border-bottom:1px solid rgba(255,255,255,.05);
flex-shrink:0;
}

/* SEARCH */

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
flex-shrink:0;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
font-size:14px;
}

.search-box input{
flex:1;
min-width:180px;
}

/* CHANNELS */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
-webkit-overflow-scrolling:touch;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
gap:10px;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
flex:1;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
flex-shrink:0;
}

.info{
overflow:hidden;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}

.free{
background:#16a34a;
}

.country{
background:#2563eb;
}

.dead{
background:var(--danger);
}

.fav{
font-size:20px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* TABLETS */

@media(max-width:1100px){

.sidebar{
width:250px;
min-width:250px;
}

.player{
height:300px;
}

}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
height:auto;
overflow:hidden;
}

.sidebar{
display:none;
}

.main{
height:calc(100vh - 65px);
}

.player{
height:auto;
aspect-ratio:16/9;
min-height:auto;
}

.channels{
grid-template-columns:1fr;
padding-bottom:100px;
}

.topbar{
flex-direction:column;
height:auto;
padding:10px;
gap:10px;
}

.top-buttons{
width:100%;
}

.now-playing{
padding:12px;
}

.controls{
width:100%;
overflow-x:auto;
flex-wrap:nowrap;
padding-bottom:5px;
}

.controls button{
white-space:nowrap;
min-width:max-content;
}

.search-box{
flex-direction:column;
}

.search-box input,
.search-box select{
width:100%;
}

}

/* SMALL PHONES */

@media(max-width:480px){

.logo{
font-size:18px;
}

.top-buttons button{
font-size:12px;
padding:9px 12px;
}

.left img{
width:50px;
height:50px;
}

.info h4{
font-size:13px;
}

.channel{
padding:12px;
}

.live{
font-size:10px;
padding:6px 10px;
}

.controls button{
font-size:12px;
padding:9px 12px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">
🇳🇬 Nigeria
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u','USA')">
🇺🇸 USA
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u','United Kingdom')">
🇬🇧 UK
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/in.m3u','India')">
🇮🇳 India
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">
📰 News
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">
⚽ Sports
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u','Movies')">
🎥 Movies
</div>

<div class="cat"
onclick="loadPlaylist('https://iptv-org.github.io/iptv/languages/eng.m3u','English')">
🗣 English
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
x-webkit-airplay="allow"
preload="metadata"
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading IPTV Channels...
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global BTECH-TV Streaming
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

<button id="autoSkipBtn"
onclick="toggleAutoSkip()">
⏭ Auto Skip
</button>

</div>

</div>

<!-- STATS -->

<div class="stats" id="stats">
0 Channels Loaded
</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search BTECH-TV channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">

<option value="az">
Sort A-Z
</option>

<option value="za">
Sort Z-A
</option>

</select>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* =========================================
GLOBAL VARIABLES
========================================= */

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;
let activeTab='all';
let autoSkipOn=true;

let favs=JSON.parse(
localStorage.getItem('atv_favs') || '{}'
);

let recent=JSON.parse(
localStorage.getItem('atv_recent') || '[]'
);

let deadCh={};
let aliveCh={};

/* =========================================
CLOCK
========================================= */

function tick(){

document.getElementById('clock').innerText=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(tick,1000);
tick();

/* =========================================
FLAGS
========================================= */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* =========================================
LOAD PLAYLIST
========================================= */

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'Loading '+group+' channels...';

all=[];

try{

const res=await fetch(url,{
cache:'no-store'
});

const text=await res.text();

parseM3U(text,group);

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}catch(err){

alert('Failed to load playlist');

console.error(err);

}

}

/* =========================================
PARSE M3U
========================================= */

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=
info.match(/tvg-logo="(.*?)"/);

const logo=logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60';

const countryMatch=
info.match(/tvg-country="(.*?)"/);

const country=countryMatch
? countryMatch[1]
: '';

all.push({
id:all.length+1,
name:name,
url:url,
logo:logo,
group:group,
country:country,
type:'free'
});

}

}

}

/* =========================================
RENDER CHANNELS
========================================= */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

let badge='LIVE';

if(deadCh[c.id]){
badge='OFF';
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<span class="badge free">
FREE
</span>

<span class="badge ${deadCh[c.id] ? 'dead':'country'}">
${badge}
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>

${favs[c.id] ? '★':'☆'}

</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

}

/* =========================================
PLAY CHANNEL
========================================= */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

const video=document.getElementById('video');

/* DESTROY OLD PLAYER */

if(currentHls){

currentHls.destroy();

currentHls=null;

}

/* LOW BUFFER SETTINGS */

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,
lowLatencyMode:true,

backBufferLength:10,

maxBufferLength:8,
maxMaxBufferLength:12,

liveSyncDuration:2,
liveMaxLatencyDuration:5,

manifestLoadingTimeOut:20000,
manifestLoadingMaxRetry:5,

levelLoadingTimeOut:20000,
fragLoadingTimeOut:25000,

capLevelToPlayerSize:true,

startLevel:-1,

abrEwmaDefaultEstimate:500000,

testBandwidth:true

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play().catch(()=>{});

aliveCh[channel.id]=1;

delete deadCh[channel.id];

renderChannels();

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

deadCh[channel.id]=1;

renderChannels();

if(autoSkipOn){
nextChannel();
}

}

}
);

}else{

video.src=channel.url;

video.play().catch(()=>{});

}

/* SAVE RECENT */

addRecent(channel.id);

renderChannels();

}

/* =========================================
NEXT / PREV
========================================= */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* =========================================
SEARCH
========================================= */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value) ||

c.group.toLowerCase().includes(value)

);

renderChannels();

updateStats();

}

/* =========================================
SORT
========================================= */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

/* =========================================
TABS
========================================= */

function setTab(type,btn){

activeTab=type;

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){

filteredChannels=[...all];

}

if(type==='favs'){

filteredChannels=
all.filter(c=>favs[c.id]);

}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

updateStats();

}

/* =========================================
FAVORITES
========================================= */

function toggleFav(id){

if(favs[id]){

delete favs[id];

}else{

favs[id]=1;

}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* =========================================
RECENT
========================================= */

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){

recent=recent.slice(0,30);

}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

/* =========================================
THEME
========================================= */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark?'#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark?'#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark?'#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark?'#ffffff':'#000000'
);

}

/* =========================================
PIP
========================================= */

function togglePiP(){

const video=document.getElementById('video');

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else{

if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

}

/* =========================================
SHARE
========================================= */

function shareChannel(){

const channel=filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({
title:channel.name,
url:channel.url
});

}else{

navigator.clipboard.writeText(channel.url);

alert('Channel URL copied!');

}

}

/* =========================================
AUTO SKIP
========================================= */

function toggleAutoSkip(){

autoSkipOn=!autoSkipOn;

document.getElementById('autoSkipBtn').innerText=

autoSkipOn
? '⏭ Auto Skip'
: '⏭ Skip OFF';

}

/* =========================================
STATS
========================================= */

function updateStats(){

document.getElementById('stats').innerText=

filteredChannels.length + ' Channels Loaded';

}

/* =========================================
KEYBOARD
========================================= */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

/* =========================================
AUTO PLAY FIX FOR MOBILE
========================================= */

document.addEventListener('touchstart',function(){

const video=document.getElementById('video');

video.muted=true;

video.play().catch(()=>{});

},{once:true});

/* =========================================
START
========================================= */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
