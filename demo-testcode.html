<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV PRO MAX | SUPER ADMIN IPTV SYSTEM</title>

<meta name="theme-color" content="#050816">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--sidebar:#0d1324;
--panel:#111827;
--card:#172033;
--accent:#00d4ff;
--text:#ffffff;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:320px;
background:var(--sidebar);
padding:15px;
overflow:auto;
border-right:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:24px;
font-weight:900;
text-align:center;
color:var(--accent);
margin-bottom:20px;
}

.section-title{
color:var(--accent);
font-size:13px;
font-weight:bold;
margin:15px 0 8px;
}

.nav-btn{
width:100%;
padding:10px;
margin:3px 0;
border:none;
border-radius:10px;
background:#121c33;
color:#fff;
cursor:pointer;
text-align:left;
}

.nav-btn:hover{
background:var(--accent);
color:#000;
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#0f172a;
border-bottom:1px solid rgba(255,255,255,.08);
}

.live{
color:red;
font-weight:bold;
}

/* PLAYER */

.player{
height:300px;
background:#000;
}

.player video{
width:100%;
height:100%;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
padding:15px;
}

.card{
background:var(--panel);
padding:15px;
border-radius:12px;
}

.card h3{
color:#94a3b8;
}

.card p{
font-size:28px;
color:var(--accent);
margin-top:5px;
}

/* SEARCH */

.search-box{
padding:0 15px 15px;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

/* CHANNEL GRID */

.channel-grid{
flex:1;
overflow:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:15px;
}

.channel{
background:var(--card);
border-radius:12px;
overflow:hidden;
}

.channel img{
width:100%;
height:150px;
object-fit:cover;
}

.channel-body{
padding:12px;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
font-size:11px;
margin-right:4px;
}

.free{
background:var(--success);
}

.premium{
background:var(--danger);
}

.locked{
background:var(--warning);
}

.actions{
display:flex;
gap:5px;
margin-top:10px;
}

.actions button{
flex:1;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.watch{
background:var(--accent);
}

.edit{
background:#2563eb;
color:#fff;
}

.delete{
background:#dc2626;
color:#fff;
}

/* PLAYER MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.modal video{
width:90%;
max-width:1000px;
}

.close-btn{
background:red;
color:white;
border:none;
padding:10px 20px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<div class="section-title">🌍 COUNTRIES</div>

<button class="nav-btn">🇳🇬 Nigeria</button>
<button class="nav-btn">🇺🇸 USA</button>
<button class="nav-btn">🇬🇧 UK</button>
<button class="nav-btn">🇮🇳 India</button>
<button class="nav-btn">🇫🇷 France</button>
<button class="nav-btn">🇩🇪 Germany</button>
<button class="nav-btn">🇧🇷 Brazil</button>
<button class="nav-btn">🇿🇦 South Africa</button>

<div class="section-title">🎬 CATEGORIES</div>

<button class="nav-btn">📰 News</button>
<button class="nav-btn">⚽ Sports</button>
<button class="nav-btn">🎬 Movies</button>
<button class="nav-btn">🎵 Music</button>
<button class="nav-btn">👶 Kids</button>
<button class="nav-btn">😂 Comedy</button>

<div class="section-title">🗣 LANGUAGES</div>

<button class="nav-btn">🇬🇧 English</button>
<button class="nav-btn">🇪🇸 Spanish</button>
<button class="nav-btn">🇸🇦 Arabic</button>
<button class="nav-btn">🇫🇷 French</button>

<div class="section-title">🔥 TOOLS</div>

<button class="nav-btn" onclick="scan()">📡 Scan</button>
<button class="nav-btn" onclick="boost()">⚡ Boost</button>
<button class="nav-btn" onclick="repair()">🛠 Repair</button>
<button class="nav-btn" onclick="optimize()">🧠 Optimize</button>
<button class="nav-btn">⚙ Admin</button>

<div class="section-title">👑 SUPER ADMIN</div>

<button class="nav-btn">👥 User Manager</button>
<button class="nav-btn">💳 Subscriptions</button>
<button class="nav-btn">📊 Analytics</button>
<button class="nav-btn">🔐 Security</button>
<button class="nav-btn">🖥 Servers</button>
<button class="nav-btn">⭐ Favorites</button>
<button class="nav-btn">📜 History</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>📺 SUPER ADMIN IPTV SYSTEM</h2>
<div class="live">🔴 LIVE STREAMING</div>
</div>

<div class="player">
<video id="preview" controls muted></video>
</div>

<div class="stats">
<div class="card"><h3>Total Channels</h3><p id="total">60</p></div>
<div class="card"><h3>Premium</h3><p id="premium">20</p></div>
<div class="card"><h3>Locked</h3><p id="locked">10</p></div>
<div class="card"><h3>Users</h3><p>120K</p></div>
</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search Channels..." onkeyup="renderChannels()">
</div>

<div class="channel-grid" id="grid"></div>

</div>
</div>

<!-- PLAYER MODAL -->

<div class="modal" id="modal">
<button class="close-btn" onclick="closePlayer()">Close</button>
<video id="video" controls autoplay></video>
</div>

<script>

const channels=[];

for(let i=1;i<=60;i++){
channels.push({
name:"BTECH LIVE "+i,
type:i%3===0?"Premium":"Free",
locked:i%5===0,
img:"https://via.placeholder.com/400x200/111827/00d4ff?text=CHANNEL+"+i,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
});
}

function renderChannels(){

const q=document.getElementById("search").value.toLowerCase();

const grid=document.getElementById("grid");

grid.innerHTML="";

channels
.filter(c=>c.name.toLowerCase().includes(q))
.forEach(c=>{

grid.innerHTML+=`
<div class="channel">

<img src="${c.img}">

<div class="channel-body">

<h3>${c.name}</h3>

<span class="badge ${c.type==='Free'?'free':'premium'}">
${c.type}
</span>

${c.locked?'<span class="badge locked">Locked</span>':''}

<div class="actions">
<button class="watch" onclick="playChannel('${c.url}')">Watch</button>
<button class="edit">Edit</button>
<button class="delete">Delete</button>
</div>

</div>
</div>`;
});
}

function playChannel(url){

const video=document.getElementById("video");

document.getElementById("modal").style.display="flex";

if(Hls.isSupported()){
const hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
}else{
video.src=url;
}
}

function closePlayer(){
document.getElementById("modal").style.display="none";
document.getElementById("video").pause();
}

function scan(){
alert("Scanning IPTV Streams...");
}

function boost(){
alert("Boosting Stream Performance...");
}

function repair(){
alert("Repairing IPTV Sources...");
}

function optimize(){
alert("AI IPTV Optimization Started...");
}

renderChannels();

</script>

</body>
</html>
