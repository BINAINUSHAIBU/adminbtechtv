<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV PRO ULTRA MAX 100K SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:20px;
}

.topbar button{
padding:8px 12px;
background:var(--card);
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.topbar button:hover{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#0f1628;
padding:12px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.cat:hover{
background:var(--hover);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* =========================
PLAYER
========================= */

.player{
height:320px;
background:black;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,0.85);
}

/* =========================
NOW BAR
========================= */

.now{
background:var(--panel);
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* =========================
CHANNELS
========================= */

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{
border:1px solid var(--accent);
}

/* =========================
RIGHT PANEL
========================= */

.right{
width:280px;
background:var(--panel);
padding:12px;
overflow:auto;
border-left:1px solid rgba(255,255,255,0.05);
}

.stat{
background:var(--card);
padding:10px;
margin:6px 0;
border-radius:6px;
}

/* =========================
INPUT
========================= */

input{
width:100%;
padding:10px;
margin-bottom:10px;
background:#0f1628;
border:none;
color:white;
}

button{
cursor:pointer;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<h2>📺 BTECH-TV ULTRA MAX 100K ENGINE</h2>
<button onclick="filterCat('All')">ALL</button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat" onclick="filterCat('All')">📺 All</div>
<div class="cat" onclick="filterCat('Sports')">🏆 Sports</div>
<div class="cat" onclick="filterCat('Movies')">🎬 Movies</div>
<div class="cat" onclick="filterCat('News')">📰 News</div>
<div class="cat" onclick="filterCat('Africa')">🌍 Africa</div>

<h3 style="margin-top:10px;font-size:13px">🌍 Countries</h3>
<div id="countryList"></div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls autoplay></video>
<div class="overlay" id="overlay">🚀 Loading Engine...</div>
</div>

<div class="now">
<div>
<h3 id="name">No Channel</h3>
<p id="group">Ready</p>
</div>

<div>
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>
</div>

<div id="channels" class="channels"></div>

</div>

<!-- RIGHT -->
<div class="right">

<input placeholder="Search..." oninput="searchChannels(this.value)">

<button onclick="generateChannels()">Generate 100K+</button>

<div class="stat">Total: <span id="total">0</span></div>
<div class="stat">Free: <span id="free">0</span></div>
<div class="stat">Locked: <span id="locked">0</span></div>

</div>

</div>

<script>

/* =========================
ENGINE
========================= */

let channels=[];
let filtered=[];
let current=0;
let hls=null;

/* =========================
AFRICA COUNTRIES
========================= */

const africa=[
"Algeria","Angola","Benin","Botswana","Cameroon","Egypt",
"Ghana","Kenya","Libya","Morocco","Nigeria","Rwanda",
"Senegal","South Africa","Sudan","Tanzania","Togo",
"Tunisia","Uganda","Zambia","Zimbabwe"
];

/* =========================
STREAMS
========================= */

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =========================
GENERATE 100K
========================= */

function generateChannels(){

channels=[];

for(let i=0;i<100000;i++){

let country=africa[i%africa.length];
let type=["Sports","News","Movies","Music"][i%4];

channels.push({
id:i,
name:`${country} ${type} TV ${i}`,
country,
category:type,
url:streams[i%streams.length],
status:i%7===0?"locked":"free"
});

}

filtered=[...channels];
render();
stats();
document.getElementById("overlay").style.display="none";
}

/* =========================
RENDER (FAST)
========================= */

function render(){

let box=document.getElementById("channels");
box.innerHTML="";

filtered.slice(0,300).forEach((c,i)=>{

box.innerHTML+=`
<div class="channel" onclick="play(${i})">
<div>
<b>${c.name}</b><br>
<small>${c.country}</small>
</div>
<div>${c.status}</div>
</div>
`;

});

}

/* =========================
PLAY
========================= */

function play(i){

current=i;
let c=filtered[i];

document.getElementById("name").innerText=c.name;
document.getElementById("group").innerText=c.country;

let v=document.getElementById("video");

if(hls)hls.destroy();

if(Hls.isSupported()){

hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);

}else{
v.src=c.url;
}

}

/* =========================
NEXT / PREV
========================= */

function next(){
current=(current+1)%filtered.length;
play(current);
}

function prev(){
current=(current-1+filtered.length)%filtered.length;
play(current);
}

/* =========================
SEARCH
========================= */

function searchChannels(q){

q=q.toLowerCase();

filtered=channels.filter(x=>
x.name.toLowerCase().includes(q) ||
x.country.toLowerCase().includes(q) ||
x.category.toLowerCase().includes(q)
);

render();
}

/* =========================
FILTER
========================= */

function filterCat(cat){

filtered = (cat==="All")
? channels
: channels.filter(x=>x.category.includes(cat));

render();
}

/* =========================
STATS
========================= */

function stats(){

document.getElementById("total").innerText=channels.length;
document.getElementById("free").innerText=channels.filter(x=>x.status==="free").length;
document.getElementById("locked").innerText=channels.filter(x=>x.status==="locked").length;

}

/* =========================
COUNTRY LIST
========================= */

africa.forEach(c=>{
document.getElementById("countryList").innerHTML+=
`<div class="cat" onclick="searchChannels('${c}')">${c}</div>`;
});

/* =========================
START
========================= */

generateChannels();

</script>

</body>
</html>
