<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV WORLD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
cursor:pointer;
border:none;
}

.topbar{
height:65px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
}

.top-buttons{
display:flex;
gap:10px;
overflow:auto;
}

.top-buttons button{
padding:10px 15px;
background:var(--card);
color:white;
border-radius:8px;
font-size:13px;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

.container{
display:flex;
height:calc(100vh - 65px);
}

.sidebar{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.player{
height:340px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background
