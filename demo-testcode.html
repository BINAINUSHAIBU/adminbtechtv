

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV WORLD PRO MAX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff}
header{display:flex;justify-content:space-between;padding:16px;background:#0d1324}
#player{width:100%;height:60vh;background:#000}
#trialLock{display:none;position:fixed;inset:0;background:rgba(3,8,20,.96);align-items:center;justify-content:center}
.card{background:#101a31;padding:30px;border-radius:12px;text-align:center;max-width:420px}
button{padding:12px 18px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<h2>📺 BTECH-TV WORLD PRO MAX</h2>
<div>Trial: <span id="timer">02:00</span></div>
</header>

<video id="player" controls autoplay muted></video>

<div id="trialLock">
<div class="card">
<h1>🔒 Free Trial Expired</h1>
<p>Subscribe to continue.</p>
<button onclick="payNow()">💳 Pay with Paystack</button>
</div>
</div>

<script>
const video=document.getElementById('player');
let seconds=120,trialExpired=false,isPremium=false;
const timer=document.getElementById('timer');

const t=setInterval(()=>{
 if(isPremium||trialExpired)return;
 seconds--;
 timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+":"+String(seconds%60).padStart(2,'0');
 if(seconds<=0){
   trialExpired=true;
   video.pause();
   document.getElementById('trialLock').style.display='flex';
   clearInterval(t);
 }
},1000);

function payNow(){
 const email=prompt("Enter your email");
 if(!email)return;
 const handler=PaystackPop.setup({
   key:"YOUR_PAYSTACK_PUBLIC_KEY",
   email:email,
   amount:5000*100,
   currency:"NGN",
   callback:function(){unlockChannels();},
   onClose:function(){alert("Payment cancelled");}
 });
 handler.openIframe();
}
function unlockChannels(){
 isPremium=true;
 trialExpired=false;
 document.getElementById('trialLock').style.display='none';
 video.play();
}
</script>
</body>
</html>
