<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ULTRA PRO MAX V2</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff}

header{padding:12px;background:#111827;display:flex;justify-content:space-between}

.container{display:flex;height:calc(100vh - 50px)}

.sidebar{width:260px;background:#0f172a;padding:10px;overflow:auto}

.main{flex:1;display:flex;flex-direction:column}

.video{height:350px;background:black}

.list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:10px}

.card{background:#1f2937;padding:10px;border-radius:10px;cursor:pointer;position:relative}

.lock{position:absolute;top:8px;right:8px;background:red;font-size:11px;padding:3px 6px;border-radius:5px}

input,button{padding:10px;margin:5px;border:none;border-radius:6px}

.panel{position:fixed;inset:0;background:#000000ee;display:none;padding:20px;overflow:auto}
</style>
</head>

<body>

<header>
<div>📺 BTECH-TV ULTRA PRO MAX V2</div>
<div>
<button onclick="openAdmin()">Admin</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<!-- LOGIN -->
<div id="loginBox" style="padding:20px">
<h2>🔐 Login / Register</h2>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<div class="sidebar">
<h3>👤 User</h3>
<p id="userInfo"></p>

<h3>💳 Plan</h3>
<p id="planInfo"></p>

<button onclick="upgrade()">💎 Upgrade (Paystack Mock)</button>

<hr>

<h3>Controls</h3>
<button onclick="lockAll()">Lock All</button>
<button onclick="unlockAll()">Unlock All</button>
</div>

<div class="main">

<div class="video">
<video id="video" controls autoplay style="width:100%;height:100%"></video>
</div>

<div class="list" id="list"></div>

</div>

</div>

</div>

<!-- ADMIN -->
<div class="panel" id="admin">
<h2>🧑‍💼 ADMIN DASHBOARD</h2>
<button onclick="closeAdmin()">Close</button>

<h3>📊 Analytics</h3>
<p id="analytics"></p>

<h3>📺 Channel Control</h3>
<div id="adminList"></div>
</div>

<script>

let user=null;
let role="free";
let expiry=0;

let unlocked=JSON.parse(localStorage.getItem("unlock")||"{}");
let users=JSON.parse(localStorage.getItem("users")||"{}");
let stats=JSON.parse(localStorage.getItem("stats")||"{}");

let channels=[
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"CNN Live",url:"https://test-streams.mux.dev/test.m3u8"},
{name:"Sky Sports",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Al Jazeera",url:"https://test-streams.mux.dev/test.m3u8"}
];

function save(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("unlock",JSON.stringify(unlocked));
localStorage.setItem("stats",JSON.stringify(stats));
}

/* LOGIN */
function register(){
let e=email.value;
let p=pass.value;
users[e]={pass:p,role:"free",expiry:Date.now()+86400000};
save();
alert("Registered");
}

function login(){
let e=email.value;
let p=pass.value;

if(!users[e]||users[e].pass!==p){
alert("Wrong login");return;
}

user=e;
role=users[e].role;
expiry=users[e].expiry;

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

render();
}

/* UPGRADE (PAYSTACK MOCK) */
function upgrade(){
if(!user)return;

alert("💳 Redirecting to Paystack... (mock)");

setTimeout(()=>{
users[user].role="premium";
users[user].expiry=Date.now()+7*86400000;
role="premium";
save();
render();
alert("✅ Premium Activated");
},1500);
}

/* CHANNEL LOCK */
function lockAll(){
unlocked={};
save();
render();
}

function unlockAll(){
channels.forEach((c,i)=>unlocked[i]=true);
save();
render();
}

/* PLAY */
function play(url){
let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
}else v.src=url;

stats.plays=(stats.plays||0)+1;
save();
}

/* RENDER */
function render(){

document.getElementById("userInfo").innerText=user;
document.getElementById("planInfo").innerText=role.toUpperCase()+" EXP:"+new Date(expiry).toLocaleDateString();

let box=document.getElementById("list");
box.innerHTML="";

channels.forEach((c,i)=>{

let locked = role==="free" && !unlocked[i];

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
${locked?'<div class="lock">LOCK</div>':''}
<b>${c.name}</b>
`;

div.onclick=()=>{

if(locked){
alert("Upgrade Required 🔒");
return;
}

play(c.url);
};

box.appendChild(div);
});

updateAdmin();
}

/* ADMIN */
function openAdmin(){
document.getElementById("admin").style.display="block";
updateAdmin();
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function updateAdmin(){

document.getElementById("analytics").innerText=
"Total Users: "+Object.keys(users).length+
" | Plays: "+(stats.plays||0);

let box=document.getElementById("adminList");
box.innerHTML="";

channels.forEach((c,i)=>{

let div=document.createElement("div");
div.style="padding:10px;background:#111;margin:5px";

div.innerHTML=`
${c.name}
<button onclick="toggle(${i})">
${unlocked[i]?"UNLOCK":"LOCK"}
</button>
`;

box.appendChild(div);

});
}

function toggle(i){
if(unlocked[i]) delete unlocked[i];
else unlocked[i]=true;
save();
updateAdmin();
render();
}

/* LOGOUT */
function logout(){
location.reload();
}

</script>

</body>
</html>
