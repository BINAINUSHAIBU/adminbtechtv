<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRO MULTIPLAYER QUIZ SYSTEM</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--text:#fff;
--good:#16a34a;
--bad:#dc2626;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text)}

button{cursor:pointer;border:none;padding:10px;border-radius:8px;background:var(--accent);font-weight:bold}
input{padding:10px;width:100%;margin:5px 0;border-radius:8px;border:none;background:#0f1628;color:white}

.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:220px;background:#0f1628;padding:10px
}
.menu{padding:10px;margin:5px 0;background:var(--card);border-radius:8px;cursor:pointer}

/* MAIN */
.main{flex:1;padding:10px;overflow:auto}

/* TOP */
.top{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:10px}

/* CARD */
.card{background:var(--card);padding:10px;margin:10px;border-radius:10px}

/* QUIZ */
.option{padding:10px;background:#0f1628;margin:5px;border-radius:8px;cursor:pointer}
.option:hover{background:#1f2a44}

/* PROFILE */
.profile{background:var(--card);padding:15px;border-radius:10px}

/* TABLE */
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #2a3550}

</style>
</head>

<body>

<div class="top">
<h2>🎯 PRO MULTIPLAYER QUIZ</h2>
<div id="userBox"></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="menu" onclick="showQuiz()">🧠 Quiz</div>
<div class="menu" onclick="showProfile()">👤 Profile</div>
<div class="menu" onclick="showLeaderboard()">🏆 Leaderboard</div>
<div class="menu" onclick="showAdmin()">⚙ Admin</div>
<div class="menu" onclick="resetAll()">🔄 Reset System</div>
</div>

<!-- MAIN -->
<div class="main" id="main"></div>

</div>

<script>

/* ======================
DATA
====================== */

let user=null;
let index=0;
let score=0;
let startTime=0;
let timer;

let users=JSON.parse(localStorage.getItem("users")||"{}");
let board=JSON.parse(localStorage.getItem("board")||"[]");

/* ======================
1000 QUESTION BANK
====================== */

let questions=[];

for(let i=1;i<=1000;i++){
questions.push({
q:`Question ${i}: What is ${i} + 1 ?`,
options:[`${i}`,`${i+1}`,`${i+2}`,`${i+3}`],
answer:`${i+1}`
});
}

/* ======================
LOGIN (AUTO SIMPLE)
====================== */

function login(name){
user=name;

if(!users[name]){
users[name]={
name,
score:0,
time:0
};
}

document.getElementById("userBox").innerHTML=
`👤 ${name}`;

showQuiz();
}

/* ======================
QUIZ
====================== */

function showQuiz(){
index=0;
score=0;
startTime=Date.now();
renderQ();
}

function renderQ(){

let q=questions[index];
let timeLeft=15;

clearInterval(timer);

timer=setInterval(()=>{
timeLeft--;
if(timeLeft<=0) next();
document.getElementById("t").innerText=timeLeft;
},1000);

document.getElementById("main").innerHTML=`
<div class="card">

<h3>⏱ Time: <span id="t">15</span>s</h3>
<h2>${q.q}</h2>

${q.options.map(o=>
`<div class="option" onclick="answer('${o}')">${o}</div>`
).join("")}

</div>
`;
}

function answer(val){
if(val===questions[index].answer){
score++;
}
next();
}

function next(){
index++;

if(index>=questions.length){
finish();
return;
}

renderQ();
}

function finish(){

let totalTime=Math.floor((Date.now()-startTime)/1000);

users[user].score=score;
users[user].time=totalTime;

board.push({
name:user,
score,
time:totalTime
});

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("board",JSON.stringify(board));

document.getElementById("main").innerHTML=`
<div class="card">
<h2>🏁 Finished</h2>
<h3>Score: ${score}</h3>
<h3>Time: ${totalTime}s</h3>
</div>
`;
}

/* ======================
LEADERBOARD
====================== */

function showLeaderboard(){

board.sort((a,b)=>b.score-a.score || a.time-b.time);

document.getElementById("main").innerHTML=`
<div class="card">
<h2>🏆 Leaderboard</h2>

<table>
<tr><th>User</th><th>Score</th><th>Time</th></tr>
${board.map(b=>`
<tr>
<td>${b.name}</td>
<td>${b.score}</td>
<td>${b.time}s</td>
</tr>
`).join("")}
</table>

</div>
`;
}

/* ======================
PROFILE
====================== */

function showProfile(){

let u=users[user];

document.getElementById("main").innerHTML=`
<div class="profile">

<h2>👤 Profile</h2>
<p>Name: ${u.name}</p>
<p>Score: ${u.score}</p>
<p>Best Time: ${u.time}s</p>

</div>
`;
}

/* ======================
ADMIN
====================== */

function showAdmin(){

document.getElementById("main").innerHTML=`
<div class="card">

<h2>⚙ SUPER ADMIN</h2>

<input id="uname" placeholder="Login User Name">
<button onclick="login(uname.value)">Login User</button>

<hr>

<h3>Users</h3>

${Object.keys(users).map(u=>`
<p>👤 ${u} - Score: ${users[u].score}</p>
`).join("")}

</div>
`;
}

/* ======================
RESET
====================== */

function resetAll(){
localStorage.clear();
location.reload();
}

/* ======================
AUTO LOGIN DEMO
====================== */

login("Player1");

</script>

</body>
</html>
