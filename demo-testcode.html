{name:"TVC News",category:"News",type:"Pay To View",lock:"Locked"}
];

/* add demo stream so player ALWAYS works */
function attachStreams(){
manualChannels.forEach(c=>{
c.url = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
});
all = [...manualChannels];
filtered = [...all];
render();
updateCount();
}

/* =========================
   LOAD M3U (OPTIONAL)
========================= */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(cat){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`);
}

async function loadM3U(url){
const res = await fetch(url);
const text = await res.text();

all = [];

text.split("\n").forEach((line, i, arr)=>{
if(line.startsWith("#EXTINF")){
let name = line.split(",").pop();
let url = arr[i+1];

if(url && url.startsWith("http")){
all.push({
name,
url,
category:"Live",
type:"Free",
lock:"Unlocked"
});
}
}
});

filtered = [...all];
updateCount();
render();
}

/* =========================
   SEARCH
========================= */
function searchChannels(){
let v = document.getElementById("search").value.toLowerCase();
filtered = all.filter(c => c.name.toLowerCase().includes(v));
render();
updateCount();
}

/* =========================
   RENDER TABLE
========================= */
function render(){
let t = document.getElementById("tbody");
t.innerHTML = "";

filtered.forEach((c, idx)=>{
let row = document.createElement("tr");

row.innerHTML = `
<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.type}</td>
<td>${c.lock}</td>
<td>
<button onclick="play(${idx})">Play</button>
<button>Lock</button>
<button>Edit</button>
<button>Delete</button>
</td>
`;

t.appendChild(row);
});
}

/* =========================
   PLAY STREAM
========================= */
function play(idx){
let c = filtered[idx];

if(!c.url){
alert("No stream URL");
return;
}

if(hls) hls.destroy();

if(Hls.isSupported()){
hls = new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED, ()=>video.play());
}else{
video.src = c.url;
video.play();
}
}

/* =========================
   ADMIN
========================= */
function openAdmin(){
document.getElementById("admin").style.display="flex";
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function scan(){ alert("Scanning IPTV network..."); }
function boost(){ video.playbackRate = 1.3; }

/* =========================
   COUNT UPDATE
========================= */
function updateCount(){
document.getElementById("count").innerText = filtered.length;
}

/* INIT */
attachStreams();

</script>
