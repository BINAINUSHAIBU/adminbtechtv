<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WORLDTV PRO MAX IPTV MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

/* AUTH */
.auth{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.auth-box{
background:#111827;
padding:20px;
border-radius:10px;
width:320px;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:6px;
background:#0b1220;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
background:#00d4ff;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:300px;
background:#0d1324;
padding:15px;
overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{
font-size:22px;
font-weight:900;
color:#00d4ff;
}

.sub{
font-size:12px;
color:#8ea2d9;
margin-bottom:15px;
}

.menu-title{
color:#00d4ff;
margin:15px 0 10px;
font-size:12px;
}

.nav-btn{
width:100%;
padding:10px;
margin:5px 0;
background:#121c33;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
padding:10px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.search-box input{
padding:10px;
border-radius:8px;
border:none;
background:#101a31;
color:#fff;
width:260px;
}

.live{
background:red;
padding:6px 12px;
border-radius:20px;
}

.timer{
background:#00d4ff;
color:#000;
padding:6px 10px;
border-radius:20px;
margin-left:10px;
font-weight:bold;
}

/* PLAYER */
.player-container{
background:#000;
border-radius:10px;
overflow:hidden;
height:320px;
flex-shrink:0;
}

/* CHANNELS */
.channels{
overflow-y:auto;
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
padding-right:5px;
}

.card{
background:#111a31;
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid #1f355d;
}

/* LOCK SCREEN */
.lock{
position:fixed;
inset:0;
background:rgba(0,0,0,.97);
display:none;
justify-content:center;
align-items:center;
z-index:9998;
text-align:center;
padding:20px;
}

.lock h1{
color:red;
}
</style>
</head>

<body>

<!-- AUTH -->
<div class="auth" id="auth">
<div class="auth-box">
<h3>REGISTER / LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- LOCK -->
<div class="lock" id="lock">
<div>
<h1>⛔ TRIAL EXPIRED</h1>
<p>Your 4-hour trial has ended.</p>
<p>Upgrade to continue watching.</p>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">⏳ Trial Status</div>
<div id="trialInfo">Not active</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">Nigeria</button>
<button class="nav-btn" onclick="load('us')">USA</button>
<button class="nav-btn" onclick="load('uk')">UK</button>
<button class="nav-btn" onclick="load('in')">India</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>

<div style="display:flex;align-items:center;">
<div class="live">🔴 LIVE</div>
<div class="timer" id="timer">04:00:00</div>
</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* =========================
   AUTH SYSTEM
========================= */

let currentUser=null;
let TRIAL_TIME=4*60*60*1000; // 4 hours

function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(!email||!pass) return alert("Fill all fields");

let users=JSON.parse(localStorage.getItem("users")||"{}");

if(users[email]) return alert("User exists");

users[email]={pass};
localStorage.setItem("users",JSON.stringify(users));

alert("Registered! Now login");
}

function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

let users=JSON.parse(localStorage.getItem("users")||"{}");

if(!users[email] || users[email].pass!==pass){
return alert("Invalid login");
}

currentUser=email;

/* START TRIAL */
let data=JSON.parse(localStorage.getItem("trial_"+email)||"{}");

if(!data.start){
data.start=Date.now();
localStorage.setItem("trial_"+email,JSON.stringify(data));
}

document.getElementById("auth").style.display="none";

startTimer();
}

function logout(){
location.reload();
}

/* =========================
   TRIAL TIMER
========================= */

function startTimer(){
setInterval(()=>{
let data=JSON.parse(localStorage.getItem("trial_"+currentUser)||"{}");

let elapsed=Date.now()-data.start;
let remaining=TRIAL_TIME-elapsed;

if(remaining<=0){
document.getElementById("lock").style.display="flex";
video.pause();
return;
}

let h=Math.floor(remaining/3600000);
let m=Math.floor((remaining%3600000)/60000);
let s=Math.floor((remaining%60000)/1000);

document.getElementById("timer").innerText=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

document.getElementById("trialInfo").innerText="Active ✔";

},1000);
}

/* =========================
   IPTV CORE (UNCHANGED)
========================= */

async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

text.split("\n").forEach((line,idx,arr)=>{
if(line.startsWith("#EXTINF")){
let name=line.split(",").pop();
let url=arr[idx+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerText=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* INIT */
load("ng");

</script>

</body>
</html>
