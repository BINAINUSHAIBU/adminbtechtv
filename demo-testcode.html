<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global IPTV Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:#fff;
}

header{
padding:15px;
background:#11182b;
display:flex;
justify-content:space-between;
align-items:center;
}

h1{font-size:18px;}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:250px;
background:#0f1626;
padding:10px;
overflow-y:auto;
}

.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
background:#1c2742;
color:#fff;
border:none;
cursor:pointer;
border-radius:6px;
}

.sidebar button:hover{
background:#2a3b66;
}

.main{
flex:1;
padding:20px;
overflow-y:auto;
}

.card{
background:#11182b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

video{
width:100%;
max-height:400px;
background:#000;
margin-top:10px;
border-radius:10px;
}

.search{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<header>
<h1>🌍 Global IPTV Dashboard</h1>
<div>Live Sports • Movies • TV</div>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<button onclick="loadChannels()">📺 Channels</button>
<button onclick="loadSports()">🏆 Sports</button>
<button onclick="loadMovies()">🎬 Movies</button>
<button onclick="loadLiveMatches()">⚽ Live Matches</button>

</div>

<!-- MAIN -->
<div class="main">

<input class="search" placeholder="Search channels..." onkeyup="searchChannel(this.value)">

<div id="content"></div>

<video id="player" controls></video>

</div>
</div>

<script>

const API = "https://api.globaliptv.com/v1";

let channelsData = [];

// LOAD CHANNELS
async function loadChannels(){
let res = await fetch(API + "/channels");
channelsData = await res.json();
render(channelsData);
}

// SEARCH
function searchChannel(value){
let filtered = channelsData.filter(c =>
c.name.toLowerCase().includes(value.toLowerCase())
);
render(filtered);
}

// RENDER CHANNELS
function render(data){
let html = "";
data.forEach(c=>{
html += `
<div class="card" onclick="playStream('${c.id}')">
<h3>${c.name}</h3>
<p>${c.category || "General"} • ${c.country || ""}</p>
</div>
`;
});
document.getElementById("content").innerHTML = html;
}

// PLAY STREAM
async function playStream(id){
let res = await fetch(API + "/streams/" + id);
let data = await res.json();

document.getElementById("player").src = data.stream_url;
document.getElementById("player").play();
}

// SPORTS
async function loadSports(){
let res = await fetch(API + "/sports/live");
let data = await res.json();

let html = "<h2>⚽ Live Sports</h2>";

data.forEach(m=>{
html += `
<div class="card">
<h3>${m.home} vs ${m.away}</h3>
<p>${m.league} • ${m.status}</p>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// MOVIES
async function loadMovies(){
let res = await fetch(API + "/movies");
let data = await res.json();

let html = "<h2>🎬 Movies</h2>";

data.forEach(m=>{
html += `
<div class="card">
<h3>${m.title}</h3>
<p>${m.year || ""}</p>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// LIVE MATCHES
async function loadLiveMatches(){
let res = await fetch(API + "/sports/matches");
let data = await res.json();

let html = "<h2>🏆 Live Matches</h2>";

data.forEach(m=>{
html += `
<div class="card">
<h3>${m.home} vs ${m.away}</h3>
<p>${m.status} • ${m.minute || ""}</p>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// AUTO LOAD
loadChannels();

</script>

</body>
</html>
