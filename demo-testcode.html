<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 ULTIMATE PRO MAX 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0a0a0f;
--panel:#111827;
--card:#1b1f2e;
--accent:#00bfff;
--good:#22c55e;
--bad:#ef4444;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

/* LOGIN OVERLAY */
#lock{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
}

#lock input{
padding:12px;
margin:8px;
border:none;
border-radius:8px;
width:220px;
text-align:center;
}

#lock button{
padding:10px 16px;
background:var(--accent);
border:none;
border-radius:8px;
cursor:pointer;
}

/* TOP */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar h2{color:var(--accent)}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:220px;
background:#0f172a;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

/* NETFLIX GRID */
.grid{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
padding:12px;
}

.card{
background:var(--card);
padding:10px;
border-radius:12px;
transition:.3s;
cursor:pointer;
}

.card:hover{transform:scale(1.03);border:1px solid var(--accent)}

.badge{font-size:11px;padding:4px 8px;border-radius:20px}
.good{background:var(--good)}
.bad{background:var(--bad)}
.premium{background:orange;color:#000}

/* PLAYER */
.player{
position:fixed;
right:0;
top:60px;
width:320px;
height:calc(100vh - 60px);
background:#000;
display:flex;
flex-direction:column;
}

video{width:100%;height:180px;background:#000}

.list{overflow:auto;flex:1;padding:8px}

.item{
padding:6px;
background:#1f2937;
margin-bottom:6px;
border-radius:8px;
cursor:pointer;
}

.item:hover{background:#374151}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="lock">
<h2>🔐 ULTIMATE PRO MAX 2026</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">ENTER ADMIN</button>
<p id="msg"></p>
</div>

<div class="topbar">
<h2>🚀 PRO MAX 2026</h2>
<input placeholder="Search..." oninput="search(this.value)">
</div>

<div class="container">

<div class="sidebar">
<button onclick="setMode('all')">All Channels</button>
<button onclick="setMode('ai')">🤖 AI MODE</button>
<button onclick="setMode('fav')">⭐ Favorites</button>
</div>

<div class="main">
<div class="grid" id="grid"></div>
</div>

</div>

<div class="player">
<video id="vid" controls></video>
<div class="list" id="list"></div>
</div>

<script>

/* 🔐 ADMIN ROLES + SIMPLE ENCRYPT (demo) */
const ADMIN_USER="admin";
const ADMIN_PASS=btoa("1234"); // encrypted demo

function login(){
let u=user.value;
let p=btoa(pass.value);

if(u===ADMIN_USER && p===ADMIN_PASS){
lock.style.display="none";
init();
}else{
msg.innerText="❌ Access Denied";
}
}

/* STATE */
let all=[],filtered=[],mode="all",fav={};

/* 🤖 AI BOOST SCORE */
function score(c){
let s=0;
if(c.alive) s+=10;
if(c.views>50000) s+=5;
if(c.premium) s+=3;
return s;
}

/* LOAD STREAMS */
function init(){
for(let i=1;i<=60;i++){
all.push({
id:i,
name:"Channel "+i,
url:"https://test-streams.mux.dev/test_001/stream.m3u8",
views:Math.floor(Math.random()*100000),
premium:i%9===0,
alive:true
});
}
render();
renderList();
}

/* AI MODE */
function aiSort(list){
return list.sort((a,b)=>score(b)-score(a));
}

/* FILTER */
function setMode(m){
mode=m;
render();
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render(true);
}

/* RENDER GRID */
function render(skip=false){

let list=all;

if(mode==="fav") list=list.filter(c=>fav[c.id]);
if(mode==="ai") list=aiSort([...list]);

if(skip && filtered.length) list=filtered;

grid.innerHTML="";

list.forEach(c=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h4>📺 ${c.name}</h4>
<p>${c.views} views</p>
<span class="badge ${c.premium?'premium':'good'}">
${c.premium?'VIP':'FREE'}
</span>
<button onclick="play(${c.id})">▶ Play</button>
`;

grid.appendChild(div);
});

}

/* PLAY */
function play(id){
let c=all.find(x=>x.id===id);
let v=document.getElementById("vid");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else{
v.src=c.url;
}

v.play();
renderList();
}

/* RIGHT LIST */
function renderList(){
list.innerHTML="";
all.forEach(c=>{
let d=document.createElement("div");
d.className="item";
d.innerHTML="📺 "+c.name;
d.onclick=()=>play(c.id);
list.appendChild(d);
});
}

</script>

</body>
</html>
