```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WORLDTV LIVE PLATFORM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
overflow:hidden;
height:100vh;
}

/* ===========================
HEADER
=========================== */

.header{
height:60px;
background:#111827;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #222;
}

/* ===========================
MAIN LAYOUT
=========================== */

.main{
display:flex;
height:calc(100vh - 60px);
}

/* ===========================
CHANNEL LIST
=========================== */

.channels{
width:320px;
background:#0f172a;
overflow-y:auto;
padding:10px;
border-right:1px solid #222;
}

.channel{
padding:12px;
margin-bottom:8px;
background:#1e293b;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:#334155;
transform:scale(1.02);
}

.channel.active{
background:#ef4444;
}

/* ===========================
CENTER PLAYER
=========================== */

.center-area{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
}

.live-monitor{
position:fixed;
left:55%;
top:50%;
transform:translate(-50%,-50%);
width:900px;
height:500px;
background:#000;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 50px rgba(255,0,0,.4);
z-index:999;
}

.live-monitor video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* LIVE BADGE */

.live-badge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:8px 15px;
border-radius:30px;
font-weight:bold;
z-index:1000;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:.4;
}
}

/* ===========================
RIGHT PANEL
=========================== */

.info-panel{
width:300px;
background:#0f172a;
overflow-y:auto;
padding:10px;
border-left:1px solid #222;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:10px;
border-radius:12px;
}

/* SCROLL BAR */

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#ef4444;
border-radius:20px;
}

</style>
</head>

<body>

<div class="header">
🌍 WORLDTV LIVE STREAMING PLATFORM
</div>

<div class="main">

<!-- LEFT CHANNELS -->

<div class="channels" id="channels">

<div class="channel active"
onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',this)">
CNN LIVE
</div>

<div class="channel"
onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',this)">
BBC NEWS
</div>

<div class="channel"
onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',this)">
AL JAZEERA
</div>

<div class="channel"
onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',this)">
SKY NEWS
</div>

<div class="channel"
onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',this)">
ESPN SPORTS
</div>

<!-- Add all M3U channels here -->

</div>

<!-- CENTER PLAYER -->

<div class="center-area">

<div class="live-monitor">

<div class="live-badge">
🔴 LIVE STREAMING
</div>

<video
id="video"
controls
autoplay
playsinline>
</video>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="info-panel">

<div class="card">
<h3>Now Playing</h3>
<p id="channelName">
CNN LIVE
</p>
</div>

<div class="card">
<h3>Statistics</h3>
<p>Online Users: 12,500</p>
<p>Streams Active: 1,200</p>
</div>

<div class="card">
<h3>Favorites</h3>
<p>BBC</p>
<p>CNN</p>
<p>ESPN</p>
</div>

<div class="card">
<h3>Recent Channels</h3>
<p>Sky News</p>
<p>Al Jazeera</p>
</div>

</div>

</div>

<script>

const video =
document.getElementById("video");

function playChannel(url,el){

document.querySelectorAll('.channel')
.forEach(c=>c.classList.remove('active'));

el.classList.add('active');

document.getElementById("channelName")
.innerText = el.innerText;

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}

playChannel(
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
document.querySelector(".channel")
);

</script>

</body>
</html>
```
