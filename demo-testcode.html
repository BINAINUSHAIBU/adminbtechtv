<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLOBAL CHURCH NETWORK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1d;
color:white;
}

header{
padding:15px;
background:#111a33;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:240px;
background:#0f1730;
padding:10px;
overflow-y:auto;
}

.sidebar button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
background:#1d2a55;
color:white;
cursor:pointer;
border-radius:6px;
}

.sidebar button:hover{
background:#2c3f7a;
}

.main{
flex:1;
padding:15px;
overflow-y:auto;
}

.card{
background:#141f3d;
padding:12px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
}

.card:hover{
background:#1d2a55;
}

video{
width:100%;
margin-top:10px;
border-radius:10px;
background:black;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:6px;
border:none;
}

.badge{
padding:3px 8px;
background:#2c3f7a;
border-radius:5px;
font-size:12px;
}
</style>
</head>

<body>

<header>
<h2>⛪ GLOBAL CHURCH NETWORK</h2>
<div>Live Worship • Sermons • Programs</div>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<button onclick="loadChurches()">⛪ Churches</button>
<button onclick="loadChannels()">📺 Church Channels</button>
<button onclick="loadLivePrograms()">🔴 Live Programs</button>
<button onclick="loadAdmin()">⚙ Super Admin</button>

</div>

<!-- MAIN -->
<div class="main">

<input placeholder="Search churches or channels..." onkeyup="search(this.value)">

<div id="content"></div>

<video id="player" controls></video>

</div>
</div>

<script>

////////////////////////////////////////////////////
// DATABASE (MULTI CHURCH SYSTEM)
////////////////////////////////////////////////////

const DB = {
churches:[
{
id:1,
name:"Redeemed Christian Church",
location:"Nigeria",
channels:[
{name:"RCCG Live Service",stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"RCCG Youth Program",stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
]
},
{
id:2,
name:"Winner's Chapel",
location:"Nigeria",
channels:[
{name:"Winners Sunday Service",stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
]
}
],

livePrograms:[
{
church:"Redeemed Christian Church",
title:"Sunday Worship Live",
status:"LIVE",
time:"10:00 AM"
},
{
church:"Winner's Chapel",
title:"Faith Service",
status:"UPCOMING",
time:"9:00 AM"
}
]
};

let currentView = [];

////////////////////////////////////////////////////
// LOAD CHURCHES
////////////////////////////////////////////////////

function loadChurches(){
let html = "<h3>⛪ Churches</h3>";

DB.churches.forEach(c=>{
html += `
<div class="card" onclick="openChurch(${c.id})">
<strong>${c.name}</strong><br>
<span class="badge">${c.location}</span>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// OPEN CHURCH CHANNELS
////////////////////////////////////////////////////

function openChurch(id){
let church = DB.churches.find(c=>c.id==id);

let html = `<h3>📺 ${church.name} Channels</h3>`;

church.channels.forEach(ch=>{
html += `
<div class="card" onclick="play('${ch.stream}')">
🎥 ${ch.name}
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// PLAY STREAM
////////////////////////////////////////////////////

function play(url){
document.getElementById("player").src = url;
document.getElementById("player").play();
}

////////////////////////////////////////////////////
// LIVE PROGRAMS
////////////////////////////////////////////////////

function loadLivePrograms(){
let html = "<h3>🔴 Live Church Programs</h3>";

DB.livePrograms.forEach(p=>{
html += `
<div class="card">
<strong>${p.title}</strong><br>
${p.church}<br>
<span class="badge">${p.status}</span> - ${p.time}
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// CHANNELS VIEW (ALL CHURCH CHANNELS)
////////////////////////////////////////////////////

function loadChannels(){
let html = "<h3>📺 All Church Channels</h3>";

DB.churches.forEach(c=>{
c.channels.forEach(ch=>{
html += `
<div class="card" onclick="play('${ch.stream}')">
${ch.name} <br><span class="badge">${c.name}</span>
</div>
`;
});
});

document.getElementById("content").innerHTML = html;
}

////////////////////////////////////////////////////
// SUPER ADMIN PANEL
////////////////////////////////////////////////////

function loadAdmin(){
document.getElementById("content").innerHTML = `
<h3>⚙ Super Admin Dashboard</h3>

<div class="card">⛪ Total Churches: ${DB.churches.length}</div>
<div class="card">📺 Total Channels: ${DB.churches.reduce((a,b)=>a+b.channels.length,0)}</div>
<div class="card">🔴 Live Programs: ${DB.livePrograms.length}</div>

<button onclick="addChurch()">+ Add Church</button>
<button onclick="addProgram()">+ Add Live Program</button>
`;
}

////////////////////////////////////////////////////
// ADD CHURCH
////////////////////////////////////////////////////

function addChurch(){
let name = prompt("Church Name");
let location = prompt("Location");

if(name){
DB.churches.push({
id:Date.now(),
name,
location,
channels:[]
});
alert("Church Added");
loadAdmin();
}
}

////////////////////////////////////////////////////
// ADD LIVE PROGRAM
////////////////////////////////////////////////////

function addProgram(){
let church = prompt("Church Name");
let title = prompt("Program Title");

DB.livePrograms.push({
church,
title,
status:"LIVE",
time:"NOW"
});

alert("Program Added");
loadAdmin();
}

////////////////////////////////////////////////////
// SEARCH SYSTEM
////////////////////////////////////////////////////

function search(q){
q = q.toLowerCase();

let churches = DB.churches.filter(c =>
c.name.toLowerCase().includes(q)
);

let html = "<h3>🔍 Search Results</h3>";

churches.forEach(c=>{
html += `
<div class="card" onclick="openChurch(${c.id})">
${c.name} - ${c.location}
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// INIT
loadChurches();

</script>

</body>
</html>
