<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<meta name="theme-color" content="#0b0f1a"/>

<title>BTECH-TV WORLD</title>

<link rel="preconnect" href="https://iptv-org.github.io">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
--glass:rgba(255,255,255,.03);
--border:rgba(255,255,255,.05);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
overflow:hidden;
scroll-behavior:smooth;
}

body{
display:flex;
flex-direction:column;
}

/* =========================
TOPBAR
========================= */

.topbar{
min-height:70px;
background:rgba(17,24,39,.96);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
border-bottom:1px solid var(--border);
gap:15px;
flex-wrap:wrap;
z-index:20;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
letter-spacing:.5px;
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
margin-left:auto;
scrollbar-width:none;
}

.top-buttons::-webkit-scrollbar{
display:none;
}

.top-buttons button{
padding:10px 16px;
background:var(--card);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:13px;
transition:.25s;
white-space:nowrap;
flex-shrink:0;
font-weight:600;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
transform:translateY(-2px);
}

/* =========================
LAYOUT
========================= */

.container{
flex:1;
display:flex;
overflow:hidden;
min-height:0;
}

.sidebar{
width:310px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid var(--border);
-webkit-overflow-scrolling:touch;
scrollbar-width:thin;
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
transition:.25s;
font-size:14px;
border:1px solid transparent;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
border-color:var(--accent);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
min-width:0;
}

/* =========================
PLAYER
========================= */

.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:5;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.92);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
text-align:center;
padding:20px;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
animation:spin 2s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.overlay p{
color:var(--muted);
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
flex-wrap:wrap;
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
color:var(--muted);
font-size:13px;
}

.clock{
font-size:12px;
color:var(--muted);
margin-top:5px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
background:var(--card);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.25s;
font-weight:600;
}

.controls button:hover{
background:var(--hover);
}

/* =========================
SEARCH
========================= */

.stats{
padding:8px 15px;
background:#0f172a;
font-size:12px;
color:var(--muted);
border-bottom:1px solid var(--border);
}

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
min-height:48px;
outline:none;
border:1px solid transparent;
}

.search-box input:focus,
.search-box select:focus{
border-color:var(--accent);
}

.search-box input{
flex:1;
min-width:220px;
}

/* =========================
CHANNELS
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
-webkit-overflow-scrolling:touch;
scrollbar-width:thin;
}

.channel{
background:linear-gradient(
180deg,
rgba(255,255,255,.03),
rgba(255,255,255,.01)
);
backdrop-filter:blur(10px);
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.25s;
border:1px solid transparent;
gap:10px;
}

.channel:hover{
background:var(--hover);
transform:translateY(-2px);
border-color:var(--accent);
}

.channel.active{
border-color:var(--accent);
background:#00bfff18;
box-shadow:0 0 0 1px #00bfff55;
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
min-width:0;
}

.left img{
width:60px;
height:60px;
border-radius:12px;
object-fit:cover;
background:black;
flex-shrink:0;
}

.info{
overflow:hidden;
min-width:0;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
display:block;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.status{
display:flex;
flex-direction:column;
gap:6px;
align-items:flex-end;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.country{
background:#2563eb;
}

.dead{
background:var(--danger);
}

.fav{
font-size:20px;
cursor:pointer;
transition:.2s;
}

.fav:hover{
transform:scale(1.2);
}

.fav.on{
color:gold;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:1000px){

.sidebar{
width:240px;
}

.player{
height:300px;
}

}

@media(max-width:900px){

html,
body{
overflow:auto;
}

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:260px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.player{
height:250px;
}

.channels{
grid-template-columns:1fr;
padding-bottom:120px;
}

.search-box{
flex-direction:column;
}

.search-box input,
.search-box select{
width:100%;
}

.controls{
width:100%;
}

.controls button{
flex:1;
min-width:120px;
}

}

@media(max-width:600px){

.logo{
font-size:20px;
}

.player{
height:220px;
}

.overlay h1{
font-size:45px;
}

.channel{
padding:12px;
}

.left img{
width:50px;
height:50px;
}

}

@media(max-width:380px){

.player{
height:200px;
}

.logo{
font-size:18px;
}

.top-buttons button{
font-size:12px;
padding:9px 12px;
}

}

@media (max-height:500px) and (orientation:landscape){

.sidebar{
display:none;
}

.player{
height:70vh;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="filterType('country',this)">
🌍 Countries
</button>

<button onclick="filterType('category',this)">
🎬 Categories
</button>

<button onclick="filterType('language',this)">
🗣 Languages
</button>

<button onclick="toggleTheme()">
Theme
</button>

<button onclick="toggleFullscreen()">
⛶ Fullscreen
</button>

</div>

</div>

<div class="container">

<div class="sidebar">

<!-- KEEP ALL YOUR ORIGINAL COUNTRIES / CATEGORIES / LANGUAGES HERE -->
<!-- NO CHANNELS REMOVED -->

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u','Nigeria')">🇳🇬 Nigeria</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/index.country.m3u','World IPTV')">
🌐 World IPTV
</div>

<h3>🎬 Categories</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u','News')">📰 News</div>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u','Sports')">⚽ Sports</div>

<h3>➕ Extra Feeds</h3>

<div class="cat" onclick="loadExtraPlaylists()">
🚀 Load Global Feeds
</div>

</div>

<div class="main">

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
preload="metadata"
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p id="overlayText">
Loading IPTV Channels...
</p>

</div>

</div>

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global BTECH-TV Streaming
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">◀ Prev</button>

<button onclick="nextChannel()">Next ▶</button>

<button onclick="togglePiP()">📺 PiP</button>

<button onclick="shareChannel()">🔗 Share</button>

<button id="autoSkipBtn" onclick="toggleAutoSkip()">
⏭ Auto Skip
</button>

</div>

</div>

<div class="stats" id="stats">
0 Channels Loaded
</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search BTECH-TV channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">

<option value="az">Sort A-Z</option>

<option value="za">Sort Z-A</option>

</select>

</div>

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let autoSkipOn=true;
let dark=true;
let activeTab='all';

const CACHE_NAME='btech_cache_v2';

let favs=
JSON.parse(localStorage.getItem('atv_favs') || '{}');

let recent=
JSON.parse(localStorage.getItem('atv_recent') || '[]');

let deadCh={};
let aliveCh={};

const video=document.getElementById('video');

const extraFeeds=[

'https://iptv-org.github.io/iptv/index.m3u',
'https://iptv-org.github.io/iptv/index.country.m3u',
'https://iptv-org.github.io/iptv/index.category.m3u',
'https://iptv-org.github.io/iptv/index.language.m3u',
'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',
'https://raw.githubusercontent.com/freecasthub/public-iptv/main/playlist.m3u'

];

/* CLOCK */

function tick(){

document.getElementById('clock').innerText=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(tick,1000);

tick();

/* FLAG */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* LOAD PLAYLIST */

async function loadPlaylist(url,group){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'Loading '+group+' channels...';

all=[];

try{

const res=await fetch(url,{
cache:'force-cache'
});

const text=await res.text();

parseM3U(text,group);

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}catch(err){

alert('Failed to load playlist');

console.error(err);

}

}

/* PARSE */

function parseM3U(data,group){

const lines=data.split('\n');

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith('#EXTINF')){

const info=lines[i];
const url=lines[i+1];

if(!url || !url.startsWith('http')){
continue;
}

const name=info.split(',').pop();

const logoMatch=
info.match(/tvg-logo="(.*?)"/);

const countryMatch=
info.match(/tvg-country="(.*?)"/);

all.push({

id:all.length+1,
name:name.trim(),
url:url.trim(),

logo:
logoMatch
? logoMatch[1]
: 'https://via.placeholder.com/60',

country:
countryMatch
? countryMatch[1]
: '',

group:group,
type:'free'

});

}

}

}

/* REMOVE DUPLICATES */

function removeDuplicates(){

const seen=new Set();

all=all.filter(ch=>{

const key=ch.name+'_'+ch.url;

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

/* EXTRA PLAYLISTS */

async function loadExtraPlaylists(){

document.getElementById('overlay').style.display='flex';

document.getElementById('overlayText').innerText=
'Loading Global BTECH-TV Feeds...';

all=[];

for(let url of extraFeeds){

try{

const res=await fetch(url,{
cache:'force-cache'
});

const text=await res.text();

parseM3U(text,'Global Feed');

}catch(err){

console.log(err);

}

}

removeDuplicates();

filteredChannels=[...all];

renderChannels();

updateStats();

document.getElementById('overlay').style.display='none';

}

/* RENDER */

function renderChannels(){

const box=
document.getElementById('channelList');

box.innerHTML='';

const fragment=
document.createDocumentFragment();

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
loading="lazy"
decoding="async"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
${flag(c.country)} ${c.name}
</h4>

<small>
${c.group}
</small>

</div>

</div>

<div class="status">

<span class="badge free">
FREE
</span>

<span class="badge ${
deadCh[c.id]
? 'dead'
: 'country'
}">
${deadCh[c.id] ? 'OFF':'LIVE'}
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

fragment.appendChild(div);

});

box.appendChild(fragment);

}

/* PLAY */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

if(currentHls){
currentHls.destroy();
}

video.pause();

video.removeAttribute('src');

video.load();

if(Hls.isSupported()){

currentHls=new Hls({

enableWorker:true,
lowLatencyMode:true,
backBufferLength:30,
maxBufferLength:10,
maxMaxBufferLength:15,
liveSyncDuration:3,
liveMaxLatencyDuration:5,
capLevelToPlayerSize:true,
manifestLoadingTimeOut:15000,
fragLoadingTimeOut:15000

});

currentHls.loadSource(channel.url);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play().catch(()=>{});

aliveCh[channel.id]=1;

delete deadCh[channel.id];

renderChannels();

}
);

currentHls.on(
Hls.Events.ERROR,
function(event,data){

if(data.fatal){

deadCh[channel.id]=1;

renderChannels();

if(autoSkipOn){
nextChannel();
}

}

}
);

}else{

video.src=channel.url;

video.play().catch(()=>{});

}

addRecent(channel.id);

renderChannels();

}

/* SEARCH */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value)

||

c.group.toLowerCase().includes(value)

);

renderChannels();

updateStats();

}

/* SORT */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

/* FAVORITES */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'atv_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* RECENT */

function addRecent(id){

recent=recent.filter(r=>r!==id);

recent.unshift(id);

if(recent.length>30){
recent=recent.slice(0,30);
}

localStorage.setItem(
'atv_recent',
JSON.stringify(recent)
);

}

/* TABS */

function setTab(type,btn){

activeTab=type;

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){
filteredChannels=[...all];
}

if(type==='favs'){
filteredChannels=all.filter(c=>favs[c.id]);
}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

updateStats();

}

/* FILTER TYPE */

function filterType(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

}

/* NEXT */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

/* PREV */

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* PIP */

function togglePiP(){

if(document.pictureInPictureElement){

document.exitPictureInPicture();

}else if(document.pictureInPictureEnabled){

video.requestPictureInPicture();

}

}

/* SHARE */

function shareChannel(){

const channel=
filteredChannels[currentIndex];

if(!channel){
return;
}

if(navigator.share){

navigator.share({
title:channel.name,
url:channel.url
});

}else{

navigator.clipboard.writeText(channel.url);

alert('Channel URL copied!');

}

}

/* AUTOSKIP */

function toggleAutoSkip(){

autoSkipOn=!autoSkipOn;

document.getElementById('autoSkipBtn').innerText=
autoSkipOn
? '⏭ Auto Skip'
: '⏭ Skip OFF';

}

/* THEME */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark ? '#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark ? '#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark ? '#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark ? '#ffffff':'#000000'
);

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* STATS */

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length +
' Channels Loaded';

}

/* KEYBOARD */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

if(e.key==='f'){
toggleFullscreen();
}

});

/* START */

loadPlaylist(
'https://iptv-org.github.io/iptv/index.country.m3u',
'World IPTV'
);

</script>

</body>
</html>
