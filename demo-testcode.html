<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV PRO MAX - SUPER ADMIN IPTV SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:320px;
background:#0d1324;
overflow:auto;
padding:15px;
border-right:1px solid #1f2b4d;
}

.logo{
font-size:24px;
font-weight:bold;
color:#00d4ff;
margin-bottom:20px;
}

.section{
margin-bottom:20px;
}

.section h3{
color:#00d4ff;
margin-bottom:10px;
}

.nav-btn{
width:100%;
padding:8px;
margin-bottom:5px;
border:none;
border-radius:6px;
background:#172033;
color:white;
cursor:pointer;
}

.nav-btn:hover{
background:#22304d;
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
background:#0f172a;
padding:15px;
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:20px;
}

.live{
color:red;
}

.player{
height:300px;
background:black;
}

.player video{
width:100%;
height:100%;
}

/* TABLE */

.table-container{
flex:1;
overflow:auto;
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
}

th{
background:#0f172a;
color:#00d4ff;
padding:12px;
position:sticky;
top:0;
}

td{
padding:10px;
border-bottom:1px solid #1f2b4d;
}

tr:hover{
background:#172033;
}

.action{
padding:6px 10px;
border:none;
border-radius:5px;
cursor:pointer;
margin-right:4px;
font-weight:bold;
}

.lock{
background:#f59e0b;
color:white;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

.locked{
color:#ff5555;
font-weight:bold;
}

.unlocked{
color:#00ff88;
font-weight:bold;
}

.loadmore{
width:100%;
margin-top:10px;
padding:12px;
border:none;
border-radius:6px;
background:#00d4ff;
font-weight:bold;
cursor:pointer;
}

.admin-panel{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.8);
}

.admin-box{
background:#111827;
padding:25px;
border-radius:10px;
width:320px;
text-align:center;
}

.admin-box button{
padding:10px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>

<div class="section">
<h3>🌍 Countries</h3>

<button class="nav-btn" onclick="filterCountry('ng')">🇳🇬 Nigeria</button> <button class="nav-btn" onclick="filterCountry('us')">🇺🇸 USA</button> <button class="nav-btn" onclick="filterCountry('uk')">🇬🇧 UK</button> <button class="nav-btn" onclick="filterCountry('in')">🇮🇳 India</button> <button class="nav-btn" onclick="renderChannels()">🌍 All Countries</button>

</div>

<div class="section">
<h3>🎬 Categories</h3>

<button class="nav-btn" onclick="filterCategory('news')">📰 News</button> <button class="nav-btn" onclick="filterCategory('sports')">⚽ Sports</button> <button class="nav-btn" onclick="filterCategory('movies')">🎬 Movies</button> <button class="nav-btn" onclick="filterCategory('music')">🎵 Music</button> <button class="nav-btn" onclick="filterCategory('kids')">👶 Kids</button> <button class="nav-btn" onclick="filterCategory('education')">📚 Education</button> <button class="nav-btn" onclick="renderChannels()">📺 All Categories</button>

</div>

<div class="section">

<h3>🔥 Tools</h3>

<button class="nav-btn" onclick="scan()">📡 Scan</button> <button class="nav-btn" onclick="boost()">⚡ Boost</button> <button class="nav-btn" onclick="repair()">🛠 Repair</button> <button class="nav-btn" onclick="optimize()">🧠 Optimize</button> <button class="nav-btn" onclick="openAdmin()">⚙ Admin</button>

</div>

</div>

<div class="main">

<div class="topbar">
<div>📺 SUPER ADMIN IPTV SYSTEM</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="table-container">

<h2>📺 BTECH-TV PRO MAX - IPTV CHANNEL MANAGEMENT</h2>

<table>

<thead>
<tr>
<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Lock Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="grid"></tbody>

</table>

<button class="loadmore" onclick="loadMore()">
⬇ LOAD MORE CHANNELS
</button>

</div>

</div>

</div>

<div class="admin-panel" id="adminPanel">
<div class="admin-box">

<h2>⚙ SUPER ADMIN PANEL</h2>

<button onclick="scan()">📡 Scan</button> <button onclick="boost()">⚡ Boost</button> <button onclick="repair()">🛠 Repair</button> <button onclick="optimize()">🧠 Optimize</button> <button onclick="openAdmin()">❌ Close</button>

</div>
</div>

<script>

let page=1;

const channels=[

{
name:"Channels TV",
country:"ng",
category:"news",
type:"Pay To View",
lock:"Unlocked",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Bride TV",
country:"ng",
category:"sports",
type:"Free",
lock:"Unlocked",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"LoveWorld UK",
country:"uk",
category:"music",
type:"Pay To View",
lock:"Unlocked",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"Kingsview TV",
country:"ng",
category:"education",
type:"Free",
lock:"Locked",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"LN247",
country:"ng",
category:"news",
type:"Pay To View",
lock:"Locked",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}

];

function renderChannels(list=channels){

let html="";

list.forEach((ch,index)=>{

html+=`
<tr>

<td onclick="playChannel('${ch.url}')"
style="cursor:pointer;color:#00d4ff">
${ch.name}
</td>

<td>${ch.category}</td>
<td>${ch.type}</td>

<td class="${ch.lock==='Locked'
?'locked'
:'unlocked'}">
${ch.lock}
</td>

<td>

<button class="action lock"
onclick="toggleLock(${index})">
${ch.lock==='Locked'
?'Unlock'
:'Lock'}
</button>

<button class="action edit"
onclick="editChannel(${index})">
Edit
</button>

<button class="action delete"
onclick="deleteChannel(${index})">
Delete
</button>

</td>

</tr>
`;

});

document.getElementById("grid").innerHTML=html;

}

function playChannel(url){

const video=
document.getElementById("video");

if(window.hls){
window.hls.destroy();
}

if(Hls.isSupported()){

window.hls=new Hls();

window.hls.loadSource(url);

window.hls.attachMedia(video);

window.hls.on(
Hls.Events.MANIFEST_PARSED,
()=>video.play()
);

}else{

video.src=url;
video.play();

}

}

function filterCountry(code){
renderChannels(
channels.filter(c=>c.country===code)
);
}

function filterCategory(cat){
renderChannels(
channels.filter(c=>c.category===cat)
);
}

function toggleLock(index){

channels[index].lock=
channels[index].lock==="Locked"
?"Unlocked"
:"Locked";

renderChannels();

}

function editChannel(index){

let newName=
prompt(
"Edit Channel Name",
channels[index].name
);

if(newName){
channels[index].name=newName;
renderChannels();
}

}

function deleteChannel(index){

if(confirm("Delete Channel?")){
channels.splice(index,1);
renderChannels();
}

}

function loadMore(){
alert("Loading More Channels...");
}

function scan(){
alert("📡 Channel Scan Complete");
}

function boost(){
alert("⚡ IPTV Boost Activated");
}

function repair(){
alert("🛠 Repair Complete");
}

function optimize(){
alert("🧠 System Optimized");
}

function openAdmin(){

const panel=
document.getElementById("adminPanel");

panel.style.display=
panel.style.display==="flex"
?"none"
:"flex";

}

renderChannels();

</script>

</body>
</html>
