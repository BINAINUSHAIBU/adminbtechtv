<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📺 SUPER ADMIN IPTV ULTRA MAX WORLD</title>

<meta name="theme-color" content="#050816"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--accent:#00d4ff;
--text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* AUTH */
#auth{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
z-index:9999;
}

.auth-box{
background:var(--panel);
padding:25px;
border-radius:12px;
width:320px;
}

.auth-box input{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:6px;
background:var(--accent);
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* TOPBAR */
.topbar{
height:60px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.logo{color:var(--accent);font-weight:bold}

/* LAYOUT */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0d1324;
overflow:auto;
padding:10px;
border-right:1px solid #1d2b4f;
}

.section-title{
margin:10px 0;
color:var(--accent);
font-size:12px;
font-weight:bold;
}

.btn{
width:100%;
padding:8px;
margin:4px 0;
border:none;
border-radius:8px;
background:#121c33;
color:#fff;
cursor:pointer;
text-align:left;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{
height:320px;
background:#000;
position:relative;
}

.player video{
width:100%;
height:100%;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

/* CHANNEL AREA */
.channels{
flex:1;
overflow:auto;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
margin:5px 0;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

/* MODAL */
.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.8);
}

.modal-box{
background:var(--panel);
padding:20px;
border-radius:10px;
width:300px;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h3>Login / Register</h3>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="demo('admin')">Demo Admin</button>
<button onclick="demo('user')">Demo User</button>

</div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="topbar">
<div class="logo">📺 SUPER ADMIN IPTV</div>
<div>
<span id="timer"></span>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="section-title">🌍 COUNTRIES</div>
<div id="countryButtons"></div>

<div class="section-title">🎬 CATEGORIES</div>
<div id="catButtons"></div>

<div class="section-title">🗣 LANGUAGES</div>
<div id="langButtons"></div>

<div class="section-title">🔥 PREMIUM FEATURES</div>
<button class="btn">📡 Scan Streams</button>
<button class="btn">⚡ Boost</button>
<button class="btn">📺 PiP Mode</button>
<button class="btn">🧠 Optimize</button>
<button class="btn">🛠 Repair</button>
<button class="btn">🔒 Lock System</button>
<button class="btn" onclick="openAdmin()">⚙ Admin</button>

<div class="section-title">⚡ QUICK CHANNELS</div>
<button class="btn" onclick="playSample()">BBC News</button>
<button class="btn" onclick="playSample()">Sky Sports</button>
<button class="btn" onclick="playSample()">Movie Channel</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
<div class="overlay" id="overlay">Loading...</div>
</div>

<div class="channels" id="channels"></div>

</div>

</div>

</div>

<!-- ADMIN -->
<div class="modal" id="admin">
<div class="modal-box">
<h3>SUPER ADMIN PANEL</h3>
<button onclick="alert('Scan')">Scan</button>
<button onclick="alert('Boost')">Boost</button>
<button onclick="alert('Repair')">Repair</button>
<button onclick="closeAdmin()">Close</button>
</div>
</div>

<script>

let user=null;
let channels=[];

/* AUTH */
function register(){
localStorage.setItem("u_"+userBox(), JSON.stringify({p:passBox()}));
alert("Registered");
}

function login(){
let u=userBox(), p=passBox();
let d=JSON.parse(localStorage.getItem("u_"+u));
if(d && d.p===p){user=u; start();}
else alert("Invalid login");
}

function demo(t){user=t; start();}

function userBox(){return document.getElementById("user").value}
function passBox(){return document.getElementById("pass").value}

/* START */
function start(){
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
initUI();
generate60Channels();
render();
setInterval(()=>document.getElementById("timer").innerText="LIVE",1000);
}

/* INIT SIDEBAR BUTTONS */
function initUI(){

let countries=[
["ng","Nigeria"],["us","USA"],["uk","UK"],["in","India"],["fr","France"],
["de","Germany"],["br","Brazil"],["za","South Africa"],["ca","Canada"],
["au","Australia"],["jp","Japan"],["kr","South Korea"],["cn","China"],
["es","Spain"],["it","Italy"],["tr","Turkey"],["mx","Mexico"],
["ae","UAE"],["sa","Saudi Arabia"],["eg","Egypt"],["ar","Argentina"],
["pk","Pakistan"],["id","Indonesia"],["ph","Philippines"],["al","Albania"]
];

document.getElementById("countryButtons").innerHTML =
countries.map(c=>`<button class="btn" onclick="load('${c[0]}')">🇳🇬 ${c[1]}</button>`).join("");

let cats=[
["news","📰 News"],["sports","⚽ Sports"],["movies","🎬 Movies"],
["music","🎵 Music"],["kids","👶 Kids"],["comedy","😂 Comedy"],
["documentary","📚 Documentary"],["business","💼 Business"],
["science","🔬 Science"],["travel","✈ Travel"]
];

document.getElementById("catButtons").innerHTML =
cats.map(c=>`<button class="btn" onclick="loadCat('${c[0]}')">${c[1]}</button>`).join("");

let langs=[
["eng","English"],["spa","Spanish"],["ara","Arabic"],
["fra","French"],["hin","Hindi"],["zho","Chinese"],["por","Portuguese"]
];

document.getElementById("langButtons").innerHTML =
langs.map(l=>`<button class="btn">🌍 ${l[1]}</button>`).join("");
}

/* 60 CHANNELS */
function generate60Channels(){
channels=[
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Sky Sports",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Movie Channel",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
];

for(let i=1;i<=60;i++){
channels.push({
name:"BTECH LIVE "+i,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
type:Math.random()>0.5?"Free":"Premium",
status:Math.random()>0.5?"Unlocked":"Locked",
views:Math.floor(Math.random()*999999)
});
}
}

/* RENDER */
function render(){
let box=document.getElementById("channels");
box.innerHTML="";

channels.forEach(c=>{
box.innerHTML+=`
<div class="channel" onclick="play('${c.url}')">
<div>
<b>${c.name}</b><br>
<small>${c.type||"Free"} | ${c.status||"Unlocked"} | 👁 ${c.views||0}</small>
</div>
</div>`;
});
}

/* PLAY */
function play(url){
let v=document.getElementById("video");
document.getElementById("overlay").style.display="flex";

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
h.on(Hls.Events.MANIFEST_PARSED,()=>{
v.play();
document.getElementById("overlay").style.display="none";
});
}
}

/* M3U LOAD */
async function load(code){
let url=`https://iptv-org.github.io/iptv/countries/${code}.m3u`;
let res=await fetch(url);
let text=await res.text();
parseM3U(text);
}

async function loadCat(cat){
let url=`https://iptv-org.github.io/iptv/categories/${cat}.m3u`;
let res=await fetch(url);
let text=await res.text();
parseM3U(text);
}

function parseM3U(text){
channels=[];
text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let u=a[i+1];
if(u && u.startsWith("http")){
channels.push({name,url:u});
}
}
});
render();
}

/* ADMIN */
function openAdmin(){document.getElementById("admin").style.display="flex";}
function closeAdmin(){document.getElementById("admin").style.display="none";}

/* QUICK */
function playSample(){
alert("Loading sample channel...");
}

function logout(){location.reload();}

</script>

</body>
</html>
