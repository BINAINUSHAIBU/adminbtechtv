<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WORLDTV PRO MAX IPTV MERGED 2026 - TRIAL+</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;align-items:center;justify-content:center;z-index:9999;
}

.auth-card{
background:#0d1324;padding:20px;border-radius:10px;width:320px;
border:1px solid #1d2b4f;
}

.auth-card input{
width:100%;padding:10px;margin:5px 0;border:none;border-radius:6px;
background:#101a31;color:#fff;
}

.auth-card button{
width:100%;padding:10px;margin-top:10px;border:none;border-radius:6px;
background:#00d4ff;cursor:pointer;font-weight:bold;
}

/* EXPIRED / UPGRADE */
#blocked{
position:fixed;inset:0;background:#050816;
display:none;align-items:center;justify-content:center;
z-index:99999;text-align:center;padding:20px;
}

.upgrade-box{
background:#0d1324;padding:20px;border-radius:10px;
border:1px solid #1d2b4f;width:320px;
}

.upgrade-box button{
padding:10px;margin-top:10px;width:100%;
border:none;border-radius:6px;background:#00d4ff;
cursor:pointer;font-weight:bold;
}

/* SIDEBAR */
.sidebar{
width:280px;background:#0d1324;padding:15px;overflow-y:auto;
border-right:1px solid #1d2b4f;
}

.logo{font-size:22px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:15px;}

.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}

.nav-btn{
width:100%;padding:10px;margin:5px 0;background:#121c33;
border:none;border-radius:8px;color:#fff;cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;}

.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}

.search-box input{
padding:10px;border-radius:8px;border:none;background:#101a31;
color:#fff;width:260px;
}

.live{background:red;padding:6px 12px;border-radius:20px}

/* PLAYER */
.player-container{
background:#000;border-radius:10px;overflow:hidden;height:320px;
}

video{width:100%;height:100%;}

/* CHANNELS */
.channels{
overflow-y:auto;flex:1;display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;padding-right:5px;
}

.card{
background:#111a31;padding:10px;border-radius:10px;
cursor:pointer;border:1px solid #1f355d;
}
.card:hover{border-color:#00d4ff;transform:scale(1.03);}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

.logout{
background:#ff3b3b;color:#fff;border:none;padding:8px 10px;
border-radius:6px;cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
<div class="auth-card">
<h3>📺 IPTV TRIAL LOGIN</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- BLOCK / UPGRADE SCREEN -->
<div id="blocked">
<div class="upgrade-box">
<h2>⛔ ACCESS BLOCKED</h2>
<p id="blockText">Your trial expired or access is restricted.</p>

<button onclick="upgrade()">⬆ Upgrade to View Channels</button>
<button onclick="resetAll()" style="background:#ff3b3b;">Logout & Reset</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">📺 BTECH-TV PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<button class="logout" onclick="logout()">🚪 Logout</button>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="search-box">
<input oninput="search(this.value)" placeholder="Search IPTV...">
</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="player-container">
<video id="video" controls autoplay muted></video>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

const TRIAL_DAYS = 3;

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* AUTH */
function register(){
let email=emailVal(),pass=passVal();
if(!email||!pass)return alert("Fill all fields");
localStorage.setItem("user",JSON.stringify({email,pass}));
startTrial();
login();
}

function login(){
if(!localStorage.getItem("user"))return alert("Register first");

let start=localStorage.getItem("start");
if(!start){startTrial();start=Date.now();}

checkAccess();
document.getElementById("authBox").style.display="none";
}

/* TRIAL */
function startTrial(){
localStorage.setItem("start",Date.now());
localStorage.setItem("paid",false);
}

function checkAccess(){
let paid=localStorage.getItem("paid")==="true";
let start=parseInt(localStorage.getItem("start"));

if(paid) return unlock();

let days=(Date.now()-start)/(1000*60*60*24);

if(days>TRIAL_DAYS){
block("Trial expired. Please upgrade to continue watching.");
}else{
unlock();
}
}

function block(msg){
document.getElementById("blocked").style.display="flex";
document.querySelector(".main").style.display="none";
document.querySelector(".sidebar").style.display="none";
document.getElementById("blockText").innerText=msg;
}

function unlock(){
document.getElementById("blocked").style.display="none";
document.querySelector(".main").style.display="flex";
document.querySelector(".sidebar").style.display="block";
}

function upgrade(){
localStorage.setItem("paid","true");
unlock();
alert("Upgrade successful — Full access granted!");
}

function logout(){
localStorage.removeItem("user");
location.reload();
}

function resetAll(){
localStorage.clear();
location.reload();
}

/* IPTV CORE */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

let lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];
if(url && url.startsWith("http")) all.push({name,url});
}
}

filtered=[...all];
render();
}

function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function play(idx){
i=idx;
let c=filtered[i];
if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* helpers */
function emailVal(){return document.getElementById("email").value;}
function passVal(){return document.getElementById("password").value;}

/* AUTO CHECK */
setInterval(checkAccess,5000);

</script>

</body>
</html>
