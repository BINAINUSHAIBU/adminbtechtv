

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH TV - SUPER ADMIN DASHBOARD</title>

<meta name="theme-color" content="#050816">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* ========================= GLOBAL ========================= */

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
background:#020617;
color:#fff;
overflow-x:hidden;
}

/* ========================= LAYOUT ========================= */

.dashboard-container{display:flex;min-height:100vh;}

/* ========================= SIDEBAR ========================= */

.sidebar{
width:280px;
background:#0f172a;
padding:20px;
border-right:1px solid rgba(255,255,255,0.05);
overflow-y:auto;
}

.logo-box{text-align:center;margin-bottom:25px;}
.logo-box h1{color:#00d4ff;font-size:26px;}
.logo-box p{color:#94a3b8;font-size:13px;}

.menu-section-title{
margin:15px 0 8px;
color:#00d4ff;
font-size:12px;
font-weight:bold;
}

.sidebar button{
width:100%;
padding:12px;
margin:5px 0;
border:none;
border-radius:10px;
background:#111827;
color:#fff;
cursor:pointer;
text-align:left;
font-weight:bold;
}

.sidebar button:hover{background:#00d4ff;color:#000;}

/* ========================= MAIN ========================= */

.dashboard-main{flex:1;padding:20px;}

/* HEADER */

.top-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.admin-box{
display:flex;
align-items:center;
gap:10px;
background:#111827;
padding:10px 15px;
border-radius:12px;
}

.admin-box img{width:40px;height:40px;border-radius:50%;}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat{
background:#111827;
padding:20px;
border-radius:15px;
text-align:center;
}

.stat h3{color:#94a3b8;}
.stat p{font-size:26px;color:#00d4ff;margin-top:5px;}

/* SETTINGS */

.settings{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:#111827;
padding:15px;
border-radius:15px;
}

/* CHANNEL GRID */

.channel-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.channel{
background:#1e293b;
border-radius:15px;
overflow:hidden;
}

.channel img{
width:100%;
height:140px;
object-fit:cover;
}

.channel-body{padding:12px;}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.free{background:#16a34a;}
.premium{background:#dc2626;}
.locked{background:#f59e0b;}
.unlocked{background:#2563eb;}

.actions button{
margin-top:8px;
width:32%;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.watch{background:#00d4ff;}
.edit{background:#2563eb;color:#fff;}
.del{background:#dc2626;color:#fff;}

/* PLAYER */

.player{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.player video{width:90%;max-width:900px;}

.close{
background:red;
padding:10px 15px;
border:none;
border-radius:8px;
color:#fff;
margin-bottom:10px;
cursor:pointer;
}

/* AUTH */

#auth{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

.auth-box{
background:#111827;
padding:20px;
border-radius:15px;
width:300px;
}

.auth-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:#fff;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:5px;
background:#00d4ff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

</style>

</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth">
<div class="auth-box">
<h3>Login</h3>
<input id="u" placeholder="User">
<input id="p" type="password" placeholder="Pass">
<button onclick="login()">Login</button>
</div>
</div>

<!-- ================= PLAYER ================= -->
<div class="player" id="player">
<button class="close" onclick="closePlayer()">Close</button>
<h3 id="ptitle"></h3>
<video id="video" controls></video>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none;">

<div class="dashboard-container">

<!-- SIDEBAR -->
<aside class="sidebar">

<div class="logo-box">
<h1>BTECH TV</h1>
<p>SUPER ADMIN CONTROL PANEL</p>
</div>

<button>Dashboard</button>
<button>All Channels</button>
<button>Free Channels</button>
<button>Premium Channels</button>
<button>Locked Channels</button>
<button>Users</button>
<button>Subscriptions</button>
<button>Servers</button>
<button>Super Settings</button>

<div class="menu-section-title">🌍 COUNTRIES</div>
<button onclick="load('ng')">Nigeria</button>
<button onclick="load('us')">USA</button>
<button onclick="load('uk')">UK</button>
<button onclick="load('in')">India</button>
<button onclick="load('fr')">France</button>
<button onclick="load('de')">Germany</button>

<div class="menu-section-title">🎬 CATEGORIES</div>
<button onclick="loadCat('news')">News</button>
<button onclick="loadCat('sports')">Sports</button>
<button onclick="loadCat('movies')">Movies</button>
<button onclick="loadCat('music')">Music</button>

<div class="menu-section-title">🗣 LANGUAGES</div>
<button>English</button>
<button>Spanish</button>
<button>Arabic</button>

<div class="menu-section-title">🔥 FEATURES</div>
<button>Scan Streams</button>
<button>Boost</button>
<button>PiP Mode</button>
<button>Repair</button>
<button>Admin</button>

</aside>

<!-- MAIN -->
<main class="dashboard-main">

<div class="top-header">
<h2>SUPER ADMIN DASHBOARD</h2>
<div class="admin-box">
<img src="https://i.pravatar.cc/100">
<div>
<b>BTECH ADMIN</b><br>
<small>System Admin</small>
</div>
</div>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat"><h3>Total</h3><p id="total">0</p></div>
<div class="stat"><h3>Free</h3><p id="free">0</p></div>
<div class="stat"><h3>Premium</h3><p id="premium">0</p></div>
<div class="stat"><h3>Locked</h3><p id="locked">0</p></div>
</div>

<!-- SETTINGS -->
<div class="settings">
<div class="card">📡 System ON</div>
<div class="card">🔴 Live Streaming</div>
<div class="card">💳 Premium Access</div>
<div class="card">🛡 Security</div>
</div>

<!-- CHANNELS -->
<div class="channel-grid" id="grid"></div>

</main>

</div>
</div>

<script>

let user=null;
let channels=[];

function login(){
user="admin";
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
generate();
render();
}

function generate(){
for(let i=1;i<=60;i++){
channels.push({
name:"BTECH LIVE "+i,
type:Math.random()>0.5?"Free":"Premium",
status:Math.random()>0.3?"Unlocked":"Locked",
views:Math.floor(Math.random()*900000),
stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
img:"https://via.placeholder.com/400x200/111827/00d4ff?text=LIVE+"+i
});
}
updateStats();
}

function updateStats(){
document.getElementById("total").innerText=channels.length;
document.getElementById("free").innerText=channels.filter(c=>c.type=="Free").length;
document.getElementById("premium").innerText=channels.filter(c=>c.type=="Premium").length;
document.getElementById("locked").innerText=channels.filter(c=>c.status=="Locked").length;
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
channels.forEach(c=>{
g.innerHTML+=`
<div class="channel">
<img src="${c.img}">
<div class="channel-body">
<h3>${c.name}</h3>
<span class="badge ${c.type=="Free"?"free":"premium"}">${c.type}</span>
<span class="badge ${c.status=="Locked"?"locked":"unlocked"}">${c.status}</span>
<p>👁 ${c.views}</p>
<div class="actions">
<button class="watch" onclick="play('${c.stream}','${c.name}')">Watch</button>
<button class="edit">Edit</button>
<button class="del">Del</button>
</div>
</div>
</div>`;
});
}

function play(url,name){
document.getElementById("player").style.display="flex";
document.getElementById("ptitle").innerText=name;

let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());
}else{
v.src=url;
v.play();
}
}

function closePlayer(){
document.getElementById("player").style.display="none";
document.getElementById("video").pause();
}

function load(code){
fetch(`https://iptv-org.github.io/iptv/countries/${code}.m3u`)
.then(r=>r.text()).then(parse);
}

function loadCat(cat){
fetch(`https://iptv-org.github.io/iptv/categories/${cat}.m3u`)
.then(r=>r.text()).then(parse);
}

function parse(t){
channels=[];
let lines=t.split("\n");
for(let i=0;i<lines.length;i++){
if(lines[i].startsWith("#EXTINF")){
let name=lines[i].split(",")[1];
let url=lines[i+1];
if(url && url.startsWith("http")){
channels.push({
name,type:"Free",status:"Unlocked",views:0,stream:url,
img:"https://via.placeholder.com/400x200"
});
}
}
}
updateStats();
render();
}

</script>

</body>
</html>
