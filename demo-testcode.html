<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

/* LOAD */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}

async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}

async function loadGlobal(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

/* M3U PARSER */
async function loadM3U(url){
const res=await fetch(url);
const text=await res.text();

all=[];filtered=[];i=0;

const lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];

if(url && url.startsWith("http")){
all.push({name,url});
}
}
}

filtered=[...all];
render();
stats();
}

/* RENDER */
function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";

filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* SEARCH */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}

/* NEXT / PREV */
function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

/* SHUFFLE */
function shuffle(){
filtered.sort(()=>Math.random()-0.5);
render();
}

/* CONTROLS */
function toggleMute(){video.muted=!video.muted;}

function toggleFullscreen(){
video.requestFullscreen();
}

/* PiP */
async function togglePiP(){
try{
if(document.pictureInPictureElement){
await document.exitPictureInPicture();
}else{
await video.requestPictureInPicture();
}
}catch(e){
alert("PiP not supported");
}
}

/* STATS */
function stats(){
document.getElementById("total").innerText=all.length;
document.getElementById("live").innerText=all.length;
document.getElementById("dead").innerText=0;
document.getElementById("fav").innerText=0;
}

/* AUTO START */
loadGlobal();

</script>
