<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
BTECH-TV ULTRA SINGLE PAGE DASHBOARD
</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{

--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--danger:#dc2626;
--success:#16a34a;
--warning:#f59e0b;
--text:#ffffff;
--muted:#94a3b8;

}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
cursor:pointer;
border:none;
}

/* =========================
TOPBAR
========================= */

.topbar{

height:70px;
background:var(--panel);

display:flex;
justify-content:space-between;
align-items:center;

padding:0 20px;

border-bottom:
1px solid rgba(255,255,255,0.05);

}

.topbar h2{
color:var(--accent);
font-size:22px;
}

.top-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.top-actions button{

padding:12px 18px;
background:var(--card);
color:white;

border-radius:10px;

font-weight:bold;

transition:0.3s;

}

.top-actions button:hover{
background:var(--hover);
}

.delete-all-btn{
background:var(--danger)!important;
}

/* =========================
LAYOUT
========================= */

.container{

display:flex;

height:calc(100vh - 70px);

}

/* =========================
SIDEBAR
========================= */

.sidebar{

width:320px;
background:#0f1628;

padding:20px;

overflow-y:auto;

border-right:
1px solid rgba(255,255,255,0.05);

}

.card{

background:var(--panel);

padding:20px;

border-radius:16px;

margin-bottom:20px;

}

.card h3{
margin-bottom:15px;
color:var(--accent);
}

.stats-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}

.stat-box{

background:var(--card);

padding:16px;

border-radius:12px;

text-align:center;

}

.stat-box h4{
font-size:13px;
margin-bottom:8px;
color:var(--muted);
}

.stat-box p{
font-size:22px;
font-weight:bold;
}

.search-box{

width:100%;

padding:14px;

background:var(--card);

border:none;

border-radius:10px;

color:white;

margin-bottom:15px;

}

.action-btn{

width:100%;

padding:14px;

margin-top:10px;

border-radius:10px;

font-weight:bold;

transition:0.3s;

}

.primary-btn{
background:var(--accent);
color:black;
}

.warning-btn{
background:var(--warning);
color:black;
}

.danger-btn{
background:var(--danger);
color:white;
}

.action-btn:hover{
opacity:0.85;
transform:translateY(-2px);
}

/* =========================
MAIN
========================= */

.main{

flex:1;

display:flex;
flex-direction:column;

overflow:hidden;

}

/* =========================
PLAYER
========================= */

.player-wrap{

background:black;

margin:20px;

border-radius:18px;

overflow:hidden;

}

video{

width:100%;
height:420px;
background:black;

}

.now-playing{

padding:15px 20px;

background:var(--panel);

display:flex;
justify-content:space-between;
align-items:center;

}

/* =========================
CHANNELS
========================= */

.channels{

flex:1;

overflow-y:auto;

padding:20px;

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(320px,1fr));

gap:16px;

}

.channel{

background:var(--card);

border-radius:16px;

padding:15px;

display:flex;
justify-content:space-between;
align-items:center;

gap:12px;

transition:0.3s;

cursor:pointer;

border:1px solid transparent;

}

.channel:hover{

background:var(--hover);

transform:translateY(-2px);

border-color:var(--accent);

}

.channel-left{

display:flex;
align-items:center;
gap:12px;

overflow:hidden;

}

.channel-left img{

width:60px;
height:60px;

border-radius:12px;

object-fit:cover;

background:black;

}

.channel-info h4{
font-size:14px;
margin-bottom:6px;
}

.channel-info small{
color:var(--muted);
}

.channel-status{

display:flex;
flex-direction:column;
gap:6px;

}

.badge{

padding:6px 12px;

border-radius:20px;

font-size:11px;

font-weight:bold;

}

.free{
background:var(--success);
}

.paid{
background:var(--danger);
}

.locked{
background:var(--warning);
color:black;
}

.unlocked{
background:#2563eb;
}

/* =========================
LOGS
========================= */

.log-box{

background:#0f1628;

padding:15px;

border-radius:12px;

max-height:250px;

overflow-y:auto;

font-size:13px;

line-height:1.7;

}

.log-item{

padding:8px 0;

border-bottom:
1px solid rgba(255,255,255,0.05);

}

/* =========================
MOBILE
========================= */

@media(max-width:1000px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
border-right:none;
border-bottom:
1px solid rgba(255,255,255,0.05);
}

.channels{
grid-template-columns:1fr;
}

.topbar{
flex-direction:column;
height:auto;
padding:15px;
gap:10px;
}

video{
height:250px;
}

}

</style>

</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

<h2>
📺 BTECH-TV ULTRA IPTV SYSTEM
</h2>

<div class="top-actions">

<button onclick="loadChannels()">
🔄 Refresh
</button>

<button onclick="nextChannel()">
⏭ Next
</button>

<button onclick="exportChannels()">
📥 Export
</button>

<button
class="delete-all-btn"
onclick="deleteLockedChannels()"
>
🗑 Delete Locked
</button>

</div>

</div>

<!-- =========================
CONTAINER
========================= -->

<div class="container">

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

<div class="card">

<h3>
📊 IPTV STATS
</h3>

<div class="stats-grid">

<div class="stat-box">
<h4>Total</h4>
<p id="totalCount">0</p>
</div>

<div class="stat-box">
<h4>Locked</h4>
<p id="lockedCount">0</p>
</div>

<div class="stat-box">
<h4>Free</h4>
<p id="freeCount">0</p>
</div>

<div class="stat-box">
<h4>Paid</h4>
<p id="paidCount">0</p>
</div>

</div>

</div>

<div class="card">

<h3>
🔍 Search Channels
</h3>

<input
type="text"
class="search-box"
placeholder="Search IPTV channels..."
oninput="searchChannels(this.value)"
>

<button
class="action-btn primary-btn"
onclick="unlockAll()"
>
🔓 Unlock All
</button>

<button
class="action-btn warning-btn"
onclick="backupChannels()"
>
💾 Backup
</button>

<a
href="https://superadminbtech-tv.netlify.app/delete_locked-channels"
style="text-decoration:none;"
>

<button
class="action-btn danger-btn"
>

🗑 Delete Locked Channels

</button>

</a>

</div>

<div class="card">

<h3>
📝 Activity Log
</h3>

<div
class="log-box"
id="logBox"
>

<div class="log-item">
🚀 BTECH-TV Engine Started
</div>

</div>

</div>

</div>

<!-- =========================
MAIN
========================= -->

<div class="main">

<div class="player-wrap">

<video
id="videoPlayer"
controls
autoplay
muted
playsinline
></video>

<div class="now-playing">

<div>

<h3 id="nowPlaying">
No Channel Selected
</h3>

<small id="channelMeta">
Waiting for stream...
</small>

</div>

<button
class="action-btn primary-btn"
style="width:auto;padding:10px 15px;"
onclick="togglePiP()"
>

📺 PiP

</button>

</div>

</div>

<div
class="channels"
id="channelGrid"
></div>

</div>

</div>

<script>

/* =========================
GLOBAL STATE
========================= */

let channels=[];

let filteredChannels=[];

let currentIndex=0;

let hlsPlayer=null;

/* =========================
DEMO STREAMS
========================= */

const streams=[

"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",

"https://test-streams.mux.dev/test_001/stream.m3u8",

"https://test-streams.mux.dev/test_002/stream.m3u8",

"https://test-streams.mux.dev/test_003/stream.m3u8"

];

const categories=[

"Sports",
"Movies",
"News",
"Kids",
"Music",
"Africa",
"USA",
"UK"

];

/* =========================
LOAD CHANNELS
========================= */

function loadChannels(){

channels=[];

for(let i=1;i<=500;i++){

let cat=
categories[
i % categories.length
];

channels.push({

id:i,

name:
"BTECH " +
cat +
" LIVE " +
i,

category:cat,

logo:
"https://via.placeholder.com/60",

type:
i % 3===0
?"paid"
:"free",

status:
i % 10===0
?"locked"
:"unlocked",

viewers:
Math.floor(
Math.random()*1000000
),

url:
streams[
i % streams.length
]

});

}

filteredChannels=[...channels];

updateStats();

renderChannels();

addLog(
"📡 IPTV channels loaded"
);

}

/* =========================
RENDER CHANNELS
========================= */

function renderChannels(){

const grid=
document.getElementById(
"channelGrid"
);

grid.innerHTML="";

filteredChannels.forEach((channel,index)=>{

const div=
document.createElement("div");

div.className="channel";

div.innerHTML=`

<div class="channel-left">

<img
src="${channel.logo}"
>

<div class="channel-info">

<h4>
🔴 ${channel.name}
</h4>

<small>

${channel.category}
•
👥 ${channel.viewers.toLocaleString()}

</small>

</div>

</div>

<div class="channel-status">

<span class="
badge
${channel.type==='free'
?'free'
:'paid'}
">

${channel.type}

</span>

<span class="
badge
${channel.status==='locked'
?'locked'
:'unlocked'}
">

${channel.status}

</span>

</div>

`;

div.onclick=
()=>playChannel(index);

grid.appendChild(div);

});

}

/* =========================
PLAY CHANNEL
========================= */

function playChannel(index){

currentIndex=index;

const channel=
filteredChannels[index];

document.getElementById(
"nowPlaying"
).innerText=
channel.name;

document.getElementById(
"channelMeta"
).innerText=

channel.category +
" • 👥 " +
channel.viewers.toLocaleString();

const video=
document.getElementById(
"videoPlayer"
);

if(hlsPlayer){

hlsPlayer.destroy();

}

if(Hls.isSupported()){

hlsPlayer=
new Hls({

enableWorker:true,
lowLatencyMode:true

});

hlsPlayer.loadSource(
channel.url
);

hlsPlayer.attachMedia(video);

hlsPlayer.on(
Hls.Events.MANIFEST_PARSED,
()=>{

video.play();

}
);

}else{

video.src=
channel.url;

video.play();

}

addLog(
"▶ Playing " +
channel.name
);

}

/* =========================
NEXT CHANNEL
========================= */

function nextChannel(){

currentIndex++;

if(
currentIndex >=
filteredChannels.length
){

currentIndex=0;

}

playChannel(currentIndex);

}

/* =========================
SEARCH
========================= */

function searchChannels(query){

const value=
query.toLowerCase();

filteredChannels=
channels.filter(c=>

c.name
.toLowerCase()
.includes(value)

||

c.category
.toLowerCase()
.includes(value)

);

renderChannels();

}

/* =========================
DELETE LOCKED
========================= */

function deleteLockedChannels(){

channels=
channels.filter(
c=>c.status!=="locked"
);

filteredChannels=[...channels];

updateStats();

renderChannels();

addLog(
"🗑 Locked channels deleted"
);

}

/* =========================
UNLOCK ALL
========================= */

function unlockAll(){

channels.forEach(channel=>{

channel.status="unlocked";

});

filteredChannels=[...channels];

updateStats();

renderChannels();

addLog(
"🔓 All channels unlocked"
);

}

/* =========================
EXPORT
========================= */

function exportChannels(){

const data=
JSON.stringify(
channels,
null,
2
);

const blob=
new Blob([data],{
type:'application/json'
});

const url=
URL.createObjectURL(blob);

const a=
document.createElement('a');

a.href=url;

a.download=
'btech_channels.json';

a.click();

addLog(
"📥 IPTV export completed"
);

}

/* =========================
BACKUP
========================= */

function backupChannels(){

localStorage.setItem(

'btech_backup',

JSON.stringify(channels)

);

addLog(
"💾 Backup completed"
);

alert(
'Backup saved'
);

}

/* =========================
UPDATE STATS
========================= */

function updateStats(){

document.getElementById(
"totalCount"
).innerText=
channels.length;

document.getElementById(
"lockedCount"
).innerText=

channels.filter(
c=>c.status==="locked"
).length;

document.getElementById(
"freeCount"
).innerText=

channels.filter(
c=>c.type==="free"
).length;

document.getElementById(
"paidCount"
).innerText=

channels.filter(
c=>c.type==="paid"
).length;

}

/* =========================
PiP
========================= */

function togglePiP(){

const video=
document.getElementById(
"videoPlayer"
);

if(
document.pictureInPictureElement
){

document.exitPictureInPicture();

}else{

video.requestPictureInPicture();

}

}

/* =========================
LOGS
========================= */

function addLog(message){

const log=
document.getElementById(
"logBox"
);

const item=
document.createElement("div");

item.className="log-item";

item.innerHTML=

new Date()
.toLocaleTimeString()

+

" — " +

message;

log.prepend(item);

}

/* =========================
BOOT
========================= */

loadChannels();

</script>

</body>
</html>
