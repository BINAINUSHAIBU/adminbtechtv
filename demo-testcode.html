
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV WORLD PRO MAX + SUPER SETTINGS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{position:fixed;inset:0;background:#050816;display:flex;justify-content:center;align-items:center;z-index:9999}
.auth-card{background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center}
.auth-card input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#101a31;color:#fff}
.auth-card button{width:100%;padding:10px;margin-top:10px;background:#00d4ff;border:none;border-radius:6px;cursor:pointer}

/* SIDEBAR */
.sidebar{width:280px;background:#0d1324;padding:15px;overflow-y:auto;border-right:1px solid #1d2b4f}
.nav-btn{width:100%;padding:10px;margin:5px 0;background:#121c33;border:none;border-radius:8px;color:#fff;cursor:pointer}
.nav-btn:hover{background:#00d4ff;color:#000}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px}
.player-container{background:#000;height:300px;border-radius:10px;overflow:hidden}
video{width:100%;height:100%}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;overflow:auto;flex:1;margin-top:10px}
.card{background:#111a31;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #1f355d}
.card.locked{opacity:0.3;pointer-events:none}
.badge{background:red;padding:3px 6px;border-radius:8px;font-size:10px;float:right}

/* SUPER ADMIN */
#adminPanel{
position:fixed;
right:0;top:0;
width:320px;
height:100%;
background:#0b1220;
border-left:2px solid #00d4ff;
padding:10px;
overflow:auto;
display:none;
z-index:99999;
}

#adminPanel h3{color:#00d4ff}
.admin-btn{width:100%;padding:10px;margin:5px 0;background:#152445;border:none;color:#fff;border-radius:6px;cursor:pointer}
.admin-btn:hover{background:#00d4ff;color:#000}

.small{font-size:12px;color:#aaa}

#timerBar{position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;padding:8px;border-radius:8px;font-weight:bold}
</style>
</head>

<body>

<div id="timerBar">Loading...</div>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 LOGIN</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>📺 BTECH TV</h2>

<button class="nav-btn" onclick="loadUltra()">🌍 All Channels</button>
<button class="nav-btn" onclick="toggleAdmin()">⚙ Super Admin</button>
<button class="nav-btn" onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="player-container">
<video id="video" controls></video>
</div>

<div class="channels" id="grid"></div>

</div>

<!-- SUPER ADMIN PANEL -->
<div id="adminPanel">

<h3>⚙ SUPER ADMIN CONTROL</h3>

<div class="small">Lock / Unlock Channels</div>
<button class="admin-btn" onclick="lockSelected()">🔒 Lock Selected</button>
<button class="admin-btn" onclick="unlockAll()">🔓 Unlock All</button>

<div class="small">Expiration Control</div>
<button class="admin-btn" onclick="resetAllExpiry()">♻ Reset ALL Expiry</button>

<div class="small">System</div>
<button class="admin-btn" onclick="clearAllUsers()">🧨 Clear Users</button>
<button class="admin-btn" onclick="closeAdmin()">❌ Close</button>

</div>

<script>

let all=[],filtered=[],i=0;
let lockedChannels = JSON.parse(localStorage.getItem("lockedChannels")||"[]");
let video=document.getElementById("video");
let selected = new Set();

/* USERS */
function register(){
let u={email:email.value,pass:pass.value,exp:Date.now()+3600000};
localStorage.setItem("user",JSON.stringify(u));
alert("Registered 1h trial");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u || u.email!==email.value || u.pass!==pass.value){
alert("Invalid");return;
}
if(Date.now()>u.exp){
alert("EXPIRED USER");return;
}
authBox.style.display="none";
startTimer(u);
loadUltra();
}

/* TIMER */
function startTimer(u){
setInterval(()=>{
let left=u.exp-Date.now();
if(left<=0){document.body.innerHTML="<h1>EXPIRED</h1>";}
timerBar.innerText="Time Left: "+Math.floor(left/60000)+" min";
},1000);
}

/* IPTV */
async function loadUltra(){
let res=await fetch("https://iptv-org.github.io/iptv/index.country.m3u");
let text=await res.text();

all=[];filtered=[];

text.split("\n").forEach((l,i,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",")[1];
let url=a[i+1];
if(url?.startsWith("http")){
all.push({name,url});
}
}
});

filtered=[...all];
render();
}

function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";

if(lockedChannels.includes(c.name)) div.classList.add("locked");

div.innerHTML=`
<input type="checkbox" onchange="selectChannel('${c.name}',this)">
<div class="badge">LIVE</div>${c.name}
`;

div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

function selectChannel(name,el){
if(el.checked) selected.add(name);
else selected.delete(name);
}

/* PLAY */
function play(idx){
let c=filtered[idx];
if(lockedChannels.includes(c.name)){
alert("LOCKED CHANNEL");
return;
}

video.src=c.url;
video.play();
}

/* ADMIN FUNCTIONS */
function toggleAdmin(){
adminPanel.style.display="block";
}

function closeAdmin(){
adminPanel.style.display="none";
}

function lockSelected(){
lockedChannels=[...new Set([...lockedChannels,...selected])];
localStorage.setItem("lockedChannels",JSON.stringify(lockedChannels));
render();
alert("Locked selected channels");
}

function unlockAll(){
lockedChannels=[];
localStorage.removeItem("lockedChannels");
render();
alert("All unlocked");
}

function resetAllExpiry(){
let u=JSON.parse(localStorage.getItem("user"));
if(u){
u.exp=Date.now()+3600000;
localStorage.setItem("user",JSON.stringify(u));
alert("Expiry reset 1h");
}
}

function clearAllUsers(){
localStorage.clear();
alert("All data cleared");
location.reload();
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}

loadUltra();

</script>

</body>
</html>
