<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📺 SUPER ADMIN IPTV ULTRA MAX WORLD</title>

<meta name="theme-color" content="#050816"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
--warning:#f59e0b;
--premium:#7c3aed;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* ================= AUTH ================= */
#auth{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.auth-box{
background:var(--panel);
padding:25px;
border-radius:15px;
width:320px;
}

.auth-box input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:white;
}

.auth-box button{
width:100%;
padding:10px;
margin-top:6px;
background:var(--accent);
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* ================= TOPBAR ================= */

.topbar{
height:70px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.logo{color:var(--accent);font-weight:bold}

/* ================= LAYOUT ================= */

.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:320px;
background:#0b1220;
overflow:auto;
padding:10px;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{height:320px;background:black;position:relative}

.player video{width:100%;height:100%}

.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

/* CHANNELS */
.channels{
flex:1;
overflow:auto;
padding:10px;
}

/* CHANNEL */
.channel{
background:var(--card);
padding:10px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

/* UPGRADE */
.upgrade{
position:fixed;
bottom:15px;
right:15px;
background:red;
padding:10px;
border-radius:10px;
cursor:pointer;
}

/* ADMIN */
.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.admin-box{
background:var(--panel);
padding:20px;
border-radius:12px;
width:300px;
}

button{cursor:pointer}

</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="auth">
<div class="auth-box">

<h3>Login / Register</h3>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<button onclick="demo('admin')">Demo Admin</button>
<button onclick="demo('user')">Demo User</button>

</div>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">

<div class="topbar">
<div class="logo">📺 SUPER ADMIN IPTV</div>
<div>
<span id="timer"></span>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<div class="sidebar">
<h3>Channels</h3>
<div id="list"></div>
</div>

<div class="main">

<div class="player">
<video id="video" controls></video>

<div class="overlay" id="overlay">
<h2>Loading...</h2>
</div>

</div>

<div class="channels" id="channels"></div>

</div>

</div>

<div class="upgrade" onclick="openUpgrade()">🔥 Upgrade</div>

</div>

<!-- ================= ADMIN ================= -->
<div class="admin" id="admin">
<div class="admin-box">

<h3>SUPER ADMIN PANEL</h3>

<button onclick="alert('Scanning')">Scan Streams</button>
<button onclick="alert('Repair')">Repair</button>
<button onclick="alert('Boost')">Boost</button>
<button onclick="alert('Premium ON')">Premium</button>
<button onclick="alert('Backup Done')">Backup</button>
<button onclick="closeAdmin()">Close</button>

</div>
</div>

<!-- ================= UPGRADE ================= -->
<div class="admin" id="upgrade">
<div class="admin-box">

<h3>Upgrade Plans</h3>

<button onclick="buy('1 Day')">1 Day</button>
<button onclick="buy('7 Days')">7 Days</button>
<button onclick="buy('30 Days')">30 Days</button>

<button onclick="closeUpgrade()">Close</button>

</div>
</div>

<script>

/* ================= DATA ================= */
let channels=[
{name:"BBC News",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Sky Sports",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Movie Channel",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
];

let user=null;
let start=0;

/* ================= AUTH ================= */
function register(){
let u=userBox(),p=passBox();
localStorage.setItem("u_"+u,JSON.stringify({p,plan:"trial",t:Date.now()}));
alert("Registered");
}

function login(){
let u=userBox(),p=passBox();
let d=JSON.parse(localStorage.getItem("u_"+u));
if(d && d.p===p){
user=u;
startApp();
}else alert("Invalid login");
}

function demo(type){
user=type;
startApp();
}

function userBox(){return document.getElementById("user").value}
function passBox(){return document.getElementById("pass").value}

/* ================= START ================= */
function startApp(){
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
start=Date.now();
render();
setInterval(trialTimer,1000);
}

/* ================= TRIAL TIMER ================= */
function trialTimer(){
let d=JSON.parse(localStorage.getItem("u_"+user)||"{}");
let limit=5*60*60*1000;
let left=limit-(Date.now()-d.t||0);

if(left<=0){
document.getElementById("timer").innerText="EXPIRED";
return;
}

document.getElementById("timer").innerText=Math.floor(left/3600000)+"h left";
}

/* ================= CHANNELS ================= */
function render(){
let box=document.getElementById("channels");
box.innerHTML="";

channels.forEach((c,i)=>{
let div=document.createElement("div");
div.className="channel";
div.innerHTML=`${c.name}`;
div.onclick=()=>play(c.url);
box.appendChild(div);
});
}

/* ================= PLAY ================= */
function play(url){
let v=document.getElementById("video");

document.getElementById("overlay").style.display="flex";

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(url);
h.attachMedia(v);
h.on(Hls.Events.MANIFEST_PARSED,()=>{
v.play();
document.getElementById("overlay").style.display="none";
});
}
}

/* ================= UPGRADE ================= */
function openUpgrade(){
document.getElementById("upgrade").style.display="flex";
}
function closeUpgrade(){
document.getElementById("upgrade").style.display="none";
}
function buy(p){alert("Bought "+p)}

/* ================= ADMIN ================= */
function openAdmin(){
document.getElementById("admin").style.display="flex";
}
function closeAdmin(){
document.getElementById("admin").style.display="none";
}

/* ================= LOGOUT ================= */
function logout(){
location.reload();
}

render();

</script>

</body>
</html>
