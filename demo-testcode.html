<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV MULTI-TENANT SAAS IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#0f172a;
flex-wrap:wrap;
}

.logo{color:var(--accent);font-weight:bold}

button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#22304d;
color:white;
cursor:pointer;
margin:3px;
}

/* LAYOUT */
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
width:280px;
background:#0b1220;
overflow:auto;
padding:10px;
}

.cat{
padding:10px;
background:var(--card);
margin:5px 0;
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{height:300px;background:black;position:relative}
video{width:100%;height:100%;object-fit:contain}
.overlay{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,0.7)
}

/* CHANNELS */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:8px;
cursor:pointer;
}

/* SAAS PANEL */
#saasDashboard{
position:fixed;
inset:0;
background:#0b1220;
display:none;
overflow:auto;
padding:15px;
z-index:9999;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

.card{
background:#172033;
padding:10px;
border-radius:8px;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
background:#172033;
}

td,th{
border:1px solid #22304d;
padding:8px;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

<div class="logo">📺 BTECH-TV MULTI-TENANT SAAS IPTV</div>

<div>
<select id="tenantSelect" onchange="switchTenant(this.value)"></select>

<button onclick="toggleSaaS()">👥 SaaS</button>
<button onclick="loadPlaylist(defaultURL)">🚀 IPTV</button>
<button onclick="toggleFullscreen()">⛶</button>
</div>

</div>

<!-- IPTV -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🌍 Countries</h3>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u')">Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u')">USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u')">UK</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls autoplay></video>
<div class="overlay" id="overlay">Loading...</div>
</div>

<div class="channels" id="channelList"></div>

</div>
</div>

<!-- SAAS DASHBOARD -->
<div id="saasDashboard">

<h1>📊 MULTI-TENANT ADMIN PANEL</h1>

<div class="grid">

<div class="card">
<h3>Total Users</h3>
<h2 id="totalUsers">0</h2>
</div>

<div class="card">
<h3>Active Users</h3>
<h2 id="activeUsers">0</h2>
</div>

<div class="card">
<h3>Trials</h3>
<h2 id="trialUsers">0</h2>
</div>

<div class="card">
<h3>Revenue</h3>
<h2>₦0</h2>
</div>

</div>

<hr>

<h2>👥 Users</h2>
<button onclick="createUser()">Create User</button>
<table>
<thead>
<tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<hr>

<h2>📦 Packages</h2>
<button onclick="addPackage()">Add Package</button>
<div id="packageList"></div>

<hr>

<h2>📺 Tenant Channels</h2>
<div id="tenantChannels"></div>

</div>

<script>

/* ================= MULTI-TENANT DATA ================= */

let tenants = [
{
id:"tenant1",
name:"Default Tenant",
users:[
{name:"Admin",email:"admin@btechtv.com",status:"Active"}
],
packages:["Trial","Basic","Premium"],
channels:[]
},
{
id:"tenant2",
name:"Premium Tenant",
users:[],
packages:["Gold","VIP"],
channels:[]
}
];

let currentTenant = 0;

/* fill dropdown */
let select=document.getElementById("tenantSelect");
tenants.forEach((t,i)=>{
select.innerHTML += `<option value="${i}">${t.name}</option>`;
});

/* ================= SWITCH TENANT ================= */

function switchTenant(i){
currentTenant=i;
renderSaaS();
}

/* ================= IPTV ================= */

let all=[];
let video=document.getElementById("video");
let defaultURL="https://iptv-org.github.io/iptv/countries/ng.m3u";

async function loadPlaylist(url){

document.getElementById("overlay").style.display="flex";

let res=await fetch(url);
let text=await res.text();

all=parseM3U(text);
renderChannels();

document.getElementById("overlay").style.display="none";
}

function parseM3U(data){
let lines=data.split("\n");
let arr=[];

for(let i=0;i<lines.length;i++){
if(lines[i].includes("#EXTINF")){
let url=lines[i+1];
let name=lines[i].split(",")[1];
if(url) arr.push({name,url});
}
}
return arr;
}

function playChannel(i){
let ch=all[i];

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(ch.url);
hls.attachMedia(video);
}else{
video.src=ch.url;
}
video.play();
}

function renderChannels(){
let box=document.getElementById("channelList");
box.innerHTML="";

all.forEach((c,i)=>{
box.innerHTML += `
<div class="channel" onclick="playChannel(${i})">
${c.name}
</div>`;
});
}

/* ================= SAAS ================= */

function toggleSaaS(){
let dash=document.getElementById("saasDashboard");
dash.style.display = dash.style.display==="block"?"none":"block";
renderSaaS();
}

function renderSaaS(){

let t=tenants[currentTenant];

document.getElementById("totalUsers").innerText=t.users.length;
document.getElementById("activeUsers").innerText=t.users.filter(u=>u.status==="Active").length;
document.getElementById("trialUsers").innerText=0;

/* users */
let html="";
t.users.forEach((u,i)=>{
html += `
<tr>
<td>${u.name}</td>
<td>${u.email}</td>
<td>${u.status}</td>
<td><button onclick="deleteUser(${i})">Delete</button></td>
</tr>`;
});

document.getElementById("userTable").innerHTML=html;

/* packages */
document.getElementById("packageList") =
document.getElementById("packageList").innerHTML =
t.packages.map(p=>`<div class="card">${p}</div>`).join("");

/* tenant channels */
document.getElementById("tenantChannels").innerHTML =
(all.slice(0,5).map(c=>`<div class="card">${c.name}</div>`)).join("");
}

/* USER OPS */

function createUser(){
let name=prompt("User name");
tenants[currentTenant].users.push({
name,
email:name+"@mail.com",
status:"Active"
});
renderSaaS();
}

function deleteUser(i){
tenants[currentTenant].users.splice(i,1);
renderSaaS();
}

/* PACKAGE */

function addPackage(){
let p=prompt("Package name");
tenants[currentTenant].packages.push(p);
renderSaaS();
}

/* FULLSCREEN */

function toggleFullscreen(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* INIT */

loadPlaylist(defaultURL);

</script>

</body>
</html>
