<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH-TV Demo</title>

<style>
body{
margin:0;
font-family:Arial;
background:#08101f;
color:white;
}

header{
background:#0f1932;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#00d4ff;
}

.player{
width:90%;
margin:20px auto;
background:#000;
height:350px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
background:#00d4ff;
cursor:pointer;
font-size:16px;
margin:5px;
}

#timer{
font-size:20px;
text-align:center;
margin:15px;
}

#payment{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
}

.card{
background:#16223f;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
}
</style>
</head>

<body>

<header>
📺 BTECH-TV WORLD PRO MAX
</header>

<div id="timer">
Trial Remaining:
<span id="time">120</span>s
</div>

<div class="player">
VIDEO PLAYER DEMO
</div>

<center>

<button onclick="play()">
▶ Play
</button>

<button onclick="resetDemo()">
Reset Demo
</button>

</center>

<div id="payment">

<div class="card">

<h2>Trial Expired</h2>

<p>Select Package</p>

<button onclick="pay('Premium')">
Premium ₦3000
</button>

<button onclick="pay('Super Premium')">
Super Premium ₦5000
</button>

<input placeholder="4111 1111 1111 1111">

<input placeholder="12/30">

<input placeholder="123">

<p id="status"></p>

</div>

</div>

<script>

let seconds=120;

if(localStorage.plan){

document.getElementById("timer").innerHTML=
"Active Plan: "+localStorage.plan;

}

let countdown=setInterval(()=>{

if(localStorage.plan) return;

seconds--;

document.getElementById("time").innerHTML=seconds;

if(seconds<=0){

clearInterval(countdown);

document.getElementById("payment").style.display="flex";

}

},1000);

function play(){

alert("Demo Player Started");

}

function pay(plan){

document.getElementById("status").innerHTML=
"Processing Demo Payment...";

setTimeout(()=>{

localStorage.plan=plan;

document.getElementById("payment").style.display="none";

document.getElementById("timer").innerHTML=
"Subscription Active: "+plan;

alert(plan+" Activated!");

},2000);

}

function resetDemo(){

localStorage.removeItem("plan");

location.reload();

}

</script>

</body>
</html>
