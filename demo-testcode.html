<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLDTV IPTV PLAYER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
}

header{
background:#111827;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

.sidebar{
width:350px;
background:#0f172a;
overflow-y:auto;
border-right:1px solid #222;
}

.channel{
padding:12px;
cursor:pointer;
border-bottom:1px solid #1e293b;
}

.channel:hover{
background:#1e293b;
}

.player-area{
flex:1;
display:flex;
flex-direction:column;
}

#video{
width:100%;
height:70vh;
background:black;
}

.info{
padding:15px;
background:#111827;
}

.search{
width:100%;
padding:10px;
background:#111827;
color:white;
border:none;
outline:none;
}

.live{
color:red;
font-weight:bold;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0;}
}
</style>
</head>
<body>

<header>
📺 WORLDTV IPTV NETWORK
<span class="live">🔴 LIVE STREAMING</span>
</header>

<div class="container">

<div class="sidebar">

<input type="text" class="search" id="search" placeholder="Search Channel...">

<div id="channelList"></div>

</div>

<div class="player-area">

<video id="video" controls autoplay></video>

<div class="info">
<h2 id="channelName">Select Channel</h2>
<p>Live IPTV Streaming</p>
</div>

</div>

</div>

<script>

const channels = [

{
name:"AfroSport Nigeria",
url:"https://newproxy3.vidivu.tv/vidivu_afrosport/index.m3u8"
},

{
name:"Abu Dhabi Sports 1",
url:"https://vo-live.cdb.cdn.orange.com/Content/Channel/AbuDhabiSportsChannel1/HLS/index.m3u8"
},

{
name:"Abu Dhabi Sports 2",
url:"https://vo-live.cdb.cdn.orange.com/Content/Channel/AbuDhabiSportsChannel2/HLS/index.m3u8"
},

{
name:"CBS Sports HQ",
url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5e9f2c05172a0f0007db4786/master.m3u8"
},

{
name:"beIN SPORTS XTRA",
url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5df975e2b27cf5000921c102/master.m3u8"
},

{
name:"Adventure Sports TV",
url:"https://d3rl6ns7c3ilda.cloudfront.net/v1/master/9d062541f2ff39b5c0f48b743c6411d25f62fc25/STIRR-MuxIP-AdventureSportsTV/438.m3u8"
}

];

const list=document.getElementById('channelList');

function renderChannels(data){
list.innerHTML='';
data.forEach(ch=>{
const div=document.createElement('div');
div.className='channel';
div.innerHTML='📡 '+ch.name;
div.onclick=()=>playChannel(ch);
list.appendChild(div);
});
}

function playChannel(ch){

document.getElementById('channelName').innerText=ch.name;

const video=document.getElementById('video');

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(ch.url);

hls.attachMedia(video);

}
else{
video.src=ch.url;
}

}

document.getElementById('search').addEventListener('keyup',e=>{

const val=e.target.value.toLowerCase();

renderChannels(
channels.filter(c=>
c.name.toLowerCase().includes(val)
)
);

});

renderChannels(channels);

</script>

</body>
</html>
