// ─────────────────────────────────────────────
// COUNTRY DETECTION
// ─────────────────────────────────────────────

function detectCountry(name){

name=(name||'').toLowerCase();

var map={

'nigeria':'NG',
'abuja':'NG',
'lagos':'NG',

'usa':'US',
'cnn':'US',
'fox':'US',

'bbc':'GB',
'uk':'GB',

'india':'IN',
'zee':'IN',

'pakistan':'PK',

'al jazeera':'QA',

'france':'FR',
'germany':'DE',
'italy':'IT',
'spain':'ES',
'turkey':'TR',
'canada':'CA',
'brazil':'BR',
'japan':'JP',
'korea':'KR',
'china':'CN',
'south africa':'ZA',
'ghana':'GH',
'kenya':'KE'

};

for(var k in map){

if(name.indexOf(k)!==-1){

return map[k];

}

}

return null;

}

// ─────────────────────────────────────────────
// PARSE M3U
// ─────────────────────────────────────────────

function parseM3U(text){

var lines=text.split('\n');

var channels=[];

var current=null;

lines.forEach(function(line){

line=line.trim();

if(line.startsWith('#EXTINF')){

current={};

var name=line.split(',').pop();

current.name=name;

current.cc=detectCountry(name);

if(name.match(/4k|2160/i)){
current.q='4K';
}
else if(name.match(/1080|fhd/i)){
current.q='1080p';
}
else if(name.match(/720|hd/i)){
current.q='HD';
}

}
else if(line && !line.startsWith('#')){

if(current){

current.url=line;

channels.push(current);

current=null;

}

}

});

return channels;

}

// ─────────────────────────────────────────────
// LOAD CHANNELS
// ─────────────────────────────────────────────

async function loadChannels(){

all=[];

document.getElementById('status').innerText=
'🌍 LOADING CHANNELS...';

for(let feed of extraFeeds){

try{

let res=await fetch(feed.url);

let txt=await res.text();

let parsed=parseM3U(txt);

parsed.forEach(function(c){

c.category=feed.name;

});

all=all.concat(parsed);

document.getElementById('status').innerText=
'⏳ '+all.length+' CHANNELS LOADED...';

}catch(e){

console.log('FAILED',feed.name);

}

}

filtered=all;

renderChannels();

document.getElementById('status').innerText=
'🌍 MEGA IPTV ACTIVE · '+all.length+' CHANNELS';

}

// ─────────────────────────────────────────────
// RENDER CHANNELS
// ─────────────────────────────────────────────

function renderChannels(){

var list=document.getElementById('channelList');

list.innerHTML='';

filtered.forEach(function(c,index){

var div=document.createElement('div');

div.className='channel';

div.innerHTML=`

<div class="channel-name">
${c.cc?flag(c.cc)+' ':''}${c.name}
${c.q?'<span style="color:#00ff99;font-size:11px"> '+c.q+'</span>':''}
</div>

<div class="channel-meta">
${c.category}
</div>

`;

div.onclick=function(){

currentIndex=index;

playChannel(c.url);

addRecent(c.name);

};

list.appendChild(div);

});

}

// ─────────────────────────────────────────────
// PLAY CHANNEL
// ─────────────────────────────────────────────

function playChannel(url){

var video=document.getElementById('video');

if(Hls.isSupported()){

if(hls){
hls.destroy();
}

hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play();

});

hls.on(Hls.Events.ERROR,function(){

deadCh[url]=1;

});

}else{

video.src=url;

video.play();

}

}

// ─────────────────────────────────────────────
// NEXT CHANNEL
// ─────────────────────────────────────────────

function nextChannel(){

if(filtered.length===0)return;

currentIndex++;

if(currentIndex>=filtered.length){

currentIndex=0;

}

playChannel(filtered[currentIndex].url);

}

// ─────────────────────────────────────────────
// FAVORITES
// ─────────────────────────────────────────────

function toggleFav(name){

if(favs[name]){

delete favs[name];

}else{

favs[name]=1;

}

localStorage.setItem(
'mega_favs',
JSON.stringify(favs)
);

}

// ─────────────────────────────────────────────
// RECENT
// ─────────────────────────────────────────────

function addRecent(name){

recent=recent.filter(function(r){

return r!==name;

});

recent.unshift(name);

if(recent.length>20){

recent=recent.slice(0,20);

}

localStorage.setItem(
'mega_recent',
JSON.stringify(recent)
);

}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────

document
.getElementById('search')
.addEventListener('input',function(){

var q=this.value.toLowerCase();

filtered=all.filter(function(c){

return (
c.name.toLowerCase().includes(q) ||
(c.category||'').toLowerCase().includes(q)
);

});

renderChannels();

});

// ─────────────────────────────────────────────
// KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────

document.addEventListener('keydown',function(e){

if(e.key==='ArrowDown'){

nextChannel();

}

});

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────

loadChannels();
