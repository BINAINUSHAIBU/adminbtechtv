<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHURCH TV NETWORK PRO MAX V2</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{margin:0;font-family:Arial;background:#07111f;color:#fff;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0f172a}
.logo{color:#ffd700;font-weight:bold}
button{margin:2px;padding:8px;border-radius:8px;border:none;cursor:pointer}
.container{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{width:280px;background:#08101d;overflow:auto;padding:10px}
.item{padding:10px;background:#182338;margin:5px 0;border-radius:8px;cursor:pointer}
.item:hover{background:#233250}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* PLAYER */
.player{height:340px;background:black;position:relative}
video{width:100%;height:100%;object-fit:cover}
.live{position:absolute;top:10px;left:10px;background:red;padding:5px 10px;border-radius:20px}

/* INFO */
.info{display:flex;justify-content:space-between;background:#0f172a;padding:10px}

/* CHANNELS */
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:10px}
.card{background:#182338;padding:10px;border-radius:10px;cursor:pointer}

/* CHAT */
.chat{position:fixed;right:0;top:0;width:260px;height:100%;background:#0b1220;display:none;flex-direction:column}
.chatbox{flex:1;overflow:auto;padding:10px}
.msg{background:#182338;margin:5px;padding:5px;border-radius:6px}
input{padding:8px;width:90%;margin:5px}

/* ADMIN */
.admin{position:fixed;bottom:0;left:0;background:#111827;width:100%;display:none;padding:10px}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">📺 CHURCH TV PRO MAX V2</div>
<div>
<button onclick="toggleChat()">💬 Chat</button>
<button onclick="openAdmin()">⚙ Admin</button>
<button onclick="openCamera()">📷 Camera</button>
<button onclick="pay()">💳 Subscribe</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>⛪ Church Channels</h3>

<div class="item" onclick="load(0)">
✝ :contentReference[oaicite:0]{index=0}
</div>

<div class="item" onclick="load(1)">✝ Living Faith Church</div>
<div class="item" onclick="load(2)">✝ Christ Embassy</div>
<div class="item" onclick="load(3)">✝ Dunamis</div>

<h3>YouTube Live</h3>
<div class="item" onclick="yt('https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig')">
📡 RCCG Live Stream
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live">🔴 LIVE</div>
<video id="video" controls autoplay></video>
</div>

<div class="info">
<div>
<h3 id="title">Church TV</h3>
<small id="group">Global Network</small>
</div>

<div>
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
<button onclick="share()">🔗</button>
</div>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<!-- CHAT -->
<div class="chat" id="chat">
<h3 style="padding:10px">💬 Live Chat</h3>
<div class="chatbox" id="chatbox"></div>
<input id="msg" placeholder="Type message..." onkeydown="if(event.key==='Enter')send()">
</div>

<!-- ADMIN -->
<div class="admin" id="admin">
<h3>⚙ Admin Panel</h3>
<input id="cname" placeholder="Channel Name">
<input id="curl" placeholder="Stream URL / RTMP / HLS">
<button onclick="add()">Add Channel</button>
<button onclick="closeAdmin()">Close</button>
</div>

<script>

let channels=[
{name:"RCCG TV",group:"Nigeria",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
{name:"Worship Live",group:"Global",url:"https://test-streams.mux.dev/test_001/stream.m3u8"},
{name:"Prayer Network",group:"Prayer",url:"https://test-streams.mux.dev/dai-discontinuity-deltatre/manifest.m3u8"},
{name:"Bible Study",group:"Teaching",url:"https://test-streams.mux.dev/pts_shift/master.m3u8"}
];

let i=0;
let video=document.getElementById("video");

/* PLAY HLS */
function load(index){
i=index;
let ch=channels[i];
document.getElementById("title").innerText=ch.name;
document.getElementById("group").innerText=ch.group;

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(ch.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else video.src=ch.url;

render();
}

/* YOUTUBE LIVE */
function yt(url){
video.pause();
video.src="";
alert("Switching to YouTube Live");
window.open(url,"_blank");
}

/* NEXT PREV */
function next(){i=(i+1)%channels.length;load(i);}
function prev(){i=(i-1+channels.length)%channels.length;load(i);}

/* RENDER */
function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";
channels.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<b>${c.name}</b><br><small>${c.group}</small>`;
div.onclick=()=>load(idx);
grid.appendChild(div);
});
}

/* CHAT */
function toggleChat(){
let c=document.getElementById("chat");
c.style.display=c.style.display==="flex"?"none":"flex";
c.style.flexDirection="column";
}

function send(){
let msg=document.getElementById("msg").value;
if(!msg)return;
let box=document.getElementById("chatbox");
let div=document.createElement("div");
div.className="msg";
div.innerText=msg;
box.appendChild(div);
document.getElementById("msg").value="";
}

/* ADMIN */
function openAdmin(){document.getElementById("admin").style.display="block";}
function closeAdmin(){document.getElementById("admin").style.display="none";}

function add(){
let name=document.getElementById("cname").value;
let url=document.getElementById("curl").value;
channels.push({name,group:"Custom",url});
render();
alert("Channel Added");
}

/* CAMERA */
function openCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream;
video.play();
});
}

/* PAYSTACK (DEMO) */
function pay(){
alert("Redirecting to Paystack Payment Gateway (Demo Mode)\nUpgrade Subscription Activated");
window.open("https://paystack.com","_blank");
}

render();
load(0);

</script>

</body>
</html>
