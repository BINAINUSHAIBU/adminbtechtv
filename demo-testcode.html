<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<meta name="theme-color" content="#0b0f1a"/>

<title>BTECH-TV WORLD ULTRA MAX X</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#050816;
--panel:#111827;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#ffffff;
--muted:#94a3b8;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:330px;
background:#0b1220;
overflow-y:auto;
padding:15px;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
color:var(--accent);
margin:15px 0 10px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PLAYER */
.player{
height:380px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
}

/* LIVE TAG */
.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

/* CONTROLS */
.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
padding:10px;
}

.controls button{
padding:10px;
background:var(--card);
border:none;
color:#fff;
border-radius:8px;
cursor:pointer;
}

.controls button:hover{
background:var(--accent);
color:#000;
}

/* SEARCH */
.search{
padding:10px;
display:flex;
gap:10px;
}

.search input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
background:#0f172a;
color:#fff;
}

/* CHANNEL GRID */
.channels{
flex:1;
overflow-y:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:12px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.card:hover{
border-color:var(--accent);
}

/* STATS */
.stats{
padding:10px;
font-size:13px;
color:var(--muted);
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>🌍 Countries</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/ng.m3u')">Nigeria</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/us.m3u')">USA</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/uk.m3u')">UK</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/countries/in.m3u')">India</div>

<h3>🎬 Categories</h3>

<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/news.m3u')">News</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/sport.m3u')">Sports</div>
<div class="cat" onclick="loadPlaylist('https://iptv-org.github.io/iptv/categories/movies.m3u')">Movies</div>

<h3>🔥 Tools</h3>

<div class="cat" onclick="toggleTheme()">Theme</div>
<div class="cat" onclick="shuffle()">Shuffle</div>
<div class="cat" onclick="toggleMini()">Mini Player</div>
<div class="cat" onclick="sleepTimer()">Sleep Timer</div>
<div class="cat" onclick="speedBoost()">Speed Boost</div>
<div class="cat" onclick="scanStreams()">Scan Streams</div>
<div class="cat" onclick="exportFav()">Export Fav</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<div class="live">LIVE</div>
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="toggleMute()">Mute</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
<button onclick="togglePiP()">PiP</button>
</div>

<div class="search">
<input oninput="search(this.value)" placeholder="Search channels..."/>
</div>

<div class="stats" id="stats">0 Channels Loaded</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;

async function loadPlaylist(url){
const res=await fetch(url);
const text=await res.text();

all=[];

const lines=text.split("\n");

for(let x=0;x<lines.length;x++){
if(lines[x].startsWith("#EXTINF")){
let name=lines[x].split(",").pop();
let url=lines[x+1];
if(url && url.startsWith("http")){
all.push({name,url});
}
}
}

filtered=[...all];
render();
stats();
}

function render(){
let g=document.getElementById("grid");
g.innerHTML="";
filtered.forEach((c,idx)=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=c.name;
d.onclick=()=>play(idx);
g.appendChild(d);
});
}

function play(idx){
i=idx;
let c=filtered[i];

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
stats();
}

function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}

function toggleMute(){video.muted=!video.muted;}
function toggleFullscreen(){video.requestFullscreen();}

function togglePiP(){
if(document.pictureInPictureElement){
document.exitPictureInPicture();
}else{
video.requestPictureInPicture();
}
}

function shuffle(){
filtered.sort(()=>Math.random()-0.5);
render();
}

function stats(){
document.getElementById("stats").innerText=
filtered.length+" Channels Loaded";
}

/* EXTRA FEATURES */
function toggleTheme(){document.body.classList.toggle("dark");}
function speedBoost(){video.playbackRate=1.2;}
function scanStreams(){alert("Scanning Streams...");}
function sleepTimer(){setTimeout(()=>video.pause(),1800000);alert("Sleep Timer Set");}
function exportFav(){alert("Export not linked in merged version");}
function toggleMini(){alert("Mini Player Toggle");}

loadPlaylist("https://iptv-org.github.io/iptv/index.country.m3u");

</script>

</body>
</html>
