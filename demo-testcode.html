<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH QUIZ SUPER ADMIN DASHBOARD</title>

<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

/* =========================
GLOBAL
========================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{cursor:pointer}

/* =========================
TOPBAR
========================= */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
}

/* =========================
LAYOUT
========================= */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* =========================
SIDEBAR
========================= */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.menu{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

.menu:hover{
background:var(--hover);
}

/* =========================
MAIN
========================= */
.main{
flex:1;
padding:15px;
overflow:auto;
}

/* =========================
RIGHT PANEL (ADMIN)
========================= */
.admin{
width:320px;
background:var(--panel);
padding:15px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,0.05);
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

/* =========================
QUIZ BOX
========================= */
.quiz{
background:var(--card);
padding:20px;
border-radius:10px;
margin-bottom:10px;
}

.option{
display:block;
padding:10px;
margin:8px 0;
background:#0f1628;
border-radius:8px;
cursor:pointer;
}

.option:hover{
background:var(--hover);
}

/* =========================
PROFILE
========================= */
.profile{
background:var(--card);
padding:15px;
border-radius:10px;
}

/* =========================
BUTTON
========================= */
.btn{
padding:10px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:bold;
width:100%;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
background:#0f1628;
color:white;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<h2>🎯 BTECH QUIZ SUPER ADMIN</h2>
<div id="userBox">👤 Guest</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="menu" onclick="showQuiz()">🧠 Quiz Engine</div>
<div class="menu" onclick="showLeaderboard()">🏆 Leaderboard</div>
<div class="menu" onclick="showProfile()">👤 Profile</div>
<div class="menu" onclick="showAdmin()">⚙ Admin Panel</div>

</div>

<!-- MAIN -->
<div class="main" id="main">

<h2>🚀 Welcome to Quiz Dashboard</h2>

</div>

<!-- ADMIN PANEL -->
<div class="admin">

<div class="box">
<h3>📊 Stats</h3>
<p>Total Questions: <span id="totalQ">3</span></p>
<p>Players: 1</p>
</div>

<div class="box">
<h3>➕ Add Question</h3>

<input id="q" placeholder="Question">
<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">
<input id="ans" placeholder="Correct Answer">

<button class="btn" onclick="addQ()">Add Question</button>
</div>

</div>

</div>

<script>

/* =========================
DATA
========================= */

let user={name:"Admin",role:"admin"};

let questions=[
{
q:"Capital of Nigeria?",
options:["Lagos","Abuja","Kano","Ibadan"],
answer:"Abuja"
},
{
q:"2 + 2 = ?",
options:["1","2","4","5"],
answer:"4"
},
{
q:"Capital of USA?",
options:["New York","Washington DC","Texas","LA"],
answer:"Washington DC"
}
];

let index=0;
let score=0;

/* =========================
INIT USER
========================= */

document.getElementById("userBox").innerText=
"👤 "+user.name+" ("+user.role+")";

/* =========================
QUIZ ENGINE
========================= */

function showQuiz(){

index=0;
score=0;
renderQuiz();

}

function renderQuiz(){

let q=questions[index];

document.getElementById("main").innerHTML=`

<div class="quiz">

<h3>🧠 Question ${index+1}</h3>

<h2>${q.q}</h2>

<div>
${q.options.map(o=>
`<div class="option" onclick="answer('${o}')">${o}</div>`
).join("")}
</div>

</div>

`;

}

/* =========================
ANSWER
========================= */

function answer(val){

if(val===questions[index].answer) score++;

index++;

if(index>=questions.length){

document.getElementById("main").innerHTML=
`<h2>🏁 Finished</h2><h3>Score: ${score}</h3>`;

return;

}

renderQuiz();

}

/* =========================
LEADERBOARD
========================= */

function showLeaderboard(){

document.getElementById("main").innerHTML=`
<h2>🏆 Leaderboard</h2>
<p>👤 Admin - ${score}</p>
`;

}

/* =========================
PROFILE
========================= */

function showProfile(){

document.getElementById("main").innerHTML=`
<div class="profile">
<h2>👤 Profile</h2>
<p>Name: ${user.name}</p>
<p>Role: ${user.role}</p>
</div>
`;

}

/* =========================
ADMIN
========================= */

function showAdmin(){

document.getElementById("main").innerHTML=`
<h2>⚙ Admin Control Active</h2>
<p>Use right panel to add questions</p>
`;

}

/* =========================
ADD QUESTION
========================= */

function addQ(){

questions.push({
q:q.value,
options:[o1.value,o2.value,o3.value,o4.value],
answer:ans.value
});

document.getElementById("totalQ").innerText=questions.length;

alert("Question Added!");

}

</script>

</body>
</html>
