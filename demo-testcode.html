<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD IPTV PLAYER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
display:flex;
overflow:hidden;
}

.sidebar{
width:320px;
background:#0b1020;
overflow-y:auto;
border-right:1px solid #222;
}

.logo{
padding:20px;
font-size:22px;
font-weight:bold;
text-align:center;
background:#111827;
}

.search{
padding:10px;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
}

.channels{
padding:10px;
}

.channel{
padding:12px;
margin-bottom:6px;
background:#1f2937;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.channel:hover{
background:#2563eb;
}

.player-area{
flex:1;
display:flex;
flex-direction:column;
}

video{
width:100%;
height:70vh;
background:black;
}

.info{
padding:15px;
background:#111827;
}

h2{
margin-bottom:10px;
}

.stats{
display:flex;
gap:20px;
margin-top:10px;
}

.badge{
background:#2563eb;
padding:6px 12px;
border-radius:6px;
}
</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
WORLD IPTV
</div>

<div class="search">
<input type="text" id="search" placeholder="Search channel...">
</div>

<div class="channels" id="channelList"></div>

</div>

<div class="player-area">

<video id="video" controls autoplay></video>

<div class="info">
<h2 id="channelTitle">Select Channel</h2>

<div class="stats">
<div class="badge">LIVE</div>
<div class="badge">HLS.js</div>
<div class="badge">IPTV</div>
</div>

</div>

</div>

<script>

const channels = [

{
name:"BEIN Sports News",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/2296"
},

{
name:"BEIN NBA HD",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/49691"
},

{
name:"ALKASS 1 HD",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/1138"
},

{
name:"ALKASS 2 HD",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/1139"
},

{
name:"MBC Action",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/2168"
},

{
name:"MBC Drama",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/319"
},

{
name:"Abu Dhabi Sports 1",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/1119"
},

{
name:"ON Time Sports",
url:"http://server.sibfungold.info:8080/pacha-man1/e0VaVPskUa/53258"
}

];

const list = document.getElementById("channelList");

channels.forEach(ch=>{

const div=document.createElement("div");

div.className="channel";

div.innerText=ch.name;

div.onclick=()=>playChannel(ch);

list.appendChild(div);

});

function playChannel(channel){

document.getElementById("channelTitle").innerText=channel.name;

const video=document.getElementById("video");

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(channel.url);

hls.attachMedia(video);

}

else{

video.src=channel.url;

}

}

document.getElementById("search").addEventListener("keyup",function(){

const term=this.value.toLowerCase();

document.querySelectorAll(".channel").forEach(c=>{

c.style.display=
c.innerText.toLowerCase().includes(term)
? "block"
: "none";

});

});

</script>

</body>
</html>
