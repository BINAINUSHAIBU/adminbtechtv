<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTECH-TV PRO MAX Ultimate</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;font-family:Arial;background:#050816;color:#fff;display:flex;height:100vh}
.sidebar{width:280px;background:#0d1324;padding:15px;overflow:auto}
.main{flex:1;padding:15px;overflow:auto}
.nav-btn{display:block;width:100%;margin:4px 0;padding:10px;background:#152445;color:#fff;border:0;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#101d39;padding:15px;border-radius:10px;text-align:center}
.player{height:320px;background:#000;border-radius:10px;margin:10px 0}
video{width:100%;height:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333}
button{padding:6px 10px}
</style>
</head>
<body>
<div class="sidebar">
<h2>📺 BTECH TV</h2>
<button class="nav-btn">Dashboard</button>
<button class="nav-btn">All Channels</button>
<button class="nav-btn">Free Channels</button>
<button class="nav-btn">Pay To View</button>
<button class="nav-btn">BTECH Super Channels</button>
<button class="nav-btn">Locked Channels</button>
<button class="nav-btn">Users</button>
<button class="nav-btn">Subscription Plans</button>
<button class="nav-btn">Settings</button>
</div>

<div class="main">
<h1>BTECH-TV PRO MAX Ultimate Dashboard</h1>

<div class="stats">
<div class="stat"><h3>Total</h3><div>40,000</div></div>
<div class="stat"><h3>Free</h3><div>26,017</div></div>
<div class="stat"><h3>Pay TV</h3><div>13,983</div></div>
<div class="stat"><h3>Locked</h3><div>6,079</div></div>
</div>

<div class="player">
<video controls></video>
</div>

<input id="search" placeholder="Search channels" style="width:100%;padding:10px;margin:10px 0">

<table>
<thead>
<tr>
<th>Channel Name</th>
<th>Category</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="channelTable"></tbody>
</table>
</div>

<script>
const categories=["Sports","Movies","News","Kids","Entertainment","Music","Documentary","Education"];
let channels=[];
for(let i=801;i<=40000;i++){
channels.push({
id:i,
name:"BTECH Channel "+i,
category:categories[Math.floor(Math.random()*categories.length)],
type:Math.random()>0.65?"Pay To View":"Free",
status:Math.random()>0.85?"Locked":"Unlocked"
});
}
let page=0,limit=50;

function render(){
const tb=document.getElementById("channelTable");
tb.innerHTML="";
channels.slice(page*limit,page*limit+limit).forEach(c=>{
tb.innerHTML+=`<tr>
<td>${c.name}</td>
<td>${c.category}</td>
<td>${c.type}</td>
<td>${c.status}</td>
<td>
<button onclick="toggleLock(${c.id})">Lock</button>
<button onclick="editChannel(${c.id})">Edit</button>
<button onclick="deleteChannel(${c.id})">Delete</button>
</td></tr>`;
});
tb.innerHTML+=`<tr><td colspan="5"><button onclick="loadMore()">Load More Channels</button></td></tr>`;
}
function loadMore(){page++;render();}
function toggleLock(id){let c=channels.find(x=>x.id===id);c.status=c.status==="Locked"?"Unlocked":"Locked";render();}
function editChannel(id){let c=channels.find(x=>x.id===id);let n=prompt("Rename",c.name);if(n){c.name=n;render();}}
function deleteChannel(id){channels=channels.filter(x=>x.id!==id);render();}
render();
</script>
</body>
</html>
