<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>BTECH-TV OFFLINE WORLD</title>

<style>

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--success:#16a34a;
--danger:#ef4444;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
}

body{
display:flex;
flex-direction:column;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:70px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.05);
gap:15px;
}

.logo{
font-size:24px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
}

.top-buttons{
display:flex;
gap:10px;
overflow-x:auto;
}

.top-buttons button{
padding:10px 16px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
font-weight:bold;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
flex:1;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:#0f172a;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar h3{
margin:15px 0 10px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(5px);
}

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */

.player{
height:360px;
background:black;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:10;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.92);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

.overlay h1{
font-size:60px;
margin-bottom:10px;
}

.overlay p{
color:var(--muted);
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;
gap:10px;
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
font-size:13px;
color:var(--muted);
}

.clock{
font-size:12px;
margin-top:5px;
color:var(--muted);
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 15px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* =========================
SEARCH
========================= */

.stats{
padding:10px 15px;
background:#0f172a;
font-size:12px;
color:var(--muted);
border-bottom:1px solid rgba(255,255,255,.05);
}

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
flex-wrap:wrap;
}

.search-box input,
.search-box select{
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.search-box input{
flex:1;
min-width:220px;
}

/* =========================
CHANNELS
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:14px;
}

.channel{
background:var(--card);
padding:15px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
gap:12px;
}

.channel:hover{
background:var(--hover);
border-color:var(--accent);
transform:translateY(-2px);
}

.channel.active{
border-color:var(--accent);
background:#00bfff22;
}

.left{
display:flex;
align-items:center;
gap:12px;
overflow:hidden;
}

.left img{
width:70px;
height:70px;
border-radius:12px;
object-fit:cover;
background:black;
}

.info{
overflow:hidden;
}

.info h4{
font-size:17px;
margin-bottom:6px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
font-size:13px;
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:6px;
}

.badge{
padding:6px 12px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.country{
background:#2563eb;
}

.fav{
font-size:22px;
cursor:pointer;
}

.fav.on{
color:gold;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.container{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
max-height:240px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.05);
}

.channels{
grid-template-columns:1fr;
}

.player{
height:240px;
}

.topbar{
flex-direction:column;
height:auto;
padding:12px;
}

.now-playing{
flex-direction:column;
align-items:flex-start;
}

}

</style>
</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV OFFLINE
</div>

<div class="top-buttons">

<button class="active" onclick="setTab('all',this)">
All
</button>

<button onclick="setTab('favs',this)">
⭐ Favorites
</button>

<button onclick="setTab('recent',this)">
🕘 Recent
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<!-- CONTAINER -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>📂 Offline Categories</h3>

<div class="cat" onclick="filterGroup('News')">
📰 News
</div>

<div class="cat" onclick="filterGroup('Sports')">
⚽ Sports
</div>

<div class="cat" onclick="filterGroup('Movies')">
🎬 Movies
</div>

<div class="cat" onclick="filterGroup('Music')">
🎵 Music
</div>

<div class="cat" onclick="filterGroup('Kids')">
👶 Kids
</div>

<div class="cat" onclick="filterGroup('Documentary')">
📚 Documentary
</div>

<h3>💾 Offline Mode</h3>

<div class="cat">
✅ No Internet Required
</div>

<div class="cat">
✅ Embedded Local Channels
</div>

<div class="cat">
✅ Single HTML File
</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 OFFLINE PLAYER
</div>

<video
id="video"
controls
autoplay
playsinline
preload="auto"
></video>

<div class="overlay" id="overlay">

<h1>📺</h1>

<p>
Offline BTECH-TV Ready
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Offline IPTV System
</p>

<div class="clock" id="clock">
--:--
</div>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

</div>

</div>

<!-- STATS -->

<div class="stats" id="stats">
0 Offline Channels Loaded
</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search offline channels..."
oninput="searchChannels(this.value)"
>

<select onchange="sortChannels(this.value)">
<option value="az">Sort A-Z</option>
<option value="za">Sort Z-A</option>
</select>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* =========================
OFFLINE CHANNELS
========================= */

const all=[

{
id:1,
name:'BTECH News',
group:'News',
country:'NG',
logo:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCI+PHJlY3Qgd2lkdGg9IjcwIiBoZWlnaHQ9IjcwIiBmaWxsPSIjMDBiZmZmIi8+PHRleHQgeD0iMzUiIHk9IjQwIiBmb250LXNpemU9IjE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIj5ORVdTPC90ZXh0Pjwvc3ZnPg==',
url:'sample.mp4'
},

{
id:2,
name:'BTECH Sports',
group:'Sports',
country:'US',
logo:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCI+PHJlY3Qgd2lkdGg9IjcwIiBoZWlnaHQ9IjcwIiBmaWxsPSIjMTZhMzRhIi8+PHRleHQgeD0iMzUiIHk9IjQwIiBmb250LXNpemU9IjE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmZmIj5TUE9SVDwvdGV4dD48L3N2Zz4=',
url:'sample.mp4'
},

{
id:3,
name:'BTECH Movies',
group:'Movies',
country:'UK',
logo:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCI+PHJlY3Qgd2lkdGg9IjcwIiBoZWlnaHQ9IjcwIiBmaWxsPSIjZWY0NDQ0Ii8+PHRleHQgeD0iMzUiIHk9IjQwIiBmb250LXNpemU9IjE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmZmIj5NT1ZJRTwvdGV4dD48L3N2Zz4=',
url:'sample.mp4'
},

{
id:4,
name:'BTECH Music',
group:'Music',
country:'FR',
logo:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCI+PHJlY3Qgd2lkdGg9IjcwIiBoZWlnaHQ9IjcwIiBmaWxsPSIjZjU5ZTBiIi8+PHRleHQgeD0iMzUiIHk9IjQwIiBmb250LXNpemU9IjE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIj5NVVNJQzwvdGV4dD48L3N2Zz4=',
url:'sample.mp4'
}

];

let filteredChannels=[...all];
let currentIndex=0;
let dark=true;

const video=document.getElementById('video');

const favs=JSON.parse(
localStorage.getItem('offline_favs') || '{}'
);

const recent=JSON.parse(
localStorage.getItem('offline_recent') || '[]'
);

/* =========================
CLOCK
========================= */

function tick(){

document.getElementById('clock').innerText=
new Date().toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit',
second:'2-digit'
});

}

setInterval(tick,1000);

tick();

/* =========================
FLAG
========================= */

function flag(cc){

if(!cc || cc.length!==2){
return '🌐';
}

const a=0x1F1E6;

return String.fromCodePoint(
a+cc.charCodeAt(0)-65,
a+cc.charCodeAt(1)-65
);

}

/* =========================
RENDER
========================= */

function renderChannels(){

const box=document.getElementById('channelList');

box.innerHTML='';

filteredChannels.forEach((c,index)=>{

const div=document.createElement('div');

div.className='channel';

if(index===currentIndex){
div.classList.add('active');
}

div.innerHTML=`

<div class="left">

<img src="${c.logo}">

<div class="info">

<h4>${flag(c.country)} ${c.name}</h4>

<small>${c.group}</small>

</div>

</div>

<div class="status">

<span class="badge free">
OFFLINE
</span>

<div
class="fav ${favs[c.id] ? 'on':''}"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favs[c.id] ? '★':'☆'}
</div>

</div>

`;

div.onclick=()=>playChannel(index);

box.appendChild(div);

});

updateStats();

}

/* =========================
PLAY
========================= */

function playChannel(index){

currentIndex=index;

const channel=filteredChannels[index];

if(!channel){
return;
}

document.getElementById('overlay').style.display='none';

document.getElementById('channelName').innerText=
channel.name;

document.getElementById('channelGroup').innerText=
channel.group;

video.src=channel.url;

video.play().catch(()=>{});

addRecent(channel.id);

renderChannels();

}

/* =========================
SEARCH
========================= */

function searchChannels(q){

const value=q.toLowerCase();

filteredChannels=all.filter(c=>

c.name.toLowerCase().includes(value) ||

c.group.toLowerCase().includes(value)

);

renderChannels();

}

/* =========================
SORT
========================= */

function sortChannels(type){

if(type==='az'){

filteredChannels.sort((a,b)=>
a.name.localeCompare(b.name)
);

}else{

filteredChannels.sort((a,b)=>
b.name.localeCompare(a.name)
);

}

renderChannels();

}

/* =========================
GROUP FILTER
========================= */

function filterGroup(group){

filteredChannels=all.filter(c=>
c.group===group
);

renderChannels();

}

/* =========================
TABS
========================= */

function setTab(type,btn){

document
.querySelectorAll('.top-buttons button')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

if(type==='all'){

filteredChannels=[...all];

}

if(type==='favs'){

filteredChannels=all.filter(c=>favs[c.id]);

}

if(type==='recent'){

filteredChannels=[];

recent.forEach(id=>{

const ch=all.find(c=>c.id===id);

if(ch){
filteredChannels.push(ch);
}

});

}

renderChannels();

}

/* =========================
FAVORITES
========================= */

function toggleFav(id){

if(favs[id]){
delete favs[id];
}else{
favs[id]=1;
}

localStorage.setItem(
'offline_favs',
JSON.stringify(favs)
);

renderChannels();

}

/* =========================
RECENT
========================= */

function addRecent(id){

let arr=recent.filter(r=>r!==id);

arr.unshift(id);

localStorage.setItem(
'offline_recent',
JSON.stringify(arr.slice(0,20))
);

}

/* =========================
NEXT / PREV
========================= */

function nextChannel(){

currentIndex++;

if(currentIndex>=filteredChannels.length){
currentIndex=0;
}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){
currentIndex=filteredChannels.length-1;
}

playChannel(currentIndex);

}

/* =========================
PIP
========================= */

async function togglePiP(){

try{

if(document.pictureInPictureElement){

await document.exitPictureInPicture();

}else{

await video.requestPictureInPicture();

}

}catch(err){}

}

/* =========================
SHARE
========================= */

function shareChannel(){

const channel=filteredChannels[currentIndex];

navigator.clipboard.writeText(channel.name);

alert('Channel copied!');

}

/* =========================
THEME
========================= */

function toggleTheme(){

dark=!dark;

document.documentElement.style.setProperty(
'--bg',
dark?'#0b0f1a':'#f1f5f9'
);

document.documentElement.style.setProperty(
'--panel',
dark?'#111827':'#ffffff'
);

document.documentElement.style.setProperty(
'--card',
dark?'#1b2438':'#e2e8f0'
);

document.documentElement.style.setProperty(
'--text',
dark?'#ffffff':'#000000'
);

}

/* =========================
STATS
========================= */

function updateStats(){

document.getElementById('stats').innerText=
filteredChannels.length+
' Offline Channels Loaded';

}

/* =========================
KEYBOARD
========================= */

document.addEventListener('keydown',function(e){

if(e.key==='ArrowRight'){
nextChannel();
}

if(e.key==='ArrowLeft'){
prevChannel();
}

});

/* =========================
INIT
========================= */

renderChannels();

</script>

</body>
</html>
