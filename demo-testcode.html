<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nigeria Hotel Booking System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

header {
  background: #0a66c2;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

input, button, select {
  padding: 10px;
  margin: 5px;
}

.hotel {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

button {
  cursor: pointer;
  background: #0a66c2;
  color: white;
  border: none;
  border-radius: 5px;
}

button:hover {
  background: #084a91;
}

.flex {
  display: flex;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<header>
<h2>🏨 Nigeria Hotel Booking Portal</h2>
</header>

<div class="container">

<!-- SEARCH -->
<input id="search" placeholder="Search city (e.g Lagos, Abuja)" onkeyup="renderHotels()">

<!-- ADMIN ADD HOTEL -->
<h3>➕ Add Hotel (Admin)</h3>
<input id="name" placeholder="Hotel Name">
<input id="city" placeholder="City">
<input id="price" placeholder="Price per night">
<button onclick="addHotel()">Add Hotel</button>

<hr>

<!-- HOTEL LIST -->
<h3>🏨 Available Hotels</h3>
<div id="hotels"></div>

<hr>

<!-- BOOKINGS -->
<h3>📅 My Bookings</h3>
<div id="bookings"></div>

</div>

<script>

let hotels = JSON.parse(localStorage.getItem("hotels")) || [
  {name:"Eko Hotel & Suites", city:"Lagos", price:45000},
  {name:"Transcorp Hilton", city:"Abuja", price:60000},
  {name:"Sun Heaven Hotel", city:"Port Harcourt", price:30000},
];

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

function save(){
  localStorage.setItem("hotels", JSON.stringify(hotels));
  localStorage.setItem("bookings", JSON.stringify(bookings));
}

function renderHotels(){
  let search = document.getElementById("search").value.toLowerCase();
  let html = "";

  hotels.filter(h => h.city.toLowerCase().includes(search) || h.name.toLowerCase().includes(search))
  .forEach((h, i) => {
    html += `
      <div class="hotel">
        <h3>${h.name}</h3>
        <p>📍 ${h.city}</p>
        <p>💰 ₦${h.price} per night</p>
        <button onclick="bookHotel(${i})">Book Now</button>
      </div>
    `;
  });

  document.getElementById("hotels").innerHTML = html;
  renderBookings();
}

function addHotel(){
  let name = document.getElementById("name").value;
  let city = document.getElementById("city").value;
  let price = document.getElementById("price").value;

  hotels.push({name, city, price});
  save();
  renderHotels();
}

function bookHotel(i){
  let user = prompt("Enter your name:");
  bookings.push({
    user,
    hotel: hotels[i].name,
    city: hotels[i].city,
    date: new Date().toLocaleString()
  });

  save();
  renderBookings();
  alert("Booking successful!");
}

function renderBookings(){
  let html = "";

  bookings.forEach(b => {
    html += `
      <div class="hotel">
        <h4>${b.hotel}</h4>
        <p>👤 ${b.user}</p>
        <p>📍 ${b.city}</p>
        <p>⏰ ${b.date}</p>
      </div>
    `;
  });

  document.getElementById("bookings").innerHTML = html;
}

renderHotels();

</script>

</body>
</html>
