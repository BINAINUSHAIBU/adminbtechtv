<!DOCTYPE html>
<html>
<head>
<title>Global Hotel Booking Portal</title> 
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial; margin:0; background:#0f172a; color:white;}
header {padding:20px; background:#111827; text-align:center;}
.container {padding:20px;}
.search-box {display:flex; gap:10px; flex-wrap:wrap;}
input, select {
 padding:10px; border-radius:8px; border:none; width:200px;
}
button {
 padding:10px 20px; background:#22c55e; border:none;
 color:white; border-radius:8px; cursor:pointer;
}
.hotel-grid {
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:15px; margin-top:20px;
}
.card {
 background:#1f2937; padding:15px; border-radius:10px;
}
.role-bar {
 display:flex; justify-content:space-between;
 background:#111827; padding:10px;
}
</style>
</head>

<body>

<header>
<h1>🌍 Global Hotel Booking Portal</h1>
<p>Book hotels anywhere in the world</p>
</header>

<div class="role-bar">
<button>👤 User</button>
<button>🏨 Hotel Dashboard</button>
<button>👑 Super Admin</button>
</div>

<div class="container">

<h2>Search Hotels</h2>

<div class="search-box">
<input placeholder="City or Country">
<input type="date">
<input type="date">
<select>
<option>Guests</option>
<option>1</option><option>2</option><option>3+</option>
</select>
<button>Search</button>
</div>

<div class="hotel-grid">

<div class="card">
<h3>Luxury Palace Hotel</h3>
<p>📍 Dubai, UAE</p>
<p>⭐ 4.8 Rating</p>
<p>💰 $120/night</p>
<button>Book Now</button>
</div>

<div class="card">
<h3>Ocean View Resort</h3>
<p>📍 Maldives</p>
<p>⭐ 4.9 Rating</p>
<p>💰 $250/night</p>
<button>Book Now</button>
</div>

<div class="card">
<h3>City Comfort Inn</h3>
<p>📍 London, UK</p>
<p>⭐ 4.5 Rating</p>
<p>💰 $90/night</p>
<button>Book Now</button>
</div>

</div>

</div>

</body>
</html>
