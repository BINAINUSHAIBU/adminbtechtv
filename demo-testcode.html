<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📺 BTECH-TV PRO MAX IPTV 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050816;color:#fff;display:flex;height:100vh;overflow:hidden;}

/* AUTH */
#authBox{
position:fixed;inset:0;background:#050816;
display:flex;justify-content:center;align-items:center;z-index:9999;
}
.auth-card{
background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;
border:1px solid #1d2b4f;
}
.auth-card input{
width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;
background:#101a31;color:#fff;
}
.auth-card button{
width:100%;padding:10px;margin-top:10px;background:#00d4ff;
border:none;border-radius:6px;cursor:pointer;
}

/* SIDEBAR */
.sidebar{
width:280px;background:#0d1324;padding:15px;overflow-y:auto;
border-right:1px solid #1d2b4f;
}
.logo{font-size:20px;font-weight:900;color:#00d4ff;}
.sub{font-size:12px;color:#8ea2d9;margin-bottom:10px;}
.menu-title{color:#00d4ff;margin:15px 0 10px;font-size:12px}
.nav-btn{
width:100%;padding:9px;margin:4px 0;background:#121c33;border:none;
border-radius:8px;color:#fff;cursor:pointer;
}
.nav-btn:hover{background:#1e2f57}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px;}
.topbar input{
padding:10px;border-radius:8px;border:none;background:#101a31;
color:#fff;width:260px;
}
.live{background:red;padding:6px 12px;border-radius:20px}

/* HERO */
.hero{
background:linear-gradient(135deg,#07132f,#0f1d45);
padding:10px;border-radius:10px;margin-bottom:10px;
}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.stat{background:#101d39;padding:8px;border-radius:8px;text-align:center;}

/* PLAYER */
.player{
background:#000;border-radius:10px;overflow:hidden;height:320px;
}
video{width:100%;height:100%;}

/* CONTROLS */
.controls{
display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;
}
.controls button{
padding:8px 10px;border:none;border-radius:6px;background:#152445;
color:#fff;cursor:pointer;
}
.controls button:hover{background:#00d4ff;color:#000}

/* CHANNELS */
.channels{
flex:1;overflow-y:auto;display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:10px;
}
.card{
background:#111a31;padding:10px;border-radius:10px;cursor:pointer;
border:1px solid #1f355d;
}
.card:hover{transform:scale(1.03);border-color:#00d4ff;}
.badge{background:red;padding:3px 6px;border-radius:10px;font-size:10px;float:right;}

/* MODALS */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,0.8);
display:none;justify-content:center;align-items:center;z-index:99999;
}
.modal-box{
background:#0d1324;padding:20px;border-radius:12px;width:320px;text-align:center;
}
.modal-box button{
width:100%;padding:10px;margin:6px 0;border:none;border-radius:6px;
cursor:pointer;
}
.upgrade{background:#ffcc00;color:#000;}
.pay{background:#00d4ff;color:#000;}
.close{background:#333;color:#fff;}

#timerBar{
position:fixed;top:10px;right:10px;background:#00d4ff;color:#000;
padding:8px 12px;border-radius:8px;font-weight:bold;z-index:999;
}
</style>
</head>

<body>

<div id="timerBar">Trial Active</div>

<!-- AUTH -->
<div id="authBox">
<div class="auth-card">
<h3>🔐 BTECH-TV PRO MAX</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- UPGRADE -->
<div class="modal" id="upgradeModal">
<div class="modal-box">
<h3>⛔ Trial Expired</h3>
<button class="upgrade" onclick="openPayment()">Upgrade</button>
</div>
</div>

<!-- PAYMENT -->
<div class="modal" id="paymentModal">
<div class="modal-box">
<h3>💳 Payment</h3>
<button onclick="selectPlan('Premium')">Premium</button>
<button onclick="selectPlan('Ultra')">Ultra</button>
<button class="pay" onclick="payNow()">Pay</button>
<button class="close" onclick="closePayment()">Close</button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">📺 PRO MAX</div>
<div class="sub">Ultra IPTV Engine X</div>

<div class="menu-title">🌍 Countries</div>
<button class="nav-btn" onclick="load('ng')">🇳🇬 Nigeria</button>
<button class="nav-btn" onclick="load('us')">🇺🇸 USA</button>
<button class="nav-btn" onclick="load('uk')">🇬🇧 UK</button>
<button class="nav-btn" onclick="load('in')">🇮🇳 India</button>
<button class="nav-btn" onclick="loadUltra()">🌍 Global</button>

<div class="menu-title">🎬 Categories</div>
<button class="nav-btn" onclick="loadCat('news')">📰 News</button>
<button class="nav-btn" onclick="loadCat('sports')">⚽ Sports</button>
<button class="nav-btn" onclick="loadCat('movies')">🎬 Movies</button>
<button class="nav-btn" onclick="loadCat('music')">🎵 Music</button>
<button class="nav-btn" onclick="loadCat('kids')">👶 Kids</button>

<div class="menu-title">🗣 Languages</div>
<button class="nav-btn" onclick="load('eng')">🇬🇧 English</button>
<button class="nav-btn" onclick="load('spa')">🇪🇸 Spanish</button>
<button class="nav-btn" onclick="load('ara')">🇸🇦 Arabic</button>

<div class="menu-title">🔥 Tools</div>
<button class="nav-btn" onclick="scan()">📡 Scan</button>
<button class="nav-btn" onclick="boost()">⚡ Boost</button>
<button class="nav-btn" onclick="pip()">📺 PiP</button>
<button class="nav-btn" onclick="repair()">🛠 Repair</button>
<button class="nav-btn" onclick="logout()">🚪 Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<input oninput="search(this.value)" placeholder="Search IPTV...">
<div class="live">LIVE</div>
</div>

<div class="hero">
<h3>PRO MAX DASHBOARD</h3>
<div class="stats">
<div class="stat">📺 <div id="total">0</div></div>
<div class="stat">⭐ <div id="fav">0</div></div>
<div class="stat">⚫ <div id="dead">0</div></div>
<div class="stat">🌍 <div id="live">0</div></div>
</div>
</div>

<div class="player">
<video id="video" controls autoplay muted></video>
</div>

<div class="controls">
<button onclick="prev()">◀ Prev</button>
<button onclick="next()">Next ▶</button>
<button onclick="toggleMute()">🔊</button>
<button onclick="toggleFull()">⛶</button>
</div>

<div class="channels" id="grid"></div>

</div>

<script>

let all=[],filtered=[],i=0;
let video=document.getElementById("video");
let hls;
const TRIAL=3600000;

/* AUTH */
function register(){
localStorage.setItem("user",JSON.stringify({e:email.value,p:pass.value}));
alert("Registered");
}

function login(){
let u=JSON.parse(localStorage.getItem("user"));
if(!u||u.e!==email.value||u.p!==pass.value)return alert("Invalid");

if(!localStorage.getItem("start"))localStorage.setItem("start",Date.now());

authBox.style.display="none";
timer();
loadUltra();
}

function logout(){localStorage.clear();location.reload();}

/* TIMER */
function timer(){
setInterval(()=>{
let s=localStorage.getItem("start");
if(!s)return;

if(localStorage.getItem("premium")==="true"){
timerBar.innerText="PREMIUM ACTIVE";
return;
}

let d=TRIAL-(Date.now()-s);
if(d<=0){
timerBar.innerText="EXPIRED";
upgradeModal.style.display="flex";
return;
}

timerBar.innerText=`Trial ${Math.floor(d/60000)}m`;

},1000);
}

/* PAYMENT */
function openPayment(){paymentModal.style.display="flex";}
function closePayment(){paymentModal.style.display="none";}
function selectPlan(p){plan=p;alert(p);}
function payNow(){
localStorage.setItem("premium","true");
paymentModal.style.display="none";
upgradeModal.style.display="none";
}

/* IPTV */
async function load(code){
await loadM3U(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
}
async function loadCat(c){
await loadM3U(`https://iptv-org.github.io/iptv/categories/${c}.m3u`);
}
async function loadUltra(){
await loadM3U("https://iptv-org.github.io/iptv/index.country.m3u");
}

async function loadM3U(url){
let res=await fetch(url);
let txt=await res.text();

all=[];filtered=[];i=0;

txt.split("\n").forEach((l,x,a)=>{
if(l.startsWith("#EXTINF")){
let name=l.split(",").pop();
let url=a[x+1];
if(url?.startsWith("http"))all.push({name,url});
}
});

filtered=[...all];
render();
stats();
}

/* RENDER */
function render(){
grid.innerHTML="";
filtered.forEach((c,idx)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<div class="badge">LIVE</div>${c.name}`;
div.onclick=()=>play(idx);
grid.appendChild(div);
});
}

/* PLAY */
function play(idx){
i=idx;
let c=filtered[i];

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* NAV */
function search(q){
filtered=all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
render();
}
function next(){i=(i+1)%filtered.length;play(i);}
function prev(){i=(i-1+filtered.length)%filtered.length;play(i);}
function toggleMute(){video.muted=!video.muted;}
function toggleFull(){video.requestFullscreen();}

/* TOOLS */
function scan(){alert("Scanning...");}
function boost(){video.playbackRate=1.2;}
function repair(){alert("Repairing streams...");}
function pip(){video.requestPictureInPicture();}

/* STATS */
function stats(){
total.innerText=all.length;
live.innerText=all.length;
dead.innerText=0;
fav.innerText=0;
}

loadUltra();

</script>

</body>
</html>
