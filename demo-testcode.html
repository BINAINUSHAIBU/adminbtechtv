<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTECH-TV WORLD IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
ROOT
========================= */

:root{
--bg:#0b0f1a;
--panel:#111827;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
--border:rgba(255,255,255,.06);
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button{
border:none;
cursor:pointer;
}

/* =========================
TOPBAR
========================= */

.topbar{
height:65px;
background:var(--panel);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid var(--border);
gap:15px;
}

.logo{
font-size:22px;
font-weight:bold;
color:var(--accent);
white-space:nowrap;
}

.top-buttons{
display:flex;
gap:10px;
overflow:auto;
}

.top-buttons button{
padding:10px 14px;
background:var(--card);
color:white;
border-radius:8px;
font-size:12px;
transition:.3s;
white-space:nowrap;
}

.top-buttons button:hover,
.top-buttons button.active{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 65px);
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
background:#0f172a;
overflow-y:auto;
padding:15px;
border-right:1px solid var(--border);
}

.sidebar h3{
margin-bottom:15px;
color:var(--accent);
font-size:16px;
}

.cat{
background:var(--card);
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* =========================
MAIN
========================= */

.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* =========================
PLAYER
========================= */

.player{
height:340px;
background:black;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

.live{
position:absolute;
top:15px;
left:15px;
background:red;
padding:7px 15px;
border-radius:20px;
font-size:12px;
font-weight:bold;
z-index:5;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

.overlay h1{
font-size:60px;
margin-bottom:15px;
}

.overlay p{
color:var(--muted);
}

/* =========================
NOW PLAYING
========================= */

.now-playing{
background:var(--panel);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
}

.now-info h2{
font-size:18px;
margin-bottom:5px;
}

.now-info p{
font-size:13px;
color:var(--muted);
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
padding:10px 14px;
background:var(--card);
color:white;
border-radius:8px;
transition:.3s;
}

.controls button:hover{
background:var(--hover);
}

/* =========================
SEARCH
========================= */

.search-box{
padding:12px;
background:var(--panel);
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

/* =========================
CHANNEL GRID
========================= */

.channels{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

.channel{
background:var(--card);
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
transition:.3s;
border:1px solid transparent;
}

.channel:hover{
background:var(--hover);
border-color:var(--accent);
transform:translateY(-2px);
}

.channel.active{
background:#00bfff22;
border-color:var(--accent);
}

.left{
display:flex;
gap:12px;
align-items:center;
overflow:hidden;
}

.left img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
background:black;
}

.info{
overflow:hidden;
}

.info h4{
font-size:14px;
margin-bottom:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info small{
color:#cbd5e1;
}

.status{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:6px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.free{
background:#16a34a;
}

.paid{
background:#dc2626;
}

.locked{
background:#f59e0b;
}

.unlocked{
background:#2563eb;
}

.fav{
font-size:18px;
cursor:pointer;
}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

.sidebar{
display:none;
}

.player{
height:240px;
}

.channels{
grid-template-columns:1fr;
}

.now-playing{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

}

</style>
</head>

<body>

<!-- =========================
TOPBAR
========================= -->

<div class="topbar">

<div class="logo">
📺 BTECH-TV WORLD IPTV
</div>

<div class="top-buttons">

<button class="active" onclick="filterCat('All',this)">
All
</button>

<button onclick="filterCat('Sports',this)">
Sports
</button>

<button onclick="filterCat('Movies',this)">
Movies
</button>

<button onclick="filterCat('News',this)">
News
</button>

<button onclick="filterCat('Africa',this)">
Africa
</button>

<button onclick="filterCat('Europe',this)">
Europe
</button>

<button onclick="filterCat('Asia',this)">
Asia
</button>

<button onclick="showFavorites(this)">
Favorites
</button>

<button onclick="toggleTheme()">
Theme
</button>

</div>

</div>

<!-- =========================
LAYOUT
========================= -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>
🌍 WORLD CHANNELS
</h3>

<div class="cat" onclick="filterCat('Nigeria')">🇳🇬 Nigeria</div>
<div class="cat" onclick="filterCat('South Africa')">🇿🇦 South Africa</div>
<div class="cat" onclick="filterCat('Ghana')">🇬🇭 Ghana</div>
<div class="cat" onclick="filterCat('Kenya')">🇰🇪 Kenya</div>
<div class="cat" onclick="filterCat('UK')">🇬🇧 UK</div>
<div class="cat" onclick="filterCat('France')">🇫🇷 France</div>
<div class="cat" onclick="filterCat('Germany')">🇩🇪 Germany</div>
<div class="cat" onclick="filterCat('Italy')">🇮🇹 Italy</div>
<div class="cat" onclick="filterCat('Spain')">🇪🇸 Spain</div>
<div class="cat" onclick="filterCat('India')">🇮🇳 India</div>
<div class="cat" onclick="filterCat('China')">🇨🇳 China</div>
<div class="cat" onclick="filterCat('Japan')">🇯🇵 Japan</div>
<div class="cat" onclick="filterCat('South Korea')">🇰🇷 Korea</div>
<div class="cat" onclick="filterCat('Pakistan')">🇵🇰 Pakistan</div>
<div class="cat" onclick="filterCat('USA')">🇺🇸 USA</div>
<div class="cat" onclick="filterCat('Canada')">🇨🇦 Canada</div>
<div class="cat" onclick="filterCat('Brazil')">🇧🇷 Brazil</div>
<div class="cat" onclick="filterCat('Australia')">🇦🇺 Australia</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PLAYER -->

<div class="player">

<div class="live">
🔴 LIVE
</div>

<video
id="video"
controls
autoplay
playsinline
></video>

<div class="overlay" id="overlay">

<h1>🚀</h1>

<p>
Loading IPTV Channels...
</p>

</div>

</div>

<!-- NOW PLAYING -->

<div class="now-playing">

<div class="now-info">

<h2 id="channelName">
No Channel Selected
</h2>

<p id="channelGroup">
Global IPTV Streaming
</p>

</div>

<div class="controls">

<button onclick="prevChannel()">
◀ Prev
</button>

<button onclick="nextChannel()">
Next ▶
</button>

<button onclick="togglePiP()">
📺 PiP
</button>

<button onclick="shareChannel()">
🔗 Share
</button>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
placeholder="Search IPTV channels..."
oninput="searchChannels(this.value)"
>

</div>

<!-- CHANNELS -->

<div class="channels" id="channelList"></div>

</div>

</div>

<script>

/* =========================
GLOBAL
========================= */

let all=[];
let filteredChannels=[];
let currentIndex=0;
let currentHls=null;
let dark=true;

let favorites=
JSON.parse(
localStorage.getItem("btechFavs")||"[]"
);

/* =========================
LOAD IPTV API
========================= */

async function loadChannels(){

try{

const [channelsData,streamsData,logosData]=
await Promise.all([

fetch(
"https://iptv-org.github.io/api/channels.json"
).then(r=>r.json()),

fetch(
"https://iptv-org.github.io/api/streams.json"
).then(r=>r.json()),

fetch(
"https://iptv-org.github.io/api/logos.json"
).then(r=>r.json())

]);

const channelMap={};
const logoMap={};

channelsData.forEach(c=>{

channelMap[c.id]=c;

});

logosData.forEach(l=>{

if(!logoMap[l.channel]){

logoMap[l.channel]=l.url;

}

});

let seen={};
let id=1;

streamsData.forEach(stream=>{

if(
!stream.url
||
seen[stream.url]
)return;

seen[stream.url]=1;

const ch=
channelMap[stream.channel]||{};

all.push({

id:id++,

name:
ch.name
||
stream.title
||
"Unknown",

category:
ch.categories
&&
ch.categories.length
?
ch.categories[0]
:
"General",

country:
ch.country
||
"",

logo:
logoMap[stream.channel]
||
"https://via.placeholder.com/60",

type:
Math.random()>.7
?"paid"
:"free",

status:
Math.random()>.85
?"locked"
:"unlocked",

viewers:
Math.floor(
Math.random()*1000000
),

url:
stream.url,

chId:
stream.channel

});

});

filteredChannels=[...all];

renderChannels();

document.getElementById(
"overlay"
).style.display="none";

}catch(err){

console.error(err);

alert(
"Failed to load IPTV API"
);

}

}

/* =========================
RENDER CHANNELS
========================= */

function renderChannels(){

const box=
document.getElementById(
"channelList"
);

box.innerHTML="";

filteredChannels
.slice(0,500)
.forEach((c,index)=>{

const div=
document.createElement("div");

div.className="channel";

div.innerHTML=`

<div class="left">

<img
src="${c.logo}"
onerror="this.src='https://via.placeholder.com/60'"
>

<div class="info">

<h4>
🔴 ${c.name}
</h4>

<small>
${c.category}
•
👥 ${c.viewers.toLocaleString()}
</small>

</div>

</div>

<div class="status">

<span class="
badge
${c.type==='free'
?'free'
:'paid'}
">
${c.type}
</span>

<span class="
badge
${c.status==='locked'
?'locked'
:'unlocked'}
">
${c.status}
</span>

<div
class="fav"
onclick="event.stopPropagation();toggleFav(${c.id})"
>
${favorites.includes(c.id)?'⭐':'☆'}
</div>

</div>

`;

div.onclick=
()=>playChannel(
index,
div
);

box.appendChild(div);

});

}

/* =========================
PLAY CHANNEL
========================= */

function playChannel(index,el){

currentIndex=index;

const channel=
filteredChannels[index];

document.getElementById(
"channelName"
).innerText=
channel.name;

document.getElementById(
"channelGroup"
).innerText=
channel.category;

const video=
document.getElementById(
"video"
);

if(currentHls){

currentHls.destroy();

}

if(Hls.isSupported()){

currentHls=
new Hls();

currentHls.loadSource(
channel.url
);

currentHls.attachMedia(video);

currentHls.on(
Hls.Events.MANIFEST_PARSED,
function(){

video.play();

}

);

}else{

video.src=
channel.url;

video.play();

}

document
.querySelectorAll(".channel")
.forEach(c=>{

c.classList.remove(
"active"
);

});

if(el){

el.classList.add(
"active"
);

}

}

/* =========================
NEXT / PREV
========================= */

function nextChannel(){

currentIndex++;

if(
currentIndex >=
filteredChannels.length
){

currentIndex=0;

}

playChannel(currentIndex);

}

function prevChannel(){

currentIndex--;

if(currentIndex<0){

currentIndex=
filteredChannels.length-1;

}

playChannel(currentIndex);

}

/* =========================
FILTER
========================= */

function filterCat(cat,btn=null){

if(cat==="All"){

filteredChannels=[...all];

}else{

filteredChannels=
all.filter(c=>

(
c.category
||
''
)
.toLowerCase()
.includes(
cat.toLowerCase()
)

||

(
c.country
||
''
)
.toLowerCase()
.includes(
cat.toLowerCase()
)

);

}

activateButton(btn);

renderChannels();

}

/* =========================
SEARCH
========================= */

function searchChannels(q){

const value=
q.toLowerCase();

filteredChannels=
all.filter(c=>

c.name
.toLowerCase()
.includes(value)

||

(
c.category
||
''
)
.toLowerCase()
.includes(value)

||

(
c.country
||
''
)
.toLowerCase()
.includes(value)

);

renderChannels();

}

/* =========================
FAVORITES
========================= */

function toggleFav(id){

if(
favorites.includes(id)
){

favorites=
favorites.filter(
f=>f!==id
);

}else{

favorites.push(id);

}

localStorage.setItem(
"btechFavs",
JSON.stringify(favorites)
);

renderChannels();

}

function showFavorites(btn){

filteredChannels=
all.filter(c=>

favorites.includes(c.id)

);

activateButton(btn);

renderChannels();

}

/* =========================
ACTIVE BUTTON
========================= */

function activateButton(btn){

document
.querySelectorAll(
".top-buttons button"
)
.forEach(b=>{

b.classList.remove(
"active"
);

});

if(btn){

btn.classList.add(
"active"
);

}

}

/* =========================
THEME
========================= */

function toggleTheme(){

dark=!dark;

document.documentElement
.style.setProperty(
"--bg",
dark
?"#0b0f1a"
:"#e5e7eb"
);

document.documentElement
.style.setProperty(
"--text",
dark
?"#ffffff"
:"#000000"
);

document.documentElement
.style.setProperty(
"--panel",
dark
?"#111827"
:"#ffffff"
);

}

/* =========================
PIP
========================= */

function togglePiP(){

const video=
document.getElementById(
"video"
);

if(
document.pictureInPictureElement
){

document
.exitPictureInPicture();

}else{

video
.requestPictureInPicture();

}

}

/* =========================
SHARE
========================= */

function shareChannel(){

const channel=
filteredChannels[currentIndex];

if(!channel)return;

const url=
location.href+
"#"+
encodeURIComponent(
channel.name
);

navigator.clipboard
.writeText(url);

alert(
"Channel link copied!"
);

}

/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
e=>{

if(e.key==="ArrowRight")
nextChannel();

if(e.key==="ArrowLeft")
prevChannel();

}

);

/* =========================
LIVE VIEWERS UPDATE
========================= */

setInterval(()=>{

for(let i=0;i<100;i++){

const random=
Math.floor(
Math.random()*all.length
);

if(all[random]){

all[random].viewers=
Math.floor(
Math.random()*1000000
);

}

}

},5000);

/* =========================
START
========================= */

loadChannels();

</script>

</body>
</html>
