```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTECH Streaming Subscription Demo</title>

<style>
body{
font-family:Arial,sans-serif;
background:#050816;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
width:420px;
background:#0d1324;
padding:20px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
text-align:center;
color:#00d4ff;
}

input,select,button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:6px;
}

input,select{
background:#101a31;
color:white;
}

button{
background:#00d4ff;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.gateway{
background:#152445;
color:white;
}

#result{
margin-top:15px;
padding:10px;
border-radius:6px;
background:#101a31;
display:none;
}
</style>
</head>
<body>

<div class="container">

<h2>💳 Subscription Upgrade</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<select id="plan">
<option value="Premium">Premium - ₦5,000</option>
<option value="Super Premium">Super Premium - ₦10,000</option>
<option value="Ultra Premium">Ultra Premium - ₦20,000</option>
</select>

<select id="gateway">
<option>Paystack</option>
<option>Flutterwave</option>
<option>Interswitch WebPAY</option>
<option>OPay</option>
<option>PalmPay</option>
<option>PayPal</option>
</select>

<button onclick="payNow()">
Proceed To Payment
</button>

<div id="result"></div>

</div>

<script>
function payNow(){

const name=document.getElementById('name').value;
const email=document.getElementById('email').value;
const plan=document.getElementById('plan').value;
const gateway=document.getElementById('gateway').value;

if(!name || !email){
alert("Please complete all fields");
return;
}

localStorage.setItem("subscription","active");
localStorage.setItem("plan",plan);

const result=document.getElementById("result");

result.style.display="block";
result.innerHTML=
`
<h3>✅ Payment Successful</h3>
<p><b>Name:</b> ${name}</p>
<p><b>Email:</b> ${email}</p>
<p><b>Plan:</b> ${plan}</p>
<p><b>Gateway:</b> ${gateway}</p>
<p>Subscription Activated Successfully.</p>
`;
}
</script>

</body>
</html>
```
