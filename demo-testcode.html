<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050816">

<title>BTECH-TV MEGA ULTRA MERGED 2026</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
THEME
========================= */

:root{
--bg:#050816;
--panel:#0f172a;
--card:#172033;
--hover:#22304d;
--accent:#00d4ff;
--text:#fff;
--muted:#94a3b8;
--danger:#ef4444;
--success:#16a34a;
--premium:#8b5cf6;
--warning:#f59e0b;
}

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* =========================
TOPBAR
========================= */

.topbar{
display:flex;
gap:10px;
padding:10px;
background:#0b1220;
overflow-x:auto;
border-bottom:1px solid rgba(255,255,255,.05);
}

.topbar button{
padding:10px 14px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
cursor:pointer;
white-space:nowrap;
}

.topbar button:hover{
background:var(--accent);
color:black;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
height:calc(100vh - 55px);
}

/* SIDEBAR */

.sidebar{
width:300px;
background:#0b1220;
overflow-y:auto;
padding:10px;
border-right:1px solid rgba(255,255,255,.05);
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:10px;
cursor:pointer;
}

.cat:hover{
background:var(--hover);
}

/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* PLAYER */

.player{
height:360px;
background:black;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:contain;
}

.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 10px;
border-radius:20px;
font-size:12px;
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* NOW */

.now{
display:flex;
justify-content:space-between;
padding:10px;
background:var(--panel);
}

/* CHANNELS */

.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

/* BADGES */

.badge{
padding:4px 8px;
border-radius:10px;
font-size:11px;
}

.free{background:var(--success);}
.paid{background:var(--danger);}
.locked{background:var(--warning);}
.premium{background:var(--premium);}

</style>
</head>

<body>

<div class="topbar">

<button onclick="setTab('all')">All</button>
<button onclick="setTab('favs')">⭐ Favorites</button>
<button onclick="setTab('recent')">🕘 Recent</button>
<button onclick="loadUltraFeeds()">🚀 Ultra Feeds</button>
<button onclick="generateVirtualChannels()">100K Channels</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="toggleFullscreen()">⛶ Fullscreen</button>
<button onclick="openAdmin()">⚙ Admin</button>
<button onclick="openSuperAdmin()">🛡 Super Admin</button>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Categories</h3>
<div class="cat" onclick="filterCat('Sports')">⚽ Sports</div>
<div class="cat" onclick="filterCat('Movies')">🎬 Movies</div>
<div class="cat" onclick="filterCat('News')">📰 News</div>
<div class="cat" onclick="filterCat('VIP')">💎 VIP</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">

<div class="live">LIVE</div>

<video id="video" controls autoplay></video>

<div class="overlay" id="overlay">
<h1>🚀</h1>
<p>Loading Engine...</p>
</div>

</div>

<div class="now">
<h3 id="title">No Channel</h3>
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
</div>

<div class="channels" id="list"></div>

</div>
</div>

<!-- =========================
SCRIPT ENGINE
========================= -->

<script>

let all=[];
let filtered=[];
let index=0;
let hls;
let favs=JSON.parse(localStorage.getItem('favs')||'{}');
let recent=JSON.parse(localStorage.getItem('recent')||'[]');

const feeds=[
"https://iptv-org.github.io/iptv/index.m3u",
"https://iptv-org.github.io/iptv/categories/sport.m3u",
"https://iptv-org.github.io/iptv/categories/movies.m3u"
];

/* LOAD */

async function loadUltraFeeds(){
all=[];
for(let url of feeds){
try{
let res=await fetch(url);
let text=await res.text();
parse(text);
}catch(e){}
}
filtered=[...all];
render();
}

/* PARSE */

function parse(data){
let lines=data.split("\n");
for(let i=0;i<lines.length;i++){
if(lines[i].includes("#EXTINF")){
let url=lines[i+1];
if(!url) continue;
all.push({
id:all.length+1,
name:lines[i],
url:url,
group:"Feed",
type:Math.random()>0.5?"free":"paid"
});
}
}
}

/* VIRTUAL 100K */

function generateVirtualChannels(){
for(let i=0;i<1000;i++){
all.push({
id:all.length+1,
name:"BTECH CHANNEL "+i,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
group:"Virtual",
type:"free"
});
}
filtered=[...all];
render();
}

/* RENDER */

function render(){
let box=document.getElementById('list');
box.innerHTML='';
filtered.forEach((c,i)=>{
let div=document.createElement('div');
div.className='channel';
div.innerHTML=`
<div>
<b>${c.name}</b>
<br><small>${c.group}</small>
</div>
<span class="badge ${c.type}">${c.type}</span>
`;
div.onclick=()=>play(i);
box.appendChild(div);
});
}

/* PLAY */

function play(i){
index=i;
let c=filtered[i];
document.getElementById('title').innerText=c.name;

if(hls) hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=c.url;
video.play();
}
}

/* NEXT PREV */

function next(){
index++;
if(index>=filtered.length) index=0;
play(index);
}

function prev(){
index--;
if(index<0) index=filtered.length-1;
play(index);
}

/* FILTER */

function filterCat(cat){
filtered=all.filter(c=>c.group.includes(cat));
render();
}

/* TAB */

function setTab(t){
if(t=='all') filtered=[...all];
if(t=='favs') filtered=all.filter(c=>favs[c.id]);
if(t=='recent') filtered=recent.map(id=>all.find(c=>c.id==id)).filter(Boolean);
render();
}

/* RECENT */

function addRecent(id){
recent.unshift(id);
localStorage.setItem('recent',JSON.stringify(recent));
}

/* ADMIN */

function openAdmin(){
alert("Admin Panel Open");
}

function openSuperAdmin(){
alert("Super Admin Mode Activated");
}

/* UI */

function toggleTheme(){
document.body.style.background=
document.body.style.background==='#fff'?'#050816':'#fff';
}

function toggleFullscreen(){
document.documentElement.requestFullscreen();
}

/* BOOT */

loadUltraFeeds();
generateVirtualChannels();

</script>

</body>
</html>
