<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BTECH-TV ULTRA USER MANAGER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

/* TOPBAR */
.topbar{
height:65px;background:var(--panel);
display:flex;justify-content:space-between;align-items:center;
padding:0 20px;border-bottom:1px solid rgba(255,255,255,0.05);
}
.topbar h2{color:var(--accent);font-size:22px;}
.top-links{display:flex;gap:10px;}
.top-links button{
padding:10px 15px;border:none;border-radius:8px;
background:var(--card);color:white;font-weight:bold;cursor:pointer;
}
.top-links button:hover{background:var(--accent);color:black;}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px);}

/* SIDEBAR */
.sidebar{
width:260px;background:#0f1628;padding:15px;overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}
.cat{
padding:12px;margin:8px 0;background:var(--card);
border-radius:8px;cursor:pointer;
}
.cat:hover{background:var(--hover);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.dashboard-grid{
flex:1;display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:15px;padding:15px;overflow-y:auto;
}
.card{background:var(--card);padding:20px;border-radius:15px;}
.card h3{color:var(--accent);margin-bottom:10px;}

/* CHANNEL LIST */
.channel-list{max-height:420px;overflow-y:auto;}
.channel-item{
display:flex;justify-content:space-between;
padding:12px;background:#0f1628;margin-bottom:8px;
border-radius:10px;cursor:pointer;
}
.channel-item:hover{background:var(--hover);}

/* USER LIST */
.user-item{
display:flex;justify-content:space-between;
padding:10px;background:#0f1628;margin:8px 0;
border-radius:10px;
}

/* PLAYER */
.player{height:260px;background:black;position:relative;border-radius:15px;overflow:hidden;}
.player video{width:100%;height:100%;object-fit:cover;}
.overlay{
position:absolute;inset:0;background:rgba(0,0,0,0.7);
display:flex;align-items:center;justify-content:center;
font-size:18px;
}
</style>

</head>

<body>

<div class="topbar">
<h2>🚀 BTECH-TV ULTRA USER MANAGER</h2>
</div>

<div class="container">

<div class="sidebar">
<h3 style="color:#00bfff;">Navigation</h3>
<div class="cat" onclick="setTab('channels')">📡 Channels</div>
<div class="cat" onclick="setTab('users')">👥 Users</div>
<div class="cat" onclick="setTab('custom')">➕ Custom</div>
</div>

<div class="main">

<div class="dashboard-grid">

<!-- PLAYER -->
<div class="card">
<h3>📺 LIVE PLAYER</h3>
<div class="player">
<video id="vid" controls autoplay></video>
<div class="overlay" id="overlay">Loading IPTV Engine...</div>
</div>
</div>

<!-- CHANNEL LIST -->
<div class="card">
<h3>📡 CHANNELS</h3>
<input placeholder="Search..." oninput="search(this.value)" />
<div class="channel-list" id="chlist"></div>
</div>

<!-- USERS -->
<div class="card">
<h3>👥 USERS</h3>
<div id="userList"></div>
</div>

</div>
</div>
</div>

<script>

/* =========================
FULL IPTV ENGINE (MERGED)
========================= */

var all=[],filtered=[],cur=null;
var favs={},recent=[];
var channelMap={},logoMap={},deadCh={},aliveCh={};

function flag(c){return c?c.toUpperCase():"🌐";}

/* INIT */
init();

function init(){
loadAPI();
}

/* =========================
LOAD IPTV API
========================= */

async function loadAPI(){
let [ch,st,lg]=await Promise.all([
fetch("https://iptv-org.github.io/api/channels.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/logos.json").then(r=>r.json())
]);

ch.forEach(c=>channelMap[c.id]=c);
lg.forEach(l=>logoMap[l.channel]=l.url);

let seen={};
st.forEach(s=>{
if(seen[s.url])return;
seen[s.url]=1;
if(!s.url)return;

all.push({
id:all.length+1,
n:s.channel||s.title||"Unknown",
u:s.url,
cat:"LIVE",
logo:logoMap[s.channel]||"",
cc:""
});
});

filtered=[...all];
render();
}

/* =========================
RENDER CHANNELS
========================= */

function render(){
let h="";
filtered.slice(0,200).forEach(c=>{
h+=`
<div class="channel-item" onclick="play(${c.id})">
<div>${c.n}</div>
</div>`;
});
document.getElementById("chlist").innerHTML=h;
}

/* =========================
PLAY CHANNEL
========================= */

var hls=null;

function play(id){
let ch=all.find(x=>x.id===id);
if(!ch)return;

let v=document.getElementById("vid");

if(hls)hls.destroy();

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(ch.u);
hls.attachMedia(v);
hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());
}else{
v.src=ch.u;
v.play();
}

document.getElementById("overlay").style.display="none";
cur=ch;
}

/* =========================
SEARCH
========================= */

function search(q){
q=q.toLowerCase();
filtered=all.filter(c=>c.n.toLowerCase().includes(q));
render();
}

/* =========================
USERS DEMO
========================= */

let users=[];
for(let i=1;i<=200;i++){
users.push({n:"USER_"+i,e:"u"+i+"@mail.com"});
}

function renderUsers(){
let h="";
users.forEach(u=>{
h+=`<div class="user-item">
<div>${u.n}</div>
<div>${u.e}</div>
</div>`;
});
document.getElementById("userList").innerHTML=h;
}
renderUsers();

/* =========================
TABS (simple)
========================= */

function setTab(t){
console.log("Tab:",t);
}

</script>

</body>
</html>
