<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV ENTERPRISE PRO MAX v4 (AIRWAVE MERGED)</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--accent:#00bfff;
--danger:#ef4444;
--warn:#f59e0b;
--ok:#22c55e;
--text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text)}

/* LOGIN */
#login{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.box{
width:320px;
background:var(--panel);
padding:20px;
border-radius:10px;
}

/* TOPBAR */
.topbar{
height:60px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

.sidebar{
width:240px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.main{flex:1;display:flex;flex-direction:column}

.player{height:260px;background:black}
video{width:100%;height:100%;object-fit:contain}

.list{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
padding:10px;
}

.card{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.card:hover{border-color:var(--accent)}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
display:inline-block;
}

.locked{background:var(--warn)}
.unlocked{background:var(--ok)}
.paid{background:var(--danger)}

/* RIGHT PANEL */
.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.log{
font-size:12px;
background:#0f1628;
padding:8px;
margin-top:10px;
height:200px;
overflow:auto;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.primary{background:var(--accent)}
.danger{background:var(--danger)}

input,select{
width:100%;
padding:10px;
margin-top:10px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}

small{opacity:0.7}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h3>🔐 ENTERPRISE LOGIN</h3>

<input id="user" placeholder="Username">
<select id="role">
<option value="superadmin">Super Admin</option>
<option value="admin">Admin</option>
<option value="viewer">Viewer</option>
</select>

<button class="primary" onclick="login()">LOGIN</button>
</div>
</div>

<!-- TOP -->
<div class="topbar">
<h3>🚀 BTECH-TV ENTERPRISE v4 + AIRWAVE ENGINE</h3>
<div id="roleBox"></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h4>➕ Add Channel</h4>

<input id="name" placeholder="Channel Name">
<input id="url" placeholder="Stream URL (.m3u8)">

<button class="primary" onclick="add()">Add</button>

<h4 style="margin-top:10px">Filters</h4>
<button onclick="filterAll()">All</button>
<button onclick="filterLocked()">Locked</button>
<button onclick="filterPaid()">Paid</button>

<input placeholder="Search..." oninput="search(this.value)">

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
</div>

<div class="list" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h4>⚙ Actions</h4>

<button class="primary" onclick="lockSelected()">Lock Selected</button>
<button class="primary" onclick="unlockSelected()">Unlock Selected</button>
<button class="danger" onclick="deleteSelected()">Delete Selected</button>

<h4 style="margin-top:10px">📊 Stats</h4>
<p>Total: <span id="t"></span></p>
<p>Locked: <span id="l"></span></p>
<p>Paid: <span id="p"></span></p>

<h4>📡 Logs</h4>
<div class="log" id="log"></div>

</div>

</div>

<script>

/* =====================
AUTH
===================== */
let role="";

function login(){
role=document.getElementById("role").value;
document.getElementById("login").style.display="none";
document.getElementById("roleBox").innerText="Role: "+role.toUpperCase();
log("LOGIN: "+role);
init();
}

/* =====================
DATA ENGINE (AIRWAVE MERGED)
===================== */

let db={channels:[],logs:[]};
let filtered=[];
let selected=new Set();

/* INIT CHANNELS FROM IPTV OR DEMO */
async function init(){

for(let i=1;i<=40;i++){
db.channels.push({
id:i,
name:"Demo Channel "+i,
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
status:i%5===0?"locked":"unlocked",
type:i%4===0?"paid":"free"
});
}

filtered=[...db.channels];
render();
stats();
}

/* LOG */
function log(t){
db.logs.unshift({time:new Date().toLocaleTimeString(),text:t});
document.getElementById("log").innerHTML =
db.logs.slice(0,30).map(l=>`[${l.time}] ${l.text}`).join("<br>");
}

/* RENDER */
function render(){
let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c)=>{

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<input type="checkbox" onchange="toggle(${c.id})">
<b>${c.name}</b><br>
<span class="badge ${c.status}">${c.status}</span>
<span class="badge ${c.type}">${c.type}</span>
`;

div.onclick=()=>play(c);
box.appendChild(div);

});
}

/* PLAY (HLS MERGED ENGINE) */
function play(c){

let v=document.getElementById("video");

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(v);
}else{
v.src=c.url;
}

log("PLAY: "+c.name);
}

/* TOGGLE SELECT */
function toggle(id){
selected.has(id)?selected.delete(id):selected.add(id);
}

/* ADD */
function add(){

if(role!=="superadmin"){
alert("Permission denied");
return;
}

db.channels.push({
id:Date.now(),
name:name.value,
url:url.value,
status:"unlocked",
type:"free"
});

log("CHANNEL ADDED");
refresh();
}

/* FILTERS */
function filterAll(){filtered=[...db.channels];render();}
function filterLocked(){filtered=db.channels.filter(c=>c.status==="locked");render();}
function filterPaid(){filtered=db.channels.filter(c=>c.type==="paid");render();}

/* SEARCH */
function search(v){
filtered=db.channels.filter(c=>c.name.toLowerCase().includes(v.toLowerCase()));
render();
}

/* ACTIONS */
function lockSelected(){
db.channels.forEach(c=>{
if(selected.has(c.id))c.status="locked";
});
log("LOCK ACTION");
refresh();
}

function unlockSelected(){
db.channels.forEach(c=>{
if(selected.has(c.id))c.status="unlocked";
});
log("UNLOCK ACTION");
refresh();
}

function deleteSelected(){
db.channels=db.channels.filter(c=>!selected.has(c.id));
log("DELETE ACTION");
refresh();
}

/* REFRESH */
function refresh(){
filtered=[...db.channels];
render();
stats();
}

/* STATS */
function stats(){
t.innerText=db.channels.length;
l.innerText=db.channels.filter(c=>c.status==="locked").length;
p.innerText=db.channels.filter(c=>c.type==="paid").length;
}

</script>

</body>
</html>
