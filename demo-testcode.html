<!-- =========================================
DSTV-STYLE IPTV FULL SYSTEM (SINGLE PAGE VERSION)
Frontend + Simulated Backend (LocalStorage)
LEGAL IPTV FRAMEWORK (NO PIRATED CONTENT)
========================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSTV IPTV Single Page System</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:320px;
background:#0b1224;
padding:12px;
overflow-y:auto;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
background:#0b1224;
padding:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

button{
padding:8px 10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#2563eb;
color:#fff;
font-size:12px;
}
button:hover{background:#1d4ed8;}

input,select{
width:100%;
padding:8px;
margin:5px 0;
border-radius:6px;
border:none;
outline:none;
}

.channel{
padding:10px;
background:#111c33;
margin:5px 0;
border-radius:6px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.channel:hover{background:#1e2a4a;}

.badge{
font-size:10px;
background:#334155;
padding:2px 6px;
border-radius:5px;
}

.videoBox{
flex:1;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

video{width:100%;height:100%;}

.panel{
background:#0f172a;
padding:10px;
margin:8px 0;
border-radius:8px;
}

.hidden{display:none;}

</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>📺 IPTV SYSTEM</h2>

<h3>🔐 Login</h3>
<input id="user" placeholder="username" />
<input id="pass" type="password" placeholder="password" />
<button onclick="login()">Login</button>

<div id="app" class="hidden">

<h3>🌍 Country</h3>
<select id="country" onchange="loadM3U()">
<option value="ng">Nigeria</option>
<option value="us">USA</option>
<option value="gb">UK</option>
<option value="in">India</option>
<option value="za">South Africa</option>
</select>

<h3>📡 Add Channel (Admin)</h3>
<input id="chName" placeholder="Channel Name" />
<input id="chUrl" placeholder="Stream URL (m3u8)" />
<button onclick="addChannel()">Add Channel</button>

<h3>📂 Channels</h3>
<div id="channels"></div>

</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<button onclick="toggleView()">👁 Toggle Admin</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<div class="videoBox">
<video id="video" controls></video>
</div>

</div>

<script>
let channels = JSON.parse(localStorage.getItem('channels') || '[]');
let isAdmin = false;

function login(){
if(user.value && pass.value){
document.getElementById('app').classList.remove('hidden');
render();
}
}

function logout(){location.reload();}

function toggleView(){
isAdmin = !isAdmin;
alert(isAdmin ? "Admin Mode ON" : "Admin Mode OFF");
}

function addChannel(){
if(!isAdmin){alert("Admin only");return;}

channels.push({
name: chName.value,
url: chUrl.value
});

localStorage.setItem('channels', JSON.stringify(channels));
render();
}

function render(){
let box = document.getElementById('channels');
box.innerHTML = '';

channels.forEach(c => {
let div = document.createElement('div');
div.className = 'channel';
div.innerHTML = `<span>${c.name}</span><span class='badge'>LIVE</span>`;
div.onclick = () => play(c.url);
box.appendChild(div);
});
}

function play(url){
let v = document.getElementById('video');

if(window.hls) window.hls.destroy();

if(Hls.isSupported()){
window.hls = new Hls();
window.hls.loadSource(url);
window.hls.attachMedia(v);
}else v.src = url;

v.play();
}

function loadM3U(){
alert("Optional: connect external M3U API here");
}

render();
</scrip
