<script>

/* ==============================
   PREMIUM IPTV 40K ENGINE
============================== */

const premiumChannels = [];

const categories = [
"Sports",
"Movies",
"News",
"Entertainment",
"VIP",
"Documentary",
"Music",
"Kids"
];

/* SAFE HLS STREAM POOL */
const streams = [
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8",
"https://test-streams.mux.dev/test_003/stream.m3u8"
];

/* GENERATE 40,000 PREMIUM CHANNELS */
for(let i=1;i<=40000;i++){

let cat = categories[i % categories.length];

premiumChannels.push({
id:i,
name:`PREMIUM LIVE CHANNEL ${i}`,
category:cat,

type:"Pay To View",

/* 40% locked, 60% unlocked */
status: (i % 5 === 0) ? "Locked" : "Unlocked",

/* realistic pricing */
price: Math.floor(Math.random() * 5000) + 1000,

/* stream rotation */
streamUrl: streams[i % streams.length]
});
}

/* ==============================
   RENDER ENGINE (FAST 40K)
============================== */

function renderChannels(list){

const grid = document.getElementById("channelGrid");
grid.innerHTML = "";

/* limit render for performance */
list.slice(0,120).forEach(channel=>{

grid.innerHTML += `
<div class="channel-card">

<div class="channel-banner">
${channel.category}
</div>

<div class="channel-info">

<h3>${channel.name}</h3>
<p>${channel.category}</p>
<p style="color:#f59e0b;">₦${channel.price}</p>

<span class="badge paid">Pay To View</span>
<span class="badge ${channel.status==="Locked"?"locked":"unlocked"}">
${channel.status}
</span>

${
channel.status === "Locked"
? `
<button class="subscribe-btn" onclick="subscribeChannel(${channel.id})">
Unlock Premium Access
</button>
`
: `
<button class="watch-btn" onclick="watchChannel(${channel.id})">
Watch Premium
</button>
`
}

</div>

</div>
`;

});

/* ==============================
   STATS ENGINE
============================== */

document.getElementById("premiumChannels").innerText =
premiumChannels.length.toLocaleString();

document.getElementById("lockedChannels").innerText =
premiumChannels.filter(c=>c.status==="Locked").length.toLocaleString();

document.getElementById("unlockedChannels").innerText =
premiumChannels.filter(c=>c.status==="Unlocked").length.toLocaleString();

document.getElementById("sportsChannels").innerText =
premiumChannels.filter(c=>c.category==="Sports").length.toLocaleString();

}

/* ==============================
   SEARCH ENGINE (40K FAST)
============================== */

function searchChannels(){

const value = document.getElementById("searchInput").value.toLowerCase();

const filtered = premiumChannels.filter(c =>
c.name.toLowerCase().includes(value)
);

renderChannels(filtered);
}

/* ==============================
   SUBSCRIPTION SYSTEM (SIMULATED)
============================== */

function subscribeChannel(id){

const channel = premiumChannels.find(c=>c.id===id);

alert(
`💳 Payment Required\n\nChannel: ${channel.name}\nPrice: ₦${channel.price}\n\nRedirecting to Paystack / Flutterwave...`
);

/* REAL INTEGRATION POINT:
   - Paystack API
   - Flutterwave API
   - Stripe
*/
}

/* ==============================
   VIDEO PLAYER
============================== */

function watchChannel(id){

const channel = premiumChannels.find(c=>c.id===id);

if(channel.status === "Locked"){
alert("🔒 This is a locked premium channel. Please subscribe.");
return;
}

document.getElementById("playerModal").style.display = "flex";
document.getElementById("playerTitle").innerText = channel.name;

const video = document.getElementById("videoPlayer");

if(Hls.isSupported()){
const hls = new Hls();
hls.loadSource(channel.streamUrl);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED, function(){
video.play();
});

}else{
video.src = channel.streamUrl;
video.play();
}

}

/* ==============================
   CLOSE PLAYER
============================== */

function closePlayer(){
document.getElementById("playerModal").style.display = "none";
document.getElementById("videoPlayer").pause();
}

/* INIT */
renderChannels(premiumChannels);

</script>
