<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV PRO MAX ULTRA MERGED</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--free:#16a34a;
--paid:#dc2626;
--locked:#f59e0b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);overflow:hidden;}

.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
border-bottom:1px solid #222;
}

.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.sidebar h3{color:var(--accent);margin-bottom:10px;}

.cat{
padding:10px;
background:var(--card);
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
}

.cat:hover{background:var(--hover);}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.player{
height:320px;
background:black;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* CHANNEL GRID */
.channels{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:10px;
padding:10px;
}

.channel{
background:var(--card);
padding:10px;
border-radius:10px;
cursor:pointer;
border:1px solid transparent;
}

.channel:hover{border-color:var(--accent);background:var(--hover);}

.badge{
font-size:11px;
padding:4px 6px;
border-radius:20px;
margin-right:4px;
}

.free{background:var(--free);}
.paid{background:var(--paid);}
.locked{background:var(--locked);color:#000;}

/* RIGHT PANEL */
.right{
width:260px;
background:var(--panel);
padding:10px;
overflow:auto;
}

.stat{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-top:8px;
background:#0f1628;
border:none;
color:white;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
background:var(--accent);
cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
<h3>🚀 BTECH-TV PRO MAX ULTRA</h3>
<div id="status">READY</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>⚙ CONTROL PANEL</h3>

<div class="cat" onclick="filterAll()">📺 All Channels</div>
<div class="cat" onclick="filterLocked()">🔒 Locked</div>
<div class="cat" onclick="filterFree()">🟢 Free</div>
<div class="cat" onclick="filterPaid()">💰 Paid</div>

<input placeholder="Search..." oninput="search(this.value)">

<button onclick="generateVirtual()">🚀 Generate 100K</button>
<button onclick="loadStreams()">📡 Load IPTV APIs</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="video" controls></video>
<div class="overlay" id="overlay">
<h2>🚀 IPTV ENGINE</h2>
<p id="loader">Initializing...</p>
</div>
</div>

<div class="channels" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h3>📊 STATS</h3>

<div class="stat">Total: <span id="t">0</span></div>
<div class="stat">Free: <span id="f">0</span></div>
<div class="stat">Paid: <span id="p">0</span></div>
<div class="stat">Locked: <span id="l">0</span></div>

<input id="cname" placeholder="Channel Name">
<input id="curl" placeholder="Stream URL">
<button onclick="addChannel()">➕ Add Channel</button>

</div>

</div>

<script>

/* =====================
STATE ENGINE
===================== */

let channels=[];
let filtered=[];
let current=0;

/* =====================
STREAM BACKUP
===================== */

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* =====================
LOAD IPTV API
===================== */

async function loadStreams(){
document.getElementById("loader").innerText="Loading IPTV...";

try{

const res=await fetch("https://iptv-org.github.io/api/streams.json");
const data=await res.json();

data.slice(0,2000).forEach((s,i)=>{
if(!s.url) return;

channels.push({
id:i,
name:"IPTV "+i,
url:s.url,
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"free"
});

});

render();
stats();

document.getElementById("overlay").style.display="none";
document.getElementById("status").innerText="LIVE";

}catch(e){
document.getElementById("status").innerText="ERROR";
}

}

/* =====================
VIRTUAL CHANNELS
===================== */

function generateVirtual(){

for(let i=0;i<500;i++){

channels.push({
id:Date.now()+i,
name:"BTECH CHANNEL "+i,
url:streams[i%streams.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"free"
});

}

render();
stats();

}

/* =====================
RENDER
===================== */

function render(){

filtered=[...channels];

let box=document.getElementById("list");
box.innerHTML="";

filtered.forEach((c,i)=>{

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<b>${c.name}</b><br>
<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>
`;

div.onclick=()=>play(i);

box.appendChild(div);

});

}

/* =====================
PLAY
===================== */

function play(i){

let c=filtered[i];
let v=document.getElementById("video");

if(Hls.isSupported()){
let h=new Hls();
h.loadSource(c.url);
h.attachMedia(v);
}else{
v.src=c.url;
}

current=i;

}

/* =====================
FILTERS
===================== */

function filterAll(){render();}
function filterLocked(){filtered=channels.filter(c=>c.status==="locked");render();}
function filterFree(){filtered=channels.filter(c=>c.type==="free");render();}
function filterPaid(){filtered=channels.filter(c=>c.type==="paid");render();}

/* =====================
SEARCH
===================== */

function search(v){
filtered=channels.filter(c=>
c.name.toLowerCase().includes(v.toLowerCase())
);
render();
}

/* =====================
ADD CHANNEL
===================== */

function addChannel(){

channels.push({
id:Date.now(),
name:cname.value,
url:curl.value,
type:"free",
status:"free"
});

cname.value="";
curl.value="";

render();
stats();

}

/* =====================
STATS
===================== */

function stats(){

t.innerText=channels.length;
f.innerText=channels.filter(c=>c.type==="free").length;
p.innerText=channels.filter(c=>c.type==="paid").length;
l.innerText=channels.filter(c=>c.status==="locked").length;

}

/* BOOT */
loadStreams();

</script>

</body>
</html>
