<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTECH-TV Demo/Test Codes Ultra</title><style>body{margin:0;background:#050816;color:#fff;font-family:Arial}.wrap{padding:24px;max-width:1200px;margin:auto}.card{background:#111827;border-radius:16px;padding:20px;margin-bottom:16px}h1{color:#00d4ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#172033;padding:16px;border-radius:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,button{padding:11px;border-radius:9px;border:0}button{background:#00d4ff;font-weight:bold}.danger{background:#ef4444;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #26344f;text-align:left}.badge{padding:4px 8px;border-radius:10px;background:#16a34a}.expired{background:#64748b}</style></head><body><div class="wrap"><h1>🧪 BTECH-TV DEMO / TEST CODE ULTRA</h1><p><a href="../super-admin/dashboard.html" style="color:#00d4ff">← Super Admin</a></p><div class="grid"><div class="stat">Total Codes <b id="total">0</b></div><div class="stat">Active <b id="active">0</b></div><div class="stat">Redeemed <b id="redeemed">0</b></div><div class="stat">Expired <b id="expired">0</b></div></div><div class="card"><div class="toolbar"><input id="email" placeholder="Email (optional)"><select id="plan"><option>Demo</option><option>Starter</option><option>Standard</option><option>Premium</option><option>Ultimate Sports</option></select><input id="days" type="number" value="3" min="1" placeholder="Days"><button onclick="addCode()">Generate Code</button><button onclick="exportCodes()">Export JSON</button><button class="danger" onclick="removeExpired()">Remove Expired</button></div></div><div class="card"><table><thead><tr><th>Code</th><th>Plan</th><th>Email</th><th>Valid Until</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const key='btech_demo_codes';let codes=JSON.parse(localStorage.getItem(key)||'[]');function rand(){return 'BTECH-'+crypto.randomUUID().slice(0,8).toUpperCase()}function addCode(){const d=Number(document.getElementById('days').value)||3;codes.unshift({code:rand(),plan:document.getElementById('plan').value,email:document.getElementById('email').value.trim(),expires:Date.now()+d*864e5,revoked:false,redeemed:false});save()}function status(c){if(c.revoked)return 'REVOKED';if(c.expires<Date.now())return 'EXPIRED';if(c.redeemed)return 'REDEEMED';return 'ACTIVE'}function save(){localStorage.setItem(key,JSON.stringify(codes));render()}function revoke(i){codes[i].revoked=true;save()}function removeExpired(){codes=codes.filter(c=>status(c)!=='EXPIRED');save()}function exportCodes(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(codes,null,2)],{type:'application/json'}));a.download='btech-demo-test-codes.json';a.click()}function render(){rows.innerHTML=codes.map((c,i)=>`<tr><td>${c.code}</td><td>${c.plan}</td><td>${c.email||'—'}</td><td>${new Date(c.expires).toLocaleString()}</td><td><span class="badge ${status(c)==='EXPIRED'?'expired':''}">${status(c)}</span></td><td><button onclick="revoke(${i})">Revoke</button></td></tr>`).join('');total.textContent=codes.length;active.textContent=codes.filter(c=>status(c)==='ACTIVE').length;redeemed.textContent=codes.filter(c=>status(c)==='REDEEMED').length;expired.textContent=codes.filter(c=>status(c)==='EXPIRED').length}render()</script></body></html>
