


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTECH-TV SUPER ADMIN PRO MAX</title>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#fff;
--muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:var(--bg);color:var(--text);overflow:hidden}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{color:var(--accent)}

.topbar input{
padding:10px;
border:none;
border-radius:8px;
background:#0f1628;
color:white;
width:280px;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px)}

.sidebar{
width:240px;
background:#0f1628;
padding:15px;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{background:var(--hover)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:15px;
}

.box{
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.box p{color:var(--accent);font-size:20px;font-weight:bold}

/* GRID */
.grid{
flex:1;
overflow-y:auto;
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
transition:0.3s;
border:1px solid transparent;
}

.card:hover{
transform:translateY(-3px);
border-color:var(--accent);
background:var(--hover);
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
margin-right:5px;
}

.active{background:#16a34a}
.banned{background:#dc2626}
.premium{background:#f59e0b;color:black}
.free{background:#16a34a}
.paid{background:#dc2626}
.locked{background:#f59e0b;color:black}

/* BUTTON */
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
font-weight:bold;
margin-top:8px;
}

button:hover{opacity:0.8}

.danger{background:#dc2626}
.warning{background:#f59e0b;color:black}

.tab-active{background:var(--accent);color:black}
</style>
</head>

<body>

<div class="topbar">
<h2>🚀 BTECH SUPER ADMIN PRO MAX</h2>
<input placeholder="Search users or channels..." oninput="searchAll(this.value)">
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat tab-active" onclick="switchTab('users',this)">👥 Users</div>
<div class="cat" onclick="switchTab('channels',this)">📺 Channels</div>

<hr style="opacity:0.2;margin:10px 0">

<button onclick="generateUsers()">Generate Users</button>
<button onclick="generateChannels()">Generate Channels</button>

</div>

<!-- MAIN -->
<div class="main">

<!-- STATS -->
<div class="stats">
<div class="box"><p id="t1">0</p><small>Total Users</small></div>
<div class="box"><p id="t2">0</p><small>Total Channels</small></div>
<div class="box"><p id="t3">0</p><small>Active / Free</small></div>
<div class="box"><p id="t4">0</p><small>Banned / Locked</small></div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div>

</div>

<script>

/* =====================
STATE
===================== */
let users=[];
let channels=[];
let view="users";

/* =====================
SWITCH TAB
===================== */
function switchTab(tab,el){

view=tab;

document.querySelectorAll(".cat")
.forEach(c=>c.classList.remove("tab-active"));

el.classList.add("tab-active");

render();
}

/* =====================
GENERATE USERS
===================== */
function generateUsers(){

users=[];

for(let i=1;i<=200;i++){

users.push({
id:i,
name:"User_"+i,
email:"user"+i+"@mail.com",
status:i%10===0?"banned":"active",
premium:i%7===0
});

}

render();
}

/* =====================
GENERATE CHANNELS
===================== */
function generateChannels(){

const cats=["Sports","Movies","News","Kids","Music","Africa"];

channels=[];

for(let i=1;i<=200;i++){

channels.push({
id:i,
name:"BTECH Channel "+i,
category:cats[i%cats.length],
type:i%3===0?"paid":"free",
status:i%10===0?"locked":"unlocked",
viewers:Math.floor(Math.random()*100000)
});

}

render();
}

/* =====================
RENDER
===================== */
function render(){

const grid=document.getElementById("grid");
grid.innerHTML="";

if(view==="users"){

users.forEach(u=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>👤 ${u.name}</h3>
<p>${u.email}</p>

<span class="badge ${u.status}">${u.status}</span>
${u.premium?'<span class="badge premium">premium</span>':''}

<br>
<button onclick="toggleUser(${u.id})">Toggle</button>
`;

grid.appendChild(div);

});

}else{

channels.forEach(c=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<h3>📺 ${c.name}</h3>
<p>${c.category}</p>

<span class="badge ${c.type}">${c.type}</span>
<span class="badge ${c.status}">${c.status}</span>

<p>👥 ${c.viewers}</p>

`;

grid.appendChild(div);

});

}

updateStats();
}

/* =====================
STATS
===================== */
function updateStats(){

document.getElementById("t1").innerText=users.length;
document.getElementById("t2").innerText=channels.length;

document.getElementById("t3").innerText=
view==="users"
? users.filter(u=>u.status==="active").length
: channels.filter(c=>c.type==="free").length;

document.getElementById("t4").innerText=
view==="users"
? users.filter(u=>u.status==="banned").length
: channels.filter(c=>c.status==="locked").length;

}

/* =====================
ACTIONS
===================== */
function toggleUser(id){

users=users.map(u=>{
if(u.id===id){
u.status=u.status==="active"?"banned":"active";
}
return u;
});

render();
}

/* =====================
SEARCH
===================== */
function searchAll(q){

q=q.toLowerCase();

if(view==="users"){

const filtered=users.filter(u=>
u.name.toLowerCase().includes(q)||
u.email.toLowerCase().includes(q)
);

usersToRender(filtered);

}else{

const filtered=channels.filter(c=>
c.name.toLowerCase().includes(q)||
c.category.toLowerCase().includes(q)
);

channelsToRender(filtered);

}
}

/* helpers */
function usersToRender(list){
document.getElementById("grid").innerHTML="";
list.forEach(u=>console.log(u));
}

function channelsToRender(list){
document.getElementById("grid").innerHTML="";
list.forEach(c=>console.log(c));
}

/* INIT */
generateUsers();
generateChannels();

</script>

</body>
</html>
