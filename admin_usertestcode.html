<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACTIVE IPTV SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* LOGIN */
#login{
display:flex;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

input{
padding:10px;
margin:5px;
width:260px;
border:none;
border-radius:5px;
}

button{
padding:10px;
width:260px;
margin-top:10px;
background:#00bfff;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

/* APP */
#app{
display:none;
}

/* TOP BAR */
.topbar{
height:60px;
background:#11182a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#0f1628;
padding:10px;
overflow:auto;
}

.cat{
padding:10px;
margin:5px 0;
background:#1b2438;
cursor:pointer;
border-radius:5px;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.player{
height:320px;
background:black;
}

video{
width:100%;
height:100%;
}

/* CHANNELS */
.channels{
flex:1;
overflow:auto;
padding:10px;
}

.channel{
padding:10px;
margin:5px 0;
background:#1b2438;
display:flex;
justify-content:space-between;
border-radius:5px;
cursor:pointer;
}

.channel:hover{
background:#2b3a5a;
}

.locked{
opacity:0.4;
}

.vip{
color:#ff4d4d;
font-size:12px;
}

.heart{
cursor:pointer;
}

.active{
background:#00bfff33;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">

<h2>📺 IPTV LOGIN</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>

</div>

<!-- APP -->
<div id="app">

<div class="topbar">
<div><b>ACTIVE IPTV DASHBOARD</b></div>
<div>
<button onclick="unlockVIP()">💳 Unlock VIP</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Categories</h3>
<div class="cat" onclick="filter('All')">All</div>
<div class="cat" onclick="filter('Sports')">Sports</div>
<div class="cat" onclick="filter('Movies')">Movies</div>
<div class="cat" onclick="filter('News')">News</div>
<div class="cat" onclick="filter('Kids')">Kids</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="player">
<video id="player" controls autoplay></video>
</div>

<div class="channels" id="list"></div>

</div>

</div>

</div>

<script>

/* USERS */
let users = JSON.parse(localStorage.getItem("users")) || [];
let session = localStorage.getItem("session");

/* CHANNELS */
let channels = [
{name:"BBC News HD", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", category:"News", vip:false},
{name:"ESPN Sports", url:"https://test-streams.mux.dev/test_001/stream.m3u8", category:"Sports", vip:true},
{name:"Movie HD", url:"https://test-streams.mux.dev/test_002/stream.m3u8", category:"Movies", vip:true},
{name:"Cartoon Kids", url:"https://test-streams.mux.dev/test_003/stream.m3u8", category:"Kids", vip:false}
];

let currentCat="All";

/* SIGNUP */
function signup(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(!email||!pass) return alert("Fill fields");

users.push({email,pass,vip:false});
localStorage.setItem("users",JSON.stringify(users));

alert("Account created!");
}

/* LOGIN */
function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

let user=users.find(u=>u.email==email && u.pass==pass);

if(!user) return alert("Invalid login");

localStorage.setItem("session",email);

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

render();
}

/* VIP UPGRADE */
function unlockVIP(){
let email=localStorage.getItem("session");
let user=users.find(u=>u.email==email);

if(user){
user.vip=true;
localStorage.setItem("users",JSON.stringify(users));
alert("VIP Activated!");
render();
}
}

/* PLAY */
function play(url){
document.getElementById("player").src=url;
}

/* FILTER */
function filter(c){
currentCat=c;
render();
}

/* RENDER */
function render(){

let box=document.getElementById("list");
box.innerHTML="";

let email=localStorage.getItem("session");
let user=users.find(u=>u.email==email);

channels
.filter(c=>currentCat=="All"||c.category==currentCat)
.forEach(c=>{

let locked=c.vip && !user.vip;

let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<span>
${c.name} ${c.vip?"<span class='vip'>VIP</span>":""}
</span>
<span class="heart">❤️</span>
`;

if(!locked){
div.onclick=()=>play(c.url);
}else{
div.innerHTML+=" 🔒";
}

box.appendChild(div);
});

}

/* AUTO LOGIN */
if(session){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
}

</script>

</body>
</html>
