<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login - BTECH TV</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:400px;
    background:#111827;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#00d4ff;
    font-size:32px;
}

.logo p{
    color:#94a3b8;
    margin-top:5px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    color:#cbd5e1;
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border:1px solid #00d4ff;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#00d4ff;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#06b6d4;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
    font-size:13px;
}

.error-message{
    background:#7f1d1d;
    color:#fecaca;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>BTECH TV</h1>
        <p>Admin Dashboard Login</p>
    </div>

    <div class="error-message" id="errorMessage">
        Invalid Admin Username or Password
    </div>

    <form id="adminLoginForm">

        <div class="input-group">
            <label>Admin Username</label>
            <input type="text" id="username" placeholder="Enter admin username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-btn">
            Login to Dashboard
        </button>

    </form>

    <div class="footer">
        © 2026 BTECH-TV  Admin Panel
    </div>

</div>

<script>
const adminLoginForm = document.getElementById("adminLoginForm");

adminLoginForm.addEventListener("submit", function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // Demo Admin Login
    const adminUser = "admin";
    const adminPass = "123456";

    if(username === adminUser && password === adminPass){

        alert("Login Successful!");

        // Redirect to dashboard
        window.location.href = "https://superadminbtech-tv.netlify.app/https://superadminbtech-tv.netlify.app/admin-dasboardtestcode.html/";

    } else {

        document.getElementById("errorMessage").style.display = "block";

    }
});
</script>

</body>
</html>
