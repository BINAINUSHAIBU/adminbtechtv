<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>BTECH-TV ULTRA USER MANAGER + AIRWAVE ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{color:var(--accent);font-size:20px;}

.top-links button{
padding:10px 12px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 65px);}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:10px;
margin:6px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.dashboard-grid{
flex:1;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:12px;
padding:12px;
overflow-y:auto;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
}

.card h3{color:var(--accent);margin-bottom:10px;}

/* IPTV PLAYER */
.player{
height:260px;
background:black;
position:relative;
border-radius:12px;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.6);
font-weight:bold;
}

/* CHANNEL LIST */
.channel-item{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
}

.channel-item:hover{background:var(--hover);}

/* USER LIST */
.user-item{
background:#0f1628;
padding:10px;
margin-bottom:6px;
border-radius:8px;
display:flex;
justify-content:space-between;
}

/* BUTTONS */
button{
padding:10px;
border:none;
border-radius:8px;
background:var(--accent);
color:black;
cursor:pointer;
margin-top:8px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="topbar">
  <h2>🚀 BTECH-TV ULTRA + AIRWAVE ENGINE</h2>
  <div class="top-links">
    <button onclick="playDemo()">▶ Demo</button>
    <button onclick="nextChannel()">▶ Next</button>
  </div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="cat">👥 Dashboard</div>
<div class="cat" onclick="loadChannels()">📡 Load Channels</div>
<div class="cat" onclick="toggleFav()">⭐ Favorites</div>
<div class="cat" onclick="toggleMenu()">⚙ Settings</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="dashboard-grid">

<!-- PLAYER -->
<div class="card">
<h3>📺 IPTV PLAYER</h3>

<div class="player">
<video id="videoPlayer" controls autoplay playsinline></video>
<div class="overlay" id="overlay">Loading Engine...</div>
</div>

<button onclick="nextChannel()">▶ Next Channel</button>
</div>

<!-- CHANNELS -->
<div class="card">
<h3>📡 LIVE CHANNELS</h3>
<div id="channelList"></div>
</div>

<!-- USERS (kept simple) -->
<div class="card">
<h3>👥 USERS</h3>
<div id="userList"></div>
</div>

</div>

</div>

</div>

<script>

/* =========================
AIRWAVE IPTV ENGINE
========================= */

let allChannels=[];
let currentIndex=0;
let hls=null;

/* LOAD IPTV API */
async function loadChannels(){

document.getElementById("overlay").innerText="Loading Channels...";

const [ch,st,lg]=await Promise.all([

fetch("https://iptv-org.github.io/api/channels.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/streams.json").then(r=>r.json()),
fetch("https://iptv-org.github.io/api/logos.json").then(r=>r.json())

]);

let map={},logos={};

ch.forEach(c=>map[c.id]=c);
lg.forEach(l=>logos[l.channel]=l.url);

let seen={};

st.forEach(s=>{

if(!s.url || seen[s.url]) return;
seen[s.url]=1;

allChannels.push({

name: map[s.channel]?.name || s.title || "Unknown",
url: s.url,
logo: logos[s.channel] || ""

});

});

renderChannels();

document.getElementById("overlay").style.display="none";

playChannel(0);

}

/* RENDER CHANNELS */
function renderChannels(){

const box=document.getElementById("channelList");
box.innerHTML="";

allChannels.slice(0,200).forEach((c,i)=>{

const div=document.createElement("div");
div.className="channel-item";
div.innerHTML=`🔴 ${c.name}`;
div.onclick=()=>playChannel(i);
box.appendChild(div);

});

}

/* PLAY CHANNEL */
function playChannel(i){

if(!allChannels[i]) return;

currentIndex=i;

const video=document.getElementById("videoPlayer");

if(hls) hls.destroy();

if(Hls.isSupported()){

hls=new Hls();
hls.loadSource(allChannels[i].url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());

}else{

video.src=allChannels[i].url;
video.play();

}

document.getElementById("overlay").style.display="none";

}

/* NEXT CHANNEL */
function nextChannel(){
currentIndex=(currentIndex+1)%allChannels.length;
playChannel(currentIndex);
}

/* DEMO */
function playDemo(){
playChannel(0);
}

/* USERS (simple mock) */
let users=[];

for(let i=1;i<=50;i++){
users.push({name:"USER_"+i,email:"u"+i+"@tv.com"});
}

const box=document.getElementById("userList");

users.forEach(u=>{

const div=document.createElement("div");
div.className="user-item";
div.innerHTML=`<span>${u.name}</span><span>${u.email}</span>`;
box.appendChild(div);

});

/* AUTO START */
loadChannels();

</script>

</body>
</html>
