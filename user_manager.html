<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BTECH-TV ULTRA USER MANAGER + CHANNEL ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:20px;
}

.top-links button{
padding:10px 15px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
}

.top-links button:hover,
.top-links button.active{
background:var(--accent);
color:black;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.dashboard-grid{
flex:1;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:15px;
padding:15px;
overflow-y:auto;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:12px;
}

.card h3{
color:var(--accent);
margin-bottom:10px;
}

/* USER LIST */
.user-list,.channel-list{
max-height:300px;
overflow-y:auto;
}

.user-item,.channel-item{
background:#0f1628;
padding:10px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
}

.user-item:hover,.channel-item:hover{
background:var(--hover);
}

/* PLAYER */
.player{
height:250px;
background:black;
border-radius:10px;
overflow:hidden;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.6);
}

input,select,button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
}

button{
background:var(--accent);
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="topbar">

<h2>🚀 BTECH-TV USER MANAGER + CHANNEL ENGINE</h2>

<div class="top-links">
<button onclick="filterUsers('All',this)" class="active">All Users</button>
<button onclick="filterUsers('Premium',this)">Premium</button>
<button onclick="filterUsers('Blocked',this)">Blocked</button>
</div>

</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3 style="color:var(--accent)">⚙ Menu</h3>

<p>👥 Users</p>
<p>📺 Channels</p>
<p>📊 Stats</p>

</div>

<!-- MAIN -->
<div class="main">

<div class="dashboard-grid">

<!-- USER STATS -->
<div class="card">
<h3>📊 USER STATS</h3>
<p>Total: <span id="totalUsers">0</span></p>
<p>Premium: <span id="premiumUsers">0</span></p>
<p>Blocked: <span id="blockedUsers">0</span></p>
</div>

<!-- CREATE USER -->
<div class="card">
<h3>➕ CREATE USER</h3>

<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<select id="plan">
<option>Free</option>
<option>Premium</option>
</select>

<button onclick="addUser()">Create User</button>
<button onclick="generateUsers()">Generate 100K Users</button>

</div>

<!-- USER LIST -->
<div class="card">
<h3>👥 USERS</h3>
<div class="user-list" id="userList"></div>
</div>

<!-- CHANNEL PLAYER -->
<div class="card">
<h3>📺 LIVE PLAYER</h3>

<div class="player">
<video id="videoPlayer" controls autoplay></video>
<div class="overlay" id="overlay">Loading...</div>
</div>

<button onclick="playDemo()">▶ Play Demo</button>

</div>

<!-- CHANNEL LIST -->
<div class="card">
<h3>📡 CHANNELS</h3>
<div class="channel-list" id="channelList"></div>
</div>

</div>

</div>

<script>

/* ================= USERS ================= */

let users=[];
let filteredUsers=[];
let channels=[];
let currentHls=null;

function generateUsers(){

users=[];

for(let i=1;i<=100000;i++){

users.push({
name:"User_"+i,
email:"user"+i+"@mail.com",
plan:i%3===0?"Premium":"Free",
status:i%10===0?"Blocked":"Active"
});

}

filteredUsers=[...users];
renderUsers();
updateStats();

}

function renderUsers(){

const box=document.getElementById("userList");
box.innerHTML="";

filteredUsers.slice(0,200).forEach(u=>{

box.innerHTML+=`
<div class="user-item">
<strong>${u.name}</strong><br>
<small>${u.email}</small>
<br>
${u.plan} | ${u.status}
</div>
`;

});

}

function addUser(){

const name=document.getElementById("username").value;
const email=document.getElementById("email").value;
const plan=document.getElementById("plan").value;

users.unshift({name,email,plan,status:"Active"});
filteredUsers=users;

renderUsers();
updateStats();

}

/* ================= CHANNELS ================= */

const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8",
"https://test-streams.mux.dev/test_002/stream.m3u8"
];

function generateChannels(){

for(let i=1;i<=500;i++){

channels.push({
name:"BTECH LIVE "+i,
category:["Sports","Movies","News"][i%3],
url:streams[i%streams.length]
});

}

renderChannels();

}

function renderChannels(){

const box=document.getElementById("channelList");
box.innerHTML="";

channels.slice(0,200).forEach(ch=>{

box.innerHTML+=`
<div class="channel-item" onclick="playChannel('${ch.url}')">
🔴 ${ch.name}<br>
<small>${ch.category}</small>
</div>
`;

});

}

function playChannel(url){

const video=document.getElementById("videoPlayer");

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){

currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play();
});

}else{
video.src=url;
video.play();
}

document.getElementById("overlay").style.display="none";

}

function playDemo(){
playChannel(streams[0]);
}

/* ================= FILTER ================= */

function filterUsers(type){

if(type==="All") filteredUsers=users;
if(type==="Premium") filteredUsers=users.filter(u=>u.plan==="Premium");
if(type==="Blocked") filteredUsers=users.filter(u=>u.status==="Blocked");

renderUsers();

}

/* ================= STATS ================= */

function updateStats(){

document.getElementById("totalUsers").innerText=users.length;
document.getElementById("premiumUsers").innerText=users.filter(u=>u.plan==="Premium").length;
document.getElementById("blockedUsers").innerText=users.filter(u=>u.status==="Blocked").length;

}

/* ================= INIT ================= */

generateUsers();
generateChannels();

</script>

</body>
</html>
