<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BTECH-TV ULTRA USER MANAGER PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:22px;
}

.top-links{
display:flex;
gap:10px;
}

.top-links button{
padding:10px 15px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
}

.top-links button.active,
.top-links button:hover{
background:var(--accent);
color:black;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* GRID */
.dashboard-grid{
flex:1;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:15px;
padding:15px;
overflow-y:auto;
}

/* CARD */
.card{
background:var(--card);
padding:15px;
border-radius:15px;
}

.card h3{
color:var(--accent);
margin-bottom:10px;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat-box{
background:#0f1628;
padding:12px;
border-radius:10px;
text-align:center;
}

.stat-box h4{
font-size:12px;
color:var(--muted);
}

.stat-box p{
font-size:20px;
color:var(--accent);
}

/* USER LIST */
.user-list{
max-height:300px;
overflow-y:auto;
}

.user{
display:flex;
justify-content:space-between;
padding:10px;
margin-bottom:8px;
background:#0f1628;
border-radius:10px;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:11px;
}

.premium{background:#2563eb;}
.free{background:#f59e0b;}
.blocked{background:#dc2626;}
.active{background:#16a34a;}

/* CHANNEL LIST */
.channel-list{
max-height:300px;
overflow-y:auto;
}

.channel{
padding:10px;
margin-bottom:8px;
background:#0f1628;
border-radius:10px;
cursor:pointer;
}

/* PLAYER */
.player{
height:220px;
background:black;
border-radius:12px;
overflow:hidden;
position:relative;
}

.player video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.7);
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
background:#0f1628;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:var(--accent);
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<div class="topbar">
<h2>🚀 BTECH-TV USER MANAGER PRO</h2>

<div class="top-links">
<button class="active">Users</button>
<button>Channels</button>
<button onclick="toggleTheme()">Theme</button>
</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="cat">👥 All Users</div>
<div class="cat">💎 Premium</div>
<div class="cat">🚫 Blocked</div>
<div class="cat">📺 IPTV Monitor</div>
<div class="cat">⚙ Settings</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="dashboard-grid">

<!-- USER STATS -->
<div class="card">
<h3>📊 USER STATS</h3>
<div class="stats">
<div class="stat-box"><h4>Total</h4><p id="totalUsers">0</p></div>
<div class="stat-box"><h4>Premium</h4><p id="premiumUsers">0</p></div>
<div class="stat-box"><h4>Blocked</h4><p id="blockedUsers">0</p></div>
<div class="stat-box"><h4>Online</h4><p id="onlineUsers">0</p></div>
</div>
</div>

<!-- CREATE USER -->
<div class="card">
<h3>➕ CREATE USER</h3>
<input id="name" placeholder="Username">
<input id="email" placeholder="Email">
<select id="plan">
<option>Free</option>
<option>Premium</option>
</select>
<button onclick="addUser()">Create User</button>
<button onclick="generateUsers()">Generate 100K Users</button>
</div>

<!-- IPTV PLAYER -->
<div class="card">
<h3>📺 IPTV MONITOR</h3>
<div class="player">
<video id="video" controls></video>
<div class="overlay" id="overlay">Loading Engine...</div>
</div>
<button onclick="playDemo()">Play Demo</button>
</div>

<!-- USERS -->
<div class="card">
<h3>👥 USERS</h3>
<input oninput="searchUsers(this.value)" placeholder="Search users...">
<div class="user-list" id="userList"></div>
</div>

<!-- CHANNELS -->
<div class="card">
<h3>📡 CHANNELS</h3>
<div class="channel-list" id="channelList"></div>
</div>

</div>

</div>
</div>

<script>

/* ENGINE */
let users=[];
let channels=[];
let currentHls=null;

/* STREAMS */
const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* USERS */
function generateUsers(){
users=[];
for(let i=1;i<=100000;i++){
users.push({
name:"USER_"+i,
email:"user"+i+"@mail.com",
plan:i%3===0?"Premium":"Free",
status:i%10===0?"Blocked":"Active"
});
}
renderUsers();
updateStats();
}

/* ADD USER */
function addUser(){
const n=document.getElementById("name").value;
const e=document.getElementById("email").value;
const p=document.getElementById("plan").value;
users.unshift({name:n,email:e,plan:p,status:"Active"});
renderUsers();
updateStats();
}

/* RENDER USERS */
function renderUsers(list=users){
document.getElementById("userList").innerHTML="";
list.slice(0,200).forEach(u=>{
let div=document.createElement("div");
div.className="user";
div.innerHTML=`
<div>
<b>${u.name}</b><br>
<small>${u.email}</small>
</div>
<div>
<span class="badge ${u.plan.toLowerCase()}">${u.plan}</span>
<span class="badge ${u.status==='Blocked'?'blocked':'active'}">${u.status}</span>
</div>`;
document.getElementById("userList").appendChild(div);
});
}

/* SEARCH */
function searchUsers(q){
renderUsers(users.filter(u=>u.name.toLowerCase().includes(q.toLowerCase())));
}

/* STATS */
function updateStats(){
document.getElementById("totalUsers").innerText=users.length;
document.getElementById("premiumUsers").innerText=users.filter(u=>u.plan==="Premium").length;
document.getElementById("blockedUsers").innerText=users.filter(u=>u.status==="Blocked").length;
document.getElementById("onlineUsers").innerText=Math.floor(Math.random()*50000);
}

/* CHANNELS */
function generateChannels(){
for(let i=1;i<=1000;i++){
channels.push({
name:"CHANNEL "+i,
url:streams[i%streams.length]
});
}
renderChannels();
}

function renderChannels(){
document.getElementById("channelList").innerHTML="";
channels.slice(0,200).forEach(c=>{
let div=document.createElement("div");
div.className="channel";
div.innerText=c.name;
div.onclick=()=>play(c.url);
document.getElementById("channelList").appendChild(div);
});
}

/* IPTV */
function play(url){
const v=document.getElementById("video");
if(currentHls) currentHls.destroy();

if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(v);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());
}else{
v.src=url;
v.play();
}
document.getElementById("overlay").style.display="none";
}

function playDemo(){
play(streams[0]);
}

/* THEME */
function toggleTheme(){
document.body.style.background=
document.body.style.background==="#0b0f1a"?"#fff":"#0b0f1a";
document.body.style.color=
document.body.style.color==="#fff"?"#000":"#fff";
}

/* INIT */
generateUsers();
generateChannels();

</script>

</body>
</html>
