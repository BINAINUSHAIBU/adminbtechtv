<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BTECH-TV ULTRA USER MANAGER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
--bg:#0b0f1a;
--panel:#11182a;
--card:#1b2438;
--hover:#2b3a5a;
--accent:#00bfff;
--text:#ffffff;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:65px;
background:var(--panel);
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.topbar h2{
color:var(--accent);
font-size:22px;
}

.top-links{
display:flex;
gap:10px;
}

.top-links button{
padding:10px 15px;
border:none;
border-radius:8px;
background:var(--card);
color:white;
cursor:pointer;
}

.top-links button:hover,
.top-links button.active{
background:var(--accent);
color:black;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f1628;
padding:15px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.05);
}

.cat{
padding:12px;
margin:8px 0;
background:var(--card);
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{
background:var(--hover);
transform:translateX(4px);
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.dashboard-grid{
flex:1;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:15px;
padding:15px;
overflow-y:auto;
}

/* CARD */
.card{
background:var(--card);
padding:20px;
border-radius:15px;
}

.card h3{
margin-bottom:15px;
color:var(--accent);
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat-box{
background:#0f1628;
padding:15px;
border-radius:10px;
text-align:center;
}

.stat-box h4{
font-size:12px;
color:#cbd5e1;
}

.stat-box p{
font-size:22px;
font-weight:bold;
color:var(--accent);
}

/* FORM */
input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:14px;
}

input,select{
background:#0f1628;
color:white;
}

button{
background:var(--accent);
color:black;
font-weight:bold;
cursor:pointer;
}

/* USER LIST */
.user-list,.channel-list{
max-height:420px;
overflow-y:auto;
}

.user-item,.channel-item{
background:#0f1628;
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.user-item:hover,.channel-item:hover{
background:var(--hover);
}

/* PLAYER */
.player{
height:260px;
background:black;
position:relative;
border-radius:15px;
overflow:hidden;
}

.player video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.7);
font-size:18px;
}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

<h2>🚀 BTECH-TV USER MANAGER</h2>

<div class="top-links">
<button class="active" onclick="filterUsers('All',this)">All Users</button>
<button onclick="filterUsers('Premium',this)">Premium</button>
<button onclick="filterUsers('Blocked',this)">Blocked</button>
</div>

</div>

<!-- CONTAINER -->
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3 style="color:var(--accent)">⚙ Navigation</h3>

<div class="cat">👥 Users</div>
<div class="cat">📺 Channels</div>
<div class="cat">📊 Analytics</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="dashboard-grid">

<!-- STATS -->
<div class="card">
<h3>📊 USER STATS</h3>

<div class="stats">
<div class="stat-box">
<h4>Total</h4>
<p id="totalUsers">0</p>
</div>

<div class="stat-box">
<h4>Premium</h4>
<p id="premiumUsers">0</p>
</div>

<div class="stat-box">
<h4>Blocked</h4>
<p id="blockedUsers">0</p>
</div>

<div class="stat-box">
<h4>Active Channels</h4>
<p id="activeChannels">0</p>
</div>

</div>
</div>

<!-- CREATE USER -->
<div class="card">
<h3>➕ CREATE USER</h3>

<input id="username" placeholder="Username">
<input id="email" placeholder="Email">

<select id="plan">
<option>Free</option>
<option>Premium</option>
</select>

<button onclick="addUser()">Create User</button>
<button onclick="generateUsers()">Generate 100K Users</button>
</div>

<!-- PLAYER -->
<div class="card">
<h3>📺 LIVE PLAYER</h3>

<div class="player">
<video id="videoPlayer" controls autoplay></video>
<div class="overlay" id="overlay">Loading...</div>
</div>

<button onclick="playDemo()">Play Demo</button>
</div>

<!-- USERS -->
<div class="card">
<h3>👥 USERS</h3>
<div class="user-list" id="userList"></div>
</div>

<!-- CHANNELS -->
<div class="card">
<h3>📡 ACTIVE CHANNELS</h3>
<div class="channel-list" id="channelList"></div>
</div>

</div>

</div>

<script>

/* ================= GLOBAL ================= */

let users=[];
let filteredUsers=[];
let channels=[];
let activeAPIChannels=[];
let currentHls=null;

/* API */
const ACTIVE_CHANNEL_API =
"https://jsonplaceholder.typicode.com/posts";

/* STREAMS */
const streams=[
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
"https://test-streams.mux.dev/test_001/stream.m3u8"
];

/* ================= USERS ================= */

function generateUsers(){

users=[];

for(let i=1;i<=100000;i++){

users.push({
name:"USER_"+i,
email:"user"+i+"@mail.com",
plan:i%3===0?"Premium":"Free",
status:i%10===0?"Blocked":"Active"
});

}

filteredUsers=[...users];
renderUsers();
updateStats();

}

function renderUsers(){

const box=document.getElementById("userList");
box.innerHTML="";

filteredUsers.slice(0,200).forEach(u=>{

box.innerHTML+=`
<div class="user-item">
<strong>${u.name}</strong><br>
<small>${u.email}</small><br>
${u.plan} | ${u.status}
</div>
`;

});

}

function addUser(){

users.unshift({
name:document.getElementById("username").value,
email:document.getElementById("email").value,
plan:document.getElementById("plan").value,
status:"Active"
});

filteredUsers=[...users];
renderUsers();
updateStats();

}

/* ================= CHANNELS ================= */

function generateChannels(){

for(let i=1;i<=300;i++){

channels.push({
name:"LIVE "+i,
category:"API",
url:streams[i%streams.length]
});

}

renderChannels();

}

function renderChannels(){

const box=document.getElementById("channelList");
box.innerHTML="";

activeAPIChannels.forEach(ch=>{

box.innerHTML+=`
<div class="channel-item" onclick="playChannel('${ch.url}')">
🔴 ${ch.name}<br>
<small>${ch.category}</small>
</div>
`;

});

}

/* ================= ACTIVE API ================= */

async function loadActiveChannelsAPI(){

try{

const res=await fetch(ACTIVE_CHANNEL_API);
const data=await res.json();

activeAPIChannels=data.slice(0,30).map((item,i)=>({

name:"API LIVE "+item.id,
category:"Active Stream",
url:streams[i%streams.length],
source:"api"

}));

document.getElementById("activeChannels").innerText =
activeAPIChannels.length;

renderChannels();

}catch(err){

console.log("API Failed");

}

}

/* ================= PLAYER ================= */

function playChannel(url){

const video=document.getElementById("videoPlayer");

if(currentHls) currentHls.destroy();

if(Hls.isSupported()){

currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);

currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play();
});

}else{
video.src=url;
video.play();
}

document.getElementById("overlay").style.display="none";

}

function playDemo(){
playChannel(streams[0]);
}

/* ================= FILTER ================= */

function filterUsers(type){

if(type==="All") filteredUsers=users;
if(type==="Premium") filteredUsers=users.filter(u=>u.plan==="Premium");
if(type==="Blocked") filteredUsers=users.filter(u=>u.status==="Blocked");

renderUsers();

}

/* ================= STATS ================= */

function updateStats(){

document.getElementById("totalUsers").innerText=users.length;
document.getElementById("premiumUsers").innerText=users.filter(u=>u.plan==="Premium").length;
document.getElementById("blockedUsers").innerText=users.filter(u=>u.status==="Blocked").length;

}

/* ================= INIT ================= */

generateUsers();
generateChannels();
loadActiveChannelsAPI();

</script>

</body>
</html>
